{q:`Le wifi public non sécurisé présente surtout un risque :`,opts:[`De consommation de batterie`,`D'interception des données transmises`,`De ralentissement du processeur`,`Aucun risque particulier`],c:1,ex:`Sur un réseau ouvert, les échanges non chiffrés peuvent être interceptés. Préférer un VPN ou le réseau mobile pour les opérations sensibles.`},
{q:`Choisir entre un tableur et une base de données selon le besoin relève de quel domaine ?`,opts:[`Résolution de problèmes`,`Sécurité`,`Communication`,`Information`],c:0,ex:`Identifier le besoin et choisir l'outil adapté = domaine 5.`},
{q:`Quel est l'intérêt principal d'un VPN sur un réseau wifi public ?`,opts:[`Accélérer la connexion`,`Chiffrer le trafic pour empêcher son interception`,`Bloquer les publicités`,`Économiser la batterie`],c:1,ex:`Le VPN crée un tunnel chiffré : les échanges ne peuvent plus être lus sur le réseau ouvert.`},
{q:`Que signifie la clause « SA » (Share Alike) d'une licence Creative Commons ?`,opts:[`Usage commercial interdit`,`Les œuvres dérivées doivent être partagées sous la même licence`,`Aucune modification autorisée`,`Attribution facultative`],c:1,ex:`SA = partage dans les mêmes conditions. NC = pas d'usage commercial, ND = pas de modification.`},
{q:`Qu'est-ce que le « spear phishing » ?`,opts:[`Un hameçonnage de masse par SMS`,`Un hameçonnage ciblé, personnalisé grâce à des informations sur la victime`,`Un virus qui chiffre les fichiers`,`Une attaque par déni de service`],c:1,ex:`Version ciblée du phishing : le message est crédibilisé par des détails sur la victime ou son organisation.`},
{q:`Quel droit du RGPD permet de récupérer ses données pour les transférer à un autre service ?`,opts:[`Le droit d'accès`,`Le droit à la portabilité`,`Le droit d'opposition`,`Le droit à l'oubli`],c:1,ex:`La portabilité : recevoir ses données dans un format structuré et les transmettre à un autre responsable de traitement.`},
{q:`Pourquoi installer rapidement les mises à jour logicielles ?`,opts:[`Elles améliorent surtout l'apparence`,`Elles corrigent des failles de sécurité exploitables`,`Elles libèrent de l'espace disque`,`Elles sont obligatoires légalement`],c:1,ex:`Les correctifs de sécurité ferment des vulnérabilités connues, souvent exploitées peu après leur divulgation.`},
{q:`À quoi servent principalement les cookies tiers ?`,opts:[`À mémoriser la langue du site`,`Au suivi publicitaire entre plusieurs sites`,`À sécuriser la connexion`,`À compresser les pages`],c:1,ex:`Déposés par un domaine différent du site visité, ils permettent le traçage inter-sites à des fins publicitaires.`},
{q:`L'authentification à deux facteurs combine deux éléments de nature différente. Lesquels par exemple ?`,opts:[`Deux mots de passe différents`,`Un mot de passe et un code reçu sur un appareil que l'on possède`,`Deux questions secrètes`,`Un mot de passe et sa confirmation`],c:1,ex:`Ce que l'on sait + ce que l'on possède (ou ce que l'on est). Deux éléments de même nature ne font pas deux facteurs.`},
{q:`Au sens du RGPD, une donnée pseudonymisée est :`,opts:[`Une donnée anonyme, hors du champ du RGPD`,`Toujours une donnée personnelle, car la réidentification reste possible`,`Une donnée publique`,`Une donnée définitivement chiffrée`],c:1,ex:`Seule l'anonymisation irréversible fait sortir du champ du RGPD ; la pseudonymisation, réversible, n'y suffit pas.`},

/* --- Cadre DigComp --- */
{q:`Combien de compétences le cadre DigComp 2.2 recense-t-il au total ?`,opts:[`21`,`5`,`8`,`12`],c:0,ex:`21 compétences réparties en 5 domaines. Les 8 sont les niveaux de maîtrise, à ne pas confondre.`},
{q:`Combien de niveaux de maîtrise DigComp définit-il ?`,opts:[`8, du fondamental au très spécialisé`,`3, débutant, intermédiaire, avancé`,`5, un par domaine`,`21, un par compétence`],c:0,ex:`Huit niveaux regroupés en quatre paliers : fondamental, intermédiaire, avancé, très spécialisé.`},
{q:`Quel domaine DigComp couvre la création de contenu numérique et le droit d'auteur ?`,opts:[`Domaine 3`,`Domaine 1`,`Domaine 4`,`Domaine 5`],c:0,ex:`Domaine 3 : développement de contenus, intégration, droits d'auteur et licences, programmation.`},
{q:`La version DigComp 2.2 publiée en 2022 a notamment ajouté des exemples portant sur :`,opts:[`L'intelligence artificielle et les données`,`La programmation en assembleur`,`La maintenance de serveurs`,`La comptabilité numérique`],c:0,ex:`DigComp 2.2 intègre des exemples liés à l'IA, aux données et au télétravail, sans changer la structure en 5 domaines.`},
{q:`Reconnaître qu'un système de recommandation oriente ce que l'on voit en ligne relève de :`,opts:[`L'information et la littératie des données`,`La création de contenu`,`La sécurité`,`La résolution de problèmes`],c:0,ex:`Comprendre comment l'information est filtrée et hiérarchisée appartient au domaine 1.`},

/* --- Tableur --- */
{q:`Dans un tableur, que renvoie la fonction RECHERCHEV (VLOOKUP) ?`,opts:[`Une valeur d'une colonne donnée, sur la ligne où la clé est trouvée`,`La somme d'une plage`,`Le nombre de cellules non vides`,`La position d'une valeur dans une ligne`],c:0,ex:`Elle cherche une clé dans la première colonne d'une plage et renvoie la valeur d'une colonne indiquée sur la même ligne.`},
{q:`Dans un tableur, la référence A$1 recopiée vers le bas :`,opts:[`Garde la ligne 1 mais laisse la colonne s'adapter`,`Se décale entièrement`,`Reste totalement figée`,`Provoque une erreur`],c:0,ex:`Le dollar fige ce qui le suit : ici la ligne. C'est une référence mixte.`},
{q:`À quoi sert principalement un tableau croisé dynamique ?`,opts:[`À agréger et ventiler rapidement un grand tableau selon plusieurs critères`,`À vérifier l'orthographe`,`À protéger un classeur par mot de passe`,`À convertir un fichier en PDF`],c:0,ex:`Il regroupe les données par catégories et calcule des agrégats sans modifier la source.`},
{q:`Une cellule affiche #DIV/0!. Que s'est-il passé ?`,opts:[`Une division par une cellule vide ou nulle`,`La colonne est trop étroite`,`Le format de la cellule est incorrect`,`Le fichier est corrompu`],c:0,ex:`La colonne trop étroite affiche des dièses en série, ce qui est un symptôme différent.`},
{q:`Quelle fonction compte les cellules d'une plage remplissant une condition ?`,opts:[`NB.SI (COUNTIF)`,`SOMME (SUM)`,`NBVAL (COUNTA)`,`MOYENNE (AVERAGE)`],c:0,ex:`NBVAL compte toutes les cellules non vides sans condition ; NB.SI applique un critère.`},
{q:`Trier un tableau en ne sélectionnant qu'une seule colonne risque :`,opts:[`De désolidariser les colonnes et de fausser toutes les lignes`,`De supprimer la colonne`,`De verrouiller le fichier`,`De convertir les nombres en texte`],c:0,ex:`Erreur classique et souvent irrattrapable : il faut étendre la sélection à toute la plage.`},
{q:`Le format CSV se distingue du format XLSX parce qu'il :`,opts:[`Ne conserve ni formules, ni mise en forme, ni feuilles multiples`,`Compresse mieux les données`,`Gère les macros`,`Est propriétaire`],c:0,ex:`Le CSV est du texte brut avec un séparateur : il transporte des valeurs, rien d'autre.`},
{q:`Pour empêcher qu'une plage de référence se décale quand on recopie une formule, on utilise :`,opts:[`Une référence absolue avec des dollars`,`Un commentaire de cellule`,`Un format conditionnel`,`Un filtre automatique`],c:0,ex:`$A$1:$B$20 reste identique quelle que soit la cellule de destination.`},
{q:`Une mise en forme conditionnelle sert à :`,opts:[`Changer l'apparence des cellules selon la valeur qu'elles contiennent`,`Empêcher la saisie de données`,`Créer un graphique`,`Verrouiller une feuille`],c:0,ex:`Elle rend visible un seuil ou une anomalie sans modifier la donnée.`},
{q:`Quel type de graphique convient le mieux pour montrer l'évolution d'une valeur dans le temps ?`,opts:[`Une courbe`,`Un camembert`,`Un nuage de points sans axe temporel`,`Un histogramme empilé à 100 %`],c:0,ex:`Le camembert montre une répartition à un instant donné, pas une évolution.`},

/* --- Traitement de texte et documents --- */
{q:`Pourquoi utiliser des styles de titre plutôt que de mettre le texte en gras à la main ?`,opts:[`Ils permettent la table des matières automatique, la navigation et l'accessibilité`,`Ils réduisent la taille du fichier`,`Ils empêchent la modification du document`,`Ils sont obligatoires en droit de l'Union`],c:0,ex:`Les styles portent la structure logique du document, exploitée par les sommaires et les lecteurs d'écran.`},
{q:`Le suivi des modifications dans un traitement de texte permet surtout :`,opts:[`De voir qui a modifié quoi et d'accepter ou refuser chaque changement`,`De chiffrer le document`,`De compresser les images`,`De verrouiller la mise en page`],c:0,ex:`C'est l'outil de base du travail rédactionnel à plusieurs.`},
{q:`Le format PDF/A se distingue d'un PDF ordinaire parce qu'il est conçu pour :`,opts:[`L'archivage à long terme, avec polices et ressources embarquées`,`L'impression haute définition uniquement`,`Les formulaires interactifs`,`La lecture sur mobile`],c:0,ex:`PDF/A interdit les dépendances externes pour que le document reste lisible dans plusieurs décennies.`},
{q:`Le publipostage (mail merge) sert à :`,opts:[`Générer un document personnalisé par destinataire à partir d'une source de données`,`Envoyer un même email à une liste cachée`,`Fusionner deux fichiers PDF`,`Trier un carnet d'adresses`],c:0,ex:`Un modèle plus un tableau de données donne autant de documents que de lignes.`},
{q:`Que sont les métadonnées d'un fichier bureautique ?`,opts:[`Des informations sur le fichier, comme l'auteur ou l'historique, souvent invisibles à l'écran`,`Le texte du document`,`Les images intégrées`,`Le format d'enregistrement`],c:0,ex:`Elles peuvent divulguer un nom d'auteur ou un commentaire oublié : il faut les nettoyer avant diffusion externe.`},
{q:`Le format ODF (OpenDocument) présente l'avantage d'être :`,opts:[`Un standard ouvert, non lié à un éditeur unique`,`Plus compact que tous les autres formats`,`Réservé aux administrations`,`Illisible sans licence`],c:0,ex:`Les institutions européennes privilégient les formats ouverts pour l'interopérabilité et la pérennité.`},

/* --- Recherche et web --- */
{q:`Dans un moteur de recherche, mettre une expression entre guillemets permet de :`,opts:[`Chercher l'expression exacte`,`Exclure l'expression`,`Chercher un synonyme`,`Limiter à un site`],c:0,ex:`L'opérateur site: limite à un domaine, le tiret exclut un terme.`},
{q:`Que fait l'opérateur site:europa.eu dans une recherche ?`,opts:[`Il restreint les résultats à ce domaine`,`Il exclut ce domaine`,`Il cherche le mot europa`,`Il trie par date`],c:0,ex:`Utile pour retrouver un document officiel sans passer par le moteur interne d'un site.`},
{q:`Le protocole HTTPS garantit avant tout :`,opts:[`Le chiffrement de la communication entre le navigateur et le serveur`,`Que le contenu du site est véridique`,`Que le site respecte le RGPD`,`Que le site n'utilise pas de cookies`],c:0,ex:`Le cadenas dit que la liaison est chiffrée, pas que le site est honnête. Un site de hameçonnage peut être en HTTPS.`},
{q:`Dans l'adresse https://ec.europa.eu/info/index_fr.htm, quel élément est le nom de domaine ?`,opts:[`ec.europa.eu`,`https`,`/info/`,`index_fr.htm`],c:0,ex:`Vérifier le domaine, et surtout sa fin, est le premier réflexe contre le hameçonnage.`},
{q:`À quoi sert le DNS ?`,opts:[`À traduire un nom de domaine en adresse IP`,`À chiffrer le trafic`,`À bloquer les publicités`,`À stocker les cookies`],c:0,ex:`C'est l'annuaire de l'internet : sans lui, il faudrait retenir les adresses numériques.`},
{q:`Une bulle de filtre désigne :`,opts:[`L'enfermement progressif dans des contenus conformes à ses opinions, par personnalisation algorithmique`,`Un filtre antispam`,`Un pare-feu applicatif`,`Un cache de navigateur`],c:0,ex:`Notion centrale du domaine 1 : la personnalisation réduit l'exposition aux points de vue divergents.`},
{q:`Face à une information virale non sourcée, la première démarche est :`,opts:[`De remonter à la source primaire et de la recouper`,`De la partager en demandant confirmation`,`De vérifier le nombre de partages`,`De consulter les commentaires`],c:0,ex:`Partager pour vérifier amplifie l'information avant de l'avoir validée.`},
{q:`La recherche d'image inversée sert principalement à :`,opts:[`Retrouver l'origine et les usages antérieurs d'une image`,`Améliorer la résolution d'une image`,`Convertir une image en texte`,`Supprimer les métadonnées`],c:0,ex:`Outil de base pour détecter une photo ancienne recyclée dans un contexte trompeur.`},

/* --- Sécurité --- */
{q:`La règle de sauvegarde dite 3-2-1 recommande :`,opts:[`3 copies, sur 2 supports différents, dont 1 hors site`,`3 mots de passe, 2 comptes, 1 sauvegarde`,`3 sauvegardes par jour pendant 2 semaines`,`3 utilisateurs, 2 serveurs, 1 pare-feu`],c:0,ex:`La copie hors site protège contre l'incendie, le vol et le rançongiciel qui chiffre le réseau local.`},
{q:`Quel est l'intérêt principal d'un gestionnaire de mots de passe ?`,opts:[`Permettre un mot de passe unique et long par service, sans les mémoriser`,`Rendre les mots de passe plus courts`,`Supprimer le besoin d'authentification`,`Partager ses accès plus facilement`],c:0,ex:`Il casse la réutilisation du même mot de passe, qui transforme une fuite en compromission généralisée.`},
{q:`Qu'est-ce qu'une vulnérabilité de type « zero-day » ?`,opts:[`Une faille exploitée avant qu'un correctif ne soit disponible`,`Une faille vieille de moins d'un an`,`Un virus qui se déclenche à minuit`,`Une panne matérielle`],c:0,ex:`L'éditeur a zéro jour d'avance : d'où l'importance des mesures qui ne dépendent pas d'un correctif.`},
{q:`L'ingénierie sociale consiste à :`,opts:[`Manipuler une personne pour obtenir un accès ou une information`,`Analyser les réseaux sociaux`,`Concevoir une interface utilisateur`,`Cartographier un réseau informatique`],c:0,ex:`Elle vise l'humain, pas la machine : aucune mise à jour ne corrige cette faille.`},
{q:`Brancher une clé USB trouvée sur un parking est risqué parce que :`,opts:[`Elle peut contenir un logiciel malveillant ou se faire passer pour un clavier`,`Elle peut être trop lente`,`Elle risque d'être formatée`,`Elle consomme de la batterie`],c:0,ex:`Certaines clés piégées émulent un clavier et tapent des commandes dès le branchement.`},
{q:`Le chiffrement du disque d'un ordinateur portable protège surtout contre :`,opts:[`La lecture des données en cas de vol de la machine`,`Les virus`,`Le hameçonnage`,`La panne du disque`],c:0,ex:`Il protège les données au repos ; il ne remplace ni l'antivirus ni la sauvegarde.`},
{q:`Un pare-feu (firewall) a pour fonction de :`,opts:[`Filtrer les connexions entrantes et sortantes selon des règles`,`Détecter et supprimer les virus`,`Chiffrer les fichiers`,`Sauvegarder les données`],c:0,ex:`Il contrôle le trafic réseau ; c'est l'antivirus qui analyse les fichiers.`},
{q:`Que doit-on faire en premier si l'on soupçonne avoir cliqué sur un lien de hameçonnage au travail ?`,opts:[`Signaler immédiatement l'incident au service informatique`,`Supprimer l'email et ne rien dire`,`Changer seulement son fond d'écran`,`Attendre de voir si un problème survient`],c:0,ex:`Le délai de signalement conditionne la capacité à limiter la propagation. Le silence est le pire choix.`},
{q:`Un rançongiciel se distingue d'un logiciel espion parce qu'il :`,opts:[`Rend les données inaccessibles et exige un paiement`,`Copie discrètement les frappes clavier`,`Affiche des publicités`,`Ralentit le processeur`],c:0,ex:`Le premier bloque, le second observe sans se faire remarquer.`},
{q:`Pourquoi ne faut-il pas réutiliser le même mot de passe sur plusieurs sites ?`,opts:[`Une seule fuite permet alors d'accéder à tous les comptes`,`Cela ralentit la connexion`,`Les sites l'interdisent`,`Cela sature le gestionnaire de mots de passe`],c:0,ex:`Les listes d'identifiants fuités sont rejouées automatiquement sur d'autres services.`},
{q:`Le sigle ENISA désigne :`,opts:[`L'Agence de l'Union européenne pour la cybersécurité`,`L'autorité européenne de protection des données`,`Le régulateur européen des télécoms`,`Un standard de chiffrement`],c:0,ex:`Basée en Grèce, elle appuie les États membres et la Commission en matière de cybersécurité.`},
{q:`Un certificat de site expiré signifie que :`,opts:[`L'identité du serveur n'est plus vérifiée par une autorité, la prudence s'impose`,`Le site a été piraté`,`Le site est illégal`,`Le contenu est erroné`],c:0,ex:`Souvent une négligence administrative, mais impossible à distinguer d'une interception : on ne saisit rien de sensible.`},

/* --- RGPD et protection des données --- */
{q:`Le RGPD s'applique depuis quelle date ?`,opts:[`Le 25 mai 2018`,`Le 1er janvier 2016`,`Le 25 mai 2016`,`Le 1er janvier 2020`],c:0,ex:`Adopté en 2016 (règlement 2016/679), il est devenu applicable après deux ans de transition, le 25 mai 2018.`},
{q:`En cas de violation de données personnelles, sous quel délai le responsable de traitement doit-il notifier l'autorité de contrôle ?`,opts:[`72 heures`,`24 heures`,`7 jours`,`1 mois`],c:0,ex:`72 heures après en avoir pris connaissance, sauf si la violation est peu susceptible d'engendrer un risque.`},
{q:`Combien de bases légales le RGPD prévoit-il pour un traitement de données ?`,opts:[`Six`,`Deux`,`Quatre`,`Dix`],c:0,ex:`Consentement, contrat, obligation légale, intérêts vitaux, mission d'intérêt public, intérêt légitime.`},
{q:`Quelle est la différence entre responsable de traitement et sous-traitant au sens du RGPD ?`,opts:[`Le premier détermine les finalités et les moyens, le second agit pour son compte`,`Le premier est public, le second privé`,`Le premier collecte, le second héberge`,`Il n'y a aucune différence juridique`],c:0,ex:`La qualification dépend du pouvoir de décision sur le traitement, pas de la nature de l'organisme.`},
{q:`Une analyse d'impact relative à la protection des données (AIPD) est obligatoire :`,opts:[`Quand le traitement est susceptible d'engendrer un risque élevé pour les droits et libertés`,`Pour tout traitement, sans exception`,`Uniquement dans le secteur public`,`Uniquement en cas de transfert hors UE`],c:0,ex:`Article 35 : le critère est le risque élevé, apprécié notamment pour la surveillance systématique ou les données sensibles.`},
{q:`Le principe de minimisation des données impose :`,opts:[`De ne collecter que les données adéquates et nécessaires à la finalité`,`De supprimer les données tous les ans`,`De chiffrer toutes les données`,`De limiter le nombre d'utilisateurs`],c:0,ex:`Collecter au cas où est contraire au RGPD : la finalité détermine le périmètre.`},
{q:`Quel organe supervise le traitement des données personnelles par les institutions de l'Union elles-mêmes ?`,opts:[`Le Contrôleur européen de la protection des données`,`Le Comité européen de la protection des données`,`La Cour des comptes européenne`,`Le Médiateur européen`],c:0,ex:`Le CEPD contrôle les institutions ; le Comité (CEPD au sens de l'article 68) réunit les autorités nationales.`},
{q:`Le montant maximal des amendes prévues par le RGPD peut atteindre :`,opts:[`20 millions d'euros ou 4 % du chiffre d'affaires annuel mondial, le montant le plus élevé étant retenu`,`1 million d'euros`,`10 % du chiffre d'affaires national`,`Un montant fixé par chaque État membre`],c:0,ex:`Deux plafonds existent : 10 M€ ou 2 % pour certains manquements, 20 M€ ou 4 % pour les plus graves.`},
{q:`Le consentement au sens du RGPD doit notamment être :`,opts:[`Libre, spécifique, éclairé et univoque`,`Écrit et signé`,`Renouvelé chaque mois`,`Donné devant témoin`],c:0,ex:`Une case pré-cochée ou un consentement groupé pour des finalités multiples ne remplit pas ces conditions.`},
{q:`Le droit à l'effacement au sens du RGPD :`,opts:[`N'est pas absolu et cède notamment devant une obligation légale de conservation`,`S'applique en toutes circonstances`,`Ne concerne que les moteurs de recherche`,`Suppose l'accord du sous-traitant`],c:0,ex:`Article 17 : plusieurs exceptions existent, dont l'obligation légale et la liberté d'expression.`},
{q:`La désignation d'un délégué à la protection des données est obligatoire notamment :`,opts:[`Pour les autorités et organismes publics`,`Pour toute entreprise de plus de dix salariés`,`Pour tout site internet`,`Uniquement sur demande de l'autorité de contrôle`],c:0,ex:`Également en cas de suivi systématique à grande échelle ou de traitement à grande échelle de données sensibles.`},

/* --- Acquis numérique de l'Union --- */
{q:`Le règlement sur les services numériques (DSA) qualifie de très grande plateforme un service atteignant :`,opts:[`45 millions d'utilisateurs actifs mensuels dans l'Union`,`10 millions d'utilisateurs`,`100 millions d'utilisateurs`,`1 million d'utilisateurs`],c:0,ex:`45 millions, soit environ 10 % de la population de l'Union. Ce seuil déclenche des obligations renforcées.`},
{q:`Le règlement sur les marchés numériques (DMA) vise :`,opts:[`Les grandes plateformes qualifiées de contrôleurs d'accès`,`Tous les commerçants en ligne`,`Les seuls réseaux sociaux`,`Les fournisseurs d'accès à internet`],c:0,ex:`Il impose des obligations ex ante aux gatekeepers pour rétablir la contestabilité des marchés numériques.`},
{q:`Parmi les seuils quantitatifs de désignation d'un contrôleur d'accès au titre du DMA figure :`,opts:[`45 millions d'utilisateurs finaux actifs par mois et 10 000 entreprises utilisatrices par an dans l'Union`,`1 million d'utilisateurs et 100 entreprises`,`Un chiffre d'affaires mondial supérieur à 500 millions d'euros`,`Une présence dans au moins cinq États membres`],c:0,ex:`S'y ajoute un critère financier : 7,5 milliards d'euros de chiffre d'affaires dans l'EEE ou 75 milliards de capitalisation.`},
{q:`Le règlement sur l'intelligence artificielle repose sur :`,opts:[`Une approche par les risques, du risque inacceptable au risque minimal`,`Une interdiction générale de l'IA générative`,`Une autorisation préalable pour tout système d'IA`,`Un régime purement volontaire`],c:0,ex:`Quatre niveaux : inacceptable (interdit), élevé (encadré), limité (transparence), minimal (libre).`},
{q:`Le règlement sur l'intelligence artificielle est entré en vigueur :`,opts:[`Le 1er août 2024, avec une application échelonnée`,`Le 1er janvier 2023, d'un seul bloc`,`Le 25 mai 2018`,`Il n'est pas encore adopté`],c:0,ex:`Interdictions applicables depuis février 2025, obligations sur les modèles à usage général depuis août 2025, gros du texte en août 2026.`},
{q:`Parmi les pratiques interdites par le règlement sur l'intelligence artificielle figure :`,opts:[`La notation sociale des personnes par les autorités publiques`,`Tout usage de la reconnaissance vocale`,`Les systèmes de recommandation`,`Les assistants de rédaction`],c:0,ex:`Sont aussi visées la manipulation exploitant des vulnérabilités et, sous réserve d'exceptions, l'identification biométrique à distance en temps réel à des fins répressives.`},
{q:`La directive NIS2 porte sur :`,opts:[`Un niveau élevé commun de cybersécurité pour les entités essentielles et importantes`,`La protection des données personnelles`,`Le commerce électronique`,`Les droits d'auteur`],c:0,ex:`Elle élargit fortement le champ sectoriel par rapport à NIS1 et renforce les obligations de gestion du risque et de notification.`},
{q:`Le portefeuille européen d'identité numérique est issu de la révision de quel cadre ?`,opts:[`eIDAS`,`Le RGPD`,`Le DSA`,`Le code des communications électroniques`],c:0,ex:`Le règlement eIDAS 2 prévoit que chaque État membre propose un portefeuille d'identité numérique à ses citoyens.`},
{q:`Le règlement sur les données (Data Act) porte principalement sur :`,opts:[`L'accès et le partage des données générées par les objets connectés`,`La protection des données personnelles`,`Le contenu illicite en ligne`,`Le droit d'auteur`],c:0,ex:`Il facilite aussi le changement de fournisseur de services de traitement de données, donc la portabilité dans le nuage.`},
{q:`La directive sur l'accessibilité des sites internet du secteur public impose :`,opts:[`Des sites et applications perceptibles, utilisables, compréhensibles et robustes`,`Un site en 24 langues`,`Un hébergement dans l'Union`,`Une version imprimable de chaque page`],c:0,ex:`Ces quatre principes sont ceux des règles WCAG, référence technique de l'accessibilité numérique.`},
{q:`Parmi les objectifs de la décennie numérique à l'horizon 2030 figure :`,opts:[`80 % des adultes dotés de compétences numériques de base`,`100 % des adultes titulaires d'un diplôme informatique`,`La fin des services publics en présentiel`,`Un fournisseur de cloud européen unique`],c:0,ex:`S'y ajoutent 20 millions de spécialistes des TIC, la couverture gigabit de tous les foyers et l'usage du nuage, des données massives ou de l'IA par 75 % des entreprises.`},
{q:`Le règlement sur la cyberrésilience impose des exigences de sécurité :`,opts:[`Aux produits comportant des éléments numériques, tout au long de leur cycle de vie`,`Aux seuls sites gouvernementaux`,`Aux réseaux sociaux`,`Aux fournisseurs d'accès uniquement`],c:0,ex:`Il vise le matériel et le logiciel mis sur le marché, avec des obligations de correctifs pendant une durée déterminée.`},
{q:`Que garantit une licence de données ouvertes appliquée à une base publique ?`,opts:[`Sa réutilisation libre, y compris commerciale, sous conditions d'attribution`,`Sa gratuité pour les seuls chercheurs`,`Son caractère anonyme`,`Son exactitude`],c:0,ex:`L'ouverture porte sur les conditions juridiques de réutilisation, pas sur la qualité de la donnée.`},

/* --- Collaboration et communication --- */
{q:`Envoyer un message à une longue liste externe en mettant les adresses en copie visible :`,opts:[`Divulgue les adresses de tous les destinataires entre eux`,`Accélère l'envoi`,`Améliore la délivrabilité`,`Est requis par le RGPD`],c:0,ex:`Il faut utiliser la copie cachée : c'est une violation de données courante et facilement évitable.`},
{q:`Dans un espace de travail partagé, accorder à un collègue un droit de commentaire plutôt que d'édition permet :`,opts:[`Qu'il puisse suggérer sans modifier le document lui-même`,`Qu'il puisse seulement lire`,`Qu'il devienne propriétaire du fichier`,`De verrouiller le document`],c:0,ex:`La gradation lecture, commentaire, édition, propriété est le principe du moindre privilège appliqué aux documents.`},
{q:`Le principe du moindre privilège consiste à :`,opts:[`N'accorder que les droits strictement nécessaires à la tâche`,`Donner tous les droits aux cadres`,`Restreindre l'accès aux seuls informaticiens`,`Supprimer les comptes inactifs`],c:0,ex:`Il limite l'ampleur des dégâts quand un compte est compromis.`},
{q:`Travailler simultanément à plusieurs sur un même document en ligne évite surtout :`,opts:[`La prolifération de versions divergentes envoyées par pièce jointe`,`Les fautes d'orthographe`,`Les pannes réseau`,`Le besoin de sauvegarde`],c:0,ex:`Une source unique de vérité remplace le ballet des versions finale, finale2, finale_corrigee.`},
{q:`Un calendrier partagé indiquant la disponibilité sans le détail des rendez-vous illustre :`,opts:[`Un compromis entre coopération et protection de la vie privée`,`Une faille de sécurité`,`Une obligation du RGPD`,`Une limite technique`],c:0,ex:`Le partage gradué de l'information est une compétence du domaine communication et collaboration.`},
{q:`La netiquette recommande, dans un courriel professionnel :`,opts:[`Un objet explicite et un message adapté au destinataire`,`Des majuscules pour insister`,`Une réponse à tous systématique`,`Des pièces jointes volumineuses plutôt qu'un lien`],c:0,ex:`Les majuscules équivalent à crier ; le lien vers un espace partagé évite de saturer les boîtes.`},
{q:`Une signature électronique qualifiée au sens du droit de l'Union :`,opts:[`A un effet juridique équivalent à celui d'une signature manuscrite`,`N'a aucune valeur probante`,`Vaut uniquement entre entreprises`,`Est réservée aux administrations`],c:0,ex:`C'est le niveau le plus élevé prévu par eIDAS, au-dessus de la signature simple et de la signature avancée.`},

/* --- Contenu, droit d'auteur, accessibilité --- */
{q:`Une licence Creative Commons « ND » (No Derivatives) interdit :`,opts:[`La diffusion d'une version modifiée de l'œuvre`,`Toute reproduction`,`L'usage commercial`,`La citation`],c:0,ex:`ND autorise le partage à l'identique de l'œuvre entière, mais pas la publication d'adaptations.`},
{q:`Le domaine public en droit d'auteur désigne :`,opts:[`Les œuvres dont les droits patrimoniaux ont expiré`,`Tout contenu accessible gratuitement en ligne`,`Les contenus publiés par une administration`,`Les images sans filigrane`],c:0,ex:`Accessible ne veut pas dire libre de droits : la gratuité d'accès ne dit rien du statut juridique.`},
{q:`Ajouter un texte alternatif à une image sert d'abord à :`,opts:[`Permettre aux lecteurs d'écran de décrire l'image aux personnes déficientes visuelles`,`Améliorer la qualité de l'image`,`Réduire le poids du fichier`,`Protéger le droit d'auteur`],c:0,ex:`Effet secondaire utile : le texte alternatif est aussi lu par les moteurs de recherche.`},
{q:`Un contraste insuffisant entre le texte et le fond d'une page pose surtout un problème :`,opts:[`D'accessibilité pour les personnes malvoyantes`,`De temps de chargement`,`De compatibilité navigateur`,`De référencement`],c:0,ex:`Les règles WCAG fixent des ratios de contraste minimaux selon la taille du texte.`},
{q:`Un fichier PDF constitué d'images scannées sans couche texte :`,opts:[`N'est ni cherchable ni lisible par un lecteur d'écran sans reconnaissance de caractères`,`Est plus léger qu'un PDF texte`,`Est automatiquement accessible`,`Ne peut pas être imprimé`],c:0,ex:`La reconnaissance optique de caractères ajoute la couche texte qui rend le document exploitable.`},
{q:`Comparé au format JPEG, le format PNG est préférable pour :`,opts:[`Les captures d'écran et les images comportant du texte ou de la transparence`,`Les photographies`,`Les vidéos`,`Les fichiers audio`],c:0,ex:`Le PNG est sans perte ; le JPEG compresse en dégradant, ce qui rend le texte flou.`},

/* --- Résolution de problèmes --- */
{q:`Face à un logiciel qui ne répond plus, la démarche méthodique consiste à :`,opts:[`Isoler le problème en testant une hypothèse à la fois`,`Réinstaller le système d'exploitation`,`Changer d'ordinateur`,`Attendre la prochaine mise à jour`],c:0,ex:`Reproduire, isoler, tester, documenter : c'est le cœur du domaine résolution de problèmes.`},
{q:`Une capture d'écran accompagnant une demande d'assistance sert surtout à :`,opts:[`Transmettre le message d'erreur exact et le contexte`,`Prouver sa bonne foi`,`Accélérer le ticket automatiquement`,`Contourner le support de premier niveau`],c:0,ex:`Un message d'erreur reformulé de mémoire fait perdre du temps au diagnostic.`},
{q:`Le stockage dans le nuage dispense-t-il de sauvegarder ?`,opts:[`Non, car une suppression ou un chiffrement malveillant se synchronise aussi`,`Oui, la redondance suffit`,`Oui, si le fournisseur est européen`,`Oui, au-delà d'un certain volume`],c:0,ex:`La synchronisation n'est pas une sauvegarde : elle propage l'erreur au lieu de la conserver.`},
{q:`Face au résultat d'un outil d'IA générative sur un point de droit, il faut :`,opts:[`Vérifier chaque référence dans une source primaire`,`Le reprendre tel quel s'il est bien rédigé`,`Le rejeter systématiquement`,`Demander une seconde réponse au même outil`],c:0,ex:`Ces modèles produisent des références plausibles mais inexistantes ; la fluidité du texte ne dit rien de son exactitude.`},
{q:`Un biais algorithmique désigne :`,opts:[`Un résultat systématiquement défavorable à un groupe, souvent hérité des données d'entraînement`,`Une erreur de programmation aléatoire`,`Un ralentissement du traitement`,`Une faille de sécurité`],c:0,ex:`Le système reproduit et amplifie les régularités des données, y compris les discriminations qu'elles contiennent.`},
{q:`Choisir un format ouvert plutôt qu'un format propriétaire pour archiver un document répond au risque :`,opts:[`De dépendance à un éditeur et d'illisibilité à long terme`,`De perte de qualité graphique`,`De taille de fichier excessive`,`De cyberattaque`],c:0,ex:`L'enfermement propriétaire fait dépendre l'accès aux archives de la survie commerciale d'un logiciel.`},
{q:`Identifier soi-même une compétence numérique qui manque et suivre une formation relève :`,opts:[`De la résolution de problèmes, au titre de l'identification des besoins`,`De la sécurité`,`De la communication`,`De la création de contenu`],c:0,ex:`Le domaine 5 inclut explicitement l'identification des lacunes et le développement de ses propres compétences.`},

/* --- Fichiers, formats et organisation --- */
{q:`Quel est l'intérêt principal d'une convention de nommage des fichiers du type AAAA-MM-JJ_sujet_version ?`,opts:[`Le tri alphabétique produit automatiquement un tri chronologique`,`Elle réduit la taille des fichiers`,`Elle chiffre le contenu`,`Elle empêche la suppression accidentelle`],c:0,ex:`La date en tête et au format inversé est ce qui fait fonctionner le tri. Écrire 12-03-2026 casse la propriété.`},
{q:`Que fait la compression d'un dossier au format ZIP ?`,opts:[`Elle regroupe plusieurs fichiers en un seul et réduit leur taille sans perte`,`Elle supprime les fichiers en double`,`Elle chiffre systématiquement le contenu`,`Elle convertit les fichiers en PDF`],c:0,ex:`Le chiffrement est une option distincte, pas une propriété du format. Un ZIP non protégé se lit par n'importe qui.`},
{q:`Que signifie l'extension d'un fichier ?`,opts:[`Elle indique le format attendu, sans garantir le contenu réel`,`Elle détermine la taille maximale du fichier`,`Elle protège le fichier contre la modification`,`Elle identifie l'auteur`],c:0,ex:`Renommer un fichier exécutable en .txt ne le rend pas inoffensif : c'est un vecteur d'attaque courant.`},
{q:`Pourquoi éviter les caractères accentués et les espaces dans un nom de fichier destiné à être partagé largement ?`,opts:[`Ils peuvent être mal interprétés selon les systèmes et compliquer les liens`,`Ils augmentent la taille du fichier`,`Ils empêchent l'impression`,`Ils sont interdits par le RGPD`],c:0,ex:`Le tiret bas et le tiret simple sont les séparateurs sûrs. C'est particulièrement vrai pour des fichiers publiés sur le web.`},
{q:`Quelle est la différence entre enregistrer et exporter un document ?`,opts:[`L'export produit une copie dans un autre format, sans lier le document d'origine à ce format`,`Il n'y a aucune différence`,`L'export supprime l'original`,`L'enregistrement change toujours de format`],c:0,ex:`Exporter en PDF ne remplace pas le fichier source : il faut continuer de travailler sur l'original.`},
{q:`Qu'est-ce qu'un format ouvert ?`,opts:[`Un format dont la spécification est publique et implémentable par n'importe quel éditeur`,`Un format gratuit`,`Un format non compressé`,`Un format sans droits d'auteur sur le contenu`],c:0,ex:`Gratuit et ouvert sont deux choses distinctes : un format peut être gratuit à lire mais fermé dans sa spécification.`},

/* --- Tableur, approfondissement --- */
{q:`Dans un tableur, à quoi sert la fonction SI (IF) ?`,opts:[`À renvoyer une valeur différente selon qu'une condition est vraie ou fausse`,`À compter les cellules`,`À trier une plage`,`À figer une référence`],c:0,ex:`Elle s'imbrique, mais au-delà de trois niveaux une table de correspondance et une recherche sont plus lisibles.`},
{q:`Qu'est-ce qu'une plage nommée dans un tableur ?`,opts:[`Un nom donné à un ensemble de cellules, réutilisable dans les formules`,`Une cellule verrouillée`,`Un filtre enregistré`,`Un onglet masqué`],c:0,ex:`Une formule qui utilise « TauxTVA » plutôt que $F$2 reste compréhensible six mois plus tard.`},
{q:`Que fait la validation des données appliquée à une colonne ?`,opts:[`Elle restreint les valeurs saisissables, par exemple à une liste ou à un intervalle`,`Elle corrige les erreurs automatiquement`,`Elle verrouille la feuille`,`Elle vérifie l'orthographe`],c:0,ex:`C'est le moyen le plus simple d'éviter qu'un tableau collectif se remplisse de variantes d'écriture d'une même valeur.`},
{q:`Pourquoi une date saisie peut-elle s'afficher comme un nombre à cinq chiffres dans un tableur ?`,opts:[`Les dates sont stockées comme des nombres de jours depuis une date d'origine, seul l'affichage change`,`Le fichier est corrompu`,`La cellule contient une formule`,`La langue du document est incorrecte`],c:0,ex:`C'est ce qui permet de soustraire deux dates pour obtenir un nombre de jours.`},
{q:`Dans un tableur, à quoi sert le figeage des volets ?`,opts:[`À garder visibles les en-têtes de lignes ou de colonnes lors du défilement`,`À empêcher la modification des cellules`,`À masquer des colonnes`,`À protéger le classeur`],c:0,ex:`À ne pas confondre avec la protection de la feuille, qui empêche la saisie.`},
{q:`Que se passe-t-il si l'on supprime une colonne référencée par des formules ailleurs dans le classeur ?`,opts:[`Les formules concernées renvoient une erreur de référence`,`Les formules s'ajustent automatiquement sans erreur`,`Le classeur se ferme`,`Les valeurs sont conservées telles quelles`],c:0,ex:`Le message d'erreur commence par un dièse suivi de REF. Vérifier les dépendances avant de supprimer est le réflexe attendu.`},
{q:`Un graphique dont l'axe des ordonnées commence à 90 plutôt qu'à zéro :`,opts:[`Amplifie visuellement des écarts faibles et peut induire en erreur`,`Est toujours incorrect`,`Réduit la lisibilité sans changer l'interprétation`,`Est obligatoire pour les pourcentages`],c:0,ex:`Ce n'est pas systématiquement malhonnête, mais cela doit être signalé. C'est le biais graphique le plus fréquent.`},
{q:`Pour comparer la répartition d'un total entre six catégories, quel graphique est le plus lisible ?`,opts:[`Un diagramme à barres`,`Un camembert à six parts`,`Un nuage de points`,`Une courbe`],c:0,ex:`L'œil compare mal des angles. Au-delà de trois ou quatre parts, le camembert devient difficile à lire.`},

/* --- Bases de données --- */
{q:`Qu'est-ce qu'une clé primaire dans une base de données ?`,opts:[`Un champ dont la valeur identifie de façon unique chaque enregistrement`,`Le premier champ de la table`,`Le mot de passe d'accès à la base`,`Le champ le plus souvent consulté`],c:0,ex:`Sans clé primaire, rien ne garantit qu'un enregistrement ne soit pas dupliqué.`},
{q:`À quoi sert une clé étrangère ?`,opts:[`À relier un enregistrement d'une table à un enregistrement d'une autre table`,`À chiffrer une colonne`,`À trier automatiquement les données`,`À importer des données extérieures`],c:0,ex:`C'est ce qui rend une base relationnelle : les données ne sont saisies qu'une fois et reliées ensuite.`},
{q:`Quand une base de données est-elle préférable à un tableur ?`,opts:[`Quand plusieurs personnes saisissent simultanément un volume important de données structurées et reliées`,`Quand il faut faire des calculs complexes`,`Quand il faut produire des graphiques`,`Quand les données sont confidentielles`],c:0,ex:`Le critère est la structure et la concurrence d'accès, pas le volume seul ni la sensibilité.`},
{q:`Que fait une requête SELECT assortie d'une clause WHERE ?`,opts:[`Elle extrait les seuls enregistrements satisfaisant une condition`,`Elle supprime des enregistrements`,`Elle crée une table`,`Elle modifie la structure de la base`],c:0,ex:`SELECT lit sans modifier. Ce sont DELETE et UPDATE qui écrivent.`},
{q:`Que désigne la redondance des données ?`,opts:[`La même information stockée à plusieurs endroits, au risque d'incohérences`,`Une sauvegarde supplémentaire`,`Un champ obligatoire`,`Un index de recherche`],c:0,ex:`Corriger une adresse à un endroit et pas à l'autre produit deux vérités contradictoires dans la même base.`},

/* --- Réseaux et matériel --- */
{q:`Que désigne une adresse IP ?`,opts:[`L'identifiant numérique d'un appareil sur un réseau`,`Le nom du fabricant de l'appareil`,`Le mot de passe du réseau`,`Le protocole de chiffrement utilisé`],c:0,ex:`Elle peut être publique ou privée, fixe ou attribuée dynamiquement.`},
{q:`Quelle différence sépare le débit de la latence ?`,opts:[`Le débit est la quantité de données par seconde, la latence le délai avant la première réponse`,`Ce sont deux noms pour la même grandeur`,`La latence se mesure en mégabits`,`Le débit ne concerne que le sans-fil`],c:0,ex:`Une visioconférence saccadée sur une connexion très rapide est en général un problème de latence, pas de débit.`},
{q:`À quoi sert un réseau privé virtuel dans un contexte professionnel ?`,opts:[`À créer un tunnel chiffré vers le réseau de l'organisation depuis l'extérieur`,`À accélérer la connexion`,`À masquer l'activité vis-à-vis de l'employeur`,`À supprimer les publicités`],c:0,ex:`L'usage professionnel vise l'accès sécurisé aux ressources internes, pas l'anonymat.`},
{q:`Quelle différence sépare la mémoire vive du stockage ?`,opts:[`La mémoire vive est temporaire et perdue à l'extinction, le stockage est persistant`,`La mémoire vive est plus lente`,`Le stockage ne sert qu'aux systèmes d'exploitation`,`Il n'y a aucune différence fonctionnelle`],c:0,ex:`Un travail non enregistré vit en mémoire vive : c'est pourquoi une coupure de courant le fait disparaître.`},
{q:`Que provoque la saturation de l'espace de stockage d'un poste de travail ?`,opts:[`Un ralentissement général et l'impossibilité d'enregistrer ou de mettre à jour`,`Une perte immédiate des données existantes`,`Une déconnexion du réseau`,`Un chiffrement automatique`],c:0,ex:`Les mises à jour de sécurité échouent souvent en premier, ce qui transforme un problème de confort en problème de sécurité.`},
{q:`Qu'est-ce qu'un pilote (driver) ?`,opts:[`Un logiciel permettant au système d'exploitation de communiquer avec un matériel`,`Un utilisateur disposant de droits étendus`,`Un programme antivirus`,`Un navigateur intégré`],c:0,ex:`Un pilote obsolète est une source classique de dysfonctionnement d'imprimante ou de périphérique de visioconférence.`},
{q:`Que permet la virtualisation ?`,opts:[`Faire fonctionner plusieurs systèmes indépendants sur une même machine physique`,`Augmenter la puissance du processeur`,`Se passer de sauvegardes`,`Chiffrer le disque`],c:0,ex:`C'est le fondement technique de l'informatique en nuage.`},

/* --- Web et navigateur --- */
{q:`Quelle est la différence entre un cookie interne et un cookie tiers ?`,opts:[`Le premier est déposé par le site visité, le second par un autre domaine`,`Le premier est chiffré, le second non`,`Le premier expire toujours à la fermeture`,`Le second est interdit dans l'Union`],c:0,ex:`C'est le cookie tiers qui permet le suivi entre sites et qui concentre l'essentiel des exigences de consentement.`},
{q:`Que fait réellement la navigation privée d'un navigateur ?`,opts:[`Elle n'enregistre pas l'historique local, mais ne rend pas anonyme vis-à-vis des sites ou du réseau`,`Elle chiffre tout le trafic`,`Elle bloque les publicités`,`Elle masque l'adresse IP`],c:0,ex:`Malentendu très répandu. Le fournisseur d'accès, l'employeur et le site visité voient la même chose qu'en navigation normale.`},
{q:`Pourquoi une extension de navigateur peut-elle représenter un risque ?`,opts:[`Elle peut lire et modifier le contenu des pages, y compris les données saisies`,`Elle ralentit toujours la machine`,`Elle empêche les mises à jour`,`Elle désactive le pare-feu`],c:0,ex:`Une extension légitime rachetée par un tiers peut devenir malveillante par simple mise à jour.`},
{q:`Que contient le cache d'un navigateur ?`,opts:[`Des copies locales d'éléments de pages, conservées pour accélérer les visites suivantes`,`Les mots de passe enregistrés`,`L'historique de navigation`,`Les signets`],c:0,ex:`Vider le cache est le premier réflexe quand une page affiche une version périmée.`},
{q:`Que signale un navigateur qui affiche « connexion non sécurisée » ?`,opts:[`La liaison n'est pas chiffrée ou le certificat pose problème`,`Le site contient un virus`,`Le site est bloqué par l'employeur`,`La connexion est lente`],c:0,ex:`Il ne faut saisir aucun identifiant sur une telle page, même si son apparence est familière.`},
{q:`À quoi sert un flux de syndication ?`,opts:[`À suivre les nouvelles publications de plusieurs sources dans un seul outil`,`À sauvegarder des pages web`,`À traduire automatiquement des pages`,`À bloquer le pistage`],c:0,ex:`Il permet une veille sans passer par les recommandations d'une plateforme, donc sans effet de bulle.`},

/* --- Messagerie --- */
{q:`Pourquoi préférer un lien vers un espace partagé à une pièce jointe volumineuse ?`,opts:[`Le destinataire accède toujours à la version à jour et les boîtes ne sont pas saturées`,`Le lien est plus sécurisé par nature`,`La pièce jointe est interdite au-delà d'une taille`,`Le lien évite le RGPD`],c:0,ex:`Il faut en revanche vérifier les droits d'accès du lien, sans quoi le destinataire recevra une demande d'autorisation.`},
{q:`Qu'est-ce que l'usurpation d'adresse d'expéditeur dans un courriel ?`,opts:[`L'affichage d'un expéditeur qui n'est pas le véritable émetteur du message`,`Le vol d'une boîte aux lettres`,`Le remplissage automatique du destinataire`,`Une erreur de carnet d'adresses`],c:0,ex:`Le nom affiché est déclaratif. Il faut regarder l'adresse complète, et surtout le domaine.`},
{q:`Que fait un filtre antipourriel trop agressif ?`,opts:[`Il classe en indésirable des messages légitimes, qu'il faut donc contrôler régulièrement`,`Il supprime définitivement tous les messages suspects`,`Il chiffre les messages entrants`,`Il ralentit l'envoi`],c:0,ex:`Un message professionnel important perdu dans les indésirables est un incident opérationnel courant.`},
{q:`À quoi sert une liste de diffusion institutionnelle plutôt qu'une liste de destinataires saisie à la main ?`,opts:[`Elle garantit que la composition reste à jour et évite les oublis`,`Elle chiffre les messages`,`Elle accélère l'envoi`,`Elle contourne les quotas`],c:0,ex:`Elle centralise aussi la gestion des départs et arrivées, ce qui est un enjeu de protection des données.`},
{q:`Un message qui crée un sentiment d'urgence et demande une action financière immédiate doit :`,opts:[`Être vérifié par un canal indépendant avant toute action`,`Être exécuté rapidement si l'expéditeur est un supérieur`,`Être transféré à toute l'équipe`,`Être supprimé sans signalement`],c:0,ex:`La fraude au président repose entièrement sur l'urgence et l'autorité. La vérification par un autre canal est la seule parade.`},

/* --- Sécurité, approfondissement --- */
{q:`Qu'est-ce que le bourrage d'identifiants (credential stuffing) ?`,opts:[`Le test automatisé, sur de nombreux sites, de couples identifiant et mot de passe issus de fuites`,`La saisie répétée d'un mot de passe oublié`,`Le remplissage automatique des formulaires`,`Le vol d'un badge d'accès`],c:0,ex:`Il ne fonctionne que grâce à la réutilisation des mots de passe : un mot de passe unique par service le neutralise.`},
{q:`Qu'est-ce qu'une attaque de l'homme du milieu ?`,opts:[`L'interception de la communication entre deux parties qui se croient en liaison directe`,`Une attaque menée depuis l'intérieur de l'organisation`,`La saturation d'un serveur`,`Le chiffrement forcé des fichiers`],c:0,ex:`Le chiffrement de bout en bout et la vérification du certificat sont les protections principales.`},
{q:`Qu'est-ce qu'une attaque par déni de service distribué ?`,opts:[`La saturation d'un service par un volume de requêtes venant de très nombreuses machines`,`Le vol de données clients`,`La suppression d'une base de données`,`Le chiffrement d'un poste de travail`],c:0,ex:`Elle vise la disponibilité, pas la confidentialité : aucune donnée n'est nécessairement dérobée.`},
{q:`Pourquoi une sauvegarde doit-elle être testée régulièrement ?`,opts:[`Une sauvegarde qui ne se restaure pas n'est pas une sauvegarde`,`Pour libérer de l'espace`,`Pour respecter le RGPD`,`Pour accélérer le système`],c:0,ex:`Découvrir qu'une sauvegarde est illisible au moment de l'incident est un scénario documenté et fréquent.`},
{q:`Qu'appelle-t-on attaque de la chaîne d'approvisionnement logicielle ?`,opts:[`La compromission d'un fournisseur ou d'un composant utilisé par de nombreuses organisations`,`Le vol de matériel en transit`,`Une rupture d'approvisionnement en composants`,`Une fraude à la facturation`],c:0,ex:`Une seule mise à jour piégée d'un logiciel largement déployé atteint simultanément des milliers d'organisations.`},

{q:`Quels sont les trois facteurs d'authentification possibles ?`,opts:[`Ce que l'on sait, ce que l'on possède, ce que l'on est`,`Le mot de passe, le code PIN et la question secrète`,`L'identifiant, le mot de passe et l'adresse électronique`,`Le nom, le prénom et la date de naissance`],c:0,ex:`Une authentification est à deux facteurs seulement si les éléments relèvent de deux catégories différentes.`},

{q:`Que faire d'un compte d'un agent qui quitte l'organisation ?`,opts:[`Le désactiver sans délai selon une procédure établie`,`Le laisser actif au cas où`,`Le partager avec son remplaçant`,`Le convertir en compte générique`],c:0,ex:`Les comptes dormants sont une porte d'entrée privilégiée, car personne ne remarque leur utilisation.`},
{q:`Qu'est-ce qu'un correctif de sécurité de type « jour zéro » corrige-t-il ?`,opts:[`Une faille déjà exploitée avant que le correctif n'existe`,`Une faille théorique jamais exploitée`,`Un défaut de performance`,`Une incompatibilité matérielle`],c:0,ex:`D'où l'urgence particulière de son déploiement, souvent hors du cycle habituel de mise à jour.`},

model:`<b>BRIEFING NOTE</b><br>
<b>To:</b> Director-General, Eurostat<br>
<b>Subject:</b> Meeting with the Director-General of the Internal Audit Service on the ECA's findings on peer reviews<br>
<b>Date of meeting:</b> [date]<br><br>

<b>1. Purpose</b><br>
To prepare you for the discussion on the peer review findings of the ECA special report on European statistics, and to propose the line we take.<br><br>

<b>2. What the Court found</b><br>
The Court examined peer reviews as the main compliance tool for the European Statistics Code of Practice. It makes four points. First, coverage is complete: the third round assessed every national statistical institute and Eurostat itself. Second, follow-up is weak: of roughly 400 recommendations, slightly over half had been implemented at the time of the audit, and we have no power to compel a national institute to act. Third, scope is too narrow: reviews look at processes and governance rather than at the quality of the data actually produced, and two well-rated institutes subsequently had to make significant corrections. Fourth, the nine-year cycle is too long to detect deterioration in time.<br><br>

<b>3. Where we agree, and where we do not</b><br>
We accept the substance of the first three findings. On the fourth, national authorities have told us that a shorter cycle would add a disproportionate administrative burden. Our position is that the frequency issue is real but that the answer is a targeted intermediate review, not a full additional cycle.<br><br>

<b>4. Speaking points</b><br>
• "We share the Court's diagnosis on follow-up. The gap is not one of will but of legal instruments: peer review recommendations are not binding on national institutes."<br>
• "We will publish an annual implementation scoreboard by institute. Transparency is the lever we do have, and it costs nothing."<br>
• "We agree that process compliance is not a proxy for data quality. The two cases the Court cites make that point better than we could."<br>
• "On frequency, we propose a light targeted review at mid-cycle focused on data quality, rather than shortening the full cycle. This meets the Court's concern while keeping the burden acceptable to national authorities."<br>
• "We would welcome the Internal Audit Service's view on how to measure the effectiveness of follow-up, since that is the weakest link."<br><br>

<b>5. Point to watch</b><br>
If asked why implementation stands at just over half, avoid attributing it to national reluctance. The honest answer is that no deadline is attached to recommendations. Proposing deadlines is a constructive response.`,

model:`<b>BRIEFING NOTE</b><br>
<b>To:</b> Director, DG DIGIT<br>
<b>Subject:</b> Speaking points for the interinstitutional IT committee on the ECA report on cyber-preparedness<br><br>

<b>1. Purpose</b><br>
To brief you ahead of your intervention and to set out the line that keeps the Commission constructive without accepting a coordinating role we are not resourced for.<br><br>

<b>2. The Court's diagnosis in one paragraph</b><br>
Significant incidents have grown more than tenfold in five years while preparedness has not kept pace. Maturity is uneven, security spending varies by more than a factor of ten between comparable bodies with no visible link to risk exposure, the shared incident response team depends on voluntary contributions, and awareness training is not mandatory everywhere.<br><br>

<b>3. Why this matters for the committee</b><br>
The interinstitutional level is where three of the five findings can actually be addressed. Spending disparities and training obligations are decided entity by entity, but common binding rules and stable funding for the response team require agreement in this room.<br><br>

<b>4. Speaking points</b><br>
• "The tenfold rise in significant incidents is the number to keep in mind. Everything else in this report follows from it."<br>
• "Uneven maturity is a collective problem, not a problem of the smaller entities. An attacker entering through the least protected body reaches a shared network."<br>
• "We support making common cybersecurity rules binding. Voluntary coordination has been tested and the spending gap shows the result."<br>
• "The response team cannot be expected to scale during a major incident while its funding depends on goodwill. We propose moving it to a stable and predictable basis."<br>
• "Mandatory awareness training is the cheapest measure on the list. The variation in phishing simulation results tells us it works where it is applied."<br><br>

<b>5. Points to watch</b><br>
Do not commit the Commission to funding the shared response team alone; propose a distribution key instead. If smaller agencies object to binding rules on grounds of proportionality, offer a tiered set of requirements rather than an exemption.`,

model:`<b>BRIEFING NOTE</b><br>
<b>To:</b> Head of Unit, DG ECFIN<br>
<b>Subject:</b> Meeting with the delegation of [Member State] on euro adoption<br><br>

<b>1. Purpose</b><br>
To give you the factual position on the procedure and on the price concern the delegation is likely to raise.<br><br>

<b>2. The legal position</b><br>
Adoption is an obligation, not a choice. Denmark holds the only opt-out, agreed at Maastricht. Every other Member State outside the euro area has committed to adopt the currency once it meets the convergence criteria. The delegation may frame the question as whether to join; the accurate framing is when.<br><br>

<b>3. The procedure in four steps</b><br>
The four convergence criteria cover price stability, sound public finances, exchange rate stability and long-term interest rates. Participation in the exchange rate mechanism for at least two years without severe tension is a precondition. The Commission and the European Central Bank each produce a convergence report. The Council then decides on a Commission proposal, after consulting the European Parliament.<br><br>

<b>4. The price question</b><br>
This is where the meeting will concentrate. Public opinion in the most recent joining country was majority negative before changeover, driven by fear of price rises. The evidence from earlier changeovers is that rounding does push prices up, but by far less than consumers perceive. The gap is one of perception, and dual price display over several months is the measure that has narrowed it most effectively.<br><br>

<b>5. Speaking points</b><br>
• "The criteria are the same for everyone and they are published. There is no political negotiation on the thresholds."<br>
• "The two-year exchange rate mechanism requirement means the timetable is set well before the decision itself."<br>
• "On prices, we do not dispute that rounding has an effect. What the data show is that the perceived increase is consistently larger than the measured one."<br>
• "Dual display is the single most effective tool available to you, and it is entirely under national control."<br><br>

<b>6. Point to watch</b><br>
Avoid predicting a date. The convergence reports are the only basis on which timing is discussed, and pre-empting them would be read as a commitment.`,

model:`<b>NOTE FOR THE ATTENTION OF THE HEAD OF UNIT</b><br>
<b>Subject:</b> The European Parliament's budgetary powers ahead of your first conciliation meeting<br><br>

<b>1. Purpose</b><br>
To set out what the Parliament can and cannot do on the budget, and what this means in the room.<br><br>

<b>2. How the balance shifted</b><br>
The Parliament began as a consultative assembly of national delegates and has been directly elected since 1979. The budgetary treaties of the 1970s gave it the last word on part of expenditure and the power to reject the budget as a whole. Lisbon removed the distinction between compulsory and non-compulsory expenditure, which had been the main limit on its reach.<br><br>

<b>3. What this means today</b><br>
Three points matter in practice.<br>
First, the annual budget is adopted jointly with the Council. If they disagree, a conciliation committee has twenty-one days to agree a joint text.<br>
Second, the multiannual financial framework is different. The Council decides unanimously and the Parliament can only consent or refuse. It cannot amend. Its leverage is therefore the threat of refusal, exercised before the text is fixed rather than during.<br>
Third, discharge for implementation is granted by the Parliament on a Council recommendation and on the basis of the Court of Auditors' report. Refusal carries no automatic legal effect but is politically costly.<br><br>

<b>4. Practical points for the meeting</b><br>
• The twenty-one day deadline is short and binding. Positions harden quickly, so anything we can settle technically beforehand will not have to be settled politically.<br>
• Expect the Parliament to use annual budget negotiations to reopen priorities it could not amend in the multiannual framework. This is a predictable consequence of its consent-only role there.<br>
• Discharge is a separate track but not a separate relationship. Unresolved implementation concerns resurface in budgetary negotiations.<br><br>

<b>5. In short</b><br>
The Parliament is a co-decision-maker on the annual budget, a gatekeeper on the multiannual framework, and an auditor of implementation. Treating those three roles as one is the most common misreading.`,

model:`<b>BRIEFING NOTE</b><br>
<b>To:</b> Director, DG CNECT<br>
<b>Subject:</b> Speaking points for the Council working party on Digital Decade progress<br><br>

<b>1. Purpose</b><br>
To give you a defensible account of where we stand, and a line on the question you will certainly be asked: whether the 2030 targets are still realistic.<br><br>

<b>2. Where we stand</b><br>
On current trends, none of the targets is on course. Basic digital skills stand at around 56 % against a target of 80 %. The ICT specialist workforce is at roughly half of the 20 million target. Connectivity is progressing, but faster in urban than in rural areas, so the gap is widening rather than closing. Cloud, big data and artificial intelligence adoption is rising among large firms and flat among small ones. Divergence between Member States is significant on all five targets.<br><br>

<b>3. Reading the numbers</b><br>
Two of these gaps are structural rather than cyclical. Skills and workforce cannot be closed by investment alone within the remaining period, because both depend on training cycles measured in years. Connectivity and business adoption are more responsive to funding and regulation. That distinction should drive where we ask for effort.<br><br>

<b>4. Speaking points</b><br>
• "The targets remain the right benchmark. What the data show is that the current pace is not sufficient, not that the ambition was misplaced."<br>
• "Skills is the binding constraint. A firm cannot adopt technologies it has no one to operate."<br>
• "The rural connectivity gap is widening. Aggregate coverage figures conceal this and we should stop leading with them."<br>
• "Adoption among small enterprises is where the largest gain per euro is available, and where progress has stalled."<br>
• "Divergence between Member States means a single Union-level average tells us very little. National trajectories are the relevant unit of discussion."<br><br>

<b>5. Point to watch</b><br>
If pressed on whether the targets will be met, do not commit either way. The accurate answer is that they will not be met on current trends, which is precisely why the trajectory review exists.`,

model:`<b>BRIEFING NOTE</b><br>
<b>To:</b> Director-General, DG REGIO<br>
<b>Subject:</b> Meeting with the Minister for European Funds of [Member State] on absorption<br><br>

<b>1. Purpose</b><br>
To prepare the discussion on the absorption shortfall and to keep it on causes rather than on blame.<br><br>

<b>2. The situation</b><br>
Absorption at mid-period is clearly below the level reached at the same stage of the previous programming period. The audit identifies causes that are largely common to Member States rather than specific to this one, which is the frame we should set early in the meeting.<br><br>

<b>3. The four causes identified</b><br>
Administrative capacity was saturated by the overlap of three exercises: closing the previous period, delivering the recovery plan and starting the current period. Eligibility rules are complex and the fear of financial corrections pushes managing authorities towards low-risk projects rather than high-impact ones. Small project promoters carry the heaviest relative administrative burden, and they are a large share of potential beneficiaries in the least developed regions. Finally, the automatic decommitment rule concentrates commitments at the end of the period, at the cost of selection quality.<br><br>

<b>4. Speaking points</b><br>
• "The shortfall is not a national failure. The overlap of three delivery exercises affected everyone, and the audit says so."<br>
• "We are concerned about what absorption pressure does to selection quality. Spending the envelope and spending it well are not the same objective."<br>
• "Risk aversion among managing authorities is a rational response to correction risk. If we want bolder projects, we have to reduce the penalty for good-faith error."<br>
• "Simplification for small promoters is where we can move fastest, through simplified cost options."<br>
• "We would rather discuss capacity now than decommitment later."<br><br>

<b>5. Points to watch</b><br>
Do not offer any flexibility on the decommitment rule: it is set in the regulation and any hint would be reported as a signal. If the Minister asks for a deadline extension, redirect to technical assistance and simplification, which are within our control.`,

/* ================= LECTURE AUDIO =================
   Synthèse vocale locale via l'API speechSynthesis du navigateur. Aucun service
   externe : le texte n'est envoyé nulle part, il est prononcé par le moteur de
   voix du système. Le cours UE et l'annexe entière deviennent un catalogue de
   chapitres écoutables dans n'importe quel ordre, chacun retenant sa position. */

const TTS_SUPPORT = typeof window.speechSynthesis !== 'undefined'
                 && typeof window.SpeechSynthesisUtterance !== 'undefined';

/* ---- Catalogue ---- */
/* Identifiant stable dérivé du titre : la reprise doit survivre à l'ajout d'une
   fiche au milieu d'une banque, ce qu'un simple index ne permettrait pas. */
function ttsSlug(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
}
const AUDIO_GROUPS = [
  {g:'cours',  label:`Cours · Connaissances UE`},
  {g:'pilier', label:`Annexe · Piliers fondamentaux`},
  {g:'actu',   label:`Annexe · Actualité européenne`},
  {g:'theme',  label:`Annexe · Dossiers du Parlement`},
  {g:'fiche',  label:`Annexe · Fiches détaillées`},
];
const AUDIO_GROUP_LABEL = Object.fromEntries(AUDIO_GROUPS.map(x=>[x.g,x.label]));
function buildAudioLib(){
  const out = [];
  EU_KNOWLEDGE.forEach(s=>out.push({g:'cours', sub:'', title:s.title, html:s.body}));
  ANNEXE_KNOWLEDGE.forEach(s=>{
    if(s.group==='pilier'||s.group==='actu'||s.group==='theme')
      out.push({g:s.group, sub:'', title:s.title, html:s.body});
  });
  ANNEXE_FICHES.forEach(f=>out.push({g:'fiche', sub:f.section, title:f.title, html:f.body}));
  const vus = new Set();
  out.forEach(x=>{
    let id = x.g+'/'+ttsSlug(x.title), k = 2;
    while(vus.has(id)) id = x.g+'/'+ttsSlug(x.title)+'-'+(k++);
    vus.add(id); x.id = id;
  });
  return out;
}
const AUDIO_LIB = TTS_SUPPORT ? buildAudioLib() : [];
const AUDIO_BY_ID = new Map(AUDIO_LIB.map(x=>[x.id,x]));
const AUDIO_BY_TITLE = new Map(AUDIO_LIB.map(x=>[x.g+'|'+x.title,x.id]));
function audioIdFor(g,title){ return AUDIO_BY_TITLE.get(g+'|'+title) || null; }
