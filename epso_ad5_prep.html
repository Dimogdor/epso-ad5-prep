  [/\bCAE\b/g, `Conseil affaires étrangères`],
  [/\bIA\b/g, `intelligence artificielle`],
  [/\bUE\b/g, `Union européenne`],
  [/\bCE\b/g, `Communauté européenne`],
  /* Sigles qui s'épellent : on force l'épellation, sinon le moteur tente un mot. */
  [/\bPIB\b/g, `P I B`], [/\bRNB\b/g, `R N B`], [/\bTVA\b/g, `T V A`],
  [/\bPME\b/g, `P M E`], [/\bQCM\b/g, `Q C M`], [/\bDSA\b/g, `D S A`],
  [/\bDMA\b/g, `D M A`], [/\bNUTS\b/g, `N U T S`], [/\bFIMI\b/g, `F I M I`],
  [/\bIVCDCI\b/g, `I V C D C I`], [/\bPPE\b/g, `P P E`], [/\bS&D\b/g, `S et D`],
];
function ttsNormalize(t){
  t = String(t).replace(/[   ]/g,' ');
  /* « 1 490 » doit se lire comme un nombre, pas comme « un, quatre cent quatre-vingt-dix ». */
  t = t.replace(/(\d) (?=\d{3}(?!\d))/g,'$1').replace(/(\d) (?=\d{3}(?!\d))/g,'$1');
  TTS_ACRO.forEach(r=>{ t = t.replace(r[0], r[1]); });
  t = t.replace(/Md€/g,` milliards d'euros`).replace(/M€/g,` millions d'euros`).replace(/€/g,` euros`);
  t = t.replace(/[−–-]\s?(\d[\d,.]*)\s*%/g,`moins $1 pour cent`);
  t = t.replace(/\+\s?(\d[\d,.]*)\s*%/g,`plus $1 pour cent`);
  t = t.replace(/\s*%/g,` pour cent`).replace(/\s*‰/g,` pour mille`);
  t = t.replace(/\b1er\b/g,`premier`).replace(/\b1re\b/g,`première`);
  t = t.replace(/\bart\.\s*/gi,`article `).replace(/\bn°\s*/g,`numéro `);
  t = t.replace(/\bEx\s*:/g,`Exemple :`).replace(/\bex\s*:/g,`exemple :`);
  t = t.replace(/((?:19|20)\d{2})\s*[-–—]\s*((?:19|20)\d{2})/g,`$1 à $2`);
  t = t.replace(/\bIII\b/g,`trois`).replace(/\bII\b/g,`deux`);
  /* Le point médian sépare des blocs dans tout le corpus : c'est une fin de phrase.
     Les guillemets et les tirets longs, eux, se prononcent si on les laisse. */
  t = t.replace(/\s*·\s*/g,`. `).replace(/[«»“”„"]/g,` `).replace(/\s*[—–]\s*/g,`, `).replace(/…/g,`.`);
  /* On resserre l'espace avant la ponctuation basse seulement : l'espace avant
     « : ; ! ? » est la règle française et le texte du lecteur reste lisible. */
  return t.replace(/\s+([,.])/g,`$1`).replace(/\s{2,}/g,' ').trim();
}

/* ---- Découpage en phrases, ancré sur le texte réel ----
   Le découpage travaille sur des OFFSETS dans le texte d'origine, jamais sur une
   copie normalisée : c'est ce qui permet de retrouver chaque phrase dans le DOM
   du cours et de l'y surligner, au lieu de la surligner dans une vue séparée.
   La normalisation pour la voix s'applique ensuite, phrase par phrase. */
const TTS_MAX = 180;
const TTS_VOID = {BR:1, IMG:1, HR:1, WBR:1};
/* Substitutions d'un caractère pour un caractère : elles créent des frontières de
   phrase sans décaler le moindre offset. */
function ttsPreSplit(t){ return t.replace(/·/g,'.').replace(/…/g,'.'); }

function ttsSentenceRanges(text, from){
  if(from >= text.length) return [];
  const raw = []; let start = from;
  for(let i=from;i<text.length;i++){
    if('.!?;'.indexOf(text[i]) < 0) continue;
    if(text[i]==='.' && /\d/.test(text[i-1]||'') && /\d/.test(text[i+1]||'')) continue;
    if(text[i+1] && text[i+1] !== ' ') continue;
    const seg = text.slice(start, i+1).trim();
    if(/^\d{1,2}\.$/.test(seg)) continue;     // « 2. Les institutions » : ce point numérote
    if(seg) raw.push({a:start, z:i+1});
    start = i+1;
  }
  if(text.slice(start).trim()) raw.push({a:start, z:text.length});
  /* Un fragment trop court est un reliquat de ponctuation : on le recolle au
     précédent, ou au suivant quand il ouvre le bloc. */
  const merged = [];
  raw.forEach(r=>{
    if(text.slice(r.a,r.z).trim().length < 28 && merged.length) merged[merged.length-1].z = r.z;
    else merged.push({a:r.a, z:r.z});
  });
  for(let i=0;i<merged.length-1;i++){
    if(text.slice(merged[i].a, merged[i].z).trim().length < 28){
      merged[i+1].a = merged[i].a; merged.splice(i,1); i--;
    }
  }
  /* Chrome coupe une énonciation qui dépasse une quinzaine de secondes : une
     phrase trop longue est recoupée sur une virgule, jamais au milieu d'un mot.
     La mesure porte sur le texte PRONONCÉ, pas sur le texte source : développer
     les sigles rallonge la phrase de moitié, et un plafond appliqué au source
     laisserait passer des énonciations bien au-delà de la limite. */
  const fits = (a,z)=>ttsNormalize(text.slice(a,z)).length <= TTS_MAX;
  const out = [];
  merged.forEach(r=>{
    let a = r.a, guard = 0;
    while(!fits(a, r.z) && guard++ < 40){
      let cut = -1;
      for(let hi = Math.min(r.z-1, a+TTS_MAX); hi > a; ){
        let c = text.lastIndexOf(', ', hi);
        if(c <= a) c = text.lastIndexOf(' ', hi);
        if(c <= a) break;
        if(fits(a, c+1)){ cut = c; break; }
        hi = c - 1;
      }
      if(cut < 0 || cut >= r.z - 1) break;
      out.push({a, z:cut+1}); a = cut + 1;
    }
    if(r.z > a) out.push({a, z:r.z});
  });
  return out;
}

/* ---- Blocs ----
   Le même parcours est appliqué au corps détaché (pour fabriquer les phrases) et
   au corps affiché dans le cours (pour les surligner). Étant déterministe, le
   bloc numéro k désigne le même élément dans les deux cas. */
const TTS_GAP = {title:0, p:340, li:190};
function ttsScan(root){
  const out = [];
  const add = (el, kind, lead, txt, row)=>{
    if(txt && txt.trim()) out.push({el, kind, lead, raw:ttsPreSplit(txt), row:!!row});
  };
  Array.from(root.childNodes).forEach(n=>{
    if(n.nodeType===3){ add(null,'p',0,n.textContent); return; }
    if(n.nodeType!==1) return;
    if(n.tagName==='P'){
      /* Presque tous les paragraphes ouvrent sur un intertitre en gras collé au
         texte : isolé, il reçoit son propre point et donc sa propre respiration. */
      const f = n.firstChild;
      const lead = (f && f.nodeType===1 && f.tagName==='B') ? f.textContent.length : 0;
      add(n,'p',lead,n.textContent);
    } else if(n.tagName==='UL' || n.tagName==='OL'){
      Array.from(n.children).forEach(li=>add(li,'li',0,li.textContent));
    } else if(n.tagName==='TABLE'){
      Array.from(n.querySelectorAll('tr')).forEach(tr=>add(tr,'li',0,tr.textContent,true));
    } else {
      add(n,'p',0,n.textContent);
    }
  });
  return out;
}
function ttsChunkBlock(b){
  const chunks = [];
  if(b.row){
    /* Une ligne de tableau se lit d'un trait, cellule après cellule. */
    const cells = b.el ? Array.from(b.el.children).map(c=>c.textContent.trim()).filter(Boolean) : [b.raw];
    const t = ttsNormalize(cells.join(', ') + '.');
    if(t) chunks.push({start:0, end:b.raw.length, text:t});
    return chunks;
  }
  let from = 0;
  if(b.lead > 0){
    const lead = ttsNormalize(b.raw.slice(0, b.lead).replace(/[\s:.]+$/,''));
    if(lead){ chunks.push({start:0, end:b.lead, text:lead + '.'}); from = b.lead; }
  }
  ttsSentenceRanges(b.raw, from).forEach(r=>{
    const t = ttsNormalize(b.raw.slice(r.a, r.z));
    if(t) chunks.push({start:r.a, end:r.z, text:t});
  });
  return chunks;
}
function ttsBuild(chap){
  if(chap._chunks) return chap._chunks;
  const box = document.createElement('div');
  box.innerHTML = chap.html;
  const flat = [{text:ttsNormalize(chap.title), gap:0, b:-1, start:0, end:0}];
  ttsScan(box).forEach((b,bi)=>{
    ttsChunkBlock(b).forEach((c,k)=>{
      flat.push({text:c.text, gap:(k===0 ? TTS_GAP[b.kind] : 0), b:bi, start:c.start, end:c.end});
    });
  });
  flat.forEach((c,i)=>{ c.i = i; });
  if(flat[1]) flat[1].gap = 620;      // souffle après l'annonce du titre
  chap._chunks = flat;
  return flat;
}

/* ---- Surlignage dans le texte affiché ----
   On réécrit le balisage interne de chaque bloc en y insérant des repères de
   phrase. Les repères se referment à chaque frontière d'élément pour ne jamais
   produire d'imbrication invalide : une phrase à cheval sur une mise en forme
   donne simplement plusieurs repères portant le même numéro. */
function ttsSpanHTML(el, cs){
  const esc = t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const attrs = e=>Array.from(e.attributes).map(x=>' '+x.name+'="'+x.value.replace(/"/g,'&quot;')+'"').join('');
  const idxAt = q=>{ for(const c of cs) if(q>=c.start && q<c.end) return c.i; return -1; };
  let out='', pos=0, cur=-1;
  const open = k=>{ if(k===cur) return ''; const r = cur>=0?'</span>':''; cur=k;
    return r + (k>=0 ? '<span class="tts-chunk" data-i="'+k+'">' : ''); };
  const shut = ()=>{ const r = cur>=0?'</span>':''; cur=-1; return r; };
  const walk = node=>{
    Array.from(node.childNodes).forEach(ch=>{
      if(ch.nodeType===3){
        const t = ch.nodeValue; let off=0;
        while(off < t.length){
          const k = idxAt(pos+off);
          let len = 1;
          while(off+len < t.length && idxAt(pos+off+len)===k) len++;
          out += open(k) + esc(t.substr(off,len));
          off += len;
        }
        pos += t.length;
      } else if(ch.nodeType===1){
        const tag = ch.tagName.toLowerCase();
        out += shut() + '<' + tag + attrs(ch) + '>';
        if(!TTS_VOID[ch.tagName]){ walk(ch); out += shut() + '</' + tag + '>'; }
      }
    });
  };
  walk(el);
  return out + shut();
}
/* Pose les repères sur le corps affiché d'un chapitre, ou les retire. */
function ttsMarkBody(bodyEl, chap, on){
  if(!bodyEl || !chap) return;
  if(!on){ if(bodyEl.dataset.marked){ bodyEl.innerHTML = chap.html; delete bodyEl.dataset.marked; } return; }
  if(bodyEl.dataset.marked === chap.id) return;
  bodyEl.innerHTML = chap.html;
  const chunks = ttsBuild(chap);
  ttsScan(bodyEl).forEach((b,bi)=>{
    if(!b.el) return;
    const cs = chunks.filter(c=>c.b===bi);
    if(!cs.length) return;
    if(b.row){ b.el.setAttribute('data-i', cs[0].i); b.el.classList.add('tts-chunk'); return; }
    b.el.innerHTML = ttsSpanHTML(b.el, cs);
  });
  bodyEl.dataset.marked = chap.id;
  bodyEl.querySelectorAll('.tts-chunk').forEach(sp=>{
    sp.addEventListener('click', e=>{ e.stopPropagation(); ttsGoto(+sp.dataset.i); });
  });
}

/* Une voix française lit autour de 15 caractères par seconde à vitesse 1.
   L'estimation se prend sur le texte brut : découper les 208 chapitres pour
   afficher une durée approchée bloquerait plus d'une seconde au premier rendu. */
function ttsDuration(chap){
  if(chap._plain===undefined)
    chap._plain = chap.html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().length;
  return Math.round(chap._plain / (15 * TTS.rate));
}
function ttsMinutes(sec){ return sec < 60 ? '< 1 min' : Math.round(sec/60)+' min'; }

/* ---- État du lecteur ---- */
const TTS = {
  chap:null, chunks:[], i:0, playing:false, paused:false, tok:0,
  rate:1, voiceURI:null, continuous:true, follow:true,
  queue:[], pos:{}, last:null,
  timer:null, keep:null, saveT:null, filter:'all', q:'',
  watch:null, notice:'', utt:null, lastError:'', diagShown:false, tried:[],
  audio:null, wake:null, keepAwake:false,
};
function ttsStateBlob(){
  return JSON.stringify({rate:TTS.rate, voiceURI:TTS.voiceURI, continuous:TTS.continuous,
    follow:TTS.follow, keepAwake:TTS.keepAwake, pos:TTS.pos, last:TTS.last, queue:TTS.queue});
}
async function ttsLoad(){
  try{
    const r = await window.storage.get('epso-audio');
    if(r && r.value){
      const s = JSON.parse(r.value);
      if(typeof s.rate==='number') TTS.rate = Math.max(0.5, Math.min(2, s.rate));
      TTS.voiceURI = s.voiceURI || null;
      TTS.continuous = s.continuous !== false;
      TTS.follow = s.follow !== false;
      TTS.keepAwake = s.keepAwake === true;
      TTS.pos = s.pos || {};
      TTS.last = s.last || null;
      TTS.queue = Array.isArray(s.queue) ? s.queue.filter(id=>AUDIO_BY_ID.has(id)) : [];
    }
  }catch(e){}
}
function ttsFlush(){ try{ window.storage.set('epso-audio', ttsStateBlob()); }catch(e){} }
function ttsSave(){ clearTimeout(TTS.saveT); TTS.saveT = setTimeout(ttsFlush, 900); }

/* ---- Voix ---- */
let TTS_VOICES = [];
/* Les voix neuronales (Edge « Natural », Google, voix « améliorées » d'Apple) sont
   d'un tout autre niveau que les voix système historiques : on les remonte. */
function ttsScore(v){
  const n = (v.name||'').toLowerCase(); let s = 0;
  if(/natural|neural/.test(n)) s += 100;
  if(/online/.test(n)) s += 40;
  if(/google/.test(n)) s += 35;
  if(/enhanced|premium|améliorée|amelioree/.test(n)) s += 30;
  if(/(amélie|amelie|thomas|audrey|aurélie|aurelie|denise|henri|rémy|remy|charline|marie)/.test(n)) s += 15;
  if(/(compact|eloquence|novelty|whisper|zarvox)/.test(n)) s -= 70;
  if(/^fr-fr/i.test(v.lang||'')) s += 10;
  return s;
}
function ttsRefreshVoices(){
  if(!TTS_SUPPORT) return;
  let all = [];
  try{ all = speechSynthesis.getVoices() || []; }catch(e){ all = []; }
  const fr = all.filter(v=>/^fr/i.test(v.lang||''));
  TTS_VOICES = (fr.length ? fr : all).slice().sort((a,b)=>ttsScore(b)-ttsScore(a));
  if(TTS_VOICES.length && !TTS_VOICES.some(v=>v.voiceURI===TTS.voiceURI))
    TTS.voiceURI = TTS_VOICES[0].voiceURI;
}
function ttsVoice(){
  try{ return (speechSynthesis.getVoices()||[]).find(v=>v.voiceURI===TTS.voiceURI) || null; }
  catch(e){ return null; }
}

/* ---- Moteur ----
   Une seule énonciation en vol à la fois, enchaînée dans onend. Le jeton `tok`
   invalide les callbacks des énonciations annulées : sans lui, un cancel() ferait
   avancer l'index une seconde fois et la lecture sauterait une phrase. */
const TTS_ANDROID = /Android/i.test(navigator.userAgent);
/* Le minuteur qui coupe les énonciations longues est un défaut de Chrome de
   bureau. Sur Android, pause() ne met pas en pause et coupe souvent la voix
   pour de bon : y appliquer le même contournement rend l'app muette. */
const TTS_BLINK = /Chrome|Chromium|Edg\//.test(navigator.userAgent)
               && !/Firefox/.test(navigator.userAgent) && !TTS_ANDROID;
function ttsKeepAlive(on){
  clearInterval(TTS.keep);
  if(!on || !TTS_BLINK) return;
  TTS.keep = setInterval(()=>{
    if(TTS.playing && !TTS.paused && speechSynthesis.speaking){
      try{ speechSynthesis.pause(); speechSynthesis.resume(); }catch(e){}
    }
  }, 9000);
}
/* ---- Lecture écran verrouillé ----
   Android gèle un onglet dès que l'écran se verrouille, et la synthèse vocale ne
   compte pas comme une lecture audio : la page est donc suspendue en plein
   chapitre. On maintient en parallèle une piste inaudible, ce qui donne à la page
   le statut de lecteur média — elle reste vivante et les contrôles apparaissent
   sur l'écran verrouillé. */
const TTS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function ttsSilentTrack(){
  if(TTS.audio) return TTS.audio;
  const rate = 8000, n = rate * 4;               // quatre secondes bouclées
  const buf = new ArrayBuffer(44 + n*2), dv = new DataView(buf);
  const wr = (o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  wr(0,'RIFF'); dv.setUint32(4, 36+n*2, true); wr(8,'WAVEfmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,rate,true); dv.setUint32(28,rate*2,true); dv.setUint16(32,2,true);
  dv.setUint16(34,16,true); wr(36,'data'); dv.setUint32(40, n*2, true);
  /* Un seul pas de quantification, soit environ -90 dB : inaudible, mais pas
     rigoureusement nul, car une piste parfaitement muette n'est pas considérée
     comme une lecture en cours et ne protège de rien. */
  for(let i=0;i<n;i++) dv.setInt16(44+i*2, (i%2)?1:-1, true);
  const a = new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));
  a.loop = true;
  TTS.audio = a;
  return a;
}
function ttsHoldAudio(on){
  if(!TTS_MOBILE) return;
  try{
    const a = ttsSilentTrack();
    if(on){ const p = a.play(); if(p && p.catch) p.catch(()=>{}); }
    else a.pause();
  }catch(e){}
}
/* Contrôles sur l'écran verrouillé et dans les écouteurs. */
function ttsMediaSession(){
  if(!('mediaSession' in navigator) || !TTS.chap) return;
  try{
    if(window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({
      title: TTS.chap.title,
      artist: AUDIO_GROUP_LABEL[TTS.chap.g] || '',
      album: `Préparation · EPSO/AD/427/26`,
    });
    const set = (a,h)=>{ try{ navigator.mediaSession.setActionHandler(a,h); }catch(e){} };
    set('play', ttsPlay); set('pause', ttsPause); set('stop', ttsPause);
    set('previoustrack', ()=>ttsChapter(-1)); set('nexttrack', ()=>ttsChapter(1));
    set('seekbackward', ()=>ttsSeek(-1)); set('seekforward', ()=>ttsSeek(1));
  }catch(e){}
}
/* Option explicite pour les appareils où rien ne suffit : l'écran ne s'éteint
   pas, donc la page n'est jamais gelée. Le verrou est perdu à chaque passage en
   arrière-plan, il faut le redemander au retour. */
async function ttsWakeLock(on){
  if(!('wakeLock' in navigator)) return;
  try{
    if(on){ if(!TTS.wake) TTS.wake = await navigator.wakeLock.request('screen'); }
    else if(TTS.wake){ const w = TTS.wake; TTS.wake = null; await w.release(); }
  }catch(e){}
}
function ttsKill(){
  TTS.tok++; clearTimeout(TTS.timer); clearTimeout(TTS.watch);
  /* cancel() alors que rien ne parle laisse le moteur d'Android dans un état où
     le speak() suivant est accepté puis reste muet : on n'annule que s'il y a
     réellement quelque chose en cours. */
  try{ if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); }catch(e){}
}
/* Une panne de synthèse est silencieuse par nature : sans message, la barre de
   progression avance sur du vide et rien n'explique pourquoi. */
const TTS_MUTE_HELP = `Aucun son ne sort. Sur Android : vérifie d'abord le volume <b>multimédia</b> (pas celui de la sonnerie), puis ouvre <b>Paramètres › Accessibilité › Sortie de synthèse vocale</b> et installe les données de la voix <b>française</b> du moteur Google. Sans ces données le navigateur accepte la demande et reste muet.`;
function ttsErrMsg(err){
  if(err==='language-unavailable' || err==='voice-unavailable')
    return `La voix choisie n'est pas disponible sur cet appareil. Choisis-en une autre dans l'onglet Écoute.`;
  if(err==='not-allowed')
    return `Le navigateur a refusé de démarrer la lecture. Touche à nouveau le bouton de lecture.`;
  return `Le moteur vocal du système n'a pas pu lire ce passage (${err||'erreur inconnue'}).`;
}
function ttsSpeak(delay){
  const tok = ++TTS.tok;
  clearTimeout(TTS.timer); clearTimeout(TTS.watch);
  const go = ()=>{
    if(tok!==TTS.tok || !TTS.playing || TTS.paused) return;
    const c = TTS.chunks[TTS.i];
    if(!c){ ttsChapterDone(); return; }
    const u = new SpeechSynthesisUtterance(c.text);
    const v = ttsVoice();
    if(v) u.voice = v;
    u.lang = (v && v.lang) || 'fr-FR';
    u.rate = TTS.rate; u.pitch = 1; u.volume = 1;
    /* Chrome peut ramasser une énonciation que plus personne ne référence avant
       même de l'avoir prononcée : on en garde une trace. */
    TTS.utt = u;
    let started = false;
    /* Une voix qui parle vraiment est une voix saine : on repart d'une ardoise
       vierge pour la prochaine panne éventuelle. */
    u.onstart = ()=>{ started = true; TTS.tried = []; ttsNotice(''); };
    u.onend = ()=>{
      if(tok!==TTS.tok || !TTS.playing) return;
      clearTimeout(TTS.watch);
      TTS.i++;
      TTS.pos[TTS.chap.id] = TTS.i; ttsSave();
      const nxt = TTS.chunks[TTS.i];
      if(!nxt){ ttsChapterDone(); return; }
      ttsPaint(); ttsSpeak(nxt.gap);
    };
    u.onerror = e=>{
      if(tok!==TTS.tok || !TTS.playing) return;
      clearTimeout(TTS.watch);
      /* « interrupted » et « canceled » sont nos propres annulations. */
      if(e && (e.error==='interrupted' || e.error==='canceled')) return;
      TTS.lastError = (e && e.error) || 'inconnue';
      ttsNotice(ttsErrMsg(e && e.error));
      ttsDiagAuto();
      TTS.i++;
      if(TTS.i >= TTS.chunks.length){ ttsChapterDone(); return; }
      ttsPaint(); ttsSpeak(120);
    };
    ttsPaint();
    try{ speechSynthesis.speak(u); }
    catch(e){ TTS.playing = false; ttsNotice(ttsErrMsg('')); ttsPaint(); return; }
    /* Ni onstart ni onerror : la demande a été acceptée dans le vide. */
    TTS.watch = setTimeout(()=>{
      if(tok!==TTS.tok || !TTS.playing || started) return;
      /* Chrome connaît depuis la v130 une régression où speak() est accepté puis
         reste muet, en particulier sur les voix Google. Avant de conclure que
         l'appareil n'a pas de voix, on rejoue la phrase avec une autre. */
      /* La voix qui vient d'échouer est marquée d'abord, sans quoi la recherche
         de remplaçante la redésignerait elle-même indéfiniment. */
      if(TTS.tried.indexOf(TTS.voiceURI) < 0) TTS.tried.push(TTS.voiceURI);
      const suivante = TTS_VOICES.find(v=>TTS.tried.indexOf(v.voiceURI)<0);
      if(suivante){
        TTS.tried.push(suivante.voiceURI);
        TTS.voiceURI = suivante.voiceURI; ttsSave();
        ttsNotice(`La voix précédente n'a produit aucun son. Nouvel essai avec <b>`+suivante.name+`</b>.`);
        ttsKill(); ttsSpeak(0);
        return;
      }
      ttsNotice(TTS_MUTE_HELP); ttsDiagAuto();
    }, 3000);
  };
  if(delay > 0) TTS.timer = setTimeout(go, delay); else go();
}
function ttsOpen(id, autoplay){
  const chap = AUDIO_BY_ID.get(id);
  if(!chap) return;
  ttsKill();
  TTS.playing = false; TTS.paused = false;
  TTS.chap = chap;
  ttsBuild(chap);
  TTS.chunks = chap._chunks;
  let p = TTS.pos[id] || 0;
  if(p >= TTS.chunks.length) p = 0;      // chapitre déjà terminé : on repart du début
  TTS.i = p;
  TTS.last = id; ttsSave();
  /* On lance la voix AVANT de redessiner. Reconstruire la bibliothèque coûte
     plusieurs centaines de millisecondes sur un téléphone ; passées dans le
     gestionnaire de clic, elles suffisent à ce que le navigateur ne rattache
     plus le speak() au geste de l'utilisateur, et la lecture reste muette. */
  if(autoplay) ttsPlay();
  if(CURRENT==='params') renderParams(); else ttsBarSync();
  ttsSyncCours();
}
function ttsPlay(){
  if(!TTS.chap || !TTS.chunks.length) return;
  if(TTS.i >= TTS.chunks.length) TTS.i = 0;
  TTS.playing = true; TTS.paused = false;
  /* Android peuple parfois la liste des voix seulement après la première
     demande de lecture : on retente ici avant de conclure quoi que ce soit. */
  if(!TTS_VOICES.length) ttsRefreshVoices();
  /* Déclenché depuis le geste de l'utilisateur : c'est le seul moment où la
     piste de maintien peut démarrer. */
  ttsHoldAudio(true);
  ttsMediaSession();
  if(TTS.keepAwake) ttsWakeLock(true);
  ttsKeepAlive(true);
  ttsSpeak(0);
}
/* Pause = arrêt franc + mémorisation de la phrase. Les implémentations de
   pause()/resume() sont trop inégales selon les plateformes pour s'y fier ;
   reprendre la phrase en cours à son début est prévisible et sans surprise. */
function ttsPause(){
  if(!TTS.playing) return;
  ttsKill(); ttsKeepAlive(false); ttsHoldAudio(false); ttsWakeLock(false);
  TTS.playing = false; TTS.paused = true;
  if(TTS.chap){ TTS.pos[TTS.chap.id] = TTS.i; ttsSave(); }
  ttsPaint();
}
function ttsToggle(){ if(TTS.playing) ttsPause(); else ttsPlay(); }
function ttsStop(){
  ttsKill(); ttsKeepAlive(false); ttsHoldAudio(false); ttsWakeLock(false);
  TTS.playing = false; TTS.paused = false; TTS.chap = null; TTS.chunks = []; TTS.i = 0;
  if(CURRENT==='params') renderParams(); else ttsBarSync();
}
function ttsSetRate(r){
  TTS.rate = Math.max(0.5, Math.min(2, Math.round(r*20)/20));
  ttsSave();
  /* Une énonciation garde la vitesse qu'elle avait au départ : pour que le
     changement soit audible tout de suite, on relance la phrase en cours. */
  if(TTS.playing){ ttsKill(); ttsSpeak(0); }
  if(CURRENT==='params') renderParams(); else ttsBarSync();
}
function ttsSeek(d){ ttsGoto(TTS.i + d); }
function ttsGoto(i){
  if(!TTS.chap) return;
  TTS.i = Math.max(0, Math.min(TTS.chunks.length-1, i));
  TTS.pos[TTS.chap.id] = TTS.i; ttsSave();
  if(TTS.playing){ ttsKill(); ttsSpeak(0); } else ttsPaint();
}
function ttsNextId(dir){
  while(dir > 0 && TTS.queue.length){
    const id = TTS.queue.shift(); ttsSave();
    if(AUDIO_BY_ID.has(id) && (!TTS.chap || id!==TTS.chap.id)) return id;
  }
  if(!TTS.chap) return null;
  const k = AUDIO_LIB.findIndex(x=>x.id===TTS.chap.id);
  const n = AUDIO_LIB[k+dir];
  return n ? n.id : null;
}
function ttsChapter(dir){
  const id = ttsNextId(dir);
  if(!id) return;
  if(dir > 0) TTS.pos[id] = 0;    // on avance : le chapitre suivant démarre au début
  ttsOpen(id, TTS.playing);
}
function ttsChapterDone(){
  if(TTS.chap){ TTS.pos[TTS.chap.id] = TTS.chunks.length; ttsSave(); }
  const wasPlaying = TTS.playing;
  const id = (TTS.queue.length || TTS.continuous) ? ttsNextId(1) : null;
  if(id && wasPlaying){ TTS.pos[id] = 0; ttsOpen(id, true); return; }
  ttsKeepAlive(false); ttsHoldAudio(false); ttsWakeLock(false);
  TTS.playing = false; TTS.paused = false;
  if(CURRENT==='params') renderParams(); else ttsBarSync();
}

/* ---- Barre de lecture (hors de #app : elle survit aux changements d'onglet) ---- */
function ttsBarInit(){
  const bar = document.getElementById('ttsBar');
  if(!bar) return;
  bar.innerHTML = `<div class="pw">
    <div class="player-top">
      <span class="player-eyebrow" id="pbGroup"></span>
      <span class="player-title" id="pbTitle"></span>
      <span class="player-count" id="pbCount"></span>
    </div>
    <div id="pbNotice"></div>
    <div class="player-prog"><i id="pbFill"></i></div>
    <div class="player-ctl">
      <button id="pbPrevCh" title="Chapitre précédent">⏮</button>
      <button id="pbPrev" title="Phrase précédente">◀</button>
      <button class="big" id="pbPlay" title="Lecture / pause">▶</button>
      <button id="pbNext" title="Phrase suivante">▶|</button>
      <button id="pbNextCh" title="Chapitre suivant">⏭</button>
      <span class="sp">
        <button id="pbSlow" title="Ralentir">−</button>
        <b id="pbRate">1,00×</b>
        <button id="pbFast" title="Accélérer">+</button>
        <button id="pbClose" title="Fermer le lecteur">✕</button>
      </span>
    </div></div>`;
  const on = (id,fn)=>document.getElementById(id).addEventListener('click',fn);
  on('pbPlay',   ttsToggle);
  on('pbPrev',  ()=>ttsSeek(-1));
  on('pbNext',  ()=>ttsSeek(1));
  on('pbPrevCh',()=>ttsChapter(-1));
  on('pbNextCh',()=>ttsChapter(1));
  on('pbSlow',  ()=>ttsSetRate(TTS.rate-0.05));
  on('pbFast',  ()=>ttsSetRate(TTS.rate+0.05));
  on('pbClose', ttsStop);
}
function ttsBarSync(){
  const bar = document.getElementById('ttsBar');
  if(!bar) return;
  if(!TTS.chap){ bar.classList.add('hidden'); document.body.classList.remove('has-player'); return; }
  bar.classList.remove('hidden'); document.body.classList.add('has-player');
  const n = TTS.chunks.length || 1;
  document.getElementById('pbGroup').textContent = AUDIO_GROUP_LABEL[TTS.chap.g] || '';
  document.getElementById('pbTitle').textContent = TTS.chap.title;
  document.getElementById('pbCount').textContent = (TTS.i+1)+' / '+n;
  document.getElementById('pbFill').style.width = Math.round(100*TTS.i/n)+'%';
  document.getElementById('pbPlay').textContent = TTS.playing ? '❙❙' : '▶';
  document.getElementById('pbRate').textContent = TTS.rate.toFixed(2).replace('.',',')+'×';
  try{ if('mediaSession' in navigator) navigator.mediaSession.playbackState = TTS.playing?'playing':'paused'; }catch(e){}
}
/* Le message d'anomalie vit dans la barre de lecture : il reste visible quel que
   soit l'onglet, et disparaît de lui-même dès qu'une phrase démarre vraiment. */
function ttsNotice(msg){
  if(TTS.notice === msg) return;
  TTS.notice = msg;
  const el = document.getElementById('pbNotice');
  if(!el) return;
  el.innerHTML = msg ? '<div class="player-notice">'+msg
    +'<button class="notice-btn" id="pbFix">Diagnostic et solutions</button></div>' : '';
  const f = document.getElementById('pbFix');
  if(f) f.addEventListener('click', ttsDiagOpen);
}

/* ---- Diagnostic et remédiation ----
   Une page web ne peut pas installer une voix : aucune API ne l'autorise. Elle
   peut en revanche dire exactement ce que le navigateur rapporte, faire un essai
   déclenché par le doigt de l'utilisateur, et l'amener en un tap sur le moteur
   vocal à installer. C'est le maximum de ce qui est faisable côté web. */
const TTS_GOOGLE_TTS = 'https://play.google.com/store/apps/details?id=com.google.android.tts';
/* Chrome Android sait ouvrir un écran de réglages système par une intention ;
   quand l'appareil la refuse, browser_fallback_url renvoie vers l'installation. */
const TTS_SETTINGS_INTENT = 'intent://#Intent;action=com.android.settings.TTS_SETTINGS;'
  + 'S.browser_fallback_url=' + encodeURIComponent(TTS_GOOGLE_TTS) + ';end';

/* La boîte s'ouvre d'elle-même à la première panne, puis plus jamais sans qu'on
   la demande : personne n'a envie de revoir un diagnostic toutes les phrases. */
function ttsDiagAuto(){
  if(TTS.diagShown) return;
  TTS.diagShown = true;
  ttsPause();
  ttsDiagOpen();
}
function ttsDiagClose(){
  const m = document.getElementById('ttsDiag');
  if(m){ m.classList.add('hidden'); m.innerHTML = ''; }
}
function ttsDiagOpen(){
  const m = document.getElementById('ttsDiag');
  if(!m) return;
  ttsRefreshVoices();
  const all = (()=>{ try{ return speechSynthesis.getVoices()||[]; }catch(e){ return []; } })();
  const fr = all.filter(v=>/^fr/i.test(v.lang||''));
  const ligne = (label, val, ok)=>'<div class="diag-line"><span>'+label+'</span>'
    +'<b class="'+(ok===true?'diag-ok':ok===false?'diag-no':'')+'">'+val+'</b></div>';

  m.innerHTML = `<div class="modal-box">
    <button class="modal-close" id="diagX" title="Fermer">✕</button>
    <span class="eyebrow">Lecture audio</span>
    <h2>Pourquoi il n'y a pas de son</h2>
    <p style="font-size:13.5px;">L'app ne produit pas la voix elle-même : elle demande à ton téléphone
    de parler. S'il n'a pas de moteur vocal français installé, il accepte la demande et reste muet.
    Voici ce que ton navigateur rapporte en ce moment.</p>

    ${ligne(`Synthèse vocale`, TTS_SUPPORT?`disponible`:`absente`, TTS_SUPPORT)}
    ${ligne(`Voix détectées`, String(all.length), all.length>0)}
    ${ligne(`Voix françaises`, String(fr.length), fr.length>0)}
    ${ligne(`Voix utilisée`, (ttsVoice()&&ttsVoice().name) || `aucune`, !!ttsVoice())}
    ${TTS.lastError ? ligne(`Dernière erreur du moteur`, TTS.lastError, false) : ''}
    ${all.length ? '<p style="font-size:12.5px;color:var(--muted);margin-top:8px;">Voix vues par ce navigateur : '
      + all.map(v=>v.name+' <span style="opacity:.7">('+v.lang+')</span>').join(' · ') + '</p>' : ''}
    ${all.length ? `<div class="info-box" style="font-size:13px;">Chrome connaît depuis sa version 130 une anomalie
      qui rend <b>speak()</b> muet sur certaines voix, alors que le même téléphone parle très bien dans un autre
      navigateur. Si c'est ton cas : change de voix dans la liste de l'onglet Écoute, ou ferme complètement Chrome
      (écran des applications récentes, balayer pour fermer) avant de le rouvrir, car il fige la liste des voix
      au démarrage.</div>` : ''}

    <p class="eyebrow" style="color:var(--accent);margin:18px 0 8px;">D'ABORD, UN ESSAI</p>
    <button class="btn-link" id="diagTest">🔊 Tester la voix maintenant</button>
    <div id="diagResult"></div>

    <p class="eyebrow" style="color:var(--accent);margin:18px 0 8px;">SI TU N'ENTENDS RIEN</p>
    <p style="font-size:13.5px;"><b>1. Le volume multimédia.</b> Ce n'est pas celui de la sonnerie.
    Lance l'essai ci-dessus et monte le volume <b>pendant</b> qu'il tourne : les touches agissent
    alors sur le bon canal.</p>
    ${TTS_ANDROID ? `
    <p style="font-size:13.5px;"><b>2. Le moteur vocal.</b> Beaucoup de téléphones sortent d'usine
    sans données de voix française. Ça s'installe une fois, gratuitement, et ça sert ensuite
    hors ligne.</p>
    <a class="btn-link" href="${TTS_GOOGLE_TTS}" target="_blank" rel="noopener">Installer le moteur vocal Google</a>
    <a class="btn-link alt" href="${TTS_SETTINGS_INTENT}">Ouvrir les réglages de synthèse vocale</a>
    <p style="font-size:13px;color:var(--muted);">Si le second bouton ne fait rien, ton téléphone
    bloque l'accès aux réglages depuis le navigateur. À faire à la main :</p>
    <ol class="diag-steps">
      <li>Ouvre l'app <b>Paramètres</b> du téléphone.</li>
      <li>Cherche <b>« synthèse vocale »</b> dans la barre de recherche des paramètres. Selon la marque,
      l'écran s'appelle <i>Sortie de synthèse vocale</i>, <i>Text-to-speech</i> ou <i>Langue et saisie</i>.</li>
      <li>Choisis le moteur <b>Services vocaux de Google</b>, ouvre ses réglages (l'engrenage),
      puis <b>Installer les données vocales</b> et <b>Français</b>.</li>
      <li>Reviens ici et relance l'essai. Nul besoin de recharger la page.</li>
    </ol>` : `
    <p style="font-size:13.5px;"><b>2. La voix du système.</b> Choisis une autre voix dans la liste
    de l'onglet Écoute : celle qui est active n'est peut-être pas installée.</p>`}
    <button class="btn-link alt" id="diagDone" style="margin-top:6px;">Fermer</button>
  </div>`;
  m.classList.remove('hidden');
  document.getElementById('diagX').addEventListener('click', ttsDiagClose);
  document.getElementById('diagDone').addEventListener('click', ttsDiagClose);
  m.addEventListener('click', e=>{ if(e.target===m) ttsDiagClose(); });
  document.getElementById('diagTest').addEventListener('click', ttsDiagTest);
}
/* L'essai part directement du doigt de l'utilisateur : c'est le chemin le plus
   fiable, celui qu'aucune politique de lecture automatique ne peut bloquer. */
function ttsDiagTest(){
  const out = document.getElementById('diagResult');
  if(!out) return;
  ttsKill();
  TTS.playing = false;
  let started = false, err = '';
  const dire = html=>{ out.innerHTML = html; };
  dire('<p style="font-size:13.5px;color:var(--muted);">Essai en cours, monte le volume maintenant…</p>');
  const u = new SpeechSynthesisUtterance(`Bonjour. Si tu entends cette phrase, la lecture à voix haute fonctionne.`);
  const v = ttsVoice();
  if(v) u.voice = v;
  u.lang = (v && v.lang) || 'fr-FR';
  u.rate = TTS.rate; u.pitch = 1; u.volume = 1;
  TTS.utt = u;
  u.onstart = ()=>{ started = true; dire('<div class="info-box" style="font-size:13.5px;">Le moteur a démarré. Si tu n\'entends toujours rien, c\'est le <b>volume multimédia</b> : monte-le pendant que la phrase tourne.</div>'); };
  u.onerror = e=>{
    err = (e && e.error) || 'inconnue';
    if(err==='interrupted' || err==='canceled') return;
    TTS.lastError = err;
    dire('<div class="warn-box" style="font-size:13.5px;">Le moteur a refusé : <b>'+err+'</b>.'
      + (err==='language-unavailable'||err==='voice-unavailable'
         ? ' La voix française n\'est pas installée sur ce téléphone : c\'est le bouton d\'installation ci-dessous.'
         : ' Installe le moteur vocal ci-dessous, puis réessaie.')+'</div>');
  };
  try{ speechSynthesis.speak(u); }
  catch(e){ dire('<div class="warn-box" style="font-size:13.5px;">Le navigateur a refusé la demande.</div>'); return; }
  setTimeout(()=>{
    if(!started && !err)
      dire('<div class="warn-box" style="font-size:13.5px;">Le moteur <b>n\'a pas démarré du tout</b> : '
        +'il ne renvoie ni son ni erreur. C\'est la signature d\'un téléphone sans données de voix '
        +'installées. Utilise le bouton d\'installation ci-dessous.</div>');
  }, 3200);
}
/* Appelée à chaque phrase : elle ne touche que ce qui bouge. */
function ttsPaint(){
  ttsBarSync();
  document.querySelectorAll('.kb-play.on').forEach(b=>b.classList.remove('on'));
  if(TTS.chap && TTS.playing){
    const kb = document.querySelector('.kb-play[data-audio="'+TTS.chap.id+'"]');
    if(kb) kb.classList.add('on');
  }
  document.querySelectorAll('.tts-chunk.on').forEach(x=>x.classList.remove('on'));
  if(!TTS.chap) return;
  /* Une phrase qui traverse une mise en forme est découpée en plusieurs repères
     portant le même numéro : ils doivent tous s'allumer, sinon seul le premier
     fragment est surligné. */
  const parts = document.querySelectorAll('.tts-chunk[data-i="'+TTS.i+'"]');
  if(!parts.length) return;
  parts.forEach(x=>x.classList.add('on'));
  const el = parts[0];
  /* Le suivi ne défile que si la phrase est sortie du champ : sans ce test, la
     page sursaute à chaque phrase alors qu'on lit déjà au bon endroit. */
  if(TTS.follow){
    const r = el.getBoundingClientRect();
    const haut = 90, bas = window.innerHeight - (TTS.chap ? 150 : 40);
    if(r.top < haut || r.bottom > bas)
      el.scrollIntoView({block:'center', behavior:'smooth'});
  }
}

/* ---- Raccourcis clavier ---- */
function ttsKey(e){
  if(!TTS.chap) return;
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable)) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if(k===' '){ e.preventDefault(); ttsToggle(); }
  else if(k==='ArrowRight'){ e.preventDefault(); e.shiftKey ? ttsChapter(1) : ttsSeek(1); }
  else if(k==='ArrowLeft'){ e.preventDefault(); e.shiftKey ? ttsChapter(-1) : ttsSeek(-1); }
  else if(k==='+' || k==='='){ e.preventDefault(); ttsSetRate(TTS.rate+0.05); }
  else if(k==='-'){ e.preventDefault(); ttsSetRate(TTS.rate-0.05); }
}

/* ---- Onglet Écoute ---- */
/* Un chapitre jamais ouvert est à zéro : inutile de le découper pour le savoir. */
function ttsPct(id){
  const p = TTS.pos[id];
  if(!p) return 0;
  const chap = AUDIO_BY_ID.get(id); if(!chap) return 0;
  ttsBuild(chap);
  return Math.min(100, Math.round(100*p/(chap._chunks.length || 1)));
}
async function ttsInit(){
  if(!TTS_SUPPORT) return;
  await ttsLoad();
  ttsRefreshVoices();
  /* La liste des voix arrive de façon asynchrone dans Chrome. */
  try{ speechSynthesis.addEventListener('voiceschanged', ()=>{
    ttsRefreshVoices(); if(CURRENT==='params') renderParams();
  }); }catch(e){}
  /* Sur Android l'événement n'arrive pas toujours, et la liste peut rester vide
     plusieurs secondes après le chargement : on la redemande quelques fois. */
  let essais = 0;
  const sonde = setInterval(()=>{
    const avant = TTS_VOICES.length;
    ttsRefreshVoices();
    if(TTS_VOICES.length !== avant && CURRENT==='params') renderParams();
    if(TTS_VOICES.length || ++essais >= 6) clearInterval(sonde);
  }, 600);
  ttsBarInit();
  document.addEventListener('keydown', ttsKey);
  /* Au retour de veille, le moteur a pu être vidé sans que onend soit jamais
     appelé : la lecture resterait alors bloquée sur une phrase muette. On la
     relance, et on reprend le verrou d'écran, qu'Android libère en arrière-plan. */
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState !== 'visible') return;
    if(!TTS.playing || TTS.paused) return;
    if(TTS.keepAwake) ttsWakeLock(true);
    ttsHoldAudio(true);
    setTimeout(()=>{
      if(TTS.playing && !TTS.paused && !speechSynthesis.speaking && !speechSynthesis.pending)
        ttsSpeak(0);
    }, 400);
  });
  window.addEventListener('beforeunload', ()=>{ ttsFlush(); try{ speechSynthesis.cancel(); }catch(e){} });
  if(TTS.last && AUDIO_BY_ID.has(TTS.last)) ttsOpen(TTS.last, false);
}

/* ================= STOCKAGE ================= */
const DEFAULT_PROGRESS = ()=>({
  verbal:{att:0,cor:0}, numeric:{att:0,cor:0}, abstract:{att:0,cor:0},
  euknow:{att:0,cor:0}, digital:{att:0,cor:0}, eufte:{sessions:0},
  streak:{count:0,last:null}, firstVisit:new Date().toISOString().slice(0,10)
});
let PROGRESS = DEFAULT_PROGRESS();
async function loadProgress(){
  try{
    const r = await window.storage.get('epso-progress');
    if(r && r.value) PROGRESS = Object.assign(DEFAULT_PROGRESS(), JSON.parse(r.value));
  }catch(e){ PROGRESS = DEFAULT_PROGRESS(); }
  updateStreak(); renderStreak();
}
async function saveProgress(){ try{ await window.storage.set('epso-progress', JSON.stringify(PROGRESS)); }catch(e){} }
function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  const last = PROGRESS.streak.last;
  if(last === today) return;
  if(last){
    const diffDays = Math.round((new Date(today)-new Date(last))/86400000);
    PROGRESS.streak.count = (diffDays===1) ? PROGRESS.streak.count+1 : 1;
  } else PROGRESS.streak.count = 1;
  PROGRESS.streak.last = today; saveProgress();
}
function renderStreak(){ document.getElementById('streakN').textContent = PROGRESS.streak.count; }
function acc(m){ const s=PROGRESS[m]; return s.att>0 ? Math.round(100*s.cor/s.att) : null; }
function shuffle(a){ const arr=a.slice(); for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
/* ponytail: les banques ecrites a la main placaient la bonne reponse en B dans la
   grande majorite des cas. On permute les options a l'affichage plutot que de
   reecrire chaque entree : la position de la bonne reponse change a chaque session. */
/* Au concours, « Aucune de ces réponses » est toujours la dernière option : elle est
   donc épinglée et seules les autres sont permutées. */
const NONE_OPT = `Aucune de ces réponses`;
function shuffleOpts(item){
  const pinned = item.opts.map((o,i)=>i).filter(i=>String(item.opts[i])===NONE_OPT);
  const free = shuffle(item.opts.map((_,i)=>i).filter(i=>pinned.indexOf(i)<0));
  const p = free.concat(pinned);
  return {opts:p.map(i=>item.opts[i]), c:p.indexOf(item.c)};
}
function fmtTime(s){ if(s<0) s=0; const m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }

let CURRENT = 'dashboard';
let ACTIVE_TIMER = null; // ponytail: single chokepoint so goTo() can always kill a running session timer, wherever it was started
function renderTabs(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = MODULES.map(m=>'<button class="tab-btn '+(m.id===CURRENT?'active':'')+'" data-m="'+m.id+'">'+(m.ep?m.ep:'&nbsp;')+'<b>'+m.label+'</b></button>').join('');
  nav.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.m)));
}
/* La lecture audio n'est pas coupée par la navigation : elle est volontairement
   indépendante des chronos de session, on écoute en passant d'un onglet à l'autre. */
/* La barre d'onglets change de hauteur selon la largeur : on mesure plutôt que
   de coder en dur le décalage du chrono collant. */
function syncHeaderH(){
  const h = document.querySelector('header.top');
  if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight+'px');
}
window.addEventListener('resize', syncHeaderH);
function goTo(id){ clearInterval(ACTIVE_TIMER); CURRENT = id; renderTabs(); RENDERERS[id](); ttsSyncCours(); ttsPaint(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ================= MODALITÉS RÉELLES DU CONCOURS =================
   Source : avis de concours EPSO/AD/427/26 (JO C/2026/711).
   Une seule source de vérité pour le nombre de questions et le rythme,
   afin que les chronos, les libellés et les tableaux restent concordants.
   Chaque session utilise un chrono GLOBAL (comme au concours), pas un
   chrono par question. Si la banque contient moins de questions que le
   test réel, la session est réduite mais garde le rythme réel. */
const VERB_COUNT=20, VERB_SEC=105;  // 20 textes / 35 min
const NUM_COUNT=10,  NUM_SEC=120;   // 10 questions / 20 min
const ABS_COUNT=10,  ABS_SEC=60;    // 10 questions / 10 min
const EU_COUNT=30,   EU_SEC=80;     // 30 questions / 40 min, seuil 15/30
const DIG_COUNT=40,  DIG_SEC=45;    // 40 questions / 30 min, seuil 20/40

/* ================= MOTEUR QCM ================= */
function runQCMSession(bank, statKey, secPerQ, title, ep, backTo, maxQ){
  const app = document.getElementById('app');
  const count = Math.min(maxQ || bank.length, bank.length);
  let order = shuffle(bank.map((_,i)=>i)).slice(0, count);
  let idx=0, score=0, answered=false, timer=null, timeLeft=order.length*secPerQ, ended=false, view=null;

  // ponytail: one countdown for the whole session, like the real exam. Paused while the
  // correction is on screen (the real test has no correction to read, so reading it
  // shouldn't eat the budget), resumed on "Suivant".
  function startClock(){
    clearInterval(timer);
    timer = ACTIVE_TIMER = setInterval(()=>{
      timeLeft--; const t=document.getElementById('tmr');
      if(t){ t.textContent=fmtTime(timeLeft); if(timeLeft<=30) t.classList.add('low'); }
      if(timeLeft<=0){ clearInterval(timer); endSession(true); }
    },1000);
  }
  function renderQ(){
    answered=false;
    const item = bank[order[idx]];
    view = shuffleOpts(item);
    app.innerHTML = '<div class="card">'
      +'<div class="section-title"><span class="eyebrow">'+ep+' · '+title+'</span><span class="q-count">'+(idx+1)+' / '+order.length+'</span></div>'
      +'<div class="timer-wrap"><span class="timer-txt" id="tmr">'+fmtTime(timeLeft)+'</span>'
      +'<span class="session-score" id="sc">Score : '+score+' / '+idx+'</span></div>'
      +'<div class="session-prog"><i style="width:'+Math.round(100*idx/order.length)+'%"></i></div>'
      +(item.table?'<div class="data-wrap">'+item.table+'</div>':'')
      +'<div class="qcm-question">'+item.q+'</div>'
      +'<div id="opts">'+view.opts.map((o,i)=>'<button class="qcm-opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>'
      +'<div id="fb"></div>'
      +'<button class="btn wide hidden" id="nextBtn" style="margin-top:12px;">Suivant →</button></div>'
      +'<div class="quit-row"><button id="exitBtn">Quitter la session</button></div>';
    document.getElementById('exitBtn').addEventListener('click',()=>goTo(backTo));
    app.querySelectorAll('.qcm-opt').forEach(b=>b.addEventListener('click',()=>submit(parseInt(b.dataset.i))));
    document.getElementById('nextBtn').addEventListener('click',()=>{
      idx++;
      if(idx<order.length){ renderQ(); startClock(); } else { endSession(false); }
    });
  }
  function submit(choice){
    if(answered) return; answered=true; clearInterval(timer);
    const item = bank[order[idx]];
    const ok = choice===view.c;
    if(ok) score++;
    PROGRESS[statKey].att++; if(ok) PROGRESS[statKey].cor++;
    saveProgress(); renderStreak();
    const sc = document.getElementById('sc');
    if(sc) sc.textContent = 'Score : '+score+' / '+(idx+1);
    app.querySelectorAll('.qcm-opt').forEach((b,i)=>{
      b.disabled=true;
      if(i===view.c) b.classList.add('correct');
      else if(i===choice) b.classList.add('incorrect');
    });
    document.getElementById('fb').innerHTML = '<div class="feedback '+(ok?'ok':'no')+'">'+(ok?'✓ Correct. ':'✗ Incorrect. ')+(item.ex||'')+'</div>';
    document.getElementById('nextBtn').classList.remove('hidden');
  }
  function endSession(timedOut){
    if(ended) return; ended=true;
    clearInterval(timer);
    app.innerHTML = '<div class="card session-end"><span class="eyebrow">'+(timedOut?'Temps écoulé':'Session terminée')+'</span><div class="n">'+score+'/'+order.length+'</div>'
      +(timedOut?'<p style="color:var(--bad);">Le temps imparti est écoulé : '+(order.length-idx)+' question(s) non traitée(s).</p>':'')
      +'<p style="color:var(--muted);">Statistiques cumulées mises à jour.</p>'
      +'<button class="btn" id="againBtn">Refaire une session</button>'
      +'<button class="btn ghost" id="backBtn" style="margin-top:8px;">Retour</button></div>';
    document.getElementById('againBtn').addEventListener('click',()=>{
      order=shuffle(bank.map((_,i)=>i)).slice(0,count); idx=0; score=0; timeLeft=order.length*secPerQ; ended=false;
      renderQ(); startClock();
    });
    document.getElementById('backBtn').addEventListener('click',()=>goTo(backTo));
  }
  renderQ();
  startClock();
}

/* ================= VERBAL ================= */
function renderVerbal(){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="card">
    <span class="eyebrow">Test 1 · Raisonnement verbal · en Langue 1 (français)</span>
    <h2>L'épreuve la plus lourde du concours</h2>
    <table class="spec-table">
      <tr><td>Format réel</td><td>20 questions · 35 minutes</td></tr>
      <tr><td>Seuil éliminatoire</td><td>10/20</td></tr>
      <tr><td>Poids</td><td>40 % préliminaire · 35 % final</td></tr>
      <tr><td>Rythme moyen</td><td>1 min 45 par texte (35 min ÷ 20), à gérer toi-même</td></tr>
    </table>
    <p style="font-size:14px;">Format réel EPSO : un court texte, puis <b>quatre affirmations A/B/C/D dont une seule est correcte</b>, c'est-à-dire pleinement démontrée par le texte. Les trois autres sont fausses (contredites par le texte) ou indémontrables. Le texte est le seul univers qui existe : si une information n'y figure pas, tu ne peux pas la tenir pour vraie, même si elle te semble évidente.</p>
    <div class="warn-box"><b>Le piège n°1 :</b> l'affirmation « ne peut pas dire » qui sonne vraie parce que tu la sais vraie dans la réalité. Elle n'est PAS la bonne réponse si le texte ne la prouve pas. Une seule affirmation est entièrement soutenue par le texte : c'est elle, et elle seule, qu'il faut choisir.</div>
    <div class="info-box"><b>Méthode :</b> lis d'abord les affirmations, puis scanne le texte pour la portion pertinente. Méfie-toi des quantificateurs (tous / certains / uniquement / jamais) et des chiffres légèrement modifiés.</div>
    <div class="info-box"><b>Les textes ne parlent presque jamais de l'Union.</b> Vérifié sur l'épreuve blanche officielle : barrières commerciales alimentaires, stress post-traumatique, régression linéaire, cellules souches, haïku, Antarctique, chênes de Gambel. C'est délibéré, les connaissances européennes sont testées ailleurs. Cette banque suit la même répartition : la moitié des textes sont hors sujet européen, pour t'entraîner à ne rien tirer d'autre que du texte. La consigne officielle est exactement : « Parmi les propositions suivantes, laquelle est correcte ? »</div>
    <div class="info-box"><b>Chrono global :</b> comme au concours, tu reçois un temps unique pour toute la session (${Math.min(VERB_COUNT, VERBAL_BANK.length)} textes, ${fmtTime(Math.min(VERB_COUNT, VERBAL_BANK.length)*VERB_SEC)}). À toi de répartir : t'attarder sur un texte difficile, c'est autant de temps en moins pour les suivants. Le chrono se met en pause pendant que tu lis la correction.</div>

    <p class="eyebrow" style="color:var(--accent);margin:18px 0 8px;">MÉTHODE DÉTAILLÉE</p>
    <details class="mth"><summary>Les trois types d'affirmation</summary>
      <ul>
        <li><b>VRAI</b> : entièrement démontrable à partir du texte seul, sans aucune connaissance extérieure. Soit une reformulation directe, soit une conclusion solidement construite en croisant plusieurs passages.</li>
        <li><b>FAUX</b> : clairement contredite par le texte. Attention : « faux » ne veut pas dire « absent ». Il faut une information du texte qui démente réellement l'affirmation.</li>
        <li><b>NE PEUT PAS DIRE</b> : le texte ne permet ni de confirmer ni d'infirmer. C'est le piège central du test.</li>
      </ul>
      <p>Le NPD se décline en deux formes, d'inégale difficulté. Celui qui « sonne faux » d'après tes connaissances est facile à écarter. Celui qui <b>« sonne vrai » parce que tu sais qu'il est vrai dans la réalité</b> est le plus dangereux : ton instinct te pousse à le valider. Rappel absolu : la seule affirmation vraie est celle qui est prouvée par le texte.</p>
    </details>

    <details class="mth"><summary>Les expressions suspectes à repérer</summary>
      <ul>
        <li><b>Déterminants et quantités.</b> « certains, plusieurs, beaucoup, un certain nombre » désignent une partie ; « tous, chaque, l'ensemble » désignent la totalité sans exception. Ils ne sont jamais interchangeables : si le texte dit « de nombreux pays », une affirmation qui dit « tous les pays » est fausse.</li>
        <li><b>Fréquence.</b> « parfois, souvent, généralement, fréquemment, rarement, occasionnellement » sont tous relatifs. Les deux seuls absolus sont « jamais » et « toujours ».</li>
        <li><b>Temps et mode des verbes.</b> « jusqu'à ce que » + passé change tout le sens. « pourrait, devrait, sur le point de » expriment une possibilité ou une intention, jamais un fait acquis.</li>
        <li><b>Causalité contre chronologie.</b> « a entraîné, par conséquent, a résulté en » marquent une cause. Une simple succession dans le temps n'établit aucune cause. Ne jamais déduire un lien causal d'une chronologie.</li>
        <li><b>Général contre particulier.</b> Deux pièges inverses : la généralisation (étendre à toute une catégorie ce qui n'est dit que de certains cas) et la sur-précision (ajouter un détail que le texte ne fournit pas).</li>
        <li><b>Quasi-équivalence.</b> « sans modification majeure » n'est pas « n'a pas été modifié ». Des mots très proches peuvent cacher une différence de sens décisive.</li>
        <li><b>Omission.</b> Une affirmation qui ne reprend pas toute l'information du texte n'est pas fausse pour autant. Une information partielle mais exacte reste vraie.</li>
      </ul>
    </details>

    <details class="mth"><summary>L'ordre de lecture optimal</summary>
      <ul>
        <li>1. Lis d'abord les <b>quatre affirmations</b> et retiens leurs mots-clés et leurs thèmes. Tu cherches la seule qui soit pleinement démontrée par le texte.</li>
        <li>2. Lis le <b>texte</b> en te concentrant sur ces thèmes précis, plutôt que de tout mémoriser.</li>
        <li>3. Dès qu'une affirmation est clairement et entièrement confirmée par le texte, c'est la bonne : <b>valide et passe</b>. Temps gagné.</li>
        <li>4. Si tu hésites, élimine les autres une par une : celle qui est contredite par le texte est fausse, celle que le texte ne permet pas de prouver est « ne peut pas dire ». Il ne doit rester qu'une affirmation entièrement soutenue.</li>
      </ul>
      <p>Lire le texte en premier est l'instinct naturel, et c'est une perte de temps : tu mémorises des détails dont la plupart ne seront jamais interrogés.</p>
    </details>

    <details class="mth"><summary>S'entraîner efficacement</summary>
      <ul>
        <li>Commence sans chrono, en lisant des textes exigeants et en repérant à voix haute les expressions suspectes.</li>
        <li>Écris, avec tes mots, <b>pourquoi</b> chaque mauvaise option est fausse. C'est là que la compétence se construit, pas dans le nombre de questions enchaînées.</li>
        <li>Puis chronomètre-toi, et réduis progressivement le temps par question jusqu'à passer sous le rythme réel.</li>
        <li>Entraîne-toi <b>à l'écran</b> et non sur papier : le concours est informatisé, et lire sur écran est plus lent tant qu'on n'y est pas habitué.</li>
        <li>Recrée les conditions : pièce calme, sans interruption, minuteur lancé.</li>
      </ul>
      <p class="lede" style="font-size:15px;">Méthode adaptée de A. Baneth, <i>The Ultimate EU Test Book, Administrators</i>, chapitre 2.</p>
    </details>
    <button class="btn wide" id="startVerbal">Démarrer une session (${Math.min(VERB_COUNT, VERBAL_BANK.length)} textes · ${fmtTime(Math.min(VERB_COUNT, VERBAL_BANK.length)*VERB_SEC)} au total)</button>
  </div>`;
  document.getElementById('startVerbal').addEventListener('click', runVerbalSession);
}

    <p style="font-size:14px;">Ce test ne rapporte aucun point de classement, mais son échec élimine quel que soit ton score ailleurs. Stratégie : atteindre confortablement le seuil, sans y engloutir du temps de verbal.</p>
    <div class="info-box"><b>Numérique :</b> pourcentages, ratios, moyennes, taux de croissance, lecture de tableaux et graphiques. Pas de maths avancées, mais de la vitesse. Une partie des questions est générée avec des chiffres différents à chaque session. <b>Abstrait :</b> séquences de formes suivant une ou plusieurs règles simultanées.</div>

    <p class="eyebrow" style="color:var(--accent);margin:18px 0 8px;">MÉTHODE DÉTAILLÉE · ABSTRAIT</p>
    <details class="mth"><summary>Les deux types d'items, à ne pas confondre</summary>
      <p>Le test alterne deux exercices qui n'appellent pas du tout le même raisonnement. Se tromper de type coûte plus cher que se tromper de règle.</p>
      <ul>
        <li><b>La suite à compléter.</b> Quatre figures évoluent selon une transformation régulière, il faut produire la cinquième. On cherche une <b>progression</b> : que fait chaque étape par rapport à la précédente.</li>
        <li><b>L'ensemble régi par une règle.</b> Cinq figures partagent une propriété, il faut désigner la proposition qui la partage aussi. Il n'y a <b>aucune progression</b> : les figures ne sont pas ordonnées. La règle lie deux attributs entre eux, par exemple « flèche horizontale donc figure pleine, flèche verticale donc figure vide ». Chercher une évolution dans un item de ce type est le piège principal.</li>
      </ul>
      <p>Le réflexe qui distingue les deux : dans une suite, la première et la dernière figure diffèrent nettement. Dans un ensemble, les figures se ressemblent sans ordre apparent.</p>
    </details>

    <details class="mth"><summary>Méthode pour les items « même ensemble »</summary>
      <ul>
        <li>1. Dresse la liste des attributs présents : forme, remplissage, couleur, taille, traits, flèche, repère, nombre d'éléments.</li>
        <li>2. Écarte ceux qui prennent la même valeur partout : ils ne portent aucune règle.</li>
        <li>3. Parmi ceux qui varient, cherche <b>deux attributs qui varient ensemble</b>. C'est presque toujours une correspondance binaire : horizontal ou vertical, pair ou impair, grand ou petit, présent ou absent.</li>
        <li>4. Formule la règle en une phrase, puis teste-la sur les cinq figures de l'énoncé. Elle doit tenir sur les cinq, sans exception.</li>
        <li>5. Applique-la aux propositions. Une seule survit.</li>
      </ul>
      <p>Quand deux règles s'appliquent en même temps, une proposition qui n'en respecte qu'une est fausse. Vérifie systématiquement les deux avant de valider : c'est là que se perdent les points sur les items difficiles.</p>
    </details>

    <details class="mth"><summary>Les six familles de transformation</summary>
      <p>Quasiment toute question de raisonnement abstrait se ramène à une combinaison de six transformations élémentaires. Les connaître par cœur transforme la recherche en vérification.</p>
      <ul>
        <li><b>Forme</b> : un cercle devient un carré, un triangle un pentagone, ou le nombre de côtés évolue.</li>
        <li><b>Couleur (ou remplissage)</b> : une figure blanche devient noire, ou la teinte s'éclaircit ou s'assombrit par paliers.</li>
        <li><b>Taille</b> : la figure grandit ou rétrécit, en général d'un pas constant.</li>
        <li><b>Trait horizontal</b> : ajout ou suppression.</li>
        <li><b>Trait vertical</b> : ajout ou suppression.</li>
        <li><b>Permutation</b> : quand une case contient plusieurs figures, elles échangent leur position.</li>
      </ul>
      <p class="lede" style="font-size:15px;">Taxonomie issue de E. Hetru et C. Mercier, <i>Test de capacité de raisonnement abstrait</i>, ORSEU.</p>
    </details>

    <details class="mth"><summary>La méthode d'analyse, attribut par attribut</summary>
      <p>L'erreur classique est de fixer la séquence en espérant que la règle saute aux yeux. Procède au contraire par inventaire systématique.</p>
      <ul>
        <li>1. Liste les <b>attributs qui varient</b> d'une case à l'autre : forme, couleur, taille, traits, position, nombre d'éléments.</li>
        <li>2. Traite <b>un attribut à la fois</b>, en ignorant complètement les autres. Une règle par attribut.</li>
        <li>3. Vérifie ton hypothèse sur <b>toutes</b> les étapes, pas seulement sur les deux premières. Une règle qui marche de 1 à 2 mais pas de 2 à 3 est fausse.</li>
        <li>4. Méfie-toi des <b>attributs distracteurs</b> : un élément qui ne change jamais est là pour occuper ton attention.</li>
        <li>5. Une fois toutes les règles identifiées, applique-les à la dernière figure, puis cherche cette réponse parmi les options. Ne pars jamais des options.</li>
      </ul>
    </details>

    <details class="mth"><summary>Gérer le temps et les pièges</summary>
      <ul>
        <li>Les questions sont classées par <b>difficulté croissante</b> : les premières valent autant de points que les dernières, donc sécurise-les sans précipitation.</li>
        <li>Il n'est pas nécessaire de tout traiter pour réussir. Mieux vaut un bloc de réponses justes qu'un test entier bâclé.</li>
        <li>Si une question résiste après deux hypothèses testées, passe. Y revenir plus tard avec un œil neuf coûte moins cher que s'acharner.</li>
        <li>Piège fréquent des options : une réponse correcte sur l'attribut le plus visible mais fausse sur un attribut secondaire. Vérifie chaque attribut avant de valider.</li>
      </ul>
    </details>
    <button class="btn wide" id="startNum" style="margin-bottom:8px;">Session numérique (${NUM_COUNT} questions · 20 min au total · chiffres renouvelés)</button>
    <button class="btn wide" id="startAbs">Session abstraite (${ABS_COUNT} séries · 10 min au total)</button>
  </div>`;
  document.getElementById('startNum').addEventListener('click',()=>runQCMSession(mkNumericPool(),'numeric',NUM_SEC,'Numérique','Test 2','numabs',NUM_COUNT));
  document.getElementById('startAbs').addEventListener('click', runAbstractSession);
}
function runAbstractSession(){
  const app = document.getElementById('app');
  const count = ABS_COUNT;
  let series = mkAbsSeries(count);
  let order = series.map((_,i)=>i);
  let idx=0, score=0, timeLeft=count*ABS_SEC, timer=null, answered=false, ended=false, view=null;
  function startClock(){
    clearInterval(timer);
    timer=ACTIVE_TIMER=setInterval(()=>{
      timeLeft--; const t=document.getElementById('tmr');
      if(t){t.textContent=fmtTime(timeLeft); if(timeLeft<=30) t.classList.add('low');}
      if(timeLeft<=0){clearInterval(timer); endSession(true);}
    },1000);
  }
  function renderQ(){
    answered=false;
    const item = series[order[idx]];
    view = shuffleOpts(item);
    app.innerHTML = '<div class="card">'
      +'<div class="section-title"><span class="eyebrow">Abstrait · '+(idx+1)+' / '+order.length+'</span>'
      +'<span class="q-count" id="sc">Score : '+score+' / '+idx+'</span></div>'
      +'<div class="timer-wrap"><span class="timer-txt" id="tmr">'+fmtTime(timeLeft)+'</span></div>'
      +'<div class="session-prog"><i style="width:'+Math.round(100*idx/order.length)+'%"></i></div>'
      +'<p style="font-size:16px;">'+(item.kind==='set'
          ? 'Ces cinq figures respectent toutes une même règle. Laquelle des propositions respecte la même règle ?'
          : 'Quelle forme complète la séquence ?')+'</p>'
      /* Deux groupes de figures cohabitent : sans intitulés, on confond l'énoncé
         avec les propositions, et c'est le piège même de ce type d'item. */
      +'<p class="abs-caption">'+(item.kind==='set'?'Énoncé':'La séquence')+'</p>'
      +'<div class="abs-sequence">'
      + (item.kind==='set'
          ? item.seq.map(s=>'<div class="abs-shape-box">'+shapeSVG(s)+'</div>').join('')
          : item.seq.map(s=>'<div class="abs-shape-box">'+shapeSVG(s)+'</div>').join('<span class="abs-arrow">→</span>')
            +'<span class="abs-arrow">→</span><div class="abs-q">?</div>')
      +'</div>'
      +'<p class="abs-caption">Propositions</p>'
      +'<div class="abs-options" id="absOpts">'
      + view.opts.map((o,i)=>'<button class="abs-opt" data-i="'+i+'"><span class="abs-letter">'+String.fromCharCode(65+i)+'</span>'+shapeSVG(o)+'</button>').join('')
      +'</div><div id="fb"></div>'
      +'<button class="btn wide hidden" id="nextBtn" style="margin-top:12px;">Suivant →</button></div>'
      +'<div class="quit-row"><button id="exitBtn">Quitter la session</button></div>';
    document.getElementById('exitBtn').addEventListener('click',()=>goTo('numabs'));
    app.querySelectorAll('.abs-opt').forEach(b=>b.addEventListener('click',()=>submit(parseInt(b.dataset.i))));
    document.getElementById('nextBtn').addEventListener('click',()=>{
      idx++;
      if(idx<order.length){ renderQ(); startClock(); } else { endSession(false); }
    });
  }
  function submit(choice){
    if(answered) return; answered=true; clearInterval(timer);
    const item = series[order[idx]];
    const ok = choice===view.c;
    if(ok) score++;
    PROGRESS.abstract.att++; if(ok) PROGRESS.abstract.cor++;
    saveProgress(); renderStreak();
    const sc = document.getElementById('sc');
    if(sc) sc.textContent = 'Score : '+score+' / '+(idx+1);
    app.querySelectorAll('.abs-opt').forEach((b,i)=>{
      b.disabled=true;
      if(i===view.c) b.classList.add('correct');
      else if(i===choice) b.classList.add('incorrect');
    });
    document.getElementById('fb').innerHTML = '<div class="feedback '+(ok?'ok':'no')+'">'+(ok?'✓ Correct. ':'✗ Incorrect. ')+item.ex+'</div>';
    document.getElementById('nextBtn').classList.remove('hidden');
  }
  function endSession(timedOut){
    if(ended) return; ended=true;
    clearInterval(timer);
    app.innerHTML = '<div class="card session-end"><span class="eyebrow">'+(timedOut?'Temps écoulé':'Session terminée')+'</span><div class="n">'+score+'/'+order.length+'</div>'
      +(timedOut?'<p style="color:var(--bad);">Temps imparti écoulé : '+(order.length-idx)+' série(s) non traitée(s).</p>':'')
      +'<button class="btn" id="againBtn">Refaire une session</button>'
      +'<button class="btn ghost" id="backBtn" style="margin-top:8px;">Retour</button></div>';
    document.getElementById('againBtn').addEventListener('click',()=>{
      series=mkAbsSeries(count); order=series.map((_,i)=>i); idx=0; score=0; timeLeft=count*ABS_SEC; ended=false;
      renderQ(); startClock();
    });
    document.getElementById('backBtn').addEventListener('click',()=>goTo('numabs'));
  }
  renderQ();
  startClock();
}

function renderEufte(){

  let seconds = 40*60, timer=null, running=false, finished=false;
  async function loadDraft(){
    try{ const r = await window.storage.get('epso-eufte-draft'); return r&&r.value?r.value:''; }catch(e){ return ''; }
  }
  function saveDraft(txt){ try{ window.storage.set('epso-eufte-draft', txt).catch(()=>{}); }catch(e){} }
  loadDraft().then(draft=>{
    app.innerHTML = `
    <div class="card">
      <span class="eyebrow">Test 5 · EUFTE (Free-Text Essay on EU Matters) · <span class="pill l2">en Langue 2 (anglais)</span></span>
      <h2>L'écrit final</h2>
      <table class="spec-table">
        <tr><td>Format réel</td><td>consigne professionnelle à partir d'un document source · 40 minutes</td></tr>
        <tr><td>Notation</td><td>sur 10 · seuil 5/10</td></tr>
        <tr><td>Poids</td><td>15 % de la note finale (ne compte pas au préliminaire)</td></tr>
        <tr><td>Qui le passe</td><td>le top ~2 235 du classement préliminaire (1,5×)</td></tr>

      </table>
      <div class="warn-box">Ce n'est pas une dissertation d'opinion. L'épreuve blanche officielle donne un rôle, un destinataire et un type de document à produire, à partir d'un rapport source. La consigne demande par exemple une <b>note d'information avec éléments de langage</b> pour un directeur général. L'essai se rédige en <b>Langue 2</b>.</div>

      <details class="mth"><summary>Les cinq critères d'évaluation publiés par EPSO</summary>
        <p>EPSO appelle ces critères des « anchors ». Ils portent sur la communication écrite : ce n'est ni un test de langue, ni un test de connaissances.</p>
        <ul>${EUFTE_ANCHORS.map(a=>'<li>'+a+'</li>').join('')}</ul>
        <p class="lede" style="font-size:15px;">Le cinquième est le plus discriminant : un texte brillant qui n'exploite pas le document fourni est mal noté.</p>
      </details>

      <div class="essay-meta"><span>Sujet <b id="taskNum"></b> sur ${EUFTE_TASKS.length}</span>
        <button class="btn ghost" id="newTask" style="padding:11px 16px;min-height:44px;font-size:14.5px;">Changer de sujet</button></div>
      <div id="taskZone"></div>

      <div class="essay-meta">
        <span id="timerDisp" style="font-size:16px;font-weight:600;">40:00</span>
        <span id="wc">0 mots</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button class="btn" id="startTimer">Chrono 40 min</button>
        <button class="btn ghost" id="resetTimer">Réinitialiser</button>
      </div>
      <textarea class="essay-area" id="essayArea" placeholder="Rédige ici, en Langue 2. Brouillon enregistré automatiquement.">${draft}</textarea>
      <div id="modelZone"></div>
    </div>
    <div class="card">
      <h2 style="font-size:16px;">Répartition des 40 minutes</h2>
      <p style="font-size:13.5px;"><b>8 min</b> · lire le document source et repérer une idée exploitable par constatation. <b>4 min</b> · poser le plan : objet, constat, position, éléments de langage, point de vigilance. <b>24 min</b> · rédaction. <b>4 min</b> · relecture langue.</p>
      <div class="info-box">Le piège de temps est la lecture. Le document source contient plus de matière que nécessaire : une constatation exploitée à fond vaut mieux que cinq survolées.</div>
    </div>
    <div class="card">
      <h2 style="font-size:16px;">Grille d'auto-évaluation</h2>
      ${CHECKLIST.map((c,i)=>'<label class="checklist-item"><input type="checkbox" id="chk'+i+'"><span>'+c+'</span></label>').join('')}
      <button class="btn wide" id="finishBtn" style="margin-top:12px;">Terminer cette session</button>
    </div>`;

    function showTask(){
      const t = EUFTE_TASKS[taskIdx];
      document.getElementById('taskNum').textContent = (taskIdx+1);
      document.getElementById('taskZone').innerHTML =
         '<div class="essay-prompt">'+t.brief+'</div>'
        +'<p class="eyebrow" style="color:var(--accent);margin:14px 0 8px;">DOCUMENT SOURCE · '+t.source.toUpperCase()+'</p>'
        + t.sources.map(x=>'<div class="passage-box" style="font-size:13.5px;">'+x+'</div>').join('');

        +'<div class="info-box" style="margin-bottom:12px;">À lire seulement après avoir rédigé. Cette version vise le haut de la grille sur les cinq critères. Elle n\'est pas la seule possible : c\'est la méthode qui compte, pas les formulations.</div>'

    const timerDisp = document.getElementById('timerDisp');
