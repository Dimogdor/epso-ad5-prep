<p><b>Cadre et objectifs.</b> La politique de l'emploi de l'Union repose sur les articles 3 (traité UE) et 145-150, 156-159, 162-164 (traité FUE). L'UE œuvre en faveur du <span class="kb-fact">plein emploi</span> et du progrès social, les États membres conservant la responsabilité première. Elle coordonne les politiques via le <span class="kb-fact">Semestre européen</span> et les <span class="kb-fact">lignes directrices pour l'emploi</span>, adoptées par le Conseil après consultation du Parlement.</p><p><b>Stratégies et objectifs 2030.</b> La <span class="kb-fact">stratégie Europe 2020</span> (2010) a fixé un taux d'emploi de 75 % pour les 20-64 ans. Le <span class="kb-fact">Socle européen des droits sociaux</span> (2017, 20 principes) et son plan d'action (2021) relèvent les ambitions : <span class="kb-fact">78 % de taux d'emploi</span> et <span class="kb-fact">60 % de participation à la formation annuelle</span> d'ici <span class="kb-fact">2030</span>. Le <span class="kb-fact">Fonds social européen Plus</span> (FSE+) est l'outil principal de financement.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Santé et sécurité au travail`, body:`
<p><b>Fondement et portée</b> L'Union développe une approche commune de la santé et sécurité au travail via des directives fixant des normes minimales. La base juridique s'appuie notamment sur les <span class="kb-fact">articles 151 et 153 du traité FUE</span> (le Parlement européen cite aussi les articles 91, 114, 115 et 352 selon les domaines couverts). Les États membres restent libres d'adopter des protections plus strictes.</p><p><b>Cadre législatif et institutions</b> La <span class="kb-fact">directive-cadre 89/391/CEE</span>, adoptée en <span class="kb-fact">1989</span>, pose le principe de prévention et s'accompagne de <span class="kb-fact">25 directives spécifiques</span> (lieux de travail, équipements, agents dangereux, travailleurs vulnérables). L'<span class="kb-fact">Agence européenne pour la sécurité et la santé au travail (EU-OSHA)</span>, créée en <span class="kb-fact">1994</span>, promeut la prévention des risques. Le <span class="kb-fact">socle européen des droits sociaux (2017)</span> et le <span class="kb-fact">cadre stratégique 2021-2027</span> complètent cette architecture.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Droit des travailleurs d'être informés, consultés et associés`, body:`
<p><b>Droit des travailleurs d'être informés, consultés et associés</b></p><p>Le droit des travailleurs à l'information, la consultation et la participation aux décisions d'entreprise s'inscrit dans la protection sociale et l'amélioration des conditions de travail de l'Union. Encadré par les <span class="kb-fact">articles 5, 114, 115, 151 et 153 du traité FUE</span>, ce cadre repose sur quatre ensembles de directives : l'<span class="kb-fact">information-consultation basique</span> (licenciements collectifs, transferts), le contexte <span class="kb-fact">transnational</span> (comités d'entreprise européens), les <span class="kb-fact">droits de participation</span> (sociétés européennes), et les <span class="kb-fact">accords intersectoriels</span> (télétravail, stress professionnel). La <span class="kb-fact">directive (UE) 2025/2450</span> a renforcé en novembre 2025 les droits concernant les comités d'entreprise européens en garantissant les ressources nécessaires et l'application des dispositions.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Dialogue social`, body:`
<p><b>Concept</b> Le dialogue social désigne tous les types de négociation, de consultation et d'échange d'informations entre les <span class="kb-fact">partenaires sociaux</span> (employeurs et travailleurs) sur les politiques économiques, de l'emploi et sociales. Il constitue un élément fondamental du modèle social européen.</p><p><b>Bases légales et institution</b> Régi par les <span class="kb-fact">articles 151 à 156 du traité FUE</span>, le dialogue social est encadré notamment par l'article <span class="kb-fact">154</span> (consultation obligatoire avant mesures sociales) et l'article <span class="kb-fact">155</span> (négociation d'accords). Le <span class="kb-fact">Comité du dialogue social</span> (CDS), créé en <span class="kb-fact">1992</span>, en est l'organe principal.</p><p><b>Accomplissements</b> Lancé en <span class="kb-fact">1985</span> par Jacques Delors, le processus de Val Duchesse a abouti à des accords-cadres majeurs : <span class="kb-fact">congé parental (1995)</span>, <span class="kb-fact">travail à temps partiel (1997)</span>, <span class="kb-fact">travail à durée déterminée (1999)</span>, tous transposés en directives. Le <span class="kb-fact">traité d'Amsterdam (1997)</span> et le <span class="kb-fact">socle européen des droits sociaux (2017)</span> ont renforcé ce rôle institutionnel.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Égalité entre les hommes et les femmes`, body:`
<p><b>Cadre et objectifs</b> L'égalité entre les hommes et les femmes est un objectif fondateur de l'UE, ancré aux articles 2 et 3 du traité UE et aux articles 8, 19, 153 et 157 du TFUE. Le principe d'égalité des rémunérations est inscrit dans les traités depuis <span class="kb-fact">1957</span> (aujourd'hui article 157 TFUE). L'Union vise l'égalité salariale, l'égalité de traitement en emploi, les actions positives pour le sexe sous-représenté, et la lutte contre les discriminations et la violence de genre.</p><p><b>Législation et institutions</b> <span class="kb-fact">Quatorze directives principales</span> ont ete adoptees depuis la directive <span class="kb-fact">79/7/CEE (1978)</span> sur la sécurité sociale. La <span class="kb-fact">convention d'Istanbul</span> est entree en vigueur pour l'UE le <span class="kb-fact">1er octobre 2023</span>. Le <span class="kb-fact">socle européen des droits sociaux (2017)</span> compte l'égalité parmi ses 20 principes. L'<span class="kb-fact">EIGE</span> (Institut européen pour l'égalité entre les hommes et les femmes) publie l'indice de l'égalité de genre : <span class="kb-fact">63,4 points sur 100</span> en 2025.</p>`},

{section:"Marché intérieur et politiques économiques", title:`La lutte contre la pauvreté, l'exclusion sociale et les discriminations`, body:`
<p><b>Cadre et objectifs.</b> Depuis le <span class="kb-fact">traité d'Amsterdam (1999)</span>, l'Union européenne lutte contre la pauvreté et l'exclusion sociale par coopération entre États membres (<span class="kb-fact">article 153 du TFUE</span>). L'<span class="kb-fact">article 19 du TFUE</span> autorise des mesures anti-discrimination contraignantes. Le <span class="kb-fact">Socle européen des droits sociaux (2017)</span> place la protection et l'inclusion sociales parmi ses trois grands axes.</p>

<p><b>Objectifs chiffrés et financement.</b> La stratégie <span class="kb-fact">Europe 2020</span> visait à réduire de <span class="kb-fact">25 %</span> la pauvreté et à sortir plus de <span class="kb-fact">20 millions</span> de personnes de la pauvreté avant 2020 (objectif non atteint). Le plan d'action de <span class="kb-fact">mars 2021</span> fixe un nouvel objectif pour 2030 : réduire d'au moins <span class="kb-fact">15 millions</span> de personnes la pauvreté, dont au moins <span class="kb-fact">5 millions d'enfants</span>. Le <span class="kb-fact">Fonds social européen plus (FSE+)</span> dispose de <span class="kb-fact">99,3 milliards d'euros</span> pour 2021-2027, avec <span class="kb-fact">25 %</span> affectés à l'inclusion sociale. Des directives encadrent l'égalité de traitement, adoptées en <span class="kb-fact">2000</span> (égalité raciale et égalité en matière d'emploi) et en <span class="kb-fact">2006</span> (égalité hommes-femmes).</p>`},

{section:"Marché intérieur et politiques économiques", title:`Principes généraux de la politique industrielle de l'Union européenne`, body:`
<p><b>De quoi s'agit-il ?</b> La politique industrielle de l'Union vise à accélérer l'adaptation de l'industrie aux changements structurels, à favoriser l'initiative des entreprises et leur coopération. Elle trouve son origine dans la CEE de <span class="kb-fact">1957</span>, mais n'a été explicitement intégrée dans les traités qu'avec le <span class="kb-fact">traité de Maastricht de 1992</span>. Sa base juridique actuelle est l'<span class="kb-fact">article 173 du traité sur le fonctionnement de l'Union européenne</span>, qui confie à l'Union et à ses États membres la responsabilité d'assurer les conditions de la compétitivité industrielle.</p><p><b>Évolution récente</b> Depuis le <span class="kb-fact">Pacte vert de 2019</span>, la politique s'oriente vers la décarbonation. Le <span class="kb-fact">Pacte pour une industrie propre (février 2025)</span> mobilise plus de <span class="kb-fact">100 milliards d'euros</span> pour les secteurs intensifs en énergie. En <span class="kb-fact">2024</span>, l'industrie manufacturière représentait <span class="kb-fact">14,3 %</span> du PIB de l'Union ; une proposition de <span class="kb-fact">mars 2026</span> sur l'accélération des capacités industrielles vise <span class="kb-fact">20 %</span> d'ici 2035.</p>`},

{section:"Marché intérieur et politiques économiques", title:`L'énergie nucléaire`, body:`
<p><b>Cadre et objectifs.</b> Le <span class="kb-fact">traité Euratom</span> établit le cadre juridique du secteur nucléaire civil de l'Union. La politique de l'Union poursuit quatre objectifs : garantir des normes élevées en sûreté nucléaire et radioprotection, gérer les déchets radioactifs et le combustible usé, soutenir la recherche et les investissements, et développer des relations pacifiques avec les pays tiers. Suite à l'accident de <span class="kb-fact">Fukushima (2011)</span>, l'Union a renforcé son cadre de sûreté, imposant des autoévaluations tous les <span class="kb-fact">dix ans</span> et des examens externes tous les <span class="kb-fact">six ans</span>. Directives cles : <span class="kb-fact">2013/59/Euratom</span> (radioprotection), <span class="kb-fact">2011/70/Euratom</span> (déchets radioactifs).</p><p><b>Financement et investissements.</b> Le programme Euratom 2021-2025 disposait de <span class="kb-fact">1,38 milliard d'euros</span>, celui de 2026-2027 de <span class="kb-fact">330 millions d'euros</span>. Le huitième programme indicatif nucléaire estime les besoins d'investissement à <span class="kb-fact">241 milliards d'euros d'ici à 2050</span>, pour la prolongation des réacteurs existants et la construction de nouveaux réacteurs.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Petites et moyennes entreprises`, body:`
<p><b>Cadre et définition.</b> Les petites et moyennes entreprises (PME) représentent <span class="kb-fact">99,8 %</span> des entreprises de l'Union et employaient environ <span class="kb-fact">89,8 millions de personnes en 2024</span>. La recommandation <span class="kb-fact">2003/361/CE</span> les définit comme des entreprises de moins de <span class="kb-fact">250 salariés</span>, avec un chiffre d'affaires annuel n'excédant pas <span class="kb-fact">50 millions d'euros</span> ou un total de bilan annuel n'excédant pas <span class="kb-fact">43 millions d'euros</span>. La base juridique repose sur le <span class="kb-fact">traité FUE</span> (articles 101-109 sur la concurrence, 110-113 sur la fiscalité, 49-54 sur le droit d'établissement).</p><p><b>Initiatives majeures.</b> Le <span class="kb-fact">Small Business Act de 2008</span> a lancé un cadre politique complet. La directive sur les retards de paiement oblige les pouvoirs publics à payer dans un délai de <span class="kb-fact">30 jours</span>. La directive sur la facturation électronique assimile les factures numériques aux factures papier. La directive <span class="kb-fact">Omnibus I (février 2026)</span> simplifie les obligations de durabilité pour les PME. Le programme <span class="kb-fact">Horizon Europe (2021-2027)</span> dote le Conseil européen de l'innovation de <span class="kb-fact">10,1 milliards d'euros</span> pour soutenir l'innovation des jeunes pousses et des PME.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Une stratégie numérique pour l'Europe`, body:`
<p><b>Objectif et cadre</b> : <span class="kb-fact">Une stratégie numérique pour l'Europe</span> vise à donner aux citoyens et entreprises les moyens de jouir d'un avenir numérique centré sur l'humain, sûr et durable. Fondée sur le <span class="kb-fact">traité FUE</span>, elle repose sur la <span class="kb-fact">Boussole numérique 2030</span> (adoptée en mars 2021), fixant quatre domaines d'objectifs : compétences, entreprises, infrastructures, services publics.</p><p><b>Cibles et piliers réglementaires</b> : d'ici 2030, <span class="kb-fact">80 % des adultes</span> doivent avoir des compétences numériques de base ; <span class="kb-fact">75 % des entreprises</span> utiliser cloud, mégadonnées et IA ; l'UE doit produire <span class="kb-fact">20 % des semi-conducteurs mondiaux</span>. Règlements clés : <span class="kb-fact">DSA et DMA</span> (en vigueur mai 2023), <span class="kb-fact">loi sur l'IA</span> (adoptée mars 2024, en vigueur août 2024), <span class="kb-fact">eIDAS 2.0</span> (mai 2024), directive <span class="kb-fact">SRI 2</span> (cybersécurité). Financement via le programme Europe numérique : <span class="kb-fact">7,5 milliards EUR</span> (2021-2027).</p>`},

{section:"Marché intérieur et politiques économiques", title:`L'industrie de la défense`, body:`
<p><b>Objet et base juridique.</b> La politique industrielle de défense de l'UE vise à renforcer l'autonomie stratégique et la compétitivité de l'industrie européenne, tout en réduisant la fragmentation du marché. Elle s'appuie sur les articles <span class="kb-fact">173, 182 et 346 du TFUE</span> : soutien à la compétitivité industrielle, financement de la recherche et technologie, et exemption des mesures de défense des règles du marché intérieur.</p><p><b>Acteurs et instruments.</b> L'<span class="kb-fact">Agence européenne de défense</span>, créée en <span class="kb-fact">juillet 2004</span>, coordonne le développement des capacités et la coopération en armement entre États membres. Le <span class="kb-fact">Fonds européen de défense</span>, opérationnel depuis le <span class="kb-fact">1er janvier 2021</span>, dispose d'un budget d'environ <span class="kb-fact">8 milliards d'euros</span> sur la période 2021-2027 pour financer la recherche et les capacités communes. Le Parlement européen, initialement simple donneur de signaux politiques, est devenu un acteur central de colégislation et de contrôle budgétaire sur ces dossiers.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Recherche et développement technologique`, body:`
<p><b>Objectifs et financement</b> La politique de recherche et développement technologique de l'UE vise à renforcer l'excellence scientifique, l'innovation et la compétitivité mondiale. <span class="kb-fact">Horizon Europe (2021-2027)</span> constitue le principal mécanisme de financement avec un budget de <span class="kb-fact">93,5 milliards d'euros</span>. La politique favorise la mobilité des chercheurs et des connaissances dans l'Espace européen de la recherche.</p>
<p><b>Instruments et résultats</b> Le <span class="kb-fact">premier programme-cadre lancé en 1983</span> a connu neuf itérations. <span class="kb-fact">COST, fondé en 1971</span>, est le réseau de recherche transfrontalière majeur avec <span class="kb-fact">40+ membres et 60 000 chercheurs actifs</span>. L'<span class="kb-fact">Institut européen d'innovation et de technologie (2008)</span> relie l'enseignement supérieur, la recherche, les entreprises et les investisseurs. Le Parlement européen plaide pour une dépense d'<span class="kb-fact">au moins 3 % du PIB</span> en R&D.</p>`},

{section:"Marché intérieur et politiques économiques", title:`La politique de l'innovation`, body:`
<p><b>Définition et objectifs</b> La politique de l'innovation de l'Union vise à permettre à la recherche d'aboutir à de nouveaux produits et services, créant des emplois et renforçant la compétitivité mondiale. Sa base juridique repose sur l'<span class="kb-fact">article 173 TFUE</span> (compétitivité industrielle) et les <span class="kb-fact">articles 179 à 190 TFUE</span> (politique de recherche et de développement technologique). L'Union ne consacre que <span class="kb-fact">2,24 % de son PIB</span> à la R&D en 2024, contre <span class="kb-fact">3,45 % aux États-Unis</span> et <span class="kb-fact">4,96 % en Corée du Sud</span>.</p><p><b>Instruments et cadre récent</b> Le programme phare <span class="kb-fact">Horizon Europe</span> dispose de <span class="kb-fact">93,4 milliards d'euros</span> pour la période 2021-2027. Le <span class="kb-fact">Conseil européen de l'innovation</span> (CEI) dispose d'un budget de <span class="kb-fact">10,1 milliards d'euros</span>, avec 1,4 milliard d'euros de possibilités de financement pour les technologies stratégiques en 2025. La <span class="kb-fact">Boussole pour la compétitivité</span> (<span class="kb-fact">janvier 2025</span>) et le <span class="kb-fact">Pacte pour une industrie propre</span> (<span class="kb-fact">février 2025</span>) forment le cadre stratégique récent, ce dernier mobilisant plus de 100 milliards d'euros pour l'industrie propre.</p>`},

{section:"Marché intérieur et politiques économiques", title:`La politique de l'énergie : principes généraux`, body:`
<p><b>Base juridique et objectifs</b> : la politique énergétique de l'UE repose sur <span class="kb-fact">l'article 194 du traité FUE</span> et poursuit quatre objectifs : fonctionnement du marché intérieur de l'énergie, sécurité d'approvisionnement, promotion de l'efficacité énergétique et des énergies renouvelables, interconnexion des réseaux.</p><p><b>Programmes clés</b> : le <span class="kb-fact">Pacte vert</span> (lancé en 2019), complété par le paquet <span class="kb-fact">Ajustement à l'objectif 55 (2021)</span>, vise <span class="kb-fact">-55 % d'émissions nettes d'ici 2030</span>. Le plan <span class="kb-fact">REPowerEU (2022)</span> a mobilisé près de <span class="kb-fact">300 milliards d'euros</span> pour réduire la dépendance aux combustibles fossiles russes. La <span class="kb-fact">directive RED III (2023)</span> fixe <span class="kb-fact">42,5 % d'énergies renouvelables d'ici 2030</span> (cible ambitieuse de 45 %), et la directive efficacité énergétique vise <span class="kb-fact">-11,7 % de consommation finale d'ici 2030</span>. Le Parlement, via sa commission <span class="kb-fact">ITRE (90 membres)</span>, est colégislateur ; le <span class="kb-fact">règlement (UE) 2026/261</span>, adopté le 26 janvier 2026, organise la sortie progressive du gaz russe (GNL et gazoduc) d'ici l'automne 2027.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Efficacité énergétique`, body:`
<p><b>Cadre juridique et objectifs</b> L'article <span class="kb-fact">194</span> du traité sur le fonctionnement de l'UE fait de l'énergie une compétence partagée. La directive relative à l'efficacité énergétique de <span class="kb-fact">2023</span> (directive <span class="kb-fact">2023/1791</span>) fixe une réduction de <span class="kb-fact">11,7 %</span> de la consommation d'énergie finale de l'UE d'ici 2030, plafonnée à <span class="kb-fact">763 Mtep</span>, et une baisse annuelle pouvant atteindre <span class="kb-fact">1,9 %</span> pour le secteur public.</p><p><b>Mesures clés</b> Les États rénovent au moins <span class="kb-fact">3 %</span> des bâtiments publics de plus de 250 m2 chaque année. Les bâtiments publics neufs doivent être à émissions nulles dès <span class="kb-fact">2028</span>, tous les bâtiments neufs dès <span class="kb-fact">2030</span>. La stratégie de la vague de rénovations vise <span class="kb-fact">35 millions</span> de bâtiments rénovés d'ici 2030. Les aides aux chaudières à combustibles fossiles autonomes cessent dès <span class="kb-fact">2025</span>.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Énergies renouvelables`, body:`
<p><b>Énergies renouvelables.</b> L'Union européenne développe les énergies éolienne, solaire, hydroélectrique, marine et géothermique pour atteindre ses objectifs climatiques. L'<span class="kb-fact">article 194 du traité sur le fonctionnement de l'Union européenne (TFUE)</span> établit sa compétence en matière de politique énergétique.</p>

<p><b>Objectifs et directive.</b> La directive sur les énergies renouvelables fixe un objectif global d'au moins <span class="kb-fact">42,5 % d'énergies renouvelables dans la consommation finale d'énergie de l'Union d'ici 2030</span>, avec des sous-objectifs sectoriels : <span class="kb-fact">42 % d'hydrogène renouvelable dans l'industrie</span>, <span class="kb-fact">49 % dans le bâtiment</span> et <span class="kb-fact">29 % dans les transports</span>. Le <span class="kb-fact">pacte vert pour l'Europe (2019)</span> et le pacte pour une industrie propre (<span class="kb-fact">février 2025</span>) forment le cadre stratégique, appuyés par les <span class="kb-fact">réseaux transeuropéens de l'énergie (RTE-E)</span> et un mécanisme de financement dédié.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Politique environnementale : principes généraux et cadre d'action`, body:`
<p><b>Fondement et cadre</b> La politique environnementale de l'Union européenne repose sur les <span class="kb-fact">articles 11 et 191 à 193 du traité sur le fonctionnement de l'Union européenne</span>. Elle s'appuie sur quatre principes directeurs : <span class="kb-fact">précaution, prévention, correction à la source, et pollueur payeur</span>. Le <span class="kb-fact">huitième programme d'action pour l'environnement</span>, entré en vigueur en <span class="kb-fact">mai 2022</span>, fixe le cadre jusqu'à fin 2030.</p><p><b>Objectifs clés</b> L'Union vise une réduction de <span class="kb-fact">55 % des émissions de gaz à effet de serre d'ici 2030</span> (par rapport à 1990) et la <span class="kb-fact">neutralité climatique en 2050</span>, objectifs fixés par la <span class="kb-fact">loi européenne sur le climat (2021)</span>. En <span class="kb-fact">juin 2024</span>, le <span class="kb-fact">règlement sur la restauration de la nature</span> a été adopté pour restaurer au moins 30 % des zones terrestres et marines d'ici 2030. L'<span class="kb-fact">Agence européenne pour l'environnement</span> (créée en 1999) appuie la mise en œuvre.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Lutte contre le changement climatique`, body:`
<p><b>Fondement et objectifs</b> L'Union européenne se place parmi les puissances économiques les plus actives en matière de lutte contre les émissions de gaz à effet de serre (GES). Fondée sur l'article <span class="kb-fact">191</span> du traité sur le fonctionnement de l'Union, la politique climatique de l'UE poursuit la neutralité carbone d'ici à <span class="kb-fact">2050</span> et une réduction d'au moins <span class="kb-fact">55 %</span> des émissions d'ici à <span class="kb-fact">2030</span>, conformément à l'accord de Paris (<span class="kb-fact">2015</span>).</p><p><b>Instruments clés</b> Le <span class="kb-fact">Système d'échange de quotas d'émission (SEQE-UE)</span>, établi en <span class="kb-fact">2005</span>, est le premier et plus vaste marché international du carbone, couvrant environ <span class="kb-fact">10 000</span> installations. Le <span class="kb-fact">Pacte vert pour l'Europe</span> (<span class="kb-fact">2019</span>) et la Loi européenne sur le climat (<span class="kb-fact">2021</span>) en constituent les piliers. Depuis <span class="kb-fact">2023</span>, le SEQE-UE s'étend au transport maritime, et un mécanisme d'ajustement carbone aux frontières lutte contre les fuites de carbone.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Biodiversité, utilisation des sols et foresterie`, body:`
<p><b>Cadre juridique et stratégies</b> La protection de la biodiversité relève des articles <span class="kb-fact">191 à 193 du traité sur le fonctionnement de l'Union européenne</span>. Le Pacte vert pour l'Europe (adopté le <span class="kb-fact">11 décembre 2019</span>) a introduit trois stratégies : la stratégie en faveur de la biodiversité à l'horizon 2030 (20 mai 2020) visant à restaurer la biodiversité d'ici à 2030, la stratégie pour les forêts 2030 (16 juillet 2021) et la stratégie pour les sols 2030 (17 novembre 2021).</p><p><b>Réalisations et défis</b> Le réseau <span class="kb-fact">Natura 2000</span> couvre <span class="kb-fact">1 295 000 km²</span> et regroupe plus de <span class="kb-fact">27 000 sites</span> protégés. Les objectifs clés incluent une protection juridique pour au moins <span class="kb-fact">30 % des terres</span> et <span class="kb-fact">30 % des mers</span> d'ici à 2030, zéro artificialisation nette des terres d'ici à 2050, et la plantation de <span class="kb-fact">3 milliards d'arbres</span> supplémentaires. Cependant, selon l'Agence européenne pour l'environnement (2025), seuls <span class="kb-fact">27,5 % des espèces</span> et <span class="kb-fact">14,7 % des habitats</span> présentent un bon état de conservation.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Protection et gestion des eaux`, body:`
<p><b>Cadre général</b> La politique de l'eau de l'Union repose sur la <span class="kb-fact">directive-cadre sur l'eau (2000/60/CE)</span>, qui protège les eaux de surface, de transition, côtières et souterraines et vise un <span class="kb-fact">bon état de l'ensemble des masses d'eau</span>. Sa base juridique se trouve aux <span class="kb-fact">articles 191 à 193 du traité sur le fonctionnement de l'Union européenne (TFUE)</span>.</p><p><b>Dimension marine et stratégies</b> La <span class="kb-fact">directive-cadre stratégie pour le milieu marin (2008/56/CE)</span> vise le bon état écologique des mers, en coopération avec les pays voisins via <span class="kb-fact">quatre conventions régionales</span> (OSPAR, Helsinki, Barcelone, Bucarest). En <span class="kb-fact">juin 2025</span>, l'UE a adopté une stratégie européenne de résilience pour l'eau face aux défis climatiques. Depuis l'initiative citoyenne <span class="kb-fact">Right2Water (2013)</span>, le Parlement soutient la reconnaissance du droit humain à l'eau et à l'assainissement.</p>`},

{section:"Marché intérieur et politiques économiques", title:`La pollution atmosphérique et sonore`, body:`
<p><b>Contexte et enjeux sanitaires</b> La pollution atmosphérique est la première cause environnementale de décès prématurés dans l'Union européenne. En <span class="kb-fact">2023, plus de 180 000 personnes</span> sont décédées prématurément en raison de l'exposition aux particules fines (PM2,5), et <span class="kb-fact">94 % des résidents des zones urbaines</span> restent exposés à des concentrations de PM2,5 supérieures aux niveaux recommandés. La pollution sonore affecte plus de <span class="kb-fact">110 millions de personnes</span> en Europe, causant environ <span class="kb-fact">66 000 décès prématurés chaque année</span>.</p>

<p><b>Cadre juridique et objectifs</b> Fondée sur les <span class="kb-fact">articles 191 à 193 du TFUE</span>, la politique de l'UE repose sur le plan d'action « zéro pollution » adopté en <span class="kb-fact">2021</span>, visant à ramener la pollution à des niveaux non nocifs d'ici <span class="kb-fact">2050</span>. Pour 2030, l'objectif est de réduire les décès par PM2,5 d'au moins <span class="kb-fact">55 % par rapport à 2005</span> (66 % potentiels selon des évaluations récentes). Les textes clés incluent la directive sur la qualité de l'air ambiant (adoptée octobre 2024, en vigueur décembre 2024) et le règlement Euro 7 pour les transports routiers.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Utilisation efficace des ressources et économie circulaire`, body:`
<p><b>Contexte et objectif</b> L'utilisation actuelle des ressources génère une pollution élevée et une réduction des ressources naturelles. Régis par les <span class="kb-fact">articles 191, 192 et 193 du TFUE</span>, les modèles d'économie circulaire visent à transformer l'économie de l'Union en une économie durable à <span class="kb-fact">l'horizon 2050</span> en partageant, réutilisant, réparant et recyclant les produits.</p>
<p><b>Enjeux chiffrés</b> Chaque citoyen de l'Union consomme <span class="kb-fact">14,1 tonnes de matériaux et produit 5 tonnes de déchets annuels</span>. L'Union dépend fortement des importations : <span class="kb-fact">74,9 % de ses matières énergétiques fossiles et 49,0 % de ses minerais métalliques sont importés (2024)</span>. Seuls <span class="kb-fact">11,8 % des matières premières utilisées provenaient de matériaux recyclés (2023)</span>. Les objectifs fixés incluent <span class="kb-fact">65 % de recyclage des déchets municipaux d'ici 2035, 70 % pour les emballages d'ici 2030</span>, et un taux maximal de 10 % de mise en décharge.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Consommation et production durables`, body:`
<p><b>Fondement et objectifs</b> La consommation et la production durables visent des modes de production et consommation non polluants, économes en ressources et en énergie. La politique repose sur l'<span class="kb-fact">article 11 du traité FUE</span> imposant l'intégration de la protection environnementale dans les politiques de l'Union, et s'inscrit dans l'<span class="kb-fact">ODD 12</span> de l'ONU. L'Union a adopté trois stratégies majeures : le <span class="kb-fact">pacte vert pour l'Europe (2019)</span>, le <span class="kb-fact">plan d'action pour une économie circulaire (2020)</span> et le <span class="kb-fact">pacte pour une industrie propre (2025)</span>.</p><p><b>Instruments et réalisations clés</b> Le <span class="kb-fact">système d'échange de quotas d'émission (SEQE) depuis 2005</span> constitue le pilier de la décarbonation, ayant réduit les émissions d'environ <span class="kb-fact">47 %</span> par rapport à 2005 (donnée 2023). Le <span class="kb-fact">mécanisme d'ajustement carbone aux frontières</span>, mis en place en 2023, est pleinement opérationnel depuis le <span class="kb-fact">1er janvier 2026</span>. L'Union déploie aussi l'étiquetage énergétique, le <span class="kb-fact">label écologique UE (depuis 1992)</span>, le <span class="kb-fact">règlement 2024/1781 sur l'écoconception</span> et la <span class="kb-fact">directive 2024/1799 sur le droit à la réparation</span>. Les marchés publics écologiques et l'<span class="kb-fact">EMAS</span> soutiennent cette transition.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Les substances chimiques et les pesticides`, body:`
<p><b>Cadre réglementaire</b> Les articles 191 à 193 du traité sur le fonctionnement de l'Union européenne établissent les objectifs des politiques environnementales. Les règles de l'UE sur les substances chimiques et les pesticides visent à protéger la santé humaine et l'environnement en restreignant les produits dangereux, en garantissant leur classification, étiquetage et emballage corrects, et en contrôlant les importations et exportations.</p>

<p><b>Principaux cadres législatifs</b> Le <span class="kb-fact">règlement REACH (CE n°1907/2006)</span> est entré en vigueur le <span class="kb-fact">1er juin 2007</span>, établissant un système unique pour l'enregistrement, l'évaluation, l'autorisation et la restriction des substances chimiques. L'<span class="kb-fact">Agence européenne des produits chimiques (ECHA), basée à Helsinki</span>, gère ce système. Le <span class="kb-fact">règlement CLP (CE n°1272/2008)</span> harmonise classification et étiquetage. La <span class="kb-fact">directive Seveso III (juillet 2012)</span> prévoit la prévention des accidents industriels majeurs. La <span class="kb-fact">directive 2009/128/CE</span> sur les pesticides vise à réduire de moitié l'utilisation des produits phytopharmaceutiques chimiques d'ici <span class="kb-fact">2030</span>.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Historique de l'Union économique et monétaire`, body:`
<p><b>L'Union économique et monétaire (UEM)</b> désigne l'intégration économique poussée de l'Union européenne, caractérisée par une politique monétaire commune et l'euro. Sa base juridique combine l'<span class="kb-fact">article 3 du traité UE</span> (objectif d'une union dont la monnaie est l'euro) et les <span class="kb-fact">articles 119 à 144 du TFUE</span>. Elle vise la stabilité des prix, des finances publiques saines et le bon fonctionnement du marché intérieur.</p><p>Fixée comme objectif au <span class="kb-fact">sommet de La Haye (1969)</span>, relancée par le <span class="kb-fact">programme du marché unique (1985)</span> puis par le <span class="kb-fact">traité de Maastricht (1991)</span>, l'UEM s'est construite en trois phases : libre circulation des capitaux (1990-1993), convergence des politiques économiques (1994-1998), puis <span class="kb-fact">politique monétaire commune depuis le 1er janvier 1999</span>. L'euro est aujourd'hui utilisé par <span class="kb-fact">21 États membres</span> (la Bulgarie ayant adopté l'euro le 1er janvier 2026), la crise de la dette souveraine (2009-2012) ayant marqué son évolution récente.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Fiscalité directe : l'imposition des personnes et des sociétés`, body:`
<p><b>Domaine et fondement.</b> L'Union ne dispose pas d'une compétence explicite en fiscalité directe. L'<span class="kb-fact">article 115 du TFUE</span> permet au Conseil, à l'unanimité et selon la procédure de consultation, d'adopter des directives pour rapprocher les dispositions ayant une incidence directe sur le marché unique. Les <span class="kb-fact">articles 110 à 113 du TFUE</span> imposent aux États membres de négocier pour éliminer la double imposition.</p><p><b>Objectifs et initiatives.</b> Les priorités sont la lutte contre l'évasion fiscale et l'élimination de la double imposition. La Commission a présenté <span class="kb-fact">BEFIT (septembre 2023)</span>, qui remplace les projets ACCIS antérieurs et prévoit une assiette commune avec formule de répartition. Le pilier 2 de l'OCDE fixe un <span class="kb-fact">taux minimum d'imposition mondial de 15 %</span>, transposé par une directive en 2022. La Cour de justice, dans l'<span class="kb-fact">affaire C-465/20 P (Apple, 2024)</span>, a confirmé que les rescrits fiscaux relèvent du contrôle des aides d'État. La <span class="kb-fact">sous-commission FISC (2020)</span> renforce le rôle du Parlement, limité par la procédure de consultation.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Impôts indirects`, body:`
<p><b>Cadre de la fiscalité indirecte</b> L'UE coordonne la fiscalité indirecte (TVA et accises) selon l'<span class="kb-fact">article 113 du traité sur le fonctionnement de l'UE</span>. Le système repose sur le <span class="kb-fact">principe de destination</span> : la TVA est appliquée au pays de consommation. Le <span class="kb-fact">taux normal minimum est fixé à 15%</span> dans tous les États membres, mais les taux réduits varient. L'<span class="kb-fact">écart de conformité TVA s'élève à 9,5%</span> de la TVA totale exigible (2023).</p><p><b>Institutions et réformes récentes</b> Le <span class="kb-fact">Conseil décide à l'unanimité</span>, la Commission propose, et le Parlement européen exerce un <span class="kb-fact">rôle consultatif uniquement</span>. Le <span class="kb-fact">package TVA à l'ère du numérique, adopté en mars 2025</span>, adapte le régime à l'économie électronique. Les accises portent sur l'alcool, le tabac et l'énergie, avec une <span class="kb-fact">harmonisation partielle par taux minimums</span>.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Politique de concurrence`, body:`
<p><b>Base juridique et objectifs</b> La politique de concurrence de l'Union vise à protéger le processus concurrentiel pour assurer le bon fonctionnement du marché intérieur. Fondée sur les <span class="kb-fact">articles 101 à 109 du traité sur le fonctionnement de l'Union européenne</span>, elle combine le contrôle traditionnel des pratiques anticoncurrentielles et des aides d'État avec de nouveaux outils réglementaires.</p><p><b>Principaux piliers et instruments</b> L'interdiction des ententes et abus de position dominante ; le contrôle des concentrations entre entreprises ; le contrôle des aides d'État, renforcé depuis <span class="kb-fact">juin 2025</span> par le <span class="kb-fact">cadre pour une industrie propre (CISAF)</span> ; et la réglementation ex ante des marchés numériques et des subventions étrangères. La <span class="kb-fact">Commission</span>, avec les autorités nationales via le <span class="kb-fact">réseau européen de la concurrence</span>, applique ces règles. Le <span class="kb-fact">Parlement européen</span> exerce un contrôle via la commission des affaires économiques et monétaires.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Politique en matière de services financiers`, body:`
<p><b>Cadre et objectif.</b> La politique de l'Union en matière de services financiers encadre la libre circulation des services et des capitaux au sein du marché intérieur. Fondée sur les <span class="kb-fact">articles 49, 56, 63 et 114 du Traité sur le fonctionnement de l'Union européenne</span>, elle s'est construite selon cinq phases : suppression des barrières (1957-1973), harmonisation législative (1973-1983), achèvement du marché intérieur (1983-1992), création d'une zone de monnaie unique (1993-2007) et réforme post-crise financière (depuis 2007).</p>
<p><b>Cadres législatifs et surveillance.</b> Les principaux instruments régissent les banques (CRD IV, CRR, BRRD, mécanisme de surveillance unique), les marchés financiers (MiFID II, EMIR), les assurances (Solvabilité II) et les paiements (PSD2). La <span class="kb-fact">Commission des affaires économiques et monétaires (ECON)</span> du Parlement européen est compétente au fond, tandis que la <span class="kb-fact">Banque centrale européenne</span> est, depuis 2014, l'autorité centrale de contrôle prudentiel des grandes banques de la zone euro.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Systeme européen de surveillance financiere`, body:`
<p><b>Nature et base juridique</b> Le Système européen de surveillance financière (SESF), établi par les <span class="kb-fact">règlements (UE) n° 1093/2010, 1094/2010, 1095/2010, 1092/2010 et 1096/2010 du 24 novembre 2010</span>, assure une surveillance financière cohérente dans l'Union. Créé à la suite du rapport de Larosière (2009) après la <span class="kb-fact">crise financière de 2007-2008</span>, il est devenu <span class="kb-fact">opérationnel le 1er janvier 2011</span> pour préserver la stabilité financière et protéger les consommateurs.</p>
<p><b>Composition et fonctionnement</b> Le SESF réunit les autorités nationales de surveillance, trois autorités européennes de surveillance (AES), le Comité mixte des AES et le Comité européen du risque systémique (CERS). Les trois AES sont l'<span class="kb-fact">Autorité bancaire européenne (ABE)</span>, transférée de Londres à <span class="kb-fact">Paris en 2019</span>, l'<span class="kb-fact">Autorité européenne des marchés financiers (AEMF)</span>, également à <span class="kb-fact">Paris</span>, et l'<span class="kb-fact">Autorité européenne des assurances et des pensions professionnelles (AEAPP)</span> à <span class="kb-fact">Francfort</span>. Le système combine surveillance <span class="kb-fact">microprudentielle</span> (faillites individuelles) et <span class="kb-fact">macroprudentielle</span> (risques systémiques).</p>`},

{section:"Marché intérieur et politiques économiques", title:`Les institutions de l'Union économique et monétaire`, body:`
<p><b>La Banque centrale européenne (BCE)</b>, créée le <span class="kb-fact">1er juin 1998</span> et basée à <span class="kb-fact">Francfort-sur-le-Main</span>, pilote la politique monétaire de la zone euro au sein du Système européen de banques centrales (SEBC). L'objectif principal du SEBC est de <span class="kb-fact">maintenir la stabilité des prix</span>. Sa base juridique repose sur les <span class="kb-fact">articles 119 à 144, 219 et 282 à 284 du traité FUE</span>.</p><p>Le <span class="kb-fact">directoire</span> compte <span class="kb-fact">six membres</span> (président, vice-président et quatre autres), nommés pour un <span class="kb-fact">mandat de huit ans non renouvelable</span>. Le <span class="kb-fact">conseil des gouverneurs</span>, organe supérieur de décision, définit la politique monétaire de l'Union, un point classique des QCM EPSO.</p>`},

{section:"Marché intérieur et politiques économiques", title:`La politique monétaire européenne`, body:`
<p><b>Objet et objectif</b> La politique monétaire de la zone euro est menée par la <span class="kb-fact">Banque centrale européenne (BCE)</span> et le <span class="kb-fact">Système européen de banques centrales (SEBC)</span>, dont l'indépendance est garantie par l'<span class="kb-fact">article 130 du traité FUE</span>. L'objectif principal est la stabilité des prix, définie depuis <span class="kb-fact">juillet 2021</span> comme un taux d'inflation de <span class="kb-fact">2 %</span> à moyen terme, de manière symétrique.</p><p><b>Instruments et contrôle</b> Les instruments de base sont les <span class="kb-fact">trois taux directeurs</span> (refinancement, dépôt, prêt marginal) et les opérations d'open market. La BCE a aussi recouru à des programmes d'achats d'actifs non conventionnels, dont l'<span class="kb-fact">APP</span> (débuté en <span class="kb-fact">octobre 2014</span>) et le <span class="kb-fact">PEPP</span> face à la pandémie, porté à <span class="kb-fact">1 850 milliards d'euros</span>. Après une révision de la stratégie en <span class="kb-fact">juillet 2025</span>, la prochaine évaluation est prévue en <span class="kb-fact">2030</span>. Le président de la BCE rend compte au <span class="kb-fact">Parlement européen</span> par un rapport annuel et un dialogue monétaire quatre fois par an.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Gouvernance économique`, body:`
<p><b>De quoi s'agit-il</b> La gouvernance économique de l'UE repose sur la base juridique de <span class="kb-fact">l'article 3 du traité UE</span> et des <span class="kb-fact">articles 2 à 5, 119 à 144 et 282 à 284 du traité FUE</span>. Elle vise à coordonner les politiques économiques, budgétaires et structurelles des États membres. Son outil central est le <span class="kb-fact">Semestre européen</span>, mis en pratique pour la première fois en <span class="kb-fact">2011</span> : un cycle annuel de coordination des politiques structurelles, macroéconomiques et budgétaires.</p><p><b>Réforme récente</b> Un nouveau cadre est entré en vigueur en <span class="kb-fact">avril 2024</span>, introduisant des <span class="kb-fact">plans budgétaires et structurels nationaux à moyen terme</span> et une <span class="kb-fact">approche fondée sur les risques</span> pour différencier la surveillance selon la situation budgétaire de chaque État. Le <span class="kb-fact">Mécanisme européen de stabilité (MES)</span> complète ce dispositif en apportant une assistance financière aux États membres de la zone euro en difficulté.</p>`},

{section:"Marché intérieur et politiques économiques", title:`L'Union Bancaire`, body:`
<p><b>Définition et objectif</b> L'Union bancaire de l'UE est un cadre coordonné visant à créer un secteur financier « sûr, résilient et intégré ». Elle renforce la stabilité financière dans la zone euro, protège les contribuables en réduisant le recours à l'aide publique et assure une gestion cohérente des crises bancaires.</p><p><b>Les trois piliers</b> Le <span class="kb-fact">Mécanisme de Surveillance Unique (MSU)</span>, supervisé par la <span class="kb-fact">Banque Centrale Européenne</span>, surveille directement environ <span class="kb-fact">110 banques</span> depuis <span class="kb-fact">novembre 2014</span>. Le <span class="kb-fact">Mécanisme de Résolution Unique (MRU)</span>, via le Conseil de résolution unique, gère les défaillances bancaires depuis <span class="kb-fact">janvier 2016</span>. Le troisième pilier, le <span class="kb-fact">Système Européen d'Assurance des Dépôts (SEAD)</span>, proposé en novembre 2015, n'est toujours pas adopté à ce jour. L'Union bancaire repose sur les articles <span class="kb-fact">114 et 127, paragraphe 6, du TFUE</span>.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Le cadre de l'UE pour les politiques budgétaires`, body:`
<p><b>Règles communes.</b> Le cadre budgétaire de l'Union européenne s'appuie sur le traité sur le fonctionnement de l'UE (articles <span class="kb-fact">119 à 144</span>) et sur le <span class="kb-fact">Pacte de stabilité et de croissance</span>, qui fixe des seuils de <span class="kb-fact">3 % du PIB</span> pour le déficit public et de <span class="kb-fact">60 % du PIB</span> pour la dette. Au-delà, une procédure de déficit excessif s'enclenche, avec des amendes possibles jusqu'à <span class="kb-fact">0,05 % du PIB</span> pour les États de la zone euro.</p><p><b>Réforme récente.</b> La réforme de la gouvernance économique entrée en vigueur en <span class="kb-fact">2024</span> remplace l'ancienne règle mécanique du vingtième par des trajectoires d'ajustement négociées avec la <span class="kb-fact">Commission européenne</span> : baisse de la dette d'au moins <span class="kb-fact">0,5 point</span> de PIB par an au-delà de 60 %, ou <span class="kb-fact">1 point</span> au-delà de 90 %. Le <span class="kb-fact">Parlement européen</span>, colégislateur, s'articule avec le semestre européen.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Surveillance macroéconomique`, body:`
<p><b>Procédure et objectif</b> La procédure de déséquilibres macroéconomiques (PDM) a été créée en <span class="kb-fact">2011</span> et mise en place en <span class="kb-fact">2012</span> pour prévenir et corriger les déséquilibres au sein de l'Union. Elle s'appuie sur un tableau de bord d'indicateurs géré par la Commission : balance des comptes courants, taux de change, position exterieure pour le volet externe ; dette publique, chômage, prix du logement pour le volet interne.</p><p><b>Fonctionnement et réforme</b> En cas de déséquilibres, la Commission adresse des recommandations préventives, puis correctives si les déséquilibres sont jugés excessifs, avec des plans de mesures et, pour la zone euro, des sanctions financières possibles. Le <span class="kb-fact">règlement (UE) 2024/1263</span> du <span class="kb-fact">29 avril 2024</span> réforme ce cadre. Le nombre d'États en déséquilibre a fluctué depuis 2012 (12 puis jusqu'à 16, puis <span class="kb-fact">9 en 2023</span>) ; ceux en déséquilibre excessif sont passés de zéro à <span class="kb-fact">2 en 2023</span>, après un pic à 6. Le Parlement est colégislateur sur ce cadre depuis Lisbonne.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Assistance financière aux États membres de l'Union européenne`, body:`
<p><b>Cadre d'assistance financière de l'Union.</b> Cette fiche explique comment l'Union apporte une assistance financière aux États membres confrontés à de graves difficultés économiques ou financières. Son objectif premier est de préserver la stabilité financière dans l'Union et dans la zone euro, notamment par la surveillance budgétaire des États et la conditionnalité macroéconomique des programmes d'ajustement.</p>

<p><b>Mécanismes permanents et temporaires.</b> Le <span class="kb-fact">mécanisme européen de stabilité (MES), créé en octobre 2012</span>, est le seul instrument permanent disponible pour prêter une assistance aux États membres de la zone euro, avec une capacité de prêt de <span class="kb-fact">500 milliards d'euros</span>. Le <span class="kb-fact">« two-pack »</span>, entré en vigueur en <span class="kb-fact">mai 2013</span>, renforce la surveillance budgétaire des États membres. Un <span class="kb-fact">protocole de coopération a été approuvé en 2023</span> entre le Parlement européen et le MES. Le MES a fourni une assistance à <span class="kb-fact">l'Espagne, à Chypre, à l'Irlande, au Portugal et à la Grèce</span>.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Politique fiscale de l'UE`, body:`
<p><b>Cadre juridique.</b> La fiscalité reste largement une compétence des <span class="kb-fact">États membres</span>, le Conseil statuant à l'unanimité (articles <span class="kb-fact">110 à 113</span> et <span class="kb-fact">114 à 118</span> du TFUE). En <span class="kb-fact">2019</span>, la Commission a proposé de passer au vote à la majorité qualifiée pour certains dossiers fiscaux.</p><p><b>Instruments récents.</b> L'UE lutte contre l'évasion fiscale via la directive <span class="kb-fact">ATAD</span> (<span class="kb-fact">2016</span>) et impose depuis <span class="kb-fact">décembre 2022</span> un taux d'imposition minimal mondial de <span class="kb-fact">15 %</span> aux multinationales. L'échange d'informations entre administrations fiscales a été renforcé par la directive <span class="kb-fact">DAC</span>, dont la neuvième version (<span class="kb-fact">DAC9</span>) date de <span class="kb-fact">mars 2025</span>, tandis que le paquet <span class="kb-fact">ViDA</span> modernise la TVA jusqu'en <span class="kb-fact">2035</span>. Au Parlement européen, la sous-commission <span class="kb-fact">FISC</span>, créée en <span class="kb-fact">septembre 2020</span>, suit ces dossiers.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Cohésion économique, sociale et territoriale`, body:`
<p><b>Objectif et base juridique</b> La cohésion économique, sociale et territoriale vise à réduire l'écart de développement entre les régions de l'UE, en accordant une attention particulière aux zones rurales, à la transition industrielle et aux régions à handicaps naturels ou démographiques graves. Fondée sur les <span class="kb-fact">articles 174 à 178 du traité FUE</span>, elle constitue la principale politique d'investissement de l'Union.</p><p><b>Fonds et budget 2021-2027</b> La politique s'appuie sur cinq instruments : <span class="kb-fact">le FEDER, le Fonds de cohésion, le FSE+, le Feamp et le Fonds pour une transition juste (FTJ)</span>. Pour 2021-2027, le budget total atteint <span class="kb-fact">322,3 milliards d'euros</span> pour l'investissement en faveur de la croissance et de l'emploi, et <span class="kb-fact">17,5 milliards d'euros pour le FTJ</span>. Cinq objectifs stratégiques orientent ces investissements : Europe plus intelligente, verte, connectée, sociale et proche des citoyens. Le <span class="kb-fact">règlement (UE) 2025/1914</span>, adopté en septembre 2025 après l'examen à mi-parcours, permet aux Etats membres de réaffecter une partie des fonds vers de nouvelles priorités (compétitivité, défense, logement, énergie).</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Groupements européens de coopération territoriale (GECT)`, body:`
<p><b>Définition et objectifs.</b> Les Groupements européens de coopération territoriale (GECT) facilitent la coopération transfrontalière, transnationale et interrégionale entre États membres et collectivités régionales et locales. Régis par le <span class="kb-fact">Règlement (CE) nº 1082/2006</span> et révisés par le <span class="kb-fact">Règlement (UE) nº 1302/2013</span>, ils réduisent les disparités régionales et renforcent la cohésion économique, sociale et territoriale.</p><p><b>Structure et activités.</b> Un GECT regroupe au moins deux États membres (ou un État et des pays tiers) et dispose d'une assemblée et d'un directeur. Il gère des infrastructures transfrontalières, des programmes de développement régional et facilite l'échange de compétences. Le registre, tenu par le <span class="kb-fact">Comité européen des régions</span>, en compte actuellement <span class="kb-fact">93</span>. Les GECT participent aux programmes <span class="kb-fact">INTERREG</span> et aux politiques de cohésion.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Fonds européen de développement régional (FEDER)`, body:`
<p><b>Définition et objectifs</b> Le Fonds européen de développement régional (FEDER) est l'un des principaux instruments de la politique de cohésion de l'Union, créé en <span class="kb-fact">1975</span>. Il vise à corriger les déséquilibres régionaux en soutenant le développement des régions en retard et la reconversion des régions industrielles. Sa base juridique repose sur les <span class="kb-fact">articles 174 à 178 du traité sur le fonctionnement de l'Union européenne</span>.</p><p><b>Budget et financement</b> Pour la période 2021-2027, le FEDER bénéficie de <span class="kb-fact">près de 226 milliards d'euros</span>, sur un total de plus de 392 milliards pour la politique de cohésion. Les régions moins développées peuvent recevoir un cofinancement jusqu'à <span class="kb-fact">85%</span>, contre <span class="kb-fact">60%</span> pour les régions en transition et <span class="kb-fact">50%</span> pour les régions plus développées. Le FEDER poursuit <span class="kb-fact">cinq objectifs stratégiques</span> : une Europe plus intelligente, plus verte, plus connectée, plus sociale et plus proche des citoyens. Au moins <span class="kb-fact">30%</span> de la dotation doit soutenir la transition vers la neutralité carbone, et <span class="kb-fact">8%</span> minimum le développement urbain durable.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Le Fonds de cohésion`, body:`
<p><b>Nature et objectifs</b> Créé en <span class="kb-fact">1994</span>, le Fonds de cohésion finance les investissements dans l'environnement et les réseaux transeuropéens de transport. Base juridique : <span class="kb-fact">article 177 du traité sur le fonctionnement de l'UE</span> et <span class="kb-fact">règlement (UE) 2021/1058</span>. Il vise à renforcer la cohésion économique, sociale et territoriale, avec deux objectifs stratégiques : une économie plus verte et sobre en carbone, et une Europe plus connectée.</p><p><b>Éligibilité et budget</b> Il bénéficie aux <span class="kb-fact">15 États membres</span> dont le revenu national brut par habitant est inférieur à <span class="kb-fact">90 % de la moyenne UE</span> (Bulgarie, Chypre, Croatie, Estonie, Grèce, Hongrie, Lettonie, Lituanie, Malte, Pologne, Portugal, Roumanie, Slovaquie, Slovénie, Tchéquie). Pour <span class="kb-fact">2021-2027</span>, le budget est de <span class="kb-fact">42,6 milliards d'euros</span> (prix 2018), avec un taux de cofinancement jusqu'à <span class="kb-fact">85 %</span> des projets. 37 % des dotations contribuent aux objectifs climatiques.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Le Fonds de solidarité`, body:`
<p><b>Définition et objectifs</b> Le Fonds de solidarité est le principal instrument de l'Union européenne pour aider les États membres et pays candidats après des catastrophes naturelles majeures. Créé en <span class="kb-fact">2002</span> suite aux inondations d'Europe centrale, il finance la reconstruction des infrastructures essentielles et les mesures d'urgence. Depuis <span class="kb-fact">2020</span> (règlement <span class="kb-fact">(UE) 2020/461</span>), il couvre aussi les urgences sanitaires majeures, en réaction à la pandémie de COVID-19.</p>

<p><b>Portée et mise en œuvre</b> Base juridique : <span class="kb-fact">articles 175, paragraphe 3, et 212, paragraphe 3, du traité FUE</span>. Les États ont <span class="kb-fact">12 semaines</span> après la catastrophe pour demander une aide. Le Fonds est intervenu à plus de <span class="kb-fact">130 reprises</span>, avec plus de <span class="kb-fact">8,6 milliards d'euros</span> versés à <span class="kb-fact">24 États membres</span> et <span class="kb-fact">4 pays candidats</span> (Albanie, Monténégro, Serbie, Turquie).</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Coopération territoriale européenne`, body:`
<p><b>Objet et cadre juridique.</b> La coopération territoriale européenne (CTE) est un objectif de la politique de cohésion qui vise à résoudre les défis transfrontaliers et à développer conjointement le potentiel des régions. Elle s'appuie sur <span class="kb-fact">l'article 178 du traité sur le fonctionnement de l'Union européenne</span> et sur le <span class="kb-fact">règlement Interreg (UE) 2021/1059</span> pour la période 2021-2027.</p><p><b>Quatre volets et budget.</b> Pour <span class="kb-fact">2021-2027</span>, environ <span class="kb-fact">8 milliards d'euros</span> sont alloués à la CTE, répartis en quatre volets : <span class="kb-fact">coopération transfrontalière (72,2 %)</span>, coopération transnationale (18,2 %), coopération interrégionale (6,1 %) et régions ultrapériphériques (3,5 %). Ces fonds visent à relever les défis communs aux zones frontalières, à renforcer la coopération régionale et à partager les bonnes pratiques en Europe.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`La nomenclature commune des unités territoriales statistiques (NUTS)`, body:`
<p><b>Cadre et objectif</b> La NUTS est un système hiérarchique qui organise les statistiques régionales de l'Union européenne. Établie par le <span class="kb-fact">règlement (CE) n° 1059/2003</span>, modifiée à plusieurs reprises (<span class="kb-fact">2005, 2008, 2013, 2017</span>), elle fournit un cadre commun assurant la comparabilité des données entre États membres et sous-tend la politique de cohésion régionale.</p><p><b>Structure et chiffres clés</b> La nomenclature comprend <span class="kb-fact">trois niveaux hiérarchiques</span> (NUTS 1, 2, 3) selon des seuils démographiques : NUTS 1 (3 à 7 millions d'habitants), NUTS 2 (800 000 à 3 millions), NUTS 3 (150 000 à 800 000). Depuis le <span class="kb-fact">1er janvier 2021</span>, elle compte <span class="kb-fact">92 régions NUTS 1, 242 NUTS 2 et 1 166 NUTS 3</span>. Une modification de la nomenclature ne peut intervenir qu'une fois tous les trois ans maximum, sauf réorganisation administrative majeure d'un État membre.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Régions ultrapériphériques`, body:`
<p><b>Définition et composition.</b> Ce sont les territoires éloignés du continent européen appartenant à trois États membres : France, Portugal et Espagne. L'UE en compte <span class="kb-fact">neuf</span> : <span class="kb-fact">cinq départements français</span> d'outre-mer (Martinique, Mayotte, Guadeloupe, Guyane, Réunion), Saint-Martin, deux régions autonomes portugaises (Madère, Açores) et les îles Canaries espagnoles. <span class="kb-fact">Environ 5 millions de personnes</span> y vivent.</p><p><b>Régime particulier et soutien.</b> Ces régions bénéficient d'adaptations spéciales fondées sur <span class="kb-fact">l'article 349 du traité FUE</span>. Pour <span class="kb-fact">2021-2027</span>, l'Union alloue <span class="kb-fact">1 928 millions d'euros</span> supplémentaires au titre du FEDER, auxquels s'ajoutent <span class="kb-fact">281 millions d'euros</span> pour Interreg D. Elles bénéficient aussi du programme POSEI pour l'agriculture. Le taux de chômage y est plus élevé et le PIB par habitant plus faible que la moyenne de l'UE.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`PEACEPLUS pour l'Irlande du Nord`, body:`
<p><b>Nature et objectif</b> PEACEPLUS est un programme transfrontalier de l'Union pour <span class="kb-fact">2021-2027</span>, destiné à renforcer la paix, la réconciliation et la coopération entre l'Irlande et l'Irlande du Nord. Il fusionne les anciens volets Interreg et PEACE et couvre six piliers thématiques (communautés pacifiques, revitalisation socioéconomique, jeunesse, inclusion, durabilité, partenariats).</p>

<p><b>Financement et base juridique</b> Fondé sur le <span class="kb-fact">règlement Interreg (UE) 2021/1059</span> et le règlement portant dispositions communes (UE) 2021/1060, PEACEPLUS reçoit <span class="kb-fact">235 millions d'euros</span> du FEDER, pour un investissement total de <span class="kb-fact">1,1 milliard d'euros</span> avec les contributions du Royaume-Uni et de l'Irlande. Les quatre générations précédentes du programme PEACE (<span class="kb-fact">1995-2020</span>) avaient reçu <span class="kb-fact">1,6 milliard d'euros</span>. Après le Brexit, l'accord de retrait a garanti la continuité du financement.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`La politique agricole commune (PAC) et le traité`, body:`
<p><b>Fondement juridique et origines</b> La Politique agricole commune (PAC) est fondée sur les <span class="kb-fact">articles 38 à 44 du Traité sur le fonctionnement de l'Union européenne (TFUE)</span> et remonte au <span class="kb-fact">Traité de Rome du 1er janvier 1958</span>. Elle poursuit <span class="kb-fact">cinq objectifs</span> : accroître la productivité agricole, assurer un niveau de vie équitable aux agriculteurs, stabiliser les marchés, garantir la sécurité des approvisionnements et assurer des prix raisonnables aux consommateurs.</p>

<p><b>Rôle du Parlement et évolution</b> Depuis le <span class="kb-fact">Traité de Lisbonne en 2009</span>, le Parlement européen est co-législateur en matière agricole. La réforme de <span class="kb-fact">décembre 2021</span> a consolidé ce rôle. Aujourd'hui, la PAC intègre des objectifs de lutte contre le changement climatique, de préservation de la biodiversité et de développement durable, au-delà du simple soutien économique.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`L'Union européenne et les forêts`, body:`
<p><b>Politique forestière de l'UE</b> Le traité sur le fonctionnement de l'UE n'inclut aucune disposition explicite sur les forêts : leur gestion relève principalement de la compétence des États membres. L'UE coordonne toutefois une action commune via la <span class="kb-fact">Stratégie de l'UE pour les forêts 2030</span>, adoptée en 2021 dans le cadre du Pacte vert.</p><p><b>Couverture et défis</b> Les forêts couvrent environ <span class="kb-fact">160 millions d'hectares</span>, soit <span class="kb-fact">39 %</span> du territoire de l'UE, dont plus de <span class="kb-fact">90 %</span> sont semi-naturelles. La <span class="kb-fact">Suède</span>, la <span class="kb-fact">Finlande</span> et l'<span class="kb-fact">Espagne</span> ont les plus vastes superficies boisées. En <span class="kb-fact">2022</span>, environ <span class="kb-fact">9 000 km²</span> ont brûlé. Le FEADER finance environ 90 % des actions forestières, et l'UE participe à <span class="kb-fact">Forest Europe</span>, qui réunit 44 pays et l'UE.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Financement de la PAC : faits et chiffres`, body:`
<p><b>Structure et financement</b> La Politique agricole commune (PAC) est financée depuis sa création en <span class="kb-fact">1962</span> par des fonds européens. Depuis <span class="kb-fact">2007</span>, elle repose sur deux piliers : le <span class="kb-fact">Fonds européen agricole de garantie (FEAGA)</span> pour les paiements directs et le <span class="kb-fact">Fonds européen agricole pour le développement rural (Feader)</span>. Pour <span class="kb-fact">2021-2027</span>, plus de <span class="kb-fact">378 milliards d'euros</span> sont disponibles (dont <span class="kb-fact">283 milliards</span> pour le FEAGA et <span class="kb-fact">94 milliards</span> pour le Feader), complétés par un financement NextGenerationEU pour le développement rural.</p><p><b>Allocation et bénéficiaires</b> La PAC représente <span class="kb-fact">environ 25 %</span> du budget annuel de l'Union. Les <span class="kb-fact">paiements directs représentent 62 %</span> des dépenses totales. En <span class="kb-fact">2023</span>, la <span class="kb-fact">France</span> est le premier État membre bénéficiaire du FEAGA avec <span class="kb-fact">18,1 %</span> du total, suivie de l'Espagne avec <span class="kb-fact">13,8 %</span>. Les nouveaux règlements adoptés en <span class="kb-fact">décembre 2021</span> ont établi un modèle fondé sur les <span class="kb-fact">plans stratégiques nationaux</span>.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Les instruments de la PAC et leurs réformes`, body:`
<p><b>Sujet et base juridique</b> La Politique agricole commune (PAC) est établie par les <span class="kb-fact">articles 38 à 44 du traité sur le fonctionnement de l'Union européenne</span>. Sa mise en œuvre repose sur trois règlements de 2021 : <span class="kb-fact">règlement (UE) 2021/2115</span> (plans stratégiques nationaux), 2021/2116 (gestion financière) et 2021/2117 (organisation commune des marchés).</p><p><b>Évolution et réformes</b> Depuis sa création en <span class="kb-fact">1962</span>, la PAC a connu plusieurs réformes majeures : <span class="kb-fact">1992</span> (remplacement des prix de soutien par des aides compensatoires), Agenda 2000, <span class="kb-fact">2003</span> (découplage des aides), <span class="kb-fact">2009</span> (bilan de santé), puis la réforme <span class="kb-fact">2023-2027</span>, structurée autour de dix objectifs dont le revenu équitable, la compétitivité, le climat, l'environnement et la biodiversité. Des simplifications adoptées en <span class="kb-fact">2024 et 2025</span> ont notamment porté l'aide forfaitaire aux petits agriculteurs de <span class="kb-fact">1 250 à 3 000 euros</span>.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Paiements directs`, body:`
<p><b>Définition et objectif</b> Les paiements directs sont des aides au revenu versées chaque année par l'Union européenne aux agriculteurs, servant de filet de sécurité face à l'insuffisance des revenus et aux incertitudes des marchés. Ils sont financés par le <span class="kb-fact">Fonds européen agricole de garantie (FEAGA)</span> et régis par le <span class="kb-fact">règlement (UE) 2021/2115</span>, sur la base juridique des articles 38 à 44 du <span class="kb-fact">Traité sur le fonctionnement de l'Union européenne</span>.</p>

<p><b>Chiffres clés</b> Plus de <span class="kb-fact">6 millions de bénéficiaires</span> perçoivent ces paiements chaque année. Pour la période <span class="kb-fact">2023-2027</span>, le budget total atteint <span class="kb-fact">189,15 milliards EUR</span>. L'aide de base au revenu représente <span class="kb-fact">51,12 %</span> de ce budget, les éco-régimes <span class="kb-fact">23,64 %</span> et l'aide redistributive complémentaire <span class="kb-fact">10,62 %</span>. Un seuil minimal d'exploitation (0,3 à 4 hectares selon les États membres) conditionne l'accès a ces aides.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Accord de l'OMC sur l'agriculture`, body:`
<p><b>Accord de l'OMC sur l'agriculture</b> L'accord sur l'agriculture est un traité international signé à Marrakech en <span class="kb-fact">1994</span>, dans le cadre de l'<span class="kb-fact">Organisation mondiale du commerce (OMC)</span>, entré en vigueur le <span class="kb-fact">1er janvier 1995</span>. Il fixe des engagements sur l'accès aux marchés, le soutien interne et les subventions à l'exportation.</p>

<p>Le système des « boîtes » classe les mesures de soutien interne selon leur effet sur les échanges : <span class="kb-fact">Boîte orange</span> (mesures distorsives à réduire), <span class="kb-fact">Boîte bleue</span> (aides couplées à la superficie ou au cheptel, sous contrôle de l'offre) et <span class="kb-fact">Boîte verte</span> (aides découplées de la production). L'<span class="kb-fact">Union européenne</span> notifie environ <span class="kb-fact">80,6 milliards d'euros</span> annuels de soutien agricole, répartis à 86,0 % en Boîte verte, 5,8 % en Boîte bleue et 8,2 % en Boîte orange (données 2022/2023), grâce aux réformes de la <span class="kb-fact">PAC</span> depuis 1992 qui ont découplé la plupart des aides directes.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Politique Commune de la Pêche : origines et évolution`, body:`
&lt;div class="kb-body"&gt;
&lt;p&gt;&lt;b&gt;Cadre juridique et origines&lt;/b&gt; : la Politique Commune de la Pêche (PCP) est inscrite dès &lt;span class="kb-fact"&gt;1958&lt;/span&gt; dans le &lt;span class="kb-fact"&gt;traité de Rome&lt;/span&gt;, alors annexée à la politique agricole commune. Elle se constitue en domaine distinct à partir de &lt;span class="kb-fact"&gt;1970&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Mécanismes et réformes&lt;/b&gt; : depuis &lt;span class="kb-fact"&gt;1983&lt;/span&gt;, le système repose sur les &lt;span class="kb-fact"&gt;Total Admissible des Captures (TAC)&lt;/span&gt;, répartis en quotas selon le principe de stabilité relative. Des réformes majeures interviennent en &lt;span class="kb-fact"&gt;1992, 2002 et 2013&lt;/span&gt;. Celle de &lt;span class="kb-fact"&gt;2013&lt;/span&gt; introduit le rendement maximal durable, l'obligation de débarquement des captures et la régionalisation de la décision. Le &lt;span class="kb-fact"&gt;traité de Lisbonne&lt;/span&gt; (2009) instaure la codécision du Parlement, sauf pour la fixation des TAC et quotas, qui reste une compétence du Conseil.&lt;/p&gt;
&lt;/div&gt;`},

{section:"Cohésion, agriculture, pêche et transports", title:`Gestion des pêches dans l'Union européenne`, body:`
<p><b>Gestion des pêches</b> La politique commune de la pêche (PCP) repose sur les <span class="kb-fact">articles 38 à 43 du traité sur le fonctionnement de l'Union européenne</span>. Son objectif est de garantir l'exploitation durable des ressources biologiques marines et la viabilité à long terme du secteur.</p>
<p><b>Principes et mesures</b> Tous les navires immatriculés dans l'Union disposent d'un accès égal aux eaux, avec des exceptions temporaires (zone des 12 milles nautiques côtiers et zone des 100 milles des régions ultrapériphériques) qui deviennent caduques <span class="kb-fact">fin 2032</span>. La gestion suit le <span class="kb-fact">rendement maximal durable (RMD)</span>, avec répartition annuelle des <span class="kb-fact">totaux admissibles de captures (TAC)</span> selon le principe de <span class="kb-fact">stabilité relative</span>. Des mesures techniques (engins, tailles minimales) et des plans pluriannuels maintiennent les stocks dans des limites biologiques sûres.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Contrôle des pêches`, body:`
<p><b>Régime de contrôle</b> Le régime de contrôle de la pêche de l'Union, fondé sur le <span class="kb-fact">règlement (CE) n° 1224/2009</span>, garantit le respect des règles de la politique commune de la pêche. Révisé en <span class="kb-fact">2023</span> par le <span class="kb-fact">règlement (UE) 2023/2842</span>, il couvre l'accès aux ressources, l'utilisation des possibilités de pêche, la capacité des flottes et la commercialisation. Les États membres sont responsables du contrôle sur leur territoire, tandis que la Commission supervise leur application.</p><p><b>Obligations et outils</b> Tous les navires de pêche doivent détenir une <span class="kb-fact">licence de pêche</span> et être équipés d'un <span class="kb-fact">système VMS (surveillance par satellite)</span>, sauf exemption temporaire pour les petits navires de moins de <span class="kb-fact">9 mètres</span> jusqu'au <span class="kb-fact">31 décembre 2029</span>. Les armateurs doivent tenir des <span class="kb-fact">journaux de pêche électroniques</span> et assurer la traçabilité numérique des produits. L'<span class="kb-fact">Agence européenne de contrôle des pêches (AECP)</span>, établie à <span class="kb-fact">Vigo</span> en <span class="kb-fact">2005</span>, coordonne les inspections. Les infractions graves entraînent un système de points pouvant mener à la suspension de licence.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Les aides structurelles pour la pêche`, body:`
<p><b>Financement structurel de la pêche dans l'UE</b> Le <span class="kb-fact">Feampa</span> (Fonds européen pour les affaires maritimes, la pêche et l'aquaculture) est l'instrument de financement 2021-2027, doté d'un budget de <span class="kb-fact">6,108 milliards d'euros</span>. Il succède au FEAMP (2014-2020) et au FEP (2007-2013), dans la continuité d'un soutien structurel initié en <span class="kb-fact">1970</span> via le Fonds européen d'orientation et de garantie agricole (FEOGA). Le Feampa repose sur <span class="kb-fact">87 %</span> de gestion partagée (programmes nationaux cofinancés) et <span class="kb-fact">13 %</span> de gestion directe ou indirecte par la Commission.</p><p><b>Priorités et conditions d'éligibilité</b> Le Feampa finance la pêche durable, l'aquaculture durable, l'économie bleue côtière et la gouvernance océanique. Chaque État membre doit consacrer au minimum <span class="kb-fact">15 %</span> de son budget national au contrôle des pêches et à la collecte de données. Les investissements augmentant la capacité de pêche sont inéligibles ; certaines mesures ciblent exclusivement les navires de moins de <span class="kb-fact">24 mètres</span>.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`L'organisation commune des marchés dans le secteur des produits de la pêche et de l'aquaculture`, body:`
<p><b>Définition et cadre juridique</b> L'organisation commune des marchés (OCM) de la pêche et de l'aquaculture est la politique de gestion de ce marché au sein de l'Union. Fondée sur l'<span class="kb-fact">article 42 et l'article 43, paragraphe 2, du traité sur le fonctionnement de l'Union européenne</span>, elle vise la viabilité environnementale et économique du secteur et constitue un pilier de la politique commune de la pêche (PCP).</p><p><b>Évolution et instruments</b> Mise en oeuvre depuis <span class="kb-fact">1970</span>, révisée en <span class="kb-fact">1981 et 1999</span>, l'OCM est aujourd'hui régie par le <span class="kb-fact">règlement (UE) nº 1379/2013</span>, entré en vigueur le <span class="kb-fact">1er janvier 2014</span>. Il fixe des normes communes de commercialisation, une information obligatoire des consommateurs, encadre les organisations de producteurs et renforce la connaissance du marché via l'<span class="kb-fact">Observatoire européen des marchés des produits de la pêche et de l'aquaculture (EUMOFA)</span>.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Production aquacole dans l'Union européenne`, body:`
<p><b>Contexte et enjeux</b> L'aquaculture européenne produit environ <span class="kb-fact">1,2 million de tonnes</span> annuelles, pour une valeur de <span class="kb-fact">3,9 milliards d'euros en 2020</span>. Contrairement à la production mondiale en forte croissance, la production de l'UE demeure stable. Les principaux producteurs sont <span class="kb-fact">l'Espagne (24 %)</span>, <span class="kb-fact">la France (21 %)</span>, <span class="kb-fact">la Grèce (11 %)</span> et <span class="kb-fact">l'Italie (10 %)</span>. Les espèces dominantes sont <span class="kb-fact">les moules (30 %)</span>, <span class="kb-fact">la truite (17 %)</span>, <span class="kb-fact">les huîtres (9 %)</span> et <span class="kb-fact">la daurade (8 %)</span>.</p><p><b>Base juridique et objectifs</b> <span class="kb-fact">Les articles 38 à 44 du traité sur le fonctionnement de l'Union européenne</span> établissent la politique commune de la pêche. <span class="kb-fact">Le règlement (UE) nº 1380/2013</span> définit le cadre du développement durable. <span class="kb-fact">Le Feampa (2021/1139)</span> finance l'innovation et la durabilité. La politique vise à renforcer la compétitivité, réduire la dépendance aux importations et garantir la durabilité environnementale du secteur.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Politique maritime intégrée de l'Union européenne`, body:`
<p><b>Définition et cadre.</b> La politique maritime intégrée de l'UE est une approche globale et coordonnée pour gérer les activités maritimes et promouvoir une économie bleue durable. Son cadre juridique principal est le <span class="kb-fact">règlement (UE) n° 508/2014</span> relatif au Fonds européen pour les affaires maritimes et la pêche, complété par plusieurs articles du TFUE (<span class="kb-fact">42, 91, 100, 174-175, 191, 194-195</span>).</p><p><b>Objectifs et évolution.</b> Lancée en <span class="kb-fact">2007</span>, elle poursuit cinq objectifs stratégiques : exploitation durable des mers, connaissance et innovation, qualité de vie côtière, leadership maritime international et meilleure visibilité de l'Europe maritime. Elle couvre notamment le transport maritime, la pêche, l'aquaculture, le tourisme et l'énergie en mer. La notion de « croissance bleue » (<span class="kb-fact">2012</span>) a évolué vers celle d'« économie bleue durable » (<span class="kb-fact">2021</span>), en lien avec le pacte vert pour l'Europe. Le <span class="kb-fact">20 mai</span> est la journée maritime européenne.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Les secteurs de la pêche et de l'aquaculture de l'Union en chiffres`, body:`
<p><b>Domaine et fondement</b> La fiche thématique expose les principaux aspects des secteurs de la pêche et de l'aquaculture de l'Union européenne. Elle couvre l'application de la <span class="kb-fact">politique commune de la pêche (PCP)</span> au moyen de données statistiques de base.</p>

<p><b>Ressources et production</b> L'UE-27 dispose d'une <span class="kb-fact">flotte de pêche de 56 070 bateaux</span> (2025), pour une puissance motrice de <span class="kb-fact">4 038 940 kW</span>. La production atteint <span class="kb-fact">2 838 459 tonnes</span> en prises marines et <span class="kb-fact">1 088 672 tonnes</span> en aquaculture (2022). La consommation moyenne s'élève à <span class="kb-fact">23,51 kg par habitant</span> annuellement.</p>

<p><b>Financement et gestion</b> Le <span class="kb-fact">Fonds européen pour les affaires maritimes, la pêche et l'aquaculture (Feampa)</span> soutient les politiques de développement durable du secteur pour <span class="kb-fact">2021-2027</span>.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Politique commune des transports : vue d'ensemble`, body:`
<p><b>Domaine et base juridique</b> La politique commune des transports est une compétence partagée entre l'Union et ses États membres, selon l'<span class="kb-fact">article 4, paragraphe 2, point g) du traité sur le fonctionnement de l'Union européenne (TFUE)</span>. Le <span class="kb-fact">titre VI du TFUE</span> établit le cadre permettant l'adoption de règles communes pour le transport international, l'accès au marché, la sécurité et l'harmonisation des dispositions nationales.</p><p><b>Objectifs climatiques</b> Le <span class="kb-fact">livre blanc de 2011</span> fixait un objectif de réduction des émissions du secteur d'au moins <span class="kb-fact">60 % entre 1990 et 2050</span>. Pour atteindre la neutralité climatique, l'objectif est désormais une réduction de <span class="kb-fact">90 % des émissions de CO2 d'ici 2050</span>, avec une cible d'au moins <span class="kb-fact">30 millions de voitures à émissions nulles en circulation d'ici 2030</span>. Le transport combiné de marchandises est encadré par la <span class="kb-fact">directive 92/106/CEE</span> de 1992.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Transport maritime : approche stratégique`, body:`
