c:1,ex:`Le texte le dit expressément. La découverte a précédé la théorie, aucun des deux n'existe à température ambiante, et c'est la superfluidité qui concerne la viscosité.`},

{passage:`Le braille repose sur des combinaisons de six points en relief. Ce nombre limité impose des contractions et des abréviations dans la plupart des transcriptions courantes, ce qui produit un système à deux niveaux : un braille intégral, plus simple à apprendre, et un braille abrégé, plus rapide à lire pour qui le maîtrise. La transcription mathématique et musicale mobilise des conventions distinctes. La diffusion des synthèses vocales a réduit l'apprentissage du braille chez certains publics, ce qui inquiète des spécialistes pour qui l'écoute ne procure pas le rapport à l'orthographe que donne la lecture tactile.`,
opts:[`Le braille abrégé est plus simple à apprendre que le braille intégral.`,`Certains spécialistes estiment que l'écoute ne procure pas le rapport à l'orthographe que donne la lecture tactile.`,`Les transcriptions mathématiques utilisent les mêmes conventions que le texte courant.`,`Les synthèses vocales ont accru l'apprentissage du braille.`],
c:1,ex:`Le texte rapporte cette inquiétude. L'intégral est plus simple, les mathématiques ont des conventions distinctes, et les synthèses vocales ont au contraire réduit l'apprentissage.`},

{passage:`La lumière des étoiles nous parvient avec un retard égal à la distance parcourue divisée par la vitesse de la lumière. Observer un objet lointain revient donc à observer son état passé, ce qui fait de l'astronomie une science historique autant qu'une science physique. Pour les objets les plus lointains, le retard atteint plusieurs milliards d'années, et l'objet observé peut avoir changé d'état ou disparu. L'expansion de l'univers ajoute une difficulté : la distance actuelle d'un objet dépasse celle qu'a parcourue sa lumière, puisque l'espace s'est dilaté pendant le trajet.`,
opts:[`Observer une étoile lointaine renseigne sur son état actuel.`,`La distance actuelle d'un objet lointain dépasse celle qu'a parcourue sa lumière.`,`Le retard est identique pour tous les objets observés.`,`L'expansion de l'univers ne joue aucun rôle dans le calcul des distances.`],
c:1,ex:`Le texte l'explique par la dilatation de l'espace pendant le trajet. On observe un état passé, le retard dépend de la distance, et l'expansion joue un rôle explicite.`},

{passage:`Les crues d'un cours d'eau résultent de la conjonction de précipitations et de l'état préalable du bassin versant. Un sol déjà saturé absorbe peu et transmet rapidement l'eau au réseau hydrographique, si bien qu'une pluie modérée peut alors provoquer une crue plus forte qu'une pluie intense sur sol sec. L'imperméabilisation liée à l'urbanisation accentue ce transfert. Les ouvrages de protection modifient la répartition du risque plutôt qu'ils ne le suppriment : en accélérant l'écoulement à l'amont, ils peuvent aggraver la situation à l'aval.`,
opts:[`Une pluie intense provoque toujours une crue plus forte qu'une pluie modérée.`,`Les ouvrages de protection peuvent aggraver la situation à l'aval.`,`L'imperméabilisation réduit le transfert de l'eau au réseau.`,`L'état préalable du sol est sans effet sur la crue.`],
c:1,ex:`Le texte le dit en expliquant l'accélération de l'écoulement à l'amont. L'état du sol est déterminant, l'imperméabilisation accentue le transfert, et la pluie modérée sur sol saturé peut faire pire.`},

{passage:`Une monnaie remplit trois fonctions : unité de compte, intermédiaire des échanges et réserve de valeur. Ces fonctions ne sont pas nécessairement assurées par le même objet, ni au même degré. Dans les économies à forte inflation, la monnaie nationale continue d'assurer les échanges quotidiens tandis que l'épargne se réfugie dans une devise étrangère, la fonction de réserve étant la première à se dégrader. L'inverse est rare. Cette dissociation explique que la confiance dans une monnaie ne se mesure pas seulement à son usage courant.`,
opts:[`Les trois fonctions de la monnaie sont toujours assurées par le même objet.`,`En forte inflation, la fonction de réserve de valeur se dégrade avant les autres.`,`La fonction d'intermédiaire des échanges disparaît la première.`,`La confiance dans une monnaie se mesure à son seul usage courant.`],
c:1,ex:`Le texte l'affirme et donne l'exemple de l'épargne en devise étrangère. Les fonctions peuvent se dissocier, les échanges quotidiens résistent, et l'usage courant ne suffit pas à mesurer la confiance.`},

{passage:`Les fourmis coupeuses de feuilles ne consomment pas directement la végétation qu'elles récoltent. Elles la transportent dans des chambres souterraines pour y cultiver un champignon dont elles se nourrissent. Cette agriculture suppose de maintenir des conditions constantes d'humidité et de température, et d'éliminer les moisissures concurrentes, tâche assurée par des ouvrières spécialisées et par des bactéries hébergées sur leur cuticule. La colonie dépend entièrement de ce champignon, qui de son côté ne se rencontre pratiquement plus à l'état libre. Chacune des deux espèces a perdu la capacité de vivre sans l'autre.`,
opts:[`Les fourmis coupeuses se nourrissent directement des feuilles récoltées.`,`Chacune des deux espèces a perdu la capacité de vivre sans l'autre.`,`Le champignon cultivé est répandu à l'état libre.`,`Les moisissures concurrentes sont éliminées par les seules bactéries.`],
c:1,ex:`La dernière phrase l'énonce. Les feuilles nourrissent le champignon, celui-ci ne se rencontre presque plus à l'état libre, et les ouvrières spécialisées interviennent aussi contre les moisissures.`},

{passage:`Le cadastre napoléonien a été établi pour asseoir l'impôt foncier sur une description systématique des parcelles. Sa précision varie selon les communes et les époques de levé, et il ne représentait pas les bâtiments avec la même exigence que les limites de propriété. Les historiens l'utilisent néanmoins comme source pour reconstituer l'occupation du sol antérieure aux transformations agricoles du vingtième siècle. Sa numérisation a rendu possibles des comparaisons à grande échelle, tout en révélant des écarts de méthode entre feuilles voisines qui interdisent certains rapprochements automatiques.`,
opts:[`Le cadastre napoléonien a été établi à des fins historiques.`,`Sa numérisation a révélé des écarts de méthode entre feuilles voisines.`,`Sa précision est homogène sur tout le territoire.`,`Les bâtiments y étaient relevés avec la même exigence que les limites de propriété.`],
c:1,ex:`Le texte le mentionne comme une conséquence de la numérisation. La finalité était fiscale, la précision varie, et les bâtiments étaient moins soignés.`},

{passage:`Un vaccin entraîne le système immunitaire à reconnaître un agent pathogène sans provoquer la maladie. Son efficacité individuelle ne se confond pas avec son effet collectif : même partielle, une couverture vaccinale élevée réduit la circulation de l'agent et protège indirectement des personnes non vaccinées ou mal protégées. Ce raisonnement suppose que le vaccin réduise la transmission et pas seulement les formes graves, ce qui n'est pas le cas de tous. Le seuil de couverture nécessaire dépend de la contagiosité de l'agent et n'est donc pas le même d'une maladie à l'autre.`,
opts:[`Tous les vaccins réduisent la transmission de l'agent pathogène.`,`Le seuil de couverture nécessaire dépend de la contagiosité de l'agent.`,`L'efficacité individuelle et l'effet collectif sont équivalents.`,`Une couverture partielle n'a aucun effet collectif.`],
c:1,ex:`Le texte le dit et en tire que le seuil varie d'une maladie à l'autre. Tous les vaccins ne réduisent pas la transmission, les deux notions sont distinguées, et une couverture élevée même partielle a un effet.`},

{passage:`L'architecture gothique se caractérise par la croisée d'ogives, l'arc brisé et l'arc-boutant, qui reportent les charges vers des points d'appui extérieurs. Cette répartition libère les murs de leur fonction porteuse et permet d'y ouvrir de vastes baies. La hauteur des nefs a suscité une émulation entre chantiers, qui s'est parfois soldée par des effondrements. Le terme gothique lui-même est postérieur et fut d'abord péjoratif, employé pour désigner un style jugé barbare par opposition à l'antique. Il n'a été réhabilité qu'au dix-neuvième siècle.`,
opts:[`Le terme gothique a été employé dès l'origine par les bâtisseurs.`,`L'arc-boutant reporte les charges vers des points d'appui extérieurs.`,`Les murs conservent leur fonction porteuse dans l'architecture gothique.`,`Aucun chantier gothique n'a connu d'effondrement.`],
c:1,ex:`C'est la définition donnée. Le terme est postérieur et péjoratif, les murs sont libérés de leur fonction porteuse, et des effondrements sont mentionnés.`},

{passage:`Les marchés d'occasion en ligne ont modifié la durée de vie effective des biens en abaissant le coût de la revente. Un objet qui aurait été conservé ou jeté trouve un acheteur, ce qui allonge son usage total. L'effet net sur les ressources n'est pas pour autant évident : la facilité de revente peut inciter à acheter plus souvent du neuf, en anticipant une valeur de revente. Les études disponibles concluent à un bilan variable selon les catégories de produits, favorable pour l'ameublement et plus ambigu pour l'électronique, dont le renouvellement s'accélère.`,
opts:[`Le bilan des marchés d'occasion est uniformément favorable.`,`La facilité de revente peut inciter à acheter plus souvent du neuf.`,`Les études concluent à un bilan défavorable pour l'ameublement.`,`La revente en ligne n'affecte pas la durée d'usage des biens.`],
c:1,ex:`Le texte présente cet effet contraire. Le bilan est variable, l'ameublement est le cas favorable, et la revente allonge l'usage total.`},

{passage:`Le tir à l'arc traditionnel japonais accorde plus d'importance à la forme du geste qu'à l'atteinte de la cible. Un tir techniquement irréprochable qui manque la cible est jugé supérieur à un tir approximatif qui l'atteint. Cette hiérarchie déconcerte souvent les pratiquants venus d'autres disciplines, où le résultat prime. Ses défenseurs soutiennent que la régularité du geste produit la précision comme conséquence, et non l'inverse. La pratique comporte une part de rituel dont la codification est jugée par certains excessive et par d'autres inséparable de la discipline.`,
opts:[`L'atteinte de la cible prime sur la forme du geste.`,`Un tir techniquement irréprochable manquant la cible est jugé supérieur à un tir approximatif qui l'atteint.`,`La codification rituelle fait l'unanimité.`,`Les défenseurs estiment que la précision produit la régularité.`],
c:1,ex:`Le texte l'énonce exactement. La forme prime, la codification est discutée, et le raisonnement va de la régularité vers la précision.`},

{passage:`La monoculture facilite la mécanisation et abaisse les coûts, mais elle expose la parcelle à une propagation rapide des ravageurs, chaque plante offrant un hôte identique au suivant. La rotation des cultures interrompt les cycles de développement en changeant l'hôte disponible d'une année sur l'autre. Elle améliore aussi la structure du sol lorsqu'elle associe des espèces aux enracinements différents. Son adoption reste freinée par des contraintes économiques : les débouchés et les équipements sont souvent spécialisés sur une production, ce qui rend le changement coûteux à court terme.`,
opts:[`La rotation des cultures n'a aucun effet sur la structure du sol.`,`L'adoption de la rotation est freinée par la spécialisation des débouchés et des équipements.`,`La monoculture limite la propagation des ravageurs.`,`La rotation abaisse les coûts à court terme.`],
c:1,ex:`Le texte donne cette raison économique. La rotation améliore la structure du sol, la monoculture favorise la propagation, et le changement est coûteux à court terme.`},

{passage:`Un four à micro-ondes chauffe les aliments en agitant les molécules d'eau qu'ils contiennent. Les zones les plus sèches chauffent donc moins, ce qui explique les températures inégales et impose un temps de repos permettant à la chaleur de se répartir. La puissance annoncée correspond à la puissance restituée et non à celle consommée. Les récipients métalliques sont proscrits parce qu'ils réfléchissent les ondes, ce qui peut endommager l'appareil. Contrairement à une crainte répandue, les aliments ne deviennent pas radioactifs : les ondes utilisées ne modifient pas les noyaux atomiques.`,
opts:[`Les aliments chauffés au micro-ondes deviennent légèrement radioactifs.`,`Le temps de repos permet à la chaleur de se répartir malgré un chauffage inégal.`,`Les zones sèches chauffent plus que les zones humides.`,`La puissance annoncée correspond à la puissance consommée.`],
c:1,ex:`Le texte le justifie par le chauffage inégal. La radioactivité est explicitement écartée, les zones sèches chauffent moins, et la puissance annoncée est celle restituée.`},

{passage:`La cartographie des fonds marins reste très incomplète comparée à celle de la surface de plusieurs planètes voisines. Les satellites ne pénètrent pas l'eau, si bien que la mesure fine suppose des navires équipés de sondeurs, lente et coûteuse. Des estimations globales existent, déduites de variations du champ de gravité mesurées depuis l'espace, mais leur résolution est grossière : elles détectent les reliefs majeurs sans restituer le détail. Les campagnes récentes ont révélé des monts sous-marins inconnus, ce qui a des implications pour la navigation, la pêche et la modélisation des courants.`,
opts:[`Les satellites permettent une cartographie fine des fonds marins.`,`Les estimations déduites du champ de gravité détectent les reliefs majeurs sans restituer le détail.`,`La cartographie des fonds marins est plus avancée que celle des planètes voisines.`,`Les campagnes récentes n'ont rien révélé de nouveau.`],
c:1,ex:`Le texte qualifie leur résolution de grossière. Les satellites ne pénètrent pas l'eau, la cartographie sous-marine est en retard, et des monts inconnus ont été découverts.`},

{passage:`Le droit de préemption permet à une autorité publique d'acquérir un bien mis en vente en se substituant à l'acquéreur pressenti, au prix convenu ou à un prix qu'elle propose. Il ne crée pas d'obligation de vendre : il ne s'exerce que si le propriétaire a décidé de céder son bien. Son usage est encadré par une finalité d'intérêt général qui doit être motivée, faute de quoi la décision est susceptible d'annulation. Les délais de réponse sont brefs, ce qui pèse sur les transactions et constitue la critique la plus fréquente du dispositif.`,
opts:[`Le droit de préemption oblige le propriétaire à vendre.`,`La décision de préemption doit être motivée par une finalité d'intérêt général.`,`Le prix est toujours fixé unilatéralement par l'autorité publique.`,`Les délais de réponse sont longs.`],
c:1,ex:`Le texte l'indique et précise la sanction, l'annulation. Il n'y a pas d'obligation de vendre, le prix peut être celui convenu, et les délais sont brefs.`},

{passage:`La domestication du blé s'est accompagnée d'une modification décisive : la perte de la dissémination spontanée des grains. Chez les formes sauvages, l'épi se fragmente à maturité pour disperser les semences ; chez les formes cultivées, il reste intact, ce qui permet la récolte mais rend la plante dépendante de l'homme pour sa reproduction. Cette transformation n'a pas été instantanée : les niveaux archéologiques montrent une coexistence prolongée des deux formes. Elle résulte probablement d'une sélection non intentionnelle, les grains restés sur l'épi étant surreprésentés dans ce qui était récolté puis ressemé.`,
opts:[`La transformation du blé a été instantanée.`,`Les formes cultivées dépendent de l'homme pour leur reproduction.`,`L'épi des formes sauvages reste intact à maturité.`,`La sélection a été entièrement intentionnelle.`],
c:1,ex:`Le texte le déduit de la perte de dissémination. La coexistence fut prolongée, l'épi sauvage se fragmente, et la sélection est présentée comme non intentionnelle.`},

{passage:`Les langues signées possèdent une grammaire propre, distincte de celle des langues vocales des mêmes territoires. Elles ne sont donc pas une transcription gestuelle du français ou de l'anglais, et il n'existe pas de langue des signes universelle. L'espace de signation y remplit des fonctions grammaticales, notamment pour marquer les relations entre les référents introduits. La reconnaissance juridique de ces langues varie fortement d'un pays à l'autre, et l'accès à une scolarisation dans la langue signée reste un sujet de débat, y compris au sein des communautés concernées.`,
opts:[`Il existe une langue des signes universelle.`,`L'espace de signation remplit des fonctions grammaticales.`,`Les langues signées transcrivent la langue vocale du territoire.`,`La reconnaissance juridique de ces langues est uniforme.`],
c:1,ex:`Le texte l'affirme explicitement. Il n'existe pas de langue universelle, ces langues ne sont pas des transcriptions, et la reconnaissance varie fortement.`},

{passage:`L'effet de serre est un phénomène naturel sans lequel la température moyenne de la surface terrestre serait très inférieure à ce qu'elle est. Certains gaz laissent passer le rayonnement solaire incident et absorbent une partie du rayonnement infrarouge réémis par le sol. L'augmentation de leur concentration renforce ce mécanisme. La vapeur d'eau y contribue fortement, mais sa concentration dépend de la température plutôt qu'elle ne la détermine : elle amplifie un réchauffement initial sans en être la cause première. Cette distinction entre forçage et rétroaction est centrale dans la modélisation du climat.`,
opts:[`L'effet de serre est un phénomène entièrement artificiel.`,`La vapeur d'eau amplifie un réchauffement initial sans en être la cause première.`,`La concentration de vapeur d'eau détermine la température.`,`Les gaz à effet de serre bloquent le rayonnement solaire incident.`],
c:1,ex:`Le texte l'énonce en distinguant forçage et rétroaction. L'effet de serre est naturel, la vapeur d'eau dépend de la température, et les gaz laissent passer le rayonnement incident.`},

{passage:`Un indice boursier suit l'évolution d'un panier de valeurs sélectionnées selon des règles publiées. La composition est révisée périodiquement, les entreprises qui ne remplissent plus les critères étant remplacées. Cette révision introduit un biais : les valeurs en difficulté sortent de l'indice, dont la performance affichée surestime alors celle qu'aurait obtenue un investisseur immobile. La pondération choisie compte également : un indice pondéré par la capitalisation reflète surtout les plus grandes entreprises, si bien que quelques valeurs peuvent en déterminer l'essentiel du mouvement.`,
opts:[`La composition d'un indice reste fixe dans le temps.`,`La sortie des valeurs en difficulté fait surestimer la performance affichée de l'indice.`,`Un indice pondéré par la capitalisation reflète également toutes les entreprises.`,`Les règles de sélection ne sont pas publiées.`],
c:1,ex:`Le texte décrit précisément ce biais. La composition est révisée, la pondération par capitalisation favorise les grandes valeurs, et les règles sont publiées.`},

{passage:`Le vitrail médiéval tire ses couleurs de la coloration du verre dans la masse, obtenue par ajout d'oxydes métalliques lors de la fusion. Les détails, en revanche, sont peints à la grisaille puis fixés par cuisson. La lecture d'un vitrail suppose de tenir compte des restaurations successives, qui ont souvent remplacé des pièces manquantes par des éléments d'autres provenances. Certaines compositions apparemment cohérentes rassemblent ainsi des pièces d'époques différentes. Les analyses physico-chimiques permettent aujourd'hui de dater les verres et de reconstituer l'histoire matérielle de la baie.`,
opts:[`Les couleurs du vitrail médiéval sont peintes en surface.`,`Certaines compositions apparemment cohérentes rassemblent des pièces d'époques différentes.`,`Les restaurations ont toujours utilisé des pièces d'origine.`,`La grisaille sert à colorer le verre dans la masse.`],
c:1,ex:`Le texte en fait la conséquence des restaurations. La couleur est dans la masse, les remplacements viennent d'autres provenances, et la grisaille sert aux détails.`},

{passage:`Un procès-verbal de réunion n'a pas vocation à transcrire les échanges mais à conserver ce qui engage. Il consigne les décisions, leur auteur et leur échéance, ainsi que les positions divergentes lorsqu'elles ont été formellement exprimées. Un compte rendu trop détaillé devient inutilisable, un compte rendu trop bref laisse place à des interprétations opposées quelques mois plus tard. La pratique consistant à faire valider le projet par les participants avant diffusion sert moins à corriger des erreurs qu'à établir un accord sur ce qui a été décidé.`,
opts:[`Un procès-verbal doit transcrire l'intégralité des échanges.`,`La validation du projet par les participants sert surtout à établir un accord sur les décisions.`,`Un compte rendu bref évite toute ambiguïté ultérieure.`,`Les positions divergentes ne doivent jamais figurer.`],
c:1,ex:`Le texte le précise, en opposant cette fonction à la simple correction d'erreurs. La transcription intégrale est écartée, la brièveté excessive ouvre l'interprétation, et les divergences formellement exprimées sont consignées.`},

{passage:`La restauration d'une œuvre peut viser deux objectifs distincts : rétablir un état supposé d'origine, ou stabiliser l'état actuel en rendant les interventions identifiables. La première approche a produit au dix-neuvième siècle des reconstitutions qui ont effacé des états intermédiaires historiquement significatifs. La seconde, dominante aujourd'hui, privilégie la réversibilité et la lisibilité de l'intervention. Elle n'échappe pas à la critique : une lacune laissée visible peut nuire à la compréhension de l'ensemble, et le choix de ce qui est stabilisé engage lui aussi une interprétation.`,
opts:[`L'approche dominante aujourd'hui vise à rétablir l'état d'origine.`,`Le choix de ce qui est stabilisé engage lui aussi une interprétation.`,`Les reconstitutions du dix-neuvième siècle ont préservé les états intermédiaires.`,`L'approche actuelle échappe à toute critique.`],
c:1,ex:`Le texte le reconnaît explicitement. L'approche dominante est la stabilisation, les reconstitutions ont effacé des états intermédiaires, et la critique est présentée.`},

{passage:`Les crues des grands fleuves déposent des limons qui entretiennent la fertilité des plaines alluviales. La construction de barrages en amont retient une part de ces sédiments, ce qui améliore la régulation des débits mais appauvrit progressivement les terres situées à l'aval et réduit l'apport aux deltas. Ces derniers, privés d'alimentation, s'enfoncent et reculent devant la mer, un effet aggravé par l'élévation du niveau marin. Les tentatives de compensation par apport artificiel de sédiments se heurtent au coût du transport et au volume nécessaire.`,
opts:[`Les barrages augmentent l'apport de sédiments aux deltas.`,`Les deltas privés d'alimentation en sédiments s'enfoncent et reculent.`,`L'élévation du niveau marin atténue le recul des deltas.`,`La compensation artificielle est peu coûteuse.`],
c:1,ex:`Le texte l'affirme et mentionne l'aggravation par l'élévation marine. Les barrages retiennent les sédiments, l'élévation aggrave, et la compensation se heurte au coût.`},

{passage:`Le jeu d'échecs a longtemps servi de référence pour évaluer les programmes informatiques. Leur supériorité actuelle sur les meilleurs joueurs humains n'a pas fait disparaître la pratique, contrairement à ce que certains annonçaient. Elle a modifié l'entraînement, les joueurs analysant leurs parties avec des programmes qui indiquent des continuations qu'aucun humain n'aurait envisagées. Une conséquence inattendue est l'homogénéisation partielle des ouvertures, chacun disposant des mêmes analyses. Une autre est l'apparition d'un problème de contrôle inédit lors des compétitions en ligne, la triche étant difficile à établir.`,
opts:[`La supériorité des programmes a fait disparaître la pratique des échecs.`,`L'accès aux mêmes analyses a partiellement homogénéisé les ouvertures.`,`Les programmes ne proposent que des continuations déjà connues des humains.`,`La triche en ligne est facile à établir.`],
c:1,ex:`Le texte le présente comme une conséquence inattendue. La pratique n'a pas disparu, les programmes indiquent des continuations inédites, et la triche est difficile à établir.`},

{passage:`La rouille du fer résulte d'une réaction électrochimique nécessitant à la fois de l'oxygène et de l'eau. Un fer conservé en atmosphère parfaitement sèche ne rouille pas, de même qu'un fer immergé dans une eau totalement privée d'oxygène. La présence de sel accélère fortement le phénomène en augmentant la conductivité de l'électrolyte. Contrairement à la couche formée sur l'aluminium, la rouille n'est pas protectrice : poreuse, elle laisse progresser la corrosion en profondeur. C'est cette différence qui explique la nécessité de revêtements sur les ouvrages en acier.`,
opts:[`La rouille protège le métal comme la couche formée sur l'aluminium.`,`Un fer immergé dans une eau privée d'oxygène ne rouille pas.`,`Le sel ralentit la corrosion.`,`L'eau seule suffit à provoquer la rouille.`],
c:1,ex:`Le texte l'énonce parmi les deux cas d'absence de corrosion. La rouille est poreuse et non protectrice, le sel accélère, et l'oxygène est également nécessaire.`},

{passage:`Un texte traduit porte la marque de deux normes : celle de la langue de départ et celle de la langue d'arrivée. Les traducteurs distinguent les approches privilégiant la fidélité à la lettre et celles privilégiant l'effet produit sur le lecteur. Aucune n'est neutre : conserver une construction étrangère signale l'origine du texte, la naturaliser l'efface. Le choix dépend de la fonction visée. Une notice technique appelle une naturalisation complète, alors qu'un texte littéraire peut gagner à conserver une part d'étrangeté, à condition que le lecteur puisse l'attribuer à l'original et non à une maladresse.`,
opts:[`L'approche privilégiant l'effet produit est neutre.`,`Le choix entre les deux approches dépend de la fonction visée par le texte.`,`Une notice technique gagne à conserver une part d'étrangeté.`,`Conserver une construction étrangère efface l'origine du texte.`],
c:1,ex:`Le texte l'affirme et illustre par la notice et le texte littéraire. Aucune approche n'est neutre, la notice appelle la naturalisation, et conserver la construction signale l'origine.`},

{passage:`Les incendies de forêt jouent un rôle écologique dans certains milieux, où des espèces dépendent du passage du feu pour leur régénération : la chaleur ouvre les cônes ou lève la dormance des graines. La suppression systématique des feux dans ces milieux conduit à une accumulation de combustible qui rend les incendies suivants plus intenses et plus difficiles à maîtriser. Les brûlages dirigés visent à reproduire un régime de feux de faible intensité. Leur acceptation sociale reste difficile, l'idée d'allumer volontairement un feu heurtant une longue politique de prévention.`,
opts:[`Tous les milieux forestiers dépendent du feu pour leur régénération.`,`La suppression systématique des feux rend les incendies suivants plus intenses.`,`Les brûlages dirigés sont largement acceptés socialement.`,`La chaleur du feu détruit systématiquement les graines.`],
c:1,ex:`Le texte l'explique par l'accumulation de combustible. Seuls certains milieux dépendent du feu, l'acceptation est difficile, et la chaleur peut lever la dormance.`},

{passage:`La numérotation des maisons est une innovation administrative relativement récente, généralisée en Europe à partir du dix-huitième siècle pour des besoins fiscaux, militaires et postaux. Elle a rencontré des résistances, notamment parce qu'elle rendait les habitants identifiables et localisables par l'administration. Les systèmes retenus varient : numérotation continue par rue, alternance des pairs et des impairs, ou numérotation métrique fondée sur la distance à une origine. Chaque système traduit une conception différente de l'espace urbain, la numérotation métrique permettant par exemple d'insérer une construction nouvelle sans renuméroter la rue entière.`,
opts:[`La numérotation des maisons est une pratique très ancienne, antérieure au Moyen Âge.`,`La numérotation métrique permet d'insérer une construction sans renuméroter la rue.`,`Aucune résistance n'a accompagné son introduction.`,`Un seul système de numérotation a été adopté partout.`],
c:1,ex:`Le texte donne cet exemple. La généralisation date du dix-huitième siècle, des résistances sont mentionnées, et plusieurs systèmes coexistent.`},

{passage:`Une chaîne de blocs enregistre des transactions dans des blocs liés entre eux par une empreinte du bloc précédent, ce qui rend toute modification rétroactive détectable. Cette propriété garantit l'intégrité du registre, non la véracité de ce qui y est inscrit : une information fausse inscrite correctement le reste. Le registre est répliqué chez de nombreux participants, ce qui écarte la dépendance à un tiers unique mais impose un mécanisme de mise d'accord coûteux en calcul ou en capital immobilisé. Ces caractéristiques rendent la technologie pertinente dans un nombre de situations plus restreint que ne le suggéraient les annonces initiales.`,
opts:[`Une chaîne de blocs garantit la véracité des informations inscrites.`,`L'intégrité du registre n'empêche pas qu'une information fausse y soit inscrite.`,`Le registre est conservé par un tiers unique.`,`Le mécanisme de mise d'accord est peu coûteux.`],
c:1,ex:`Le texte distingue explicitement intégrité et véracité. Il n'y a pas de tiers unique, et le mécanisme est décrit comme coûteux.`},

{passage:`Les instruments d'observation ont d'abord servi à confirmer des théories existantes avant de produire des découvertes inattendues. La lunette astronomique a été employée pour vérifier des positions planétaires prévues par le calcul, puis a révélé des objets dont l'existence n'était pas soupçonnée. Cette séquence se retrouve dans d'autres disciplines : un instrument conçu pour mesurer une grandeur connue finit par en révéler une autre. Les historiens des sciences y voient un argument contre l'idée d'un progrès purement guidé par la théorie, l'instrument imposant parfois des questions que personne n'avait formulées.`,
opts:[`Les instruments d'observation n'ont jamais servi à vérifier des théories existantes.`,`Un instrument peut imposer des questions que personne n'avait formulées.`,`Le progrès scientifique est entièrement guidé par la théorie.`,`La lunette astronomique n'a révélé aucun objet inattendu.`],
c:1,ex:`Le texte le formule dans sa conclusion. Les instruments ont d'abord servi à vérifier, l'idée d'un progrès purement théorique est écartée, et des objets inattendus ont été révélés.`},

{passage:`Les régimes de retraite par répartition versent les pensions à partir des cotisations prélevées la même année, alors que les régimes par capitalisation reposent sur l'épargne accumulée puis placée. Le premier est sensible au rapport entre actifs et retraités, le second à la valorisation des actifs financiers au moment de la liquidation. Ni l'un ni l'autre ne supprime le risque : ils l'exposent différemment, l'un au risque démographique, l'autre au risque de marché. Les systèmes réels combinent le plus souvent les deux logiques dans des proportions variables.`,
opts:[`La capitalisation supprime le risque supporté par les retraités.`,`Les deux systèmes exposent à des risques de nature différente sans en supprimer aucun.`,`La répartition repose sur l'épargne accumulée.`,`Les systèmes réels reposent sur une seule des deux logiques.`],
c:1,ex:`Le texte l'affirme en nommant les deux risques. La capitalisation ne supprime pas le risque, la répartition repose sur les cotisations courantes, et les systèmes réels combinent les deux.`},

{passage:`La conservation d'aliments par salaison, séchage ou fermentation précède de très loin la réfrigération. Ces procédés modifient le produit au lieu de le maintenir en l'état, ce qui a produit des goûts recherchés pour eux-mêmes bien après que la contrainte de conservation eut disparu. Le fromage, la charcuterie sèche et de nombreux condiments relèvent de cette logique. L'industrialisation a parfois dissocié le goût du procédé, en reproduisant par des additifs un profil obtenu autrefois par la transformation. Les appellations protégées visent notamment à préserver le lien entre le produit et sa méthode d'élaboration.`,
opts:[`Ces procédés maintiennent l'aliment en l'état.`,`Des goûts issus de contraintes de conservation sont restés recherchés après la disparition de ces contraintes.`,`L'industrialisation a renforcé le lien entre goût et procédé.`,`Les appellations protégées portent uniquement sur l'origine géographique.`],
c:1,ex:`Le texte l'énonce. Les procédés modifient le produit, l'industrialisation a dissocié goût et procédé, et les appellations visent aussi la méthode d'élaboration.`},

{passage:`Un audit interne se distingue d'un contrôle de conformité par son objet : il évalue l'efficacité des dispositifs de maîtrise des risques, et non la seule régularité des opérations. Son indépendance suppose qu'il ne soit pas rattaché aux services qu'il examine et qu'il rende compte au niveau le plus élevé. Ses recommandations n'ont pas de force contraignante ; leur mise en œuvre relève de la direction, ce qui explique que le suivi des recommandations soit un indicateur plus significatif que leur nombre. Un audit dont aucune recommandation n'est suivie d'effet n'a produit qu'un coût.`,
opts:[`Un audit interne se limite à vérifier la régularité des opérations.`,`Le suivi des recommandations est un indicateur plus significatif que leur nombre.`,`Les recommandations d'audit sont contraignantes.`,`L'audit interne est rattaché aux services qu'il examine.`],
c:1,ex:`Le texte l'affirme et l'illustre par l'audit sans effet. L'audit dépasse la régularité, ses recommandations ne sont pas contraignantes, et l'indépendance exclut le rattachement.`},
];

/* ================= BANQUE NUMÉRIQUE ================= */
const NUMERIC_BANK = [
{q:`Un pays a exporté pour 240 millions d'euros de marchandises en 2023. Ses exportations ont augmenté de 20 % par rapport à 2022. Quel était le montant des exportations en 2022 ?`,
opts:[`192 M€`,`200 M€`,`210 M€`,`220 M€`],c:1,ex:`240 ÷ 1,20 = 200. On divise par (1 + le taux). Erreur classique : retirer 20 % de 240 donne 192, ce qui est faux.`},
{q:`Sur 1 500 candidats à un concours, 60 % sont des femmes. Parmi les femmes, 15 % ont été admises. Combien de femmes ont été admises ?`,
opts:[`90`,`120`,`135`,`150`],c:2,ex:`1 500 × 0,60 = 900 femmes. 900 × 0,15 = 135.`},
{q:`Un tableau indique la population de quatre pays (en millions) : A = 10, B = 25, C = 8, D = 17. Quelle est la population moyenne ?`,
opts:[`12`,`15`,`17`,`20`],c:1,ex:`(10 + 25 + 8 + 17) ÷ 4 = 60 ÷ 4 = 15.`},
{q:`Un budget de 4,5 M€ est réparti entre trois projets selon un ratio de 2:3:4. Quel montant revient au projet le plus important ?`,
opts:[`1,5 M€`,`2 M€`,`2,5 M€`,`3 M€`],c:1,ex:`Total des parts = 9. Une part = 0,5 M€. Le plus gros projet (4 parts) reçoit 2 M€.`},
{q:`Le prix d'un billet de train passe de 80 € à 92 €. Quel est le pourcentage d'augmentation ?`,
opts:[`10 %`,`12 %`,`15 %`,`20 %`],c:2,ex:`Augmentation = 12 €. 12 ÷ 80 = 15 %.`},
{q:`Une entreprise emploie 340 personnes dont 55 % de femmes. Elle embauche 20 nouveaux employés, tous des hommes. Quel est le nouveau pourcentage d'hommes (arrondi) ?`,
opts:[`45 %`,`48 %`,`50 %`,`52 %`],c:1,ex:`Hommes avant = 153. Total après = 360. Hommes = 173. 173 ÷ 360 ≈ 48 %.`},
{q:`Les émissions de CO₂ de quatre secteurs (en Mt) : Transport 120, Industrie 95, Résidentiel 60, Agriculture 45. Quelle part représente le transport (arrondi) ?`,
opts:[`30 %`,`35 %`,`38 %`,`42 %`],c:2,ex:`Total = 320. 120 ÷ 320 = 37,5 ≈ 38 %.`},
{q:`Un investissement de 10 000 € rapporte un intérêt annuel SIMPLE de 3 %. Quel est le montant total après 4 ans ?`,
opts:[`10 300 €`,`10 900 €`,`11 200 €`,`12 000 €`],c:2,ex:`Intérêt simple = 10 000 × 0,03 × 4 = 1 200 €. Total = 11 200 €.`},
{q:`Sur une carte à l'échelle 1:50 000, une distance de 3,4 cm correspond à quelle distance réelle ?`,
opts:[`0,17 km`,`1,7 km`,`3,4 km`,`17 km`],c:1,ex:`3,4 × 50 000 = 170 000 cm = 1,7 km.`},
{q:`Le taux de chômage d'une région passe de 8,5 % à 7,2 %. De combien de points de pourcentage a-t-il diminué ?`,
opts:[`1,3 point`,`1,5 point`,`8,5 points`,`15 points`],c:0,ex:`8,5 − 7,2 = 1,3 point. Points de pourcentage = soustraction directe, pas variation relative.`},
{q:`Un rapport de 150 pages est traduit à un rythme de 6 pages par heure par traducteur. Combien de temps faut-il à 5 traducteurs travaillant simultanément ?`,

/* Générateurs paramétriques : chiffres renouvelés à chaque session */
function ri(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
/* Le test numérique du concours propose CINQ options, la cinquième étant toujours
   « Aucune de ces réponses ». Elle est parfois la bonne : on retire alors la valeur
   exacte des quatre premières. Sans ce cas de figure, on prend le réflexe de ne
   jamais la cocher, ce qui est exactement le piège. */
/* Nombre de décimales d'une valeur, pour fabriquer des distracteurs de même précision. */
function decOf(v){ const s=String(v); const i=s.indexOf('.'); return i<0?0:Math.min(s.length-i-1,3); }
/* Affichage à la française : virgule décimale, espace pour les milliers. */
function frNum(v){ return typeof v==='number' ? fmtN(v, decOf(v)) : String(v); }

function mkNum(q,correct,distractors,ex,unit,table){
  const u = unit||'';
  const num = typeof correct==='number';
  const d = num ? decOf(correct) : 0;
  const round = v => num ? +(+v).toFixed(d) : v;
  // Le concours propose cinq options. Contrairement a ce que laissait croire une
  // premiere lecture de l'epreuve blanche, la cinquieme n'est PAS toujours
  // « Aucune de ces reponses » : beaucoup de questions alignent cinq valeurs
  // numeriques. On tire donc au sort la presence de la sentinelle.
  const useNone = num ? ri(0,1)===1 : true;
  const nVals = useNone ? 4 : 5;
  const vals=[correct];
  distractors.forEach(x=>{ const v=round(x); if(vals.indexOf(v)===-1) vals.push(v); });
  // Filet de securite quand le generateur fournit trop peu de distracteurs distincts.
  // D'abord des variantes proportionnelles, puis un decalage d'un cran de precision,
  // ce qui garantit des valeurs differentes meme pour une reponse nulle ou negative.
  const step = d>0 ? Math.pow(10,-d) : 1;
  for(let pad=1; num && vals.length<nVals && pad<=40; pad++){
    const v = round(correct*(1 + (pad%2?1:-1)*0.06*Math.ceil(pad/2)));
    if(isFinite(v) && vals.indexOf(v)===-1) vals.push(v);
  }
  for(let k=1; vals.length<nVals && k<=500; k++){
    const cands = num ? [round(correct+k*step), round(correct-k*step)] : [correct+' ('+k+')'];
    cands.forEach(v=>{ if(vals.length<nVals && vals.indexOf(v)===-1) vals.push(v); });
  }
  let picked = vals.slice(0,nVals);
  // La sentinelle n'est la bonne reponse que lorsqu'elle est presente : on retire
  // alors la valeur exacte des propositions chiffrees.
  const noneIsRight = useNone && num && ri(1,6)===1;
  if(noneIsRight){
    let sub = correct, k=1;
    while(picked.indexOf(sub)!==-1 && k<=20){ sub = round(correct*(1+0.11*k)); k++; }
    picked = picked.map(v=>v===correct ? sub : v);
  }
  const opts = picked.map(v=>frNum(v)+u);
  if(useNone) opts.push(NONE_OPT);
  const item = {q:q, opts:opts, c: noneIsRight ? 4 : picked.indexOf(correct), ex:ex};
  if(noneIsRight) item.ex = ex+` Ici la valeur exacte (`+frNum(correct)+u+`) ne figure pas parmi les propositions : la bonne réponse est « `+NONE_OPT+` ».`;
  if(table) item.table = table;
  return item;
}
/* Rend un tableau de données comme celui affiché au concours. */
function dataTable(caption, headers, rows){
  return '<table class="data-table"><caption>'+caption+'</caption><thead><tr>'
    + headers.map(h=>'<th>'+h+'</th>').join('')
    + '</tr></thead><tbody>'
    + rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')
    + '</tbody></table>';
}
/* Formatage à l'européenne : espace fine pour les milliers, virgule décimale. */
function fmtN(v,dec){
  const n = dec===undefined ? v : +(+v).toFixed(dec);
  const s = String(n).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return s.join(',');
}

/* Le vivier d'une session : les questions écrites, les générateurs sur énoncé et
   les générateurs sur tableau. Les items écrits n'ont que quatre options : on leur
   ajoute la cinquième pour que toutes les questions aient la forme du concours. */
function mkNumericPool(){
  const fixes = NUMERIC_BANK.map(it => it.opts.length===5 ? it : {...it, opts: it.opts.concat([NONE_OPT])});
  const pool = fixes.concat(NUMERIC_TEMPLATES.map(f=>f()));
  // Les générateurs sur tableau sont tirés deux fois pour peser autant que les
  // énoncés écrits ; deux tirages du même générateur peuvent coïncider, on écarte
  // alors le doublon plutôt que de risquer deux questions identiques dans la session.
  const vus = new Set(pool.map(it=>it.q));
  for(let passe=0; passe<2; passe++){
    NUMERIC_TABLE_TEMPLATES.forEach(f=>{
      for(let essai=0; essai<6; essai++){
        const it = f();
        if(vus.has(it.q)) continue;
        vus.add(it.q); pool.push(it); break;
      }
    });
  }
  return pool;
}

/* ================= BANQUE ABSTRAIT ================= */
function regularPoly(cx,cy,r,sides,rotDeg){
  const pts=[]; const rot=(rotDeg-90)*Math.PI/180;
  for(let i=0;i<sides;i++){const a=rot+i*2*Math.PI/sides; pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}
  return pts.join(' ');
}
/* Deux règles de lisibilité, apprises d'items qui étaient insolubles à l'œil :
   1. un trait tracé par-dessus une figure pleine dans la même couleur est invisible,
      il est donc tracé en clair sur fond plein ;
   2. une rotation n'est perceptible que si la figure porte un repère qui tourne
      avec elle, sans quoi un carré à 0° et à 90° sont le même dessin. */
function shapeSVG(spec){
  const {sides,rot=0,scale=1,color='#1B2438',filled=true,dots=0} = spec;
  let inner='';
  if(dots>0){
    const r=26; for(let i=0;i<dots;i++){const a=(-90+i*360/dots)*Math.PI/180; const x=(32+r*Math.cos(a)).toFixed(1),y=(32+r*Math.sin(a)).toFixed(1);
      inner+='<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="'+color+'"/>';}
  } else if(sides===0){
    inner='<circle cx="32" cy="32" r="'+(24*scale).toFixed(1)+'" fill="'+(filled?color:'none')+'" stroke="'+color+'" stroke-width="2.5"/>';
  } else {
    const pts=regularPoly(32,32,24*scale,sides,rot);
    inner='<polygon points="'+pts+'" fill="'+(filled?color:'none')+'" stroke="'+color+'" stroke-width="2.5"/>';
  }
  const overColor = (!dots && filled) ? '#F7F4EE' : color;
  if(spec.hline) inner+='<line x1="10" y1="32" x2="54" y2="32" stroke="'+overColor+'" stroke-width="2.5"/>';
  if(spec.vline) inner+='<line x1="32" y1="10" x2="32" y2="54" stroke="'+overColor+'" stroke-width="2.5"/>';
  if(spec.arrow) inner+=arrowSVG(spec.arrow);
  if(spec.marker && !dots){
    const a=(rot-90)*Math.PI/180, rr=24*scale;
    inner+='<circle cx="'+(32+rr*Math.cos(a)).toFixed(1)+'" cy="'+(32+rr*Math.sin(a)).toFixed(1)+'" r="5.5" fill="'+(filled?'#F7F4EE':color)+'" stroke="'+color+'" stroke-width="2"/>';
  }
  return '<svg viewBox="0 0 64 64" width="100%" height="100%">'+inner+'</svg>';
}

/* ponytail: 17 séries figées, c'est deux sessions avant de tout connaître par cœur.
   Les séries sont donc générées à partir de familles de règles paramétrées, et la
   banque écrite à la main sert de complément. Chaque session tire des séries inédites. */
/* Le test abstrait du concours propose cinq figures candidates, A à E. */
const ABS_OPTS = 5;
const ABS_COLORS = ['#1B2438','#7A1F3D','#2F6B4F','#B8860B'];

/* Signature visuelle d'une figure : deux figures de même clé sont indiscernables
   à l'écran. Sert à garantir 4 options réellement distinctes, notamment pour les
   rotations (un carré tourné de 90° est identique à lui-même). */
function absKey(s){
  const lines = (s.hline?1:0)+''+(s.vline?1:0);
  const arr = s.arrow||'';
  if(s.dots>0) return 'd'+s.dots+'|'+(s.color||ABS_COLORS[0])+'|'+lines+'|'+arr;
  const n = s.sides||0;
  // Avec un repère, la rotation est lisible sur 360° ; sans repère, un polygone
  // régulier se répète tous les 360/n degrés et un cercle ne montre rien.
  const period = s.marker ? 360 : (n>2 ? 360/n : 360);
  const rot = (s.marker || n>2) ? Math.round((((s.rot||0)%period)+period)%period) : 0;
  return n+'|'+rot+'|'+(s.scale||1).toFixed(2)+'|'+(s.filled===false?0:1)+'|'+(s.color||ABS_COLORS[0])+'|'+lines+'|'+(s.marker?'m':'')+'|'+arr;
}

const absPick = a => a[ri(0,a.length-1)];
/* Le rayon dessiné vaut 24 x scale dans un cadre de 64 centré sur 32 : au-delà de
   1,2 la figure est rognée, en dessous de 0,3 elle est illisible. */
const absScale = v => Math.max(0.3, Math.min(1.2, +(+v).toFixed(2)));

/* Pas de rotation admissibles : au moins 40 degrés pour être vus à l'œil, et un
   cycle d'au moins cinq positions pour que les cinq figures de la série soient
   toutes différentes. Le repère rendant la rotation lisible sur 360 degrés, le
   nombre de côtés n'entre plus dans le calcul. */
function absRotStep(){ return absPick([40,45,60,72,80,100,135,144]); }

/* Attributs constants tirés au hasard sur ceux que la famille ne fait pas varier.
   Volontairement limité : un attribut décoratif ne doit jamais gêner la lecture de
   la règle, donc pas de trait ajouté sur une figure pleine ni de taille modifiée. */
function absDecorate(s, varies){
  const out = {...s};
  const free = k => varies.indexOf(k) < 0;
  if(free('color') && ri(0,2)===0) out.color = ABS_COLORS[ri(1,3)];
  if(!out.dots && free('filled') && !out.hline && !out.vline && ri(0,1)) out.filled = !out.filled;
  return out;
}

/* Variantes plausibles de la bonne réponse : un seul attribut fauté à la fois, et
   toujours d'une quantité visible. */
function absPerturb(s){
  const c = [];
  if(s.dots>0){
    c.push({...s,dots:s.dots+1},{...s,dots:Math.max(1,s.dots-1)},{...s,dots:s.dots+2},
           {...s,color:s.color===ABS_COLORS[0]?ABS_COLORS[1]:ABS_COLORS[0]},
           {...s,hline:!s.hline});
  } else {
    const n = s.sides||0;
    c.push({...s,sides:n===0?3:n+1});
    if(n>3) c.push({...s,sides:n-1});
    if(s.marker){ c.push({...s,rot:(s.rot||0)+180}, {...s,rot:(s.rot||0)+90}); }
    // Sans repère, la rotation apparente vaut au mieux la moitié de 360/n : au-delà
    // de six côtés elle descend sous 30° et devient indécelable. On s'en abstient.
    else if(n>2 && n<=6){ c.push({...s,rot:(s.rot||0)+Math.round(360/n/2)}); }
    c.push({...s,scale:absScale((s.scale||1)+0.25)});
    c.push({...s,scale:absScale((s.scale||1)-0.25)});
    c.push({...s,filled:!(s.filled!==false)});
    c.push({...s,color:s.color===ABS_COLORS[0]?ABS_COLORS[1]:ABS_COLORS[0]});
    if(s.filled===false) c.push({...s,hline:!s.hline},{...s,vline:!s.vline});
  }
  return shuffle(c);
}

/* Familles de règles. Elles reprennent la taxonomie classique du raisonnement
   abstrait (forme, remplissage, taille, traits, nombre d'éléments, rotation) en
   n'en gardant que les variations franchement perceptibles. */
function absFamily(){
  switch(ri(0,8)){
    case 0: { // rotation d'une figure repérée

      return {title:`Rotation régulière`, varies:['rot'],

    }
    case 1: { // nombre de côtés
      const d = ri(0,3)===0 ? -1 : 1, start = d>0 ? ri(3,4) : ri(7,8);
      return {title:`Nombre de côtés`, varies:['sides'],
        s0:{sides:start, rot:0, scale:1, filled:false},
        step:s=>({...s, sides:s.sides+d}),
        ex:`Le nombre de côtés ${d>0?'augmente':'diminue'} de 1 à chaque étape. Seul cet attribut varie.`};
    }
    case 2: { // nombre de points
      const d = ri(0,2)===0 ? -1 : 1, start = d>0 ? ri(1,3) : ri(6,8);
      return {title:`Nombre de points`, varies:['dots'],
        s0:{dots:start, color:ABS_COLORS[0]},
        step:s=>({...s, dots:s.dots+d}),
        ex:`Le nombre de points ${d>0?'augmente':'diminue'} de 1 à chaque étape.`};
    }
    case 3: { // taille
      const up = ri(0,1)===1, d = up ? 0.2 : -0.2;
      const start = up ? 0.35 : 1.15;
      return {title:`Taille`, varies:['scale'],
        s0:{sides:absPick([0,3,4,6]), rot:0, scale:start, filled:false},
        step:s=>({...s, scale:absScale(s.scale+d)}),
        ex:`Le rayon ${up?'augmente':'diminue'} d'un pas constant de 0,20. La forme ne change pas.`};
    }
    case 4: { // remplissage alterné + nombre de côtés
      const start = ri(3,4);
      return {title:`Remplissage alterné et côtés`, varies:['sides','filled'],
        s0:{sides:start, rot:0, scale:1, filled:ri(0,1)===1},
        step:s=>({...s, sides:s.sides+1, filled:!s.filled}),
        ex:`Deux règles simultanées : un côté de plus à chaque étape ET le remplissage qui alterne plein / vide. Vérifier les deux avant de valider.`};
    }
    case 5: { // cycle de couleurs
      const len = absPick([3,4]);
      const off = ri(0,len-1);
      return {title:`Cycle de couleurs`, varies:['color'],
        s0:{sides:absPick([0,3,4,5,6]), rot:0, scale:1, filled:true, color:ABS_COLORS[off]},
        step:s=>({...s, color:ABS_COLORS[(ABS_COLORS.indexOf(s.color)+1+len)%len]}),
        ex:`La couleur suit un cycle de ${len===3?'trois':'quatre'} teintes qui se répète, la forme reste identique.`};
    }
    case 6: { // traits, toujours sur une figure vide pour rester lisibles
      const states = [{},{hline:true},{hline:true,vline:true},{vline:true}];
      let i = ri(0,3);
      const s0 = {sides:absPick([0,4,6]), rot:0, scale:1, filled:false, ...states[i]};
      return {title:`Traits ajoutés puis retirés`, varies:['lines'], s0,
        step:s=>{ i=(i+1)%4; return {sides:s.sides, rot:s.rot, scale:s.scale, filled:false, color:s.color, ...states[i]}; },
        ex:`Les traits suivent un cycle : aucun, horizontal, les deux, vertical, puis on recommence.`};
    }
    case 7: { // côtés + rotation repérée
      const d = absRotStep();
      return {title:`Côtés et rotation combinés`, varies:['sides','rot'],
        s0:{sides:3, rot:ri(0,7)*45, scale:1, filled:false, marker:true},
        step:s=>({...s, sides:s.sides+1, rot:s.rot+d}),
        ex:`Deux règles simultanées : un côté de plus ET une rotation du repère de +${d}° à chaque étape.`};
    }
    default: { // taille + remplissage
      return {title:`Taille et remplissage`, varies:['scale','filled'],
        s0:{sides:absPick([0,3,4,5,6]), rot:0, scale:0.4, filled:ri(0,1)===1},
        step:s=>({...s, scale:absScale(s.scale+0.2), filled:!s.filled}),
        ex:`Deux règles simultanées : le rayon augmente de 0,20 ET le remplissage alterne plein / vide.`};
    }
  }
}

/* ================= ABSTRAIT : « QUELLE FIGURE APPARTIENT AU MÊME ENSEMBLE » =========
   Second type d'item du concours, distinct de la suite à compléter. Les cinq figures
   de l'énoncé partagent une règle qui LIE DEUX ATTRIBUTS entre eux ; il faut inférer
   cette règle puis désigner la seule proposition qui la respecte. Il n'y a aucune
   progression à chercher : le piège est justement d'en chercher une. */

/* Une flèche tracée le long d'un bord, comme dans les items officiels. Toujours
   dessinée dans la teinte d'encre par défaut, pour qu'elle ne renseigne jamais sur
   une règle portant sur la couleur de la figure. */
function arrowSVG(dir){
  const c = ABS_COLORS[0];
  const L = {right:[6,59,58,59], left:[58,5,6,5], up:[59,58,59,6], down:[5,6,5,58]}[dir];
  const H = {right:'58,59 50,55 50,63', left:'6,5 14,1 14,9', up:'59,6 55,14 63,14', down:'5,58 1,50 9,50'}[dir];
  return '<line x1="'+L[0]+'" y1="'+L[1]+'" x2="'+L[2]+'" y2="'+L[3]+'" stroke="'+c+'" stroke-width="2"/>'
       + '<polygon points="'+H+'" fill="'+c+'"/>';
}

const ABS_HORIZ = f => f.arrow==='left' || f.arrow==='right';

/* Chaque famille fournit : de quoi tirer une figure au hasard, un test de conformité,
   et le moyen de forcer la conformité ou la violation. */
function absSetFamily(){
  const inv = ri(0,1)===1;             // le sens de la règle est tiré au sort
  const oui = b => inv ? !b : b;
  const C = ABS_COLORS;
  switch(ri(0,5)){
    case 0: return {
      title:`Orientation et remplissage`,
      rand:()=>({sides:absPick([3,4,5,6]), scale:0.72, rot:0, color:C[ri(0,3)], arrow:absPick(['left','right','up','down'])}),
      test:f=>f.filled === oui(ABS_HORIZ(f)),
      apply:(f,ok)=>({...f, filled: ok ? oui(ABS_HORIZ(f)) : !oui(ABS_HORIZ(f))}),
      ex:`La règle lie l'ORIENTATION de la flèche au remplissage : flèche horizontale ⟹ figure ${inv?'vide':'pleine'}, flèche verticale ⟹ figure ${inv?'pleine':'vide'}. Le sens précis de la flèche, le nombre de côtés et la couleur varient librement : ce sont des attributs distracteurs.`};
    case 1: return {
      title:`Parité du nombre de côtés et remplissage`,
      rand:()=>({sides:ri(3,8), scale:1, rot:0, color:C[ri(0,3)]}),
      test:f=>f.filled === oui(f.sides%2===0),
      apply:(f,ok)=>({...f, filled: ok ? oui(f.sides%2===0) : !oui(f.sides%2===0)}),
      ex:`La règle lie la PARITÉ du nombre de côtés au remplissage : nombre pair de côtés ⟹ figure ${inv?'vide':'pleine'}, nombre impair ⟹ figure ${inv?'pleine':'vide'}. Compter les côtés est le seul geste utile ; la couleur ne sert à rien.`};
    case 2: return {
      title:`Trait et couleur`,
      rand:()=>({sides:absPick([0,3,4,6]), scale:1, rot:0, filled:false, hline:ri(0,1)===1, color:C[0]}),
      test:f=>(f.color===C[1]) === oui(!!f.hline),
      apply:(f,ok)=>({...f, color: (ok ? oui(!!f.hline) : !oui(!!f.hline)) ? C[1] : C[0]}),
      ex:`La règle lie la PRÉSENCE DU TRAIT à la couleur : ${inv?'absence':'présence'} de trait ⟹ figure bordeaux, ${inv?'présence':'absence'} ⟹ figure bleu nuit. Le nombre de côtés varie librement.`};
    case 3: return {
      title:`Parité du nombre de points et couleur`,
      rand:()=>({dots:ri(2,8), color:C[0]}),
      test:f=>(f.color===C[2]) === oui(f.dots%2===0),
      apply:(f,ok)=>({...f, color: (ok ? oui(f.dots%2===0) : !oui(f.dots%2===0)) ? C[2] : C[0]}),
      ex:`La règle lie la PARITÉ du nombre de points à la couleur : nombre pair ⟹ points verts, nombre impair ⟹ points bleu nuit${inv?', la correspondance étant inversée ici':''}. Il faut compter, pas estimer.`};
    case 4: return {
      title:`Taille et remplissage`,
      rand:()=>({sides:absPick([0,3,4,5,6]), scale:absPick([0.5,1.1]), rot:0, color:C[ri(0,3)]}),
      test:f=>f.filled === oui(f.scale>0.9),
      apply:(f,ok)=>({...f, filled: ok ? oui(f.scale>0.9) : !oui(f.scale>0.9)}),
      ex:`La règle lie la TAILLE au remplissage : grande figure ⟹ ${inv?'vide':'pleine'}, petite figure ⟹ ${inv?'pleine':'vide'}. La forme et la couleur sont des distracteurs.`};
    default: {
      const inv2 = ri(0,1)===1, oui2 = b => inv2 ? !b : b;
      return {
        title:`Deux règles simultanées`, deux:true,
        rand:()=>({sides:ri(3,6), scale:0.72, rot:ri(0,3)*30, color:C[ri(0,3)], arrow:absPick(['left','right','up','down'])}),
        test:f=>f.filled===oui(ABS_HORIZ(f)) && !!f.marker===oui2(f.sides%2===0),
        apply:(f,ok)=>{
          const g = {...f, filled: oui(ABS_HORIZ(f)), marker: oui2(f.sides%2===0)};
          if(ok) return g;
          return ri(0,1) ? {...g, filled:!g.filled} : {...g, marker:!g.marker};
        },
        ex:`Deux règles s'appliquent en même temps. La première lie l'orientation de la flèche au remplissage : flèche horizontale ⟹ figure ${inv?'vide':'pleine'}. La seconde lie la parité du nombre de côtés à la présence du repère : nombre pair de côtés ⟹ repère ${inv2?'absent':'présent'}. Une proposition qui ne respecte qu'une des deux règles est fausse : c'est le piège de ce type d'item.`};
    }
  }
}

/* Un attribut constant dans tout l'ensemble devient une règle implicite : si la bonne
   réponse s'en écarte, l'item devient contestable. On rejette alors le tirage. */
function absSetSafe(set, ans){
  const keys = ['sides','filled','color','arrow','dots','hline','vline','marker','scale'];
  for(const k of keys){
    const vals = new Set(set.map(f=>String(f[k])));
    if(vals.size===1 && String(ans[k])!==[...vals][0]) return false;
  }
  return true;
}

function genAbstractSet(){
  for(let essai=0; essai<60; essai++){
    const f = absSetFamily();
    const vus = new Set(), set = [];
    for(let g=0; g<400 && set.length<5; g++){
      const x = f.apply(f.rand(), true);
      const k = absKey(x);
      if(vus.has(k)) continue;
      vus.add(k); set.push(x);
    }
    if(set.length<5) continue;
    let ans = null;
    for(let g=0; g<400 && !ans; g++){
      const x = f.apply(f.rand(), true);
      if(!vus.has(absKey(x))) ans = x;
    }
    if(!ans || !absSetSafe(set, ans)) continue;
    const opts = [ans], pris = new Set([absKey(ans)]);
    for(let g=0; g<600 && opts.length<ABS_OPTS; g++){
      const x = f.apply(f.rand(), false);
      const k = absKey(x);
      if(pris.has(k) || f.test(x)) continue;
      pris.add(k); opts.push(x);
    }
    if(opts.length<ABS_OPTS) continue;
    if(opts.filter(f.test).length!==1) continue;      // invariant : une seule conforme
    const p = shuffle(opts.map((_,i)=>i));
    return {kind:'set', title:f.title, seq:set, opts:p.map(i=>opts[i]), c:p.indexOf(0), ex:f.ex,
            _conform:p.map(i=>f.test(opts[i]))};
  }
  return genAbstract();   // repli, jamais atteint en pratique
}

/* Une série complète : 4 figures visibles, la 5e à trouver parmi 4 options distinctes. */
function genAbstract(){
  const f = absFamily();
  f.s0 = absDecorate(f.s0, f.varies);
  const seq = [f.s0];
  for(let i=1;i<5;i++) seq.push(f.step(seq[i-1]));
  const shown = seq.slice(0,4), answer = seq[4];
  const keys = new Set([absKey(answer)]);
  const opts = [answer];
  // shown[3] en tête : "la figure ne change pas" est le distracteur le plus courant.
  for(const cand of [shown[3], shown[2]].concat(absPerturb(answer))){
    if(opts.length>=ABS_OPTS) break;
    const k = absKey(cand);
    if(keys.has(k)) continue;
    keys.add(k); opts.push(cand);
  }
  let g=1;
  while(opts.length<ABS_OPTS){
    const cand = answer.dots>0 ? {...answer,dots:answer.dots+2+g} : {...answer,sides:(answer.sides||0)+g,rot:(answer.rot||0)+17*g};
    const k = absKey(cand);
    if(!keys.has(k)){ keys.add(k); opts.push(cand); }
    if(++g>16) break;
  }
  const p = shuffle(opts.map((_,i)=>i));
  return {title:f.title, seq:shown, opts:p.map(i=>opts[i]), c:p.indexOf(0), ex:f.ex};
}

/* Les séries écrites à la main n'ont que quatre figures candidates : on les complète
   à cinq avec des variantes distinctes de la bonne réponse. */
function absTopUp(item){
  if(item.opts.length>=ABS_OPTS) return item;
  const opts = item.opts.slice();
  const keys = new Set(opts.map(absKey));
  for(const cand of absPerturb(opts[item.c])){
    if(opts.length>=ABS_OPTS) break;
    const k = absKey(cand);
    if(keys.has(k)) continue;
    keys.add(k); opts.push(cand);
  }
  return {...item, opts};
}

/* Une session mélange quelques séries écrites à la main et des séries générées. */
function mkAbsSeries(n){
  const out = shuffle(ABSTRACT_BANK).slice(0, Math.min(3, n)).map(absTopUp);
  const seen = new Set();
  let guard = 0;
  // Deux types d'items coexistent au concours : la suite a completer et l'ensemble
  // regi par une regle. On tire environ deux items sur cinq du second type.
  while(out.length<n && guard++<500){
    const g = ri(1,5)<=2 ? genAbstractSet() : genAbstract();
    const k = g.title+'#'+absKey(g.opts[g.c]);
    if(seen.has(k)) continue;
    seen.add(k); out.push(g);
  }
  while(out.length<n) out.push(genAbstract());
  return shuffle(out);
}

/* ================= COURS UE (9 sections) ================= */
const EU_KNOWLEDGE = [
{title:`1. Histoire et élargissements`, body:`
<p><b>Dates fondatrices</b> · <span class="kb-fact">9 mai 1950</span> : déclaration Schuman (préparée avec Jean Monnet). <span class="kb-fact">1951</span> : traité de Paris, création de la CECA avec 6 pays fondateurs : France, Allemagne (RFA), Italie, Belgique, Pays-Bas, Luxembourg. <span class="kb-fact">1957</span> : traités de Rome, création de la CEE et d'Euratom.</p>
<p><b>Vagues d'élargissement</b> :</p>
<ul>
<li><b>1973</b> · Royaume-Uni, Irlande, Danemark (9 membres)</li>
<li><b>1981</b> · Grèce (10)</li>
<li><b>1986</b> · Espagne, Portugal (12)</li>
<li><b>1995</b> · Autriche, Finlande, Suède (15)</li>
<li><b>2004</b> · le grand élargissement à l'Est : 10 pays dont Pologne, Hongrie, Tchéquie, Slovaquie, les trois États baltes, Slovénie, Malte, Chypre (25)</li>
<li><b>2007</b> · Roumanie, Bulgarie (27)</li>
<li><b>2013</b> · Croatie (28)</li>
<li><b>2020</b> · retrait du Royaume-Uni (Brexit, référendum de 2016) : retour à <span class="kb-fact">27 membres</span></li>
</ul>
<p><b>Pays candidats actuels</b> · Albanie, Bosnie-Herzégovine, Géorgie, Moldavie, Monténégro, Macédoine du Nord, Serbie, Turquie, Ukraine (statuts et rythmes de négociation très variables). Le Kosovo est candidat potentiel. À revérifier dans le référentiel officiel EPSO : ce sujet évolue vite.</p>
<p><b>Autres jalons</b> · 1985 : accord de Schengen. 1993 : marché unique et entrée en vigueur de Maastricht. <span class="kb-fact">2002</span> : mise en circulation des pièces et billets en euros. 2012 : prix Nobel de la paix décerné à l'UE.</p>`},

{title:`2. Les institutions (les 7 officielles)`, body:`
<p>L'article 13 du TUE liste <b>7 institutions</b> :</p>
<p><b>1. Parlement européen</b> · seule institution élue au suffrage universel direct (tous les 5 ans, dernières élections : juin 2024). <span class="kb-fact">720 députés</span> répartis proportionnellement à la population (dégressivité proportionnelle). Colégislateur avec le Conseil, autorité budgétaire, contrôle politique de la Commission (investiture et motion de censure). Présidente : <span class="kb-fact">Roberta Metsola</span> (Malte, PPE), réélue en 2024. Sièges : Strasbourg (plénières), Bruxelles (commissions), Luxembourg (secrétariat général).</p>
<p><b>2. Conseil européen</b> · chefs d'État ou de gouvernement + son président + la présidente de la Commission. Définit les orientations et priorités politiques générales, <b>n'exerce pas de fonction législative</b>. Président : <span class="kb-fact">António Costa</span> (Portugal), depuis décembre 2024, mandat de 2,5 ans renouvelable une fois.</p>
<p><b>3. Conseil de l'Union européenne</b> (« Conseil » ou « Conseil des ministres ») · un ministre par État membre selon le sujet (10 formations : ECOFIN, Agriculture, etc.). Colégislateur avec le Parlement. <b>Présidence tournante semestrielle</b> par trio. Vote le plus fréquent : la <b>majorité qualifiée</b> = <span class="kb-fact">55 % des États (15/27) représentant 65 % de la population</span>. L'unanimité reste requise pour : fiscalité, politique étrangère et de sécurité, adhésion de nouveaux membres, ressources propres.</p>
<p><b>4. Commission européenne</b> · l'exécutif. Quasi-monopole de l'<b>initiative législative</b>, gardienne des traités (peut lancer des procédures d'infraction contre les États), exécute le budget, négocie les accords commerciaux. <span class="kb-fact">27 commissaires</span> (un par État), indépendants des gouvernements. Présidente : <span class="kb-fact">Ursula von der Leyen</span> (Allemagne, PPE), réélue le 18 juillet 2024, second mandat jusqu'en 2029. Commissaire français : Stéphane Séjourné (vice-président exécutif, Prospérité et Stratégie industrielle). Siège : Bruxelles (Berlaymont).</p>
<p><b>5. Cour de justice de l'UE (CJUE)</b> · Luxembourg. Deux juridictions : la Cour de justice (1 juge/État + avocats généraux) et le Tribunal. Garantit l'interprétation et l'application uniformes du droit de l'Union. Procédures clés : renvoi préjudiciel (questions des juges nationaux), recours en manquement (contre un État), recours en annulation.</p>
<p><b>6. Banque centrale européenne (BCE)</b> · Francfort. Politique monétaire de la zone euro, objectif principal : la <b>stabilité des prix</b> (cible d'inflation de 2 %). Présidente : <span class="kb-fact">Christine Lagarde</span> (France). Indépendante des gouvernements et des institutions.</p>
<p><b>7. Cour des comptes européenne</b> · Luxembourg. Contrôle la légalité et la bonne gestion des recettes et dépenses de l'Union. 1 membre par État.</p>
<p><b>Organes non institutionnels à connaître</b> · Comité économique et social européen (CESE, société civile) et Comité européen des régions (CdR, collectivités) : consultatifs. Médiateur européen : traite les plaintes pour mauvaise administration. Haute représentante pour les affaires étrangères : <span class="kb-fact">Kaja Kallas</span> (Estonie), également vice-présidente de la Commission, dirige le SEAE (Service européen pour l'action extérieure). Agences : EUIPO (Alicante), EFSA (Parme), EMA (Amsterdam), Frontex (Varsovie), Europol (La Haye), etc.</p>`},

{title:`3. Le droit de l'Union`, body:`
<p><b>Traités en vigueur</b> · le TUE (traité sur l'Union européenne) et le TFUE (traité sur le fonctionnement de l'UE), tels que modifiés par le <b>traité de Lisbonne</b> (signé 2007, en vigueur <span class="kb-fact">1er décembre 2009</span>). Lisbonne a : donné la personnalité juridique unique à l'UE, créé la présidence permanente du Conseil européen et le poste de Haut représentant, rendu la <b>Charte des droits fondamentaux</b> juridiquement contraignante, introduit l'initiative citoyenne européenne (1 million de signatures) et l'article 50 (procédure de retrait, utilisée par le Royaume-Uni).</p>
<p><b>Actes juridiques (art. 288 TFUE)</b> :</p>
<ul>
<li><b>Règlement</b> · portée générale, <b>obligatoire dans tous ses éléments, directement applicable</b> dans tous les États (pas de transposition). Ex : RGPD.</li>
<li><b>Directive</b> · lie les États quant au <b>résultat</b> à atteindre, mais leur laisse le choix de la forme et des moyens : elle doit être <b>transposée</b> en droit national dans un délai. Ex : directive NIS2.</li>
<li><b>Décision</b> · obligatoire dans tous ses éléments pour ses destinataires désignés.</li>
<li><b>Recommandations et avis</b> · non contraignants.</li>
</ul>
<p><b>Principes clés</b> · <b>Primauté</b> du droit de l'UE sur les droits nationaux (jurisprudence Costa c. ENEL, 1964). <b>Effet direct</b> (Van Gend en Loos, 1963) : les particuliers peuvent invoquer le droit de l'UE devant leurs juges nationaux. <b>Subsidiarité</b> : l'Union n'agit que si l'objectif est mieux atteint au niveau européen. <b>Proportionnalité</b> : l'action ne va pas au-delà du nécessaire.</p>
<p><b>Compétences</b> · exclusives (union douanière, concurrence, politique commerciale, politique monétaire zone euro, conservation des ressources biologiques de la mer) ; partagées (marché intérieur, environnement, énergie, transports, cohésion...) ; d'appui (culture, éducation, tourisme, santé publique...).</p>
<p><b>Article 7 TUE</b> · mécanisme en cas de violation grave des valeurs de l'Union (art. 2 : dignité, liberté, démocratie, égalité, État de droit, droits de l'homme) pouvant aller jusqu'à la suspension des droits de vote d'un État.</p>`},

{title:`4. Le processus décisionnel`, body:`
<p><b>Procédure législative ordinaire</b> (ex-codécision, art. 294 TFUE) · la voie normale : la <b>Commission propose</b>, le <b>Parlement et le Conseil co-adoptent</b> sur un pied d'égalité, avec jusqu'à deux lectures chacun puis un comité de conciliation. En pratique, la grande majorité des textes sont conclus en première lecture grâce aux <b>trilogues</b> : négociations informelles Parlement-Conseil-Commission.</p>
<p><b>Procédures législatives spéciales</b> · consultation ou approbation du Parlement, utilisées dans des domaines sensibles (fiscalité, certains aspects de la politique sociale...).</p>
<p><b>Qui peut demander une législation ?</b> Le Parlement et le Conseil peuvent inviter la Commission à proposer ; les citoyens via l'<b>initiative citoyenne européenne</b> (1 million de signatures dans au moins 7 États) peuvent l'inviter également. Mais la décision de proposer reste à la Commission.</p>
<p><b>Budget</b> · adopté conjointement par le Parlement et le Conseil sur proposition de la Commission, dans le cadre du CFP (voir section 5).</p>
<p><b>Nomination de la Commission</b> · le Conseil européen propose un candidat à la présidence (en tenant compte des élections européennes), le Parlement l'élit ; les commissaires sont auditionnés par le Parlement, puis le collège entier est investi par un vote. Le Parlement peut censurer la Commission (majorité des 2/3 des voix exprimées).</p>`},

{title:`5. Budget et finances`, body:`
<p><b>Cadre financier pluriannuel (CFP)</b> · budget de long terme sur 7 ans. Le CFP actuel couvre <span class="kb-fact">2021-2027</span>, environ 1 200 milliards d'euros, complété par <b>NextGenerationEU</b>, l'instrument de relance post-Covid d'environ <span class="kb-fact">800 milliards d'euros</span> (dont la Facilité pour la reprise et la résilience), financé par un emprunt commun inédit.</p>
<p><b>Ressources propres</b> · droits de douane, une part de la TVA, contribution des États assise sur le RNB (la plus grosse part), et depuis 2021 une contribution calculée sur les déchets plastiques non recyclés.</p>
<p><b>Principaux postes de dépenses</b> · la politique de cohésion et la PAC restent historiquement les deux plus gros blocs ; montent en puissance : recherche (Horizon Europe), transition écologique et numérique, gestion des migrations et frontières, défense.</p>
<p><b>Contrôle</b> · la Cour des comptes audite ; le Parlement donne la <b>décharge</b> budgétaire à la Commission ; l'OLAF (Office de lutte antifraude) et le Parquet européen (créé en 2021) protègent les intérêts financiers de l'Union. Un mécanisme de <b>conditionnalité État de droit</b> permet depuis 2021 de suspendre des fonds en cas de violations affectant le budget.</p>`},

{title:`6. Grandes politiques internes`, body:`
<p><b>Marché intérieur</b> · les <span class="kb-fact">quatre libertés</span> : libre circulation des biens, des services, des capitaux et des personnes. Lancé par l'Acte unique (1986), achevé en 1993.</p>
<p><b>Euro</b> · <span class="kb-fact">20 pays</span> dans la zone euro (la Croatie, 20e, l'a adopté en 2023). Critères de convergence (Maastricht) : inflation, déficit (3 % du PIB), dette (60 % du PIB), taux d'intérêt, stabilité du taux de change. Le Danemark bénéficie d'une clause d'exemption (opt-out).</p>
<p><b>Espace Schengen</b> · suppression des contrôles aux frontières intérieures. Inclut des pays non-UE (Norvège, Islande, Suisse, Liechtenstein) ; l'Irlande n'y participe pas ; la Roumanie et la Bulgarie l'ont pleinement rejoint en 2025 après une longue attente, Chypre reste en dehors pour l'instant.</p>
<p><b>Pacte vert (Green Deal)</b> · objectif de <b>neutralité climatique en <span class="kb-fact">2050</span></b>, inscrit dans la loi européenne sur le climat, avec l'étape « Fit for 55 » : −55 % d'émissions nettes en 2030 (vs 1990). Outils : marché du carbone (SEQE/ETS), mécanisme d'ajustement carbone aux frontières (MACF/CBAM), fin des ventes de voitures thermiques neuves prévue en 2035.</p>
<p><b>Numérique</b> · trio législatif majeur : <b>RGPD</b> (données personnelles, 2018), <b>DSA</b> (Digital Services Act : responsabilité des plateformes, modération des contenus), <b>DMA</b> (Digital Markets Act : régulation des « contrôleurs d'accès », les très grandes plateformes), et l'<b>AI Act</b> (règlement sur l'intelligence artificielle, approche par les risques, application progressive depuis 2024).</p>
<p><b>Migration et asile</b> · le <b>Pacte sur la migration et l'asile</b> adopté en 2024 réforme les règles (procédures aux frontières, mécanisme de solidarité entre États). L'agence Frontex appuie la gestion des frontières extérieures.</p>
<p><b>PAC</b> · paiements directs conditionnés à des exigences environnementales (conditionnalité, éco-régimes depuis la réforme 2023) + développement rural.</p>
<p><b>Cohésion</b> · fonds structurels (FEDER, FSE+, Fonds de cohésion) pour réduire les écarts régionaux de développement.</p>`},

{title:`7. Action extérieure`, body:`
<p><b>PESC</b> (politique étrangère et de sécurité commune) · décisions à l'<b>unanimité</b> au Conseil en règle générale, ce qui alimente le débat récurrent sur le passage à la majorité qualifiée. Conduite par la Haute représentante <span class="kb-fact">Kaja Kallas</span>, appuyée par le <b>SEAE</b>.</p>
<p><b>Défense</b> · montée en puissance : Boussole stratégique (2022), Fonds européen de défense, coopération structurée permanente (CSP/PESCO), et depuis 2024-2025 un effort massif de réarmement et de soutien à l'industrie de défense européenne dans le contexte de la guerre en Ukraine.</p>
<p><b>Politique commerciale</b> · <b>compétence exclusive</b> de l'Union : c'est la Commission qui négocie les accords commerciaux pour les 27.</p>
<p><b>Élargissement et voisinage</b> · statut de candidat accordé à l'Ukraine et à la Moldavie en 2022 (guerre en Ukraine), à la Géorgie fin 2023. Négociations d'adhésion ouvertes avec l'Ukraine et la Moldavie en 2024. Balkans occidentaux : processus ancien, à des stades divers.</p>
<p><b>Aide humanitaire et développement</b> · l'UE et ses États membres forment collectivement le premier donateur mondial d'aide au développement. Instrument principal : NDICI-Europe dans le monde.</p>`},

{title:`8. Symboles, chiffres et personnalités`, body:`
<ul>
<li><b>Drapeau</b> · <span class="kb-fact">12 étoiles dorées</span> en cercle sur fond bleu. Le nombre est fixe (symbole d'unité et de perfection), il ne dépend pas du nombre d'États.</li>
<li><b>Hymne</b> · l'<span class="kb-fact">Ode à la joie</span> (9e symphonie de Beethoven).</li>

<li><b>Langues officielles</b> · <span class="kb-fact">24</span>.</li>
<li><b>Population</b> · environ <span class="kb-fact">450 millions</span> d'habitants.</li>
<li><b>Prix Nobel de la paix</b> · décerné à l'UE en <span class="kb-fact">2012</span>.</li>
</ul>

{q:`Combien d'États membres compte l'Union européenne ?`,opts:[`25`,`26`,`27`,`28`],c:2,ex:`27 depuis le Brexit (2020).`},
{q:`Où siège la Banque centrale européenne ?`,opts:[`Bruxelles`,`Francfort`,`Strasbourg`,`Luxembourg`],c:1,ex:`Francfort, Allemagne.`},
{q:`Quel traité actuellement en vigueur a donné à l'UE sa personnalité juridique unique ?`,opts:[`Maastricht`,`Nice`,`Lisbonne`,`Amsterdam`],c:2,ex:`Le traité de Lisbonne, en vigueur depuis le 1er décembre 2009.`},
{q:`Qui détient le quasi-monopole de l'initiative législative ?`,opts:[`Le Parlement`,`Le Conseil européen`,`La Commission`,`La CJUE`],c:2,ex:`La Commission européenne propose ; Parlement et Conseil adoptent.`},
{q:`Quelle institution est élue au suffrage universel direct ?`,opts:[`Le Conseil`,`Le Conseil européen`,`La Commission`,`Le Parlement européen`],c:3,ex:`Le Parlement, élu tous les 5 ans (dernières élections : juin 2024).`},
{q:`Quelle est la procédure législative la plus courante ?`,opts:[`La consultation`,`La procédure législative ordinaire`,`La procédure d'approbation`,`La procédure d'urgence`],c:1,ex:`La procédure législative ordinaire (ex-codécision) : Parlement et Conseil colégislateurs.`},
{q:`Combien de langues officielles compte l'UE ?`,opts:[`20`,`22`,`24`,`27`],c:2,ex:`24 langues officielles.`},
{q:`Quelle est la devise officielle de l'UE ?`,opts:[`« Plus loin ensemble »`,`« Unie dans la diversité »`,`« Paix et prospérité »`,`« Une Europe unie »`],c:1,ex:`« Unie dans la diversité », depuis 2000.`},
{q:`Que commémore la Journée de l'Europe (9 mai) ?`,opts:[`La signature du traité de Rome`,`La déclaration Schuman`,`La création de l'euro`,`La chute du mur de Berlin`],c:1,ex:`La déclaration Schuman du 9 mai 1950.`},
{q:`Combien de pays utilisent l'euro ?`,opts:[`19`,`20`,`25`,`27`],c:1,ex:`20 pays (la Croatie, 20e, depuis 2023).`},
{q:`Quelle institution garantit l'application uniforme du droit de l'UE ?`,opts:[`La Cour des comptes`,`La CJUE`,`Le Médiateur européen`,`Le CESE`],c:1,ex:`La Cour de justice de l'UE, à Luxembourg.`},
{q:`Qui préside actuellement le Conseil européen ?`,opts:[`Ursula von der Leyen`,`Roberta Metsola`,`António Costa`,`Kaja Kallas`],c:2,ex:`António Costa (Portugal), depuis décembre 2024.`},
{q:`Que signifie la majorité qualifiée au Conseil ?`,opts:[`50 % des États`,`55 % des États représentant 65 % de la population`,`Les deux tiers des États`,`L'unanimité moins une voix`],c:1,ex:`Double majorité : 15 États sur 27 ET 65 % de la population de l'Union.`},
{q:`Quel organe définit les orientations politiques générales sans exercer de fonction législative ?`,opts:[`Le Conseil de l'UE`,`Le Conseil européen`,`Le Parlement`,`Le COREPER`],c:1,ex:`Le Conseil européen (chefs d'État ou de gouvernement).`},
{q:`Quelles sont les quatre libertés du marché intérieur ?`,opts:[`Travail, capital, commerce, monnaie`,`Biens, services, capitaux, personnes`,`Vote, expression, réunion, circulation`,`Commerce, industrie, agriculture, pêche`],c:1,ex:`Libre circulation des biens, services, capitaux et personnes.`},
{q:`Quel objectif fixe la loi européenne sur le climat pour 2050 ?`,opts:[`−55 % d'émissions`,`La neutralité climatique`,`100 % d'énergies renouvelables`,`La fin du nucléaire`],c:1,ex:`Neutralité climatique en 2050 ; −55 % net en 2030 est l'étape intermédiaire.`},
{q:`À quelle fréquence tourne la présidence du Conseil de l'UE ?`,opts:[`Tous les ans`,`Tous les 6 mois`,`Tous les 2 ans`,`Tous les 5 ans`],c:1,ex:`Rotation semestrielle, organisée en trios.`},
{q:`Qui est l'actuelle Haute représentante pour les affaires étrangères ?`,opts:[`Ursula von der Leyen`,`Kaja Kallas`,`Roberta Metsola`,`Christine Lagarde`],c:1,ex:`Kaja Kallas (Estonie), également vice-présidente de la Commission.`},
{q:`Combien d'étoiles figurent sur le drapeau européen ?`,opts:[`27, une par État`,`15`,`12, nombre fixe`,`Un nombre variable`],c:2,ex:`12 étoiles, symbole d'unité, indépendant du nombre d'États.`},
{q:`Quel est l'hymne officiel de l'UE ?`,opts:[`La Marseillaise`,`L'Ode à la joie`,`L'Hymne à l'Europe de Brel`,`Le Chant des partisans`],c:1,ex:`L'Ode à la joie (Beethoven, 9e symphonie).`},
{q:`Quelle institution contrôle les finances de l'Union ?`,opts:[`La BCE`,`La Cour des comptes européenne`,`Le FMI`,`Europol`],c:1,ex:`La Cour des comptes européenne, à Luxembourg.`},
{q:`Quel traité a créé l'Union européenne et préparé la monnaie unique ?`,opts:[`Rome`,`Maastricht`,`Nice`,`Amsterdam`],c:1,ex:`Maastricht (signé 1992, en vigueur 1993).`},
{q:`Quel espace supprime les contrôles aux frontières intérieures ?`,opts:[`Le marché unique`,`L'espace Schengen`,`La zone euro`,`L'EEE`],c:1,ex:`Schengen, qui inclut aussi des pays non-UE (Norvège, Suisse...).`},
{q:`Quel acte juridique est directement applicable sans transposition nationale ?`,opts:[`La directive`,`Le règlement`,`La recommandation`,`L'avis`],c:1,ex:`Le règlement est obligatoire dans tous ses éléments et directement applicable. La directive doit être transposée.`},
{q:`Quel acte lie les États quant au résultat mais leur laisse le choix des moyens ?`,opts:[`Le règlement`,`La décision`,`La directive`,`L'avis`],c:2,ex:`La directive, qui nécessite une transposition en droit national.`},
{q:`Quel principe établit que le droit de l'UE prévaut sur les droits nationaux ?`,opts:[`La subsidiarité`,`La primauté`,`La proportionnalité`,`L'effet direct`],c:1,ex:`La primauté (jurisprudence Costa c. ENEL, 1964).`},
{q:`Quel arrêt fondateur a établi l'effet direct du droit communautaire ?`,opts:[`Costa c. ENEL`,`Van Gend en Loos`,`Cassis de Dijon`,`Bosman`],c:1,ex:`Van Gend en Loos (1963). Costa c. ENEL (1964) a établi la primauté.`},
