{q:`Quelle procédure permet à un juge national d'interroger la CJUE sur l'interprétation du droit de l'UE ?`,opts:[`Le recours en manquement`,`Le renvoi préjudiciel`,`Le recours en annulation`,`La question prioritaire`],c:1,ex:`Le renvoi préjudiciel, pilier du dialogue des juges.`},
{q:`En quelle année les pièces et billets en euros ont-ils été mis en circulation ?`,opts:[`1999`,`2000`,`2002`,`2004`],c:2,ex:`2002 (l'euro existait en monnaie scripturale depuis 1999).`},
{q:`Combien de pays ont rejoint l'UE lors du grand élargissement de 2004 ?`,opts:[`8`,`10`,`12`,`15`],c:1,ex:`10 pays, majoritairement d'Europe centrale et orientale.`},
{q:`Quel pays a quitté l'Union européenne en 2020 ?`,opts:[`La Norvège`,`La Suisse`,`Le Royaume-Uni`,`L'Islande`],c:2,ex:`Le Royaume-Uni (référendum de 2016, sortie effective en 2020, article 50 TUE).`},
{q:`Quel instrument de relance post-Covid a été financé par un emprunt commun ?`,opts:[`Le plan Juncker`,`NextGenerationEU`,`Le MES`,`Horizon Europe`],c:1,ex:`NextGenerationEU, environ 800 milliards d'euros.`},
{q:`Sur combien d'années porte le cadre financier pluriannuel ?`,opts:[`5 ans`,`7 ans`,`10 ans`,`3 ans`],c:1,ex:`7 ans. Le CFP actuel couvre 2021-2027.`},
{q:`Quel domaine relève de la compétence EXCLUSIVE de l'Union ?`,opts:[`La santé publique`,`L'éducation`,`La politique commerciale commune`,`Le tourisme`],c:2,ex:`La politique commerciale est exclusive : la Commission négocie pour les 27.`},
{q:`Quel règlement encadre les très grandes plateformes en matière de modération des contenus ?`,opts:[`Le RGPD`,`Le DSA`,`Le DMA`,`L'AI Act`],c:1,ex:`Le Digital Services Act. Le DMA vise la concurrence (contrôleurs d'accès), le RGPD les données personnelles.`},
{q:`Quelle approche structure le règlement européen sur l'IA ?`,opts:[`Par secteur d'activité`,`Par niveaux de risque`,`Par taille d'entreprise`,`Par pays d'origine`],c:1,ex:`Approche par les risques : inacceptable (interdit), élevé, limité, minimal.`},
{q:`Quels pays ont obtenu le statut de candidat à l'UE en 2022 ?`,opts:[`Serbie et Albanie`,`Ukraine et Moldavie`,`Géorgie et Arménie`,`Turquie et Kosovo`],c:1,ex:`Ukraine et Moldavie (juin 2022) ; la Géorgie fin 2023.`},
{q:`Dans quel domaine l'unanimité reste-t-elle la règle au Conseil ?`,opts:[`Le marché intérieur`,`La fiscalité`,`L'environnement`,`Les transports`],c:1,ex:`Fiscalité, PESC, adhésions : unanimité requise.`},
{q:`Quel mécanisme permet de suspendre des fonds européens en cas d'atteintes à l'État de droit affectant le budget ?`,opts:[`L'article 50`,`La conditionnalité État de droit`,`Le semestre européen`,`La décharge`],c:1,ex:`Le règlement de conditionnalité, appliqué depuis 2021.`},
{q:`Quelle organisation, distincte de l'UE, a été créée le 5 mai 1949 par le traité de Londres ?`,opts:[`L'OTAN`,`Le Conseil de l'Europe`,`L'OSCE`,`Le Conseil européen`],c:1,ex:`Le Conseil de l'Europe (46 membres, CEDH), à ne pas confondre avec le Conseil européen, institution de l'UE.`},
{q:`Quel projet européen a été rejeté par l'Assemblée nationale française le 30 août 1954 ?`,opts:[`La CECA`,`La Communauté européenne de défense`,`Le plan Fouchet`,`Le traité de Rome`],c:1,ex:`La CED, rejetée par une motion de procédure sans débat de fond ; l'échec a réorienté la construction vers la voie économique.`},
{q:`Que prévoit le « compromis de Luxembourg » de 1966 ?`,opts:[`La création du Conseil européen`,`La poursuite des discussions jusqu'à l'unanimité quand un intérêt très important est invoqué`,`Le passage général à la majorité qualifiée`,`Le financement de la PAC par des ressources propres`],c:1,ex:`Issu de la crise de la « chaise vide », il a maintenu de fait l'unanimité au Conseil pendant deux décennies.`},
{q:`Combien d'États membres au minimum faut-il pour lancer une coopération renforcée ?`,opts:[`6`,`9`,`12`,`15`],c:1,ex:`Neuf États membres au minimum, depuis le traité de Lisbonne.`},
{q:`Comment le Parquet européen a-t-il été créé ?`,opts:[`Par une révision des traités`,`Par une coopération renforcée entre une partie des États membres`,`Par un accord intergouvernemental hors traités`,`Par une décision unanime du Conseil européen`],c:1,ex:`Règlement d'octobre 2017 adopté en coopération renforcée, pour contourner l'absence d'unanimité ; le nombre d'États participants a ensuite évolué (Malte et les Pays-Bas ont rejoint en 2018, la Pologne et la Suède plus tard encore).`},
{q:`Quel pays est membre de l'AELE mais pas de l'Espace économique européen ?`,opts:[`La Norvège`,`L'Islande`,`La Suisse`,`Le Liechtenstein`],c:2,ex:`Référendum négatif de 1992 : la Suisse gère ses relations avec l'UE par des accords bilatéraux.`},
{q:`Quel article du traité UE organise le retrait volontaire d'un État membre ?`,opts:[`L'article 7`,`L'article 48`,`L'article 49`,`L'article 50`],c:3,ex:`L'article 50 TUE, utilisé une seule fois, par le Royaume-Uni. L'article 49 concerne l'adhésion.`},
{q:`Qu'est-ce que le Mécanisme européen de stabilité (MES) ?`,opts:[`Un fonds de l'Union géré par la Commission`,`Une institution intergouvernementale d'assistance financière de la zone euro`,`Un programme d'achat d'actifs de la BCE`,`Une agence de notation européenne`],c:1,ex:`Créé par traité intergouvernemental, en vigueur depuis 2012, il prête aux États de la zone euro en difficulté.`},
{q:`Quel pays est devenu le 21e membre de la zone euro le 1er janvier 2026 ?`,opts:[`La Roumanie`,`La Bulgarie`,`La Pologne`,`La Tchéquie`],c:1,ex:`La Bulgarie, après la Croatie (20e) en 2023.`},
{q:`Qu'est-ce que l'Eurogroupe ?`,opts:[`Une formation officielle du Conseil de l'UE`,`La réunion informelle des ministres des finances de la zone euro`,`Le conseil des gouverneurs de la BCE`,`Un comité du Parlement européen`],c:1,ex:`Instance informelle mensuelle (protocole n° 14), avec un président élu pour deux ans et demi.`},
{q:`Quels seuils une initiative citoyenne européenne doit-elle atteindre ?`,opts:[`500 000 signatures dans 5 États`,`1 million de signatures avec des minima dans au moins 7 États`,`1 million de signatures dans tous les États`,`2 millions de signatures dans 10 États`],c:1,ex:`1 million de signataires, avec un seuil minimal atteint dans au moins un quart des États membres.`},
{q:`En 2014, quel « Spitzenkandidat » est devenu président de la Commission ?`,opts:[`José Manuel Barroso`,`Jean-Claude Juncker`,`Martin Schulz`,`Donald Tusk`],c:1,ex:`Premier cas d'application du système du candidat tête de liste ; écarté en 2019 (von der Leyen), repris en 2024.`},
{q:`Quelle plainte le Médiateur européen ne peut-il PAS traiter ?`,opts:[`Un refus d'accès à un document de la Commission`,`Une mauvaise administration d'une agence de l'UE`,`Une décision d'une administration nationale appliquant le droit de l'UE`,`Un problème de recrutement dans une institution européenne`],c:2,ex:`Le Médiateur ne vise que les institutions, organes et organismes de l'UE, jamais les autorités nationales.`},
{q:`Où siège l'agence Frontex ?`,opts:[`La Haye`,`Varsovie`,`Tallinn`,`Vienne`],c:1,ex:`Varsovie. La Haye accueille Europol, Tallinn eu-LISA.`},
{q:`Le traité sur la stabilité, la coordination et la gouvernance (TSCG, 2012) a été conclu :`,opts:[`Par tous les États membres`,`Hors du cadre des traités de l'UE, sans le Royaume-Uni ni la Tchéquie`,`Par les seuls pays de la zone euro`,`Sous forme de règlement européen`],c:1,ex:`Traité intergouvernemental signé le 2 mars 2012 par 25 États, faute d'unanimité pour réviser les traités.`},
{q:`En quelle année les droits de douane entre les six pays fondateurs ont-ils été totalement supprimés ?`,opts:[`1958`,`1963`,`1968`,`1973`],c:2,ex:`Le 1er juillet 1968, en avance sur l'échéance du 31 décembre 1969 fixée par le traité de Rome. C'est l'achèvement de l'union douanière.`},
{q:`Pour quelle durée le traité CECA avait-il été conclu ?`,opts:[`20 ans`,`50 ans`,`99 ans`,`Une durée illimitée`],c:1,ex:`Cinquante ans : le traité CECA a donc expiré le 23 juillet 2002. Les traités de Rome, eux, sont conclus pour une durée illimitée. Piège classique.`},
{q:`Quel fonds a été créé en 1975 pour réduire les écarts de développement entre régions ?`,opts:[`Le Fonds social européen`,`Le Fonds européen de développement régional (FEDER)`,`Le Fonds de cohésion`,`Le Fonds de solidarité`],c:1,ex:`Le FEDER, créé en 1975 dans le sillage du premier élargissement. Le FSE remonte au traité de Rome, le Fonds de cohésion à Maastricht (1993).`},
{q:`Où ont été définis en 1993 les critères que doit remplir un pays candidat à l'adhésion ?`,opts:[`À Maastricht`,`À Copenhague`,`À Lisbonne`,`À Nice`],c:1,ex:`Les « critères de Copenhague » (Conseil européen de juin 1993) : institutions stables garantissant la démocratie et l'État de droit, économie de marché viable, et capacité à assumer l'acquis communautaire.`},
{q:`À quel écrivain doit-on la formule des « États-Unis d'Europe » ?`,opts:[`Émile Zola`,`Victor Hugo`,`Stefan Zweig`,`Romain Rolland`],c:1,ex:`Victor Hugo, au Congrès de la paix de Paris en 1849, un siècle avant la déclaration Schuman.`},
{q:`Quelle est la situation de la peine de mort dans l'Union européenne ?`,opts:[`Maintenue pour les crimes de guerre`,`Abolie dans tous les États membres`,`Laissée à l'appréciation de chaque État`,`Suspendue mais non abolie`],c:1,ex:`L'abolition est une condition d'adhésion et la Charte des droits fondamentaux interdit la peine de mort (article 2). C'est un marqueur des valeurs européennes, mobilisable à l'essai.`},
{q:`Quel arrêt de 1969 reconnaît pour la première fois les droits fondamentaux comme principes généraux du droit de l'Union ?`,opts:[`Van Gend en Loos`,`Costa c. ENEL`,`Stauder`,`Cassis de Dijon`],c:2,ex:`L'arrêt Stauder (1969), né d'un litige sur le « beurre de Noël ». Auparavant la Cour écartait ces moyens. Elle a dû se raviser : la primauté du droit de l'Union ne se justifie que si celui-ci garantit une protection équivalente à celle des constitutions nationales.`},
{q:`Quand la Charte des droits fondamentaux a-t-elle acquis force juridique contraignante ?`,opts:[`Dès sa proclamation à Nice en 2000`,`Avec le traité de Lisbonne, par le renvoi de l'article 6 TUE`,`Avec le traité de Nice en 2003`,`Elle reste non contraignante`],c:1,ex:`Proclamée à Nice le 7 décembre 2000, puis de nouveau à Strasbourg le 12 décembre 2007, elle ne devient contraignante que par le renvoi opéré par l'article 6 TUE depuis Lisbonne. C'est à la version de 2007 que le traité renvoie.`},
{q:`Qu'a jugé la Cour de justice dans son avis 2/13 (2014) ?`,opts:[`Que l'UE ne pourra jamais adhérer à la CEDH`,`Que le projet d'accord d'adhésion à la CEDH n'était pas compatible avec le droit de l'Union`,`Que la Charte prime sur la CEDH`,`Que la CEDH est sans valeur en droit de l'Union`],c:1,ex:`Le projet risquait de porter atteinte aux caractéristiques spécifiques et à l'autonomie du droit de l'Union. L'adhésion reste prévue par l'article 6, paragraphe 2, TUE, mais elle n'est toujours pas réalisée.`},
{q:`Dans la procédure de l'article 7 TUE, qui constate une violation grave et persistante des valeurs de l'Union ?`,opts:[`La Commission seule`,`Le Conseil européen, à l'unanimité`,`La Cour de justice`,`Le Parlement européen aux deux tiers`],c:1,ex:`Le Conseil européen constate à l'unanimité, sur proposition d'un tiers des États membres ou de la Commission, après approbation du Parlement. C'est ensuite le Conseil qui peut, à la majorité qualifiée, suspendre certains droits dont le droit de vote.`},
{q:`Quelle est la durée maximale des périodes transitoires à la libre circulation des travailleurs après une adhésion ?`,opts:[`2 ans`,`5 ans`,`7 ans`,`10 ans`],c:2,ex:`Sept ans au maximum, prévus par le traité d'adhésion. Elles permettent aux anciens États membres de restreindre temporairement l'accès à leur marché du travail.`},
{q:`Dans l'affaire Schmidberger, comment la Cour a-t-elle arbitré entre libre circulation des marchandises et liberté de réunion ?`,opts:[`La libre circulation prime toujours`,`L'entrave était objectivement justifiée par la protection des droits fondamentaux`,`La liberté de réunion n'est pas un droit fondamental`,`L'Autriche a été condamnée`],c:1,ex:`Le blocage de l'autoroute du Brenner par des manifestants constituait bien une entrave, mais objectivement justifiée : l'Autriche avait respecté la liberté d'expression et de réunion. Cas d'école de mise en balance de deux droits, très utile à l'essai.`},
{q:`Quel est le principal organe de décision de la Banque centrale européenne ?`,opts:[`Le Directoire`,`Le Conseil des gouverneurs`,`Le Conseil général`,`Le Conseil de l'Eurogroupe`],c:1,ex:`Le Conseil des gouverneurs : il réunit les six membres du Directoire et les gouverneurs des banques centrales nationales de la zone euro, et fixe les taux directeurs (article 127 TFUE). Un système de rotation des droits de vote limite le nombre de votants.`},
{q:`Comment sont nommés les membres du Directoire de la BCE et pour quelle durée ?`,opts:[`Par le Parlement, mandat de 5 ans renouvelable`,`Par le Conseil européen, mandat de 8 ans non renouvelable`,`Par la Commission, mandat de 6 ans`,`Par les États membres, mandat de 4 ans`],c:1,ex:`Six membres nommés par le Conseil européen pour huit ans non renouvelables (article 283 TFUE). Cette durée longue et non renouvelable protège leur indépendance des pressions politiques nationales.`},
{q:`Quel organe de la BCE a vocation à disparaître une fois que tous les États membres auront adopté l'euro ?`,opts:[`Le Directoire`,`Le Conseil des gouverneurs`,`Le Conseil général`,`Le comité de surveillance`],c:2,ex:`Le Conseil général, organe transitoire à rôle consultatif et technique, réunit les gouverneurs de TOUS les États membres (y compris hors zone euro). Il disparaîtra quand toute l'Union aura adopté l'euro.`},
{q:`Quel article du TFUE interdit à la BCE de solliciter ou d'accepter des instructions des gouvernements ?`,opts:[`L'article 123 TFUE`,`L'article 127 TFUE`,`L'article 130 TFUE`,`L'article 282 TFUE`],c:2,ex:`L'article 130 TFUE consacre l'indépendance de la BCE et des banques centrales nationales. L'article 123, lui, interdit le financement monétaire des États (pas de rachat direct de dette publique).`},
{q:`Qui préside le Conseil des affaires étrangères (CAE) de l'Union ?`,opts:[`Le président du Conseil européen`,`Le Haut représentant pour les affaires étrangères`,`La présidence tournante semestrielle`,`Le président de la Commission`],c:1,ex:`Le CAE est la seule formation du Conseil présidée en permanence par le Haut représentant (et non par la présidence tournante), ce qui assure une continuité de l'action extérieure. Exception : les Conseils dédiés au commerce sont présidés par la présidence tournante.`},
{q:`De quelle réforme le Conseil des affaires étrangères (CAE) est-il issu sous sa forme actuelle ?`,opts:[`De la scission du Conseil Affaires générales et relations extérieures (CAGRE) par le traité de Lisbonne`,`De la création du SEAE en 2011`,`Du traité de Maastricht`,`Du rapport Davignon de 1970`],c:0,ex:`Le traité de Lisbonne (2009) a scindé le CAGRE en deux formations distinctes : le Conseil des affaires générales et le Conseil des affaires étrangères. Depuis, les ministres des affaires étrangères ne siègent plus au Conseil européen.`},
{q:`Quel comité, prévu par l'article 38 TUE, exerce le contrôle politique et la direction stratégique des opérations de gestion de crise ?`,opts:[`Le COREPER II`,`Le Comité politique et de sécurité (COPS)`,`Le Comité militaire de l'Union`,`Le Comité des régions`],c:1,ex:`Le COPS (article 38 TUE) suit la situation internationale dans le champ de la PESC, rend des avis au Conseil et exerce, sous la responsabilité du Conseil, le contrôle politique et la direction stratégique des opérations de gestion de crise.`},
{q:`Pour quelles juridictions le renvoi préjudiciel à la CJUE est-il obligatoire ?`,opts:[`Pour toutes les juridictions nationales`,`Pour les seules juridictions statuant en dernier ressort`,`Pour les seules juridictions constitutionnelles`,`Il n'est jamais obligatoire`],c:1,ex:`Article 267, alinéa 3, TFUE : le renvoi est obligatoire pour les juridictions dont les décisions ne sont pas susceptibles de recours interne (dernier ressort). Il reste facultatif pour les juridictions ordinaires.`},
{q:`Selon la jurisprudence Cilfit (1982), une juridiction de dernier ressort peut se dispenser de renvoyer une question à la CJUE dans plusieurs cas, SAUF :`,opts:[`Si la question n'est pas pertinente pour le litige`,`Si la Cour a déjà tranché une question identique (acte éclairé)`,`Si l'interprétation ne laisse place à aucun doute raisonnable (acte clair)`,`Si l'affaire concerne un montant financier faible`],c:3,ex:`Cilfit fixe trois exceptions à l'obligation de renvoi : question non pertinente, acte éclairé (déjà tranché) et acte clair (aucun doute raisonnable). Le montant du litige n'en fait pas partie.`},
{q:`Quelle juridiction peut seule déclarer invalide un acte de droit dérivé de l'Union ?`,opts:[`Toute juridiction nationale`,`La seule CJUE`,`La Cour européenne des droits de l'homme`,`Le Conseil d'État de chaque État`],c:1,ex:`Jurisprudence Foto-Frost (1987) : un juge national peut constater qu'un acte de l'Union est valide, mais seule la CJUE peut l'annuler. Cela garantit l'application uniforme du droit de l'Union.`},
{q:`Que peut-il arriver à un État membre dont une juridiction de dernier ressort refuse indûment de poser une question préjudicielle ?`,opts:[`Rien, le renvoi restant à la discrétion du juge`,`Une procédure d'infraction et une condamnation de l'État`,`La nullité automatique de la décision nationale`,`Une amende infligée directement au juge`],c:1,ex:`Le manquement à l'obligation de renvoi engage la responsabilité de l'État : la France a ainsi été condamnée en 2018 (Commission c/ France). Le juge lui-même n'est pas sanctionné.`},
{q:`Quelle est la différence entre acte délégué (art. 290 TFUE) et acte d'exécution (art. 291 TFUE) ?`,opts:[`L'acte délégué est adopté par le Conseil, l'acte d'exécution par la Commission`,`L'acte délégué complète ou modifie des éléments non essentiels avec droit de veto des colégislateurs ; l'acte d'exécution passe par la comitologie`,`L'acte délégué est contraignant, l'acte d'exécution ne l'est pas`,`Il n'y a aucune différence de régime`],c:1,ex:`Distinction clé issue de Lisbonne. L'acte délégué (290) complète ou modifie des éléments non essentiels de l'acte de base, sous contrôle a posteriori des colégislateurs (droit de révocation ou d'objection). L'acte d'exécution (291) fixe des conditions uniformes de mise en œuvre et relève de la comitologie.`},
{q:`Combien de procédures de comitologie le règlement 182/2011 a-t-il retenues ?`,opts:[`Une seule`,`Deux : consultation et examen`,`Trois`,`Quatre`],c:1,ex:`Deux procédures : la consultation (avis non contraignant que la Commission est libre de suivre) et l'examen (la Commission ne peut adopter l'acte que si le comité ne s'y oppose pas à la majorité qualifiée).`},
{q:`Quelle est la nature de l'arrêt rendu par la CJUE à l'issue d'un recours en manquement ?`,opts:[`Il annule l'acte national contraire`,`Il est purement déclaratoire : la CJUE ne peut ni annuler ni imposer une mesure`,`Il ordonne directement au juge national la solution`,`Il suspend le droit de vote de l'État`],c:1,ex:`L'arrêt en manquement est déclaratoire : il constate le manquement, mais l'État choisit les moyens de s'y conformer. La CJUE peut toutefois assortir un second arrêt (manquement sur manquement) d'une astreinte ou d'une somme forfaitaire.`},
{q:`Depuis quel traité la Commission peut-elle demander une sanction financière dès le premier arrêt en cas de défaut de communication des mesures de transposition d'une directive ?`,opts:[`Le traité de Maastricht`,`Le traité d'Amsterdam`,`Le traité de Lisbonne (article 260§3 TFUE)`,`Le traité de Nice`],c:2,ex:`L'article 260§3, introduit par Lisbonne, permet à la Commission de demander une astreinte ou une somme forfaitaire dès le premier recours pour non-communication de la transposition. Première application en 2017 (Commission c/ Espagne).`},
{q:`Le recours en manquement d'un État membre contre un autre (article 259 TFUE) est :`,opts:[`La voie la plus courante`,`Très rare, réservé à des affaires à forte portée politique`,`Interdit depuis Lisbonne`,`Réservé aux litiges commerciaux`],c:1,ex:`Très rare (une douzaine de cas) : la Commission utilise le recours quasi exclusivement. L'État qui saisit doit d'abord passer par la Commission, qui rend un avis motivé dans un délai de trois mois.`},
{q:`Quelle juridiction a été créée par l'Acte unique européen pour désengorger la Cour de justice ?`,opts:[`Le Tribunal de la fonction publique`,`Le Tribunal de première instance (aujourd'hui le Tribunal)`,`Les chambres spécialisées`,`La Cour constitutionnelle européenne`],c:1,ex:`Le Tribunal de première instance (1988), devenu simplement « le Tribunal ». Il garantit un double degré de juridiction et traite en première instance l'essentiel des recours directs.`},
{q:`Qu'introduit le règlement 2024/2019 réformant le statut de la CJUE ?`,opts:[`La suppression du Tribunal`,`Le premier transfert d'une partie de la compétence préjudicielle au Tribunal, dans six matières`,`La création d'une cour constitutionnelle`,`La fin du renvoi préjudiciel`],c:1,ex:`Pour la première fois, six matières à jurisprudence stabilisée voient leurs questions préjudicielles transférées au Tribunal. La Cour conserve les renvois portant sur le droit primaire, les principes généraux et la Charte, et un « guichet unique » répartit les questions.`},
{q:`Qu'est-ce qu'un vice-président exécutif de la Commission von der Leyen ?`,opts:[`Un commissaire sans portefeuille`,`Un membre qui cumule le rôle de vice-président et la charge de commissaire`,`Le remplaçant du président en cas d'empêchement`,`Un poste prévu par les traités depuis Lisbonne`],c:1,ex:`Innovation de von der Leyen (suggérée par le Conseil européen, non prévue par les traités) : le vice-président exécutif cumule vice-présidence et portefeuille de commissaire, ce qui hiérarchise la Commission et centralise le pouvoir autour de la présidente.`},
{q:`Dans le volet préventif de l'article 7 TUE (§1), à quelle majorité le Conseil constate-t-il un risque clair de violation grave des valeurs ?`,opts:[`À la majorité simple`,`À la majorité qualifiée`,`À la majorité des quatre cinquièmes`,`À l'unanimité`],c:2,ex:`Le volet préventif (§1) requiert la majorité des quatre cinquièmes du Conseil après approbation du Parlement. Le volet sanctionnateur (§2) exige, lui, l'unanimité du Conseil européen pour constater une violation grave et persistante. Ni la Pologne ni la Hongrie n'ont jamais été sanctionnées par ce biais.`},
{q:`À quoi sert le registre de transparence de l'Union européenne ?`,opts:[`À recenser les fonctionnaires européens`,`À encadrer les activités de représentation d'intérêts (lobbying)`,`À publier les arrêts de la CJUE`,`À enregistrer les partis politiques européens`],c:1,ex:`Créé en 2011 par le Parlement et la Commission, étendu au Conseil en 2021, il encadre le lobbying : l'inscription conditionne l'accès aux institutions. Après le scandale du Qatargate (2022), les eurodéputés ne peuvent plus faire de lobbying dans les six mois suivant la fin de leur mandat.`},
{q:`Quel est le rôle du conseiller-auditeur (Hearing Officer) dans les procédures de concurrence ?`,opts:[`Il fixe le montant des amendes`,`Il garantit le respect des droits procéduraux des entreprises`,`Il préside la Commission`,`Il représente les États membres`],c:1,ex:`Le conseiller-auditeur (décision 2011/695/UE) veille au respect des droits procéduraux dans les procédures antitrust, de concentration ou de défense commerciale (DG concurrence, DG commerce). Il organise les auditions et agit en arbitre indépendant.`},
{q:`Dans l'arrêt Turco (2008), qu'a jugé la Cour de justice à propos de l'accès aux documents ?`,opts:[`Les avis juridiques du Conseil sont toujours secrets`,`Les exceptions au droit d'accès s'interprètent strictement et peuvent céder devant un intérêt public supérieur`,`Seuls les États membres ont accès aux documents`,`Le règlement 1049/2001 est invalide`],c:1,ex:`Turco renforce la transparence : les exceptions au droit d'accès du règlement 1049/2001 (dont les avis juridiques) doivent être interprétées strictement et peuvent être écartées si un intérêt public supérieur le justifie. Complété par Access Info Europe (2013) sur les positions des États dans le processus législatif.`},
{q:`Le mécanisme des coopérations renforcées a été effectivement utilisé pour, entre autres :`,opts:[`Créer l'espace Schengen et l'euro`,`Le divorce des couples transnationaux, le brevet unitaire, la taxe sur les transactions financières et le Parquet européen`,`Réviser les traités`,`Élargir l'Union aux Balkans`],c:1,ex:`Quatre cas concrets, tous après blocage à l'unanimité : loi applicable au divorce (2010), brevet unitaire (2012, sans l'Espagne ni l'Italie), taxe sur les transactions financières (2013, encore en discussion) et Parquet européen (2017). Schengen et l'euro relèvent d'autres mécanismes, pas de la clause de coopération renforcée de l'article 20 TUE.`},
{q:`Qu'a jugé la Cour constitutionnelle allemande de Karlsruhe dans son arrêt du 5 mai 2020 (PSPP) ?`,opts:[`Que le programme d'achats d'actifs de la BCE et l'arrêt Weiss de la CJUE étaient « ultra vires »`,`Que la BCE devait être dissoute`,`Que la primauté du droit de l'Union est absolue`,`Que l'Allemagne devait quitter la zone euro`],c:0,ex:`Karlsruhe a jugé que la BCE (programme PSPP) et la CJUE (arrêt Weiss de 2018, qui l'avait validé) avaient agi « ultra vires », hors de leurs compétences. La Commission a ouvert une procédure d'infraction contre l'Allemagne en juin 2021, close dès décembre 2021. Cas emblématique de la tension entre primauté du droit de l'Union et souveraineté constitutionnelle nationale.`},
{q:`Depuis quels arrêts la Cour de Karlsruhe se réserve-t-elle un contrôle des actes de l'Union au regard de la Loi fondamentale allemande ?`,opts:[`Costa c/ ENEL`,`Les arrêts Solange I (1974) et Solange II (1986)`,`Van Gend en Loos`,`L'arrêt Weiss`],c:1,ex:`La jurisprudence Solange (« aussi longtemps que ») pose depuis les années 1970 que la Cour constitutionnelle allemande contrôle la conformité des actes de l'Union à la protection des droits fondamentaux garantie par la Loi fondamentale. L'arrêt de 2020 s'inscrit dans cette tradition.`},
{q:`Que contrôlent les parlements nationaux via le mécanisme d'alerte précoce (protocole n°2) ?`,opts:[`La proportionnalité des actes`,`Le respect du principe de subsidiarité`,`La légalité de tout acte de l'Union`,`Le budget de l'Union`],c:1,ex:`Le mécanisme d'alerte précoce, consacré par le traité de Lisbonne (article 12 TUE, protocole n°2), permet aux parlements nationaux d'émettre des avis motivés sur le seul respect de la subsidiarité, pas sur la proportionnalité ni sur le fond.`},
{q:`Dans le mécanisme d'alerte précoce, que déclenche un « carton jaune » ?`,opts:[`Le retrait automatique de la proposition`,`L'obligation pour la Commission de réexaminer sa proposition si un tiers des voix des parlements nationaux est atteint`,`Une saisine directe de la CJUE`,`La suspension du droit de vote de l'État`],c:1,ex:`Chaque parlement national dispose de deux voix. Si les avis motivés atteignent un tiers des voix (« carton jaune »), la Commission doit réexaminer sa proposition et la maintenir, la modifier ou la retirer en motivant sa décision. Le « carton orange » va un cran plus loin en procédure législative ordinaire.`},
{q:`Que réunit la COSAC dans l'architecture de l'Union ?`,opts:[`Les chefs d'État et de gouvernement`,`Les commissions des affaires européennes des parlements nationaux et le Parlement européen`,`Les ministres des finances`,`Les présidents des cours constitutionnelles`],c:1,ex:`La COSAC (Conférence des organes spécialisés dans les affaires communautaires), reconnue par les traités, structure le dialogue entre les parlements nationaux et le Parlement européen. Elle adopte des contributions politiques non contraignantes.`},
{q:`Combien d'États faut-il au minimum pour former une minorité de blocage au Conseil à la majorité qualifiée ?`,opts:[`2`,`3`,`4`,`7`],c:2,ex:`La minorité de blocage exige au moins 4 États représentant plus de 35 % de la population de l'Union. Sans ce plancher de 4 États, trois grands pays très peuplés pourraient bloquer seuls une décision : la règle l'empêche.`},
{q:`Combien de propositions la Conférence sur l'avenir de l'Europe a-t-elle formulées en 2022 ?`,opts:[`12`,`27`,`49`,`100`],c:2,ex:`La Conférence sur l'avenir de l'Europe (2021-2022) a débouché en mai 2022 sur 49 propositions, dont plusieurs appellent à réformer les institutions (extension du vote à la majorité qualifiée, droit d'initiative législative du Parlement, réforme de l'article 7).`},

/* --- Union économique et monétaire --- */
{q:`Quel événement de 1971 a provoqué l'effondrement du système monétaire de Bretton Woods ?`,opts:[`La fin de la convertibilité du dollar en or annoncée par Richard Nixon`,`Le premier choc pétrolier`,`La dévaluation de la livre sterling`,`La création du Fonds monétaire international`],c:0,ex:`Le 15 août 1971, Nixon suspend la convertibilité or du dollar. Les parités entre monnaies européennes, jusque-là fixées via le dollar, deviennent instables : c'est le point de départ de la construction monétaire européenne.`},
{q:`Quel dispositif a précédé le Système monétaire européen à partir de 1972 ?`,opts:[`Le serpent monétaire européen`,`L'Union européenne des paiements`,`Le plan Werner`,`L'écu fiduciaire`],c:0,ex:`Le serpent monétaire limitait les fluctuations entre monnaies européennes. Il a été remplacé en 1979 par le SME, plus structuré.`},
{q:`En quelle année le Système monétaire européen a-t-il été mis en place ?`,opts:[`1979`,`1972`,`1986`,`1992`],c:0,ex:`Le SME instaure des parités fixes mais ajustables autour de cours pivots exprimés en écus. Il a préparé l'Union économique et monétaire.`},
{q:`Qu'était l'écu dans le Système monétaire européen ?`,opts:[`Une unité de compte correspondant à une moyenne pondérée des monnaies participantes`,`Une pièce en circulation dans les États membres`,`Le nom de la banque centrale commune`,`Un fonds de stabilisation des changes`],c:0,ex:`Monnaie fictive et simple unité de compte, l'écu définissait un cours pivot autour duquel s'organisaient les parités bilatérales.`},
{q:`Quelle était la marge de fluctuation initiale des monnaies dans le Système monétaire européen ?`,opts:[`Environ plus ou moins 2,25 % autour du cours pivot`,`Plus ou moins 10 %`,`Plus ou moins 15 % dès l'origine`,`Aucune marge, les parités étaient rigoureusement fixes`],c:0,ex:`Élargie à plus ou moins 15 % en 1993 après les crises de change. Entre 1979 et 1993, le système a connu de nombreux réajustements.`},
{q:`Que désigne le « triangle des incompatibilités » en économie monétaire ?`,opts:[`L'impossibilité de combiner changes fixes, mobilité des capitaux et autonomie monétaire nationale`,`L'opposition entre inflation, chômage et croissance`,`Le conflit entre les trois institutions budgétaires de l'Union`,`Les trois critères de convergence contradictoires de Maastricht`],c:0,ex:`Après la libéralisation des capitaux par l'Acte unique, la spéculation a forcé la livre sterling hors du SME en 1992 : illustration directe du triangle.`},
{q:`Combien de critères de convergence le traité de Maastricht fixe-t-il pour l'entrée dans la zone euro ?`,opts:[`Quatre`,`Deux`,`Trois`,`Six`],c:0,ex:`Stabilité des prix, finances publiques saines, stabilité du taux de change et niveau des taux d'intérêt à long terme.`},
{q:`Selon les critères de Maastricht, quel plafond s'applique à la dette publique ?`,opts:[`60 % du produit intérieur brut`,`3 % du produit intérieur brut`,`90 % du produit intérieur brut`,`100 % du produit intérieur brut`],c:0,ex:`Le seuil de 3 % concerne le déficit annuel, celui de 60 % la dette accumulée. Confondre les deux est l'erreur la plus fréquente.`},
{q:`Le critère de Maastricht relatif à l'inflation s'apprécie par rapport :`,opts:[`Aux trois États membres où l'inflation est la plus faible, sans dépasser leur niveau de plus de 1,5 point`,`À la moyenne de la zone euro`,`À l'objectif de la Banque centrale européenne`,`Au taux du pays le plus peuplé`],c:0,ex:`Le critère des taux d'intérêt à long terme suit la même logique, avec une marge de 2 points au-dessus des trois meilleurs.`},
{q:`En quelle année l'euro a-t-il été officiellement institué comme monnaie ?`,opts:[`1999`,`2002`,`1997`,`1993`],c:0,ex:`Monnaie scripturale à partir du 1er janvier 1999, l'euro n'est passé en pièces et billets qu'en 2002.`},
{q:`Quel État a rejoint la zone euro en 2001, après le premier groupe de onze ?`,opts:[`La Grèce`,`La Slovénie`,`Chypre`,`Malte`],c:0,ex:`Onze États en 1999, la Grèce en 2001, puis les élargissements successifs jusqu'à la Croatie en 2023 et la Bulgarie en 2026.`},
{q:`Quelle est la situation du Danemark à l'égard de la monnaie unique ?`,opts:[`Il bénéficie d'une dérogation obtenue lors du traité de Maastricht`,`Il doit adopter l'euro dès qu'il remplit les critères`,`Il a adopté l'euro en 2002`,`Il a été exclu de la zone euro`],c:0,ex:`Le Danemark dispose d'une clause d'exemption. La Suède, elle, est juridiquement tenue d'adopter l'euro mais y a renoncé après le référendum de 2003.`},
{q:`Pourquoi la Suède n'a-t-elle pas adopté l'euro ?`,opts:[`Un référendum de 2003 l'a rejeté, bien qu'aucune dérogation ne la dispense juridiquement`,`Elle a obtenu une clause d'exemption comme le Danemark`,`Elle ne remplit aucun critère de convergence`,`Elle n'est pas membre de l'Union européenne`],c:0,ex:`Situation singulière : l'obligation juridique existe, mais la Suède s'abstient de remplir la condition de participation au mécanisme de change.`},
{q:`En quelle année la Banque centrale européenne a-t-elle été établie ?`,opts:[`1998`,`1992`,`1999`,`2002`],c:0,ex:`Établie en 1998, un an avant le lancement de l'euro, elle siège à Francfort.`},
{q:`Quel fonds temporaire a été créé en 2010 face à la crise de la dette, avant d'être remplacé ?`,opts:[`Le Fonds européen de stabilité financière`,`Le Mécanisme européen de stabilité`,`Le Fonds de cohésion`,`Le Mécanisme pour l'interconnexion en Europe`],c:0,ex:`Le FESF, créé en urgence en 2010, a été remplacé en 2012 par le Mécanisme européen de stabilité, permanent.`},
{q:`Que désigne l'assouplissement quantitatif pratiqué par la Banque centrale européenne à partir de 2015 ?`,opts:[`Un vaste programme de rachat d'actifs, notamment de dette souveraine`,`Une baisse du taux de réserves obligatoires`,`Un assouplissement des critères de Maastricht`,`Une dévaluation coordonnée de l'euro`],c:0,ex:`Programme contesté, notamment en Allemagne, où il a nourri le contentieux devant la Cour de Karlsruhe.`},
{q:`Quelle différence oppose le mandat de la Banque centrale européenne à celui de la Réserve fédérale américaine ?`,opts:[`La Banque centrale européenne a un objectif principal unique, la Réserve fédérale en arbitre deux`,`La Réserve fédérale est indépendante, pas la Banque centrale européenne`,`La Banque centrale européenne fixe les budgets nationaux`,`La Réserve fédérale n'a pas d'objectif d'inflation`],c:0,ex:`Stabilité des prix pour la première, inflation et emploi pour la seconde. C'est au cœur du débat entre monétaristes et keynésiens sur la réforme de la Banque.`},
{q:`Qu'est-ce que l'union bancaire engagée après la crise de la zone euro ?`,opts:[`Une harmonisation de la supervision et de la résolution des banques au niveau européen`,`La fusion des banques centrales nationales`,`Un fonds de garantie des dépôts géré par les États`,`Une banque publique unique de la zone euro`],c:0,ex:`Elle répond au constat que la surveillance purement nationale n'avait pas empêché les déséquilibres bancaires révélés par la crise.`},
{q:`Quel reproche central est adressé au pacte de stabilité tel qu'il existait avant la crise de la zone euro ?`,opts:[`Il ne surveillait ni l'endettement privé ni les déséquilibres extérieurs`,`Il imposait des sanctions trop lourdes`,`Il interdisait tout déficit public`,`Il ne concernait que les nouveaux États membres`],c:0,ex:`La dérive irlandaise, espagnole et portugaise était d'origine privée : elle est passée sous le radar d'un dispositif centré sur les finances publiques.`},

/* --- Budget et ressources propres --- */
{q:`Quel ordre de grandeur représente le budget annuel de l'Union rapporté à la richesse produite par les États membres ?`,opts:[`Un peu plus de 1 %`,`Environ 5 %`,`Environ 10 %`,`Environ 20 %`],c:0,ex:`Élevé en valeur absolue, minuscule en proportion : c'est ce qui distingue l'Union à la fois d'un État et d'une organisation internationale classique.`},
{q:`Quelle ressource propre fournit aujourd'hui la plus grande part des recettes du budget de l'Union ?`,opts:[`La ressource assise sur le revenu national brut des États membres`,`Les droits de douane`,`La ressource fondée sur la taxe sur la valeur ajoutée`,`La contribution sur les plastiques non recyclés`],c:0,ex:`Conçue en 1988 comme une simple variable d'ajustement, elle est devenue la source dominante, autour de 70 % des recettes.`},
{q:`Comment sont appelées les recettes tirées des droits de douane perçus aux frontières extérieures ?`,opts:[`Les ressources propres traditionnelles`,`Les contributions nationales`,`Les recettes affectées`,`Les ressources d'équilibre`],c:0,ex:`Les États membres en conservent un pourcentage au titre des frais de perception.`},
{q:`Quelle ressource propre est apparue en 2021 ?`,opts:[`Une contribution assise sur les déchets d'emballages plastiques non recyclés`,`Une taxe sur les transactions financières`,`Un impôt européen sur le revenu`,`Une taxe sur le kérosène`],c:0,ex:`Fixée à 0,80 euro par kilogramme, elle contribue à rembourser l'emprunt commun du plan de relance.`},
{q:`L'Union peut-elle financer son budget ordinaire par l'emprunt ?`,opts:[`Non, le budget annuel doit être présenté et exécuté en équilibre`,`Oui, dans la limite de 3 % du revenu national brut`,`Oui, sur décision du Parlement européen`,`Oui, mais seulement pour la politique agricole`],c:0,ex:`Les emprunts du plan de relance reposent sur une base juridique spécifique et exceptionnelle, adossée au relèvement du plafond des ressources propres.`},
{q:`Quelle part du budget de l'Union est dépensée dans les États membres plutôt qu'en frais de fonctionnement ?`,opts:[`Environ 94 %`,`Environ 60 %`,`Environ 75 %`,`Environ 50 %`],c:0,ex:`Le fonctionnement des institutions, personnel compris, ne mobilise qu'une petite fraction du budget, contrairement à une idée répandue.`},
{q:`Quelles deux politiques concentrent l'essentiel des dépenses du budget de l'Union ?`,opts:[`La politique agricole commune et la politique de cohésion`,`La recherche et la défense`,`L'aide au développement et les transports`,`L'éducation et la santé`],c:0,ex:`À elles deux, elles représentent environ les trois quarts des dépenses.`},
{q:`À partir de quelle décennie le budget européen a-t-il été intégralement financé par des ressources propres ?`,opts:[`Les années 1980`,`Les années 1960`,`Les années 1990`,`Les années 2000`],c:0,ex:`Financée d'abord par des contributions étatiques, la Communauté bascule vers les ressources propres à partir de 1980, avant le retour d'une contribution assise sur la richesse nationale en 1988.`},
{q:`Quel Premier ministre britannique a obtenu un rabais budgétaire au début des années 1980 ?`,opts:[`Margaret Thatcher`,`Harold Wilson`,`John Major`,`Edward Heath`],c:0,ex:`Le slogan « I want my money back » a introduit durablement la logique du juste retour dans les négociations budgétaires.`},
{q:`Sur quelle durée l'emprunt commun du plan de relance post-Covid doit-il être remboursé ?`,opts:[`De 2028 à 2058`,`De 2021 à 2027`,`De 2025 à 2035`,`Il n'est pas remboursable`],c:0,ex:`Un engagement sur trois décennies, ce qui explique la recherche de nouvelles ressources propres pour en assurer le service.`},
{q:`Comment se répartit le plan de relance post-Covid entre ses deux instruments ?`,opts:[`Environ 390 milliards d'euros de subventions et 360 milliards de prêts`,`Uniquement des subventions`,`Uniquement des prêts`,`Moitié subventions, moitié garanties bancaires`],c:0,ex:`La part de subventions, non remboursable par l'État bénéficiaire, est ce qui a fait de ce plan une innovation politique majeure.`},
{q:`Quelle part des dépenses des plans nationaux de relance devait être consacrée aux objectifs climatiques ?`,opts:[`37 %`,`20 %`,`10 %`,`55 %`],c:0,ex:`S'y ajoutait un seuil de 20 % pour la transformation numérique. Ces conditionnalités thématiques sont la contrepartie des versements.`},

/* --- Politiques et compétences --- */
{q:`Dans quel type de compétence l'Union et les États membres peuvent-ils tous deux légiférer, les États n'intervenant que si l'Union n'a pas exercé la sienne ?`,opts:[`Les compétences partagées`,`Les compétences exclusives`,`Les compétences d'appui`,`Les compétences réservées`],c:0,ex:`C'est le mécanisme de préemption : l'exercice de la compétence par l'Union fait reculer celle des États dans la même mesure.`},
{q:`Lequel de ces domaines relève des compétences d'appui, de coordination ou de complément ?`,opts:[`La culture`,`L'union douanière`,`La politique commerciale commune`,`La politique monétaire de la zone euro`],c:0,ex:`Les trois autres sont des compétences exclusives. Les compétences d'appui couvrent notamment la culture, le tourisme, l'industrie, l'éducation et la protection civile.`},
{q:`La conservation des ressources biologiques de la mer relève :`,opts:[`De la compétence exclusive de l'Union`,`D'une compétence partagée`,`D'une compétence d'appui`,`De la compétence des seuls États côtiers`],c:0,ex:`C'est le seul volet de la politique de la pêche qui soit exclusif : le reste de la politique halieutique est partagé.`},
{q:`Quel est l'objectif central du pacte vert pour l'Europe ?`,opts:[`Atteindre la neutralité climatique en 2050`,`Doubler la part du nucléaire d'ici 2040`,`Interdire toute importation de matières fossiles dès 2030`,`Créer une taxe carbone mondiale`],c:0,ex:`Assorti d'une cible intermédiaire de réduction des émissions nettes d'au moins 55 % en 2030 par rapport à 1990, déclinée par le paquet « Fit for 55 ».`},
{q:`Que désigne le paquet législatif « Fit for 55 » ?`,opts:[`L'ensemble des mesures destinées à atteindre une baisse d'au moins 55 % des émissions nettes en 2030`,`Un plan pour l'emploi des plus de 55 ans`,`Un objectif de 55 % d'énergies renouvelables`,`Une réforme du budget à hauteur de 55 milliards`],c:0,ex:`La référence de 55 % porte sur les émissions nettes de gaz à effet de serre par rapport aux niveaux de 1990.`},
{q:`Quelle stratégie du pacte vert porte sur le système alimentaire ?`,opts:[`De la ferme à la table`,`Horizon Europe`,`Le pacte pour les compétences`,`La boussole numérique`],c:0,ex:`Elle vise un système alimentaire plus respectueux de l'environnement, avec des objectifs sur les pesticides, les engrais et l'agriculture biologique.`},
{q:`À quel risque le mécanisme d'ajustement carbone aux frontières répond-il ?`,opts:[`À la fuite de carbone, c'est-à-dire au déplacement de la production vers des pays moins contraignants`,`À la volatilité du prix du gaz`,`À la dépendance aux terres rares`,`Au dumping social intracommunautaire`],c:0,ex:`Il fait payer aux importations un coût carbone comparable à celui supporté par les producteurs européens.`},

/* --- Politique agricole commune --- */
{q:`En quelle année la politique agricole commune est-elle entrée en application ?`,opts:[`1962`,`1957`,`1968`,`1975`],c:0,ex:`Prévue par le traité de Rome, c'est la première politique commune effectivement mise en œuvre par la Communauté.`},
{q:`Quel était l'objectif principal de la politique agricole commune à sa création ?`,opts:[`L'autosuffisance alimentaire de la Communauté`,`La protection de la biodiversité`,`La réduction des surfaces cultivées`,`L'exportation vers les pays en développement`],c:0,ex:`Dans une Europe d'après-guerre encore marquée par la pénurie, l'objectif était clairement productiviste : produire plus.`},
{q:`Quel mécanisme garantissait aux agriculteurs l'écoulement de leur production dans la première politique agricole commune ?`,opts:[`Le système des prix garantis, avec rachat des invendus à un prix minimum`,`Un revenu universel agricole`,`Des quotas d'importation individuels`,`Une assurance récolte obligatoire`],c:0,ex:`Efficace au point de générer des excédents structurels dès les années 1970, et un coût budgétaire devenu insoutenable.`},
{q:`Qu'a introduit la réforme de la politique agricole commune de 2003 ?`,opts:[`Le découplage progressif entre les aides et les quantités produites`,`Le retour des prix garantis`,`La suppression des aides directes`,`La renationalisation complète de la politique agricole`],c:0,ex:`Le découplage vise à ne plus subventionner le volume produit, donc à casser l'incitation à la surproduction.`},
{q:`Quels sont les deux fonds qui financent aujourd'hui la politique agricole commune ?`,opts:[`Le FEAGA et le FEADER`,`Le FEDER et le FSE`,`Le Fonds de cohésion et le FEAGA`,`Le FEADER et le Fonds pour une transition juste`],c:0,ex:`Le premier finance les aides directes et le soutien aux marchés, le second le développement rural. C'est la distinction classique entre les deux piliers.`},
{q:`Depuis la réforme entrée en application en 2023, comment chaque État membre programme-t-il sa politique agricole ?`,opts:[`Par un plan stratégique national couvrant les deux fonds`,`Par un règlement adopté par son parlement`,`Par une convention bilatérale avec la Commission`,`Il n'y a plus de programmation nationale`],c:0,ex:`Cette approche donne davantage de latitude aux administrations nationales, au risque d'une plus grande hétérogénéité entre États.`},
{q:`Quelle critique sociale est le plus souvent adressée à la répartition des aides agricoles européennes ?`,opts:[`Elles bénéficient très majoritairement aux plus grandes exploitations`,`Elles sont réservées aux exploitations biologiques`,`Elles excluent les jeunes agriculteurs par principe`,`Elles sont réparties à parts strictement égales`],c:0,ex:`Les aides étant largement indexées sur la surface, une minorité d'exploitants concentre l'essentiel des montants.`},
{q:`Quel groupe de pays exportateurs agricoles conteste les subventions européennes dans les négociations commerciales multilatérales ?`,opts:[`Le groupe de Cairns`,`Le groupe de Visegrad`,`Le groupe de contact`,`Le groupe de Minsk`],c:0,ex:`Il réunit notamment l'Argentine, l'Australie, le Brésil, le Canada et la Nouvelle-Zélande, qui dénoncent une concurrence déloyale.`},

/* --- Cohésion et fonds structurels --- */
{q:`Quel fonds structurel est le plus ancien, créé dès le traité de Rome ?`,opts:[`Le Fonds social européen`,`Le Fonds européen de développement régional`,`Le Fonds de cohésion`,`Le Fonds pour une transition juste`],c:0,ex:`Créé en 1957, il précède de près de vingt ans le fonds régional. Il soutient l'accès à l'emploi et la formation.`},
{q:`Quel critère détermine l'éligibilité d'un État membre au Fonds de cohésion ?`,opts:[`Un revenu national brut par habitant inférieur à 90 % de la moyenne de l'Union`,`Un taux de chômage supérieur à 10 %`,`Une adhésion postérieure à 2004`,`Une population inférieure à dix millions d'habitants`],c:0,ex:`Le critère est national, contrairement au fonds régional qui raisonne par région. La France n'y est pas éligible.`},
{q:`Sur quelle durée sont calées les périodes de programmation de la politique de cohésion ?`,opts:[`Sept ans`,`Trois ans`,`Cinq ans`,`Dix ans`],c:0,ex:`Alignées sur le cadre financier pluriannuel, ces périodes longues répondent au fait que le rattrapage régional ne se joue pas sur un exercice budgétaire.`},
{q:`Sur quoi le Fonds de cohésion met-il principalement l'accent ?`,opts:[`Les réseaux de transport et le développement durable`,`La formation professionnelle`,`La recherche fondamentale`,`Le soutien aux revenus agricoles`],c:0,ex:`Il complète le fonds régional en finançant des infrastructures lourdes dans les États les moins prospères.`},

/* --- Euroscepticisme et Brexit --- */
{q:`Depuis quelle année le Parlement européen est-il élu au suffrage universel direct ?`,opts:[`1979`,`1957`,`1992`,`1962`],c:0,ex:`Avant 1979, les membres de l'Assemblée étaient désignés au sein des parlements nationaux et n'avaient qu'un rôle consultatif.`},
{q:`Quelle particularité a marqué l'élaboration du traité établissant une Constitution pour l'Europe ?`,opts:[`Il a été préparé par une Convention plus ouverte qu'une conférence intergouvernementale classique`,`Il a été rédigé par la seule Commission`,`Il a été adopté sans ratification nationale`,`Il a été négocié en dehors du cadre des traités`],c:0,ex:`Cette méthode se voulait une réponse au reproche de déficit démocratique. Le traité a néanmoins été rejeté par référendum en France et aux Pays-Bas en 2005.`},
{q:`Dans quel seul État membre le traité de Lisbonne a-t-il été soumis à référendum ?`,opts:[`En Irlande`,`En France`,`Aux Pays-Bas`,`Au Danemark`],c:0,ex:`Une exigence constitutionnelle irlandaise. Le premier référendum ayant échoué en 2008, un second a été organisé en 2009 après des garanties.`},
{q:`Quelle est la position typique du courant eurosceptique souverainiste sur l'architecture européenne ?`,opts:[`Il milite pour une Europe confédérale plutôt que fédérale`,`Il réclame un État fédéral européen`,`Il défend l'élargissement illimité`,`Il propose la fusion des armées nationales`],c:0,ex:`Pour ce courant, la nation est le seul cadre où la démocratie et la souveraineté peuvent s'exercer, ce qui rend le transfert de compétences inacceptable.`},
{q:`Sur quoi repose principalement la critique eurosceptique de gauche à l'égard de l'Union ?`,opts:[`Sur le caractère libéral des traités et son effet supposé sur les droits sociaux`,`Sur la défense de la souveraineté monétaire allemande`,`Sur le refus de la liberté d'établissement`,`Sur l'opposition à l'élargissement à l'est`],c:0,ex:`Cette famille dénonce la concurrence comme principe organisateur et le carcan que représenterait l'Union monétaire pour des politiques de gauche.`},
{q:`En quelle année le Royaume-Uni a-t-il organisé son premier référendum sur son maintien dans la Communauté ?`,opts:[`1975`,`1973`,`1986`,`2016`],c:0,ex:`Deux ans après l'adhésion, à l'initiative d'une opposition venue d'abord de la gauche travailliste. Le maintien l'avait emporté largement.`},
{q:`En quelle année le parti UKIP, centré sur la sortie de l'Union, a-t-il été fondé ?`,opts:[`1993`,`1979`,`2004`,`2013`],c:0,ex:`L'année du traité de Maastricht, ce qui n'est pas une coïncidence : c'est ce traité qui cristallise l'euroscepticisme britannique moderne.`},
{q:`Quel résultat le référendum britannique du 23 juin 2016 a-t-il donné ?`,opts:[`Environ 51,9 % en faveur de la sortie`,`Environ 60 % en faveur de la sortie`,`Environ 51,9 % en faveur du maintien`,`Une égalité parfaite`],c:0,ex:`Une victoire étroite, doublée d'un clivage territorial marqué entre nations et entre villes et campagnes.`},
{q:`Comment l'Écosse a-t-elle voté lors du référendum sur le Brexit ?`,opts:[`Majoritairement pour le maintien dans l'Union`,`Majoritairement pour la sortie`,`Elle n'a pas participé au scrutin`,`À égalité parfaite`],c:0,ex:`L'Écosse, l'Irlande du Nord et Gibraltar ont voté pour le maintien, l'Angleterre et le pays de Galles pour la sortie.`},
{q:`À quelle date le Royaume-Uni a-t-il juridiquement quitté l'Union européenne ?`,opts:[`Le 31 janvier 2020`,`Le 23 juin 2016`,`Le 29 mars 2019`,`Le 31 décembre 2020`],c:0,ex:`Une période de transition a couru jusqu'au 31 décembre 2020, pendant laquelle le droit de l'Union continuait de s'appliquer.`},
{q:`Que prévoit l'accord commercial conclu entre l'Union et le Royaume-Uni fin 2020 ?`,opts:[`Ni droits de douane ni quotas, mais le rétablissement des formalités douanières`,`Le maintien du Royaume-Uni dans le marché unique`,`Des droits de douane sur tous les biens industriels`,`La libre circulation des personnes maintenue`],c:0,ex:`L'absence de droits de douane ne supprime pas les frictions : déclarations d'importation et d'exportation renchérissent les échanges.`},
{q:`Quel secteur est resté en dehors de l'accord de libre-échange entre l'Union et le Royaume-Uni ?`,opts:[`Les services, dont les services financiers`,`Les produits agricoles`,`L'automobile`,`Les produits chimiques`],c:0,ex:`La City ne peut plus commercialiser librement ses produits financiers dans l'Union, ce qui a conduit à des relocalisations vers Dublin, Francfort, Luxembourg et Paris.`},
{q:`Pourquoi la frontière irlandaise a-t-elle constitué le point le plus délicat des négociations du Brexit ?`,opts:[`Parce que rétablir des contrôles menaçait l'accord de paix de 1998`,`Parce que l'Irlande envisageait de quitter l'Union`,`Parce que l'Irlande du Nord avait voté pour la sortie`,`Parce qu'aucune frontière n'y avait jamais existé`],c:0,ex:`L'accord du Vendredi saint reposait sur l'absence de frontière physique. La solution retenue déplace le contrôle douanier en mer d'Irlande.`},
{q:`Quelle option de « Brexit doux » le gouvernement britannique a-t-il refusée ?`,opts:[`Le modèle norvégien, avec maintien dans l'Espace économique européen`,`Le modèle suisse d'accords sectoriels`,`Le modèle canadien de libre-échange`,`Une union douanière complète`],c:0,ex:`Ce modèle aurait imposé de respecter la législation européenne et de contribuer au budget sans participer au vote, exactement ce que dénonçaient les partisans du Brexit.`},
{q:`Le Royaume-Uni participait-il à l'espace Schengen et à la zone euro avant le Brexit ?`,opts:[`Ni à l'un ni à l'autre`,`Aux deux`,`À Schengen seulement`,`À la zone euro seulement`],c:0,ex:`Il ne participait pas davantage à l'union bancaire, ce qui a limité l'onde de choc institutionnelle de son départ.`},

/* --- L'Union dans le monde --- */
{q:`Qui négocie au nom des États membres à l'Organisation mondiale du commerce ?`,opts:[`La Commission, via le commissaire chargé du commerce`,`La présidence tournante du Conseil`,`Le Haut représentant pour les affaires étrangères`,`Chaque État membre séparément`],c:0,ex:`La politique commerciale commune étant une compétence exclusive, l'Union y parle d'une seule voix.`},
{q:`Quel accord a remplacé en 2000 la convention de Lomé conclue avec les pays d'Afrique, des Caraïbes et du Pacifique ?`,opts:[`L'accord de Cotonou`,`L'accord de Yaoundé`,`Le processus de Barcelone`,`L'accord de Marrakech`],c:0,ex:`Ces accords lient l'Union à un vaste groupe de pays en développement par des préférences commerciales et une coopération économique.`},
{q:`Quel traité a institutionnalisé la politique étrangère et de sécurité commune ?`,opts:[`Le traité de Maastricht`,`L'Acte unique européen`,`Le traité de Nice`,`Le traité de Rome`],c:0,ex:`Elle constituait le deuxième pilier de l'Union, régi par des procédures intergouvernementales et l'unanimité.`},
{q:`Quel dispositif de coordination diplomatique a précédé la politique étrangère et de sécurité commune ?`,opts:[`La coopération politique européenne, lancée en 1970`,`Le Conseil de l'Europe`,`L'Union de l'Europe occidentale, créée en 1948`,`Le Comité politique et de sécurité`],c:0,ex:`Simple concertation entre ministères des affaires étrangères, elle a été absorbée par la politique étrangère commune à Maastricht.`},
{q:`Quel service diplomatique a été créé par le traité de Lisbonne ?`,opts:[`Le Service européen pour l'action extérieure`,`La Direction générale des relations extérieures`,`Le Corps diplomatique commun`,`L'Agence européenne de défense`],c:0,ex:`Placé sous l'autorité du Haut représentant, il réunit des fonctionnaires des institutions et des diplomates détachés par les États membres.`},
{q:`En quelle année la politique européenne de voisinage a-t-elle été lancée ?`,opts:[`2004`,`1995`,`2009`,`2014`],c:0,ex:`Lancée l'année du grand élargissement, elle vise à structurer les relations avec les pays limitrophes à l'est et au sud sans leur offrir l'adhésion.`},
{q:`Quel processus a été lancé en 1995 pour structurer les relations avec les pays du pourtour méditerranéen ?`,opts:[`Le processus de Barcelone`,`Le processus de Bologne`,`Le processus de Berlin`,`Le processus de Rome`],c:0,ex:`Il a été prolongé en 2008 par l'Union pour la Méditerranée, sans que l'influence européenne dans la région s'en trouve transformée.`},
{q:`Combien d'États membres de l'Union ne reconnaissent pas le Kosovo comme État souverain ?`,opts:[`Cinq`,`Aucun`,`Deux`,`Douze`],c:0,ex:`Exemple emblématique de la difficulté à parler d'une seule voix : la reconnaissance d'un État relève de chaque capitale, pas de l'Union.`},
{q:`Quels États membres revendiquent traditionnellement un statut de neutralité militaire ?`,opts:[`L'Autriche, la Finlande, l'Irlande, Malte et la Suède`,`La Belgique, le Danemark et la Grèce`,`La Pologne, la Hongrie et la Slovaquie`,`Le Portugal, l'Espagne et l'Italie`],c:0,ex:`L'invasion de l'Ukraine a conduit la Finlande puis la Suède à rejoindre l'Alliance atlantique, modifiant cette liste.`},
{q:`Quand la Finlande et la Suède ont-elles rejoint l'Alliance atlantique ?`,opts:[`La Finlande en 2023 et la Suède en 2024`,`Toutes deux en 2022`,`La Suède en 2023 et la Finlande en 2024`,`Toutes deux en 2024`],c:0,ex:`Rupture historique avec des décennies de non-alignement, provoquée par l'invasion russe de l'Ukraine en février 2022.`},
{q:`Dans quelle négociation internationale l'Union a-t-elle joué un rôle central en juillet 2015 ?`,opts:[`L'accord sur le nucléaire iranien`,`Les accords d'Oslo`,`L'accord de paix en Colombie`,`Le traité sur le commerce des armes`],c:0,ex:`Le Haut représentant y a exercé une fonction de coordination, l'un des rares succès diplomatiques attribuables à l'Union en tant que telle.`},
{q:`L'Union européenne fournit-elle elle-même une aide militaire, au sens d'une armée propre ?`,opts:[`Non, elle ne dispose pas d'armée ; les capacités restent nationales`,`Oui, elle dispose d'une armée permanente depuis 2009`,`Oui, à travers le commandement de l'Alliance atlantique`,`Oui, depuis la création du Service européen pour l'action extérieure`],c:0,ex:`Elle finance et coordonne, mais les forces engagées relèvent des États membres. C'est la limite structurelle de sa politique de défense.`},
{q:`Comment qualifie-t-on l'influence internationale que l'Union exerce par la norme et la persuasion plutôt que par la contrainte ?`,opts:[`La puissance douce`,`La dissuasion élargie`,`La diplomatie coercitive`,`L'équilibre des puissances`],c:0,ex:`Efficace vis-à-vis des candidats à l'adhésion, cette forme de puissance montre ses limites face à des acteurs raisonnant en rapports de force.`},

/* --- Institutions, compléments --- */
{q:`Combien de membres compte la Cour des comptes européenne ?`,opts:[`Un par État membre`,`Quinze`,`Douze`,`Vingt`],c:0,ex:`Ses membres sont nommés pour six ans par le Conseil après consultation du Parlement européen.`},
{q:`Quelle majorité le Parlement européen doit-il réunir pour adopter une motion de censure contre la Commission ?`,opts:[`Les deux tiers des suffrages exprimés représentant la majorité des membres`,`La majorité simple des votants`,`L'unanimité des groupes politiques`,`Les trois quarts des membres`],c:0,ex:`Cette double condition rend la censure très difficile : aucune motion n'a jamais abouti, même si la Commission Santer a démissionné en 1999 avant le vote.`},
{q:`Quelle Commission a démissionné collectivement en 1999 avant un vote de censure ?`,opts:[`La Commission Santer`,`La Commission Delors`,`La Commission Prodi`,`La Commission Barroso`],c:0,ex:`Un rapport sur la fraude et la mauvaise gestion a précipité la démission, épisode fondateur du renforcement du contrôle parlementaire.`},
{q:`Où se tiennent les sessions plénières ordinaires du Parlement européen ?`,opts:[`À Strasbourg`,`À Bruxelles`,`À Luxembourg`,`Elles alternent librement entre les trois villes`],c:0,ex:`Le siège de Strasbourg est fixé par les traités ; les commissions siègent à Bruxelles et le secrétariat général à Luxembourg.`},
{q:`Comment est fixé le nombre de sièges attribué à chaque État au Parlement européen ?`,opts:[`Selon une proportionnalité dégressive, avec un plancher et un plafond`,`Strictement proportionnellement à la population`,`À parts égales entre États`,`Par tirage au sort avant chaque élection`],c:0,ex:`La proportionnalité dégressive surreprésente les petits États et sous-représente les grands, compromis entre égalité des États et égalité des citoyens.`},
{q:`Qui nomme les juges de la Cour de justice de l'Union européenne ?`,opts:[`Les gouvernements des États membres d'un commun accord, après avis d'un comité`,`Le Parlement européen`,`La Commission`,`Le Conseil européen à la majorité qualifiée`],c:0,ex:`Le comité prévu à l'article 255 du traité rend un avis sur l'aptitude des candidats avant la nomination, pour un mandat renouvelable de six ans.`},
{q:`Quel est le rôle des avocats généraux à la Cour de justice ?`,opts:[`Présenter en toute indépendance des conclusions motivées sur les affaires`,`Représenter la Commission devant la Cour`,`Défendre les États membres`,`Instruire les recours en manquement`],c:0,ex:`Leurs conclusions ne lient pas la Cour, mais elles éclairent le raisonnement et sont souvent suivies.`},
{q:`Que peut faire la Commission si un État membre n'exécute pas un arrêt en manquement ?`,opts:[`Saisir à nouveau la Cour et demander une astreinte ou une somme forfaitaire`,`Suspendre son droit de vote au Conseil`,`Le sanctionner directement sans passer par la Cour`,`Engager la procédure de retrait`],c:0,ex:`C'est le manquement sur manquement : la sanction pécuniaire n'intervient qu'au second tour, sauf en cas de défaut de transposition.`},
{q:`Qui préside l'Eurogroupe ?`,opts:[`Un président élu par les ministres des finances de la zone euro pour deux ans et demi`,`Le président de la Banque centrale européenne`,`Le commissaire chargé de l'économie`,`La présidence tournante du Conseil`],c:0,ex:`L'Eurogroupe est une instance informelle : il prépare les décisions sans être une formation officielle du Conseil.`},
{q:`Qu'est-ce que le Coreper ?`,opts:[`Le comité des représentants permanents des États membres, qui prépare les travaux du Conseil`,`Le comité de contrôle budgétaire du Parlement`,`Un organe consultatif des régions`,`Le service juridique de la Commission`],c:0,ex:`Il filtre les dossiers : les points A sont adoptés sans débat par les ministres, les points B font l'objet d'une discussion politique.`},
{q:`Quelle différence sépare le Coreper I du Coreper II ?`,opts:[`Le premier réunit les représentants permanents adjoints, le second les représentants permanents`,`Le premier traite du budget, le second de la justice`,`Le premier siège à Bruxelles, le second à Luxembourg`,`Il n'y a aucune différence de composition`],c:0,ex:`Le Coreper II, composé des ambassadeurs, traite les dossiers les plus politiques : affaires générales, étrangères, économiques et financières, justice.`},
{q:`Quelle est la durée du mandat du président du Conseil européen ?`,opts:[`Deux ans et demi, renouvelable une fois`,`Cinq ans, non renouvelable`,`Six mois, par rotation`,`Quatre ans, renouvelable`],c:0,ex:`Créée par le traité de Lisbonne, cette présidence stable a remplacé la présidence tournante pour le Conseil européen.`},
{q:`Quelle institution adopte, avec le Conseil, le budget annuel de l'Union ?`,opts:[`Le Parlement européen`,`La Cour des comptes`,`Le Conseil européen`,`Le Comité économique et social`],c:0,ex:`Le Parlement a acquis ce pouvoir par étapes depuis les années 1970 ; il peut rejeter le projet dans son ensemble.`},
{q:`À qui incombe la responsabilité de l'exécution du budget de l'Union ?`,opts:[`À la Commission`,`Au Conseil`,`À la Cour des comptes`,`Au Parlement européen`],c:0,ex:`Le Parlement lui donne ensuite décharge, sur recommandation du Conseil et au vu du rapport annuel de la Cour des comptes.`},
{q:`Que signifie la gestion partagée du budget européen ?`,opts:[`Les crédits sont mis en œuvre conjointement par la Commission et les administrations nationales`,`Le budget est réparti à parts égales entre les États`,`Les crédits sont gérés par la Banque européenne d'investissement`,`Chaque État gère librement sa contribution`],c:0,ex:`Ce mode concerne la majeure partie des dépenses, notamment l'agriculture et la cohésion.`},
{q:`Quelle est la fonction principale de la Banque européenne d'investissement ?`,opts:[`Financer par des prêts des projets d'investissement conformes aux objectifs de l'Union`,`Conduire la politique monétaire de la zone euro`,`Contrôler les comptes des institutions`,`Superviser les banques commerciales`],c:0,ex:`Ses actionnaires sont les États membres. Elle emprunte sur les marchés et prête à des conditions avantageuses, sans être une institution monétaire.`},
{q:`Quelle procédure s'applique lorsque le traité prévoit que le Conseil statue après approbation du Parlement européen ?`,opts:[`La procédure d'approbation, où le Parlement accepte ou rejette sans amender`,`La procédure de codécision`,`La procédure de consultation simple`,`La procédure de concertation budgétaire`],c:0,ex:`Elle s'applique notamment aux accords d'adhésion et à de nombreux accords internationaux : un droit de veto, mais pas de pouvoir d'amendement.`},
{q:`Quel est l'effet d'un avis rendu par le Parlement dans le cadre d'une procédure de consultation ?`,opts:[`Il doit être recueilli avant l'adoption, mais ne lie pas le Conseil`,`Il lie le Conseil`,`Il est purement facultatif`,`Il suspend la procédure pendant six mois`],c:0,ex:`Omettre la consultation entache l'acte d'un vice de procédure susceptible d'entraîner son annulation, même si le contenu de l'avis ne s'impose pas.`},
{q:`Combien de temps le Parlement et le Conseil disposent-ils, en principe, pour la deuxième lecture dans la procédure législative ordinaire ?`,opts:[`Trois mois, prolongeables d'un mois`,`Six mois, non prolongeables`,`Un an`,`Aucun délai n'est fixé`],c:0,ex:`En cas de désaccord persistant, un comité de conciliation est convoqué ; son échec fait tomber la proposition.`},
{q:`Qu'advient-il d'une proposition législative si le comité de conciliation n'aboutit pas à un projet commun ?`,opts:[`L'acte est réputé non adopté`,`Le Conseil décide seul`,`La Commission tranche`,`Le texte est renvoyé au Conseil européen`],c:0,ex:`C'est ce qui donne au Parlement un véritable pouvoir de blocage en troisième phase de la procédure ordinaire.`},
{q:`Quel recours permet de contester la légalité d'un acte de l'Union devant la Cour ?`,opts:[`Le recours en annulation`,`Le recours en manquement`,`Le renvoi préjudiciel`,`Le recours en carence`],c:0,ex:`Le recours en carence vise à l'inverse l'abstention illégale d'agir d'une institution.`},
{q:`À quelle condition un particulier peut-il attaquer directement un acte de l'Union en annulation ?`,opts:[`Si l'acte le concerne directement et individuellement, ou s'il s'agit d'un acte réglementaire le concernant directement sans mesures d'exécution`,`Sans aucune condition`,`Seulement avec l'accord de son État`,`Seulement s'il est ressortissant d'un État membre`],c:0,ex:`Cette recevabilité restrictive explique que la voie préjudicielle reste la principale porte d'entrée des particuliers dans le contentieux de la légalité.`},
{q:`Quel est le délai de droit commun pour former un recours en annulation ?`,opts:[`Deux mois`,`Six mois`,`Un an`,`Trente jours`],c:0,ex:`Le délai court à compter de la publication de l'acte, de sa notification ou du jour où le requérant en a eu connaissance.`},
{q:`Quelle est la portée d'un arrêt d'annulation rendu par la Cour de justice ?`,opts:[`L'acte est annulé avec effet à l'égard de tous`,`L'acte n'est écarté que dans le litige en cause`,`L'acte reste valable jusqu'à son abrogation`,`L'acte est renvoyé au législateur pour correction obligatoire`],c:0,ex:`La Cour peut néanmoins maintenir provisoirement certains effets de l'acte annulé pour éviter un vide juridique.`},
{q:`Que garantit la citoyenneté européenne instaurée par le traité de Maastricht ?`,opts:[`Des droits qui s'ajoutent à la citoyenneté nationale, sans la remplacer`,`Un passeport unique remplaçant les passeports nationaux`,`Le droit de vote à toutes les élections nationales`,`Une nationalité européenne autonome`],c:0,ex:`Elle ouvre notamment le droit de vote et d'éligibilité aux municipales et aux européennes dans l'État de résidence, ainsi que la protection consulaire.`},
{q:`Quelle protection la citoyenneté de l'Union offre-t-elle dans un pays tiers ?`,opts:[`La protection consulaire de tout autre État membre représenté sur place`,`Une immunité diplomatique`,`Un rapatriement systématique aux frais de l'Union`,`Aucune protection particulière`],c:0,ex:`Un citoyen dont l'État n'a pas d'ambassade sur place peut s'adresser à celle de n'importe quel autre État membre.`},
{q:`À quelles élections un citoyen de l'Union résidant dans un autre État membre peut-il voter dans son État de résidence ?`,opts:[`Aux élections municipales et européennes`,`À toutes les élections, y compris législatives`,`Aux seules élections européennes`,`À aucune, il vote uniquement dans son État d'origine`],c:0,ex:`Les élections nationales et, en règle générale, les référendums restent réservés aux nationaux.`},
{q:`Quel principe interdit toute discrimination fondée sur la nationalité dans le champ d'application des traités ?`,opts:[`Le principe de non-discrimination, aujourd'hui à l'article 18 du traité sur le fonctionnement de l'Union`,`Le principe de subsidiarité`,`Le principe d'attribution`,`Le principe de coopération loyale`],c:0,ex:`C'est un pilier du marché intérieur : sans lui, les libertés de circulation seraient vidées de leur substance.`},
{q:`Que signifie le principe d'attribution des compétences ?`,opts:[`L'Union n'agit que dans les limites des compétences que les traités lui confèrent`,`L'Union peut se saisir de tout sujet d'intérêt européen`,`Les compétences sont réparties chaque année par le Conseil`,`Chaque commissaire choisit son portefeuille`],c:0,ex:`Toute compétence non attribuée reste aux États membres. C'est la clé de voûte du système, en amont de la subsidiarité et de la proportionnalité.`},
{q:`Que prévoit le principe de coopération loyale ?`,opts:[`L'Union et les États membres se respectent et s'assistent mutuellement dans l'exécution des missions découlant des traités`,`Les États doivent voter dans le même sens au Conseil`,`La Commission doit informer le Conseil européen de toute initiative`,`Les États s'engagent à ne pas conclure d'accords bilatéraux`],c:0,ex:`Il fonde notamment l'obligation pour les États de prendre toute mesure garantissant l'exécution du droit de l'Union et de s'abstenir de la compromettre.`},
{q:`Que désigne l'effet direct horizontal d'une norme de l'Union ?`,opts:[`La possibilité de l'invoquer dans un litige entre particuliers`,`Son application dans les rapports entre États membres`,`Son applicabilité aux institutions de l'Union`,`Sa primauté sur les constitutions nationales`],c:0,ex:`Le règlement produit un effet direct horizontal ; la directive non transposée, en principe, non : elle ne peut être invoquée que contre l'État.`},
{q:`Une directive non transposée dans les délais peut-elle être invoquée par un particulier contre son État ?`,opts:[`Oui, si ses dispositions sont claires, précises et inconditionnelles`,`Non, jamais`,`Oui, sans aucune condition`,`Uniquement avec l'autorisation de la Commission`],c:0,ex:`C'est l'effet direct vertical ascendant. L'inverse, invoquer une directive non transposée contre un particulier, est exclu.`},
{q:`Quelle jurisprudence a consacré la responsabilité d'un État membre pour les dommages causés aux particuliers par une violation du droit de l'Union ?`,opts:[`L'arrêt Francovich`,`L'arrêt Van Gend en Loos`,`L'arrêt Costa contre ENEL`,`L'arrêt Cassis de Dijon`],c:0,ex:`Trois conditions : la règle violée confère des droits, la violation est suffisamment caractérisée, et un lien de causalité existe avec le dommage.`},
{q:`Quel arrêt de 1979 a fondé le principe de reconnaissance mutuelle des marchandises ?`,opts:[`L'arrêt Cassis de Dijon`,`L'arrêt Dassonville`,`L'arrêt Keck`,`L'arrêt Bosman`],c:0,ex:`Un produit légalement fabriqué et commercialisé dans un État membre doit en principe pouvoir circuler dans les autres, sauf exigences impératives.`},
{q:`Qu'a jugé la Cour dans l'arrêt Bosman (1995) ?`,opts:[`Les indemnités de transfert en fin de contrat et les quotas de nationalité entravaient la libre circulation des travailleurs`,`Le sport échappe au droit de l'Union`,`Les clubs peuvent limiter librement le nombre d'étrangers`,`Les contrats sportifs relèvent du seul droit national`],c:0,ex:`Illustration que la libre circulation des travailleurs s'applique aux activités économiques, y compris sportives professionnelles.`},
{q:`Que recouvre la notion d'exigences impératives d'intérêt général en droit du marché intérieur ?`,opts:[`Des justifications non écrites admises par la jurisprudence pour restreindre une liberté de circulation`,`Les seules exceptions listées par les traités`,`Les normes techniques harmonisées`,`Les obligations de service public imposées par la Commission`],c:0,ex:`Protection des consommateurs, de l'environnement ou loyauté des transactions par exemple, sous réserve de proportionnalité et de non-discrimination.`},
{q:`Quel article du traité prohibe les ententes entre entreprises restreignant la concurrence ?`,opts:[`L'article 101 du traité sur le fonctionnement de l'Union`,`L'article 102`,`L'article 107`,`L'article 34`],c:0,ex:`L'article 102 vise l'abus de position dominante et l'article 107 les aides d'État : trois piliers distincts du droit de la concurrence.`},
{q:`Quel article encadre les aides accordées par les États aux entreprises ?`,opts:[`L'article 107 du traité sur le fonctionnement de l'Union`,`L'article 101`,`L'article 102`,`L'article 45`],c:0,ex:`Les aides faussant la concurrence sont en principe incompatibles avec le marché intérieur, sous réserve des dérogations prévues et du contrôle de la Commission.`},
{q:`Que peut obtenir une entreprise qui dénonce une entente à laquelle elle a participé ?`,opts:[`Une immunité ou une réduction d'amende au titre de la clémence`,`Une exonération automatique de toute responsabilité civile`,`Le droit de poursuivre l'entente sous surveillance`,`Une indemnisation par la Commission`],c:0,ex:`Le programme de clémence est l'instrument principal de détection des cartels, par nature secrets. La première entreprise à coopérer peut échapper à toute amende.`},
{q:`Quel plafond s'applique aux amendes infligées par la Commission pour infraction aux règles de concurrence ?`,opts:[`10 % du chiffre d'affaires mondial annuel de l'entreprise`,`Un million d'euros`,`4 % du chiffre d'affaires européen`,`Aucun plafond`],c:0,ex:`Un plafond, pas un barème : le montant réel dépend de la gravité, de la durée et des circonstances aggravantes ou atténuantes.`},
{q:`Qu'est-ce que l'espace de liberté, de sécurité et de justice ?`,opts:[`Le domaine couvrant l'asile, l'immigration, la coopération judiciaire et policière`,`Le nom officiel de l'espace Schengen`,`La juridiction compétente pour les droits fondamentaux`,`Le siège des agences de sécurité de l'Union`],c:0,ex:`Communautarisé par étapes depuis Amsterdam, il relève des compétences partagées, avec des régimes particuliers pour certains États.`},
{q:`Quelle agence de l'Union est chargée de la coopération entre les autorités policières nationales ?`,opts:[`Europol`,`Eurojust`,`Frontex`,`L'Office européen de lutte antifraude`],c:0,ex:`Eurojust coordonne les autorités judiciaires, Frontex les gardes-frontières, et l'Office antifraude enquête sur les atteintes aux intérêts financiers de l'Union.`},
{q:`Quelle est la mission d'Eurojust ?`,opts:[`Coordonner les autorités judiciaires nationales dans les affaires transfrontalières graves`,`Juger les infractions au droit de l'Union`,`Contrôler les frontières extérieures`,`Superviser les marchés financiers`],c:0,ex:`Elle facilite l'entraide et l'exécution des demandes, sans exercer elle-même de fonction juridictionnelle.`},
{q:`Quelle procédure permet à un État membre de saisir le Conseil européen quand un projet d'acte pénal porte atteinte à son système juridique ?`,opts:[`Le frein de secours, qui suspend la procédure législative ordinaire`,`Le veto national`,`La clause de sauvegarde générale`,`L'opt-out permanent`],c:0,ex:`Si le Conseil européen ne dégage pas de consensus, une coopération renforcée peut être réputée engagée entre les États intéressés.`},
{q:`Que prévoit la clause de solidarité de l'article 222 du traité sur le fonctionnement de l'Union ?`,opts:[`L'Union et les États membres agissent conjointement si un État est victime d'une attaque terroriste ou d'une catastrophe`,`Une aide budgétaire automatique en cas de récession`,`La mutualisation des dettes souveraines`,`Le partage obligatoire des ressources énergétiques`],c:0,ex:`À distinguer de la clause d'assistance mutuelle en cas d'agression armée, qui figure dans le traité sur l'Union européenne.`},
{q:`Que prévoit la clause d'assistance mutuelle de l'article 42, paragraphe 7, du traité sur l'Union européenne ?`,opts:[`En cas d'agression armée sur son territoire, un État membre reçoit aide et assistance des autres par tous les moyens en leur pouvoir`,`Une intervention automatique de l'Alliance atlantique`,`La création d'une armée européenne`,`Un soutien limité à l'aide humanitaire`],c:0,ex:`La clause réserve le caractère spécifique de la politique de défense de certains États, ce qui préserve les positions de neutralité.`},

/* --- Genèse de l'union économique et monétaire --- */
{q:`Quel rapport de 1970 a présenté le premier plan de réalisation de l'union économique et monétaire ?`,opts:[`Le rapport Werner`,`Le rapport Delors`,`Le rapport Spaak`,`Le rapport Tindemans`],c:0,ex:`Rédigé sous la direction du Premier ministre luxembourgeois Pierre Werner, il proposait une réalisation en trois étapes sur une dizaine d'années. La crise monétaire des années soixante-dix a interrompu le projet.`},
{q:`Quel sommet de 1969 a fait de l'union économique et monétaire un objectif formel de la Communauté ?`,opts:[`Le sommet de La Haye`,`Le sommet de Messine`,`Le sommet de Fontainebleau`,`Le sommet de Milan`],c:0,ex:`C'est à la suite de ce sommet qu'un groupe de haut niveau a été chargé de proposer une méthode, ce qui a donné le rapport Werner.`},
{q:`Que désignait le « serpent dans le tunnel » mis en place en 1972 ?`,opts:[`Les monnaies européennes fluctuant dans une bande étroite à l'intérieur d'une bande plus large définie face au dollar`,`Un mécanisme de prêts entre banques centrales`,`Le tracé du premier pipeline communautaire`,`Un système de quotas agricoles`],c:0,ex:`Le serpent, ce sont les monnaies européennes entre elles ; le tunnel, la marge autorisée face au dollar. L'effondrement du système de Bretton Woods a rendu le tunnel inopérant.`},
{q:`Quelle institution a été créée en 1973 pour gérer la coopération monétaire entre États membres ?`,opts:[`Le Fonds européen de coopération monétaire`,`L'Institut monétaire européen`,`La Banque européenne d'investissement`,`Le Mécanisme européen de stabilité`],c:0,ex:`Ce fonds a précédé de vingt ans l'Institut monétaire européen, lui-même prédécesseur de la Banque centrale européenne.`},
{q:`Quelle monnaie ne participait pas au Système monétaire européen lors de son lancement en 1979 ?`,opts:[`La livre sterling`,`Le franc français`,`Le mark allemand`,`La lire italienne`],c:0,ex:`Le Royaume-Uni est resté en dehors du mécanisme de change au lancement. La lire y participait, avec une marge de fluctuation élargie qui lui était propre.`},
