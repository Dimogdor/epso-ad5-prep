<p><b>Domaine et base juridique</b> La politique commune des transports est une compétence partagée entre l'Union et ses États membres, selon l'<span class="kb-fact">article 4, paragraphe 2, point g) du traité sur le fonctionnement de l'Union européenne (TFUE)</span>. Le <span class="kb-fact">titre VI du TFUE</span> établit le cadre permettant l'adoption de règles communes pour le transport international, l'accès au marché, la sécurité et l'harmonisation des dispositions nationales.</p><p><b>Objectifs climatiques</b> Le <span class="kb-fact">livre blanc de 2011</span> fixait un objectif de réduction des émissions du secteur d'au moins <span class="kb-fact">60 % entre 1990 et 2050</span>. Pour atteindre la neutralité climatique, l'objectif est désormais une réduction de <span class="kb-fact">90 % des émissions de CO2 d'ici 2050</span>, avec une cible d'au moins <span class="kb-fact">30 millions de voitures à émissions nulles en circulation d'ici 2030</span>. Le transport combiné de marchandises est encadré par la <span class="kb-fact">directive 92/106/CEE</span> de 1992.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Transport maritime : approche stratégique`, body:`
<p><b>De quoi s'agit-il</b> La politique de l'Union en matière de transport maritime vise à appliquer la libre prestation de services dans ce secteur, à garantir le respect des règles de concurrence et à assurer la sécurité maritime, de bonnes conditions de travail et le respect de l'environnement.</p>

<p><b>Base juridique et réalisations</b> Article <span class="kb-fact">100, paragraphe 2, du traité sur le fonctionnement de l'Union européenne</span>. Le secteur a été libéralisé à partir du <span class="kb-fact">22 décembre 1986</span> par un premier paquet de trois règlements levant les restrictions sur les armateurs de l'Union et combattant les pratiques tarifaires déloyales. Le <span class="kb-fact">cabotage</span> national a suivi en <span class="kb-fact">1992</span> (règlement <span class="kb-fact">(CEE) n° 3577/92</span>). Le <span class="kb-fact">règlement (UE) 2017/352</span>, adopté le 15 février 2017, encadre l'accès aux services portuaires et la transparence financière.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Transports maritimes : règles de trafic et de sécurité`, body:`
<p><b>Politique UE de sécurité maritime</b> L'Union européenne a considérablement renforcé les normes de sécurité du transport maritime suite aux naufrages des pétroliers <span class="kb-fact">Erika en 1999</span> et <span class="kb-fact">Prestige en 2002</span>. Trois paquets législatifs majeurs (Erika I, Erika II, et un troisième paquet en 2008-2009) ont progressivement amélioré la protection des passagers, des équipages, du milieu marin et des régions côtières, en transposant les conventions internationales de l'<span class="kb-fact">OMI</span> (SOLAS, STCW, MARPOL).</p><p><b>Mesures clés et institutions</b> Le paquet <span class="kb-fact">Erika II</span> a créé l'<span class="kb-fact">Agence européenne pour la sécurité maritime (AESM)</span>, chargée du suivi technique et du contrôle d'application. Les principales mesures incluent l'obligation de <span class="kb-fact">double coque</span> pour les pétroliers, le système <span class="kb-fact">SafeSeaNet</span> de suivi du trafic des navires, le renforcement du contrôle par l'État du port, et l'instauration de listes noires interdisant l'accès aux ports de l'Union aux navires dangereux.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Tourisme`, body:`
<p><b>Cadre et objectifs.</b> La politique touristique de l'UE, fondée sur l'article 195 du traité sur le fonctionnement de l'Union européenne, vise à développer un tourisme durable et compétitif. L'Union coordonne les initiatives transfrontières, collecte des données, finance des projets durables et protège les droits des voyageurs, tout en reconnaissant que le tourisme demeure essentiellement une responsabilité nationale des Etats membres.</p><p><b>Poids économique et mesures clés.</b> Le tourisme représente <span class="kb-fact">10 % du PIB</span> de l'UE et emploie <span class="kb-fact">12,3 millions de personnes</span> dans <span class="kb-fact">2,3 millions d'entreprises</span>, principalement des PME. Les textes majeurs incluent la <span class="kb-fact">directive (UE) 2015/2302</span> sur les voyages à forfait et le <span class="kb-fact">règlement (UE) 2024/1028</span> sur la collecte de données relatives aux locations de courte durée. Initiatives phares : <span class="kb-fact">EDEN</span> (destinations d'excellence, lancée en <span class="kb-fact">2007</span>), <span class="kb-fact">DiscoverEU</span> (mobilité des jeunes) et le tableau de bord du tourisme lancé en <span class="kb-fact">2022</span>. La première stratégie de l'UE pour le tourisme a été annoncée en <span class="kb-fact">2025</span> par le commissaire <span class="kb-fact">Apostolos Tzitzikostas</span>, une publication complète étant prévue en <span class="kb-fact">2026</span>.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Transport routier international et cabotage`, body:`
<p><b>Transport routier libéralisé.</b> La politique commune des transports libéralise progressivement le marché international du transport routier de marchandises et de voyageurs. Le cabotage permet à une entreprise de transport d'un État membre de fournir des services de transport national dans un autre État membre. Base juridique : <span class="kb-fact">article 91</span> du traité sur le fonctionnement de l'Union européenne (titre VI).</p><p><b>Jalons clés.</b> Les restrictions quantitatives et autorisations bilatérales sont éliminées au <span class="kb-fact">1er janvier 1993</span> (<span class="kb-fact">règlement CEE n° 881/92</span>). Le cabotage routier est encadré en <span class="kb-fact">octobre 1993</span> (<span class="kb-fact">règlement CEE n° 3118/93</span>). Le <span class="kb-fact">paquet "transports routiers"</span> du <span class="kb-fact">21 octobre 2009</span> harmonise les conditions d'accès à la profession de transporteur et au marché. Le <span class="kb-fact">règlement (UE) 2020/1055</span> modernise ensuite ces règles, notamment sur le cabotage.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Transports routiers : harmonisation de la législation`, body:`
<p><b>Objet.</b> La fiche porte sur l'harmonisation, au sein de l'Union européenne, de la législation des transports routiers, dans les domaines fiscal et technique, administratif et social. Elle repose sur <span class="kb-fact">l'article 91 du TFUE</span>, qui vise à instaurer des règles communes pour construire un marché unique des transports et une concurrence équitable entre opérateurs.</p><p><b>Points clés.</b> Côté fiscal, la <span class="kb-fact">directive Eurovignette</span> (1999, révisée en 2022) organise la tarification des infrastructures routières. Côté technique, le <span class="kb-fact">règlement Euro VII (2024/1257), adopté en 2024</span>, encadre les émissions polluantes des véhicules neufs. Côté social, le <span class="kb-fact">règlement 561/2006</span> fixe les temps de conduite et de repos, avec un taux minimal de contrôle de <span class="kb-fact">3 % des jours de travail des conducteurs depuis 2010</span>, et le tachygraphe numérique enregistre ces données de manière infalsifiable.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Sécurité routière dans l'UE`, body:`
<p><b>Objectif et base juridique</b> La politique de sécurité routière de l'UE s'appuie sur l'<span class="kb-fact">article 91 du traité FUE</span> (transports). La <span class="kb-fact">Commission européenne</span> a lancé un plan d'action stratégique en <span class="kb-fact">mai 2018</span>, et le <span class="kb-fact">Conseil</span> a adopté la <span class="kb-fact">déclaration de La Valette (2017)</span>, fixant l'objectif <span class="kb-fact">Vision Zéro d'ici 2050</span> (quasi-suppression des tués et blessés graves sur les routes).</p><p><b>Chiffres clés</b> Les décès routiers sont passés de <span class="kb-fact">51 400 en 2001</span> à <span class="kb-fact">19 800 en 2021</span>, malgré une hausse de <span class="kb-fact">6 %</span> entre 2020 et 2021. Le système d'appel d'urgence <span class="kb-fact">eCall</span> est opérationnel depuis <span class="kb-fact">2017</span>. Point souvent testé en QCM : l'objectif initial de réduction de <span class="kb-fact">75 %</span> des décès sur 2001-2020 n'a pas été atteint.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Transport ferroviaire`, body:`
<p><b>Politique commune des transports ferroviaires.</b> L'Union construit un espace ferroviaire unique depuis <span class="kb-fact">2001</span>, fondé sur l'article <span class="kb-fact">100, paragraphe 1, du TFUE</span>. Quatre paquets législatifs (trois à partir de 2001, puis un quatrième en <span class="kb-fact">2016</span>) ont progressivement ouvert le secteur à la concurrence et harmonisé les règles techniques, administratives et de sécurité pour assurer l'interopérabilité transfrontalière des trains.</p><p><b>Objectifs Pacte vert et chiffres clés.</b> La stratégie de mobilité durable vise à transférer vers le rail et les voies navigables une part substantielle des <span class="kb-fact">75 %</span> du fret intérieur acheminé par la route, avec pour <span class="kb-fact">2030</span> le triplement du trafic à grande vitesse et pour <span class="kb-fact">2050</span> la majeure partie du transport de passagers à moyenne distance assurée par train. Or la part modale du rail dans le fret est tombée de <span class="kb-fact">18,3 %</span> en 2011 à <span class="kb-fact">17,9 %</span> en 2018. L'<span class="kb-fact">Agence de l'Union européenne pour les chemins de fer, basée à Valenciennes (France)</span>, veille à l'interopérabilité et à la sécurité.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Transports aériens : règles du marché`, body:`
<p><b>Marché unique et cadre juridique.</b> Fondé sur l'<span class="kb-fact">article 100, paragraphe 2, du TFUE</span>, le droit de l'UE a créé un marché unique du transport aérien. Les transporteurs aériens doivent être détenus et effectivement contrôlés par des États membres et/ou leurs ressortissants, avoir leur principal siège d'exploitation dans l'UE, justifier d'une bonne situation financière et de compétences professionnelles attestées garantissant la sécurité.</p><p><b>Concurrence et décarbonation.</b> Le <span class="kb-fact">règlement (UE) 2019/712</span>, en vigueur depuis le <span class="kb-fact">30 mai 2019</span>, préserve des conditions de concurrence équitables face aux pays tiers. L'assistance en escale a été ouverte à la concurrence par la <span class="kb-fact">directive 96/67/CE</span>, et les créneaux horaires sont régis par le <span class="kb-fact">règlement (CEE) n° 95/93</span>. Le paquet <span class="kb-fact">"Ajustement à l'objectif 55"</span> supprime progressivement les quotas gratuits ETS de l'aviation ; depuis 2025, <span class="kb-fact">ReFuelEU Aviation</span> impose une part minimale de 2 % de carburant durable, avec une hausse tous les cinq ans jusqu'à 70 % en 2050.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Transport aérien : sûreté de l'aviation civile`, body:`
<p><b>Cadre juridique et objectifs</b> La sûreté de l'aviation civile relève de la compétence de l'Union pour prévenir les actes d'intervention illicite contre les aéronefs. L'<span class="kb-fact">article 100, paragraphe 2, du traité sur le fonctionnement de l'Union européenne</span> constitue la base juridique. Cette politique s'est renforcée après les <span class="kb-fact">attentats du 11 septembre 2001</span>.</p>
<p><b>Règles et mesures principales</b> Le <span class="kb-fact">règlement (CE) n° 300/2008</span> établit les règles communes applicables à l'ensemble des aéroports. Les mesures obligatoires incluent l'inspection et le filtrage de tous les passagers, bagages et fret. La <span class="kb-fact">directive (UE) 2016/681</span> impose l'enregistrement des données passagers (PNR). Depuis <span class="kb-fact">2014</span>, le <span class="kb-fact">programme ACC3</span> renforce la sûreté du fret en provenance de pays tiers. Chaque <span class="kb-fact">État membre</span> désigne une autorité unique chargée de coordonner et de contrôler l'application des règles de sûreté sur son territoire.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Transport aérien : le ciel unique européen`, body:`
<p><b>Cadre et objectifs</b> Le « ciel unique européen » vise à unifier la gestion du trafic aérien européen, fragmentée entre États membres. L'initiative est lancée en <span class="kb-fact">1999</span>, avec un premier paquet législatif adopté en <span class="kb-fact">2004</span>. Base juridique : <span class="kb-fact">article 100, paragraphe 2, du traité sur le fonctionnement de l'Union européenne (TFUE)</span>. Objectifs à l'horizon 2030-2035, par rapport à 2004 : <span class="kb-fact">tripler la capacité de l'espace aérien</span>, réduire de moitié les coûts de gestion du trafic, décupler la sécurité et réduire de 10 % l'impact environnemental.</p>

<p><b>Acteurs clés</b> <span class="kb-fact">Eurocontrol</span>, organisation civile et militaire paneuropéenne couvrant <span class="kb-fact">41 pays</span>, est désignée gestionnaire du réseau. L'entreprise commune <span class="kb-fact">SESAR</span>, mise en place en <span class="kb-fact">2007</span>, pilote la modernisation technologique. Un règlement sur la mise en œuvre du ciel unique européen a été adopté le <span class="kb-fact">23 octobre 2024</span>.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Sûreté aérienne`, body:`
<p><b>Sûreté de l'aviation civile</b> Ce cadre vise à prévenir les actes de malveillance (terrorisme, intrusion) contre l'aviation civile ; il est distinct de la sécurité technique des vols (safety, fiche 3.4.6). Base juridique : <span class="kb-fact">article 100, paragraphe 2, du TFUE</span>. Le <span class="kb-fact">règlement (CE) n° 300/2008</span> établit les règles et normes communes de sûreté, en remplacement du règlement 2320/2002 adopté après les attentats du 11 septembre 2001. Trois principes clés : responsabilité de l'État hôte pour les vols au départ de son territoire, inspection obligatoire des passagers, du personnel et des bagages, et droit des États membres à des mesures plus strictes.</p>
<p><b>Instruments recents</b> La <span class="kb-fact">directive PNR (UE) 2016/681</span> encadre l'utilisation des données des dossiers passagers. Le <span class="kb-fact">règlement (UE) 2022/421</span> déploie des équipements de détection d'explosifs dans les aéroports de l'UE et actualise les listes d'opérateurs agréés. Depuis <span class="kb-fact">juillet 2014</span>, le programme <span class="kb-fact">ACC3</span> impose le contrôle du fret aérien en provenance de pays tiers. Un accord de contrôle unique de sûreté a été signé avec <span class="kb-fact">Singapour le 6 février 2018</span>, ainsi qu'avec les États-Unis, le Canada et le Monténégro (dates non précisées par la source).</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Réseaux transeuropéens (RTE)`, body:`
<p><b>De quoi s'agit-il</b> Les <span class="kb-fact">réseaux transeuropéens (RTE)</span> visent à relier les infrastructures des États membres dans trois secteurs : transport (<span class="kb-fact">RTE-T</span>), énergie (<span class="kb-fact">RTE-E</span>) et télécommunications. Leur base juridique se trouve aux <span class="kb-fact">articles 170 à 172 et 194 du TFUE</span>. Le RTE-T est structuré en <span class="kb-fact">neuf corridors</span> multimodaux (réseau central et réseau global), réformé en <span class="kb-fact">2013</span> puis révisé en 2021-2023, avec un nouveau règlement adopté le <span class="kb-fact">13 juin 2024</span> (<span class="kb-fact">règlement (UE) 2024/1679</span>).</p><p><b>Volet énergie</b> Le RTE-E, encadré par le <span class="kb-fact">règlement (UE) 2022/869</span> du <span class="kb-fact">30 mai 2022</span>, organise <span class="kb-fact">onze corridors</span> prioritaires pour l'électricité, les énergies renouvelables en mer et l'hydrogène. Point utile pour un QCM : ces réseaux répondent à l'objectif de réduction des émissions du transport, ciblé à <span class="kb-fact">90 % d'ici 2050</span>.</p>`},

{section:"Cohésion, agriculture, pêche et transports", title:`Le financement des réseaux transeuropéens`, body:`
<p><b>Les réseaux transeuropéens (RTE)</b> sont les infrastructures numériques, énergétiques et de transport à grande échelle reliant les États membres. L'Union finance leur développement par le <span class="kb-fact">mécanisme pour l'interconnexion en Europe (MIE)</span>, établi par le <span class="kb-fact">règlement (UE) 2021/1153</span>, sur la base de l'<span class="kb-fact">article 171 du traité sur le fonctionnement de l'Union européenne</span>.</p>

<p>Le MIE soutient les réseaux de <span class="kb-fact">transport, d'énergie et du numérique</span> par diverses formes de financement : cofinancement d'études, garanties de prêts, bonifications d'intérêts (notamment via la Banque européenne d'investissement) et instruments financiers innovants. Les projets doivent avoir une viabilité économique, contribuer aux objectifs des orientations RTE et respecter les critères environnementaux et de concurrence. Pour la période <span class="kb-fact">2021-2027</span>, le MIE consacre <span class="kb-fact">60 % de son budget aux objectifs climatiques</span>. Depuis 2022, le plan REPowerEU a renforcé le financement des infrastructures énergétiques face à la crise géopolitique.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`La culture`, body:`
<p><b>Définition et compétences</b> La culture reste principalement du ressort des États membres. L'Union européenne intervient en soutien, coordination et complémentarité, en promouvant la coopération et en respectant la diversité culturelle et linguistique. L'article <span class="kb-fact">167 du TFUE</span> et les articles <span class="kb-fact">13 et 22 de la Charte des droits fondamentaux</span> posent ce cadre.</p><p><b>Financements et initiatives clés</b> Le programme <span class="kb-fact">Europe Créative (2021-2027) dispose de 2,44 milliards d'euros</span>, en hausse de 36 %. Les <span class="kb-fact">Capitales européennes de la culture</span> (plus de 70 villes depuis 1985) soutiennent des projets culturels ambitieux. La <span class="kb-fact">Boussole culturelle pour l'Europe</span>, présentée le 12 novembre 2025, place la culture au service de la démocratie, de la cohésion et de la compétitivité. Le <span class="kb-fact">nouveau Bauhaus européen</span> (lancé en janvier 2021) associe art, culture, science et technologie pour des espaces de vie durables.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Politique de l'audiovisuel et des médias`, body:`
<p><b>Politique de l'audiovisuel et des médias</b> La politique de l'Union en matière d'audiovisuel et de médias repose sur les <span class="kb-fact">articles 167 et 173 du traité FUE</span> et sur l'<span class="kb-fact">article 11, paragraphe 2, de la Charte des droits fondamentaux</span>. Son instrument principal est la <span class="kb-fact">directive Services de médias audiovisuels (SMA), révisée en 2018</span> : elle impose au moins <span class="kb-fact">30% d'œuvres européennes</span> dans les catalogues de vidéo à la demande, protège les mineurs et limite les communications commerciales à <span class="kb-fact">20% par jour</span>.</p><p>Le <span class="kb-fact">programme Europe créative 2021-2027</span> dispose de <span class="kb-fact">2,44 milliards d'euros</span> pour financer la création audiovisuelle. En 2024, l'Union a adopté un <span class="kb-fact">règlement sur la liberté des médias</span> pour préserver le pluralisme et l'indépendance éditoriale de la presse.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`La formation professionnelle`, body:`
<p><b>Définition et objectifs</b> L'enseignement et la formation professionnels (EFP) préparent les personnes au travail et développent les compétences requises par le marché du travail. Fondée sur l'<span class="kb-fact">article 166 du traité FUE et l'article 14 de la Charte des droits fondamentaux</span>, cette politique facilite l'adaptation aux mutations industrielles, améliore la formation initiale et continue, et favorise la mobilité des apprenants et formateurs entre États membres.</p>

<p><b>Financement et pilotage</b> L'UE soutient l'EFP principalement via le <span class="kb-fact">Fonds social européen plus (FSE+, 99,3 milliards d'euros pour 2021-2027)</span> et le <span class="kb-fact">programme Erasmus+ (26,6 milliards d'euros)</span>. Deux agences décentralisées pilotent cette politique : le <span class="kb-fact">Cedefop, fondé en 1975</span>, et l'<span class="kb-fact">ETF, fondée en 1994</span>. La coopération s'appuie sur le <span class="kb-fact">processus de Copenhague (2002)</span> et la <span class="kb-fact">Déclaration d'Herning (12 septembre 2025)</span>, qui remplace la déclaration d'Osnabrück (2020).</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Éducation`, body:`
<p><b>Éducation</b> L'Union européenne coordonne les politiques éducatives nationales pour favoriser la mobilité, reconnaître les diplômes et promouvoir la coopération entre établissements. La base juridique est l'<span class="kb-fact">article 165 du traité sur le fonctionnement de l'UE</span>, issue du <span class="kb-fact">Traité de Maastricht (1992)</span>.</p><p><b>Piliers et chiffres-clés :</b> <span class="kb-fact">Erasmus+ (2021-2027)</span> dispose de <span class="kb-fact">26,6 milliards d'euros</span> et a mobilisé <span class="kb-fact">1,6 million d'étudiants</span> et 77 000 organisations en 2023. L'UE compte <span class="kb-fact">65 alliances universitaires</span> regroupant plus de 570 établissements. L'objectif 2030 vise moins de <span class="kb-fact">15%</span> de jeunes de 15 ans en maîtrise insuffisante (lecture, mathématiques, sciences). Le <span class="kb-fact">Processus de Bologne</span> unit <span class="kb-fact">49 pays</span> de l'Espace européen de l'enseignement supérieur.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`La jeunesse`, body:`
<p><b>Fondement et objectifs.</b> L'action de l'Union en faveur de la jeunesse repose sur les <span class="kb-fact">articles 6, 165 et 166 du TFUE</span> et sur la <span class="kb-fact">Charte des droits fondamentaux</span> (article 24, droits de l'enfant ; article 32, interdiction du travail des enfants et protection des jeunes au travail). La <span class="kb-fact">stratégie de l'Union en faveur de la jeunesse 2019-2027</span> repose sur trois piliers : Mobiliser, Connecter et Autonomiser.</p><p><b>Programmes phares.</b> <span class="kb-fact">Erasmus+ (2021-2027)</span> consacre plus de <span class="kb-fact">2,5 milliards d'euros</span> aux actions jeunesse. <span class="kb-fact">DiscoverEU</span> permet aux jeunes de <span class="kb-fact">18 ans</span> d'explorer l'Europe avec <span class="kb-fact">700 millions d'euros</span>. Le <span class="kb-fact">Corps européen de solidarité</span> mobilise <span class="kb-fact">1 milliard d'euros</span> pour environ <span class="kb-fact">350 000 jeunes</span>. La <span class="kb-fact">garantie pour la jeunesse</span> existe depuis <span class="kb-fact">2013</span>. Le Parlement organise la <span class="kb-fact">Rencontre des jeunes européens (EYE)</span> tous les deux ans et a lancé le <span class="kb-fact">test jeunesse en janvier 2024</span>.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`La politique linguistique`, body:`
<p><b>La politique linguistique de l'UE</b> promeut le respect de la diversité linguistique et le dialogue interculturel, sous la devise « Unie dans la diversité ». Base juridique : l'article 3 du traité UE et l'article 165 du traité FUE, renforcés par les articles 21-22 de la Charte des droits fondamentaux (non-discrimination fondée sur la langue). Le <span class="kb-fact">Règlement n°1 de 1958</span> définit les <span class="kb-fact">24 langues officielles</span> de l'Union ; chaque citoyen peut écrire à une institution dans une langue officielle et recevoir une réponse dans la même langue.</p>

<p><b>Objectifs et acteurs</b> : l'UE vise un plurilinguisme cible ou chaque citoyen maitrise, en plus de sa langue maternelle, <span class="kb-fact">deux langues supplémentaires</span>, dès la fin du premier cycle du secondaire. La <span class="kb-fact">Journée européenne des langues</span> est célébrée chaque <span class="kb-fact">26 septembre</span> (depuis 2001). Le Parlement européen traduit ses documents dans les 24 langues officielles et permet à chaque député de s'exprimer dans la langue de son choix. L'Union soutient aussi la protection des langues régionales et minoritaires.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Le sport`, body:`
<p><b>Competence et base juridique</b> Le sport est un domaine de compétence de l'Union européenne. L'article <span class="kb-fact">6, point e), du traité sur le fonctionnement de l'Union européenne</span> confère à l'Union une compétence d'appui pour développer la dimension européenne du sport et coordonner les politiques sportives. Le <span class="kb-fact">traité de Lisbonne</span> a formalisé cette compétence spécifique en matière de sport.</p><p><b>Objectifs et réalisations</b> L'Union considère le sport comme un vecteur d'amélioration du bien-être, de résolution de problèmes sociaux et d'effets économiques. Le <span class="kb-fact">plan de travail de l'Union en faveur du sport (2024-2027)</span> privilégie trois domaines : l'intégrité et les valeurs du sport, les dimensions socioéconomique et durable, et la participation à l'activité physique. Le programme <span class="kb-fact">Erasmus+</span> finance des projets sportifs, avec plus de <span class="kb-fact">67 millions d'euros</span> répartis sur <span class="kb-fact">350 projets</span> sélectionnés en 2025. La <span class="kb-fact">Semaine européenne du sport</span> promeut la dimension européenne du sport.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`La politique de communication`, body:`
<p><b>Définition et fondements.</b> Faute de base juridique spécifique dans les traités, la politique de communication de l'Union européenne repose sur l'<span class="kb-fact">article 352 du TFUE</span>. Elle s'appuie aussi sur les principes de la <span class="kb-fact">Charte des droits fondamentaux (articles 11, 41, 42 et 44)</span>, qui garantissent le droit à l'information, le droit d'être entendu, l'accès aux documents et le droit de pétition.</p>

<p><b>Outils et responsabilités.</b> Parmi les instruments : <span class="kb-fact">Europe Direct (24 langues)</span>, l'<span class="kb-fact">Initiative citoyenne européenne</span> (créée par le traité de Lisbonne), le programme <span class="kb-fact">« Citoyens, égalité, droits et valeurs » (règlement 2021/692)</span>, et des panels de citoyens issus de la <span class="kb-fact">Conférence sur l'avenir de l'Europe (2021-2022)</span>. Le <span class="kb-fact">Parlement européen, directement élu</span>, porte la responsabilité centrale de communiquer sur l'action de l'Union. Selon l'<span class="kb-fact">Eurobaromètre 2023, 87 % des citoyens</span> expriment un sentiment d'appartenance à l'Union.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Les citoyens de l'Union et leurs droits`, body:`
<p><b>Fondements</b> La citoyenneté de l'Union, définie par l'<span class="kb-fact">article 20 du traité FUE</span> et consacrée par l'<span class="kb-fact">article 9 du traité UE</span> (<span class="kb-fact">articles 18 à 25 du traité FUE</span>, <span class="kb-fact">articles 39 à 46 de la Charte</span>), s'acquiert automatiquement pour toute personne ayant la nationalité d'un État membre. Elle complète, sans la remplacer, la citoyenneté nationale. Instaurée par le <span class="kb-fact">traité de Maastricht (1992)</span>, elle a été renforcée par le traité de Lisbonne, <span class="kb-fact">entré en vigueur en 2009</span>. <span class="kb-fact">2023</span> a marqué ses 30 ans.</p><p><b>Droits</b> Elle confère notamment : libre circulation et séjour dans les États membres, droit de vote et d'éligibilité aux élections européennes et municipales, protection diplomatique dans les pays tiers, droit de pétition, accès aux documents des institutions, et correspondance avec l'Union dans l'une des <span class="kb-fact">24 langues officielles</span>. L'<span class="kb-fact">initiative citoyenne européenne</span> (<span class="kb-fact">article 11, paragraphe 4, du traité UE</span>) permet à <span class="kb-fact">au moins un million de citoyens</span>, d'un nombre significatif d'États membres, d'inviter la Commission à légiférer. Point souvent testé en QCM : elle n'impose aucun devoir formel.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`La protection des valeurs consacrées à l'article 2 du traité UE dans l'Union`, body:`
<p><b>Valeurs fondamentales.</b> L'<span class="kb-fact">article 2 du traité UE</span> énonce les valeurs fondamentales de l'Union européenne : respect de la dignité humaine, liberté, démocratie, égalité, état de droit, respect des droits de l'homme et droits des personnes appartenant à des minorités. L'<span class="kb-fact">article 7 du traité UE</span> établit un mécanisme permettant de constater et de sanctionner les violations graves et persistantes de ces valeurs par un État membre.</p><p><b>Mécanismes de protection.</b> La protection s'appuie sur la <span class="kb-fact">Charte des droits fondamentaux</span> proclamée solennellement à <span class="kb-fact">Nice en 2000</span>, entrée en vigueur le <span class="kb-fact">1er décembre 2009</span> avec le traité de Lisbonne. La Charte couvre six domaines : dignité, libertés, égalité, solidarité, citoyenneté et justice. L'article 7 prévoit une phase préventive (risque clair de violation) et une phase de sanction (violation grave et persistante). La procédure préventive a été déclenchée pour la première fois le <span class="kb-fact">20 décembre 2017</span> à l'encontre de la Pologne.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`La libre circulation des personnes`, body:`
<p><b>La libre circulation des personnes</b> est un pilier de la citoyenneté européenne. Fondée sur l'<span class="kb-fact">article 21 du traité FUE</span> (droit issu du <span class="kb-fact">traité de Maastricht, 1992</span>, qui a créé la citoyenneté de l'Union), elle est encadrée par la <span class="kb-fact">directive 2004/38/CE</span> et s'exerce dans l'espace Schengen.</p><p>L'espace Schengen compte <span class="kb-fact">29 pays</span> : <span class="kb-fact">25 États membres de l'UE</span> (l'Irlande et le Danemark n'y participent pas pleinement), plus la Norvège, l'Islande, la Suisse et le Liechtenstein. La Bulgarie et la Roumanie ont rejoint pleinement l'espace le <span class="kb-fact">1er janvier 2025</span>. Séjour : moins de <span class="kb-fact">3 mois</span> avec une pièce d'identité valide ; au-delà, ressources suffisantes et assurance maladie ; séjour permanent après <span class="kb-fact">5 ans</span> ininterrompus.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Le droit de pétition`, body:`
<p><b>Définition et base juridique.</b> Le droit de pétition, établi par les articles 20, 24 et 227 du traité FUE et l'article 44 de la Charte des droits fondamentaux, permet aux <span class="kb-fact">citoyens de l'Union et aux personnes physiques ou morales résidant dans un État membre</span> de présenter des pétitions au Parlement européen sur des sujets relevant des compétences de l'Union. La pétition doit concerner directement ses auteurs.</p><p><b>Procédure et rôle de la Commission des pétitions.</b> La <span class="kb-fact">Commission des pétitions</span> du Parlement reçoit les pétitions via le portail en ligne (créé en <span class="kb-fact">2014</span>), vérifie leur recevabilité, et peut demander une enquête à la Commission européenne, les transmettre à d'autres commissions, ou engager des auditions. Le Parlement a reçu <span class="kb-fact">2 971 pétitions en 2025</span>, les principaux domaines couvrant l'environnement, la santé et les droits fondamentaux.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Initiative citoyenne européenne`, body:`
<p><b>Initiative citoyenne européenne</b></p><p>L'Initiative citoyenne européenne (ICE) est un instrument de démocratie participative permettant à <span class="kb-fact">un million de citoyens européens</span> résidant dans au minimum <span class="kb-fact">un quart des États membres</span> d'inviter la Commission à présenter une proposition législative.</p><p><b>Base juridique et mise en œuvre</b></p><p>L'ICE repose sur l'article 11, paragraphe 4, du traité UE et l'article 24, premier alinéa, du traité FUE. Le règlement <span class="kb-fact">(UE) 2019/788 s'applique depuis le 1er janvier 2020</span>, remplaçant le règlement 211/2011. La procédure comprend : enregistrement auprès de la Commission, collecte des signatures sur <span class="kb-fact">douze mois</span>, vérification par les autorités nationales, et réponse de la Commission dans un délai de <span class="kb-fact">six mois</span>.</p><p><b>Point clé pour les examens</b></p><p>L'ICE se distingue du droit de pétition : l'ICE vise l'élaboration d'un acte juridique adressé à la Commission, tandis que les pétitions sont adressées au Parlement européen. À ce jour, <span class="kb-fact">treize initiatives</span> ont atteint le nombre de signatures requis.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Un espace de liberté, de sécurité et de justice : aspects généraux`, body:`
<p><b>Cadre et fondement</b> L'ELSJ (Espace de Liberté, de Sécurité et de Justice) est un objectif principal de l'Union européenne. Sa base juridique repose sur l'<span class="kb-fact">article 3, paragraphe 2 du traité UE</span> et le <span class="kb-fact">titre V (articles 67 à 89) du traité FUE</span>. Les traités y définissent notamment l'absence de contrôles aux frontières intérieures, une politique commune d'asile et d'immigration, un niveau élevé de sécurité, et un accès facilité à la justice.</p>

<p><b>Transformations depuis 2009</b> Le <span class="kb-fact">traité de Lisbonne (2009)</span> a aboli la structure en piliers et généralisé la <span class="kb-fact">procédure législative ordinaire</span>, faisant du Parlement européen un véritable <span class="kb-fact">colégislateur</span>. Plusieurs agences ont été créées, dont <span class="kb-fact">Europol, Eurojust, Frontex et la FRA</span> (Agence des droits fondamentaux). Deux États bénéficient d'exceptions : le <span class="kb-fact">Danemark</span> (clause de non-participation au titre V) et l'<span class="kb-fact">Irlande</span> (participation sélective, environ 70 % en coopération policière et 25 % en asile et migration).</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Politique d'asile`, body:`
<p><b>Politique d'asile de l'Union</b> La politique d'asile de l'Union vise à accorder une protection internationale appropriée aux ressortissants de pays tiers dans le besoin, tout en assurant le respect du <span class="kb-fact">principe de non-refoulement</span> établi par le droit international. Les <span class="kb-fact">articles 2, 78 et 80 du traité FUE</span> et l'<span class="kb-fact">article 18 de la Charte des droits fondamentaux</span> fondent cette politique, qui repose sur la <span class="kb-fact">Convention de Genève du 28 juillet 1951</span> relative au statut des réfugiés. L'Union développe un régime d'asile européen commun (RAEC) comportant statut uniforme, procédures communes et critères de responsabilité des États membres.</p><p><b>Évolutions récentes</b> Après l'entrée en vigueur du <span class="kb-fact">traité de Lisbonne en décembre 2009</span>, qui a renforcé le rôle du Parlement, <span class="kb-fact">dix instruments du pacte sur la migration et l'asile ont été adoptés le 14 mai 2024</span>. Le <span class="kb-fact">Fonds Asile, Migration et Intégration</span> dispose de <span class="kb-fact">9,9 milliards d'euros (2021-2027)</span>. La protection temporaire aux personnes fuyant l'Ukraine court jusqu'en <span class="kb-fact">mars 2027</span>.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Politique d'immigration`, body:`
<p><b>Fondement et objectif</b> La politique d'immigration de l'Union repose sur les articles <span class="kb-fact">79 et 80 du traité sur le fonctionnement de l'Union européenne (TFUE)</span>. Elle vise une approche équilibrée de gestion de la migration légale et de lutte contre l'immigration clandestine, fondée sur le principe de solidarité entre États membres.</p>
<p><b>Évolutions majeures</b> Le <span class="kb-fact">nouveau pacte sur la migration et l'asile, adopté en mai 2024</span>, constitue la réforme la plus importante depuis des années. Il harmonise les normes d'asile, établit des procédures claires et crée un mécanisme de solidarité. Les nouvelles règles s'appliqueront à partir de <span class="kb-fact">mi-2026</span>. En <span class="kb-fact">janvier 2026</span>, la Commission a adopté la première stratégie de l'Union en matière de visas pour renforcer les contrôles de sécurité et faciliter l'accès des talents. L'Union a conclu <span class="kb-fact">18 accords de réadmission</span> avec des pays tiers pour organiser les retours des migrants en situation irrégulière.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Gestion des frontières extérieures`, body:`
<p><b>Politique commune de contrôle aux frontières extérieures.</b> L'Union européenne gère ses frontières extérieures pour garantir la libre circulation dans l'espace Schengen, qui regroupe <span class="kb-fact">29 pays européens</span>. La base juridique repose sur <span class="kb-fact">l'article 3(2) du traité UE</span> et <span class="kb-fact">les articles 67 et 77 du traité FUE</span>. L'accord de Schengen a été signé le <span class="kb-fact">14 juin 1985</span>.</p><p><b>Systèmes d'information et outils clés.</b> Le code frontières Schengen a été réformé par le <span class="kb-fact">règlement (UE) 2024/1717</span>, entré en vigueur le <span class="kb-fact">10 juillet 2024</span>. Le <span class="kb-fact">système d'information Schengen (SIS)</span> contient plus de <span class="kb-fact">93 millions de signalements</span>. L'<span class="kb-fact">agence Frontex</span> dispose d'un contingent permanent prévu de <span class="kb-fact">10 000 gardes-frontières</span>. L'<span class="kb-fact">ETIAS</span> doit être lancé au <span class="kb-fact">dernier trimestre 2026</span>. Le budget de l'instrument IGFV pour 2021-2027 s'élève à <span class="kb-fact">7,92 milliards d'euros</span>.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`La coopération judiciaire en matière civile`, body:`
<p><b>Définition et objectifs</b> La coopération judiciaire en matière civile facilite le règlement des litiges transfrontaliers en harmonisant les règles de compétence, de droit applicable et de reconnaissance des décisions. Fondée sur l'<span class="kb-fact">article 81 du traité sur le fonctionnement de l'Union européenne</span>, elle vise la sécurité juridique, l'accès à la justice, la simplification des instruments de coopération et la formation des magistrats. Le Parlement applique la procédure législative ordinaire, sauf en droit de la famille ou <span class="kb-fact">le Conseil statue à l'unanimité</span> apres simple consultation du Parlement.</p>

<p><b>Instruments clés</b> Le <span class="kb-fact">règlement Bruxelles I bis (UE n°1215/2012)</span> régit la compétence et la reconnaissance en matière civile et commerciale. Le <span class="kb-fact">règlement Bruxelles II ter (UE 2019/1111)</span> couvre les litiges matrimoniaux, la responsabilité parentale et l'enlèvement d'enfants. L'<span class="kb-fact">Union est membre de la Conférence de La Haye de droit international privé depuis 2007</span>, qui compte <span class="kb-fact">91 membres</span> (90 États plus l'UE). Des procédures simplifiées (petits litiges, injonction de payer) facilitent l'accès à la justice transfrontalière.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Coopération judiciaire en matière pénale`, body:`
<p><b>Coopération judiciaire en matière pénale</b> : la coopération au sein de l'Union repose sur le principe de <span class="kb-fact">reconnaissance mutuelle des jugements et décisions judiciaires</span> entre États membres, complété par le rapprochement de leurs législations. Elle est fondée sur les <span class="kb-fact">articles 82 à 86 du traité FUE</span> et répond à la menace de la criminalité transfrontière facilitée par l'abolition des contrôles aux frontières internes.</p><p>Deux organes pilotent cette coopération : <span class="kb-fact">Eurojust</span>, basée à La Haye, coordonne enquêtes et poursuites entre autorités nationales ; le <span class="kb-fact">Parquet européen</span>, entré en fonction le <span class="kb-fact">1er juin 2021</span> et basé à Luxembourg, enquête sur les infractions portant atteinte au budget de l'Union. <span class="kb-fact">Vingt-quatre États membres</span> y participent. Fin 2024, il menait <span class="kb-fact">2 666 enquêtes</span> pour un préjudice total estimé à <span class="kb-fact">24,8 milliards d'euros</span>.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`Coopération policière`, body:`
<p><b>Coopération policière</b> Cadre de collaboration entre les services répressifs des États membres pour construire un espace de liberté, de sécurité et de justice. Base juridique : <span class="kb-fact">articles 33, 87, 88 et 89 du traité sur le fonctionnement de l'Union européenne (TFUE)</span>. La coopération débute en <span class="kb-fact">1976</span> avec le groupe <span class="kb-fact">TREVI</span>, puis se concrétise avec la <span class="kb-fact">convention Europol signée le 26 juillet 1995</span> et des activités officielles à partir du <span class="kb-fact">1er juillet 1999</span>.</p><p><b>Europol et contrôle</b> <span class="kb-fact">Europol</span>, agence de l'Union basée à <span class="kb-fact">La Haye</span>, coordonne les États membres contre le terrorisme, la cybercriminalité, la criminalité organisée, le trafic de drogue, le blanchiment d'argent et la traité des êtres humains. <span class="kb-fact">Le Parlement européen</span>, avec les parlements nationaux, exerce un contrôle politique via un groupe de contrôle parlementaire conjoint, prévu à l'article 88 du TFUE.</p>`},

{section:"Citoyens, culture, justice et libertés", title:`La protection des données à caractère personnel`, body:`
<p><b>Droits fondamentaux et base juridique</b> La protection des données à caractère personnel et le respect de la vie privée constituent des droits fondamentaux juridiquement contraignants de l'Union européenne, énoncés aux <span class="kb-fact">articles 7 et 8 de la Charte des droits fondamentaux</span>. La base juridique repose sur l'<span class="kb-fact">article 16 du traité sur le fonctionnement de l'Union européenne (traité FUE)</span>.</p>

<p><b>Cadre réglementaire principal</b> Le <span class="kb-fact">Règlement général sur la protection des données (RGPD), règlement (UE) 2016/679</span>, est entré en vigueur en <span class="kb-fact">mai 2018</span>, en remplacement de la directive 95/46/CE. Il protège tous les citoyens européens contre les violations de la vie privée. Les citoyens bénéficient du droit à un <span class="kb-fact">consentement explicite</span>, du <span class="kb-fact">droit à l'oubli</span>, du droit de transférer leurs données et d'être informés en cas de violation. Le <span class="kb-fact">Contrôleur européen de la protection des données (CEPD)</span> et le <span class="kb-fact">Comité européen de la protection des données</span> veillent au respect de ces droits.</p>`},

{section:"Action extérieure de l'Union", title:`Politique étrangère et de sécurité commune (PESC)`, body:`
<p><b>Politique étrangère et de sécurité commune (PESC)</b> Cadre d'action de l'Union pour sa politique étrangère, établi par traité en <span class="kb-fact">1993</span> et régi par les <span class="kb-fact">articles 21 à 46 du traité sur l'Union européenne</span>. La PESC poursuit la paix, la sécurité et la promotion de la démocratie.</p>

<p><b>Institutions et décisions</b> Le <span class="kb-fact">Conseil des affaires étrangères (CAE)</span> décide des actions. <span class="kb-fact">Les décisions en PESC sont adoptées à l'unanimité</span>, requérant l'accord de tous les États membres. <span class="kb-fact">Kaja Kallas</span> préside en tant que haute représentante depuis <span class="kb-fact">décembre 2024</span>, pour un mandat courant jusqu'en 2029. Face à l'invasion russe de l'Ukraine et à la concurrence géopolitique accrue, l'UE renforce son engagement dans la sécurité collective et le multilatéralisme.</p>`},

{section:"Action extérieure de l'Union", title:`La politique de sécurité et de défense commune`, body:`
<p><b>Définition et cadre</b> La politique de sécurité et de défense commune (PSDC), introduite par le <span class="kb-fact">traité de Lisbonne en 2009</span>, est le principal instrument par lequel les États membres développent une culture stratégique européenne et coopèrent pour résoudre les conflits, protéger l'Union et renforcer la paix internationale. Elle fait partie intégrante de la politique étrangère et de sécurité commune (PESC).</p><p><b>Gouvernance et instruments</b> Les orientations politiques sont définies par le Conseil européen, avec décisions à l'unanimité du Conseil de l'UE. Le vice-président de la Commission/haut représentant pour les affaires étrangères coordonne la PSDC et préside le Conseil des affaires étrangères. L'<span class="kb-fact">Agence européenne de défense, fondée en 2004</span>, aide les forces armées à collaborer. La coopération structurée permanente compte <span class="kb-fact">26 des 27 États membres</span> (Malte exclue pour raisons constitutionnelles liées à sa neutralité) et gère <span class="kb-fact">74 projets CSP</span> actuels.</p><p><b>Activités</b> <span class="kb-fact">21 missions et opérations actives</span> mobilisent environ 4 000 agents civils et militaires, notamment la mission d'assistance militaire en soutien à l'Ukraine (EUMAM Ukraine, lancée en novembre 2022). La <span class="kb-fact">boussole stratégique, adoptée en 2022</span>, renforce la politique jusqu'à 2030 avec un objectif de capacité de déploiement rapide de 5 000 soldats.</p>`},

{section:"Action extérieure de l'Union", title:`L'Union européenne et ses partenaires commerciaux`, body:`
<p><b>Compétences et cadre juridique</b> L'Union dispose de la <span class="kb-fact">compétence exclusive en matière de politique commerciale commune</span> (article 3 du TFUE). Le <span class="kb-fact">traité de Lisbonne (2009)</span> a érigé le Parlement en colégislateur, aux côtés du Conseil, pour les questions commerciales et d'investissement. <span class="kb-fact">L'approbation du Parlement est requise</span> pour conclure tout accord commercial international (article 218).</p><p><b>Position et partenaires</b> L'Union est la <span class="kb-fact">première puissance commerciale mondiale</span> avec <span class="kb-fact">15,8 % du volume total des échanges</span> de biens et services. Elle est le <span class="kb-fact">premier prestataire de services</span> (<span class="kb-fact">22,8 %</span> du total mondial) et <span class="kb-fact">premier exportateur de produits manufacturés</span>. Ses principaux partenaires commerciaux sont les <span class="kb-fact">États-Unis (20,6 % des exportations en 2024)</span>, le Royaume-Uni et la Chine. L'Union a négocié <span class="kb-fact">plus de 40 accords de libre-échange</span> (Japon, Singapour, Viet Nam, Nouvelle-Zélande, etc.) et est le <span class="kb-fact">premier investisseur mondial</span>, avec <span class="kb-fact">32,67 % du stock sortant en 2023</span>.</p>`},

{section:"Action extérieure de l'Union", title:`L'Union européenne et l'Organisation mondiale du commerce`, body:`
<p><b>Rôle et fonctions</b> L'Organisation mondiale du commerce (OMC), créée en <span class="kb-fact">1995</span> en remplacement du GATT, régule le commerce international multilatéral. Elle exerce trois fonctions principales : faciliter les <span class="kb-fact">négociations commerciales multilatérales</span>, superviser l'application des politiques commerciales des États membres, et résoudre les <span class="kb-fact">différends commerciaux</span> via son organe de règlement des différends.</p><p><b>Position de l'Union européenne</b> L'Union représente <span class="kb-fact">27 États membres</span> à l'OMC, où elle agit comme acteur unique représentée par la Commission. Depuis le <span class="kb-fact">traité de Lisbonne (2009)</span>, le Parlement européen est colégislateur pour l'approbation des accords commerciaux. L'Union a participé à <span class="kb-fact">212 affaires</span> devant l'organe de règlement des différends depuis la création de l'OMC.</p>`},

{section:"Action extérieure de l'Union", title:`Les régimes commerciaux applicables aux pays en développement`, body:`
<p><b>Définition et instruments.</b> L'Union européenne utilise plusieurs régimes commerciaux préférentiels pour soutenir les pays en développement. Le Système généralisé de préférences (SGP) offre une réduction ou suppression de tarifs douaniers ; le SGP standard s'applique à environ <span class="kb-fact">66 % des lignes tarifaires</span>, tandis que le SGP+ et l'initiative <span class="kb-fact">« Tout sauf les armes » (EBA)</span> offrent des conditions renforcées, respectivement aux pays vulnérables et aux pays les moins avancés.</p><p><b>Accords de partenariat et institutions.</b> Les Accords de partenariat économique (APE) remplacent progressivement les anciennes préférences unilatérales : <span class="kb-fact">8 APE</span> sont conclus avec <span class="kb-fact">33 pays</span> d'Afrique, des Caraïbes et du Pacifique. Le <span class="kb-fact">Parlement européen</span>, colégislateur avec le Conseil, définit les règles du SGP et doit approuver tous les APE. Depuis la réforme de <span class="kb-fact">2012</span>, la Commission européenne recentre cette politique sur les pays qui en ont le plus besoin, en articulant commerce et développement durable.</p>`},

{section:"Action extérieure de l'Union", title:`Aperçu général de la politique de développement`, body:`
<p><b>Politique de développement de l'UE</b> La politique de développement de l'UE poursuit six objectifs principaux : réduire et éradiquer la pauvreté, favoriser un développement durable, promouvoir les droits de l'homme et la démocratie, parvenir à l'égalité de genre, soutenir la paix et la stabilité, et répondre aux défis climatiques. L'<span class="kb-fact">Union européenne et ses États membres constituent le premier donateur mondial d'aide publique au développement</span>, avec une contribution de <span class="kb-fact">88,7 milliards d'euros en 2024</span>.</p>

<p><b>Cadre juridique et financement</b> La politique repose sur l'<span class="kb-fact">article 21 du traité UE et les articles 208 à 211 du traité FUE</span>. L'<span class="kb-fact">IVCDCI-L'Europe dans le monde</span>, instrument financier principal applicable depuis <span class="kb-fact">janvier 2021</span>, dispose d'un budget total de <span class="kb-fact">79,5 milliards d'euros pour 2021-2027</span>. L'Union s'est engagée à consacrer <span class="kb-fact">0,7 % de son RNB à l'aide au développement à l'horizon 2030</span>. L'<span class="kb-fact">accord de Samoa</span>, appliqué provisoirement depuis <span class="kb-fact">janvier 2024</span>, remplace l'accord de Cotonou.</p>`},

{section:"Action extérieure de l'Union", title:`L'aide humanitaire`, body:`
<p><b>Objet et base juridique</b> L'Union européenne fournit une aide humanitaire mondiale en réponse aux catastrophes naturelles ou d'origine humaine. Cette politique repose sur <span class="kb-fact">l'article 21 du traité UE</span> (principes de l'action extérieure) et <span class="kb-fact">l'article 214 du traité FUE</span> (aide humanitaire), qui la place sous la procédure législative ordinaire, le Parlement et le Conseil agissant comme colégislateurs.</p><p><b>Structure et priorités</b> Elle est mise en oeuvre par <span class="kb-fact">la DG ECHO</span>, dirigée par la commissaire <span class="kb-fact">Hadja Lahbib</span>, chargée de l'état de préparation et de la gestion des crises. La DG ECHO déploie <span class="kb-fact">1,9 milliard d'euros en 2026</span> (soit <span class="kb-fact">11,6 milliards d'euros sur 2021-2027</span>) via <span class="kb-fact">plus de 200 partenaires</span>. L'aide suit quatre principes : humanité, neutralité, impartialité, indépendance, et cible l'alimentation, la santé, les abris, l'eau et l'assainissement, l'éducation en urgence, ainsi que la résilience face aux catastrophes et l'aide aux réfugiés et déplacés.</p>`},

{section:"Action extérieure de l'Union", title:`Droits de l'homme dans l'Union européenne`, body:`
<p><b>Fondements</b> L'Union européenne fonde son action extérieure sur le respect des droits de l'homme via les <span class="kb-fact">articles 2, 3, 6 et 21</span> du <span class="kb-fact">traité UE</span> et l'article <span class="kb-fact">205</span> du <span class="kb-fact">traité FUE</span>, qui reconnaissent la <span class="kb-fact">Charte des droits fondamentaux</span> et exigent l'adhésion à la <span class="kb-fact">Convention européenne des droits de l'homme</span>. Le <span class="kb-fact">plan d'action 2020-2027</span>, adopté par le Conseil en <span class="kb-fact">novembre 2020</span>, structure la politique en cinq priorités, tandis que le programme <span class="kb-fact">Droits de l'homme et démocratie</span> dispose de <span class="kb-fact">1,511 milliard d'euros</span> pour 2021-2027 et qu'un régime mondial de sanctions créé en <span class="kb-fact">décembre 2020</span> visait, fin <span class="kb-fact">2025</span>, <span class="kb-fact">135 personnes</span> et <span class="kb-fact">37 entités</span>.</p><p><b>Rôle du Parlement</b> Le Parlement européen doit approuver, en vertu des <span class="kb-fact">articles 207 et 218</span> du <span class="kb-fact">traité FUE</span>, la plupart des accords internationaux et peut les rejeter pour motifs de droits humains, comme le protocole textile avec l'<span class="kb-fact">Ouzbékistan</span> bloqué en <span class="kb-fact">2011</span>. Sa <span class="kb-fact">sous-commission des droits de l'homme</span>, rattachée à la commission des affaires étrangères, suit les dossiers au quotidien, et l'institution décerne chaque année le <span class="kb-fact">prix Sakharov</span>, attribué en <span class="kb-fact">2025</span> à <span class="kb-fact">Andrzej Poczobut</span> et <span class="kb-fact">Mzia Amaglobeli</span>.</p>`},

{section:"Action extérieure de l'Union", title:`Promotion de la démocratie et observation des élections`, body:`
<p><b>De quoi s'agit-il</b> La promotion de la démocratie et l'observation des élections constituent un axe majeur de l'action extérieure de l'Union européenne. Fondée sur les articles 2 et 21 du traité UE et l'article 205 du traité FUE, cette politique repose sur la Déclaration universelle des droits de l'homme et les normes internationales en matière de démocratie. L'observation des élections est l'instrument central de l'UE pour soutenir les évolutions démocratiques dans les pays tiers et promouvoir les droits de l'homme.</p>

<p><b>Instruments et acteurs</b> L'UE dispose de deux principaux instruments financiers : <span class="kb-fact">l'IVCDCI – Europe dans le monde</span> et <span class="kb-fact">l'IAP III</span> (2021-2027). Le <span class="kb-fact">Fonds européen pour la démocratie</span>, créé en <span class="kb-fact">2013</span>, soutient les acteurs politiques et de la société civile favorisant le changement démocratique. En <span class="kb-fact">décembre 2021</span>, l'Union a lancé l'initiative <span class="kb-fact">Team Europe Democracy</span>. Le Parlement européen, seule institution directement élue, adopte chaque année une résolution sur les droits de l'homme et la démocratie, envoie des délégations d'observation électorale et attribue le <span class="kb-fact">Prix Sakharov</span> aux défenseurs de la liberté.</p>`},

{section:"Action extérieure de l'Union", title:`L'élargissement de l'Union`, body:`
<p><b>L'élargissement de l'Union</b> est la procédure par laquelle un État européen devient membre de l'UE. L'<span class="kb-fact">article 49 du traité UE</span> fixe les conditions de candidature et exige l'approbation du Parlement européen pour toute adhésion. L'État candidat dépose sa demande auprès du Conseil, qui consulte la Commission ; le statut de candidat est ensuite accordé par le Conseil européen.</p><p>L'adhésion repose sur les <span class="kb-fact">critères de Copenhague</span>, définis en <span class="kb-fact">1993</span> : stabilité institutionnelle et démocratie, économie de marché viable, capacité à assumer l'acquis communautaire. Les négociations portent sur plus de <span class="kb-fact">30 chapitres</span>. Depuis les six membres fondateurs de <span class="kb-fact">1958</span>, sept élargissements successifs, le dernier avec la <span class="kb-fact">Croatie en 2013</span>, ont porté l'Union à 28 États ; depuis le retrait du Royaume-Uni en <span class="kb-fact">2020</span>, elle compte <span class="kb-fact">27 États membres</span>.</p>`},

{section:"Action extérieure de l'Union", title:`L'Espace économique européen (EEE), la Suisse et le Nord`, body:`
<p><b>Définition et portée</b> L'Espace économique européen (EEE) a été signé en <span class="kb-fact">1992</span> et est entré en vigueur le <span class="kb-fact">1er janvier 1994</span>. Il étend le marché intérieur de l'Union aux trois pays de l'Association européenne de libre-échange (AELE) : la Norvège, l'Islande et le Liechtenstein. Fondé sur l'<span class="kb-fact">article 217 du traité sur le fonctionnement de l'Union européenne</span> (accords d'association), il incorpore les quatre libertés (marchandises, personnes, services, capitaux) et couvre aussi la concurrence, le transport, l'énergie et les politiques sociales. Il exclut la politique agricole commune et la pêche, l'union douanière, la politique commerciale commune, la politique étrangère et de sécurité commune, et l'Union économique et monétaire.</p>
<p><b>Institutions et cas suisse</b> L'EEE fonctionne à deux piliers : le Conseil de l'EEE et un Comité mixte, avec un Comité parlementaire mixte. La Suisse, membre de l'AELE, a signé l'accord EEE en 1992 mais l'a rejeté par référendum la même année ; elle gère ses relations avec l'UE via <span class="kb-fact">plus de 120 accords bilatéraux</span>, dont les Accords bilatéraux I signés en <span class="kb-fact">1999</span>.</p>`},

{section:"Action extérieure de l'Union", title:`La politique européenne de voisinage (PEV)`, body:`
<p><b>Définition et objectifs</b> La politique européenne de voisinage (PEV) s'applique à <span class="kb-fact">16 pays partenaires</span> situés en Méditerranée et en Europe de l'Est (Algérie, Égypte, Ukraine, Géorgie, Jordanie, Liban, Libye, Maroc, Moldavie, Palestine, Syrie, Tunisie, Arménie, Azerbaïdjan, Biélorussie, Israël). Elle vise à renforcer prospérité, stabilité et sécurité dans les régions voisines de l'UE autour de valeurs communes : démocratie, état de droit, droits humains.</p><p><b>Base juridique et instruments</b> Fondée sur l'<span class="kb-fact">article 8 du traité UE</span>, la PEV fonctionne par accords bilatéraux d'association, plans d'action, accords de libre-échange approfondi et partenariats de mobilité. Le financement repose sur l'instrument IVCDCI « Europe dans le monde », doté de <span class="kb-fact">79,5 milliards d'euros (2021-2027)</span> pour l'ensemble de son champ d'action. Elle comprend deux dimensions régionales : le <span class="kb-fact">Partenariat oriental (inauguré en 2009)</span> pour six pays d'Europe de l'Est, et l'<span class="kb-fact">Union pour la Méditerranée (lancée en 2008)</span>.</p>`},

{section:"Action extérieure de l'Union", title:`Trois voisins du partenariat oriental dans le Caucase du Sud`, body:`
<p><b>Partenariat oriental et cadre institutionnel.</b> La politique de partenariat oriental de l'Union, lancée en <span class="kb-fact">2009</span>, couvre six États de l'ancienne Union soviétique, dont la Géorgie, l'Arménie et l'Azerbaïdjan au Caucase du Sud. Le Parlement européen suit ces relations via sa délégation pour le Caucase du Sud (<span class="kb-fact">DSCA</span>), avec une commission d'association parlementaire pour la Géorgie, un comité parlementaire de partenariat pour l'Arménie et une commission de coopération parlementaire pour l'Azerbaïdjan.</p><p><b>Trois pays, trois trajectoires.</b> La Géorgie a obtenu le statut de <span class="kb-fact">candidate à l'adhésion en décembre 2023</span>, avec un <span class="kb-fact">accord d'association en vigueur depuis juillet 2016</span>; le processus d'adhésion s'est interrompu en <span class="kb-fact">2024</span> et l'aide UE (environ <span class="kb-fact">85 millions d'euros par an</span>) a été gelée. L'Arménie, liée par un <span class="kb-fact">accord de partenariat global et renforcé signé en novembre 2017</span>, bénéficie d'un <span class="kb-fact">plan de résilience de 270 millions d'euros pour 2024-2027</span> et a paraphé un <span class="kb-fact">traité de paix avec l'Azerbaïdjan en août 2025</span>. L'Azerbaïdjan, partenaire énergétique majeur, réalise environ <span class="kb-fact">41 % de ses échanges commerciaux avec l'UE en 2024</span> et fournit du gaz via le <span class="kb-fact">corridor gazier sud-européen, opérationnel depuis décembre 2020</span>.</p>`},

{section:"Action extérieure de l'Union", title:`Les partenaires du Sud`, body:`
<p><b>Politique européenne de voisinage (PEV), partenaires du Sud</b> La PEV cible <span class="kb-fact">dix pays partenaires du Sud</span> : Algérie, Égypte, Israël, Jordanie, Liban, Libye, Maroc, Palestine, Syrie et Tunisie. Elle prévoit une coopération bilatérale, complétée par une coopération régionale via <span class="kb-fact">l'Union pour la Méditerranée (UpM), créée en 2008</span>, qui réunit les États membres de l'UE et quinze pays méditerranéens.</p><p><b>Base juridique et instruments</b> La PEV s'appuie sur <span class="kb-fact">l'article 8 du TUE</span>, le <span class="kb-fact">titre V du TUE</span> et les <span class="kb-fact">articles 206, 207 et 216 à 219 du TFUE</span>. Elle se traduit par des accords d'association bilatéraux (conclus avec huit partenaires) et se finance via <span class="kb-fact">l'IVCDCI (2021-2027)</span>, qui a remplacé l'IEV (2014-2020). Le <span class="kb-fact">nouveau programme pour la Méditerranée (9 février 2021)</span> structure la coopération autour de cinq domaines : développement humain, résilience économique, paix et sécurité, migration et transition écologique.</p>`},

{section:"Action extérieure de l'Union", title:`Trois voisins du partenariat oriental : l'Ukraine, la Moldavie et la Biélorussie`, body:`
<p><b>Partenariat oriental.</b> Établi en <span class="kb-fact">2009</span>, il lie l'Union à six États, dont l'Ukraine, la Moldavie et la Biélorussie. L'Ukraine et la Moldavie ont chacune signé un accord d'association en <span class="kb-fact">2014</span> (entrée en vigueur complète en <span class="kb-fact">septembre 2017</span> pour l'Ukraine, signature le <span class="kb-fact">27 juin 2014</span> pour la Moldavie). Elles ont demandé leur adhésion le <span class="kb-fact">28 février 2022</span> et le <span class="kb-fact">3 mars 2022</span>, obtenant le statut de pays candidat dès le <span class="kb-fact">23 juin 2022</span>.</p><p><b>Soutiens financiers.</b> Depuis février 2022, l'Union a fourni <span class="kb-fact">193,3 milliards d'euros</span> à l'Ukraine, dont <span class="kb-fact">69,3 milliards</span> en aide militaire. La Moldavie reçoit <span class="kb-fact">1,2 milliard d'euros</span> de subventions depuis 2021. En Biélorussie, après l'élection présidentielle jugée frauduleuse du <span class="kb-fact">9 août 2020</span>, l'Union soutient les forces démocratiques à hauteur d'environ <span class="kb-fact">170 millions d'euros</span>.</p>`},

{section:"Action extérieure de l'Union", title:`Pacifique`, body:`
<p><b>Relations UE-Pacifique</b> L'Union est le deuxième partenaire commercial de la région du Pacifique au sens large. Ses relations reposent sur trois piliers : partenariats privilégiés avec l'Australie et la Nouvelle-Zélande, coopération au développement avec les quinze États insulaires du Pacifique membres de l'OEACP, et engagement climatique et gouvernance océanique. Bases juridiques : traité FUE et <span class="kb-fact">accord-cadre UE-Australie</span>, <span class="kb-fact">accord de Samoa</span>.</p><p><b>Partenaires majeurs</b> L'<span class="kb-fact">accord-cadre UE-Australie</span> est entré en vigueur en <span class="kb-fact">octobre 2022</span> : en 2022, l'Union était le 3e partenaire commercial de l'Australie (<span class="kb-fact">56,4 milliards d'euros</span>) et l'Australie le <span class="kb-fact">18e partenaire commercial</span> de l'Union. L'accord UE-Nouvelle-Zélande a été signé en <span class="kb-fact">juillet 2023</span> (<span class="kb-fact">9,1 milliards d'euros</span> d'échanges en 2022, UE 3e partenaire de la Nouvelle-Zélande). L'<span class="kb-fact">accord de Samoa</span>, signé en <span class="kb-fact">novembre 2023</span>, appliqué provisoirement depuis le <span class="kb-fact">1er janvier 2024</span>, unit l'Union aux <span class="kb-fact">79 pays de l'OEACP</span> pour <span class="kb-fact">20 ans</span>.</p>`},

{section:"Action extérieure de l'Union", title:`Amérique latine et Caraïbes`, body:`
<p><b>Partenariat birégional</b> L'Union européenne et l'Amérique latine et les Caraïbes (ALC) sont des partenaires naturels unis par des liens politiques, économiques et culturels. L'UE est <span class="kb-fact">le premier investisseur, le troisième partenaire commercial</span> et le principal contributeur en coopération au développement de la région.</p><p><b>Base juridique et cadre institutionnel</b> <span class="kb-fact">Titre V du traité sur l'Union européenne</span> (action extérieure) et titres I à III et V du traité sur le fonctionnement de l'Union européenne. La Commission a adopté un nouveau programme en <span class="kb-fact">juin 2023</span> pour renforcer les relations. L'Assemblée parlementaire euro-latino-américaine (EuroLat), créée en <span class="kb-fact">2006</span>, compte <span class="kb-fact">150 membres</span> (75 du Parlement européen, 75 des parlements latino-américains). La Communauté des États latino-américains et des Caraïbes (CELAC), regroupant <span class="kb-fact">33 pays</span>, structure le dialogue régional via des sommets réguliers.</p>`},

{section:"Action extérieure de l'Union", title:`Russie`, body:`
<p><b>Contexte et base juridique</b> Les relations UE-Russie sont régies par le titre V du traité sur l'Union européenne (action extérieure) et par l'accord de partenariat et de coopération. Jusqu'en novembre 2013, l'Union et la Russie menaient un partenariat stratégique fondé sur le dialogue politique et la coopération économique.</p><p><b>Rupture de 2022</b> L'invasion illégale de l'Ukraine le <span class="kb-fact">24 février 2022</span> a marqué un tournant. L'Union qualifie la Russie de <span class="kb-fact">« menace directe et durable »</span> pour la sécurité européenne dans sa boussole stratégique de mars 2022. Réponse sans précédent : <span class="kb-fact">19 trains de sanctions</span> adoptés, plus de <span class="kb-fact">2 700 personnes et entités</span> sanctionnées (fin octobre 2025), et des restrictions commerciales couvrant <span class="kb-fact">54 % des exportations</span> et <span class="kb-fact">58 % des importations</span> d'avant-guerre. La Russie est passée de la <span class="kb-fact">5e à la 15e place</span> des partenaires commerciaux de l'UE entre 2021 et 2024.</p>`},

{section:"Action extérieure de l'Union", title:`Asie centrale`, body:`
<p><b>Contexte</b> <span class="kb-fact">L'Asie centrale</span> relie l'Asie à l'Europe et revêt une importance stratégique pour l'UE, avec des ressources énergétiques (gaz, pétrole), minérales (uranium, terres rares, or) et un rôle de carrefour commercial. <span class="kb-fact">Cinq États</span> composent la région : Kazakhstan, Kirghizstan, Ouzbékistan, Turkménistan et Tadjikistan.</p>
<p><b>Base juridique et relations</b> Les relations UE-Asie centrale s'inscrivent dans <span class="kb-fact">le titre V du traité sur l'Union européenne</span> et <span class="kb-fact">les articles 206-207 et 216-219 du TFUE</span>, avec des <span class="kb-fact">accords de partenariat et de coopération (APC/APCR)</span> négociés pays par pays. Le <span class="kb-fact">premier sommet UE-Asie centrale</span> s'est tenu en <span class="kb-fact">avril 2025 à Samarcande</span>, établissant un partenariat stratégique. En 2023, les échanges commerciaux s'élevaient à <span class="kb-fact">52,8 milliards d'euros</span>.</p>`},

{section:"Action extérieure de l'Union", title:`Afrique`, body:`
<p><b>Cadre juridique et partenariat</b> Les relations UE-Afrique reposent depuis 2024 sur l'accord de Samoa (signé en <span class="kb-fact">novembre 2023</span>, approuvé par le Parlement européen le <span class="kb-fact">10 avril 2024</span>), qui remplace l'accord de Cotonou. Il couvre plusieurs domaines prioritaires : droits humains, démocratie et gouvernance ; paix et sécurité ; développement social ; croissance économique inclusive ; durabilité environnementale ; migrations et mobilité.</p><p><b>Investissements et sommets</b> Lors du <span class="kb-fact">6e sommet UE-UA (février 2022, Bruxelles)</span>, l'UE et l'Afrique ont adopté « Une vision commune pour 2030 », avec un investissement annoncé de <span class="kb-fact">150 milliards d'euros</span>. L'instrument <span class="kb-fact">IVCDCI (Europe dans le monde)</span> dispose d'un budget de près de <span class="kb-fact">80 milliards d'euros sur 2021-2027</span>. Le <span class="kb-fact">7e sommet s'est tenu à Luanda, en Angola, les 24-25 novembre 2025</span>, pour les 25 ans du partenariat lancé au sommet du Caire en 2000.</p>`},

{section:"Action extérieure de l'Union", title:`Asie du Sud`, body:`
<p><b>Stratégie Indo-Pacifique de l'UE</b> L'Union européenne considère l'Asie du Sud comme géopolitiquement vitale. Sa stratégie Indo-Pacifique, adoptée en <span class="kb-fact">septembre 2021</span>, vise la stabilité régionale, les droits humains, la sécurité maritime et la transformation numérique.</p><p><b>Partenariats commerciaux majeurs</b> Avec l'Inde, le commerce de biens s'élevait à <span class="kb-fact">124 milliards d'euros en 2023</span>, et les services commerciaux à <span class="kb-fact">50,8 milliards d'euros</span>. Environ <span class="kb-fact">6 000 entreprises européennes</span> opèrent en Inde. Le Pakistan bénéficie du statut <span class="kb-fact">SPG+ depuis 2014</span>. L'UE a engagé <span class="kb-fact">1 milliard d'euros</span> de soutien à l'Afghanistan depuis août 2021.</p>`},

{section:"Action extérieure de l'Union", title:`Asie orientale, relations et stratégies de l'UE`, body:`
<p><b>Relations UE-Asie orientale</b> La région indo-pacifique abrite plus de <span class="kb-fact">50 % de la population mondiale</span> et constitue un enjeu géostratégique majeur pour l'UE. La Commission européenne, le Parlement européen et le Service européen pour l'action extérieure (SEAE) coordonnent les politiques. La <span class="kb-fact">stratégie Indo-Pacifique, adoptée en septembre 2021</span>, définit l'engagement européen dans la région, en réponse notamment aux nouvelles routes de la soie chinoises.</p><p><b>Défis commerciaux et sécuritaires</b> L'UE enregistre un déficit commercial de <span class="kb-fact">304,5 milliards d'euros avec la Chine</span> (2024). Les enjeux majeurs incluent les litiges maritimes en mer de Chine orientale et méridionale, la question de Taïwan, le dossier nucléaire nord-coréen, les droits de l'homme au Xinjiang et au Tibet, et la militarisation croissante de la région.</p>`},

{section:"Action extérieure de l'Union", title:`Asie du Sud-Est`, body:`
<p><b>Partenariat institutionnel</b> L'Asie du Sud-Est revêt une importance géostratégique dans l'Indo-Pacifique. L'Union européenne entretient des relations avec l'<span class="kb-fact">ASEAN</span> (Association des nations de l'Asie du Sud-Est), qui compte dix États membres et dont le premier sommet s'est tenu en <span class="kb-fact">février 1976 à Bali</span>. La base juridique repose sur le <span class="kb-fact">Titre V du TUE</span> et les <span class="kb-fact">articles 206, 207 et 216 à 219 du TFUE</span>, complétés par des accords bilatéraux de partenariat et de coopération.</p><p><b>Coopération récente</b> L'UE et l'ASEAN appliquent un <span class="kb-fact">partenariat stratégique 2023-2027</span>. La <span class="kb-fact">31e réunion du comité mixte</span> s'est tenue en mai 2024 à Jakarta. Le <span class="kb-fact">RCEP</span>, signé en novembre 2020 et entré en vigueur en janvier 2022, est le plus grand accord de libre-échange au monde. La <span class="kb-fact">Malaisie</span> préside l'ASEAN en 2025.</p>`},

];
