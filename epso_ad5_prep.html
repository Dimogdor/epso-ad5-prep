<p><b>Histoire de l'euro : du serpent monétaire à Maastricht.</b> Après l'échec du "serpent monétaire européen" (<span class="kb-fact">1972</span>), fragilisé par les chocs pétroliers, le <span class="kb-fact">Système monétaire européen (SME)</span> est lancé le <span class="kb-fact">13 mars 1979</span> à l'initiative de <span class="kb-fact">Valéry Giscard d'Estaing</span> et <span class="kb-fact">Helmut Schmidt</span> : taux de change fixes mais ajustables, et création de l'<span class="kb-fact">écu</span> (European Currency Unit), unité de compte préfigurant l'euro. Le <span class="kb-fact">rapport Delors (1989)</span> programme l'UEM en trois étapes. Le <span class="kb-fact">traité de Maastricht</span>, signé le <span class="kb-fact">7 février 1992</span>, conditionne l'adoption de la monnaie unique à quatre critères de convergence :</p>
<ul>
<li>une inflation proche de celle des trois États membres présentant les meilleurs résultats en matière de stabilité des prix (écart maximal de <span class="kb-fact">1,5 point</span>) ;</li>
<li>un déficit public sous <span class="kb-fact">3 % du PIB</span> ;</li>
<li>une dette publique sous <span class="kb-fact">60 % du PIB</span> ;</li>
<li>une stabilité du taux de change et un taux d'intérêt à long terme encadré (écart maximal de <span class="kb-fact">2 points</span>).</li>
</ul>
<p>La troisième étape de l'UEM démarre le <span class="kb-fact">1er janvier 1999</span> : fixation irrévocable des taux de change et euro scriptural pour <span class="kb-fact">onze États</span>. Les pièces et billets entrent en circulation le <span class="kb-fact">1er janvier 2002</span>. La zone euro compte aujourd'hui <span class="kb-fact">21 États membres</span> depuis l'entrée de la <span class="kb-fact">Bulgarie le 1er janvier 2026</span>.</p>
<p><b>SEBC, Eurosystème et BCE.</b> Le <span class="kb-fact">Système européen de banques centrales (SEBC)</span>, institué le <span class="kb-fact">1er juin 1998</span> avec la BCE, réunit la BCE et les banques centrales nationales de tous les États membres de l'UE ; l'<span class="kb-fact">Eurosystème</span> n'en regroupe que les membres de la zone euro. La BCE fixe la politique monétaire unique via son Conseil des gouverneurs et son Directoire, avec pour objectif principal la stabilité des prix ; elle est indépendante des instructions des gouvernements et des institutions de l'UE.</p>
<p><b>Pacte de stabilité et de croissance : la réforme de 2024.</b> Les seuils historiques restent <span class="kb-fact">3 % du PIB</span> pour le déficit et <span class="kb-fact">60 % du PIB</span> pour la dette. La réforme, entrée en vigueur le <span class="kb-fact">30 avril 2024</span> et applicable depuis <span class="kb-fact">2025</span>, remplace la surveillance multicritère par un indicateur unique de trajectoire des dépenses nettes ; chaque État négocie avec la Commission un plan budgétaire et structurel national sur <span class="kb-fact">4 ans</span>, prolongeable à <span class="kb-fact">7 ans</span> contre engagements de réformes et d'investissements. Des garde-fous imposent aux États les plus endettés une réduction de la dette d'au moins <span class="kb-fact">1 point de PIB par an</span> au-delà de 90 % du PIB, et <span class="kb-fact">0,5 point</span> entre 60 % et 90 %.</p>
<p><b>Union bancaire.</b> Née de la crise des dettes souveraines, elle repose sur deux piliers opérationnels : le <span class="kb-fact">mécanisme de surveillance unique (MSU)</span>, qui confie à la BCE la supervision directe des principales banques de la zone euro depuis <span class="kb-fact">novembre 2014</span>, et le <span class="kb-fact">mécanisme de résolution unique (MRU)</span>, pleinement opérationnel depuis le <span class="kb-fact">1er janvier 2016</span>, adossé au Conseil de résolution unique et à un fonds de résolution unique pour traiter les défaillances bancaires sans recours prioritaire à l'argent public. Le troisième pilier envisagé, un système européen de garantie des dépôts (EDIS), reste inachevé faute d'accord des États membres.</p>
<p><b>Eurogroupe.</b> Formation informelle sans base explicite dans les traités hors le <span class="kb-fact">protocole n° 14</span>, l'Eurogroupe réunit chaque mois les ministres des Finances de la zone euro, avec la Commission et la BCE, pour coordonner les politiques économiques et budgétaires avant les réunions du Conseil ECOFIN. Son président est élu par ses membres pour un mandat de <span class="kb-fact">deux ans et demi</span> ; <span class="kb-fact">Kyriakos Pierrakakis</span>, ministre grec de l'Économie et des Finances, y a été élu le <span class="kb-fact">11 décembre 2025</span>.</p>
<p><b>Débat mobilisable pour l'essai.</b> L'achèvement de l'union bancaire par un système européen de garantie des dépôts partagé divise. Ses partisans y voient la condition d'un marché bancaire réellement unique, réduisant le risque systémique et le lien entre banques fragiles et finances publiques nationales. Ses opposants craignent une mutualisation prématurée des risques entre systèmes bancaires nationaux inégalement assainis, et défendent le maintien de garanties de dépôts nationales tant que la convergence prudentielle n'est pas plus poussée.</p>`},

{group:'theme', title:`Affaires étrangères : PESC, Haut représentant, élargissement et relations transatlantiques`, body:`
<p><b>La PESC, une politique intergouvernementale</b> La politique étrangère et de sécurité commune (PESC) repose sur les articles <span class="kb-fact">21 à 46 du traité sur l'Union européenne (TUE)</span>, complétés par les articles 205 à 222 du TFUE. Contrairement aux politiques communautaires classiques, elle reste de nature intergouvernementale : c'est le <span class="kb-fact">Conseil européen</span> qui fixe les orientations stratégiques, et le <span class="kb-fact">Conseil des affaires étrangères (CAE)</span>, qui réunit les ministres des affaires étrangères, qui adopte les positions et actions communes. La règle de principe posée par l'article 24 TUE est l'unanimité : chaque État membre dispose de fait d'un droit de veto sur la diplomatie commune de l'Union.</p>

<p><b>Unanimité : les soupapes et le débat sur son dépassement</b> Le traité prévoit deux mécanismes pour atténuer la rigidité de l'unanimité. L'abstention constructive permet à un État de ne pas s'opposer à une décision sans être tenu de l'appliquer. La clause passerelle de l'<span class="kb-fact">article 31, paragraphe 3, TUE</span> permettrait au Conseil européen, statuant lui-même à l'unanimité, de faire basculer certains pans de la PESC vers le vote à la majorité qualifiée, hors des décisions ayant des implications militaires ou relevant de la défense ; elle n'a toutefois jamais été activée à ce jour. Depuis l'agression russe contre l'Ukraine, plusieurs États membres, avec l'Allemagne en première ligne, réclament ce basculement, et le <span class="kb-fact">Parlement européen</span> a lui-même adopté un rapport dédié aux clauses passerelles (<span class="kb-fact">A9-0208/2023</span>) demandant leur mise en œuvre pour accélérer la prise de décision.</p>

<p><b>Haut représentant et SEAE</b> Le Haut représentant de l'Union pour les affaires étrangères et la politique de sécurité cumule trois fonctions : il préside le CAE, il est vice-président de la Commission européenne, et il dirige le <span class="kb-fact">Service européen pour l'action extérieure (SEAE)</span>, créé par le traité de Lisbonne et opérationnel depuis <span class="kb-fact">2011</span>. Depuis le <span class="kb-fact">1er décembre 2024</span>, ce poste est occupé par l'Estonienne <span class="kb-fact">Kaja Kallas</span>, qui a succédé à Josep Borrell pour un mandat de cinq ans. Le SEAE anime le réseau des délégations de l'UE dans le monde et assiste le Haut représentant ; celui-ci consulte régulièrement le Parlement européen, qui tient des débats sur la PESC deux fois par an (article 36 TUE) et vote le budget administratif et opérationnel de la politique (hors dépenses militaires).</p>

<p><b>Élargissement : où en sont les candidats</b> Le Conseil européen a accordé le statut de candidat à l'<span class="kb-fact">Ukraine</span> et à la <span class="kb-fact">Moldavie</span> le <span class="kb-fact">23 juin 2022</span>, puis à la <span class="kb-fact">Géorgie</span> en <span class="kb-fact">décembre 2023</span>. Les négociations d'adhésion avec l'Ukraine et la Moldavie ont été décidées en décembre 2023 et formellement ouvertes en juin 2024.</p>
<ul>
<li><span class="kb-fact">Ukraine et Moldavie</span> : premier cluster de négociation (« fondamentaux ») ouvert le <span class="kb-fact">15 juin 2026</span> ; mi-2026, l'ouverture des clusters suivants reste freinée par le veto répété de la <span class="kb-fact">Hongrie</span>.</li>
<li><span class="kb-fact">Géorgie</span> : statut de candidat maintenu sur le papier, mais processus de facto gelé, la Commission ayant qualifié fin 2025 la Géorgie de candidate « de nom seulement » après un net recul de l'État de droit et de la démocratie.</li>
<li><span class="kb-fact">Balkans occidentaux</span> : le Monténégro et l'Albanie sont les candidats les plus avancés (l'Albanie a ouvert l'ensemble de ses groupes de négociation fin 2025) ; la Macédoine du Nord et la Bosnie-Herzégovine restent bloquées, la première par le veto bulgare sur une réforme constitutionnelle, la seconde par une crise politique interne ; la Serbie recule sur les critères fondamentaux ; le Kosovo reste candidat potentiel, sans statut de candidat officiel.</li>
</ul>

<p><b>Relations transatlantiques</b> Les États-Unis sont le partenaire historique de l'Union en matière commerciale, économique et de sécurité. Le dialogue transatlantique des législateurs réunit deux fois par an des eurodéputés et des membres du Congrès américain. Depuis l'investiture de <span class="kb-fact">Donald Trump</span> en <span class="kb-fact">janvier 2025</span>, la relation se tend : un accord de principe sur les droits de douane a été conclu fin juillet 2025 puis formalisé par une déclaration conjointe en <span class="kb-fact">août 2025</span>, et le Parlement européen a exprimé son inquiétude face à une politique étrangère américaine plus transactionnelle et moins engagée sur la sécurité européenne.</p>

<p><b>Un débat mobilisable pour l'essai</b> Deux lectures s'opposent sur l'avenir de la PESC et de l'élargissement. D'un côté, l'unanimité protège la souveraineté de chaque État membre sur un domaine régalien et empêche qu'une majorité impose une ligne diplomatique ou militaire à un pays qui s'y oppose. De l'autre, elle expose l'Union à des blocages répétés : un seul État peut retarder une sanction, une position commune ou l'ouverture d'un cluster d'adhésion, au moment même où la guerre en Ukraine exige de la réactivité. La clause passerelle de l'article 31 TUE offre une sortie juridique à ce dilemme, mais elle suppose elle-même l'unanimité pour être activée, ce qui explique pourquoi elle reste à ce jour un outil théorique plutôt qu'une solution appliquée.</p>`},

{group:'theme', title:`Alimentation et agriculture : PAC 2023-2027, Farm to Fork et sécurité alimentaire`, body:`
<p><b>Cadre général de la PAC.</b> La politique agricole commune (PAC) actuelle couvre la période <span class="kb-fact">2023-2027</span>, sur la base du règlement <span class="kb-fact">(UE) 2021/2115</span>. Le budget agricole de l'UE pour <span class="kb-fact">2021-2027</span> atteint <span class="kb-fact">386,6 milliards d'euros</span>, répartis entre le <span class="kb-fact">FEAGA</span> (Fonds européen agricole de garantie, <span class="kb-fact">291,1 milliards d'euros</span>, paiements directs et soutien de marché) et le <span class="kb-fact">FEADER</span> (Fonds européen agricole pour le développement rural, <span class="kb-fact">95,5 milliards d'euros</span>). La PAC représente <span class="kb-fact">environ un quart des dépenses totales de l'UE</span> en 2023. Depuis la réforme, chaque État membre applique un plan stratégique national unique couvrant les deux piliers, validé par la Commission.</p>

<ul>
<li>Environ <span class="kb-fact">9 millions d'exploitations agricoles</span> dans l'UE ; le secteur emploie régulièrement quelque <span class="kb-fact">17 millions de personnes</span>.</li>
<li>Près de <span class="kb-fact">7 millions de bénéficiaires</span> de la PAC, dont plus de <span class="kb-fact">5,9 millions d'agriculteurs</span> percevant une aide directe au revenu en 2022.</li>
<li>Valeur de la production agricole de l'UE de <span class="kb-fact">532 milliards d'euros en 2024</span> (environ <span class="kb-fact">50 %</span> pour les cultures, <span class="kb-fact">40 %</span> pour les produits animaux).</li>
<li>Premiers États bénéficiaires en 2023 : <span class="kb-fact">France (9,5 milliards d'euros)</span>, <span class="kb-fact">Espagne (7,1 milliards d'euros)</span>, <span class="kb-fact">Allemagne (6,4 milliards d'euros)</span>.</li>
</ul>

<p><b>Conditionnalité.</b> L'accès aux paiements de la PAC est conditionné au respect de règles de base : bonnes conditions agricoles et environnementales (<span class="kb-fact">BCAE</span>) et exigences réglementaires en matière de gestion. La réforme <span class="kb-fact">2023-2027</span> renforce ces exigences par rapport à la période précédente et intègre les anciennes composantes du paiement vert. Autre élément nouveau : une <span class="kb-fact">conditionnalité sociale</span> lie pour la première fois les paiements directs au respect du droit du travail, obligatoire pour tous les États membres depuis <span class="kb-fact">2025</span>. Sous la pression des mobilisations agricoles du début <span class="kb-fact">2024</span>, le Parlement européen a validé en <span class="kb-fact">avril 2024</span> un assouplissement de plusieurs règles, dont la suppression de l'obligation de consacrer <span class="kb-fact">4 %</span> des terres arables à des éléments non productifs favorables à la biodiversité (BCAE 8).</p>

<p><b>Éco-régimes.</b> Introduits par la réforme, les éco-régimes (<span class="kb-fact">article 31 du règlement (UE) 2021/2115</span>) financent l'engagement volontaire des agriculteurs, au-delà de la conditionnalité, dans des pratiques favorables au climat, à l'environnement et au bien-être animal. Chaque État membre doit consacrer au moins <span class="kb-fact">25 %</span> de son enveloppe nationale de paiements directs à ces régimes, facultatifs pour les agriculteurs. Sur l'ensemble de l'UE, ils représentent <span class="kb-fact">44,71 milliards d'euros</span> sur <span class="kb-fact">2023-2027</span>, soit <span class="kb-fact">23,64 %</span> du budget total des paiements directs.</p>

<p><b>Stratégie De la ferme à la table (Farm to Fork).</b> Présentée le <span class="kb-fact">20 mai 2020</span> dans le cadre du Pacte vert pour l'Europe, elle fixe des objectifs pour <span class="kb-fact">2030</span> : réduire de <span class="kb-fact">50 %</span> l'usage et les risques des pesticides, d'au moins <span class="kb-fact">20 %</span> l'usage des engrais, de <span class="kb-fact">50 %</span> les ventes d'antimicrobiens pour le bétail, et porter à <span class="kb-fact">25 %</span> la part des terres agricoles en agriculture biologique. L'agriculture représente environ <span class="kb-fact">10 %</span> des émissions de gaz à effet de serre de l'UE, dont <span class="kb-fact">70 %</span> liés à l'élevage. Sur le gaspillage alimentaire, l'UE jette chaque année environ <span class="kb-fact">60 millions de tonnes</span> de denrées, soit <span class="kb-fact">130 kg par habitant</span> et <span class="kb-fact">132 milliards d'euros</span> de valeur marchande perdue ; des objectifs contraignants adoptés en <span class="kb-fact">septembre 2025</span> visent, d'ici 2030 et par rapport à la moyenne <span class="kb-fact">2021-2023</span>, une réduction de <span class="kb-fact">10 %</span> dans la transformation et de <span class="kb-fact">30 %</span> dans le commerce de détail, la restauration et les ménages.</p>

<p><b>Sécurité alimentaire.</b> L'invasion russe de l'Ukraine en <span class="kb-fact">février 2022</span> a replacé la sécurité alimentaire au centre de l'agenda agricole européen. La Commission a présenté le <span class="kb-fact">23 mars 2022</span> une communication sur la sécurisation de l'approvisionnement alimentaire, suivie de mesures d'urgence : autorisation temporaire de cultiver des terres en jachère, flexibilité sur la TVA alimentaire, cadre temporaire de crise pour les aides d'État, et création du mécanisme européen de préparation et de réponse aux crises de sécurité alimentaire (<span class="kb-fact">EFSCM</span>). La stratégie Farm to Fork prévoyait déjà un plan de contingence pour l'approvisionnement alimentaire, tirant les leçons de la pandémie de Covid-19.</p>

<p><b>Un débat mobilisable à l'écrit.</b> D'un côté, les tenants de l'ambition environnementale du Pacte vert jugent les objectifs de Farm to Fork et les éco-régimes nécessaires face au changement climatique et à la perte de biodiversité, et lisent les assouplissements de 2024 comme un recul. De l'autre, organisations agricoles et plusieurs États membres mettent en avant la compétitivité et le revenu des agriculteurs européens, ainsi que la souveraineté alimentaire du continent dans un contexte de guerre en Ukraine, ce qui justifie à leurs yeux de tempérer le rythme des contraintes environnementales. Ce tiraillement entre verdissement et simplification structure aussi les discussions sur l'après-2027.</p>`},

{group:'theme', title:`Climat et environnement`, body:`
<p><b>Pacte vert pour l'Europe (European Green Deal).</b> Présenté par la Commission von der Leyen en <span class="kb-fact">décembre 2019</span> comme stratégie de croissance de l'UE, il fixe l'objectif de neutralité climatique et couvre tous les secteurs : énergie, transport, agriculture, industrie, biodiversité, financement durable. Il sert de cadre à deux textes clés, la loi européenne sur le climat et le paquet <b>Fit for 55</b>.</p>

<p><b>Loi européenne sur le climat.</b> <span class="kb-fact">Règlement (UE) 2021/1119</span> du <span class="kb-fact">30 juin 2021</span>, applicable depuis le <span class="kb-fact">29 juillet 2021</span>. Il rend juridiquement contraignant l'objectif de neutralité climatique à l'horizon <span class="kb-fact">2050</span> et fixe une cible intermédiaire de <span class="kb-fact">-55 %</span> d'émissions nettes de GES en 2030 par rapport à 1990. Une révision, votée par le Parlement le <span class="kb-fact">10 février 2026</span> (413 voix pour, 226 contre, 12 abstentions) puis validée par le Conseil, ajoute un objectif 2040 de <span class="kb-fact">-90 %</span>, avec une flexibilité : jusqu'à 5 points de pourcentage pourront provenir de crédits carbone internationaux à partir de 2036. Le règlement crée aussi un conseil scientifique consultatif européen sur le changement climatique, adossé à l'Agence européenne pour l'environnement.</p>

<p><b>Fit for 55.</b> Paquet de <span class="kb-fact">13 textes législatifs</span> présenté par la Commission le <span class="kb-fact">14 juillet 2021</span> pour transposer l'objectif -55 % de 2030 dans le droit sectoriel : réforme du marché du carbone, partage de l'effort entre États pour les secteurs hors SEQE, usage des terres et des forêts (LULUCF), normes CO2 pour les véhicules avec fin des ventes de voitures thermiques neuves prévue en <span class="kb-fact">2035</span>, fonds social pour le climat.</p>

<ul>
<li><b>SEQE-UE (ETS)</b>, marché du carbone créé en <span class="kb-fact">2005</span> : plafond et échange de quotas (cap-and-trade), plafond dégressif chaque année. Phase 4 en cours : <span class="kb-fact">2021-2030</span>. Fit for 55 crée un second marché, le SEQE2, pour le bâtiment et le transport routier, dont l'entrée en vigueur a été reportée de 2027 à <span class="kb-fact">2028</span>. Les recettes alimentent le Fonds pour l'innovation et le Fonds social pour le climat.</li>
<li><b>Mécanisme d'ajustement carbone aux frontières (MACF/CBAM)</b> : applique aux importations un prix carbone équivalent à celui payé par les producteurs européens, pour limiter les fuites de carbone. Phase transitoire de déclaration entre 2023 et 2025, régime définitif avec achat de certificats à partir de <span class="kb-fact">2026</span>, pour six secteurs (ciment, fer et acier, aluminium, engrais, électricité, hydrogène). Le paquet de simplification « Omnibus », présenté le <span class="kb-fact">26 février 2025</span> et validé par le Parlement et le Conseil le 18 juin 2025, a fixé un seuil d'exemption à 50 tonnes par importateur et par an.</li>
</ul>

<p><b>Stratégie biodiversité 2030.</b> Présentée le <span class="kb-fact">20 mai 2020</span>, elle vise à protéger <span class="kb-fact">30 %</span> des terres et des mers de l'UE, dont un tiers en protection stricte (10 % du territoire). Elle a débouché sur le règlement sur la restauration de la nature, adopté le <span class="kb-fact">17 juin 2024</span> et entré en vigueur le 18 août 2024 : restaurer au moins 20 % des zones terrestres et marines dégradées d'ici 2030, avec des cibles par habitat de 30 % en 2030, 60 % en 2040 et 90 % en 2050.</p>

<p><b>Débat mobilisable pour l'essai.</b> Le Pacte vert oppose deux lectures. D'un côté, ses défenseurs relient la trajectoire -90 % en 2040 et la neutralité en 2050 aux engagements de l'Accord de Paris et à la crédibilité climatique de l'UE. De l'autre, le paquet « Omnibus » de simplification, présenté dans le sillage du rapport Draghi sur la compétitivité (septembre 2024), traduit une inquiétude sur le coût de la mise en œuvre pour l'industrie et le pouvoir d'achat (charge administrative du MACF, effet du SEQE2 sur les ménages). Le débat porte sur l'équilibre entre ambition climatique et compétitivité économique, pas sur l'objectif final de 2050.</p>`},

{group:'theme', title:`Comment fonctionne l'UE, vu du citoyen : participation et transparence`, body:`
<p><b>Le citoyen face à l'UE, au-delà du vote.</b> La citoyenneté de l'Union, définie à l'<span class="kb-fact">article 20 du TFUE</span>, ouvre des droits qui dépassent le vote aux élections européennes et la libre circulation. Quatre canaux permettent à un citoyen, et parfois à tout résident de l'UE, d'agir directement sur l'action européenne ou de la contrôler : l'initiative citoyenne européenne, le droit de pétition au Parlement, la saisine du Médiateur européen et le droit d'accès aux documents des institutions. Ce sont des instruments de démocratie participative et de transparence, complémentaires du fonctionnement institutionnel classique.</p>

<p><b>L'initiative citoyenne européenne (ICE).</b> Fondée sur l'<span class="kb-fact">article 11, paragraphe 4, du TUE</span> et l'<span class="kb-fact">article 24 du TFUE</span>, elle permet à des citoyens d'inviter la Commission à présenter une proposition législative dans un domaine où elle dispose d'une compétence. Les conditions sont précises : <span class="kb-fact">un million de signatures</span>, avec un seuil minimal atteint dans <span class="kb-fact">au moins un quart des États membres</span> (<span class="kb-fact">7 pays sur 27</span>) actuellement, portées par un comité d'organisateurs d'<span class="kb-fact">au moins 7 citoyens résidant dans 7 États membres différents</span>. Les signataires doivent avoir l'âge requis pour voter aux élections européennes, parfois abaissé à 16 ans selon l'État membre. La Commission dispose de <span class="kb-fact">2 mois</span> pour enregistrer l'initiative, les organisateurs ont ensuite <span class="kb-fact">12 mois</span> pour collecter les signatures, puis la Commission doit répondre par une communication motivée dans un délai de <span class="kb-fact">6 mois</span> après une audition publique au Parlement. Le cadre actuel est fixé par le <span class="kb-fact">règlement (UE) 2019/788</span>, en vigueur depuis le <span class="kb-fact">1er janvier 2020</span>, qui a remplacé le règlement (UE) n° 211/2011. En pratique, seule une minorité des initiatives enregistrées atteint le seuil requis, ce qui alimente les critiques sur l'effectivité de l'outil.</p>

<p><b>Le droit de pétition.</b> Garanti par l'<span class="kb-fact">article 227 du TFUE</span> et l'<span class="kb-fact">article 44 de la Charte des droits fondamentaux</span>, il ouvre à tout citoyen de l'Union, ainsi qu'à toute personne physique ou morale résidant ou ayant son siège statutaire dans un État membre, la possibilité de saisir le Parlement européen, seul ou collectivement, sur un sujet relevant des compétences de l'Union et le concernant directement. La <span class="kb-fact">commission des pétitions (PETI)</span> examine la recevabilité de chaque pétition et peut demander une enquête à la Commission, la transmettre à une autre commission parlementaire, organiser une audition ou proposer une résolution. Une pétition peut ainsi déclencher une procédure d'infraction contre un État membre ou nourrir une initiative législative : elle joue à la fois un rôle de participation citoyenne et de signalement des manquements au droit de l'UE.</p>

<p><b>Le Médiateur européen.</b> Il est élu par le Parlement pour la durée de la législature, soit un mandat renouvelable de <span class="kb-fact">5 ans</span> ; sa base juridique combine les <span class="kb-fact">articles 20, 24 et 228 du TFUE</span> et l'<span class="kb-fact">article 43 de la Charte des droits fondamentaux</span>. Il enquête sur les cas de mauvaise administration (« maladministration ») des institutions, organes et organismes de l'UE : irrégularités administratives, refus d'accès à des documents, retards injustifiés, discrimination, abus de pouvoir ou absence de réponse. Peuvent le saisir les citoyens de l'Union ainsi que toute personne physique ou morale résidant ou ayant son siège dans un État membre. Sa compétence exclut les activités juridictionnelles de la Cour de justice et les plaintes visant les administrations nationales, régionales ou locales des États membres. Ses recommandations ne sont pas contraignantes ; en cas de refus persistant d'une institution, il peut adresser un rapport spécial au Parlement. Depuis le <span class="kb-fact">27 février 2025</span>, la fonction est exercée par <span class="kb-fact">Teresa Anjinho</span>, élue par le Parlement en <span class="kb-fact">décembre 2024</span>.</p>

<p><b>Le droit d'accès aux documents.</b> Consacré par l'<span class="kb-fact">article 15, paragraphe 3, du TFUE</span> et mis en œuvre par le <span class="kb-fact">règlement (CE) n° 1049/2001</span>, en vigueur depuis <span class="kb-fact">décembre 2001</span>, il permet à tout citoyen de l'Union et à toute personne physique ou morale résidant dans un État membre de demander les documents du Parlement, du Conseil et de la Commission. L'institution saisie doit répondre sous <span class="kb-fact">15 jours ouvrables</span>, délai prorogeable pour les demandes volumineuses. Un refus doit être motivé au regard d'exceptions limitées : sécurité publique, défense, relations internationales, politique financière ou monétaire, vie privée, intérêts commerciaux, procédures juridictionnelles en cours ou protection du processus décisionnel. En cas de refus, le demandeur peut déposer une demande confirmative, puis saisir soit le Médiateur européen, soit la Cour de justice de l'UE.</p>

<p><b>Un débat pour l'essai EUFTE.</b> Ces quatre instruments nourrissent une discussion utile pour l'épreuve EUFTE. D'un côté, l'UE a construit un ensemble de mécanismes de participation et de transparence qui va au-delà de ce qu'offrent certains États membres au niveau national. De l'autre, l'écart entre droits formels et impact concret reste discuté : peu d'ICE débouchent sur un acte législatif contraignant, et les exceptions au droit d'accès aux documents restent larges pour les dossiers sensibles (commerce, défense, négociations en cours). Le débat porte donc sur l'effectivité réelle de ces canaux, plus que sur leur simple existence formelle.</p>`},

{group:'theme', title:`Droits des consommateurs dans l'UE : achats à distance, garanties, données et passagers`, body:`
<p><b>Droit de rétractation dans les achats à distance.</b> La directive <span class="kb-fact">2011/83/UE</span> du <span class="kb-fact">25 octobre 2011</span> ouvre au consommateur un délai de <span class="kb-fact">14 jours</span> pour se rétracter d'un contrat conclu à distance ou hors établissement, sans justification ni frais autres que ceux prévus par le texte. Le délai court à compter de la prise de possession du bien pour une vente, ou de la conclusion du contrat pour une prestation de service. Des exceptions existent : biens périssables, biens scellés descellés pour raison d'hygiène, biens confectionnés sur mesure, réservations d'hôtel ou de location de voiture à date fixe, contenu numérique téléchargé avec l'accord exprès du consommateur.</p>

<p><b>Garantie légale de conformité.</b> La directive <span class="kb-fact">(UE) 2019/771</span> du <span class="kb-fact">20 mai 2019</span>, applicable aux contrats conclus depuis le <span class="kb-fact">1er janvier 2022</span>, fixe une garantie minimale de <span class="kb-fact">2 ans</span> à compter de la livraison pour tout défaut de conformité d'un bien, y compris les biens comportant des éléments numériques. Le consommateur a droit à la réparation ou au remplacement gratuit, puis, à défaut, à une réduction du prix ou à la résolution du contrat. Pendant la première année suivant la livraison (les États membres pouvant porter ce délai à 2 ans), le défaut est présumé avoir existé au moment de la livraison, ce qui inverse la charge de la preuve au détriment du vendeur.</p>

<p><b>Protection des données du consommateur en ligne.</b> Le règlement général sur la protection des données (<span class="kb-fact">RGPD</span>, règlement <span class="kb-fact">(UE) 2016/679</span> du <span class="kb-fact">27 avril 2016</span>, applicable depuis le <span class="kb-fact">25 mai 2018</span>) encadre la collecte des données personnelles par les sites marchands : consentement explicite et préalable, information claire sur l'usage et la conservation des données, droit d'accès, de rectification, d'effacement (droit à l'oubli) et de portabilité. Les autorités nationales de contrôle (la <span class="kb-fact">CNIL</span> en France) peuvent infliger des amendes allant jusqu'à <span class="kb-fact">20 millions d'euros</span> ou <span class="kb-fact">4 %</span> du chiffre d'affaires mondial annuel de l'entreprise, selon le montant le plus élevé.</p>

<p><b>Fin des frais d'itinérance (roaming).</b> Le régime <span class="kb-fact">« Roam like at home »</span> s'applique depuis <span class="kb-fact">juin 2017</span> : un consommateur qui voyage dans l'UE appelle, envoie des SMS et utilise ses données mobiles au même tarif que dans son pays d'origine. Le Parlement européen et le Conseil ont prolongé ce régime en <span class="kb-fact">avril 2022</span> pour dix ans, soit jusqu'en <span class="kb-fact">2032</span>. Selon un Eurobaromètre de <span class="kb-fact">2023</span>, plus de <span class="kb-fact">81 %</span> des résidents de l'UE voyageant dans l'Union en bénéficient directement.</p>

<p><b>Indemnisation des passagers.</b> Trois régimes distincts couvrent les usagers des transports :</p>
<ul>
<li>Aérien : le règlement <span class="kb-fact">(CE) n° 261/2004</span> prévoit une indemnisation forfaitaire de <span class="kb-fact">250, 400 ou 600 euros</span> selon la distance du vol, en cas de refus d'embarquement, d'annulation ou de retard à l'arrivée d'au moins <span class="kb-fact">3 heures</span>, sauf circonstances extraordinaires prouvées par la compagnie.</li>
<li>Ferroviaire : le règlement <span class="kb-fact">(UE) 2021/782</span> ouvre droit, en cas de retard, à une indemnisation de <span class="kb-fact">25 %</span> du prix du billet pour un retard de <span class="kb-fact">60 à 119 minutes</span>, et de <span class="kb-fact">50 %</span> au-delà de <span class="kb-fact">120 minutes</span>.</li>
<li>Autobus et autocar : le règlement <span class="kb-fact">(UE) n° 181/2011</span>, applicable aux services réguliers de <span class="kb-fact">250 km</span> ou plus, prévoit une indemnisation à hauteur de <span class="kb-fact">50 %</span> du prix du billet si le transporteur ne propose pas de réacheminement ou de remboursement en cas d'annulation ou de retard important.</li>
</ul>

<p>Ces règles nourrissent un débat mobilisable dans l'essai EUFTE. D'un côté, l'harmonisation par directives et règlements uniques renforce la confiance du consommateur et le marché intérieur, en particulier pour le commerce en ligne transfrontière. De l'autre, transporteurs et petits commerçants pointent un coût de mise en conformité élevé et une jurisprudence parfois incertaine sur la notion de circonstances extraordinaires, ce qui nourrit la question de savoir jusqu'où la protection du consommateur doit peser sur les acteurs économiques sans freiner l'innovation ni renchérir les prix.</p>`},

{group:'theme', title:`Désinformation : volet DSA, code de conduite, FIMI et StratCom du SEAE`, body:`
<p><b>Manipulation de l'information et FIMI</b> : la désinformation désigne un contenu faux ou trompeur diffusé en ligne. La notion de <span class="kb-fact">FIMI</span> (Foreign Information Manipulation and Interference, manipulation de l'information et ingérence étrangère), définie par le SEAE, est plus précise : un comportement majoritairement non illégal, mais manipulateur, intentionnel et coordonné, mené par un acteur étatique ou non étatique (et leurs intermédiaires), qui porte atteinte aux valeurs, aux procédures ou aux processus politiques de l'UE. Les travaux du SEAE se concentrent en particulier sur la Russie et la Chine comme acteurs FIMI.</p>
<p><b>Le volet désinformation du Digital Services Act</b> : le <span class="kb-fact">DSA</span> (règlement (UE) 2022/2065) impose aux très grandes plateformes en ligne et très grands moteurs de recherche (VLOP/VLOSE, seuil de <span class="kb-fact">45 millions</span> d'utilisateurs actifs mensuels dans l'UE) une obligation d'évaluation des risques systémiques (article 34) puis d'atténuation (article 35). Ces risques couvrent les effets négatifs sur le discours civique, les processus électoraux et la sécurité publique, catégorie dans laquelle s'inscrit la désinformation. La Commission a désigné le premier lot de <span class="kb-fact">17 VLOP et 2 VLOSE</span> le <span class="kb-fact">25 avril 2023</span> (dont Facebook, YouTube, TikTok, Google Search, Bing).</p>
<p><b>Du code de bonnes pratiques au code de conduite</b> : un premier Code de bonnes pratiques contre la désinformation existe depuis <span class="kb-fact">2018</span>, sur base volontaire. Un Code renforcé a été signé le <span class="kb-fact">16 juin 2022</span> par <span class="kb-fact">34 signataires</span> (plateformes, annonceurs, fact-checkeurs, chercheurs), avec <span class="kb-fact">44 engagements</span> et <span class="kb-fact">128 mesures</span> : démonétisation de la désinformation, transparence de la publicité politique, accès des chercheurs aux données. Le <span class="kb-fact">13 février 2025</span>, la Commission et le comité européen des services numériques ont acté son intégration comme code de conduite reconnu au sens du DSA : son respect devient un élément d'appréciation de la conformité des VLOP/VLOSE à leurs obligations légales.</p>
<p><b>Le SEAE et la task force StratCom</b> : la division Communication stratégique du Service européen pour l'action extérieure a créé sa première cellule, l'East StratCom Task Force, en <span class="kb-fact">2015</span>, en réaction aux campagnes de désinformation russes liées à l'agression contre l'Ukraine. Deux autres task forces ont suivi, dédiées aux Balkans occidentaux et au voisinage Sud, complétées par une équipe horizontale sur les menaces émergentes et l'analyse de données. Le projet <span class="kb-fact">EUvsDisinfo</span> documente les récits de désinformation pro-Kremlin. Depuis 2023, le SEAE publie un rapport annuel sur les menaces FIMI, et un centre d'échange d'informations, le <span class="kb-fact">FIMI-ISAC</span>, structure la coopération avec les États membres et la société civile.</p>
<p><b>Le Parlement européen</b> : deux commissions spéciales successives, <span class="kb-fact">INGE</span> (2020) puis <span class="kb-fact">INGE2</span> (2022), ont demandé un renforcement de la résilience de l'UE et un régime de sanctions ciblant la désinformation orchestrée par des gouvernements étrangers. La législature 2024-2029 a ouvert une nouvelle commission spéciale sur le bouclier européen pour la démocratie, en lien avec la communication conjointe Commission/Haute représentante sur l'European Democracy Shield du <span class="kb-fact">12 novembre 2025</span> (JOIN(2025) 791), qui prévoit un futur Centre européen pour la résilience démocratique.</p>
<p><b>Débat mobilisable pour l'essai</b> : un argument défend la corégulation choisie par l'UE (code de conduite adossé au DSA, obligations de moyens) comme voie compatible avec la liberté d'expression et la diversité des systèmes de médias nationaux. L'argument inverse objecte que ce montage reste dépendant de l'autodiscipline des plateformes, insuffisant face à des campagnes étatiques structurées, et demande des obligations contraignantes et des sanctions dissuasives, au prix d'un risque accru de contrôle du discours en ligne par la puissance publique.</p>`},

{group:'theme', title:`Migration et asile : le Pacte 2024, Frontex, RAEC`, body:`
<p><b>Genèse et adoption</b> Le Pacte sur la migration et l'asile est proposé par la Commission en <span class="kb-fact">2020</span>. Le Parlement et les États membres trouvent un accord politique en <span class="kb-fact">décembre 2023</span> ; le Parlement l'adopte en plénière le <span class="kb-fact">10 avril 2024</span> et le Conseil l'adopte formellement le <span class="kb-fact">14 mai 2024</span>. L'ensemble compte <span class="kb-fact">dix textes</span> (neuf règlements et une directive) et remplace le règlement de Dublin par un nouveau règlement sur la gestion de l'asile et de la migration (AMMR). Il entre en application le <span class="kb-fact">12 juin 2026</span> pour toutes les demandes enregistrées à partir de cette date : c'est une réforme récente au moment du concours.</p>
<p><b>Les textes principaux</b> du Pacte couvrent des volets complémentaires :</p>
<ul>
<li>le règlement gestion de l'asile et de la migration (AMMR), qui fixe les critères de responsabilité des États et le mécanisme de solidarité</li>
<li>le règlement filtrage (screening) aux frontières extérieures</li>
<li>le règlement procédures d'asile, qui organise l'examen des demandes, y compris à la frontière</li>
<li>le règlement Eurodac révisé, base de données biométrique élargie</li>
<li>le règlement qualification (critères de la protection internationale) et la directive conditions d'accueil</li>
<li>le règlement crises et cas de force majeure, pour les afflux exceptionnels</li>
</ul>
<p><b>Procédures aux frontières</b> Le filtrage à l'entrée dure au maximum <span class="kb-fact">7 jours</span> aux frontières extérieures (<span class="kb-fact">3 jours</span> pour les personnes interpellées sur le territoire) : identification, contrôles sanitaires et de sécurité, collecte de données biométriques, y compris pour les enfants dès <span class="kb-fact">6 ans</span>. La procédure d'asile à la frontière, réservée aux demandes jugées peu susceptibles d'aboutir, doit en principe être bouclée en <span class="kb-fact">12 semaines</span> (jusqu'à <span class="kb-fact">16 semaines</span> si une relocalisation est prévue). Hors procédure frontière, le délai visé pour une première décision d'asile reste de <span class="kb-fact">6 mois</span>.</p>
<p><b>Mécanisme de solidarité</b> Le règlement AMMR fixe un objectif annuel minimal, au niveau de l'Union, d'au moins <span class="kb-fact">30 000 relocalisations</span> et <span class="kb-fact">600 millions d'euros</span> de contributions financières. Chaque État choisit entre relocaliser des demandeurs, verser une contribution financière (environ <span class="kb-fact">20 000 euros</span> par personne non relocalisée) ou apporter un soutien opérationnel et technique. Pour la première année d'application, le Conseil a retenu des chiffres plus bas : <span class="kb-fact">21 000</span> relocalisations ou efforts équivalents et <span class="kb-fact">420 millions d'euros</span>.</p>
<p><b>Frontex</b> L'agence européenne de garde-frontières et de garde-côtes appuie les États pour le contrôle des frontières extérieures, le filtrage prévu par le Pacte, les opérations de retour et la coopération avec les pays tiers. Son corps permanent doit atteindre <span class="kb-fact">10 000 agents</span> d'ici <span class="kb-fact">2027</span> (environ 3 000 employés directement par l'agence, le reste détaché par les États membres), avec une réserve de réaction rapide de <span class="kb-fact">1 500 agents</span>. L'agence a connu un contrôle parlementaire renforcé après un rapport de l'OLAF documentant des manquements aux droits fondamentaux (refoulements), qui a conduit à la démission de son directeur exécutif en <span class="kb-fact">avril 2022</span>.</p>
<p><b>Régime d'asile européen commun et débat</b> Le droit d'asile s'appuie sur l'article <span class="kb-fact">78 du TFUE</span> et l'article 18 de la Charte des droits fondamentaux, qui renvoie à la Convention de Genève de <span class="kb-fact">1951</span> ; le Parlement est colégislateur à part entière pour l'asile depuis le traité de Lisbonne. Le Pacte est présenté comme la réforme d'ensemble de ce régime commun. Il reste débattu : les institutions y voient un compromis assurant des frontières mieux contrôlées et une solidarité plus prévisible entre États, tandis que des ONG comme Amnesty International ou Human Rights Watch dénoncent un risque de détention de fait aux frontières et une pression sur l'accès individuel à l'asile.</p>`},

{group:'theme', title:`Numérique : RGPD, DSA, DMA, AI Act, souveraineté`, body:`
<p><b>RGPD, l'objet de référence.</b> Le <span class="kb-fact">RGPD</span> (règlement <span class="kb-fact">2016/679</span>, applicable depuis le <span class="kb-fact">25 mai 2018</span>) protège les données à caractère personnel des personnes physiques, tous secteurs confondus. Il repose sur le consentement, la minimisation des données, le droit d'accès, de rectification, d'effacement et de portabilité, et sur des autorités de contrôle nationales indépendantes (la CNIL en France). Les sanctions peuvent atteindre <span class="kb-fact">20 millions d'euros ou 4 % du chiffre d'affaires annuel mondial</span>, le montant le plus élevé étant retenu. C'est le texte matrice sur lequel s'appuient ensuite le DSA, le DMA et l'AI Act, mais son objet reste distinct : la donnée personnelle, pas la modération des plateformes ni la concurrence.</p>

<ul>
<li><b>DSA</b> (Digital Services Act, applicable depuis le <span class="kb-fact">17 février 2024</span>) encadre la modération des contenus par les intermédiaires en ligne : retrait des contenus illégaux, transparence des systèmes de recommandation, interdiction de la publicité ciblée visant les mineurs ou fondée sur des données sensibles. Les très grandes plateformes et moteurs de recherche (VLOP/VLOSE), au-delà de <span class="kb-fact">45 millions</span> d'utilisateurs mensuels dans l'UE, ont des obligations renforcées de gestion des risques systémiques.</li>
<li><b>DMA</b> (Digital Markets Act, applicable depuis le <span class="kb-fact">2 mai 2023</span>) est un texte de concurrence, pas de contenu : il vise les <span class="kb-fact">contrôleurs d'accès</span> (gatekeepers), grandes plateformes qui verrouillent l'accès entre entreprises et utilisateurs (moteurs de recherche, magasins d'applications, messageries). Il leur interdit l'auto-préférence et le blocage de la désinstallation d'applications, impose l'interopérabilité des messageries, avec des amendes possibles jusqu'à <span class="kb-fact">10 % du chiffre d'affaires mondial</span> (20 % en cas de récidive).</li>
<li><b>AI Act</b> (règlement <span class="kb-fact">2024/1689</span>, entré en vigueur le <span class="kb-fact">1er août 2024</span>) ne porte ni sur les données personnelles ni sur la concurrence mais sur les systèmes d'intelligence artificielle, classés selon une approche par les risques : risque inacceptable (interdit, par exemple la notation sociale ou la reconnaissance biométrique en temps réel dans l'espace public), risque élevé (évaluation de conformité, documentation, contrôle humain), risque limité (obligations de transparence) et risque minimal. Les interdictions s'appliquent depuis le <span class="kb-fact">2 février 2025</span> et les obligations sur l'IA à usage général depuis le <span class="kb-fact">2 août 2025</span>. Le calendrier initial prévoyait l'application des systèmes à haut risque de l'annexe III au 2 août 2026, mais le paquet Digital Omnibus, définitivement adopté en <span class="kb-fact">juin 2026</span>, a repoussé cette échéance au <span class="kb-fact">2 décembre 2027</span> (<span class="kb-fact">2 août 2028</span> pour les systèmes à haut risque intégrés à des produits).</li>
</ul>

<p><b>Souveraineté numérique européenne.</b> Elle désigne la volonté de l'UE de réduire sa dépendance envers les fournisseurs non européens de cloud, de semi-conducteurs et de calcul. Le <span class="kb-fact">Chips Act</span> (entré en vigueur le <span class="kb-fact">21 septembre 2023</span>) vise à porter la part de l'UE dans la production mondiale de semi-conducteurs à <span class="kb-fact">20 %</span> d'ici 2030 ; la Commission a déjà approuvé treize décisions d'aide d'État représentant plus de <span class="kb-fact">32 milliards d'euros</span> d'investissements publics et privés dans des sites de production. L'initiative <span class="kb-fact">Gaia-X</span>, portée par la France et l'Allemagne, vise une offre de cloud européen. L'entreprise commune européenne <span class="kb-fact">EuroHPC</span>, financée par l'UE et les pays participants, dispose d'un budget d'au moins <span class="kb-fact">8,2 milliards d'euros</span> sur 2021-2027 pour la prochaine génération de superordinateurs et le calcul quantique.</p>

<p><b>5G et 6G.</b> La stratégie 5G de l'UE s'inscrit dans la Boussole numérique pour <span class="kb-fact">2030</span>, qui vise une couverture 5G complète des zones habitées et une connectivité gigabit universelle. Pour la 6G, l'entreprise commune européenne <span class="kb-fact">Smart Networks and Services</span> associe financement public et acteurs industriels afin d'éviter que l'Europe ne devienne dépendante de standards et d'équipements conçus hors d'elle, un enjeu de souveraineté technologique autant que de compétitivité industrielle.</p>

<p><b>Espace européen des données de santé (EHDS).</b> Le règlement (UE) <span class="kb-fact">2025/327</span>, entré en vigueur le <span class="kb-fact">26 mars 2025</span>, crée le premier espace sectoriel de données de l'UE. Il distingue un usage primaire, qui donne à chaque patient un accès facilité à ses données de santé électroniques même dans un autre État membre, et un usage secondaire, qui permet aux chercheurs et aux pouvoirs publics d'exploiter des données anonymisées à des fins de recherche et de politique de santé, à l'exclusion de toute finalité commerciale comme la publicité ou l'assurance. Les deux usages entrent en application par vagues : une première catégorie de données (résumés de patients et e-prescriptions pour l'usage primaire, la plupart des catégories pour l'usage secondaire) à partir de <span class="kb-fact">mars 2029</span>, une seconde catégorie (imagerie médicale, données génomiques) à partir de <span class="kb-fact">mars 2031</span>.</p>

<p><b>Un débat mobilisable pour l'essai.</b> La régulation numérique européenne (RGPD, DSA, DMA, AI Act) est présentée par certains comme un atout : elle fixe des standards que d'autres marchés reprennent ensuite et protège les citoyens face aux plateformes non européennes. D'autres acteurs économiques et États membres estiment au contraire que l'accumulation de ces textes freine l'innovation et la compétitivité européenne face aux États-Unis et à la Chine, ce qui a conduit la Commission à proposer en <span class="kb-fact">novembre 2025</span> un paquet dit <span class="kb-fact">Digital Omnibus</span>, formellement adopté par le Conseil le <span class="kb-fact">29 juin 2026</span>, qui simplifie et repousse certaines échéances de l'AI Act.</p>`},

{group:'theme', title:`Protection sociale`, body:`
<p><b>Socle européen des droits sociaux</b> : proclamé conjointement par le Parlement, le Conseil et la Commission le <span class="kb-fact">17 novembre 2017</span> au sommet social de <span class="kb-fact">Göteborg</span> (Suède). Il fixe <span class="kb-fact">20 principes</span> répartis en trois chapitres : égalité des chances et accès au marché du travail, conditions de travail équitables, protection sociale et inclusion. C'est un texte politique non contraignant (soft law), pas un instrument juridique créant de nouveaux droits directement invocables : la compétence de l'UE en matière sociale reste limitée par les traités, et sa mise en œuvre repose surtout sur les États membres et les partenaires sociaux, suivie par un tableau de bord social. Le plan d'action adopté en 2021 fixe trois objectifs pour 2030 : un taux d'emploi d'au moins <span class="kb-fact">78 %</span> chez les 20-64 ans, <span class="kb-fact">60 %</span> des adultes en formation chaque année, et une réduction d'au moins <span class="kb-fact">15 millions</span> du nombre de personnes menacées de pauvreté ou d'exclusion sociale.</p>
<p><b>Coordination, pas harmonisation, des systèmes de sécurité sociale</b> : l'UE ne fusionne pas les régimes nationaux (âge de départ à la retraite, niveau des prestations et financement restent des compétences nationales). Elle fixe seulement des règles communes pour protéger les personnes qui se déplacent entre États membres, via le règlement <span class="kb-fact">(CE) n° 883/2004</span> et son règlement d'application <span class="kb-fact">987/2009</span>, applicables depuis le <span class="kb-fact">1er mai 2010</span>. Quatre principes structurent cette coordination :</p>
<ul>
<li><b>Unicité de la législation applicable</b> : une seule législation nationale s'applique à la fois, en général celle de l'État d'activité.</li>
<li><b>Égalité de traitement</b> : mêmes droits et obligations que les ressortissants de l'État de couverture.</li>
<li><b>Totalisation des périodes</b> : les périodes d'assurance, d'emploi ou de résidence accomplies dans d'autres États sont prises en compte pour le calcul des prestations.</li>
<li><b>Exportabilité des prestations</b> : certaines prestations en espèces peuvent être perçues dans un autre État de résidence.</li>
</ul>
<p>Ce dispositif couvre les 27 États membres ainsi que l'Islande, le Liechtenstein, la Norvège (EEE) et la Suisse. Une révision du règlement 883/2004, proposée par la Commission dès le <span class="kb-fact">13 décembre 2016</span>, a fait l'objet d'un accord provisoire en trilogue le <span class="kb-fact">22 avril 2026</span>, confirmé par les représentants des États membres (Coreper) le <span class="kb-fact">29 avril 2026</span> ; elle bascule notamment l'indemnisation chômage des travailleurs frontaliers vers l'État de dernière activité plutôt que l'État de résidence, l'adoption formelle définitive par le Parlement et le Conseil restant à finaliser.</p>
<p><b>Directive sur les salaires minimaux adéquats</b> : la directive <span class="kb-fact">(UE) 2022/2041</span>, adoptée le <span class="kb-fact">19 octobre 2022</span> et transposable avant le <span class="kb-fact">15 novembre 2024</span>, poursuit trois objectifs : l'adéquation des salaires minimaux légaux, la promotion de la négociation collective, et l'accès effectif des travailleurs à la protection qu'offre le salaire minimum. Elle n'impose aucun montant harmonisé, la fixation des rémunérations restant hors du champ d'harmonisation de l'UE, et laisse les États sans salaire minimum légal (Danemark, Italie, Autriche, Finlande, Suède notamment) libres de ne pas en introduire un. Un État où le taux de couverture de la négociation collective est inférieur à <span class="kb-fact">80 %</span> doit établir, en concertation avec les partenaires sociaux, un plan d'action pour le renforcer progressivement.</p>
<p><b>Directive sur les travailleurs des plateformes numériques</b> : la directive <span class="kb-fact">(UE) 2024/2831</span>, proposée par la Commission le <span class="kb-fact">9 décembre 2021</span>, adoptée par le Parlement le <span class="kb-fact">24 avril 2024</span> (554 voix pour, 56 contre, 24 abstentions) puis par le Conseil le <span class="kb-fact">14 octobre 2024</span>, doit être transposée avant le <span class="kb-fact">2 décembre 2026</span>. Elle instaure une présomption légale réfragable de relation de travail salariée dès lors que des indices de contrôle et de direction sont réunis, la charge de la preuve du statut d'indépendant incombant à la plateforme. Elle encadre aussi la gestion algorithmique : une décision affectant significativement un travailleur, comme un licenciement, ne peut reposer uniquement sur un système automatisé, et une supervision humaine devient obligatoire. Le texte vise environ <span class="kb-fact">28 millions</span> de travailleurs de plateformes dans l'UE recensés en 2021 (jusqu'à <span class="kb-fact">43 millions</span> attendus en 2025), dont environ <span class="kb-fact">5,5 millions</span> potentiellement mal classés comme indépendants selon les estimations de la Commission.</p>
<p><b>Un débat mobilisable pour l'essai</b> : ces textes illustrent la tension entre approfondissement social européen et respect des compétences nationales. D'un côté, une intervention plus poussée de l'UE (critères harmonisés, seuils communs) protège mieux les travailleurs vulnérables et limite le dumping social entre États membres. De l'autre, les États défendent leur marge de manœuvre : la France s'est par exemple opposée à des critères européens uniformes pour la présomption de salariat des travailleurs de plateformes, si bien que le texte final laisse chaque État définir ses propres critères nationaux ; de même, la révision du règlement 883/2004 a nécessité près de dix ans de négociations avant qu'un compromis soit trouvé.</p>`},

{group:'theme', title:`Santé`, body:`
<p><b>Une compétence d'appui, pas une compétence exclusive</b> La base juridique est l'<span class="kb-fact">article 168 TFUE</span> : un niveau élevé de protection de la santé humaine doit être assuré dans toutes les politiques de l'UE. En santé, l'UE dispose seulement d'une compétence d'appui : elle complète, coordonne et soutient l'action des États membres, elle ne la remplace pas. L'organisation des systèmes de santé, les prestations de soins et la sécurité sociale restent une responsabilité nationale. C'est un point de vigilance classique pour le QCM : la santé n'est ni une compétence exclusive ni une compétence partagée au sens plein, c'est une compétence d'appui, comme la culture ou le tourisme.</p>
<p><b>L'Union européenne de la santé, née du Covid</b> La Commission lance le projet avec sa communication du <span class="kb-fact">11 novembre 2020</span> (« Building a European Health Union »), tirée des lacunes révélées par la pandémie. Elle s'appuie sur plusieurs briques :</p>
<ul>
<li>des mandats renforcés pour l'<span class="kb-fact">ECDC</span> (Centre européen de prévention et de contrôle des maladies) et l'<span class="kb-fact">EMA</span> (Agence européenne des médicaments), actés en 2022, dès janvier pour l'EMA et en fin d'année pour l'ECDC ;</li>
<li>le programme <span class="kb-fact">EU4Health</span> (2021-2027), dont le budget a été porté à <span class="kb-fact">5,1 milliards d'euros</span> (contre 1,7 milliard proposé initialement) ;</li>
<li>l'autorité <span class="kb-fact">HERA</span>, l'espace européen des données de santé et le plan pour vaincre le cancer, détaillés ci-dessous.</li>
</ul>
<p><b>HERA, l'autorité de préparation aux urgences sanitaires</b> Lancée en <span class="kb-fact">septembre 2021</span> comme direction générale à part entière de la Commission, HERA anticipe les menaces sanitaires transfrontières en phase de préparation (veille, analyse des risques, renforcement des capacités) et pilote, une fois une urgence déclarée, le développement, la production et l'achat centralisé de contre-mesures médicales (vaccins, médicaments, équipements). Son budget avoisine <span class="kb-fact">5 milliards d'euros</span> sur 2022-2027, financé par EU4Health, Horizon Europe et rescEU.</p>
<p><b>L'espace européen des données de santé (EHDS)</b> Proposé par la Commission en <span class="kb-fact">mai 2022</span>, il distingue deux usages : l'usage primaire, où chaque patient accède à son dossier médical et le partage dans toute l'UE via la plateforme « Ma Santé@UE » ; et l'usage secondaire, la réutilisation encadrée des données pour la recherche, l'innovation et les politiques publiques, avec des garanties de protection des données personnelles. Le règlement est publié au Journal officiel le <span class="kb-fact">5 mars 2025</span> et entre en vigueur le <span class="kb-fact">26 mars 2025</span>, pour une application progressive jusqu'en 2035. Économies attendues : environ <span class="kb-fact">11 milliards d'euros</span> sur dix ans.</p>
<p><b>Le plan européen pour vaincre le cancer</b> Présenté par la Commission le <span class="kb-fact">3 février 2021</span>, doté d'au moins <span class="kb-fact">4 milliards d'euros</span> (dont 1,25 milliard via EU4Health), il répond à un constat de 2020 : <span class="kb-fact">2,7 millions</span> de diagnostics de cancer et <span class="kb-fact">1,3 million</span> de décès dans l'UE, avec une hausse de 24 % des cas projetée d'ici 2035 en l'absence d'action. Il agit sur la prévention (environ 40 % des cancers sont jugés évitables), le dépistage (objectif de 90 % de la population éligible dépistée d'ici 2025 pour les cancers du sein, du col de l'utérus et colorectal), le diagnostic-traitement et la qualité de vie des patients. Le Parlement a de son côté adopté le rapport de sa commission spéciale BECA le <span class="kb-fact">16 février 2022</span>.</p>
<p>Un débat reste ouvert, mobilisable pour l'essai EUFTE. D'un côté, certains plaident pour élargir la compétence santé de l'UE, au nom de la solidarité et de l'efficacité face aux crises transfrontières révélées par le Covid. De l'autre, les États membres restent attachés à la logique de compétence d'appui : l'organisation et le financement de systèmes de santé très hétérogènes relèvent selon eux de la souveraineté nationale. Le même clivage traverse l'EHDS, entre ouverture des données pour la recherche et vigilance sur la vie privée et la maîtrise des données sensibles.</p>`},

{group:'theme', title:`Terrorisme et sécurité (UE)`, body:`
<p><b>Stratégie antiterroriste de l'UE.</b> Adoptée par le Conseil en <span class="kb-fact">2005</span>, elle repose sur quatre piliers : prévenir la radicalisation, protéger les citoyens et les infrastructures, poursuivre les auteurs par l'enquête et la justice, et réagir en cas d'attaque. Un coordinateur de la lutte antiterroriste suit sa mise en œuvre au niveau du Conseil. Selon le rapport annuel d'Europol (TE-SAT), l'UE a recensé <span class="kb-fact">120 attentats terroristes</span> en 2023 (menés, ratés ou déjoués), contre 28 en 2022, dont <span class="kb-fact">80 en France</span> et 30 en Italie ; <span class="kb-fact">426 arrestations</span> ont eu lieu dans 22 pays européens, le terrorisme djihadiste concentrant l'essentiel des victimes (6 morts, 12 blessés).</p>
<p><b>Europol.</b> Agence de l'UE pour la coopération des services répressifs, basée à La Haye, elle appuie les polices nationales par l'analyse de données et la coordination des enquêtes, sans pouvoir d'arrestation propre. Un règlement appliqué depuis <span class="kb-fact">juin 2022</span> a élargi ses compétences : réception directe de données transmises par des opérateurs privés sur des contenus terroristes, traitement de grands volumes de données, appui sur les nouvelles technologies. Des garanties encadrent cet élargissement : contrôle du Contrôleur européen de la protection des données, délégué aux droits fondamentaux, groupe de contrôle parlementaire mixte.</p>
<p><b>Échange d'informations entre polices.</b></p>
<ul>
<li><b>SIS</b> (système d'information Schengen) : base de données commune de signalements de personnes et d'objets, la plus utilisée des systèmes d'information de l'UE en matière de sécurité, refondue par les règlements <span class="kb-fact">(UE) 2018/1861</span> (vérifications aux frontières) et <span class="kb-fact">(UE) 2018/1862</span> (coopération policière et judiciaire).</li>
<li><b>Prüm / Prüm II</b> : cadre né du traité de Prüm de 2005, qui permet l'échange automatisé entre États membres de profils ADN, d'empreintes digitales et de données d'immatriculation des véhicules. Le règlement <span class="kb-fact">(UE) 2024/982</span>, dit « Prüm II », adopté le <span class="kb-fact">13 mars 2024</span>, modernise l'infrastructure technique et ajoute deux catégories de données : images faciales et fichiers de police.</li>
</ul>
<p><b>Directive PNR.</b> La directive <span class="kb-fact">(UE) 2016/681</span> du <span class="kb-fact">27 avril 2016</span> impose aux compagnies aériennes de transmettre les données des dossiers passagers (identité, itinéraire, bagages, moyens de paiement) pour les vols entrant ou sortant de l'UE à une unité d'information passagers (UIP) créée dans chaque État membre ; l'application aux vols intra-UE reste facultative pour chaque pays. Les données sont conservées <span class="kb-fact">5 ans</span>, avec dépersonnalisation des éléments identifiants au bout de <span class="kb-fact">6 mois</span>.</p>
<p><b>Cybersécurité : NIS2 et ENISA.</b> La directive <span class="kb-fact">(UE) 2022/2555</span>, dite NIS2, adoptée le <span class="kb-fact">14 décembre 2022</span>, fixe un socle commun d'obligations de gestion des risques et de notification des incidents pour les entités essentielles et importantes (énergie, transport, santé, numérique...) et devait être transposée par les États membres au plus tard le <span class="kb-fact">17 octobre 2024</span> ; elle remplace la première directive SRI de 2016. <span class="kb-fact">ENISA</span>, l'agence de l'UE pour la cybersécurité, créée en <span class="kb-fact">2004</span> et basée à Héraklion en Crète, fournit l'expertise technique, des recommandations et un appui à la coopération entre États membres dans la mise en œuvre de ce cadre.</p>
<p><b>Un débat pour l'essai.</b> La politique sécuritaire de l'UE se heurte régulièrement à la tension entre efficacité opérationnelle et protection des droits fondamentaux. Dans l'arrêt <span class="kb-fact">Ligue des droits humains</span> du <span class="kb-fact">21 juin 2022</span> (affaire <span class="kb-fact">C-817/19</span>), la Cour de justice de l'UE a jugé la directive PNR compatible avec la Charte des droits fondamentaux, tout en imposant une interprétation stricte au regard du droit au respect de la vie privée et à la protection des données. Certains y voient la confirmation qu'une collecte encadrée de données de voyage est proportionnée face à la menace terroriste ; d'autres estiment qu'une collecte systématique portant sur des millions de passagers non suspectés reste en tension avec le principe de proportionnalité, même sous contrôle du juge.</p>`},

{group:'theme', title:`Valeurs de l'UE : article 2 TUE, article 7 TUE et État de droit`, body:`
<p><b>Article 2 TUE.</b> Le texte énumère les valeurs sur lesquelles l'Union est fondée :</p>
<ul>
<li>la dignité humaine</li>
<li>la liberté</li>
<li>la démocratie</li>
<li>l'égalité</li>
<li>l'<span class="kb-fact">État de droit</span></li>
<li>le respect des droits de l'homme, y compris des droits des personnes appartenant à des minorités</li>
</ul>
<p>Le même article précise que ces valeurs sont communes aux États membres dans une société caractérisée par le pluralisme, la non-discrimination, la tolérance, la justice, la solidarité et l'égalité entre les femmes et les hommes. Leur respect conditionne l'adhésion d'un nouvel État à l'Union (article 49 TUE) et sert de fondement au mécanisme de l'article 7 en cas de violation par un État membre.</p>
<p><b>Article 7 TUE, deux mécanismes distincts.</b> Le volet préventif (paragraphe 1) permet au Conseil, sur proposition motivée d'un tiers des États membres, du Parlement européen ou de la Commission, de constater à la majorité des <span class="kb-fact">quatre cinquièmes</span> de ses membres, après consentement du Parlement européen, l'existence d'un risque clair de violation grave d'une valeur de l'article 2. Le volet de sanction (paragraphes 2 et 3) est plus lourd : c'est le <b>Conseil européen</b>, statuant à l'unanimité moins l'État visé, sur proposition d'un tiers des États ou de la Commission et après consentement du Parlement européen, qui doit constater une violation grave et persistante ; le Conseil peut alors, à la majorité qualifiée, décider de suspendre certains droits résultant des traités pour cet État, y compris son droit de vote au Conseil. L'obligation d'unanimité au Conseil européen rend cette seconde étape difficile à franchir en pratique.</p>
<p><b>Le règlement de conditionnalité État de droit.</b> Le règlement <span class="kb-fact">(UE, Euratom) 2020/2092</span>, adopté le <span class="kb-fact">16 décembre 2020</span> et applicable depuis le <span class="kb-fact">1er janvier 2021</span>, protège le budget de l'Union : il permet à la Commission de proposer, et au Conseil d'adopter à la majorité qualifiée, des mesures comme la suspension de paiements lorsqu'une violation de l'État de droit dans un État membre porte atteinte ou risque de porter atteinte à la bonne gestion financière du budget de l'UE. Ce mécanisme est distinct de l'article 7 : il ne demande pas l'unanimité et cible spécifiquement le lien avec les intérêts financiers de l'Union. La Hongrie et la Pologne ont contesté ce règlement devant la Cour de justice ; le <span class="kb-fact">16 février 2022</span>, la Cour réunie en assemblée plénière a rejeté leurs deux recours (affaires <span class="kb-fact">C-156/21</span> et <span class="kb-fact">C-157/21</span>) et validé le mécanisme.</p>
<p><b>Le rapport annuel sur l'État de droit.</b> Publié par la Commission depuis <span class="kb-fact">2020</span>, ce rapport passe en revue chaque année la situation dans les 27 États membres autour de quatre piliers : le système judiciaire, le cadre de lutte contre la corruption, le pluralisme des médias et les questions institutionnelles liées aux pouvoirs et contre-pouvoirs. L'édition <span class="kb-fact">2025</span>, publiée le <span class="kb-fact">8 juillet 2025</span>, est la sixième du genre ; elle couvre aussi quatre pays candidats (Albanie, Monténégro, Macédoine du Nord, Serbie) et rappelle que le respect de l'État de droit reste une condition attachée aux fonds de l'UE.</p>
<p><b>Exemples récents.</b></p>
<ul>
<li><b>Pologne</b> : procédure de l'article 7 paragraphe 1 ouverte par la Commission en <span class="kb-fact">décembre 2017</span> sur la réforme du système judiciaire, close en <span class="kb-fact">2024</span> après un changement de gouvernement et des mesures correctives.</li>
<li><b>Hongrie</b> : procédure de l'article 7 paragraphe 1 déclenchée par le <b>Parlement européen</b> lui-même en <span class="kb-fact">septembre 2018</span>, une première dans l'histoire de l'Union ; elle reste ouverte, sans passage à la phase de sanction faute d'unanimité au Conseil européen.</li>
<li><b>Conditionnalité appliquée à la Hongrie</b> : en 2022, le Conseil a gelé environ <span class="kb-fact">6,3 milliards d'euros</span> de fonds de cohésion et bloqué <span class="kb-fact">10,4 milliards d'euros</span> de la facilité pour la reprise et la résilience ; en <span class="kb-fact">décembre 2023</span>, la Commission a débloqué <span class="kb-fact">10,2 milliards d'euros</span> sur les quelque <span class="kb-fact">22 milliards</span> alloués à la Hongrie au titre des fonds de cohésion, quelques jours avant un sommet européen consacré notamment à l'ouverture des négociations d'adhésion de l'Ukraine.</li>
</ul>
<p><b>Un débat mobilisable pour l'essai.</b> Une partie des commentateurs jugent l'article 7 dissuasif sur le papier mais peu opérant en pratique, verrouillé par la règle de l'unanimité et par le soutien politique mutuel entre États visés, alors que la conditionnalité budgétaire, décidée à la majorité qualifiée, serait l'outil qui produit des effets concrets. D'autres objectent que cette conditionnalité financière expose l'Union à un risque de calcul politique, comme l'illustre le calendrier du déblocage des fonds hongrois fin 2023, ce qui nourrit la critique d'un traitement inégal entre États membres selon le contexte diplomatique du moment.</p>`},

{group:'theme', title:`Économie et budget`, body:`
<p><b>Le semestre européen</b> Institué en <span class="kb-fact">2011</span>, le semestre européen est le cycle annuel de coordination des politiques économiques, budgétaires, sociales et de l'emploi des États membres, avant l'adoption de leurs budgets nationaux. À l'automne, la Commission publie son rapport macroéconomique et son rapport sur le mécanisme d'alerte identifiant les déséquilibres ; au printemps, elle évalue les plans des États et propose des recommandations par pays ; en <span class="kb-fact">juin-juillet</span>, le Conseil les adopte formellement, ce qui clôt le cycle. Le Parlement européen n'y joue qu'un rôle consultatif (résolutions, semaine parlementaire européenne), la décision restant au Conseil sur proposition de la Commission.</p>

<p><b>La réforme de la gouvernance économique de 2024</b> Après la désactivation, fin 2023, de la clause dérogatoire générale ouverte pendant la pandémie, l'UE a révisé le <span class="kb-fact">pacte de stabilité et de croissance</span> : accord au Conseil le <span class="kb-fact">20 décembre 2023</span>, accord provisoire avec le Parlement les <span class="kb-fact">9 et 10 février 2024</span>, vote du Parlement le <span class="kb-fact">23 avril 2024</span> puis du Conseil le <span class="kb-fact">29 avril 2024</span>, entrée en vigueur le <span class="kb-fact">30 avril 2024</span> et application depuis le <span class="kb-fact">1er janvier 2025</span>. Les seuils de <span class="kb-fact">3 % du PIB</span> pour le déficit et <span class="kb-fact">60 % du PIB</span> pour la dette sont maintenus, mais chaque État négocie désormais avec la Commission un plan budgétaire et structurel national à moyen terme (4 ans, prolongeable à 7 en cas de réformes et d'investissements), fondé sur une trajectoire de dépenses nettes plutôt que sur le solde structurel. Les États les plus endettés doivent réduire leur dette d'au moins 1 point de PIB par an (0,5 point entre 60 % et 90 %). Les premiers plans étaient dus le <span class="kb-fact">20 septembre 2024</span>, et un train de simplification supplémentaire est en discussion depuis <span class="kb-fact">octobre 2025</span>.</p>

<p><b>Le cadre financier pluriannuel 2021-2027</b> Le CFP en cours s'élève à <span class="kb-fact">1 074,3 milliards d'euros</span> (prix 2018) en crédits d'engagement, réparti en sept rubriques dominées par la cohésion, la résilience et les valeurs (environ 378 milliards) et par les ressources naturelles et l'environnement (environ 356 milliards), rubrique qui finance notamment la politique agricole commune. Son adoption exige l'unanimité au Conseil et le consentement du Parlement européen, qui n'a pas le pouvoir d'amender les montants mais peut refuser l'ensemble du texte.</p>

<p><b>Le prochain CFP 2028-2034 : des négociations en cours</b> La Commission a présenté sa proposition le <span class="kb-fact">16 juillet 2025</span> : un plafond de <span class="kb-fact">1 763 milliards d'euros</span> (prix 2025), soit <span class="kb-fact">1,26 % du RNB</span> de l'Union en incluant le remboursement de NextGenerationEU, avec une architecture simplifiée en un nombre réduit de rubriques. Après l'appel du Conseil européen du <span class="kb-fact">18 décembre 2025</span> à accélérer les travaux, la présidence chypriote, entrée en fonction le <span class="kb-fact">1er janvier 2026</span>, a publié le <span class="kb-fact">11 juin 2026</span> sa première boîte de négociation chiffrée, discutée par le Conseil européen des <span class="kb-fact">18 et 19 juin 2026</span> ; l'objectif affiché reste un accord final avant la fin de <span class="kb-fact">2026</span>.</p>

<p><b>NextGenerationEU et la Facilité pour la reprise et la résilience</b> Adopté en 2020 pour financer la relance post-Covid, <span class="kb-fact">NextGenerationEU</span> autorise l'UE à emprunter jusqu'à <span class="kb-fact">750 milliards d'euros</span> (prix 2018, soit 806,9 milliards en prix courants). Sa composante principale, la <span class="kb-fact">Facilité pour la reprise et la résilience</span>, met jusqu'à <span class="kb-fact">723,8 milliards d'euros</span> (prix courants) de subventions et de prêts à disposition des États, conditionnés à des plans nationaux de réformes et d'investissements axés sur les transitions écologique et numérique. Le remboursement des emprunts s'étale jusqu'en 2058 et pèse déjà sur le budget annuel de l'Union.</p>

<p><b>Les ressources propres de l'UE</b> Le budget est financé par quatre ressources actuelles : les droits de douane (ressources propres traditionnelles), la ressource fondée sur la TVA, la ressource RNB, qui finance l'essentiel du budget, et la ressource plastique, entrée en vigueur le <span class="kb-fact">1er janvier 2021</span>. Pour financer le remboursement de NextGenerationEU sans alourdir les contributions nationales, la Commission a proposé dès 2021 un panier de nouvelles ressources (part des recettes du système d'échange de quotas d'émission, mécanisme d'ajustement carbone aux frontières) toujours en attente d'adoption par le Conseil ; en juillet 2025 elle y a ajouté une proposition élargie (recettes du MACF et du SEQE, déchets électroniques, accises sur le tabac, contribution des grandes entreprises). Le Parlement européen presse le Conseil d'adopter ces nouvelles ressources propres, qu'il juge indispensables.</p>

<p><b>Un débat non tranché</b> La nouvelle gouvernance économique et le futur CFP parviennent-ils à concilier discipline budgétaire et financement des priorités nouvelles (défense, compétitivité, transitions climatique et numérique) ? Pour les partisans de la rigueur, les seuils de 3 % et 60 % du PIB restent la seule garantie de soutenabilité de la dette dans une zone euro déjà très endettée. Pour leurs critiques, dont le Parlement européen, sans ressources propres nouvelles et suffisantes pour rembourser NextGenerationEU et alimenter le budget 2028-2034, les États membres devront soit réduire leurs investissements, soit accroître leurs contributions nationales.</p>`},

{group:'theme', title:`Éducation, jeunesse et culture`, body:`
<p><b>Compétence de l'UE et Espace européen de l'éducation :</b> l'éducation, la jeunesse, le sport et la culture restent des <b>compétences d'appui</b> (articles 165 à 167 TFUE). L'Union soutient, coordonne et complète l'action des <span class="kb-fact">27</span> États membres, sans harmoniser le contenu de l'enseignement ni l'organisation des systèmes éducatifs nationaux. Dans ce cadre, la Commission a lancé l'<b>Espace européen de l'éducation</b>, avec l'objectif de le réaliser d'ici <span class="kb-fact">2025</span> : accès égal à une éducation de qualité, mobilité des apprenants et des enseignants, réduction des obstacles à la reconnaissance des diplômes et des périodes d'études à l'étranger. Il s'appuie notamment sur Erasmus+, le Corps européen de solidarité et le processus de Bologne (espace européen de l'enseignement supérieur, système ECTS).</p>
<p><b>Erasmus+ (2021-2027) :</b> programme de l'Union pour l'éducation, la formation, la jeunesse et le sport, établi par le règlement (UE) <span class="kb-fact">2021/817</span>. Budget de <span class="kb-fact">26,2 milliards d'euros</span>, contre 14,7 milliards sur la période 2014-2020, complété par environ 2,2 milliards d'euros issus des instruments extérieurs de l'UE. Objectif annoncé : environ <span class="kb-fact">10 millions</span> de participants sur la période, autour de trois priorités transversales : inclusion, transition numérique, transition verte. Le programme finance aussi <b>DiscoverEU</b> (pass ferroviaire gratuit à 18 ans) et les alliances d'<b>universités européennes</b>.</p>
<p><b>Corps européen de solidarité (2021-2027) :</b> établi par le règlement (UE) <span class="kb-fact">2021/888</span>, ouvert aux jeunes de <span class="kb-fact">18 à 30 ans</span> pour le volontariat et les projets de solidarité, jusqu'à <span class="kb-fact">35 ans</span> pour le volet aide humanitaire (qui prolonge l'ancien Corps volontaire européen d'aide humanitaire). Budget d'environ <span class="kb-fact">1,01 milliard d'euros</span> sur la période, avec pour but de renforcer la cohésion et la citoyenneté active des jeunes en Europe.</p>
<p><b>Capitale européenne de la culture :</b> initiative née en <span class="kb-fact">1985</span> à l'origine de <span class="kb-fact">Melina Mercouri</span>, aujourd'hui encadrée par la décision n° <span class="kb-fact">445/2014/UE</span> qui couvre la période <span class="kb-fact">2020-2033</span>. Chaque année, deux villes portent le titre pendant un an, retenues par un jury d'experts indépendants ; la ville désignée peut recevoir le <b>prix Melina Mercouri</b> (<span class="kb-fact">1,5 million d'euros</span>, financé par Creative Europe). Titulaires <span class="kb-fact">2026</span> : <span class="kb-fact">Oulu</span> (Finlande) et <span class="kb-fact">Trenčín</span> (Slovaquie) ; en <span class="kb-fact">2027</span> : <span class="kb-fact">Évora</span> (Portugal) et <span class="kb-fact">Liepāja</span> (Lettonie).</p>
<p><b>Reconnaissance mutuelle des diplômes et qualifications :</b> régie par la directive <span class="kb-fact">2005/36/CE</span> (base juridique : article 53 TFUE), révisée en 2013 pour introduire notamment la carte professionnelle européenne. Deux régimes coexistent : la <b>reconnaissance automatique</b>, pour des professions dont la formation est harmonisée au niveau de l'UE (médecins, dentistes, infirmiers, vétérinaires, sages-femmes, pharmaciens, architectes), et un <b>régime général</b> pour les autres professions réglementées, où l'État d'accueil peut exiger une mesure de compensation (stage d'adaptation ou épreuve d'aptitude) si la formation diffère substantiellement. Ce régime porte sur les qualifications professionnelles ; pour les diplômes académiques, une recommandation du Conseil du <span class="kb-fact">26 novembre 2018</span> pousse les États vers une reconnaissance automatique mutuelle des diplômes de l'enseignement supérieur et secondaire, un chantier concret de l'Espace européen de l'éducation.</p>
