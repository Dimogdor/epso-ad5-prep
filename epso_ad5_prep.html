{q:`Une mise en forme conditionnelle sert à :`,opts:[`Changer l'apparence des cellules selon la valeur qu'elles contiennent`,`Empêcher la saisie de données`,`Créer un graphique`,`Verrouiller une feuille`],c:0,ex:`Elle rend visible un seuil ou une anomalie sans modifier la donnée.`},
{q:`Quel type de graphique convient le mieux pour montrer l'évolution d'une valeur dans le temps ?`,opts:[`Une courbe`,`Un camembert`,`Un nuage de points sans axe temporel`,`Un histogramme empilé à 100 %`],c:0,ex:`Le camembert montre une répartition à un instant donné, pas une évolution.`},

/* --- Traitement de texte et documents --- */
{q:`Pourquoi utiliser des styles de titre plutôt que de mettre le texte en gras à la main ?`,opts:[`Ils permettent la table des matières automatique, la navigation et l'accessibilité`,`Ils réduisent la taille du fichier`,`Ils empêchent la modification du document`,`Ils sont obligatoires en droit de l'Union`],c:0,ex:`Les styles portent la structure logique du document, exploitée par les sommaires et les lecteurs d'écran.`},
{q:`Le suivi des modifications dans un traitement de texte permet surtout :`,opts:[`De voir qui a modifié quoi et d'accepter ou refuser chaque changement`,`De chiffrer le document`,`De compresser les images`,`De verrouiller la mise en page`],c:0,ex:`C'est l'outil de base du travail rédactionnel à plusieurs.`},
{q:`Le format PDF/A se distingue d'un PDF ordinaire parce qu'il est conçu pour :`,opts:[`L'archivage à long terme, avec polices et ressources embarquées`,`L'impression haute définition uniquement`,`Les formulaires interactifs`,`La lecture sur mobile`],c:0,ex:`PDF/A interdit les dépendances externes pour que le document reste lisible dans plusieurs décennies.`},
{q:`Le publipostage (mail merge) sert à :`,opts:[`Générer un document personnalisé par destinataire à partir d'une source de données`,`Envoyer un même email à une liste cachée`,`Fusionner deux fichiers PDF`,`Trier un carnet d'adresses`],c:0,ex:`Un modèle plus un tableau de données donne autant de documents que de lignes.`},
{q:`Que sont les métadonnées d'un fichier bureautique ?`,opts:[`Des informations sur le fichier, comme l'auteur ou l'historique, souvent invisibles à l'écran`,`Le texte du document`,`Les images intégrées`,`Le format d'enregistrement`],c:0,ex:`Elles peuvent divulguer un nom d'auteur ou un commentaire oublié : il faut les nettoyer avant diffusion externe.`},
{q:`Le format ODF (OpenDocument) présente l'avantage d'être :`,opts:[`Un standard ouvert, non lié à un éditeur unique`,`Plus compact que tous les autres formats`,`Réservé aux administrations`,`Illisible sans licence`],c:0,ex:`Les institutions européennes privilégient les formats ouverts pour l'interopérabilité et la pérennité.`},

/* --- Recherche et web --- */
{q:`Dans un moteur de recherche, mettre une expression entre guillemets permet de :`,opts:[`Chercher l'expression exacte`,`Exclure l'expression`,`Chercher un synonyme`,`Limiter à un site`],c:0,ex:`L'opérateur site: limite à un domaine, le tiret exclut un terme.`},
{q:`Que fait l'opérateur site:europa.eu dans une recherche ?`,opts:[`Il restreint les résultats à ce domaine`,`Il exclut ce domaine`,`Il cherche le mot europa`,`Il trie par date`],c:0,ex:`Utile pour retrouver un document officiel sans passer par le moteur interne d'un site.`},
{q:`Le protocole HTTPS garantit avant tout :`,opts:[`Le chiffrement de la communication entre le navigateur et le serveur`,`Que le contenu du site est véridique`,`Que le site respecte le RGPD`,`Que le site n'utilise pas de cookies`],c:0,ex:`Le cadenas dit que la liaison est chiffrée, pas que le site est honnête. Un site de hameçonnage peut être en HTTPS.`},
{q:`Dans l'adresse https://ec.europa.eu/info/index_fr.htm, quel élément est le nom de domaine ?`,opts:[`ec.europa.eu`,`https`,`/info/`,`index_fr.htm`],c:0,ex:`Vérifier le domaine, et surtout sa fin, est le premier réflexe contre le hameçonnage.`},
{q:`À quoi sert le DNS ?`,opts:[`À traduire un nom de domaine en adresse IP`,`À chiffrer le trafic`,`À bloquer les publicités`,`À stocker les cookies`],c:0,ex:`C'est l'annuaire de l'internet : sans lui, il faudrait retenir les adresses numériques.`},
{q:`Une bulle de filtre désigne :`,opts:[`L'enfermement progressif dans des contenus conformes à ses opinions, par personnalisation algorithmique`,`Un filtre antispam`,`Un pare-feu applicatif`,`Un cache de navigateur`],c:0,ex:`Notion centrale du domaine 1 : la personnalisation réduit l'exposition aux points de vue divergents.`},
{q:`Face à une information virale non sourcée, la première démarche est :`,opts:[`De remonter à la source primaire et de la recouper`,`De la partager en demandant confirmation`,`De vérifier le nombre de partages`,`De consulter les commentaires`],c:0,ex:`Partager pour vérifier amplifie l'information avant de l'avoir validée.`},
{q:`La recherche d'image inversée sert principalement à :`,opts:[`Retrouver l'origine et les usages antérieurs d'une image`,`Améliorer la résolution d'une image`,`Convertir une image en texte`,`Supprimer les métadonnées`],c:0,ex:`Outil de base pour détecter une photo ancienne recyclée dans un contexte trompeur.`},

/* --- Sécurité --- */
{q:`La règle de sauvegarde dite 3-2-1 recommande :`,opts:[`3 copies, sur 2 supports différents, dont 1 hors site`,`3 mots de passe, 2 comptes, 1 sauvegarde`,`3 sauvegardes par jour pendant 2 semaines`,`3 utilisateurs, 2 serveurs, 1 pare-feu`],c:0,ex:`La copie hors site protège contre l'incendie, le vol et le rançongiciel qui chiffre le réseau local.`},
{q:`Quel est l'intérêt principal d'un gestionnaire de mots de passe ?`,opts:[`Permettre un mot de passe unique et long par service, sans les mémoriser`,`Rendre les mots de passe plus courts`,`Supprimer le besoin d'authentification`,`Partager ses accès plus facilement`],c:0,ex:`Il casse la réutilisation du même mot de passe, qui transforme une fuite en compromission généralisée.`},
{q:`Qu'est-ce qu'une vulnérabilité de type « zero-day » ?`,opts:[`Une faille exploitée avant qu'un correctif ne soit disponible`,`Une faille vieille de moins d'un an`,`Un virus qui se déclenche à minuit`,`Une panne matérielle`],c:0,ex:`L'éditeur a zéro jour d'avance : d'où l'importance des mesures qui ne dépendent pas d'un correctif.`},
{q:`L'ingénierie sociale consiste à :`,opts:[`Manipuler une personne pour obtenir un accès ou une information`,`Analyser les réseaux sociaux`,`Concevoir une interface utilisateur`,`Cartographier un réseau informatique`],c:0,ex:`Elle vise l'humain, pas la machine : aucune mise à jour ne corrige cette faille.`},
{q:`Brancher une clé USB trouvée sur un parking est risqué parce que :`,opts:[`Elle peut contenir un logiciel malveillant ou se faire passer pour un clavier`,`Elle peut être trop lente`,`Elle risque d'être formatée`,`Elle consomme de la batterie`],c:0,ex:`Certaines clés piégées émulent un clavier et tapent des commandes dès le branchement.`},
{q:`Le chiffrement du disque d'un ordinateur portable protège surtout contre :`,opts:[`La lecture des données en cas de vol de la machine`,`Les virus`,`Le hameçonnage`,`La panne du disque`],c:0,ex:`Il protège les données au repos ; il ne remplace ni l'antivirus ni la sauvegarde.`},
{q:`Un pare-feu (firewall) a pour fonction de :`,opts:[`Filtrer les connexions entrantes et sortantes selon des règles`,`Détecter et supprimer les virus`,`Chiffrer les fichiers`,`Sauvegarder les données`],c:0,ex:`Il contrôle le trafic réseau ; c'est l'antivirus qui analyse les fichiers.`},
{q:`Que doit-on faire en premier si l'on soupçonne avoir cliqué sur un lien de hameçonnage au travail ?`,opts:[`Signaler immédiatement l'incident au service informatique`,`Supprimer l'email et ne rien dire`,`Changer seulement son fond d'écran`,`Attendre de voir si un problème survient`],c:0,ex:`Le délai de signalement conditionne la capacité à limiter la propagation. Le silence est le pire choix.`},
{q:`Un rançongiciel se distingue d'un logiciel espion parce qu'il :`,opts:[`Rend les données inaccessibles et exige un paiement`,`Copie discrètement les frappes clavier`,`Affiche des publicités`,`Ralentit le processeur`],c:0,ex:`Le premier bloque, le second observe sans se faire remarquer.`},
{q:`Pourquoi ne faut-il pas réutiliser le même mot de passe sur plusieurs sites ?`,opts:[`Une seule fuite permet alors d'accéder à tous les comptes`,`Cela ralentit la connexion`,`Les sites l'interdisent`,`Cela sature le gestionnaire de mots de passe`],c:0,ex:`Les listes d'identifiants fuités sont rejouées automatiquement sur d'autres services.`},
{q:`Le sigle ENISA désigne :`,opts:[`L'Agence de l'Union européenne pour la cybersécurité`,`L'autorité européenne de protection des données`,`Le régulateur européen des télécoms`,`Un standard de chiffrement`],c:0,ex:`Basée en Grèce, elle appuie les États membres et la Commission en matière de cybersécurité.`},
{q:`Un certificat de site expiré signifie que :`,opts:[`L'identité du serveur n'est plus vérifiée par une autorité, la prudence s'impose`,`Le site a été piraté`,`Le site est illégal`,`Le contenu est erroné`],c:0,ex:`Souvent une négligence administrative, mais impossible à distinguer d'une interception : on ne saisit rien de sensible.`},

/* --- RGPD et protection des données --- */
{q:`Le RGPD s'applique depuis quelle date ?`,opts:[`Le 25 mai 2018`,`Le 1er janvier 2016`,`Le 25 mai 2016`,`Le 1er janvier 2020`],c:0,ex:`Adopté en 2016 (règlement 2016/679), il est devenu applicable après deux ans de transition, le 25 mai 2018.`},
{q:`En cas de violation de données personnelles, sous quel délai le responsable de traitement doit-il notifier l'autorité de contrôle ?`,opts:[`72 heures`,`24 heures`,`7 jours`,`1 mois`],c:0,ex:`72 heures après en avoir pris connaissance, sauf si la violation est peu susceptible d'engendrer un risque.`},
{q:`Combien de bases légales le RGPD prévoit-il pour un traitement de données ?`,opts:[`Six`,`Deux`,`Quatre`,`Dix`],c:0,ex:`Consentement, contrat, obligation légale, intérêts vitaux, mission d'intérêt public, intérêt légitime.`},
{q:`Quelle est la différence entre responsable de traitement et sous-traitant au sens du RGPD ?`,opts:[`Le premier détermine les finalités et les moyens, le second agit pour son compte`,`Le premier est public, le second privé`,`Le premier collecte, le second héberge`,`Il n'y a aucune différence juridique`],c:0,ex:`La qualification dépend du pouvoir de décision sur le traitement, pas de la nature de l'organisme.`},
{q:`Une analyse d'impact relative à la protection des données (AIPD) est obligatoire :`,opts:[`Quand le traitement est susceptible d'engendrer un risque élevé pour les droits et libertés`,`Pour tout traitement, sans exception`,`Uniquement dans le secteur public`,`Uniquement en cas de transfert hors UE`],c:0,ex:`Article 35 : le critère est le risque élevé, apprécié notamment pour la surveillance systématique ou les données sensibles.`},
{q:`Le principe de minimisation des données impose :`,opts:[`De ne collecter que les données adéquates et nécessaires à la finalité`,`De supprimer les données tous les ans`,`De chiffrer toutes les données`,`De limiter le nombre d'utilisateurs`],c:0,ex:`Collecter au cas où est contraire au RGPD : la finalité détermine le périmètre.`},
{q:`Quel organe supervise le traitement des données personnelles par les institutions de l'Union elles-mêmes ?`,opts:[`Le Contrôleur européen de la protection des données`,`Le Comité européen de la protection des données`,`La Cour des comptes européenne`,`Le Médiateur européen`],c:0,ex:`Le CEPD contrôle les institutions ; le Comité (CEPD au sens de l'article 68) réunit les autorités nationales.`},
{q:`Le montant maximal des amendes prévues par le RGPD peut atteindre :`,opts:[`20 millions d'euros ou 4 % du chiffre d'affaires annuel mondial, le montant le plus élevé étant retenu`,`1 million d'euros`,`10 % du chiffre d'affaires national`,`Un montant fixé par chaque État membre`],c:0,ex:`Deux plafonds existent : 10 M€ ou 2 % pour certains manquements, 20 M€ ou 4 % pour les plus graves.`},
{q:`Le consentement au sens du RGPD doit notamment être :`,opts:[`Libre, spécifique, éclairé et univoque`,`Écrit et signé`,`Renouvelé chaque mois`,`Donné devant témoin`],c:0,ex:`Une case pré-cochée ou un consentement groupé pour des finalités multiples ne remplit pas ces conditions.`},
{q:`Le droit à l'effacement au sens du RGPD :`,opts:[`N'est pas absolu et cède notamment devant une obligation légale de conservation`,`S'applique en toutes circonstances`,`Ne concerne que les moteurs de recherche`,`Suppose l'accord du sous-traitant`],c:0,ex:`Article 17 : plusieurs exceptions existent, dont l'obligation légale et la liberté d'expression.`},
{q:`La désignation d'un délégué à la protection des données est obligatoire notamment :`,opts:[`Pour les autorités et organismes publics`,`Pour toute entreprise de plus de dix salariés`,`Pour tout site internet`,`Uniquement sur demande de l'autorité de contrôle`],c:0,ex:`Également en cas de suivi systématique à grande échelle ou de traitement à grande échelle de données sensibles.`},

/* --- Acquis numérique de l'Union --- */
{q:`Le règlement sur les services numériques (DSA) qualifie de très grande plateforme un service atteignant :`,opts:[`45 millions d'utilisateurs actifs mensuels dans l'Union`,`10 millions d'utilisateurs`,`100 millions d'utilisateurs`,`1 million d'utilisateurs`],c:0,ex:`45 millions, soit environ 10 % de la population de l'Union. Ce seuil déclenche des obligations renforcées.`},
{q:`Le règlement sur les marchés numériques (DMA) vise :`,opts:[`Les grandes plateformes qualifiées de contrôleurs d'accès`,`Tous les commerçants en ligne`,`Les seuls réseaux sociaux`,`Les fournisseurs d'accès à internet`],c:0,ex:`Il impose des obligations ex ante aux gatekeepers pour rétablir la contestabilité des marchés numériques.`},
{q:`Parmi les seuils quantitatifs de désignation d'un contrôleur d'accès au titre du DMA figure :`,opts:[`45 millions d'utilisateurs finaux actifs par mois et 10 000 entreprises utilisatrices par an dans l'Union`,`1 million d'utilisateurs et 100 entreprises`,`Un chiffre d'affaires mondial supérieur à 500 millions d'euros`,`Une présence dans au moins cinq États membres`],c:0,ex:`S'y ajoute un critère financier : 7,5 milliards d'euros de chiffre d'affaires dans l'EEE ou 75 milliards de capitalisation.`},
{q:`Le règlement sur l'intelligence artificielle repose sur :`,opts:[`Une approche par les risques, du risque inacceptable au risque minimal`,`Une interdiction générale de l'IA générative`,`Une autorisation préalable pour tout système d'IA`,`Un régime purement volontaire`],c:0,ex:`Quatre niveaux : inacceptable (interdit), élevé (encadré), limité (transparence), minimal (libre).`},
{q:`Le règlement sur l'intelligence artificielle est entré en vigueur :`,opts:[`Le 1er août 2024, avec une application échelonnée`,`Le 1er janvier 2023, d'un seul bloc`,`Le 25 mai 2018`,`Il n'est pas encore adopté`],c:0,ex:`Interdictions applicables depuis février 2025, obligations sur les modèles à usage général depuis août 2025, gros du texte en août 2026.`},
{q:`Parmi les pratiques interdites par le règlement sur l'intelligence artificielle figure :`,opts:[`La notation sociale des personnes par les autorités publiques`,`Tout usage de la reconnaissance vocale`,`Les systèmes de recommandation`,`Les assistants de rédaction`],c:0,ex:`Sont aussi visées la manipulation exploitant des vulnérabilités et, sous réserve d'exceptions, l'identification biométrique à distance en temps réel à des fins répressives.`},
{q:`La directive NIS2 porte sur :`,opts:[`Un niveau élevé commun de cybersécurité pour les entités essentielles et importantes`,`La protection des données personnelles`,`Le commerce électronique`,`Les droits d'auteur`],c:0,ex:`Elle élargit fortement le champ sectoriel par rapport à NIS1 et renforce les obligations de gestion du risque et de notification.`},
{q:`Le portefeuille européen d'identité numérique est issu de la révision de quel cadre ?`,opts:[`eIDAS`,`Le RGPD`,`Le DSA`,`Le code des communications électroniques`],c:0,ex:`Le règlement eIDAS 2 prévoit que chaque État membre propose un portefeuille d'identité numérique à ses citoyens.`},
{q:`Le règlement sur les données (Data Act) porte principalement sur :`,opts:[`L'accès et le partage des données générées par les objets connectés`,`La protection des données personnelles`,`Le contenu illicite en ligne`,`Le droit d'auteur`],c:0,ex:`Il facilite aussi le changement de fournisseur de services de traitement de données, donc la portabilité dans le nuage.`},
{q:`La directive sur l'accessibilité des sites internet du secteur public impose :`,opts:[`Des sites et applications perceptibles, utilisables, compréhensibles et robustes`,`Un site en 24 langues`,`Un hébergement dans l'Union`,`Une version imprimable de chaque page`],c:0,ex:`Ces quatre principes sont ceux des règles WCAG, référence technique de l'accessibilité numérique.`},
{q:`Parmi les objectifs de la décennie numérique à l'horizon 2030 figure :`,opts:[`80 % des adultes dotés de compétences numériques de base`,`100 % des adultes titulaires d'un diplôme informatique`,`La fin des services publics en présentiel`,`Un fournisseur de cloud européen unique`],c:0,ex:`S'y ajoutent 20 millions de spécialistes des TIC, la couverture gigabit de tous les foyers et l'usage du nuage, des données massives ou de l'IA par 75 % des entreprises.`},
{q:`Le règlement sur la cyberrésilience impose des exigences de sécurité :`,opts:[`Aux produits comportant des éléments numériques, tout au long de leur cycle de vie`,`Aux seuls sites gouvernementaux`,`Aux réseaux sociaux`,`Aux fournisseurs d'accès uniquement`],c:0,ex:`Il vise le matériel et le logiciel mis sur le marché, avec des obligations de correctifs pendant une durée déterminée.`},
{q:`Que garantit une licence de données ouvertes appliquée à une base publique ?`,opts:[`Sa réutilisation libre, y compris commerciale, sous conditions d'attribution`,`Sa gratuité pour les seuls chercheurs`,`Son caractère anonyme`,`Son exactitude`],c:0,ex:`L'ouverture porte sur les conditions juridiques de réutilisation, pas sur la qualité de la donnée.`},

/* --- Collaboration et communication --- */
{q:`Envoyer un message à une longue liste externe en mettant les adresses en copie visible :`,opts:[`Divulgue les adresses de tous les destinataires entre eux`,`Accélère l'envoi`,`Améliore la délivrabilité`,`Est requis par le RGPD`],c:0,ex:`Il faut utiliser la copie cachée : c'est une violation de données courante et facilement évitable.`},
{q:`Dans un espace de travail partagé, accorder à un collègue un droit de commentaire plutôt que d'édition permet :`,opts:[`Qu'il puisse suggérer sans modifier le document lui-même`,`Qu'il puisse seulement lire`,`Qu'il devienne propriétaire du fichier`,`De verrouiller le document`],c:0,ex:`La gradation lecture, commentaire, édition, propriété est le principe du moindre privilège appliqué aux documents.`},
{q:`Le principe du moindre privilège consiste à :`,opts:[`N'accorder que les droits strictement nécessaires à la tâche`,`Donner tous les droits aux cadres`,`Restreindre l'accès aux seuls informaticiens`,`Supprimer les comptes inactifs`],c:0,ex:`Il limite l'ampleur des dégâts quand un compte est compromis.`},
{q:`Travailler simultanément à plusieurs sur un même document en ligne évite surtout :`,opts:[`La prolifération de versions divergentes envoyées par pièce jointe`,`Les fautes d'orthographe`,`Les pannes réseau`,`Le besoin de sauvegarde`],c:0,ex:`Une source unique de vérité remplace le ballet des versions finale, finale2, finale_corrigee.`},
{q:`Un calendrier partagé indiquant la disponibilité sans le détail des rendez-vous illustre :`,opts:[`Un compromis entre coopération et protection de la vie privée`,`Une faille de sécurité`,`Une obligation du RGPD`,`Une limite technique`],c:0,ex:`Le partage gradué de l'information est une compétence du domaine communication et collaboration.`},
{q:`La netiquette recommande, dans un courriel professionnel :`,opts:[`Un objet explicite et un message adapté au destinataire`,`Des majuscules pour insister`,`Une réponse à tous systématique`,`Des pièces jointes volumineuses plutôt qu'un lien`],c:0,ex:`Les majuscules équivalent à crier ; le lien vers un espace partagé évite de saturer les boîtes.`},
{q:`Une signature électronique qualifiée au sens du droit de l'Union :`,opts:[`A un effet juridique équivalent à celui d'une signature manuscrite`,`N'a aucune valeur probante`,`Vaut uniquement entre entreprises`,`Est réservée aux administrations`],c:0,ex:`C'est le niveau le plus élevé prévu par eIDAS, au-dessus de la signature simple et de la signature avancée.`},

/* --- Contenu, droit d'auteur, accessibilité --- */
{q:`Une licence Creative Commons « ND » (No Derivatives) interdit :`,opts:[`La diffusion d'une version modifiée de l'œuvre`,`Toute reproduction`,`L'usage commercial`,`La citation`],c:0,ex:`ND autorise le partage à l'identique de l'œuvre entière, mais pas la publication d'adaptations.`},
{q:`Le domaine public en droit d'auteur désigne :`,opts:[`Les œuvres dont les droits patrimoniaux ont expiré`,`Tout contenu accessible gratuitement en ligne`,`Les contenus publiés par une administration`,`Les images sans filigrane`],c:0,ex:`Accessible ne veut pas dire libre de droits : la gratuité d'accès ne dit rien du statut juridique.`},
{q:`Ajouter un texte alternatif à une image sert d'abord à :`,opts:[`Permettre aux lecteurs d'écran de décrire l'image aux personnes déficientes visuelles`,`Améliorer la qualité de l'image`,`Réduire le poids du fichier`,`Protéger le droit d'auteur`],c:0,ex:`Effet secondaire utile : le texte alternatif est aussi lu par les moteurs de recherche.`},
{q:`Un contraste insuffisant entre le texte et le fond d'une page pose surtout un problème :`,opts:[`D'accessibilité pour les personnes malvoyantes`,`De temps de chargement`,`De compatibilité navigateur`,`De référencement`],c:0,ex:`Les règles WCAG fixent des ratios de contraste minimaux selon la taille du texte.`},
{q:`Un fichier PDF constitué d'images scannées sans couche texte :`,opts:[`N'est ni cherchable ni lisible par un lecteur d'écran sans reconnaissance de caractères`,`Est plus léger qu'un PDF texte`,`Est automatiquement accessible`,`Ne peut pas être imprimé`],c:0,ex:`La reconnaissance optique de caractères ajoute la couche texte qui rend le document exploitable.`},
{q:`Comparé au format JPEG, le format PNG est préférable pour :`,opts:[`Les captures d'écran et les images comportant du texte ou de la transparence`,`Les photographies`,`Les vidéos`,`Les fichiers audio`],c:0,ex:`Le PNG est sans perte ; le JPEG compresse en dégradant, ce qui rend le texte flou.`},

/* --- Résolution de problèmes --- */
{q:`Face à un logiciel qui ne répond plus, la démarche méthodique consiste à :`,opts:[`Isoler le problème en testant une hypothèse à la fois`,`Réinstaller le système d'exploitation`,`Changer d'ordinateur`,`Attendre la prochaine mise à jour`],c:0,ex:`Reproduire, isoler, tester, documenter : c'est le cœur du domaine résolution de problèmes.`},
{q:`Une capture d'écran accompagnant une demande d'assistance sert surtout à :`,opts:[`Transmettre le message d'erreur exact et le contexte`,`Prouver sa bonne foi`,`Accélérer le ticket automatiquement`,`Contourner le support de premier niveau`],c:0,ex:`Un message d'erreur reformulé de mémoire fait perdre du temps au diagnostic.`},
{q:`Le stockage dans le nuage dispense-t-il de sauvegarder ?`,opts:[`Non, car une suppression ou un chiffrement malveillant se synchronise aussi`,`Oui, la redondance suffit`,`Oui, si le fournisseur est européen`,`Oui, au-delà d'un certain volume`],c:0,ex:`La synchronisation n'est pas une sauvegarde : elle propage l'erreur au lieu de la conserver.`},
{q:`Face au résultat d'un outil d'IA générative sur un point de droit, il faut :`,opts:[`Vérifier chaque référence dans une source primaire`,`Le reprendre tel quel s'il est bien rédigé`,`Le rejeter systématiquement`,`Demander une seconde réponse au même outil`],c:0,ex:`Ces modèles produisent des références plausibles mais inexistantes ; la fluidité du texte ne dit rien de son exactitude.`},
{q:`Un biais algorithmique désigne :`,opts:[`Un résultat systématiquement défavorable à un groupe, souvent hérité des données d'entraînement`,`Une erreur de programmation aléatoire`,`Un ralentissement du traitement`,`Une faille de sécurité`],c:0,ex:`Le système reproduit et amplifie les régularités des données, y compris les discriminations qu'elles contiennent.`},

const DEFAULT_PROGRESS = ()=>({
  verbal:{att:0,cor:0}, numeric:{att:0,cor:0}, abstract:{att:0,cor:0},
  euknow:{att:0,cor:0}, digital:{att:0,cor:0}, eufte:{sessions:0},
  streak:{count:0,last:null}, firstVisit:new Date().toISOString().slice(0,10)
});
let PROGRESS = DEFAULT_PROGRESS();
async function loadProgress(){
  try{
    const r = await window.storage.get('epso-progress');
    if(r && r.value) PROGRESS = Object.assign(DEFAULT_PROGRESS(), JSON.parse(r.value));
  }catch(e){ PROGRESS = DEFAULT_PROGRESS(); }
  updateStreak(); renderStreak();
}
async function saveProgress(){ try{ await window.storage.set('epso-progress', JSON.stringify(PROGRESS)); }catch(e){} }
function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  const last = PROGRESS.streak.last;
  if(last === today) return;
  if(last){
    const diffDays = Math.round((new Date(today)-new Date(last))/86400000);
    PROGRESS.streak.count = (diffDays===1) ? PROGRESS.streak.count+1 : 1;
  } else PROGRESS.streak.count = 1;
  PROGRESS.streak.last = today; saveProgress();
}
function renderStreak(){ document.getElementById('streakN').textContent = PROGRESS.streak.count; }
function acc(m){ const s=PROGRESS[m]; return s.att>0 ? Math.round(100*s.cor/s.att) : null; }
function shuffle(a){ const arr=a.slice(); for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
/* ponytail: les banques ecrites a la main placaient la bonne reponse en B dans la
   grande majorite des cas. On permute les options a l'affichage plutot que de
   reecrire chaque entree : la position de la bonne reponse change a chaque session. */
function shuffleOpts(item){ const p=shuffle(item.opts.map((_,i)=>i)); return {opts:p.map(i=>item.opts[i]), c:p.indexOf(item.c)}; }
function fmtTime(s){ if(s<0) s=0; const m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }

/* ================= MODALITÉS RÉELLES DU CONCOURS =================
   Source : avis de concours EPSO/AD/427/26 (JO C/2026/711).
   Une seule source de vérité pour le nombre de questions et le rythme,
   afin que les chronos, les libellés et les tableaux restent concordants.
   Chaque session utilise un chrono GLOBAL (comme au concours), pas un
   chrono par question. Si la banque contient moins de questions que le
   test réel, la session est réduite mais garde le rythme réel. */
const VERB_COUNT=20, VERB_SEC=105;  // 20 textes / 35 min
const NUM_COUNT=10,  NUM_SEC=120;   // 10 questions / 20 min
const ABS_COUNT=10,  ABS_SEC=60;    // 10 questions / 10 min
const EU_COUNT=30,   EU_SEC=80;     // 30 questions / 40 min, seuil 15/30
const DIG_COUNT=40,  DIG_SEC=45;    // 40 questions / 30 min, seuil 20/40

/* ================= MOTEUR QCM ================= */
function runQCMSession(bank, statKey, secPerQ, title, ep, backTo, maxQ){
  const app = document.getElementById('app');
  const count = Math.min(maxQ || bank.length, bank.length);
  let order = shuffle(bank.map((_,i)=>i)).slice(0, count);
  let idx=0, score=0, answered=false, timer=null, timeLeft=order.length*secPerQ, ended=false, view=null;

  // ponytail: one countdown for the whole session, like the real exam. Paused while the
  // correction is on screen (the real test has no correction to read, so reading it
  // shouldn't eat the budget), resumed on "Suivant".
  function startClock(){
    clearInterval(timer);
    timer = ACTIVE_TIMER = setInterval(()=>{
      timeLeft--; const t=document.getElementById('tmr');
      if(t){ t.textContent=fmtTime(timeLeft); if(timeLeft<=30) t.classList.add('low'); }
      if(timeLeft<=0){ clearInterval(timer); endSession(true); }
    },1000);
  }
  function renderQ(){
    answered=false;
    const item = bank[order[idx]];
    view = shuffleOpts(item);
    app.innerHTML = '<div class="card">'
      +'<div class="section-title"><span class="eyebrow">'+ep+' · '+title+'</span><span style="font-family:var(--mono);font-size:12px;color:var(--ink-soft);">'+(idx+1)+' / '+order.length+'</span></div>'
      +'<div class="timer-wrap"><span class="timer-txt" id="tmr">'+fmtTime(timeLeft)+'</span><span class="session-score">Score session : '+score+'/'+idx+'</span></div>'
      +'<div class="qcm-question">'+item.q+'</div>'
      +'<div id="opts">'+view.opts.map((o,i)=>'<button class="qcm-opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>'
      +'<div id="fb"></div>'
      +'<button class="btn wide hidden" id="nextBtn" style="margin-top:12px;">Suivant →</button></div>'
      +'<button class="btn ghost wide" id="exitBtn">Quitter la session</button>';
    document.getElementById('exitBtn').addEventListener('click',()=>goTo(backTo));
    app.querySelectorAll('.qcm-opt').forEach(b=>b.addEventListener('click',()=>submit(parseInt(b.dataset.i))));
    document.getElementById('nextBtn').addEventListener('click',()=>{
      idx++;
      if(idx<order.length){ renderQ(); startClock(); } else { endSession(false); }
    });
  }
  function submit(choice){
    if(answered) return; answered=true; clearInterval(timer);
    const item = bank[order[idx]];
    const ok = choice===view.c;
    if(ok) score++;
    PROGRESS[statKey].att++; if(ok) PROGRESS[statKey].cor++;
    saveProgress(); renderStreak();
    app.querySelectorAll('.qcm-opt').forEach((b,i)=>{
      b.disabled=true;
      if(i===view.c) b.classList.add('correct');
      else if(i===choice) b.classList.add('incorrect');
    });
    document.getElementById('fb').innerHTML = '<div class="feedback '+(ok?'ok':'no')+'">'+(ok?'✓ Correct. ':'✗ Incorrect. ')+(item.ex||'')+'</div>';
    document.getElementById('nextBtn').classList.remove('hidden');
  }
  function endSession(timedOut){
    if(ended) return; ended=true;
    clearInterval(timer);
    app.innerHTML = '<div class="card session-end"><span class="eyebrow">'+(timedOut?'Temps écoulé':'Session terminée')+'</span><div class="n">'+score+'/'+order.length+'</div>'
      +(timedOut?'<p style="color:var(--wine);">Le temps imparti est écoulé : '+(order.length-idx)+' question(s) non traitée(s).</p>':'')
      +'<p style="color:var(--ink-soft);">Statistiques cumulées mises à jour.</p>'
      +'<button class="btn" id="againBtn">Refaire une session</button>'
      +'<button class="btn ghost" id="backBtn" style="margin-top:8px;">Retour</button></div>';
    document.getElementById('againBtn').addEventListener('click',()=>{
      order=shuffle(bank.map((_,i)=>i)).slice(0,count); idx=0; score=0; timeLeft=order.length*secPerQ; ended=false;
      renderQ(); startClock();
    });
    document.getElementById('backBtn').addEventListener('click',()=>goTo(backTo));
  }
  renderQ();
  startClock();
}

        <li><b>NE PEUT PAS DIRE</b> : le texte ne permet ni de confirmer ni d'infirmer. C'est le piège central du test.</li>
      </ul>
      <p>Le NPD se décline en deux formes, d'inégale difficulté. Celui qui « sonne faux » d'après tes connaissances est facile à écarter. Celui qui <b>« sonne vrai » parce que tu sais qu'il est vrai dans la réalité</b> est le plus dangereux : ton instinct te pousse à le valider. Rappel absolu : la seule affirmation vraie est celle qui est prouvée par le texte.</p>
    </details>

    <details class="mth"><summary>Les expressions suspectes à repérer</summary>
      <ul>
        <li><b>Déterminants et quantités.</b> « certains, plusieurs, beaucoup, un certain nombre » désignent une partie ; « tous, chaque, l'ensemble » désignent la totalité sans exception. Ils ne sont jamais interchangeables : si le texte dit « de nombreux pays », une affirmation qui dit « tous les pays » est fausse.</li>
        <li><b>Fréquence.</b> « parfois, souvent, généralement, fréquemment, rarement, occasionnellement » sont tous relatifs. Les deux seuls absolus sont « jamais » et « toujours ».</li>
        <li><b>Temps et mode des verbes.</b> « jusqu'à ce que » + passé change tout le sens. « pourrait, devrait, sur le point de » expriment une possibilité ou une intention, jamais un fait acquis.</li>
        <li><b>Causalité contre chronologie.</b> « a entraîné, par conséquent, a résulté en » marquent une cause. Une simple succession dans le temps n'établit aucune cause. Ne jamais déduire un lien causal d'une chronologie.</li>
        <li><b>Général contre particulier.</b> Deux pièges inverses : la généralisation (étendre à toute une catégorie ce qui n'est dit que de certains cas) et la sur-précision (ajouter un détail que le texte ne fournit pas).</li>
        <li><b>Quasi-équivalence.</b> « sans modification majeure » n'est pas « n'a pas été modifié ». Des mots très proches peuvent cacher une différence de sens décisive.</li>
        <li><b>Omission.</b> Une affirmation qui ne reprend pas toute l'information du texte n'est pas fausse pour autant. Une information partielle mais exacte reste vraie.</li>
      </ul>
    </details>

    <details class="mth"><summary>L'ordre de lecture optimal</summary>
      <ul>
        <li>1. Lis d'abord les <b>quatre affirmations</b> et retiens leurs mots-clés et leurs thèmes. Tu cherches la seule qui soit pleinement démontrée par le texte.</li>
        <li>2. Lis le <b>texte</b> en te concentrant sur ces thèmes précis, plutôt que de tout mémoriser.</li>
        <li>3. Dès qu'une affirmation est clairement et entièrement confirmée par le texte, c'est la bonne : <b>valide et passe</b>. Temps gagné.</li>
        <li>4. Si tu hésites, élimine les autres une par une : celle qui est contredite par le texte est fausse, celle que le texte ne permet pas de prouver est « ne peut pas dire ». Il ne doit rester qu'une affirmation entièrement soutenue.</li>
      </ul>
      <p>Lire le texte en premier est l'instinct naturel, et c'est une perte de temps : tu mémorises des détails dont la plupart ne seront jamais interrogés.</p>
    </details>

    <details class="mth"><summary>S'entraîner efficacement</summary>
      <ul>
        <li>Commence sans chrono, en lisant des textes exigeants et en repérant à voix haute les expressions suspectes.</li>
        <li>Écris, avec tes mots, <b>pourquoi</b> chaque mauvaise option est fausse. C'est là que la compétence se construit, pas dans le nombre de questions enchaînées.</li>
        <li>Puis chronomètre-toi, et réduis progressivement le temps par question jusqu'à passer sous le rythme réel.</li>
        <li>Entraîne-toi <b>à l'écran</b> et non sur papier : le concours est informatisé, et lire sur écran est plus lent tant qu'on n'y est pas habitué.</li>
        <li>Recrée les conditions : pièce calme, sans interruption, minuteur lancé.</li>
      </ul>
      <p style="color:var(--ink-soft);font-size:12.5px;">Méthode adaptée de A. Baneth, <i>The Ultimate EU Test Book, Administrators</i>, chapitre 2.</p>
    </details>
    <button class="btn wide" id="startVerbal">Démarrer une session (${Math.min(VERB_COUNT, VERBAL_BANK.length)} textes · ${fmtTime(Math.min(VERB_COUNT, VERBAL_BANK.length)*VERB_SEC)} au total)</button>
  </div>`;
  document.getElementById('startVerbal').addEventListener('click', runVerbalSession);
}
function runVerbalSession(){
  const app = document.getElementById('app');
  const count = Math.min(VERB_COUNT, VERBAL_BANK.length);
  let order = shuffle(VERBAL_BANK.map((_,i)=>i)).slice(0, count);
  let idx=0, score=0, timeLeft=count*VERB_SEC, timer=null, answered=false, ended=false, view=null;
  function startClock(){
    clearInterval(timer);
    timer=ACTIVE_TIMER=setInterval(()=>{
      timeLeft--; const t=document.getElementById('tmr');
      if(t){t.textContent=fmtTime(timeLeft); if(timeLeft<=60) t.classList.add('low');}
      if(timeLeft<=0){clearInterval(timer); endSession(true);}
    },1000);
  }
  function renderP(){
    answered=false;
    const item = VERBAL_BANK[order[idx]];
    view = shuffleOpts(item);
    app.innerHTML = '<div class="card">'
      +'<div class="section-title"><span class="eyebrow">Verbal · Texte '+(idx+1)+'/'+order.length+'</span><span style="font-family:var(--mono);font-size:12px;color:var(--ink-soft);">Score : '+score+'/'+idx+'</span></div>'
      +'<div class="timer-wrap"><span class="timer-txt" id="tmr">'+fmtTime(timeLeft)+'</span><span class="session-score">temps global pour '+order.length+' textes</span></div>'
      +'<div class="passage-box">'+item.passage+'</div>'
      +'<p style="font-size:13.5px;font-weight:600;margin:2px 0 10px;">Quelle affirmation est correcte, uniquement d\'après le texte ?</p>'
      +'<div id="opts">'+view.opts.map((o,i)=>'<button class="qcm-opt" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+o+'</button>').join('')+'</div>'
      +'<div id="fb"></div>'
      +'<button class="btn wide hidden" id="nextBtn" style="margin-top:12px;">Texte suivant →</button></div>'
      +'<button class="btn ghost wide" id="exitBtn">Quitter la session</button>';
    document.getElementById('exitBtn').addEventListener('click',()=>goTo('verbal'));
    app.querySelectorAll('.qcm-opt').forEach(b=>b.addEventListener('click',()=>submit(parseInt(b.dataset.i))));
    document.getElementById('nextBtn').addEventListener('click',()=>{
      idx++;
      if(idx<order.length){ renderP(); startClock(); } else { endSession(false); }
    });
  }
  function submit(choice){
    if(answered) return; answered=true; clearInterval(timer);
    const item = VERBAL_BANK[order[idx]];
    const ok = choice===view.c;
    if(ok) score++;
    PROGRESS.verbal.att++; if(ok) PROGRESS.verbal.cor++;
    saveProgress(); renderStreak();
    app.querySelectorAll('.qcm-opt').forEach((b,i)=>{
      b.disabled=true;
      if(i===view.c) b.classList.add('correct');
      else if(i===choice) b.classList.add('incorrect');
    });
    document.getElementById('fb').innerHTML = '<div class="feedback '+(ok?'ok':'no')+'">'+(ok?'✓ Correct. ':'✗ Incorrect. ')+'La bonne réponse est '+String.fromCharCode(65+view.c)+'. '+item.ex+'</div>';
    document.getElementById('nextBtn').classList.remove('hidden');
  }
  function endSession(timedOut){
    if(ended) return; ended=true;
    clearInterval(timer);
    app.innerHTML = '<div class="card session-end"><span class="eyebrow">'+(timedOut?'Temps écoulé':'Session terminée')+'</span><div class="n">'+score+'/'+order.length+'</div>'
      +(timedOut?'<p style="color:var(--wine);">Le temps global est écoulé : '+(order.length-idx)+' texte(s) non traité(s). Au concours, ils ne rapportent aucun point.</p>':'')
      +'<p style="color:var(--ink-soft);">Statistiques cumulées mises à jour.</p>'
      +'<button class="btn" id="againBtn">Refaire une session</button>'
      +'<button class="btn ghost" id="backBtn" style="margin-top:8px;">Retour</button></div>';
    document.getElementById('againBtn').addEventListener('click',()=>{
      order=shuffle(VERBAL_BANK.map((_,i)=>i)).slice(0,count); idx=0; score=0; timeLeft=count*VERB_SEC; ended=false;
      renderP(); startClock();
    });
    document.getElementById('backBtn').addEventListener('click',()=>goTo('verbal'));
  }
  renderP();
  startClock();
}

    <details class="mth"><summary>Les six familles de transformation</summary>
      <p>Quasiment toute question de raisonnement abstrait se ramène à une combinaison de six transformations élémentaires. Les connaître par cœur transforme la recherche en vérification.</p>
      <ul>
        <li><b>Forme</b> : un cercle devient un carré, un triangle un pentagone, ou le nombre de côtés évolue.</li>
        <li><b>Couleur (ou remplissage)</b> : une figure blanche devient noire, ou la teinte s'éclaircit ou s'assombrit par paliers.</li>
        <li><b>Taille</b> : la figure grandit ou rétrécit, en général d'un pas constant.</li>
        <li><b>Trait horizontal</b> : ajout ou suppression.</li>
        <li><b>Trait vertical</b> : ajout ou suppression.</li>
        <li><b>Permutation</b> : quand une case contient plusieurs figures, elles échangent leur position.</li>
      </ul>
      <p style="color:var(--ink-soft);font-size:12.5px;">Taxonomie issue de E. Hetru et C. Mercier, <i>Test de capacité de raisonnement abstrait</i>, ORSEU.</p>
    </details>

    <details class="mth"><summary>La méthode d'analyse, attribut par attribut</summary>
      <p>L'erreur classique est de fixer la séquence en espérant que la règle saute aux yeux. Procède au contraire par inventaire systématique.</p>
      <ul>
        <li>1. Liste les <b>attributs qui varient</b> d'une case à l'autre : forme, couleur, taille, traits, position, nombre d'éléments.</li>
        <li>2. Traite <b>un attribut à la fois</b>, en ignorant complètement les autres. Une règle par attribut.</li>
        <li>3. Vérifie ton hypothèse sur <b>toutes</b> les étapes, pas seulement sur les deux premières. Une règle qui marche de 1 à 2 mais pas de 2 à 3 est fausse.</li>
        <li>4. Méfie-toi des <b>attributs distracteurs</b> : un élément qui ne change jamais est là pour occuper ton attention.</li>
        <li>5. Une fois toutes les règles identifiées, applique-les à la dernière figure, puis cherche cette réponse parmi les options. Ne pars jamais des options.</li>
      </ul>
    </details>

    <details class="mth"><summary>Gérer le temps et les pièges</summary>
      <ul>
        <li>Les questions sont classées par <b>difficulté croissante</b> : les premières valent autant de points que les dernières, donc sécurise-les sans précipitation.</li>
        <li>Il n'est pas nécessaire de tout traiter pour réussir. Mieux vaut un bloc de réponses justes qu'un test entier bâclé.</li>
        <li>Si une question résiste après deux hypothèses testées, passe. Y revenir plus tard avec un œil neuf coûte moins cher que s'acharner.</li>
        <li>Piège fréquent des options : une réponse correcte sur l'attribut le plus visible mais fausse sur un attribut secondaire. Vérifie chaque attribut avant de valider.</li>

  </div>`;
  document.getElementById('startNum').addEventListener('click',()=>runQCMSession(NUMERIC_BANK.concat(NUMERIC_TEMPLATES.map(f=>f())),'numeric',NUM_SEC,'Numérique','Test 2','numabs',NUM_COUNT));

    <div class="card">
      <h2 style="font-size:16px;">Structure qui marche en 40 minutes</h2>
      <p style="font-size:13.5px;"><b>5 min</b> · lire les sources, choisir un angle, plan en 3 lignes. <b>30 min</b> · rédaction : intro (contexte + problématique + plan), 2-3 paragraphes argumentés qui CITENT et CONFRONTENT les sources, conclusion (synthèse + ouverture). <b>5 min</b> · relecture langue et cohérence.</p>
    </div>
    <div class="card">
      <h2 style="font-size:16px;">Grille d'auto-évaluation</h2>
      ${CHECKLIST.map((c,i)=>'<label class="checklist-item"><input type="checkbox" id="chk'+i+'"><span>'+c+'</span></label>').join('')}
      <button class="btn wide" id="finishBtn" style="margin-top:12px;">Terminer cette session</button>
    </div>`;
    function showSimple(){
      dossierMode=false;
      document.getElementById('promptZone').innerHTML =
        '<div class="essay-prompt" id="promptBox">'+EUFTE_PROMPTS[promptIdx]+'</div>'
        +'<button class="btn ghost" id="newPrompt" style="margin-bottom:10px;">🔀 Nouveau sujet</button>';
      document.getElementById('newPrompt').addEventListener('click',()=>{
        let n; do{ n=Math.floor(Math.random()*EUFTE_PROMPTS.length); }while(n===promptIdx && EUFTE_PROMPTS.length>1);
        promptIdx=n; showSimple();
      });
    }
    function showDossier(){
      dossierMode=true;
      document.getElementById('promptZone').innerHTML =
        '<div class="essay-prompt">'+EUFTE_DOSSIER.topic+'</div>'
        + EUFTE_DOSSIER.sources.map(s=>'<div class="passage-box" style="font-size:13.5px;">'+s+'</div>').join('')
        +'<div class="info-box">'+EUFTE_DOSSIER.note+'</div>';
    }
    document.getElementById('modeSimple').addEventListener('click',showSimple);
    document.getElementById('modeDossier').addEventListener('click',showDossier);
    showSimple();
    const area = document.getElementById('essayArea');
    const wc = document.getElementById('wc');
    function updateWC(){ const words=area.value.trim().split(/\s+/).filter(Boolean).length; wc.textContent=words+' mots'; }
    updateWC();
    let saveTimeout;
    area.addEventListener('input',()=>{ updateWC(); clearTimeout(saveTimeout); saveTimeout=setTimeout(()=>saveDraft(area.value),600); });
    const timerDisp = document.getElementById('timerDisp');
    function tick(){
      seconds--; const m=Math.floor(seconds/60), s=seconds%60;
      timerDisp.textContent = m+':'+(s<10?'0':'')+s;
      if(seconds<=0){ clearInterval(timer); running=false; }
    }
    document.getElementById('startTimer').addEventListener('click',()=>{
      if(running) return; running=true; clearInterval(timer); timer=ACTIVE_TIMER=setInterval(tick,1000);
    });
    document.getElementById('resetTimer').addEventListener('click',()=>{
      clearInterval(timer); running=false; seconds=40*60; timerDisp.textContent='40:00';
    });
    document.getElementById('finishBtn').addEventListener('click',()=>{
      if(finished) return; finished=true;
      clearInterval(timer);
      PROGRESS.eufte.sessions++; saveProgress();
      alert('Session enregistrée. '+PROGRESS.eufte.sessions+' session(s) EUFTE au total.');
      goTo('dashboard');
    });
  });
}

/* ================= ANNEXE APPRENTISSAGE ================= */
function renderAnnexeSection(container, items, idPrefix){
  container.innerHTML = items.map((s,i)=>'<div class="kb-section"><button class="kb-head" data-i="'+i+'"><span>'+s.title+'</span><span class="car">▸</span></button><div class="kb-body" id="'+idPrefix+i+'">'+s.body+'</div></div>').join('');
  container.querySelectorAll('.kb-head').forEach(b=>b.addEventListener('click',()=>{
    const body = document.getElementById(idPrefix+b.dataset.i);
    const open = body.classList.toggle('open');
    b.querySelector('.car').style.transform = open?'rotate(90deg)':'rotate(0)';
  }));
}
function renderAnnexe(){
  const app = document.getElementById('app');
  const piliers = ANNEXE_KNOWLEDGE.filter(s=>s.group==='pilier');
  const themes = ANNEXE_KNOWLEDGE.filter(s=>s.group==='theme');

  app.innerHTML = `
  <div class="card">
    <span class="eyebrow">Annexe · culture générale UE</span>
    <h2>Ce qu'il faut savoir au-delà du quiz</h2>
    <p style="font-size:14px;">Condensés de référence, vérifiés contre des sources officielles (europarl.europa.eu, eur-lex.europa.eu, ec.europa.eu, consilium.europa.eu, ecb.europa.eu...). Ils complètent le module Connaissances UE sans le répéter, et nourrissent surtout l'essai EUFTE : chaque section se termine si possible par un point de débat mobilisable.</p>
    <div class="warn-box">Certains points sont explicitement signalés « à revérifier » dans le texte (chiffres de comitologie, répartition des sièges au Parlement, seuils d'un règlement trop récent...) : ce sont des faits que la vérification n'a pas pu confirmer avec certitude au moment de la rédaction. Recroise-les toi-même avant de les citer en test ou à l'essai.</div>
  </div>
  <div class="card">
    <div class="section-title"><h2>Piliers fondamentaux</h2></div>
    <div id="annexePiliers"></div>
  </div>
  <div class="card">
    <div class="section-title"><h2>Les 17 grands dossiers du Parlement européen</h2></div>
    <div id="annexeThemes"></div>
  </div>
  <div class="card">
    <div class="section-title"><h2>Fiches détaillées (Parlement européen)</h2></div>
    <p style="font-size:13px;color:var(--ink-soft);">${ANNEXE_FICHES.length} fiches condensées, une par sujet officiel, classées par domaine.</p>
    ${ficheSections.map((sec,si)=>'<p style="font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);margin:16px 0 4px;">'+sec.toUpperCase()+'</p><div id="annexeFiches'+si+'"></div>').join('')}
  </div>`;
  renderAnnexeSection(document.getElementById('annexePiliers'), piliers, 'akbp');
  renderAnnexeSection(document.getElementById('annexeThemes'), themes, 'akbt');
  ficheSections.forEach((sec,si)=>{
    renderAnnexeSection(document.getElementById('annexeFiches'+si), ANNEXE_FICHES.filter(f=>f.section===sec), 'akbf'+si+'_');
  });
}

    {n:'2',t:'Aucune compensation entre tests',d:`Chaque seuil raté (verbal 10/20, num+abstrait 10/20, EUFTE 5/10) élimine, quel que soit le reste. Sécurise les seuils avant d'optimiser les scores.`},
    {n:'3',t:'Num + abstrait : le seuil, rien de plus',d:`Test combiné pass/fail (20 q, 30 min, 10/20), zéro point de classement. Vise le seuil avec marge, n'y engloutis pas ton temps de verbal.`},
    {n:'4',t:'65 % de ta note finale en Langue 2',d:`Connaissances UE (25 %) + compétences numériques (25 %) + EUFTE (15 %) se passent en anglais pour toi. Révise le vocabulaire institutionnel anglais (glossaire), lis de la presse UE en anglais, rédige tes essais d'entraînement en anglais.`},
