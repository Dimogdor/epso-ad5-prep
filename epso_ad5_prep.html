      seconds--; timerDisp.textContent = fmtTime(seconds);
      if(seconds<=0){ clearInterval(timer); running=false; }
    }
    document.getElementById('startTimer').addEventListener('click',()=>{
      if(running) return; running=true; clearInterval(timer); timer=ACTIVE_TIMER=setInterval(tick,1000);
    });
    document.getElementById('resetTimer').addEventListener('click',()=>{
      clearInterval(timer); running=false; seconds=40*60; timerDisp.textContent='40:00';
    });
    document.getElementById('finishBtn').addEventListener('click',()=>{
      if(finished) return; finished=true;
      clearInterval(timer);
      PROGRESS.eufte.sessions++; saveProgress();
      /* Un état affiché vaut mieux qu'une alerte à congédier : la confirmation
         reste lisible pendant qu'on referme la session. */
      document.getElementById('finishBtn').outerHTML =
        '<div class="info-box" style="margin-top:12px;">Session enregistrée · <b>'
        + PROGRESS.eufte.sessions + ' session' + (PROGRESS.eufte.sessions>1?'s':'')
        + '</b> d\'écriture au total.</div>';
      renderStreak();
    });
  });
}

/* ================= COURS =================
   L'ancienne annexe devient le corps de cours. Chaque section est écoutable sur
   place, et les phrases y sont surlignées au fil de la lecture : le suivi audio
   se fait sur le texte réel, pas dans une vue de lecture séparée. */
function renderKbList(container, items, idPrefix, grp){
  container.innerHTML = items.map((x,i)=>{
    const aid = grp ? audioIdFor(grp, x.title) : null;
    return '<div class="kb-section"><div class="kb-headrow">'
      +'<button class="kb-head" data-i="'+i+'" aria-expanded="false"><span>'+x.title+'</span><span class="car">›</span></button>'
      +(aid?'<button class="kb-play" data-audio="'+aid+'" title="Écouter cette section" aria-label="Écouter : '+x.title.replace(/"/g,'')+'">🎧</button>'
          +'<button class="kb-play" data-queue="'+aid+'" title="Ajouter à la file d\'attente" aria-label="Ajouter à la file">+</button>':'')
      +'</div><div class="kb-body" id="'+idPrefix+i+'"'+(aid?' data-audio="'+aid+'"':'')+'>'+x.body+'</div></div>';
  }).join('');
  container.querySelectorAll('.kb-head').forEach(btn=>btn.addEventListener('click',()=>{
    const body = document.getElementById(idPrefix+btn.dataset.i);
    const open = body.classList.toggle('open');
    btn.setAttribute('aria-expanded', open?'true':'false');
    btn.querySelector('.car').style.transform = open?'rotate(90deg)':'rotate(0)';
  }));
  container.querySelectorAll('[data-audio].kb-play').forEach(btn=>btn.addEventListener('click',()=>{
    if(TTS.chap && TTS.chap.id===btn.dataset.audio && TTS.playing){ ttsPause(); return; }
    ttsOpen(btn.dataset.audio, true);
  }));
  container.querySelectorAll('[data-queue]').forEach(btn=>btn.addEventListener('click',()=>{
    TTS.queue.push(btn.dataset.queue); ttsSave();
    btn.textContent = '✓'; setTimeout(()=>{ btn.textContent = '+'; }, 1200);
  }));
}
/* Ouvre la section en cours de lecture et y pose les repères de phrase. */
function ttsSyncCours(){
  if(CURRENT!=='cours') return;
  document.querySelectorAll('.kb-body[data-marked]').forEach(bd=>{
    if(!TTS.chap || bd.dataset.audio !== TTS.chap.id){
      const ch = AUDIO_BY_ID.get(bd.dataset.audio);
      if(ch) ttsMarkBody(bd, ch, false);
    }
  });
  if(!TTS.chap) return;
  const body = document.querySelector('.kb-body[data-audio="'+TTS.chap.id+'"]');
  if(!body) return;
  ttsMarkBody(body, TTS.chap, true);
  if(!body.classList.contains('open')){
    body.classList.add('open');
    const head = body.parentElement.querySelector('.kb-head');
    if(head){ head.setAttribute('aria-expanded','true'); head.querySelector('.car').style.transform='rotate(90deg)'; }
  }
}
function renderCours(){
  const app = document.getElementById('app');
  const piliers = ANNEXE_KNOWLEDGE.filter(x=>x.group==='pilier');
  const themes  = ANNEXE_KNOWLEDGE.filter(x=>x.group==='theme');
  const actus   = ANNEXE_KNOWLEDGE.filter(x=>x.group==='actu');
  const ficheSections = [...new Set(ANNEXE_FICHES.map(f=>f.section))];
  app.innerHTML = `
  <div class="card">
    <span class="eyebrow">Cours · ${AUDIO_LIB.length} chapitres</span>
    <h2>Connaissances européennes</h2>
    <p class="lede">Condensés de référence vérifiés contre les sources officielles des institutions.
    Ils complètent le module Connaissances UE sans le répéter, et nourrissent l'essai EUFTE : chaque
    section se termine si possible par un point de débat mobilisable.</p>
    <div class="info-box">Chaque section porte un bouton 🎧. La lecture <b>surligne les phrases dans le
    texte au fil de l'écoute</b>, et un clic sur une phrase y déplace la lecture. Réglages de voix et
    de vitesse dans l'onglet Paramètres.</div>
    <div class="warn-box">Certains points sont signalés « à revérifier » dans le texte : ce sont des
    faits que la vérification n'a pas pu confirmer avec certitude au moment de la rédaction.
    Les recroiser avant de les citer en test ou à l'essai.</div>
  </div>

  <div class="card" style="padding:0;overflow:hidden;">
    <div class="kb-section" style="border:none;margin:0;">
      <div class="kb-headrow">
        <button class="kb-head" id="acrHead" aria-expanded="false" aria-controls="acrPanel">
          <span>Sigles et acronymes <span style="color:var(--muted);font-weight:500;">·
            ${ACRONYMS.length} entrées</span></span><span class="car">›</span></button>
      </div>
      <div class="kb-body" id="acrPanel">
        <p class="lede" style="font-size:15.5px;">Tout sigle croisé dans les cours ou les corrections
        d'exercices, développé puis expliqué. La forme anglaise est donnée quand elle diffère, les tests
        de connaissances et de compétences numériques se passant en Langue 2.</p>
        <input class="acr-search" id="acrSearch" placeholder="Filtrer : sigle, mot du libellé…" aria-label="Filtrer les sigles">
        <div id="acrList"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><h2>Piliers fondamentaux</h2></div>
    <div id="cPiliers"></div>
  </div>
  <div class="card">
    <div class="section-title"><h2>Actualité européenne</h2></div>
    <p class="lede" style="font-size:14.5px;">Matière pour l'EUFTE, pas pour le QCM : le test de
    connaissances porte sur les institutions, les procédures et les grandes politiques, pas sur
    l'actualité de l'année. Une note d'information, elle, gagne à s'appuyer sur un dossier en cours.</p>
    <div class="warn-box">Contenu daté. Les chiffres bougent : privilégier les tendances et les
    tensions aux valeurs exactes, et recroiser toute donnée avant de la citer.</div>
    <div id="cActus"></div>
  </div>
  <div class="card">
    <div class="section-title"><h2>Les grands dossiers du Parlement</h2></div>
    <div id="cThemes"></div>
  </div>
  <div class="card">
    <div class="section-title"><h2>Fiches détaillées</h2>
      <span class="eyebrow">${ANNEXE_FICHES.length} fiches</span></div>
    ${ficheSections.map((sec,si)=>'<p class="eyebrow" style="color:var(--accent);margin:22px 0 6px;">'
      +sec+'</p><div id="cFiches'+si+'"></div>').join('')}
  </div>`;

  renderKbList(document.getElementById('cPiliers'), piliers, 'kbp', 'pilier');
  renderKbList(document.getElementById('cActus'),   actus,   'kba', 'actu');
  renderKbList(document.getElementById('cThemes'),  themes,  'kbt', 'theme');
  ficheSections.forEach((sec,si)=>{
    renderKbList(document.getElementById('cFiches'+si),
      ANNEXE_FICHES.filter(f=>f.section===sec), 'kbf'+si+'_', 'fiche');
  });

  const acrList = document.getElementById('acrList');
  const drawAcr = q=>{
    q = q.trim().toLowerCase();
    const hits = ACRONYMS.filter(x=>!q || x.a.toLowerCase().includes(q)
      || x.f.toLowerCase().includes(q) || (x.en||'').toLowerCase().includes(q)
      || x.d.toLowerCase().includes(q))
      .sort((x,y)=>x.a.localeCompare(y.a,'fr'));
    if(!hits.length){ acrList.innerHTML = '<p class="aud-empty">Aucun sigle ne correspond.</p>'; return; }
    let html = '', letter = '';
    hits.forEach(x=>{
      const L = x.a[0].toUpperCase();
      if(L !== letter){ html += '<p class="acr-letter">'+L+'</p>'; letter = L; }
      html += '<dl class="acr-row"><dt>'+x.a+'</dt><dd>'+x.f
        + (x.en ? ' <span class="kb-fact">'+x.en+'</span>' : '')
        + '<i>'+x.d+'</i></dd></dl>';
    });
    acrList.innerHTML = html;
  };
  drawAcr('');
  document.getElementById('acrSearch').addEventListener('input', e=>drawAcr(e.target.value));
  /* Replié par défaut : 59 entrées dépliées repoussaient les cours hors de l'écran. */
  const acrHead = document.getElementById('acrHead'), acrPanel = document.getElementById('acrPanel');
  acrHead.addEventListener('click', ()=>{
    const open = acrPanel.classList.toggle('open');
    acrHead.setAttribute('aria-expanded', open?'true':'false');
    acrHead.querySelector('.car').style.transform = open?'rotate(90deg)':'rotate(0)';
    if(open) document.getElementById('acrSearch').focus();
  });
  ttsSyncCours();
}

/* ================= PARAMÈTRES ================= */
function renderParams(){
  const app = document.getElementById('app');
  const voiceOpts = TTS_VOICES.map(v=>'<option value="'+v.voiceURI.replace(/"/g,'&quot;')+'"'
      +(v.voiceURI===TTS.voiceURI?' selected':'')+'>'+v.name+' ('+v.lang+')</option>').join('');
  const presets = [0.85,1,1.15,1.3,1.5];
  const sw = (id,on,label)=>'<label class="switch" aria-label="'+label+'"><input type="checkbox" id="'+id+'"'
    +(on?' checked':'')+'><i></i></label>';
  const done = AUDIO_LIB.filter(x=>ttsPct(x.id)>=100).length;

  app.innerHTML = `
  <div class="card">
    <span class="eyebrow">Paramètres</span>
    <h2>Réglages</h2>
    <p class="lede">Tout est enregistré dans ce navigateur, sans compte ni serveur.</p>
  </div>

  <div class="card">
    <div class="section-title"><h2>Apparence</h2></div>
    <div class="set-row">
      <div class="set-label"><b>Thème</b><span>« Auto » suit le réglage clair ou sombre du système.</span></div>
      <div class="seg" id="themeSeg" role="group" aria-label="Thème">
        <button data-th="auto"  class="${THEME==='auto'?'on':''}">Auto</button>
        <button data-th="light" class="${THEME==='light'?'on':''}">Clair</button>
        <button data-th="dark"  class="${THEME==='dark'?'on':''}">Sombre</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><h2>Lecture audio</h2>
      <span class="eyebrow">${done} / ${AUDIO_LIB.length} chapitres écoutés</span></div>
    ${!TTS_SUPPORT ? '<div class="warn-box">Ce navigateur n\'expose pas la synthèse vocale.</div>' : `
    <div class="set-row">
      <div class="set-label"><b>Voix</b><span>Les voix « Natural », « Online », « Google » ou « Améliorée »
        sont neuronales et nettement plus naturelles ; elles sont remontées en tête.</span></div>
      <select class="aud-select" id="ttsVoiceSel" aria-label="Voix">${voiceOpts || '<option>Aucune voix détectée</option>'}</select>
    </div>
    <div class="set-row">
      <div class="set-label"><b>Vitesse</b><span>Réglable en cours de lecture : la phrase en cours
        reprend à son début à la nouvelle vitesse.</span></div>
      <span class="aud-rate-val" id="ttsRateVal">${TTS.rate.toFixed(2).replace('.',',')}×</span>
    </div>
    <input class="aud-range" type="range" id="ttsRate" min="0.5" max="2" step="0.05" value="${TTS.rate}" aria-label="Vitesse de lecture" style="width:100%;">
    <div class="aud-presets" style="margin-top:10px;">
      ${presets.map(x=>'<button data-rate="'+x+'" class="'+(Math.abs(x-TTS.rate)<0.001?'on':'')+'">'+x.toFixed(2).replace('.',',')+'×</button>').join('')}
    </div>
    <div class="set-row" style="margin-top:6px;">
      <div class="set-label"><b>Enchaîner les chapitres</b><span>Passe au chapitre suivant à la fin du précédent.</span></div>
      ${sw('ttsCont', TTS.continuous, 'Enchaîner les chapitres')}
    </div>
    <div class="set-row">
      <div class="set-label"><b>Suivre le texte</b><span>Surligne la phrase lue dans le cours et fait défiler jusqu'à elle.</span></div>
      ${sw('ttsFollow', TTS.follow, 'Suivre le texte')}
    </div>
    <div class="set-row">
      <div class="set-label"><b>Garder l'écran allumé</b><span>À n'activer que si la lecture s'interrompt
        écran verrouillé. Consomme davantage de batterie.</span></div>
      ${sw('ttsAwake', TTS.keepAwake, "Garder l'écran allumé")}
    </div>
    <button class="btn ghost wide" id="ttsDiagBtn" style="margin-top:14px;">🔊 Aucun son ne sort ? Tester et réparer</button>
    <p class="lede" style="font-size:13px;margin-top:12px;"><b>Raccourcis</b> · espace : lecture/pause ·
      ← → : phrase précédente/suivante · maj + ← → : chapitre · + / − : vitesse.</p>`}
  </div>

  <div class="card">
    <div class="section-title"><h2>File d'attente</h2>
      <span class="eyebrow">${TTS.queue.length} en attente</span></div>
    <p class="lede" style="font-size:14px;">Les chapitres empilés ici passent avant l'enchaînement automatique.</p>
    <div id="ttsQueue"></div>
  </div>

  <div class="card">
    <div class="section-title"><h2>Progression</h2></div>
    <div class="set-row">
      <div class="set-label"><b>Réinitialiser les scores</b>
        <span>Efface les statistiques de tous les modules, la série de jours et les sessions EUFTE.
        Les positions de lecture audio ne sont pas touchées.</span></div>
      <button class="btn ghost danger" id="resetScores">Réinitialiser</button>
    </div>
    <div class="set-row">
      <div class="set-label"><b>Réinitialiser la lecture audio</b>
        <span>Oublie la position de chaque chapitre, la file d'attente et le chapitre en cours.</span></div>
      <button class="btn ghost danger" id="resetAudio">Réinitialiser</button>
    </div>
  </div>`;

  document.querySelectorAll('#themeSeg button').forEach(b=>b.addEventListener('click',()=>{
    applyTheme(b.dataset.th); renderParams();
  }));

  if(TTS_SUPPORT){
    const sel = document.getElementById('ttsVoiceSel');
    if(sel) sel.addEventListener('change',()=>{
      TTS.voiceURI = sel.value; TTS.tried = []; ttsSave();
      if(TTS.playing){ ttsKill(); ttsSpeak(0); }
    });
    const rg = document.getElementById('ttsRate');
    rg.addEventListener('input',()=>{
      document.getElementById('ttsRateVal').textContent = (+rg.value).toFixed(2).replace('.',',');
    });
    rg.addEventListener('change',()=>ttsSetRate(+rg.value));
    app.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>ttsSetRate(+b.dataset.rate)));
    document.getElementById('ttsCont').addEventListener('change',e=>{ TTS.continuous = e.target.checked; ttsSave(); });
    document.getElementById('ttsFollow').addEventListener('change',e=>{ TTS.follow = e.target.checked; ttsSave(); });
    document.getElementById('ttsAwake').addEventListener('change',e=>{
      TTS.keepAwake = e.target.checked; ttsSave(); ttsWakeLock(TTS.keepAwake && TTS.playing);
    });
    document.getElementById('ttsDiagBtn').addEventListener('click', ttsDiagOpen);
  }

  const qz = document.getElementById('ttsQueue');
  qz.innerHTML = TTS.queue.length ? TTS.queue.map((id,k)=>{
    const c = AUDIO_BY_ID.get(id);
    return '<div class="aud-row"><span class="at">'+(k+1)+'. '+c.title
      +'<small>'+AUDIO_GROUP_LABEL[c.g]+'</small></span>'
      +'<button data-up="'+k+'" aria-label="Monter">↑</button>'
      +'<button data-down="'+k+'" aria-label="Descendre">↓</button>'
      +'<button data-rm="'+k+'" aria-label="Retirer">✕</button></div>';
  }).join('') : '<p class="aud-empty">Vide. La lecture enchaînera simplement le chapitre suivant.</p>';
  qz.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>{
    const k=+b.dataset.up, a=TTS.queue; if(k>0){ [a[k-1],a[k]]=[a[k],a[k-1]]; ttsSave(); renderParams(); }
  }));
  qz.querySelectorAll('[data-down]').forEach(b=>b.addEventListener('click',()=>{
    const k=+b.dataset.down, a=TTS.queue; if(k<a.length-1){ [a[k+1],a[k]]=[a[k],a[k+1]]; ttsSave(); renderParams(); }
  }));
  qz.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{
    TTS.queue.splice(+b.dataset.rm,1); ttsSave(); renderParams();
  }));

  document.getElementById('resetScores').addEventListener('click', async ()=>{
    if(!confirm('Effacer toutes les statistiques de progression ?')) return;
    PROGRESS = DEFAULT_PROGRESS();
    await saveProgress(); renderStreak(); renderParams();
  });
  document.getElementById('resetAudio').addEventListener('click', ()=>{
    if(!confirm('Oublier toutes les positions de lecture audio ?')) return;
    ttsStop();
    TTS.pos = {}; TTS.queue = []; TTS.last = null;
    ttsFlush(); renderParams();
  });
}

/* ================= INIT ================= */
const RENDERERS = {
  dashboard: renderDashboard, verbal: renderVerbal, numabs: renderNumAbs,
  euknow: renderEuKnow, digital: renderDigital, eufte: renderEufte,
  cours: renderCours, concours: renderConcours, params: renderParams,
};
loadProgress().then(ttsInit).then(()=>{ renderTabs(); syncHeaderH(); renderDashboard(); });
</script>
</body>
