{q:`Quelle marge de fluctuation élargie la lire italienne a-t-elle obtenue dans le mécanisme de change du Système monétaire européen ?`,opts:[`Plus ou moins 6 %`,`Plus ou moins 2,25 %`,`Plus ou moins 15 %`,`Aucune marge particulière`],c:0,ex:`La marge de droit commun était de plus ou moins 2,25 %. Cette dérogation reconnaissait la volatilité plus forte de la lire.`},
{q:`Qu'est-il advenu des marges de fluctuation du mécanisme de change après la crise de 1992 et 1993 ?`,opts:[`Elles ont été élargies à plus ou moins 15 %`,`Elles ont été supprimées`,`Elles ont été resserrées à plus ou moins 1 %`,`Elles sont restées inchangées`],c:0,ex:`La lire et la livre sterling avaient quitté le mécanisme en 1992. L'élargissement à 15 % a évité l'éclatement du système en attendant la monnaie unique.`},
{q:`Où et quand le comité chargé de préparer l'union monétaire, présidé par Jacques Delors, a-t-il été institué ?`,opts:[`Au Conseil européen de Hanovre en juin 1988`,`Au Conseil européen de Maastricht en 1991`,`Au sommet de Paris de 1974`,`À la conférence de Messine de 1955`],c:0,ex:`Le comité réunissait l'ensemble des gouverneurs des banques centrales de la Communauté. Son rapport a été remis en avril 1989.`},
{q:`Que prévoyait la première étape du plan Delors, engagée en juillet 1990 ?`,opts:[`La suppression de toutes les restrictions aux mouvements de capitaux entre États membres`,`La création immédiate de la monnaie unique`,`La fixation irrévocable des taux de change`,`La création de la Banque centrale européenne`],c:0,ex:`La libéralisation complète des capitaux était le préalable indispensable, mais elle a aussi ouvert la voie à la spéculation qui a frappé le mécanisme de change en 1992.`},
{q:`Quel organisme, installé à Francfort en 1994, a préfiguré la Banque centrale européenne ?`,opts:[`L'Institut monétaire européen`,`Le Fonds européen de coopération monétaire`,`Le Comité économique et financier`,`Le Système européen de banques centrales`],c:0,ex:`Il a coordonné les politiques monétaires nationales et préparé techniquement le passage à l'euro pendant la deuxième étape.`},
{q:`Quel Conseil européen a arrêté en 1995 le nom de la future monnaie unique ?`,opts:[`Le Conseil européen de Madrid`,`Le Conseil européen de Dublin`,`Le Conseil européen d'Amsterdam`,`Le Conseil européen de Cannes`],c:0,ex:`Le même Conseil a fixé le scénario de transition démarrant le 1er janvier 1999. Le nom « écu » avait été écarté, notamment sur insistance allemande.`},
{q:`À quelle date les taux de conversion entre l'euro et les monnaies participantes ont-ils été irrévocablement fixés ?`,opts:[`Le 31 décembre 1998`,`Le 1er janvier 1999`,`Le 1er janvier 2002`,`Le 1er mai 1998`],c:0,ex:`La fixation intervient la veille de l'entrée en vigueur, de sorte que l'euro existe comme monnaie dès le premier jour de 1999.`},
{q:`Quel Conseil européen a arrêté en 1997 les règles du pacte de stabilité et de croissance ?`,opts:[`Le Conseil européen d'Amsterdam`,`Le Conseil européen de Nice`,`Le Conseil européen de Laeken`,`Le Conseil européen de Lisbonne`],c:0,ex:`Le pacte devait garantir que la discipline budgétaire ne se relâche pas une fois les critères de convergence satisfaits.`},
{q:`Combien d'États membres ont formé la première vague d'adoption de l'euro en 1999 ?`,opts:[`Onze`,`Douze`,`Quinze`,`Neuf`],c:0,ex:`La Grèce les a rejoints en 2001, portant à douze le nombre d'États lors du passage aux pièces et billets en 2002.`},
{q:`Quelle est la marge de fluctuation standard autorisée dans le mécanisme de change MCE II ?`,opts:[`Plus ou moins 15 % autour du cours pivot`,`Plus ou moins 2,25 %`,`Plus ou moins 6 %`,`Aucune, le taux est fixe`],c:0,ex:`Participer au MCE II pendant au moins deux ans sans tension grave est l'un des critères de convergence.`},
{q:`Quel État membre participe au mécanisme de change MCE II depuis 1999 sans avoir adopté l'euro ?`,opts:[`Le Danemark`,`La Suède`,`La Pologne`,`La Hongrie`],c:0,ex:`Le Danemark bénéficie d'une clause d'exemption mais maintient sa couronne étroitement liée à l'euro.`},
{q:`Depuis 2018, que doit accepter un État qui souhaite entrer dans le mécanisme de change MCE II ?`,opts:[`Une feuille de route incluant une coopération étroite avec la supervision bancaire de la Banque centrale européenne`,`Un audit de la Cour des comptes européenne`,`L'adhésion préalable à l'espace Schengen`,`Un référendum national`],c:0,ex:`Cette exigence lie désormais l'entrée dans la zone euro à l'entrée dans l'union bancaire, ce qui n'était pas le cas pour les premiers entrants.`},
{q:`Comment appelle-t-on le scénario suivi par tous les États ayant adopté l'euro après 2002 ?`,opts:[`Le scénario « big bang », avec passage immédiat aux pièces et billets`,`Le scénario de Madrid, avec trois ans de transition`,`Le scénario progressif par région`,`Le scénario de double circulation illimitée`],c:0,ex:`Les onze premiers avaient connu trois ans de monnaie scripturale avant les espèces. Les suivants basculent d'un coup, avec une courte période de double circulation.`},
{q:`Quel est le statut d'un État membre qui n'a pas encore adopté l'euro et ne bénéficie d'aucune clause d'exemption ?`,opts:[`État membre faisant l'objet d'une dérogation`,`État membre associé`,`État membre observateur`,`État membre en période transitoire`],c:0,ex:`La dérogation est levée par une décision du Conseil constatant que les conditions sont remplies.`},

/* --- Gouvernance de la zone euro --- */
{q:`Quelle formation du Conseil décide si un État membre peut adopter l'euro ?`,opts:[`Le Conseil « Affaires économiques et financières »`,`Le Conseil « Affaires générales »`,`Le Conseil européen`,`Le Conseil de gouvernance de la Banque centrale européenne`],c:0,ex:`Il statue sur proposition de la Commission, après les rapports de convergence de la Commission et de la Banque centrale européenne et consultation du Parlement européen.`},
{q:`Qui compose le sommet de la zone euro ?`,opts:[`Les chefs d'État ou de gouvernement de la zone euro, son président et le président de la Commission`,`Les ministres des finances de la zone euro`,`Les gouverneurs des banques centrales nationales`,`Les présidents des parlements nationaux`],c:0,ex:`Il se réunit en principe au moins deux fois par an. Le président de la Banque centrale européenne y est invité.`},
{q:`À quelle fréquence l'Eurogroupe se réunit-il généralement ?`,opts:[`Une fois par mois, en amont du Conseil « Affaires économiques et financières »`,`Une fois par trimestre`,`Deux fois par an`,`Une fois par semaine`],c:0,ex:`Son caractère informel lui permet de préparer les décisions sans être une formation officielle du Conseil.`},
{q:`Quelle différence sépare l'Eurosystème du Système européen de banques centrales ?`,opts:[`L'Eurosystème ne réunit que les banques centrales des États de la zone euro, le Système en réunit vingt-sept`,`L'Eurosystème regroupe les banques commerciales`,`Le Système européen de banques centrales ne comprend pas la Banque centrale européenne`,`Il n'y a aucune différence`],c:0,ex:`Toutes les banques centrales nationales sont actionnaires de la Banque centrale européenne, y compris celles des États hors zone euro.`},
{q:`Qui compose le conseil des gouverneurs de la Banque centrale européenne ?`,opts:[`Les gouverneurs des banques centrales de la zone euro et les membres du directoire`,`Les ministres des finances de la zone euro`,`Les seuls membres du directoire`,`Un représentant par État membre de l'Union`],c:0,ex:`C'est l'organe de décision suprême de la Banque. Les États hors zone euro n'y siègent pas.`},
{q:`Quel objectif d'inflation la Banque centrale européenne vise-t-elle à moyen terme ?`,opts:[`2 %`,`0 %`,`4 %`,`Un taux fixé chaque année par le Conseil`],c:0,ex:`La cible est symétrique : une inflation durablement inférieure à 2 % est jugée aussi problématique qu'une inflation supérieure.`},
{q:`Qui compose le conseil des gouverneurs du Mécanisme européen de stabilité ?`,opts:[`Les ministres des finances de la zone euro`,`Les chefs d'État ou de gouvernement`,`Les gouverneurs des banques centrales nationales`,`Les commissaires européens`],c:0,ex:`Institution financière internationale créée par traité entre États de la zone euro, le Mécanisme est extérieur au cadre juridique de l'Union.`},
{q:`Quel programme la Banque centrale européenne a-t-elle ajouté à ses instruments pour écarter les craintes sur la réversibilité de l'euro ?`,opts:[`Les opérations monétaires sur titres`,`Le mécanisme de change MCE II`,`Le pacte pour l'euro plus`,`La facilité pour la reprise et la résilience`],c:0,ex:`Annoncé en 2012, ce programme n'a jamais été activé : la seule annonce a suffi à faire refluer les écarts de taux.`},

/* --- Union bancaire --- */
{q:`Quel sommet a lancé le projet d'union bancaire ?`,opts:[`Le sommet de la zone euro de juin 2012`,`Le Conseil européen de Lisbonne de 2000`,`Le sommet du G20 de Londres de 2009`,`Le Conseil européen de Nice de 2000`],c:0,ex:`L'objectif était de rompre le lien entre les difficultés des banques et celles des États qui devaient les sauver.`},
{q:`Quel est le premier pilier de l'union bancaire ?`,opts:[`Le mécanisme de surveillance unique, confié à la Banque centrale européenne`,`Le mécanisme de résolution unique`,`Le système européen de garantie des dépôts`,`Le Mécanisme européen de stabilité`],c:0,ex:`Il centralise la supervision prudentielle des banques les plus importantes de la zone euro.`},
{q:`Quel organe est au centre du mécanisme de résolution unique ?`,opts:[`Le Conseil de résolution unique`,`Le conseil des gouverneurs de la Banque centrale européenne`,`L'Autorité bancaire européenne`,`Le Comité économique et financier`],c:0,ex:`Il peut mobiliser le Fonds de résolution unique, alimenté par les contributions du secteur bancaire et non par les contribuables.`},
{q:`La participation à l'union bancaire est-elle obligatoire pour les États hors zone euro ?`,opts:[`Non, elle est volontaire pour eux et obligatoire pour les États de la zone euro`,`Oui, pour tous les États membres`,`Non, elle est fermée aux États hors zone euro`,`Elle dépend de la taille du secteur bancaire national`],c:0,ex:`Un État hors zone euro qui souhaite y participer conclut un accord de coopération étroite avec la Banque centrale européenne.`},
{q:`Qu'est-ce que le pilier de l'union bancaire resté inachevé ?`,opts:[`Le système européen de garantie des dépôts`,`Le mécanisme de surveillance unique`,`Le mécanisme de résolution unique`,`Le Fonds de résolution unique`],c:0,ex:`La mutualisation de la garantie des dépôts se heurte au refus de certains États de partager le risque tant que les bilans bancaires nationaux restent hétérogènes.`},

/* --- Gouvernance budgétaire --- */
{q:`Comment appelle-t-on les deux paquets législatifs de 2011 et 2013 qui ont refondu la gouvernance économique ?`,opts:[`Le « six-pack » et le « two-pack », d'après le nombre d'actes adoptés`,`Le pacte de Bruxelles et le pacte de Francfort`,`Les protocoles I et II`,`Les accords de Maastricht bis`],c:0,ex:`Le premier comportait six actes législatifs, le second deux, tous consacrés à la surveillance budgétaire et macroéconomique.`},
{q:`Que doivent transmettre chaque automne les États de la zone euro à la Commission et à l'Eurogroupe ?`,opts:[`Leur projet de plan budgétaire`,`Leur bilan comptable certifié`,`Leur programme d'émission de dette`,`Leur inventaire des aides d'État`],c:0,ex:`La Commission rend un avis avant l'adoption définitive par le parlement national, ce qui reste une innovation forte au regard de la souveraineté budgétaire.`},
{q:`Quelle obligation le traité sur la stabilité, la coordination et la gouvernance impose-t-il aux signataires ?`,opts:[`Inscrire une règle d'équilibre budgétaire dans leur droit national`,`Transférer leur budget à la Commission`,`Adopter l'euro dans les cinq ans`,`Plafonner leurs dépenses de défense`],c:0,ex:`Conclu en 2012 en dehors des traités européens, faute d'unanimité, il est souvent appelé pacte budgétaire.`},
{q:`Quand la clause dérogatoire générale du pacte de stabilité et de croissance a-t-elle été activée pour la première fois ?`,opts:[`En mars 2020, face à la pandémie`,`En 2008, face à la crise financière`,`En 2015, face à la crise migratoire`,`En 2022, face à la guerre en Ukraine`],c:0,ex:`Elle a permis aux États de s'écarter temporairement des exigences budgétaires sans déclencher de procédure.`},
{q:`Quel dispositif introduit en 2011 détecte les déséquilibres macroéconomiques au moyen d'un tableau de bord d'indicateurs ?`,opts:[`La procédure concernant les déséquilibres macroéconomiques`,`Le semestre européen`,`La procédure de déficit excessif`,`Le mécanisme d'alerte précoce`],c:0,ex:`Les cas graves peuvent conduire à une procédure pour déséquilibre excessif, assortie de sanctions possibles pour les États de la zone euro.`},
{q:`Jusqu'à quel niveau de remboursement un État sorti d'un programme d'ajustement reste-t-il soumis à la surveillance post-programme ?`,opts:[`Jusqu'au remboursement d'au moins 75 % des prêts reçus`,`Jusqu'au remboursement intégral`,`Jusqu'au remboursement de 50 %`,`Pendant cinq ans, quel que soit le remboursement`],c:0,ex:`La Grèce, l'Irlande, le Portugal, l'Espagne et Chypre ont tous conclu leur programme d'ajustement.`},
{q:`Quel organe consultatif indépendant de cinq experts a été créé à la suite du rapport des cinq présidents ?`,opts:[`Le Comité budgétaire européen`,`Le Comité économique et financier`,`Le Conseil de résolution unique`,`Le Comité européen du risque systémique`],c:0,ex:`Il conseille la Commission sur l'orientation budgétaire appropriée pour l'ensemble de la zone euro.`},
{q:`Quels présidents ont signé le rapport dit « des cinq présidents » de 2015 ?`,opts:[`Ceux du Conseil européen, de l'Eurogroupe, de la Commission, de la Banque centrale européenne et du Parlement européen`,`Ceux des cinq plus grands États membres`,`Ceux des cinq institutions financières de l'Union`,`Ceux des cinq groupes politiques du Parlement`],c:0,ex:`Il proposait un approfondissement de l'union économique et monétaire en deux phases, dont une partie seulement a été réalisée.`},
{q:`Quand le nouveau cadre de gouvernance économique de l'Union est-il entré en vigueur ?`,opts:[`En avril 2024`,`En janvier 2020`,`En janvier 2012`,`Il n'est pas encore adopté`],c:0,ex:`Il différencie les trajectoires d'ajustement selon la situation de chaque État et allonge la période d'ajustement en contrepartie de réformes et d'investissements.`},

/* --- L'euro comme monnaie --- */
{q:`Qui détient le droit exclusif d'autoriser l'émission des billets en euros ?`,opts:[`La Banque centrale européenne`,`La Commission européenne`,`Le Conseil de l'Union européenne`,`Chaque banque centrale nationale`],c:0,ex:`La production matérielle est répartie entre les banques centrales nationales, mais l'autorisation d'émission est centralisée.`},
{q:`Qui émet les pièces en euros ?`,opts:[`Les États de la zone euro, dans des volumes approuvés par la Banque centrale européenne`,`La Banque centrale européenne seule`,`La Commission européenne`,`La Monnaie de Paris pour l'ensemble de la zone`],c:0,ex:`C'est une différence structurelle avec les billets : les pièces restent une compétence nationale sous plafond européen.`},
{q:`Que représentent les motifs des billets en euros de la première série ?`,opts:[`Des styles architecturaux de sept périodes de l'histoire européenne`,`Les portraits des pères fondateurs`,`Les capitales des États membres`,`Des scènes de la mythologie grecque`],c:0,ex:`Fenêtres et portails au recto, ponts au verso : des motifs délibérément non attribuables à un pays précis, pour éviter toute rivalité nationale.`},
{q:`Quelle figure a donné son nom à la deuxième série de billets en euros, introduite à partir de 2013 ?`,opts:[`Europe, figure de la mythologie grecque`,`Athéna`,`Marianne`,`Europa Nostra`],c:0,ex:`Son portrait apparaît en filigrane et dans l'hologramme, comme élément de sécurité renforcé.`},
{q:`Quelle est la situation de la coupure de 500 euros ?`,opts:[`Sa production a cessé, mais les billets existants restent ayant cours légal`,`Elle a été retirée du cours légal`,`Elle n'a jamais été émise`,`Elle est réservée aux transactions interbancaires`],c:0,ex:`L'arrêt de production visait à limiter l'usage de cette coupure dans les activités illicites, sans priver les détenteurs de leur valeur.`},
{q:`Quels micro-États utilisent l'euro et frappent leurs propres pièces au titre d'un accord monétaire avec l'Union ?`,opts:[`Andorre, Monaco, Saint-Marin et le Vatican`,`L'Islande, la Norvège, le Liechtenstein et la Suisse`,`Le Kosovo, le Monténégro, l'Albanie et la Serbie`,`Malte, Chypre, le Luxembourg et l'Estonie`],c:0,ex:`Le Kosovo et le Monténégro utilisent l'euro de fait, mais sans accord monétaire avec l'Union.`},
{q:`Combien de pièces commémoratives de 2 euros chaque État de la zone euro peut-il émettre par an ?`,opts:[`Deux`,`Une`,`Quatre`,`Aucune limite`],c:0,ex:`S'y ajoutent les émissions communes à toute la zone, réservées à des anniversaires européens majeurs.`},
{q:`Quelle place l'euro occupe-t-il parmi les monnaies de réserve mondiales ?`,opts:[`La deuxième, derrière le dollar des États-Unis`,`La première`,`La troisième, derrière le dollar et le yuan`,`La cinquième`],c:0,ex:`Environ un cinquième des réserves de change mondiales sont libellées en euros.`},

/* --- Précédents historiques et intégration économique --- */
{q:`Quelle union monétaire du dix-neuvième siècle réunissait notamment la Belgique, la France, la Grèce, l'Italie et la Suisse ?`,opts:[`L'Union latine`,`L'Union scandinave`,`Le Zollverein`,`L'Union de Bruxelles`],c:0,ex:`Fondée en 1865, elle reposait sur une teneur en métal commune et a survécu jusque dans l'entre-deux-guerres.`},
{q:`Quelle union douanière allemande, créée en 1834, a précédé l'unification monétaire du pays ?`,opts:[`Le Zollverein`,`La Hanse`,`Le Reichstag`,`L'Union rhénane`],c:0,ex:`L'union douanière a précédé l'union politique, séquence souvent invoquée dans les débats sur l'intégration européenne.`},
{q:`Dans la classification usuelle des degrés d'intégration économique, que vient-il immédiatement après l'union douanière ?`,opts:[`Le marché commun`,`La zone de libre-échange`,`L'union économique et monétaire`,`L'intégration économique complète`],c:0,ex:`L'ordre est : zone de préférences, zone de libre-échange, union douanière, marché commun, union économique et monétaire, intégration complète.`},

/* --- Guide de l'Union : chiffres et repères --- */
{q:`Combien d'États participent à l'espace Schengen ?`,opts:[`Vingt-cinq États membres de l'Union et quatre États tiers`,`Les vingt-sept États membres`,`Vingt États membres seulement`,`Quinze États membres et deux États tiers`],c:0,ex:`L'Islande, le Liechtenstein, la Norvège et la Suisse y participent sans être membres de l'Union. Les contrôles peuvent être rétablis temporairement en cas de menace grave.`},
{q:`Combien de membres compte le Parlement européen pour la législature 2024-2029 ?`,opts:[`720`,`705`,`751`,`626`],c:0,ex:`Le nombre a été relevé de 705 à 720 pour cette législature, dans la limite du plafond de 751 fixé par le traité.`},
{q:`Sur quelle durée les présidences tournantes du Conseil coordonnent-elles leur programme commun ?`,opts:[`Dix-huit mois, par groupes de trois`,`Six mois, chacune séparément`,`Cinq ans, alignés sur la législature`,`Douze mois, par paires`],c:0,ex:`Le trio de présidences assure la continuité des dossiers au-delà du semestre de chacune.`},
{q:`Combien de citoyens composent un panel de citoyens européens ?`,opts:[`150, tirés au sort dans les vingt-sept États membres`,`27, un par État membre`,`500, élus par les parlements nationaux`,`1 000, désignés par les partis politiques`],c:0,ex:`Un tiers d'entre eux ont entre 16 et 25 ans. Ce format est issu de la Conférence sur l'avenir de l'Europe.`},
{q:`Quelle initiative citoyenne européenne, la première à avoir abouti, a conduit à de nouvelles règles sur l'eau potable ?`,opts:[`« Right2Water »`,`« Stop Glyphosate »`,`« Minority SafePack »`,`« End the Cage Age »`],c:0,ex:`Elle a débouché sur la révision de la directive relative à la qualité des eaux destinées à la consommation humaine.`},
{q:`Quelle part minimale du budget 2021-2027 de l'Union est consacrée à l'action climatique ?`,opts:[`30 %`,`10 %`,`50 %`,`Aucune part n'est fléchée`],c:0,ex:`Cette part transversale s'applique à l'ensemble des programmes, ce qui la distingue d'un programme climatique dédié.`},
{q:`En quelle année le programme Erasmus a-t-il été lancé ?`,opts:[`1987`,`1957`,`1992`,`2004`],c:0,ex:`Plus de quinze millions de personnes y ont participé depuis. Devenu Erasmus+, il couvre aujourd'hui l'éducation, la formation, la jeunesse et le sport.`},
{q:`Quand la suppression des frais d'itinérance a-t-elle pris effet dans l'Union ?`,opts:[`En juin 2017`,`En janvier 2010`,`En mai 2004`,`En janvier 2021`],c:0,ex:`Souvent citée comme le bénéfice le plus tangible du marché unique numérique pour les citoyens.`},
{q:`Quelle distinction l'Union européenne a-t-elle reçue en 2012 ?`,opts:[`Le prix Nobel de la paix`,`Le prix Sakharov`,`Le prix Charlemagne`,`Le prix Nobel d'économie`],c:0,ex:`Le comité a récompensé six décennies de contribution à la paix, à la réconciliation, à la démocratie et aux droits de l'homme en Europe.`},
{q:`À quelle date la Communauté européenne du charbon et de l'acier a-t-elle été instituée ?`,opts:[`Le 23 juillet 1952`,`Le 9 mai 1950`,`Le 25 mars 1957`,`Le 1er janvier 1958`],c:0,ex:`La déclaration Schuman du 9 mai 1950 en est l'acte fondateur politique ; le traité de Paris signé en 1951 n'est entré en vigueur qu'en 1952.`},
{q:`À quelle date le marché unique a-t-il été lancé ?`,opts:[`Le 1er janvier 1993`,`Le 1er juillet 1968`,`Le 1er novembre 1993`,`Le 1er janvier 1986`],c:0,ex:`À ne pas confondre avec le 1er novembre 1993, date d'entrée en vigueur du traité de Maastricht et de création de l'Union européenne.`},
{q:`Quelle est la garantie offerte par la garantie pour la jeunesse ?`,opts:[`Une offre d'emploi, de formation ou d'apprentissage de qualité dans les quatre mois`,`Un revenu minimum garanti jusqu'à 25 ans`,`Une place à l'université dans tout État membre`,`Un premier emploi dans la fonction publique européenne`],c:0,ex:`Le dispositif renforcé couvre les jeunes de moins de 30 ans, contre moins de 25 ans dans sa version initiale.`},

/* --- Jurisprudence fondatrice --- */
{q:`Qu'a jugé la Cour de justice dans l'arrêt Costa contre ENEL (1964) ?`,opts:[`Un État membre ne peut pas faire prévaloir une loi nationale postérieure sur le droit de l'Union`,`Les directives ont un effet direct horizontal`,`La Cour peut annuler une loi nationale`,`Les traités priment sur les constitutions nationales sans limite`],c:0,ex:`Le principe de primauté découle de la nature propre de l'ordre juridique institué par les traités. La Cour n'annule pas la loi nationale : elle impose au juge national de l'écarter.`},
{q:`Qu'a apporté l'arrêt Internationale Handelsgesellschaft (1970) ?`,opts:[`Les droits fondamentaux issus des traditions constitutionnelles communes peuvent être invoqués contre les actes des institutions`,`La création du recours en carence`,`L'effet direct des règlements`,`La compétence externe implicite de l'Union`],c:0,ex:`Cet arrêt répond aux juridictions constitutionnelles nationales qui craignaient que la primauté n'affaiblisse la protection des droits fondamentaux.`},
{q:`Qu'a jugé la Cour dans l'arrêt Simmenthal (1978) ?`,opts:[`Le juge national doit laisser inappliquée toute disposition nationale contraire à une norme de l'Union d'effet direct`,`Seule la Cour constitutionnelle nationale peut écarter une loi contraire au droit de l'Union`,`Les directives non transposées produisent un effet horizontal`,`Un État peut suspendre l'application d'un règlement`],c:0,ex:`Le juge ordinaire n'a pas à attendre l'abrogation de la norme nationale ni une décision de sa cour constitutionnelle : il l'écarte lui-même, immédiatement.`},
{q:`Qu'a établi l'arrêt Factortame (1990) ?`,opts:[`Le juge national doit pouvoir accorder des mesures provisoires contre une norme nationale contraire au droit de l'Union, même si son droit ne le prévoit pas`,`Les pêcheurs peuvent choisir librement leur pavillon`,`Un État peut refuser d'appliquer un arrêt de la Cour`,`La responsabilité de l'État est engagée sans faute`],c:0,ex:`C'est la traduction procédurale du principe d'effectivité : le droit de l'Union impose au juge national des pouvoirs que son propre droit lui refusait.`},
{q:`Qu'a précisé l'arrêt Foster contre British Gas (1990) ?`,opts:[`L'effet direct d'une directive peut être invoqué contre tout organisme placé sous le contrôle de l'État, y compris une entreprise publique`,`Les directives peuvent être invoquées entre particuliers`,`Une directive non transposée est nulle`,`L'État doit indemniser tout défaut de transposition`],c:0,ex:`La notion d'émanation de l'État élargit la portée de l'effet direct vertical sans franchir l'interdiction de l'effet horizontal.`},
{q:`Quel arrêt de 1986 a qualifié la Communauté de « communauté de droit » ?`,opts:[`L'arrêt Les Verts contre Parlement`,`L'arrêt Costa contre ENEL`,`L'arrêt Kadi`,`L'arrêt Cassis de Dijon`],c:0,ex:`La Cour en déduit que ni les États membres ni les institutions n'échappent au contrôle de conformité de leurs actes à la charte constitutionnelle de base qu'est le traité.`},
{q:`Quel arrêt de 1976 a consacré l'effet direct du principe d'égalité des rémunérations entre femmes et hommes ?`,opts:[`L'arrêt Defrenne contre Sabena`,`L'arrêt Bilka`,`L'arrêt Walrave`,`L'arrêt Roquette`],c:0,ex:`L'article du traité de Rome sur l'égalité salariale, longtemps regardé comme un simple objectif, devient invocable par une salariée devant son juge national.`},
{q:`Qu'a jugé la Cour dans l'arrêt Walrave et Koch (1974) ?`,opts:[`Le principe de non-discrimination peut être opposé aux fédérations sportives qui restreignent la libre circulation`,`Le sport échappe entièrement au droit de l'Union`,`Les fédérations sportives sont des institutions de l'Union`,`Les sportifs professionnels ne sont pas des travailleurs`],c:0,ex:`Cet arrêt ouvre la voie à la jurisprudence Bosman vingt ans plus tard : les règles privées entravant une liberté de circulation sont contrôlées.`},
{q:`Qu'a établi l'arrêt AETR (1971) ?`,opts:[`Un parallélisme entre les compétences internes de l'Union et sa capacité à conclure des accords internationaux`,`La primauté des accords internationaux sur les traités`,`La compétence exclusive de l'Union en matière de transports`,`L'obligation pour les États de dénoncer leurs accords antérieurs`],c:0,ex:`La compétence externe n'est pas limitée aux cas expressément prévus par les traités : elle suit la compétence interne exercée.`},
{q:`Qu'a jugé la Cour dans l'arrêt Kupferberg (1982) ?`,opts:[`Un accord international conclu par l'Union peut être invoqué directement s'il énonce un droit clair, précis et inconditionnel`,`Les accords internationaux priment sur le droit primaire`,`Les accords internationaux ne lient pas les États membres`,`Seuls les accords commerciaux ont un effet direct`],c:0,ex:`Les mêmes critères que pour l'effet direct interne s'appliquent aux stipulations conventionnelles.`},
{q:`Qu'a jugé la Cour dans l'arrêt Kadi (2008) ?`,opts:[`Le respect des droits fondamentaux conditionne la légalité des actes de l'Union, y compris lorsqu'ils mettent en œuvre une résolution du Conseil de sécurité`,`Les résolutions du Conseil de sécurité échappent à tout contrôle`,`Les mesures restrictives sont exclues du contrôle juridictionnel`,`Les droits fondamentaux ne s'appliquent qu'aux États membres`],c:0,ex:`L'arrêt affirme l'autonomie de l'ordre juridique de l'Union : le contrôle porte sur l'acte européen de transposition, pas sur la résolution elle-même.`},
{q:`Qu'a jugé la Cour dans l'arrêt Åkerberg Fransson (2013) ?`,opts:[`Une législation nationale sanctionnant une infraction au droit de l'Union entre dans le champ de la Charte, même si elle n'a pas été adoptée pour transposer la directive`,`La Charte s'applique à toute situation nationale`,`La Charte ne lie pas les États membres`,`La Charte prime sur les constitutions nationales`],c:0,ex:`L'article 51 de la Charte vise la « mise en œuvre du droit de l'Union », notion que la Cour interprète largement mais non sans limite, comme l'ont précisé les arrêts ultérieurs.`},
{q:`Qu'a reconnu la Cour dans l'arrêt Ruiz Zambrano (2011) ?`,opts:[`Refuser le séjour au parent d'un enfant citoyen de l'Union peut priver celui-ci de la jouissance effective de ses droits de citoyen`,`Tout ressortissant de pays tiers a droit au séjour`,`La citoyenneté de l'Union remplace la citoyenneté nationale`,`La libre circulation s'applique aux situations purement internes`],c:0,ex:`La citoyenneté produit ici un effet sans que l'intéressé ait exercé sa liberté de circulation, ce qui en fait un arrêt exceptionnel.`},
{q:`Qu'a jugé la Cour dans l'arrêt Associação Sindical dos Juízes Portugueses (2018) ?`,opts:[`L'exigence d'indépendance des juges s'applique dans tous les domaines couverts par le droit de l'Union, au titre de l'article 19 du traité sur l'Union`,`La rémunération des juges relève du droit de l'Union`,`La Charte s'applique à toutes les situations nationales`,`La Cour peut nommer les juges nationaux`],c:0,ex:`Cet arrêt fonde la jurisprudence ultérieure sur l'État de droit : presque toute juridiction nationale entre dans le champ protecteur de l'article 19.`},
{q:`Quel arrêt de 1980 a consacré la démocratie comme principe fondamental du droit de l'Union ?`,opts:[`L'arrêt Roquette contre Conseil`,`L'arrêt Les Verts`,`L'arrêt Defrenne`,`L'arrêt Simmenthal`],c:0,ex:`Rendu un an après la première élection du Parlement au suffrage universel direct, il sanctionne l'adoption d'un acte sans attendre l'avis du Parlement.`},
{q:`Qu'ont établi les arrêts Courage et Crehan (2001) puis Manfredi (2006) ?`,opts:[`Toute personne peut demander réparation du préjudice causé par une infraction au droit de la concurrence de l'Union`,`Les amendes de la Commission sont exclusives de toute action civile`,`Seules les entreprises peuvent agir en réparation`,`La réparation est limitée au préjudice moral`],c:0,ex:`Manfredi précise que la réparation couvre la perte subie, le manque à gagner et les intérêts, en vertu du principe d'effectivité.`},
{q:`Selon une jurisprudence constante, les libertés de circulation du traité s'appliquent-elles à une situation purement interne à un État membre ?`,opts:[`Non, un élément d'extranéité est nécessaire`,`Oui, sans condition`,`Oui, si l'État membre le demande`,`Uniquement en matière de marchandises`],c:0,ex:`Un renvoi préjudiciel portant sur une situation entièrement cantonnée à un seul État membre est en principe irrecevable, même si la Commission peut agir par ailleurs en manquement.`},

/* --- La juridiction --- */
{q:`De quelles juridictions la Cour de justice de l'Union européenne est-elle composée ?`,opts:[`La Cour de justice et le Tribunal`,`La Cour de justice seule`,`La Cour de justice, le Tribunal et le Tribunal de la fonction publique`,`La Cour de justice et la Cour européenne des droits de l'homme`],c:0,ex:`Le Tribunal de la fonction publique a été dissous en 2016 et ses compétences transférées au Tribunal.`},
{q:`Combien d'avocats généraux la Cour de justice compte-t-elle ?`,opts:[`Onze`,`Vingt-sept`,`Cinq`,`Huit`],c:0,ex:`Ils ne sont pas un par État membre, contrairement aux juges de la Cour de justice.`},
{q:`Combien de juges le Tribunal compte-t-il ?`,opts:[`Deux par État membre`,`Un par État membre`,`Vingt et un`,`Onze`],c:0,ex:`Le doublement des effectifs, échelonné entre 2016 et 2019, répondait à l'allongement des délais de jugement.`},
{q:`Comment le Tribunal traite-t-il la fonction d'avocat général ?`,opts:[`Certains de ses juges sont désignés pour l'exercer, il n'a pas d'avocats généraux nommés à ce titre`,`Il partage ceux de la Cour de justice`,`Il n'y a jamais d'avocat général devant le Tribunal`,`La Commission en fait office`],c:0,ex:`Cette désignation est notamment prévue pour les renvois préjudiciels que le Tribunal est désormais compétent pour traiter.`},
{q:`Quelle est la durée du mandat des juges de la Cour de justice ?`,opts:[`Six ans, renouvelable`,`Neuf ans, non renouvelable`,`Cinq ans, renouvelable`,`À vie`],c:0,ex:`Les juges élisent parmi eux leur président et leur vice-président pour trois ans, renouvelables.`},
{q:`Dans quels domaines le Tribunal est-il désormais compétent pour statuer sur des renvois préjudiciels que la Cour de justice lui transfère ?`,opts:[`La TVA, les droits d'accise, le code des douanes, le classement tarifaire, l'indemnisation des passagers aériens et les quotas d'émission`,`L'ensemble des renvois préjudiciels`,`Les seules affaires de concurrence`,`Les seules affaires de propriété intellectuelle`],c:0,ex:`Ce transfert, issu de la réforme du statut de la Cour, vise à décharger la Cour de justice des domaines les plus techniques et les plus répétitifs.`},
{q:`Sur quoi un pourvoi devant la Cour de justice contre une décision du Tribunal peut-il porter ?`,opts:[`Uniquement sur des points de droit, dans un délai de deux mois`,`Sur les faits comme sur le droit`,`Sur l'opportunité de la décision`,`Sur les seules questions de procédure`],c:0,ex:`L'appréciation des faits par le Tribunal échappe au contrôle de la Cour, sauf dénaturation des éléments de preuve.`},
{q:`Quel est le rôle de l'avocat général dans une affaire devant la Cour de justice ?`,opts:[`Il présente en toute indépendance des conclusions proposant une solution, sans participer au délibéré`,`Il représente la Commission`,`Il défend l'État membre mis en cause`,`Il préside la formation de jugement`],c:0,ex:`Ses conclusions ne lient pas la Cour. Elles sont souvent le seul exposé complet du raisonnement, l'arrêt étant plus resserré.`},
{q:`Dans quel cas la Cour de justice peut-elle statuer sans conclusions de l'avocat général ?`,opts:[`Lorsque l'affaire ne soulève aucune question de droit nouvelle`,`Lorsque l'affaire est urgente`,`Lorsque les parties le demandent`,`Jamais`],c:0,ex:`Cette faculté, introduite par le traité de Nice, allège le traitement des affaires répétitives.`},
{q:`Où siège la Cour de justice de l'Union européenne depuis sa création ?`,opts:[`À Luxembourg`,`À Bruxelles`,`À Strasbourg`,`À La Haye`],c:0,ex:`Elle y siège depuis 1952. À ne pas confondre avec la Cour européenne des droits de l'homme, qui siège à Strasbourg et relève du Conseil de l'Europe.`},
{q:`Combien de langues de procédure la Cour de justice de l'Union européenne admet-elle ?`,opts:[`Vingt-quatre`,`Trois`,`Une seule, le français`,`Douze`],c:0,ex:`La langue de procédure est en principe choisie par le requérant. Le français reste la langue de délibéré, ce qui explique le volume considérable de traduction.`},

/* --- Procédure d'infraction --- */

{group:'pilier', title:`Le droit de l'Union : approfondissement`, body:`
<p><b>Sources et hiérarchie des normes</b> Le droit de l'Union s'organise en strates hiérarchisées. Le <span class="kb-fact">droit primaire</span> occupe le sommet : traités (TUE, TFUE), protocoles annexés, Charte des droits fondamentaux et principes généraux dégagés par la CJUE. Les accords internationaux conclus par l'Union se situent juste en dessous, au-dessus du droit dérivé mais sous les traités. Le droit dérivé, énuméré à l'<span class="kb-fact">article 288 TFUE</span> (règlements, directives, décisions, avis, recommandations), se répartit ensuite entre actes législatifs adoptés selon une procédure législative (<span class="kb-fact">article 289 TFUE</span>), actes délégués par lesquels la Commission complète ou modifie un élément non essentiel d'un acte législatif (<span class="kb-fact">article 290 TFUE</span>) et actes d'exécution assurant des conditions uniformes de mise en œuvre (<span class="kb-fact">article 291 TFUE</span>). Un acte contraire à une norme de rang supérieur encourt l'annulation.</p>
<p><b>Les cinq recours devant la CJUE</b> Le système contentieux de l'Union distingue les recours selon le requérant et l'objet du contrôle.</p>
<ul>
<li><b>Recours en manquement</b> (<span class="kb-fact">articles 258 à 260 TFUE</span>) : dirigé contre un Etat membre, engagé le plus souvent par la Commission après une phase précontentieuse (mise en demeure puis avis motivé). Si l'Etat ne s'exécute pas après l'arrêt de la Cour, une seconde saisine permet d'imposer une somme forfaitaire ou une astreinte ; pour le défaut de communication des mesures de transposition d'une directive, l'<span class="kb-fact">article 260 § 3 TFUE</span> autorise à demander la sanction dès le premier recours.</li>
<li><b>Recours en annulation</b> (<span class="kb-fact">article 263 TFUE</span>) : conteste la légalité d'un acte de l'Union pour incompétence, violation des formes substantielles, violation des traités ou détournement de pouvoir. Les Etats membres et les institutions sont requérants privilégiés ; un particulier doit démontrer être directement et individuellement concerné, ou seulement directement concerné pour un acte réglementaire sans mesure d'exécution. Délai : <span class="kb-fact">deux mois</span>.</li>
<li><b>Recours en carence</b> (<span class="kb-fact">article 265 TFUE</span>) : sanctionne l'abstention illégale d'une institution tenue d'agir. Recevable seulement si l'institution a été invitée au préalable à agir et n'a pas pris position dans un délai de deux mois suivant l'invitation.</li>
<li><b>Renvoi préjudiciel</b> (<span class="kb-fact">article 267 TFUE</span>) : une juridiction nationale interroge la Cour sur l'interprétation ou la validité du droit de l'Union ; saisine obligatoire pour les juridictions statuant en dernier ressort. Il représente plus de <span class="kb-fact">60 %</span> des affaires portées devant la Cour de justice.</li>
<li><b>Recours en responsabilité non contractuelle</b> (<span class="kb-fact">articles 268 et 340 TFUE</span>) : demande réparation d'un dommage causé par une institution ou un agent de l'Union dans l'exercice de ses fonctions. La CJUE le qualifie de voie de droit autonome par rapport au recours en annulation et au recours en carence, avec ses propres conditions de recevabilité.</li>
</ul>
<p><b>Jurisprudence fondatrice : Simmenthal et Francovich</b> Au-delà de Van Gend en Loos et Costa/ENEL, deux arrêts organisent le rapport entre droit de l'Union et droit national. Dans <span class="kb-fact">Simmenthal</span> (<span class="kb-fact">9 mars 1978</span>, affaire <span class="kb-fact">106/77</span>), la Cour impose au juge national d'écarter d'office toute norme nationale contraire au droit de l'Union, même postérieure, sans attendre son abrogation par le législateur. Dans <span class="kb-fact">Francovich</span> (<span class="kb-fact">19 novembre 1991</span>, affaires <span class="kb-fact">C-6/90 et C-9/90</span>), la Cour consacre le principe de la responsabilité d'un Etat membre pour les dommages causés aux particuliers par une violation du droit de l'Union qui lui est imputable, sous trois conditions : la norme violée doit conférer des droits aux particuliers, le contenu de ces droits doit être identifiable, et un lien de causalité direct doit unir la violation et le dommage. L'arrêt <span class="kb-fact">Brasserie du Pêcheur et Factortame</span> (1996) précisera que la violation doit en outre être suffisamment caractérisée.</p>
<p><b>Rapport entre droit de l'Union et droit national</b> L'intégration du droit de l'Union dans les ordres juridiques nationaux repose sur trois piliers complémentaires : la primauté, l'effet direct et la responsabilité de l'Etat pour violation du droit de l'Union. Elle s'appuie aussi sur le principe de coopération loyale (<span class="kb-fact">article 4 § 3 TUE</span>), qui oblige les Etats membres à prendre toute mesure propre à assurer l'exécution du droit de l'Union. La CJUE fonde la primauté sur l'autonomie de l'ordre juridique de l'Union par rapport aux ordres nationaux et internationaux ; plusieurs cours constitutionnelles nationales la rattachent au contraire à leur propre constitution et se réservent un contrôle ultime au nom de l'identité constitutionnelle nationale, protégée par l'<span class="kb-fact">article 4 § 2 TUE</span>.</p>
<p><b>Un débat mobilisable pour l'essai</b> Le <span class="kb-fact">5 mai 2020</span>, le <span class="kb-fact">Bundesverfassungsgericht</span> (Cour constitutionnelle fédérale allemande) a jugé "ultra vires" un arrêt de la CJUE validant le programme de rachat d'actifs de la BCE ; la Cour de justice a réagi en rappelant que seule elle peut apprécier la validité d'un acte de l'Union. D'un côté, l'uniformité et l'effectivité du droit de l'Union supposent une interprétation unifiée que seule la CJUE peut garantir. De l'autre, des cours constitutionnelles nationales revendiquent un contrôle ultime sur les actes qui excéderaient les compétences transférées à l'Union ou heurteraient l'identité constitutionnelle de l'Etat membre.</p>`},

{group:'pilier', title:`Histoire et construction européenne : le grand récit (avant 1950, CED, traités modificatifs)`, body:`
<p><b>L'idée européenne avant les traités</b> : des projets d'union européenne circulent dès l'entre-deux-guerres. En <span class="kb-fact">1923</span>, le comte <span class="kb-fact">Richard Coudenhove-Kalergi</span> lance le mouvement Paneuropa, qui appelle à une fédération continentale. En 1929, le ministre français <span class="kb-fact">Aristide Briand</span> défend devant la Société des Nations un projet de « lien fédéral » entre les peuples d'Europe, précisé l'année suivante dans un mémorandum officiel. Ces projets restent sans suite concrète : la crise économique des années 1930 puis la Seconde Guerre mondiale les emportent.</p>
<p><b>1948-1949, la relance par le congrès de La Haye</b> : au sortir de la guerre, l'idée ressurgit. Du <span class="kb-fact">7 au 10 mai 1948</span>, le congrès de La Haye réunit près de <span class="kb-fact">800</span> personnalités politiques, économiques et intellectuelles d'Europe occidentale, sous la présidence d'honneur de <span class="kb-fact">Winston Churchill</span>. Il ne débouche pas sur une union politique immédiate mais prépare deux réalisations : le Mouvement européen international et surtout le <span class="kb-fact">Conseil de l'Europe</span>, créé un an plus tard, le <span class="kb-fact">5 mai 1949</span>, par le traité de Londres. À bien distinguer pour le QCM : le Conseil de l'Europe est une organisation intergouvernementale de coopération (démocratie, droits de l'homme, future Convention européenne des droits de l'homme de 1950), sans pouvoir contraignant et sans lien institutionnel avec la future Communauté, même s'il siège lui aussi à Strasbourg. C'est seulement un an plus tard que Robert Schuman propose une voie plus ambitieuse, supranationale, avec la mise en commun du charbon et de l'acier.</p>
<p><b>1954, le premier grand échec : la Communauté européenne de défense</b> : la guerre de Corée relance dès 1950 la question du réarmement de l'Allemagne de l'Ouest, réclamé par les États-Unis. Pour l'encadrer sans reconstituer une armée allemande autonome, le président du Conseil français <span class="kb-fact">René Pleven</span> propose une armée européenne intégrée, la CED, signée dès 1952 par les six pays de la CECA et pensée comme la première étape vers une Communauté politique européenne. Le projet touche à la souveraineté nationale et divise la France elle-même. Le <span class="kb-fact">30 août 1954</span>, l'Assemblée nationale française rejette le traité par une motion de procédure (question préalable), adoptée par <span class="kb-fact">319 voix contre 264</span>, sans débattre du fond. Conséquence directe : le projet parallèle de Communauté politique européenne tombe avec elle. Le réarmement ouest-allemand se fait finalement dans un cadre intergouvernemental classique : les accords de Paris, signés le <span class="kb-fact">23 octobre 1954</span>, créent l'Union de l'Europe occidentale et ouvrent la voie, l'année suivante, à l'entrée de la RFA dans l'OTAN. Cet échec ferme durablement la voie d'une intégration politique et militaire et redirige l'énergie des six vers la voie économique, celle qui mène de la relance de Messine (1955) aux traités de Rome (1957).</p>
<p><b>De l'Acte unique à Maastricht</b> : après Rome, la construction communautaire marque le pas pendant deux décennies avant de repartir avec l'Acte unique européen, préparé au Conseil européen de Fontainebleau (1984) et décidé à celui de Milan (1985) : signé en <span class="kb-fact">1986</span>, entré en vigueur le <span class="kb-fact">1er juillet 1987</span>, il fixe l'objectif d'un marché intérieur opérationnel au 1er janvier 1993 et généralise le vote à la majorité qualifiée pour l'atteindre. La chute du mur de Berlin (1989) puis la réunification allemande changent ensuite l'échelle du projet : le traité de <span class="kb-fact">Maastricht</span>, signé le <span class="kb-fact">7 février 1992</span> et entré en vigueur le <span class="kb-fact">1er novembre 1993</span>, crée juridiquement l'Union européenne, structurée en trois piliers (Communautés, politique étrangère et de sécurité commune, justice et affaires intérieures), lance l'union économique et monétaire menant à l'euro, et institue la citoyenneté européenne. C'est dans ce contexte d'après-guerre froide que l'UE accueille en 1995 l'Autriche, la Finlande et la Suède.</p>
<p><b>D'Amsterdam à Lisbonne : préparer puis digérer l'élargissement à l'Est</b> : la perspective de l'adhésion des pays d'Europe centrale et orientale impose de réformer le fonctionnement institutionnel avant d'élargir. Le traité d'Amsterdam (signé le <span class="kb-fact">2 octobre 1997</span>, en vigueur le <span class="kb-fact">1er mai 1999</span>) étend la codécision du Parlement et crée les coopérations renforcées, mais laisse ouverte la question du poids des voix. C'est le traité de Nice, signé le <span class="kb-fact">26 février 2001</span> et entré en vigueur le <span class="kb-fact">1er février 2003</span>, qui repondère les voix au Conseil et plafonne la taille de la Commission et du Parlement, précisément pour permettre le grand élargissement de 2004. Jugé insuffisant, Nice ouvre aussitôt la Convention sur l'avenir de l'Europe (2001-2003), qui rédige un projet de traité constitutionnel rejeté par référendum en France et aux Pays-Bas en 2005. Après deux ans de « période de réflexion », l'essentiel du contenu institutionnel est repris, sous une forme de traité modificatif et non de constitution, dans le traité de Lisbonne, signé le <span class="kb-fact">13 décembre 2007</span> et entré en vigueur le <span class="kb-fact">1er décembre 2009</span> : il simplifie l'architecture en piliers, dote l'Union d'une personnalité juridique unique, crée une présidence stable du Conseil européen et renforce le Parlement, qui élit désormais le président de la Commission.</p>
<p><b>Un débat mobilisable pour l'essai</b> : ce récit nourrit un débat sur la méthode de construction européenne. On peut y lire la preuve qu'une intégration par étapes concrètes (méthode Schuman-Monnet) réussit là où les projets d'union politique ou militaire d'emblée ambitieux échouent (Pan-Europe, CED, traité constitutionnel). On peut aussi y voir un déficit démocratique récurrent : le contenu du traité constitutionnel rejeté par les électeurs français et néerlandais en 2005 est repris trois ans plus tard dans le traité de Lisbonne, ratifié en France par voie parlementaire et non par un nouveau référendum, ce qui alimente la critique d'une Europe qui avancerait par le haut plutôt que par le suffrage direct des citoyens.</p>`},

{group:'pilier', title:`Vie politique et institutionnelle : au-delà des bases`, body:`
<p><b>COREPER I et II</b> : le Comité des représentants permanents prépare la quasi-totalité de l'agenda du Conseil avant que les ministres ne se prononcent. Ce n'est pas un organe de décision : tout accord qu'il obtient peut être remis en cause par le Conseil, seul habilité à trancher. Le Coreper est scindé en deux formations qui se réunissent chaque semaine. <b>Coreper II</b> réunit les représentants permanents (rang d'ambassadeur) et prépare les Conseils <span class="kb-fact">Affaires générales</span>, <span class="kb-fact">Affaires étrangères</span>, <span class="kb-fact">ECOFIN</span> et <span class="kb-fact">Justice et affaires intérieures</span>, les dossiers les plus sensibles politiquement. <b>Coreper I</b> réunit les représentants permanents adjoints et traite le gros du travail législatif technique (agriculture et pêche, compétitivité, environnement, transports, emploi et affaires sociales, éducation). Chaque instance est présidée par le représentant (ou l'adjoint) de l'État qui tient la présidence tournante du Conseil, et s'appuie sur plus d'une centaine de groupes de travail techniques. Les ordres du jour distinguent les points « I » (déjà arbitrés au niveau des groupes de travail, adoptés sans débat) et les points « II » (qui exigent une discussion, un renvoi au groupe de travail, ou une remontée au Conseil). C'est à ce niveau, bien avant la réunion ministérielle, que se joue le compromis réel entre États membres.</p>

<p><b>Comitologie</b> : une fois une loi adoptée, sa mise en œuvre technique passe souvent par des actes d'exécution de la Commission (article 291 du TFUE), encadrés par des comités d'États membres que la Commission préside : c'est la comitologie, régie par le <b>règlement (UE) n° 182/2011</b> du <span class="kb-fact">16 février 2011</span>, applicable depuis le <span class="kb-fact">1er mars 2011</span>. Deux procédures existent. La <b>procédure d'examen</b>, utilisée pour les domaines sensibles (agriculture, pêche, environnement, santé, politique commerciale, fiscalité), fait voter le comité à la majorité qualifiée (<span class="kb-fact">15 États sur 27</span> représentant au moins <span class="kb-fact">65 %</span> de la population, comme au Conseil) ; en cas d'avis négatif, la Commission peut saisir un <b>comité d'appel</b>, et si celui-ci s'y oppose aussi, l'acte ne peut pas être adopté. La <b>procédure consultative</b>, pour le reste, laisse la Commission décider seule après un vote à la majorité simple du comité, dont elle doit seulement « tenir le plus grand compte ». Quand l'acte de base relève de la procédure législative ordinaire, le Parlement et le Conseil gardent un droit de regard : ils peuvent signaler qu'un acte d'exécution excède, selon eux, les pouvoirs conférés à la Commission, qui doit alors le maintenir, le modifier ou le retirer. Ordre de grandeur : plusieurs centaines de comités de comitologie couvrent la quasi-totalité des politiques de l'Union, avec plusieurs centaines de réunions et plusieurs milliers d'avis rendus chaque année, selon les rapports annuels de la Commission (les chiffres précis d'une année donnée ne sont pas repris ici faute de confirmation directe).</p>

<p><b>Partis politiques européens et groupes parlementaires : deux choses différentes</b> : un parti politique européen (Parti populaire européen, Parti socialiste européen...) est une fédération de partis nationaux enregistrée au niveau de l'Union. Le régime qui l'encadrait, fixé par le règlement (UE, Euratom) n° 1141/2014, a été recodifié par le <span class="kb-fact">règlement (UE, Euratom) 2025/2445</span> du <span class="kb-fact">26 novembre 2025</span> ; le parti reste contrôlé par l'Autorité pour les partis politiques européens et les fondations politiques européennes (APPF). Sous l'ancien texte, l'enregistrement exigeait une représentation dans au moins <span class="kb-fact">sept États membres</span> ; ce seuil n'a pas pu être reconfirmé dans le nouveau règlement, trop récent pour être détaillé ici, à vérifier près de la date du concours. Un groupe politique au Parlement européen est autre chose : il est formé par les députés eux-mêmes après chaque élection, par affinité politique et non par nationalité, avec un minimum de <span class="kb-fact">23 députés</span> issus d'au moins un quart des États membres. Les deux travaillent en pratique en étroite coopération mais ne se confondent pas dans un QCM.</p>

<p><b>Le rapport de force au Parlement depuis juin 2024</b> : huit groupes se partagent les 720 sièges.</p>
<ul>
<li><b>PPE</b> (centre droit, démocrates-chrétiens) : 1er groupe, environ <span class="kb-fact">185</span> sièges</li>
<li><b>S&D</b> (sociaux-démocrates) : environ <span class="kb-fact">135</span></li>
<li><b>Patriotes pour l'Europe (PfE)</b> (extrême droite, autour du RN et du Fidesz) : nouveau groupe constitué le <span class="kb-fact">8 juillet 2024</span>, devenu dès sa création la 3e force du Parlement, environ <span class="kb-fact">85</span></li>
<li><b>ECR</b> (droite conservatrice eurosceptique) : environ 81</li>
<li><b>Renew Europe</b> (centristes) : environ 77</li>
<li><b>Verts/ALE</b> (écologistes) : environ 53</li>
<li><b>La Gauche/GUE-NGL</b> (gauche radicale) : environ 46</li>
<li><b>Europe des nations souveraines (ESN)</b> (extrême droite, plus radicale que PfE) : environ 27</li>
</ul>
<p>S'y ajoutent une trentaine de non-inscrits, qui n'appartiennent à aucun groupe. Ces chiffres bougent en cours de législature (transferts de groupe, non-inscrits) : à revérifier près de la date du concours. Conséquence concrète pour le fonctionnement du Parlement : aucun groupe n'approche la majorité absolue (<span class="kb-fact">361 sièges sur 720</span>), qui exige désormais une coalition de circonstance, le plus souvent PPE-S&D-Renew, parfois élargie aux Verts ou à l'ECR selon les textes.</p>

<p><b>Le poids réel des trilogues</b> : sur le papier, la procédure législative ordinaire prévoit jusqu'à trois lectures. Dans les faits, les trilogues (réunions informelles Parlement-Conseil-Commission) sont devenus la norme, à un point tel que durant la 9e législature (2019-2024), la totalité des dossiers de procédure législative ordinaire ont été clos dès la première lecture ou par un accord en deuxième lecture anticipée ; la conciliation, prévue comme troisième étape, est devenue l'exception réservée aux dossiers les plus épineux. Côté Parlement, l'équipe de négociation est conduite par le rapporteur et le président de la commission compétente (ou un vice-président), avec au moins les rapporteurs fictifs de chaque groupe politique intéressé. Côté Conseil, les négociateurs de la présidence tournante agissent sur mandat du <b>Coreper</b> (ou du Conseil lui-même) : le compromis se négocie donc, concrètement, entre un petit nombre de rapporteurs et le Coreper, avant tout débat public. La Commission joue le rôle de médiateur entre les deux colégislateurs. Tout accord provisoire reste néanmoins informel tant qu'il n'a pas été validé par un vote en commission, puis confirmé en plénière : les trilogues pèsent sur le contenu du texte, pas sur sa ratification formelle.</p>

<p><b>Un débat mobilisable pour l'EUFTE</b> : les trilogues sont régulièrement critiqués pour leur manque de transparence : le compromis se négocie hors séance publique, sur la base de mandats fixés par un nombre restreint d'acteurs (Coreper, rapporteurs, présidence tournante), ce qui nourrit une critique démocratique récurrente sur la procédure législative de l'Union. À l'inverse, leurs défenseurs soulignent qu'ils permettent de légiférer efficacement à 27, en évitant une procédure à trois lectures potentiellement interminable, et que le texte négocié reste soumis, in fine, à un vote confirmé des institutions élues ou responsables devant les électeurs (commission puis plénière au Parlement, Conseil des ministres). Un essai sur l'efficacité ou la légitimité démocratique de la prise de décision européenne peut mobiliser cette tension sans trancher.</p>`},

{group:'pilier', title:`Monnaie et Union économique et monétaire (UEM)`, body:`
<p><b>Histoire de l'euro : du serpent monétaire à Maastricht.</b> Après l'échec du "serpent monétaire européen" (<span class="kb-fact">1972</span>), fragilisé par les chocs pétroliers, le <span class="kb-fact">Système monétaire européen (SME)</span> est lancé le <span class="kb-fact">13 mars 1979</span> à l'initiative de <span class="kb-fact">Valéry Giscard d'Estaing</span> et <span class="kb-fact">Helmut Schmidt</span> : taux de change fixes mais ajustables, et création de l'<span class="kb-fact">écu</span> (European Currency Unit), unité de compte préfigurant l'euro. Le <span class="kb-fact">rapport Delors (1989)</span> programme l'UEM en trois étapes. Le <span class="kb-fact">traité de Maastricht</span>, signé le <span class="kb-fact">7 février 1992</span>, conditionne l'adoption de la monnaie unique à quatre critères de convergence :</p>
<ul>
<li>une inflation proche de celle des trois États membres présentant les meilleurs résultats en matière de stabilité des prix (écart maximal de <span class="kb-fact">1,5 point</span>) ;</li>
<li>un déficit public sous <span class="kb-fact">3 % du PIB</span> ;</li>
<li>une dette publique sous <span class="kb-fact">60 % du PIB</span> ;</li>
<li>une stabilité du taux de change et un taux d'intérêt à long terme encadré (écart maximal de <span class="kb-fact">2 points</span>).</li>
</ul>
<p>La troisième étape de l'UEM démarre le <span class="kb-fact">1er janvier 1999</span> : fixation irrévocable des taux de change et euro scriptural pour <span class="kb-fact">onze États</span>. Les pièces et billets entrent en circulation le <span class="kb-fact">1er janvier 2002</span>. La zone euro compte aujourd'hui <span class="kb-fact">21 États membres</span> depuis l'entrée de la <span class="kb-fact">Bulgarie le 1er janvier 2026</span>.</p>
<p><b>SEBC, Eurosystème et BCE.</b> Le <span class="kb-fact">Système européen de banques centrales (SEBC)</span>, institué le <span class="kb-fact">1er juin 1998</span> avec la BCE, réunit la BCE et les banques centrales nationales de tous les États membres de l'UE ; l'<span class="kb-fact">Eurosystème</span> n'en regroupe que les membres de la zone euro. La BCE fixe la politique monétaire unique via son Conseil des gouverneurs et son Directoire, avec pour objectif principal la stabilité des prix ; elle est indépendante des instructions des gouvernements et des institutions de l'UE.</p>
<p><b>Pacte de stabilité et de croissance : la réforme de 2024.</b> Les seuils historiques restent <span class="kb-fact">3 % du PIB</span> pour le déficit et <span class="kb-fact">60 % du PIB</span> pour la dette. La réforme, entrée en vigueur le <span class="kb-fact">30 avril 2024</span> et applicable depuis <span class="kb-fact">2025</span>, remplace la surveillance multicritère par un indicateur unique de trajectoire des dépenses nettes ; chaque État négocie avec la Commission un plan budgétaire et structurel national sur <span class="kb-fact">4 ans</span>, prolongeable à <span class="kb-fact">7 ans</span> contre engagements de réformes et d'investissements. Des garde-fous imposent aux États les plus endettés une réduction de la dette d'au moins <span class="kb-fact">1 point de PIB par an</span> au-delà de 90 % du PIB, et <span class="kb-fact">0,5 point</span> entre 60 % et 90 %.</p>
<p><b>Union bancaire.</b> Née de la crise des dettes souveraines, elle repose sur deux piliers opérationnels : le <span class="kb-fact">mécanisme de surveillance unique (MSU)</span>, qui confie à la BCE la supervision directe des principales banques de la zone euro depuis <span class="kb-fact">novembre 2014</span>, et le <span class="kb-fact">mécanisme de résolution unique (MRU)</span>, pleinement opérationnel depuis le <span class="kb-fact">1er janvier 2016</span>, adossé au Conseil de résolution unique et à un fonds de résolution unique pour traiter les défaillances bancaires sans recours prioritaire à l'argent public. Le troisième pilier envisagé, un système européen de garantie des dépôts (EDIS), reste inachevé faute d'accord des États membres.</p>
<p><b>Eurogroupe.</b> Formation informelle sans base explicite dans les traités hors le <span class="kb-fact">protocole n° 14</span>, l'Eurogroupe réunit chaque mois les ministres des Finances de la zone euro, avec la Commission et la BCE, pour coordonner les politiques économiques et budgétaires avant les réunions du Conseil ECOFIN. Son président est élu par ses membres pour un mandat de <span class="kb-fact">deux ans et demi</span> ; <span class="kb-fact">Kyriakos Pierrakakis</span>, ministre grec de l'Économie et des Finances, y a été élu le <span class="kb-fact">11 décembre 2025</span>.</p>
<p><b>Débat mobilisable pour l'essai.</b> L'achèvement de l'union bancaire par un système européen de garantie des dépôts partagé divise. Ses partisans y voient la condition d'un marché bancaire réellement unique, réduisant le risque systémique et le lien entre banques fragiles et finances publiques nationales. Ses opposants craignent une mutualisation prématurée des risques entre systèmes bancaires nationaux inégalement assainis, et défendent le maintien de garanties de dépôts nationales tant que la convergence prudentielle n'est pas plus poussée.</p>`},

{group:'theme', title:`Affaires étrangères : PESC, Haut représentant, élargissement et relations transatlantiques`, body:`
<p><b>La PESC, une politique intergouvernementale</b> La politique étrangère et de sécurité commune (PESC) repose sur les articles <span class="kb-fact">21 à 46 du traité sur l'Union européenne (TUE)</span>, complétés par les articles 205 à 222 du TFUE. Contrairement aux politiques communautaires classiques, elle reste de nature intergouvernementale : c'est le <span class="kb-fact">Conseil européen</span> qui fixe les orientations stratégiques, et le <span class="kb-fact">Conseil des affaires étrangères (CAE)</span>, qui réunit les ministres des affaires étrangères, qui adopte les positions et actions communes. La règle de principe posée par l'article 24 TUE est l'unanimité : chaque État membre dispose de fait d'un droit de veto sur la diplomatie commune de l'Union.</p>

<p><b>Unanimité : les soupapes et le débat sur son dépassement</b> Le traité prévoit deux mécanismes pour atténuer la rigidité de l'unanimité. L'abstention constructive permet à un État de ne pas s'opposer à une décision sans être tenu de l'appliquer. La clause passerelle de l'<span class="kb-fact">article 31, paragraphe 3, TUE</span> permettrait au Conseil européen, statuant lui-même à l'unanimité, de faire basculer certains pans de la PESC vers le vote à la majorité qualifiée, hors des décisions ayant des implications militaires ou relevant de la défense ; elle n'a toutefois jamais été activée à ce jour. Depuis l'agression russe contre l'Ukraine, plusieurs États membres, avec l'Allemagne en première ligne, réclament ce basculement, et le <span class="kb-fact">Parlement européen</span> a lui-même adopté un rapport dédié aux clauses passerelles (<span class="kb-fact">A9-0208/2023</span>) demandant leur mise en œuvre pour accélérer la prise de décision.</p>

<p><b>Haut représentant et SEAE</b> Le Haut représentant de l'Union pour les affaires étrangères et la politique de sécurité cumule trois fonctions : il préside le CAE, il est vice-président de la Commission européenne, et il dirige le <span class="kb-fact">Service européen pour l'action extérieure (SEAE)</span>, créé par le traité de Lisbonne et opérationnel depuis <span class="kb-fact">2011</span>. Depuis le <span class="kb-fact">1er décembre 2024</span>, ce poste est occupé par l'Estonienne <span class="kb-fact">Kaja Kallas</span>, qui a succédé à Josep Borrell pour un mandat de cinq ans. Le SEAE anime le réseau des délégations de l'UE dans le monde et assiste le Haut représentant ; celui-ci consulte régulièrement le Parlement européen, qui tient des débats sur la PESC deux fois par an (article 36 TUE) et vote le budget administratif et opérationnel de la politique (hors dépenses militaires).</p>

<p><b>Élargissement : où en sont les candidats</b> Le Conseil européen a accordé le statut de candidat à l'<span class="kb-fact">Ukraine</span> et à la <span class="kb-fact">Moldavie</span> le <span class="kb-fact">23 juin 2022</span>, puis à la <span class="kb-fact">Géorgie</span> en <span class="kb-fact">décembre 2023</span>. Les négociations d'adhésion avec l'Ukraine et la Moldavie ont été décidées en décembre 2023 et formellement ouvertes en juin 2024.</p>
<ul>
<li><span class="kb-fact">Ukraine et Moldavie</span> : premier cluster de négociation (« fondamentaux ») ouvert le <span class="kb-fact">15 juin 2026</span> ; mi-2026, l'ouverture des clusters suivants reste freinée par le veto répété de la <span class="kb-fact">Hongrie</span>.</li>
<li><span class="kb-fact">Géorgie</span> : statut de candidat maintenu sur le papier, mais processus de facto gelé, la Commission ayant qualifié fin 2025 la Géorgie de candidate « de nom seulement » après un net recul de l'État de droit et de la démocratie.</li>
<li><span class="kb-fact">Balkans occidentaux</span> : le Monténégro et l'Albanie sont les candidats les plus avancés (l'Albanie a ouvert l'ensemble de ses groupes de négociation fin 2025) ; la Macédoine du Nord et la Bosnie-Herzégovine restent bloquées, la première par le veto bulgare sur une réforme constitutionnelle, la seconde par une crise politique interne ; la Serbie recule sur les critères fondamentaux ; le Kosovo reste candidat potentiel, sans statut de candidat officiel.</li>
</ul>

<p><b>Relations transatlantiques</b> Les États-Unis sont le partenaire historique de l'Union en matière commerciale, économique et de sécurité. Le dialogue transatlantique des législateurs réunit deux fois par an des eurodéputés et des membres du Congrès américain. Depuis l'investiture de <span class="kb-fact">Donald Trump</span> en <span class="kb-fact">janvier 2025</span>, la relation se tend : un accord de principe sur les droits de douane a été conclu fin juillet 2025 puis formalisé par une déclaration conjointe en <span class="kb-fact">août 2025</span>, et le Parlement européen a exprimé son inquiétude face à une politique étrangère américaine plus transactionnelle et moins engagée sur la sécurité européenne.</p>

<p><b>Un débat mobilisable pour l'essai</b> Deux lectures s'opposent sur l'avenir de la PESC et de l'élargissement. D'un côté, l'unanimité protège la souveraineté de chaque État membre sur un domaine régalien et empêche qu'une majorité impose une ligne diplomatique ou militaire à un pays qui s'y oppose. De l'autre, elle expose l'Union à des blocages répétés : un seul État peut retarder une sanction, une position commune ou l'ouverture d'un cluster d'adhésion, au moment même où la guerre en Ukraine exige de la réactivité. La clause passerelle de l'article 31 TUE offre une sortie juridique à ce dilemme, mais elle suppose elle-même l'unanimité pour être activée, ce qui explique pourquoi elle reste à ce jour un outil théorique plutôt qu'une solution appliquée.</p>`},

{group:'theme', title:`Alimentation et agriculture : PAC 2023-2027, Farm to Fork et sécurité alimentaire`, body:`
<p><b>Cadre général de la PAC.</b> La politique agricole commune (PAC) actuelle couvre la période <span class="kb-fact">2023-2027</span>, sur la base du règlement <span class="kb-fact">(UE) 2021/2115</span>. Le budget agricole de l'UE pour <span class="kb-fact">2021-2027</span> atteint <span class="kb-fact">386,6 milliards d'euros</span>, répartis entre le <span class="kb-fact">FEAGA</span> (Fonds européen agricole de garantie, <span class="kb-fact">291,1 milliards d'euros</span>, paiements directs et soutien de marché) et le <span class="kb-fact">FEADER</span> (Fonds européen agricole pour le développement rural, <span class="kb-fact">95,5 milliards d'euros</span>). La PAC représente <span class="kb-fact">environ un quart des dépenses totales de l'UE</span> en 2023. Depuis la réforme, chaque État membre applique un plan stratégique national unique couvrant les deux piliers, validé par la Commission.</p>

<ul>
<li>Environ <span class="kb-fact">9 millions d'exploitations agricoles</span> dans l'UE ; le secteur emploie régulièrement quelque <span class="kb-fact">17 millions de personnes</span>.</li>
<li>Près de <span class="kb-fact">7 millions de bénéficiaires</span> de la PAC, dont plus de <span class="kb-fact">5,9 millions d'agriculteurs</span> percevant une aide directe au revenu en 2022.</li>
<li>Valeur de la production agricole de l'UE de <span class="kb-fact">532 milliards d'euros en 2024</span> (environ <span class="kb-fact">50 %</span> pour les cultures, <span class="kb-fact">40 %</span> pour les produits animaux).</li>
<li>Premiers États bénéficiaires en 2023 : <span class="kb-fact">France (9,5 milliards d'euros)</span>, <span class="kb-fact">Espagne (7,1 milliards d'euros)</span>, <span class="kb-fact">Allemagne (6,4 milliards d'euros)</span>.</li>
</ul>

<p><b>Conditionnalité.</b> L'accès aux paiements de la PAC est conditionné au respect de règles de base : bonnes conditions agricoles et environnementales (<span class="kb-fact">BCAE</span>) et exigences réglementaires en matière de gestion. La réforme <span class="kb-fact">2023-2027</span> renforce ces exigences par rapport à la période précédente et intègre les anciennes composantes du paiement vert. Autre élément nouveau : une <span class="kb-fact">conditionnalité sociale</span> lie pour la première fois les paiements directs au respect du droit du travail, obligatoire pour tous les États membres depuis <span class="kb-fact">2025</span>. Sous la pression des mobilisations agricoles du début <span class="kb-fact">2024</span>, le Parlement européen a validé en <span class="kb-fact">avril 2024</span> un assouplissement de plusieurs règles, dont la suppression de l'obligation de consacrer <span class="kb-fact">4 %</span> des terres arables à des éléments non productifs favorables à la biodiversité (BCAE 8).</p>

<p><b>Éco-régimes.</b> Introduits par la réforme, les éco-régimes (<span class="kb-fact">article 31 du règlement (UE) 2021/2115</span>) financent l'engagement volontaire des agriculteurs, au-delà de la conditionnalité, dans des pratiques favorables au climat, à l'environnement et au bien-être animal. Chaque État membre doit consacrer au moins <span class="kb-fact">25 %</span> de son enveloppe nationale de paiements directs à ces régimes, facultatifs pour les agriculteurs. Sur l'ensemble de l'UE, ils représentent <span class="kb-fact">44,71 milliards d'euros</span> sur <span class="kb-fact">2023-2027</span>, soit <span class="kb-fact">23,64 %</span> du budget total des paiements directs.</p>

<p><b>Stratégie De la ferme à la table (Farm to Fork).</b> Présentée le <span class="kb-fact">20 mai 2020</span> dans le cadre du Pacte vert pour l'Europe, elle fixe des objectifs pour <span class="kb-fact">2030</span> : réduire de <span class="kb-fact">50 %</span> l'usage et les risques des pesticides, d'au moins <span class="kb-fact">20 %</span> l'usage des engrais, de <span class="kb-fact">50 %</span> les ventes d'antimicrobiens pour le bétail, et porter à <span class="kb-fact">25 %</span> la part des terres agricoles en agriculture biologique. L'agriculture représente environ <span class="kb-fact">10 %</span> des émissions de gaz à effet de serre de l'UE, dont <span class="kb-fact">70 %</span> liés à l'élevage. Sur le gaspillage alimentaire, l'UE jette chaque année environ <span class="kb-fact">60 millions de tonnes</span> de denrées, soit <span class="kb-fact">130 kg par habitant</span> et <span class="kb-fact">132 milliards d'euros</span> de valeur marchande perdue ; des objectifs contraignants adoptés en <span class="kb-fact">septembre 2025</span> visent, d'ici 2030 et par rapport à la moyenne <span class="kb-fact">2021-2023</span>, une réduction de <span class="kb-fact">10 %</span> dans la transformation et de <span class="kb-fact">30 %</span> dans le commerce de détail, la restauration et les ménages.</p>

<p><b>Sécurité alimentaire.</b> L'invasion russe de l'Ukraine en <span class="kb-fact">février 2022</span> a replacé la sécurité alimentaire au centre de l'agenda agricole européen. La Commission a présenté le <span class="kb-fact">23 mars 2022</span> une communication sur la sécurisation de l'approvisionnement alimentaire, suivie de mesures d'urgence : autorisation temporaire de cultiver des terres en jachère, flexibilité sur la TVA alimentaire, cadre temporaire de crise pour les aides d'État, et création du mécanisme européen de préparation et de réponse aux crises de sécurité alimentaire (<span class="kb-fact">EFSCM</span>). La stratégie Farm to Fork prévoyait déjà un plan de contingence pour l'approvisionnement alimentaire, tirant les leçons de la pandémie de Covid-19.</p>

<p><b>Un débat mobilisable à l'écrit.</b> D'un côté, les tenants de l'ambition environnementale du Pacte vert jugent les objectifs de Farm to Fork et les éco-régimes nécessaires face au changement climatique et à la perte de biodiversité, et lisent les assouplissements de 2024 comme un recul. De l'autre, organisations agricoles et plusieurs États membres mettent en avant la compétitivité et le revenu des agriculteurs européens, ainsi que la souveraineté alimentaire du continent dans un contexte de guerre en Ukraine, ce qui justifie à leurs yeux de tempérer le rythme des contraintes environnementales. Ce tiraillement entre verdissement et simplification structure aussi les discussions sur l'après-2027.</p>`},

{group:'theme', title:`Climat et environnement`, body:`
<p><b>Pacte vert pour l'Europe (European Green Deal).</b> Présenté par la Commission von der Leyen en <span class="kb-fact">décembre 2019</span> comme stratégie de croissance de l'UE, il fixe l'objectif de neutralité climatique et couvre tous les secteurs : énergie, transport, agriculture, industrie, biodiversité, financement durable. Il sert de cadre à deux textes clés, la loi européenne sur le climat et le paquet <b>Fit for 55</b>.</p>

<p><b>Loi européenne sur le climat.</b> <span class="kb-fact">Règlement (UE) 2021/1119</span> du <span class="kb-fact">30 juin 2021</span>, applicable depuis le <span class="kb-fact">29 juillet 2021</span>. Il rend juridiquement contraignant l'objectif de neutralité climatique à l'horizon <span class="kb-fact">2050</span> et fixe une cible intermédiaire de <span class="kb-fact">-55 %</span> d'émissions nettes de GES en 2030 par rapport à 1990. Une révision, votée par le Parlement le <span class="kb-fact">10 février 2026</span> (413 voix pour, 226 contre, 12 abstentions) puis validée par le Conseil, ajoute un objectif 2040 de <span class="kb-fact">-90 %</span>, avec une flexibilité : jusqu'à 5 points de pourcentage pourront provenir de crédits carbone internationaux à partir de 2036. Le règlement crée aussi un conseil scientifique consultatif européen sur le changement climatique, adossé à l'Agence européenne pour l'environnement.</p>

<p><b>Fit for 55.</b> Paquet de <span class="kb-fact">13 textes législatifs</span> présenté par la Commission le <span class="kb-fact">14 juillet 2021</span> pour transposer l'objectif -55 % de 2030 dans le droit sectoriel : réforme du marché du carbone, partage de l'effort entre États pour les secteurs hors SEQE, usage des terres et des forêts (LULUCF), normes CO2 pour les véhicules avec fin des ventes de voitures thermiques neuves prévue en <span class="kb-fact">2035</span>, fonds social pour le climat.</p>

<ul>
<li><b>SEQE-UE (ETS)</b>, marché du carbone créé en <span class="kb-fact">2005</span> : plafond et échange de quotas (cap-and-trade), plafond dégressif chaque année. Phase 4 en cours : <span class="kb-fact">2021-2030</span>. Fit for 55 crée un second marché, le SEQE2, pour le bâtiment et le transport routier, dont l'entrée en vigueur a été reportée de 2027 à <span class="kb-fact">2028</span>. Les recettes alimentent le Fonds pour l'innovation et le Fonds social pour le climat.</li>
<li><b>Mécanisme d'ajustement carbone aux frontières (MACF/CBAM)</b> : applique aux importations un prix carbone équivalent à celui payé par les producteurs européens, pour limiter les fuites de carbone. Phase transitoire de déclaration entre 2023 et 2025, régime définitif avec achat de certificats à partir de <span class="kb-fact">2026</span>, pour six secteurs (ciment, fer et acier, aluminium, engrais, électricité, hydrogène). Le paquet de simplification « Omnibus », présenté le <span class="kb-fact">26 février 2025</span> et validé par le Parlement et le Conseil le 18 juin 2025, a fixé un seuil d'exemption à 50 tonnes par importateur et par an.</li>
</ul>

<p><b>Stratégie biodiversité 2030.</b> Présentée le <span class="kb-fact">20 mai 2020</span>, elle vise à protéger <span class="kb-fact">30 %</span> des terres et des mers de l'UE, dont un tiers en protection stricte (10 % du territoire). Elle a débouché sur le règlement sur la restauration de la nature, adopté le <span class="kb-fact">17 juin 2024</span> et entré en vigueur le 18 août 2024 : restaurer au moins 20 % des zones terrestres et marines dégradées d'ici 2030, avec des cibles par habitat de 30 % en 2030, 60 % en 2040 et 90 % en 2050.</p>

<p><b>Débat mobilisable pour l'essai.</b> Le Pacte vert oppose deux lectures. D'un côté, ses défenseurs relient la trajectoire -90 % en 2040 et la neutralité en 2050 aux engagements de l'Accord de Paris et à la crédibilité climatique de l'UE. De l'autre, le paquet « Omnibus » de simplification, présenté dans le sillage du rapport Draghi sur la compétitivité (septembre 2024), traduit une inquiétude sur le coût de la mise en œuvre pour l'industrie et le pouvoir d'achat (charge administrative du MACF, effet du SEQE2 sur les ménages). Le débat porte sur l'équilibre entre ambition climatique et compétitivité économique, pas sur l'objectif final de 2050.</p>`},

{group:'theme', title:`Comment fonctionne l'UE, vu du citoyen : participation et transparence`, body:`
<p><b>Le citoyen face à l'UE, au-delà du vote.</b> La citoyenneté de l'Union, définie à l'<span class="kb-fact">article 20 du TFUE</span>, ouvre des droits qui dépassent le vote aux élections européennes et la libre circulation. Quatre canaux permettent à un citoyen, et parfois à tout résident de l'UE, d'agir directement sur l'action européenne ou de la contrôler : l'initiative citoyenne européenne, le droit de pétition au Parlement, la saisine du Médiateur européen et le droit d'accès aux documents des institutions. Ce sont des instruments de démocratie participative et de transparence, complémentaires du fonctionnement institutionnel classique.</p>

<p><b>L'initiative citoyenne européenne (ICE).</b> Fondée sur l'<span class="kb-fact">article 11, paragraphe 4, du TUE</span> et l'<span class="kb-fact">article 24 du TFUE</span>, elle permet à des citoyens d'inviter la Commission à présenter une proposition législative dans un domaine où elle dispose d'une compétence. Les conditions sont précises : <span class="kb-fact">un million de signatures</span>, avec un seuil minimal atteint dans <span class="kb-fact">au moins un quart des États membres</span> (<span class="kb-fact">7 pays sur 27</span>) actuellement, portées par un comité d'organisateurs d'<span class="kb-fact">au moins 7 citoyens résidant dans 7 États membres différents</span>. Les signataires doivent avoir l'âge requis pour voter aux élections européennes, parfois abaissé à 16 ans selon l'État membre. La Commission dispose de <span class="kb-fact">2 mois</span> pour enregistrer l'initiative, les organisateurs ont ensuite <span class="kb-fact">12 mois</span> pour collecter les signatures, puis la Commission doit répondre par une communication motivée dans un délai de <span class="kb-fact">6 mois</span> après une audition publique au Parlement. Le cadre actuel est fixé par le <span class="kb-fact">règlement (UE) 2019/788</span>, en vigueur depuis le <span class="kb-fact">1er janvier 2020</span>, qui a remplacé le règlement (UE) n° 211/2011. En pratique, seule une minorité des initiatives enregistrées atteint le seuil requis, ce qui alimente les critiques sur l'effectivité de l'outil.</p>
