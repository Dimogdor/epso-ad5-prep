c:1,ex:`L'obligation de motivation est indiquée expressément. Le Parlement ne dispose pas de ce droit, la Commission n'est pas tenue de donner suite, et le texte présente la question comme un débat récurrent, non comme une réforme acquise.`},

{passage:`La lutte contre l'évasion fiscale au sein de l'Union se heurte à une contrainte institutionnelle : la fiscalité directe relève de l'unanimité au Conseil. Chaque État membre peut donc s'opposer à un texte qu'il juge contraire à ses intérêts. Des avancées ont néanmoins été obtenues, notamment sur l'échange automatique d'informations entre administrations fiscales et sur la transposition d'un accord international relatif à un niveau minimum d'imposition des grandes entreprises. Les critiques portent moins sur le principe de ces mesures que sur leur portée effective, plusieurs dispositifs comportant des exceptions et des seuils qui en réduisent le champ.`,
opts:[
`La fiscalité directe est décidée à la majorité qualifiée au Conseil.`,
`L'unanimité en matière de fiscalité directe donne à chaque État un droit d'opposition.`,
`Aucune avancée n'a été obtenue en matière d'échange d'informations fiscales.`,
`Les critiques portent principalement sur le principe des mesures adoptées.`],
c:1,ex:`Le texte fait de l'unanimité la contrainte centrale et en tire ce droit d'opposition. Il exclut la majorité qualifiée, cite l'échange automatique parmi les avancées, et précise que les critiques visent la portée, pas le principe.`},

{passage:`La stratégie de l'Union en matière de matières premières critiques repose sur trois volets : diversifier les approvisionnements, développer les capacités d'extraction et de transformation sur le territoire européen, et augmenter la part issue du recyclage. Ces objectifs sont en tension. L'ouverture de sites d'extraction se heurte à des délais d'autorisation longs et à une opposition locale fréquente. Le recyclage suppose des volumes de déchets suffisants, qui n'existent pas encore pour les technologies déployées récemment. La diversification, enfin, dépend d'accords avec des pays tiers dont les intérêts ne coïncident pas nécessairement avec ceux de l'Union.`,
opts:[
`Les trois volets de la stratégie se renforcent mutuellement sans difficulté.`,
`Le recyclage est limité par l'insuffisance actuelle des volumes de déchets pour certaines technologies.`,
`L'ouverture de sites d'extraction bénéficie de procédures d'autorisation rapides.`,
`La diversification ne dépend d'aucun accord avec des pays tiers.`],
c:1,ex:`Cette limite est énoncée telle quelle. Le texte dit que les objectifs sont « en tension », que les délais d'autorisation sont longs, et que la diversification dépend d'accords avec des pays tiers.`},

{passage:`Le principe de primauté du droit de l'Union n'est pas inscrit dans le corps des traités. Il résulte de la jurisprudence de la Cour de justice, qui l'a dégagé au début des années soixante en le déduisant de la nature même de l'ordre juridique institué par les traités. Une déclaration annexée au traité de Lisbonne en rappelle l'existence, sans lui conférer la valeur d'une disposition du traité. Plusieurs juridictions constitutionnelles nationales acceptent la primauté tout en réservant le contrôle du respect de leur identité constitutionnelle. Cette réserve n'a été mise en œuvre que dans un nombre limité de cas, mais son existence entretient une tension latente entre les ordres juridiques.`,
opts:[
`Le principe de primauté figure explicitement dans le corps des traités.`,
`La primauté a été dégagée par la jurisprudence de la Cour de justice.`,
`Aucune juridiction constitutionnelle nationale n'accepte la primauté.`,
`La réserve d'identité constitutionnelle est invoquée dans la majorité des affaires.`],
c:1,ex:`L'origine jurisprudentielle est affirmée dès la deuxième phrase. Le texte précise que le principe ne figure pas dans le corps des traités, que plusieurs juridictions l'acceptent, et que la réserve n'a joué que dans un nombre limité de cas.`},

{passage:`La désinformation en ligne se distingue de l'erreur par l'intention de tromper. Sa diffusion ne repose pas seulement sur la crédulité des lecteurs : les contenus qui suscitent une réaction émotionnelle forte circulent plus vite, indépendamment de leur exactitude. Les réponses envisagées se répartissent en trois familles : la régulation des plateformes, l'éducation aux médias et le soutien à la vérification indépendante. Chacune a ses limites. La régulation soulève des questions de liberté d'expression, l'éducation produit des effets lents, et la vérification intervient souvent après que le contenu a atteint son audience maximale. Aucune évaluation ne conclut à la supériorité nette d'une approche sur les autres.`,
opts:[
`La vérification indépendante intervient généralement avant la diffusion maximale du contenu.`,
`Les contenus suscitant une réaction émotionnelle forte circulent plus vite.`,
`L'éducation aux médias produit des effets rapides.`,
`Une des trois approches s'est révélée nettement supérieure aux autres.`],
c:1,ex:`Le mécanisme de diffusion est décrit explicitement. Le texte dit que la vérification arrive souvent trop tard, que l'éducation produit des effets lents, et qu'aucune évaluation ne départage les approches.`},

{passage:`La Banque centrale européenne poursuit un objectif principal de stabilité des prix. Sans préjudice de cet objectif, elle apporte son soutien aux politiques économiques générales de l'Union. Cette hiérarchie distingue son mandat de celui de certaines banques centrales dont les objectifs d'inflation et d'emploi sont placés sur le même plan. L'indépendance de l'institution est protégée par le traité : ni la Banque, ni les banques centrales nationales, ni les membres de leurs organes de décision ne peuvent solliciter ou accepter d'instructions des gouvernements. En contrepartie, des obligations de rendre compte existent, notamment devant le Parlement européen.`,
opts:[
`La stabilité des prix et le soutien aux politiques économiques sont placés sur le même plan.`,
`Le mandat de la Banque centrale européenne hiérarchise ses objectifs.`,
`La Banque centrale européenne peut accepter des instructions des gouvernements en période de crise.`,
`L'indépendance de la Banque exclut toute obligation de rendre compte.`],
c:1,ex:`La hiérarchie est marquée par la formule « sans préjudice de cet objectif ». Les deux objectifs ne sont donc pas sur le même plan, l'interdiction des instructions ne comporte pas d'exception dans le texte, et des obligations de rendre compte sont mentionnées.`},

{passage:`L'économie circulaire propose de substituer aux flux linéaires, qui vont de l'extraction à l'élimination, des boucles de réemploi et de recyclage. Sa mise en œuvre se heurte à des obstacles de conception : un produit assemblé par collage se démonte mal, ce qui rend la réparation coûteuse et le tri des matériaux imprécis. Des exigences d'écoconception ont donc été introduites pour certaines catégories de produits, portant notamment sur la disponibilité des pièces détachées et sur l'accès à l'information technique. Les effets attendus sont progressifs, puisqu'ils ne concernent que les produits mis sur le marché après l'entrée en application des règles.`,
opts:[
`Les exigences d'écoconception s'appliquent rétroactivement aux produits déjà en circulation.`,
`Les exigences d'écoconception portent notamment sur la disponibilité des pièces détachées.`,
`L'assemblage par collage facilite le tri des matériaux.`,
`L'économie circulaire est fondée sur un flux linéaire optimisé.`],
c:1,ex:`Le texte l'indique littéralement. Les règles ne concernent que les produits mis sur le marché après leur entrée en application, le collage rend le tri imprécis, et le principe est de substituer des boucles au flux linéaire.`},

{passage:`Le télescope spatial mis en service récemment observe principalement dans l'infrarouge, ce qui lui permet de détecter la lumière d'objets très lointains, décalée vers les grandes longueurs d'onde par l'expansion de l'univers. Pour fonctionner, ses instruments doivent être maintenus à très basse température, d'où un bouclier thermique déployé après le lancement. Cette configuration impose une position éloignée de la Terre, hors de portée d'une mission de réparation habitée. La durée de vie de l'instrument dépend donc largement de la quantité de carburant embarquée pour le maintien en position, ainsi que de la fiabilité de composants qui ne pourront pas être remplacés.`,
opts:[
`Le télescope observe principalement dans le domaine visible.`,
`Sa position le place hors de portée d'une mission de réparation habitée.`,
`Ses composants pourront être remplacés en cas de panne.`,
`Le bouclier thermique a été déployé avant le lancement.`],
c:1,ex:`Le texte le dit expressément et en tire la conséquence sur la durée de vie. Il précise que l'observation se fait dans l'infrarouge, que les composants ne pourront pas être remplacés, et que le bouclier est déployé après le lancement.`},

{passage:`La procédure de déficit excessif peut être ouverte lorsque le déficit public d'un État membre dépasse une valeur de référence, ou lorsque sa dette excède un seuil sans diminuer à un rythme satisfaisant. Elle donne lieu à des recommandations assorties d'un calendrier de correction. Les sanctions financières prévues par les textes n'ont jamais été appliquées, ce qui a nourri le reproche d'une discipline à géométrie variable. La révision du cadre de gouvernance économique a cherché à répondre à cette critique en différenciant les trajectoires d'ajustement selon la situation de chaque État, tout en renforçant l'appropriation nationale des engagements pris.`,
opts:[
`Les sanctions financières prévues par la procédure ont été appliquées à plusieurs reprises.`,
`La procédure peut être déclenchée par le niveau de la dette et non seulement par celui du déficit.`,
`La révision du cadre impose une trajectoire d'ajustement identique à tous les États.`,
`La procédure de déficit excessif a été supprimée.`],
c:1,ex:`Les deux motifs d'ouverture sont indiqués dans la première phrase. Le texte affirme que les sanctions n'ont jamais été appliquées, que la révision différencie les trajectoires, et il ne parle à aucun moment de suppression.`},

{passage:`Les langues officielles de l'Union sont celles que les États membres ont désignées lors de leur adhésion. Tout citoyen peut s'adresser aux institutions dans l'une d'elles et recevoir une réponse dans la même langue. Les actes législatifs sont publiés dans l'ensemble de ces langues, qui font toutes également foi. Le fonctionnement interne repose en pratique sur un nombre plus réduit de langues de travail, ce qui suscite des débats récurrents. Le régime linguistique du Conseil est fixé à l'unanimité, ce qui rend toute modification difficile. L'Irlande a longtemps accepté une dérogation limitant la traduction en irlandais avant que celle-ci ne prenne fin.`,
opts:[
`Une seule version linguistique d'un acte législatif fait foi.`,
`Le régime linguistique du Conseil est fixé à l'unanimité.`,
`Les institutions répondent uniquement dans les langues de travail internes.`,
`Toutes les langues parlées dans l'Union sont des langues officielles.`],
c:1,ex:`La règle de l'unanimité figure telle quelle. Le texte précise que toutes les versions font également foi, qu'une réponse est due dans la langue de la demande, et que les langues officielles sont celles désignées par les États.`},

{passage:`La résistance des sols à l'érosion dépend de leur teneur en matière organique, de leur couverture végétale et des pratiques culturales. Le labour profond, longtemps généralisé, expose la terre nue aux pluies et accélère la minéralisation du carbone stocké. Des techniques alternatives, regroupées sous le terme d'agriculture de conservation, réduisent le travail du sol et maintiennent une couverture permanente. Les résultats observés varient selon les climats et les types de sol : les gains sont nets dans certaines régions et plus incertains dans d'autres. La transition suppose par ailleurs un investissement en matériel et une période d'apprentissage pendant laquelle les rendements peuvent baisser.`,
opts:[
`L'agriculture de conservation donne des résultats identiques quel que soit le climat.`,
`La transition vers ces techniques peut s'accompagner d'une baisse temporaire des rendements.`,
`Le labour profond protège la terre de l'érosion par les pluies.`,
`La teneur en matière organique est sans effet sur la résistance des sols.`],
c:1,ex:`La dernière phrase mentionne cette baisse pendant l'apprentissage. Le texte souligne au contraire une variabilité selon climats et sols, décrit le labour comme exposant la terre nue, et fait de la matière organique un facteur de résistance.`},

{passage:`Le Médiateur européen instruit les plaintes relatives à des cas de mauvaise administration dans l'action des institutions et organes de l'Union. Il est élu par le Parlement européen après chaque élection, pour la durée de la législature. Ses pouvoirs sont ceux de la recommandation : il ne peut ni annuler un acte, ni infliger une sanction. Son efficacité repose donc sur la publicité donnée à ses conclusions et sur la disposition des institutions à s'y conformer. Les enquêtes qu'il ouvre de sa propre initiative portent fréquemment sur des questions transversales, comme la transparence des procédures ou les délais de traitement des demandes.`,
opts:[
`Le Médiateur peut annuler les actes qu'il juge irréguliers.`,
`Le Médiateur dispose de pouvoirs de recommandation, non de sanction.`,
`Le Médiateur est nommé par la Commission.`,
`Le Médiateur n'instruit que les plaintes émanant d'États membres.`],
c:1,ex:`Le texte énonce cette limite explicitement. Il exclut l'annulation et la sanction, indique que le Médiateur est élu par le Parlement, et ne réserve pas la saisine aux États membres.`},

{passage:`Les jeux vidéo occupent désormais une part importante des pratiques culturelles, tous âges confondus. Les travaux sur leurs effets se sont longtemps concentrés sur l'agressivité, avec des résultats contestés en raison de protocoles hétérogènes et d'effets de taille modeste. Un déplacement s'est opéré vers l'étude des usages problématiques, caractérisés par une perte de contrôle et des conséquences fonctionnelles, plutôt que par le seul temps passé. Cette approche distingue l'engagement intense, fréquent et sans dommage, d'un trouble avéré, beaucoup plus rare. Les recommandations qui en découlent insistent moins sur des limites horaires uniformes que sur le repérage de signaux d'alerte.`,
opts:[
`Le temps de jeu est le critère central de l'usage problématique.`,
`Les recherches distinguent l'engagement intense d'un trouble avéré, beaucoup plus rare.`,
`Les travaux sur l'agressivité ont abouti à des conclusions unanimes.`,
`Les recommandations privilégient des limites horaires uniformes.`],
c:1,ex:`Cette distinction est au cœur du texte. Il écarte le seul temps passé comme critère, qualifie les résultats sur l'agressivité de contestés, et indique que les recommandations insistent sur les signaux d'alerte plutôt que sur des durées.`},

{passage:`La coopération judiciaire en matière pénale repose largement sur le principe de reconnaissance mutuelle des décisions. Le mandat d'arrêt européen en constitue l'application la plus visible : la remise d'une personne recherchée s'effectue selon une procédure judiciaire, sans passer par une décision politique. Les motifs de refus sont énumérés de façon limitative. La Cour de justice a toutefois admis que l'exécution puisse être écartée lorsqu'il existe un risque réel de violation des droits fondamentaux, au terme d'un examen en deux étapes portant sur les défaillances systémiques puis sur la situation individuelle. Cette jurisprudence introduit une exception encadrée, sans remettre en cause le principe lui-même.`,
opts:[
`La remise dans le cadre du mandat d'arrêt européen suppose une décision politique.`,
`La Cour de justice a admis une exception fondée sur un examen en deux étapes.`,
`Les motifs de refus d'exécution sont laissés à l'appréciation libre des États.`,
`La jurisprudence a remis en cause le principe de reconnaissance mutuelle.`],
c:1,ex:`Le mécanisme en deux étapes est décrit précisément. Le texte souligne le caractère judiciaire et non politique de la procédure, l'énumération limitative des refus, et le maintien du principe.`},

{passage:`L'accès aux documents des institutions de l'Union est un droit ouvert à toute personne physique ou morale résidant ou ayant son siège dans un État membre. Le refus doit être motivé et se fonder sur une exception prévue par le règlement applicable, par exemple la protection de la vie privée ou celle des procédures juridictionnelles. Certaines exceptions cèdent devant un intérêt public supérieur à la divulgation, que le demandeur peut invoquer. En cas de refus confirmé, un recours est ouvert devant le Tribunal, ainsi qu'une plainte auprès du Médiateur. La pratique montre que les délais de traitement constituent souvent un obstacle plus effectif que les refus eux-mêmes.`,
opts:[
`Un refus d'accès n'a pas à être motivé.`,
`Certaines exceptions peuvent céder devant un intérêt public supérieur à la divulgation.`,
`Le seul recours ouvert est la plainte auprès du Médiateur.`,
`Les délais de traitement ne posent pas de difficulté en pratique.`],
c:1,ex:`Cette possibilité est mentionnée explicitement. Le texte impose la motivation du refus, ouvre à la fois le recours au Tribunal et la plainte au Médiateur, et présente les délais comme un obstacle souvent plus effectif que les refus.`},

{passage:`Le stockage de l'électricité conditionne l'intégration des sources renouvelables variables. Les batteries lithium-ion dominent aujourd'hui les installations nouvelles, en raison d'une baisse continue de leur coût. Leur usage reste toutefois adapté à des durées courtes, de l'ordre de quelques heures. Pour les besoins saisonniers, d'autres pistes sont explorées, notamment le stockage hydraulique par pompage, limité par la géographie, et la conversion de l'électricité en hydrogène, dont le rendement global demeure faible. Aucune de ces solutions ne couvre à elle seule l'ensemble des besoins, ce qui conduit les gestionnaires de réseau à raisonner en portefeuille de moyens complémentaires.`,
opts:[
`Les batteries lithium-ion conviennent au stockage saisonnier.`,
`Aucune solution de stockage ne couvre à elle seule l'ensemble des besoins.`,
`Le stockage hydraulique par pompage est déployable partout.`,
`La conversion en hydrogène présente un rendement global élevé.`],
c:1,ex:`La conclusion est énoncée dans la dernière phrase. Le texte limite les batteries à quelques heures, indique que le pompage est contraint par la géographie, et qualifie le rendement de l'hydrogène de faible.`},

{passage:`Le Comité économique et social européen réunit des représentants des employeurs, des salariés et d'autres composantes de la société civile. Il rend des avis, obligatoirement consultés dans les cas prévus par les traités et facultativement dans les autres. Ces avis ne lient pas les institutions législatives. Le Comité européen des régions suit une logique comparable pour les collectivités territoriales, avec une particularité : il peut saisir la Cour de justice pour faire respecter le principe de subsidiarité dans les domaines où sa consultation est obligatoire. Ces deux organes sont souvent présentés comme un contrepoids consultatif, dont l'influence réelle est difficile à mesurer.`,
opts:[
`Les avis du Comité économique et social lient les institutions législatives.`,
`Le Comité européen des régions peut saisir la Cour de justice au titre de la subsidiarité.`,
`La consultation du Comité économique et social est toujours facultative.`,
`Le Comité européen des régions réunit des représentants des employeurs et des salariés.`],
c:1,ex:`Cette prérogative est présentée comme la particularité du Comité des régions. Le texte précise que les avis ne lient pas, que la consultation est obligatoire dans certains cas, et que le Comité des régions représente les collectivités territoriales.`},

{passage:`Les zones humides figurent parmi les milieux dont la superficie a le plus reculé au cours du siècle passé, en raison du drainage agricole et de l'urbanisation. Leur rôle est pourtant multiple : elles retiennent l'eau lors des épisodes de crue, filtrent certains polluants et abritent une diversité biologique élevée. Elles constituent aussi un réservoir de carbone, dont le drainage libère une partie dans l'atmosphère. Des programmes de restauration ont été engagés, avec des résultats variables selon l'ancienneté de la dégradation. Les milieux détruits depuis longtemps se reconstituent plus difficilement, la structure du sol et les communautés associées ne se rétablissant pas au même rythme.`,
opts:[
`Le drainage des zones humides stocke davantage de carbone.`,
`Les milieux dégradés de longue date se reconstituent plus difficilement.`,
`Les zones humides ont gagné en superficie au cours du siècle passé.`,
`La restauration produit partout les mêmes résultats.`],
c:1,ex:`La dernière phrase l'affirme et l'explique. Le texte indique que le drainage libère du carbone, que la superficie a reculé, et que les résultats de la restauration sont variables.`},

{passage:`La règle de l'unanimité en matière de politique étrangère et de sécurité commune est régulièrement mise en cause, au motif qu'elle permet à un seul État de bloquer une position commune. Ses défenseurs objectent qu'elle garantit que les engagements pris seront effectivement soutenus par tous, puisque chacun y a consenti. Les traités prévoient déjà des aménagements, comme l'abstention constructive, qui permet à un État de ne pas participer à une action sans en empêcher l'adoption. Une clause passerelle autorise en outre le passage à la majorité qualifiée pour certaines décisions, mais son activation requiert elle-même l'unanimité, ce qui en limite la portée pratique.`,
opts:[
`L'abstention constructive empêche l'adoption d'une action commune.`,
`L'activation de la clause passerelle requiert elle-même l'unanimité.`,
`La politique étrangère commune se décide déjà à la majorité qualifiée.`,
`Les traités ne prévoient aucun aménagement à la règle de l'unanimité.`],
c:1,ex:`Le texte souligne ce paradoxe et la limite pratique qui en découle. L'abstention constructive permet au contraire l'adoption, la règle reste l'unanimité, et des aménagements existent.`},

{passage:`Les indicateurs de bien-être cherchent à compléter le produit intérieur brut, dont les limites sont documentées de longue date : il comptabilise des dépenses de réparation comme une richesse, ignore le travail domestique et ne dit rien de la répartition. Les tableaux de bord alternatifs juxtaposent plusieurs dimensions, ce qui préserve l'information mais complique la comparaison. Les indices synthétiques, à l'inverse, fournissent un chiffre unique au prix d'une pondération arbitraire entre des grandeurs hétérogènes. Aucune des deux voies ne s'est imposée. Les statisticiens soulignent que le choix relève moins de la technique que d'un arbitrage politique sur ce qui mérite d'être mesuré.`,
opts:[
`Le produit intérieur brut rend compte de la répartition des richesses.`,
`Le choix entre tableau de bord et indice synthétique relève d'un arbitrage politique.`,
`Les indices synthétiques évitent toute pondération arbitraire.`,
`Les tableaux de bord facilitent la comparaison entre pays.`],
c:1,ex:`La dernière phrase l'énonce. Le texte reproche au produit intérieur brut d'ignorer la répartition, dit que l'indice synthétique suppose une pondération arbitraire, et que le tableau de bord complique la comparaison.`},

{passage:`Le contrôle des concentrations confié à la Commission porte sur les opérations dépassant certains seuils de chiffre d'affaires. L'examen vise à déterminer si l'opération entraverait de manière significative une concurrence effective, notamment par la création ou le renforcement d'une position dominante. La Commission peut autoriser l'opération, l'interdire, ou l'autoriser sous conditions, par exemple la cession d'activités. Les décisions d'interdiction sont rares rapportées au nombre de notifications. Les entreprises anticipent en effet les objections en proposant des engagements dès la phase préliminaire, ce qui déplace une part importante de la négociation en amont de la décision formelle.`,
opts:[
`La Commission ne peut qu'autoriser ou interdire une opération.`,
`Les entreprises proposent souvent des engagements dès la phase préliminaire.`,
`Toutes les concentrations doivent être notifiées, quels que soient les seuils.`,
`Les décisions d'interdiction sont majoritaires.`],
c:1,ex:`Le texte l'indique pour expliquer la rareté des interdictions. Il mentionne aussi l'autorisation sous conditions, l'existence de seuils de chiffre d'affaires, et le caractère rare des interdictions.`},

{passage:`Le déploiement de la vaccination contre certains papillomavirus vise à prévenir des cancers survenant plusieurs décennies après l'infection. Cette temporalité longue rend la démonstration d'efficacité progressive : les premiers indicateurs portent sur la réduction des infections et des lésions précancéreuses, la baisse de l'incidence des cancers n'apparaissant que plus tard dans les données. Les couvertures vaccinales varient fortement selon les pays, en fonction notamment du caractère scolaire ou non de la campagne. Les stratégies incluant les garçons se sont généralisées, sur la base d'un raisonnement de protection collective et de la prise en compte des localisations non gynécologiques.`,
opts:[
`La baisse de l'incidence des cancers est le premier indicateur observable.`,
`Les premiers indicateurs d'efficacité portent sur les infections et les lésions précancéreuses.`,
`Les couvertures vaccinales sont homogènes entre les pays.`,
`La vaccination des garçons a été abandonnée.`],
c:1,ex:`L'ordre d'apparition des indicateurs est décrit précisément. La baisse des cancers vient plus tard, les couvertures varient fortement, et les stratégies incluant les garçons se sont généralisées.`},

{passage:`Le régime d'asile commun repose sur un principe de responsabilité de l'État de première entrée, longtemps critiqué pour la charge qu'il fait peser sur les pays situés aux frontières extérieures. Les tentatives de réforme ont buté sur l'opposition entre États favorables à une répartition obligatoire des demandeurs et États refusant tout mécanisme contraignant. Le compromis finalement retenu combine une solidarité présentée comme obligatoire dans son principe et flexible dans ses modalités : un État peut s'acquitter de sa part par une relocalisation, par une contribution financière ou par un soutien opérationnel. Cette souplesse est jugée par certains comme la condition de l'accord et par d'autres comme sa principale faiblesse.`,
opts:[
`Le compromis impose la relocalisation comme unique forme de solidarité.`,
`Un État peut s'acquitter de sa part par une contribution financière.`,
`Tous les États membres étaient favorables à une répartition obligatoire.`,
`Le principe de responsabilité de l'État de première entrée a été unanimement approuvé.`],
c:1,ex:`Les trois modalités sont énumérées dans le texte. La relocalisation n'est donc pas la seule voie, les États étaient divisés, et le principe de première entrée est décrit comme « longtemps critiqué ».`},

/* Les textes ci-dessous reprennent le registre des épreuves blanches officielles :
   passages courts, hors sujet européen, tirés de la science, de la géographie, des
   arts ou de l'histoire économique. C'est délibéré. Sur un texte consacré à l'Union,
   on répond de mémoire ; le concours teste au contraire la capacité à ne rien tirer
   d'autre que du texte. */
{passage:`Le lichen n'est pas un organisme unique mais une association durable entre un champignon et une algue, ou parfois une cyanobactérie. Le champignon fournit la structure et retient l'humidité, tandis que le partenaire photosynthétique produit les sucres. Cette association permet au lichen de coloniser des surfaces où presque rien ne pousse, comme la roche nue ou l'écorce. Sa croissance est très lente, de l'ordre de quelques millimètres par an chez certaines espèces. Les lichens sont sensibles à la pollution atmosphérique, ce qui les a fait utiliser comme indicateurs de la qualité de l'air.`,
opts:[
`Le lichen est une espèce de champignon.`,
`Les lichens croissent plus vite sur l'écorce que sur la roche.`,
`Le partenaire photosynthétique du lichen fournit les sucres de l'association.`,
`Les lichens meurent dès que la pollution atmosphérique augmente.`],
c:2,ex:`Le rôle de chaque partenaire est décrit explicitement. Le lichen est une association et non un champignon, aucune comparaison de vitesse selon le support n'est faite, et la sensibilité à la pollution ne signifie pas la mort immédiate.`},

{passage:`La marée est provoquée par l'attraction gravitationnelle de la Lune et, dans une moindre mesure, du Soleil. Lorsque ces deux astres sont alignés avec la Terre, leurs effets s'additionnent et l'amplitude est maximale : ce sont les marées de vive-eau. Lorsqu'ils forment un angle droit, les effets se compensent partiellement et l'amplitude est minimale. L'amplitude réelle dépend aussi fortement de la configuration des côtes et de la profondeur des fonds marins. Certaines baies, dont la forme concentre l'onde, connaissent des marnages de plus de dix mètres, tandis que des mers fermées n'enregistrent que quelques centimètres.`,
opts:[
`Le Soleil n'a aucun effet sur les marées.`,
`L'amplitude des marées dépend aussi de la forme des côtes.`,
`Toutes les baies connaissent des marnages supérieurs à dix mètres.`,
`Les marées de vive-eau se produisent quand la Lune et le Soleil forment un angle droit.`],
c:1,ex:`Le texte cite la configuration des côtes et la profondeur parmi les facteurs. Le Soleil agit mais moins que la Lune, seules « certaines » baies dépassent dix mètres, et l'angle droit correspond au minimum d'amplitude.`},

{passage:`Le béton romain a conservé sa cohésion pendant deux millénaires, y compris dans des ouvrages portuaires exposés à l'eau de mer, alors que le béton moderne se dégrade souvent en quelques décennies dans les mêmes conditions. Des analyses ont montré que le mélange romain contenait de la cendre volcanique, qui réagit lentement avec l'eau de mer pour former des minéraux nouveaux à l'intérieur du matériau. Loin de fragiliser l'ouvrage, cette réaction en comble progressivement les microfissures. Les ingénieurs contemporains étudient ce mécanisme, mais la reproduction industrielle se heurte à la disponibilité limitée des cendres appropriées.`,
opts:[
`La réaction avec l'eau de mer renforce le béton romain en comblant ses microfissures.`,
`Le béton moderne est systématiquement de moins bonne qualité que le béton romain.`,
`Les cendres volcaniques sont abondantes partout dans le monde.`,
`Les ingénieurs contemporains ont réussi à reproduire industriellement le béton romain.`],
c:0,ex:`Le mécanisme est décrit tel quel. La comparaison porte sur l'exposition à l'eau de mer et non sur toutes les qualités, la disponibilité des cendres est présentée comme limitée, et la reproduction industrielle se heurte encore à un obstacle.`},

{passage:`Le tempérament égal divise l'octave en douze intervalles rigoureusement identiques. Ce système présente un défaut théorique : aucun intervalle, à l'exception de l'octave, n'est parfaitement juste au sens de la physique acoustique. Il offre en revanche un avantage décisif : un instrument accordé ainsi peut jouer dans toutes les tonalités sans être réaccordé. Les systèmes antérieurs privilégiaient la justesse de certaines tonalités au prix de l'inutilisabilité des autres. L'adoption du tempérament égal s'est étalée sur plusieurs siècles et n'a jamais fait l'unanimité, certains musiciens continuant de préférer des accords inégaux pour le répertoire ancien.`,
opts:[
`Le tempérament égal rend tous les intervalles acoustiquement justes.`,
`Le tempérament égal permet de jouer dans toutes les tonalités sans réaccorder l'instrument.`,
`Les systèmes antérieurs au tempérament égal étaient inutilisables.`,
`Le tempérament égal a été adopté partout en quelques années.`],
c:1,ex:`C'est l'avantage explicitement qualifié de décisif. Seule l'octave est juste, les systèmes antérieurs rendaient certaines tonalités inutilisables et non l'ensemble, et l'adoption s'est étalée sur des siècles.`},

{passage:`Un échantillon non représentatif produit des estimations biaisées même s'il est de grande taille. Une enquête célèbre menée avant une élection américaine des années trente avait recueilli plus de deux millions de réponses et pronostiqué un résultat qui s'est révélé faux, tandis qu'un sondage portant sur quelques milliers de personnes correctement sélectionnées avait vu juste. L'erreur venait du mode de recrutement : les listes utilisées surreprésentaient les foyers aisés. L'épisode a durablement établi que la qualité de la sélection prime sur le nombre de répondants.`,
opts:[
`Un échantillon de grande taille garantit une estimation fiable.`,
`La qualité de la sélection d'un échantillon prime sur le nombre de répondants.`,
`Les enquêtes par sondage ont été abandonnées après cet épisode.`,
`Les foyers aisés votaient tous dans le même sens.`],
c:1,ex:`C'est la conclusion que le texte présente comme durablement établie. Le contre-exemple montre justement qu'une grande taille ne garantit rien, aucun abandon n'est mentionné, et le texte ne dit rien du vote effectif des foyers aisés.`},

{passage:`La conduction nerveuse repose sur des variations rapides de la charge électrique de part et d'autre de la membrane des neurones. Chez les vertébrés, une gaine isolante entoure une partie des fibres et n'est interrompue qu'à intervalles réguliers. Le signal saute alors d'une interruption à la suivante, ce qui accélère considérablement sa propagation par rapport à une fibre dépourvue de gaine. Certaines maladies détruisent progressivement cette gaine ; la conduction ralentit, sans que la fibre elle-même soit nécessairement détruite. Cela explique la diversité et la fluctuation des symptômes observés.`,
opts:[
`Toutes les fibres nerveuses des vertébrés sont dépourvues de gaine.`,
`La destruction de la gaine ralentit la conduction sans détruire nécessairement la fibre.`,
`Les maladies évoquées provoquent toujours les mêmes symptômes.`,
`Le signal nerveux se propage plus vite dans une fibre sans gaine.`],
c:1,ex:`Le texte distingue explicitement la destruction de la gaine de celle de la fibre. La gaine n'entoure qu'une partie des fibres, la diversité des symptômes est soulignée, et la gaine accélère la propagation au lieu de la ralentir.`},

{passage:`Le café arabica pousse en altitude, à des températures comprises dans une plage étroite, tandis que le robusta tolère des conditions plus chaudes et résiste mieux à certains parasites. L'arabica représente l'essentiel de la production mondiale en valeur, en raison de qualités aromatiques recherchées. Le réchauffement réduit les surfaces où l'arabica peut être cultivé dans plusieurs régions productrices, ce qui pousse les exploitations à monter en altitude, là où le relief le permet. Les programmes de sélection variétale cherchent à transférer à l'arabica une partie de la robustesse du robusta, sans que les qualités gustatives en pâtissent.`,
opts:[
`Le robusta possède de meilleures qualités aromatiques que l'arabica.`,
`Le réchauffement réduit les zones cultivables en arabica dans plusieurs régions.`,
`Toutes les exploitations peuvent compenser le réchauffement en montant en altitude.`,
`La sélection variétale a déjà résolu le problème.`],
c:1,ex:`Le texte l'affirme directement. Ce sont les qualités aromatiques de l'arabica qui sont recherchées, la montée en altitude n'est possible que là où le relief le permet, et la sélection est présentée comme un objectif en cours.`},

{passage:`Le verre n'est pas un solide cristallin : ses atomes sont figés dans un désordre comparable à celui d'un liquide. Cette structure explique sa transparence et sa fragilité caractéristique, la rupture se propageant sans être arrêtée par des plans cristallins. Une croyance répandue veut que le verre des vitraux anciens soit plus épais à la base parce qu'il aurait coulé au fil des siècles. Les mesures contredisent cette explication : la viscosité du verre à température ambiante est telle qu'un écoulement mesurable prendrait un temps hors de proportion avec l'âge des bâtiments. L'irrégularité provient des procédés de fabrication de l'époque.`,
opts:[
`Le verre ancien des vitraux a coulé sous l'effet de la gravité.`,
`L'irrégularité d'épaisseur des vitraux anciens s'explique par les procédés de fabrication.`,
`Le verre est un solide cristallin.`,
`La transparence du verre provient de sa composition chimique.`],
c:1,ex:`La dernière phrase donne l'explication retenue. L'écoulement est expressément contredit par les mesures, le verre est décrit comme non cristallin, et la transparence est rattachée à la structure désordonnée, pas à la composition.`},

{passage:`Les fonds marins abyssaux, situés au-delà de quatre mille mètres de profondeur, sont dépourvus de lumière et soumis à des pressions considérables. La vie y dépend en grande partie de la matière organique qui descend des couches supérieures, un flux très ténu. Autour des sources hydrothermales, en revanche, des communautés denses se développent sans lumière, à partir de bactéries qui tirent leur énergie de composés chimiques dissous. Ces oasis sont dispersées et souvent éphémères à l'échelle géologique, ce qui pose la question de la manière dont les espèces qui en dépendent parviennent à coloniser de nouveaux sites.`,
opts:[
`Toute la vie abyssale dépend de la matière organique venue de la surface.`,
`Autour des sources hydrothermales, des communautés se développent sans lumière.`,
`Les sources hydrothermales sont stables sur des durées géologiques.`,
`Les espèces des sources hydrothermales ne colonisent jamais de nouveaux sites.`],
c:1,ex:`Le texte oppose explicitement ces communautés au reste des fonds abyssaux. La dépendance à la surface vaut « en grande partie » et non en totalité, les oasis sont dites éphémères, et la question de la colonisation est posée, pas tranchée par la négative.`},

{passage:`Le calendrier grégorien a été introduit pour corriger une dérive du calendrier antérieur, dont l'année moyenne était légèrement trop longue par rapport à l'année solaire. L'écart accumulé atteignait une dizaine de jours et décalait progressivement les équinoxes. La réforme a supprimé plusieurs jours d'un seul coup et modifié la règle des années bissextiles pour les années séculaires. Son adoption a été immédiate dans certains pays et différée de plus d'un siècle et demi dans d'autres, pour des raisons largement politiques et religieuses. Pendant cette période, deux dates coexistaient pour un même jour selon les régions.`,
opts:[
`Le calendrier antérieur avait une année moyenne trop courte.`,
`L'adoption du calendrier grégorien a été simultanée dans tous les pays.`,
`Pendant la période de transition, un même jour pouvait porter deux dates différentes selon les régions.`,
`La réforme a ajouté plusieurs jours au calendrier.`],
c:2,ex:`C'est la conséquence énoncée dans la dernière phrase. L'année antérieure était trop longue, l'adoption a été échelonnée sur plus d'un siècle et demi, et la réforme a supprimé des jours au lieu d'en ajouter.`},

{passage:`Une langue est dite tonale lorsque la hauteur mélodique appliquée à une syllabe modifie le sens du mot. Le nombre de tons distingués varie fortement d'une langue à l'autre. Les locuteurs de langues tonales apprennent ces distinctions dès l'enfance et les traitent avec la même automaticité que les locuteurs d'autres langues traitent les consonnes. Les adultes qui apprennent une langue tonale plus tard éprouvent en revanche des difficultés durables, non parce qu'ils n'entendent pas les différences, mais parce qu'ils ne les traitent pas comme porteuses de sens. La rééducation passe donc davantage par l'usage que par l'exercice auditif isolé.`,
opts:[
`Toutes les langues tonales distinguent le même nombre de tons.`,
`Les adultes apprenants n'entendent pas les différences de ton.`,
`La difficulté des adultes tient au traitement du sens plutôt qu'à la perception.`,
`Les enfants apprennent les tons par un exercice auditif spécifique.`],
c:2,ex:`Le texte le précise explicitement : « non parce qu'ils n'entendent pas ». Le nombre de tons varie, la perception n'est pas en cause, et l'apprentissage enfantin est décrit comme automatique, sans exercice dédié.`},

{passage:`Les glaciers de montagne perdent de la masse lorsque la fonte estivale dépasse l'accumulation hivernale. Ce bilan se mesure année après année en plusieurs points de la surface. Un glacier peut continuer d'avancer alors même que son bilan est négatif, car l'écoulement de la glace se poursuit indépendamment. Le recul du front n'est donc pas un indicateur immédiat du bilan de masse, mais une conséquence différée. Les séries de mesures les plus longues, entamées à la fin du dix-neuvième siècle, montrent une tendance générale à la perte, avec des périodes intermédiaires de reprise.`,
opts:[
`Un glacier dont le bilan de masse est négatif cesse immédiatement d'avancer.`,
`Le recul du front est une conséquence différée du bilan de masse.`,
`Les séries de mesures montrent une perte continue sans aucune reprise.`,
`Le bilan de masse se mesure en un seul point du glacier.`],
c:1,ex:`Le texte oppose l'indicateur immédiat à la conséquence différée. L'avancée peut se poursuivre malgré un bilan négatif, des périodes de reprise sont mentionnées, et la mesure se fait en plusieurs points.`},

{passage:`L'aluminium est l'un des métaux les plus abondants de la croûte terrestre, mais il n'y existe pas à l'état natif : il est toujours combiné à d'autres éléments. Son extraction n'est devenue économiquement viable qu'avec la mise au point d'un procédé électrolytique, très consommateur d'énergie. Avant cela, le métal était une curiosité coûteuse. Le recyclage de l'aluminium ne demande qu'une fraction de l'énergie nécessaire à la production primaire, ce qui en fait l'un des matériaux dont la seconde vie est la plus avantageuse. Une part importante de l'aluminium produit depuis l'origine reste aujourd'hui en circulation.`,
opts:[
`L'aluminium se trouve à l'état natif dans la croûte terrestre.`,
`Le recyclage de l'aluminium consomme nettement moins d'énergie que la production primaire.`,
`L'aluminium a toujours été un métal bon marché.`,
`La totalité de l'aluminium produit depuis l'origine est encore en circulation.`],
c:1,ex:`Le texte l'affirme et en tire l'intérêt du recyclage. L'aluminium n'existe pas à l'état natif, il fut une curiosité coûteuse, et c'est « une part importante » et non la totalité qui reste en circulation.`},

{passage:`La perspective linéaire construit sur une surface plane l'illusion de la profondeur en faisant converger vers un point unique les lignes parallèles perpendiculaires au plan du tableau. Son usage systématique apparaît en Italie au quinzième siècle et se diffuse rapidement. Les peintures antérieures n'ignoraient pas la profondeur, mais la rendaient par d'autres moyens, comme la superposition des figures ou la variation de leur taille selon leur importance et non selon leur éloignement. La perspective linéaire a été présentée comme un progrès objectif, ce que contestent certains historiens de l'art, pour qui elle constitue une convention parmi d'autres.`,
opts:[
`Les peintures antérieures au quinzième siècle ne représentaient pas la profondeur.`,
`Avant la perspective linéaire, la taille des figures pouvait dépendre de leur importance.`,
`Tous les historiens de l'art considèrent la perspective linéaire comme un progrès objectif.`,
`La perspective linéaire fait converger les lignes vers plusieurs points.`],
c:1,ex:`Le texte donne cet exemple des moyens antérieurs. La profondeur était rendue autrement mais bien rendue, certains historiens contestent l'idée de progrès, et la convergence se fait vers un point unique.`},

{passage:`Les fourmis d'une même colonie se reconnaissent grâce à un mélange de composés chimiques déposé à la surface de leur cuticule. Ce profil varie d'une colonie à l'autre et évolue lentement avec l'alimentation et l'environnement du nid. Une ouvrière transférée dans une colonie étrangère est généralement attaquée, mais une ouvrière très jeune, dont le profil n'est pas encore fixé, peut être adoptée. Certaines espèces parasites exploitent ce mécanisme en imitant le profil chimique de leur hôte, ce qui leur permet de circuler dans le nid sans être inquiétées.`,
opts:[
`Le profil chimique d'une colonie est fixe et ne varie jamais.`,
`Une ouvrière très jeune peut être adoptée par une colonie étrangère.`,
`Toutes les fourmis transférées dans une colonie étrangère sont adoptées.`,
`Les espèces parasites produisent un profil chimique unique et reconnaissable.`],
c:1,ex:`Le texte pose explicitement cette exception. Le profil évolue avec l'alimentation et l'environnement, le transfert conduit « généralement » à une attaque, et les parasites imitent le profil de l'hôte au lieu d'en avoir un propre.`},

{passage:`Le rendement d'une cellule photovoltaïque diminue lorsque sa température augmente. Cette caractéristique explique un résultat contre-intuitif : à ensoleillement égal, une installation située dans une région tempérée peut produire davantage qu'une installation en climat très chaud. Le refroidissement passif par circulation d'air sous les panneaux limite cette perte, ce qui rend l'inclinaison et le dégagement du montage plus déterminants qu'on ne le suppose. Les technologies récentes réduisent la sensibilité thermique sans l'annuler. Le facteur dominant reste néanmoins la quantité d'énergie lumineuse reçue sur l'année.`,
opts:[
`Une installation en climat chaud produit toujours davantage qu'en climat tempéré.`,
`Le facteur dominant du rendement annuel reste la quantité de lumière reçue.`,
`Les technologies récentes ont supprimé la sensibilité thermique.`,
`Le refroidissement des panneaux est sans effet sur la production.`],
c:1,ex:`La dernière phrase le désigne comme facteur dominant. Le texte présente le cas inverse comme possible et non systématique, la sensibilité thermique est réduite sans être annulée, et le refroidissement limite bien la perte.`},

{passage:`La domestication du cheval a modifié la vitesse de circulation des personnes, des marchandises et des informations sur de longues distances. Les recherches situent son foyer dans les steppes d'Eurasie, mais la datation précise fait encore débat, les indices archéologiques étant indirects : usure des dents, morphologie des ossements, présence d'équipements. L'usage attelé et l'usage monté ne sont pas apparus au même moment ni nécessairement au même endroit. La diffusion vers l'ouest et vers l'est a été rapide au regard des standards de l'époque, mais s'est étalée sur plusieurs siècles.`,
opts:[
`La datation précise de la domestication du cheval fait encore débat.`,
`L'usage attelé et l'usage monté sont apparus simultanément.`,
`Les indices archéologiques disponibles sont directs.`,
`La diffusion du cheval domestique a pris moins d'un siècle.`],
c:0,ex:`Le texte l'indique explicitement en donnant la raison. Les deux usages ne sont pas simultanés, les indices sont qualifiés d'indirects, et la diffusion s'est étalée sur plusieurs siècles.`},

{passage:`Un test de dépistage produit deux types d'erreurs : le faux positif, qui signale une maladie absente, et le faux négatif, qui la manque. Améliorer l'un de ces taux dégrade en général l'autre. Le choix du seuil dépend donc des conséquences relatives de chaque erreur. Pour une maladie rare, même un test très spécifique produit une majorité de faux positifs parmi les résultats positifs, parce que les personnes saines sont beaucoup plus nombreuses. Ce résultat, contraire à l'intuition, justifie la pratique du test de confirmation avant toute annonce.`,
opts:[
`Améliorer le taux de faux positifs améliore aussi celui des faux négatifs.`,
`Pour une maladie rare, la majorité des résultats positifs peuvent être des faux positifs.`,
`Un test très spécifique élimine les faux positifs.`,
`Le seuil d'un test est fixé indépendamment des conséquences des erreurs.`],
c:1,ex:`Le texte l'énonce et l'explique par la proportion de personnes saines. Les deux taux évoluent en sens inverse, la spécificité élevée ne suffit pas, et le seuil dépend précisément des conséquences.`},

{passage:`Le canal de Suez relie deux mers dont le niveau moyen diffère peu, ce qui a permis de le construire sans écluse. Cette caractéristique le distingue du canal de Panama, où la dénivelée impose un franchissement par bassins successifs. L'absence d'écluses accélère le transit mais rend la voie plus vulnérable à un incident isolé : un navire immobilisé peut interrompre la circulation dans les deux sens. Les élargissements successifs ont visé à permettre le croisement des navires sur une partie du parcours, sans supprimer entièrement les sections à voie unique.`,
opts:[
`Le canal de Panama a été construit sans écluses.`,
`L'absence d'écluses rend le canal de Suez plus vulnérable à un incident isolé.`,
`Les élargissements ont supprimé toutes les sections à voie unique.`,
`Les deux mers reliées par le canal de Suez ont des niveaux moyens très différents.`],
c:1,ex:`Le texte tire cette conséquence de l'absence d'écluses. Panama comporte des bassins, les sections à voie unique subsistent, et les niveaux diffèrent peu.`},

{passage:`Les manuscrits sur parchemin ont parfois été grattés pour être réutilisés, l'écriture ancienne étant recouverte d'un nouveau texte. Ces palimpsestes conservent souvent des traces de la première écriture, invisibles à l'œil nu mais révélées par des techniques d'imagerie multispectrale. Plusieurs textes antiques connus uniquement par ce moyen ont ainsi été restitués. La lecture reste partielle : l'imagerie révèle des lettres, non des pages entières, et l'interprétation suppose un travail philologique long. Le procédé est non destructif, ce qui a permis de l'appliquer à des pièces qu'aucun conservateur n'aurait autorisé à traiter chimiquement.`,
opts:[
`L'imagerie multispectrale restitue les pages entières des textes effacés.`,
`Le procédé d'imagerie est non destructif, ce qui a permis de l'appliquer à des pièces fragiles.`,
`Les traces de la première écriture sont visibles à l'œil nu.`,
`Aucun texte antique n'a été retrouvé grâce aux palimpsestes.`],
c:1,ex:`Le texte l'indique et en tire la conséquence pratique. La lecture est explicitement partielle, les traces sont invisibles à l'œil nu, et plusieurs textes ont été restitués par ce moyen.`},

{passage:`L'effet placebo désigne l'amélioration observée chez un patient recevant un traitement inactif, lorsqu'il croit recevoir un traitement réel. Son ampleur varie selon les symptômes : elle est notable pour la douleur ou la fatigue, plus faible pour des mesures objectives comme la taille d'une tumeur. Les essais cliniques recourent au groupe témoin précisément pour distinguer l'effet propre du produit de cet effet d'attente. Des travaux ont montré que l'effet subsiste en partie même lorsque le patient est informé qu'il reçoit un placebo, ce qui complique l'explication par la seule croyance.`,
opts:[
`L'effet placebo a la même ampleur quel que soit le symptôme considéré.`,
`L'effet placebo subsiste en partie même lorsque le patient sait qu'il reçoit un placebo.`,
`L'effet placebo modifie fortement la taille des tumeurs.`,
`Les essais cliniques n'ont pas besoin de groupe témoin.`],
c:1,ex:`Le texte le rapporte et en souligne la conséquence théorique. L'ampleur varie selon les symptômes, l'effet est faible sur les mesures objectives, et le groupe témoin sert précisément à faire la part des choses.`},

{passage:`La navigation à l'estime consiste à déduire sa position à partir du cap suivi, de la vitesse et du temps écoulé depuis un point connu. Elle ne nécessite aucune observation extérieure, ce qui la rend utilisable par mauvaise visibilité. Son défaut est l'accumulation : chaque petite erreur de cap ou de vitesse s'ajoute aux précédentes, si bien que l'incertitude croît avec la durée du trajet. Les navigateurs corrigeaient donc leur estime dès qu'un repère fiable redevenait disponible. Les systèmes inertiels modernes reposent sur le même principe et souffrent de la même dérive, compensée par un recalage périodique.`,
opts:[
`La navigation à l'estime exige l'observation d'un repère extérieur.`,
`L'incertitude de la navigation à l'estime croît avec la durée du trajet.`,
`Les systèmes inertiels modernes ne souffrent d'aucune dérive.`,
`Une erreur de cap est corrigée automatiquement par les erreurs suivantes.`],
c:1,ex:`Le texte explique cette accumulation. La méthode se passe justement d'observation extérieure, les systèmes inertiels souffrent de la même dérive, et les erreurs s'ajoutent au lieu de se compenser.`},

{passage:`La levure utilisée en panification produit du dioxyde de carbone en consommant les sucres de la pâte. Le gaz est retenu par un réseau de protéines qui se forme lorsque la farine est hydratée puis travaillée. C'est ce réseau, et non la levure, qui détermine la capacité de la pâte à lever et à conserver son volume à la cuisson. Une farine pauvre en ces protéines donne un pain dense, quelle que soit la quantité de levure ajoutée. Les temps de repos longs améliorent aussi la texture, par une action lente qui ne dépend pas de la production de gaz.`,
opts:[
`Augmenter la quantité de levure suffit à faire lever une farine pauvre en protéines.`,
`C'est le réseau de protéines qui détermine la capacité de la pâte à conserver son volume.`,
`Les temps de repos longs agissent en augmentant la production de gaz.`,
`La levure produit du dioxyde de carbone sans consommer de sucre.`],
c:1,ex:`Le texte l'affirme en opposant explicitement le réseau à la levure. Une farine pauvre donne un pain dense quelle que soit la levure, l'action du repos est décrite comme indépendante du gaz, et la levure consomme bien les sucres.`},

{passage:`Les récifs coralliens occupent une fraction très faible de la surface des océans mais abritent une part considérable des espèces marines connues. Leur structure est bâtie par des animaux qui vivent en symbiose avec des algues microscopiques hébergées dans leurs tissus. Un stress thermique prolongé conduit le corail à expulser ces algues, ce qui le fait blanchir : il n'est pas mort à ce stade et peut se rétablir si les conditions redeviennent favorables assez vite. Des épisodes de blanchissement rapprochés laissent en revanche trop peu de temps à la récupération.`,
opts:[
`Un corail blanchi est un corail mort.`,
`Un corail blanchi peut se rétablir si les conditions redeviennent favorables assez vite.`,
`Les récifs coralliens occupent une part importante de la surface des océans.`,
`Les algues symbiotiques vivent à l'extérieur des tissus du corail.`],
c:1,ex:`Le texte le précise expressément. Le blanchissement n'équivaut pas à la mort, la surface occupée est décrite comme très faible, et les algues sont hébergées dans les tissus.`},

{passage:`La cartographie du dix-septième siècle comportait des zones laissées volontairement vides lorsque les relevés manquaient, alors que la pratique antérieure remplissait ces espaces de motifs décoratifs ou d'informations invérifiables. Ce changement traduit une évolution du statut de la carte, désormais tenue pour un instrument de mesure plutôt que pour une représentation du monde connu. Les commanditaires n'y ont pas toujours vu un progrès : une carte incomplète pouvait révéler à un rival l'étendue exacte de l'ignorance d'un État. Certaines cartes officielles ont donc conservé des remplissages fictifs bien après que la pratique fut critiquée.`,
opts:[
`Toutes les cartes officielles ont cessé d'utiliser des remplissages fictifs au dix-septième siècle.`,
`Une carte incomplète pouvait révéler à un rival l'étendue de l'ignorance d'un État.`,
`Les cartes antérieures laissaient les zones inconnues vides.`,
`Les commanditaires ont unanimement approuvé le passage aux zones vides.`],
c:1,ex:`Le texte donne cette raison à la persistance des remplissages. Certaines cartes officielles ont continué la pratique, les cartes antérieures remplissaient les vides, et les commanditaires n'y ont pas tous vu un progrès.`},

{passage:`Un matériau supraconducteur perd toute résistance électrique en dessous d'une température critique qui lui est propre. Cette propriété permet de faire circuler un courant sans perte, ce qui intéresse le transport d'électricité et l'imagerie médicale. Les premiers supraconducteurs identifiés exigeaient un refroidissement à quelques degrés au-dessus du zéro absolu. Des composés découverts plus tard fonctionnent à des températures nettement plus élevées, quoique toujours très inférieures à la température ambiante. Aucun mécanisme théorique unique ne rend compte de l'ensemble des cas observés, ce qui limite la capacité à prédire de nouveaux matériaux.`,
opts:[
`Certains supraconducteurs fonctionnent à température ambiante.`,
`Aucun mécanisme théorique unique ne rend compte de tous les cas de supraconductivité observés.`,
`Les supraconducteurs conservent une résistance électrique faible mais non nulle.`,
`Les premiers supraconducteurs identifiés fonctionnaient à température élevée.`],
c:1,ex:`La dernière phrase l'affirme et en tire la limite pratique. Les températures restent très inférieures à l'ambiante, la résistance est décrite comme nulle, et les premiers cas exigeaient un froid extrême.`},

{passage:`Le droit romain distinguait la possession, situation de fait, et la propriété, situation de droit. Un possesseur pouvait être protégé contre les troubles apportés à sa maîtrise de la chose sans avoir à prouver qu'il en était propriétaire, ce qui simplifiait considérablement le règlement des litiges courants. Cette distinction a été reprise par la plupart des systèmes juridiques continentaux. Elle explique qu'une action puisse être gagnée par un plaideur qui n'établit aucun titre, ce que les non-juristes perçoivent souvent comme une anomalie alors qu'il s'agit d'une économie de preuve délibérée.`,
opts:[
`La possession et la propriété désignent la même situation juridique.`,
`Un possesseur pouvait être protégé sans prouver qu'il était propriétaire.`,
`Le droit romain exigeait toujours la preuve du titre de propriété.`,
`Cette distinction n'a été reprise par aucun système juridique moderne.`],
c:1,ex:`C'est le contenu exact de la distinction décrite. Les deux notions sont expressément distinguées, la preuve du titre n'est pas exigée du possesseur, et la distinction a été largement reprise.`},

{passage:`Le vol des insectes ne s'explique pas par les modèles aérodynamiques conçus pour les ailes fixes. Leurs ailes battent selon des trajectoires complexes qui engendrent des tourbillons au bord d'attaque, lesquels créent une portance supplémentaire tant qu'ils restent attachés à l'aile. Cette explication a mis longtemps à s'imposer, car elle suppose des mesures sur des objets très petits et très rapides. Les modèles réduits pilotés qui exploitent le même principe existent, mais leur autonomie reste faible, la consommation associée à ce mode de vol étant élevée.`,
opts:[
`Le vol des insectes s'explique par les modèles conçus pour les ailes fixes.`,
`Les tourbillons de bord d'attaque créent une portance tant qu'ils restent attachés à l'aile.`,
`Les modèles réduits exploitant ce principe ont une autonomie élevée.`,
`Cette explication s'est imposée immédiatement.`],
c:1,ex:`Le mécanisme est décrit avec sa condition. Le texte écarte les modèles à ailes fixes, l'autonomie des modèles réduits est faible, et l'explication a mis longtemps à s'imposer.`},

{passage:`Les toits végétalisés retiennent une partie des eaux de pluie, ce qui réduit les pointes de ruissellement lors des orages et soulage les réseaux d'assainissement. Ils abaissent aussi la température de surface du bâtiment en été. Leur mise en œuvre suppose que la structure porteuse supporte le poids du substrat gorgé d'eau, contrainte qui exclut une partie du bâti existant. Le gain thermique en hiver est modeste, l'isolation apportée par le substrat restant limitée. Les évaluations économiques concluent à une rentabilité qui dépend fortement du prix de l'eau et des règles locales de gestion du ruissellement.`,
opts:[
`Les toits végétalisés apportent un gain thermique important en hiver.`,
`La contrainte de poids exclut une partie du bâti existant.`,
`Leur rentabilité est identique partout.`,
`Ils augmentent les pointes de ruissellement lors des orages.`],
c:1,ex:`Le texte pose cette contrainte explicitement. Le gain hivernal est qualifié de modeste, la rentabilité dépend du contexte local, et le ruissellement est réduit et non augmenté.`},

{passage:`La monnaie de compte et la monnaie de paiement ont longtemps été distinctes en Europe. Les prix étaient exprimés dans une unité abstraite, tandis que les règlements se faisaient en pièces réelles dont le contenu en métal variait. Le pouvoir souverain pouvait modifier le rapport entre les deux, ce qui revenait à alléger ou alourdir les dettes sans toucher aux pièces elles-mêmes. Cette pratique était comprise des marchands, qui indexaient leurs contrats en conséquence. La confusion des deux fonctions dans une monnaie unique est une évolution tardive, liée à la stabilisation des systèmes monétaires nationaux.`,
opts:[
`La monnaie de compte et la monnaie de paiement ont toujours été confondues.`,
`Modifier le rapport entre les deux monnaies revenait à alléger ou alourdir les dettes.`,
`Les marchands ignoraient cette pratique.`,
`Le contenu en métal des pièces était strictement constant.`],
c:1,ex:`Le texte l'énonce comme la conséquence directe du pouvoir souverain. La confusion des deux fonctions est tardive, les marchands comprenaient la pratique, et le contenu métallique variait.`},

{passage:`La transhumance consiste à déplacer les troupeaux entre pâturages d'altitude en été et zones basses en hiver. Cette pratique permet d'exploiter des herbages qui ne sont accessibles qu'une partie de l'année et de laisser reposer les prairies de vallée. Elle façonne des paysages ouverts dont dépendent plusieurs espèces d'oiseaux et de plantes. Le recul de la transhumance dans certaines régions s'accompagne d'une fermeture du milieu par la broussaille, puis par la forêt. Les dispositifs de soutien public visent moins à préserver une tradition qu'à maintenir cet effet d'entretien.`,
opts:[`La transhumance a pour objectif principal la préservation d'une tradition.`,`Le recul de la transhumance entraîne une fermeture du milieu par la végétation.`,`Les pâturages d'altitude sont accessibles toute l'année.`,`Les prairies de vallée ne sont jamais utilisées.`],
c:1,ex:`Le texte décrit cet enchaînement. Les soutiens visent l'effet d'entretien et non la tradition, l'altitude n'est accessible qu'une partie de l'année, et les vallées servent l'hiver.`},

{passage:`Un séisme libère de l'énergie accumulée par le déplacement lent des plaques. La magnitude mesure cette énergie et ne dépend ni du lieu ni de l'heure. L'intensité, en revanche, décrit les effets observés en un point donné : elle varie selon la distance, la profondeur du foyer et surtout la nature du sol, les terrains meubles amplifiant les mouvements. Un même séisme reçoit donc une magnitude unique mais autant de valeurs d'intensité qu'il y a de lieux d'observation. La qualité des constructions n'entre pas dans la magnitude, alors qu'elle détermine largement les dommages.`,
opts:[`L'intensité d'un séisme est identique en tout point.`,`Un même séisme reçoit une magnitude unique et plusieurs valeurs d'intensité.`,`La magnitude tient compte de la qualité des constructions.`,`Les terrains meubles réduisent les mouvements du sol.`],
c:1,ex:`C'est la conséquence directe des deux définitions données. L'intensité varie selon le lieu, la magnitude ignore le bâti, et les sols meubles amplifient au lieu de réduire.`},

{passage:`Le papier fabriqué à partir du dix-neuvième siècle contient souvent de la pâte de bois traitée par un procédé acide. Cette acidité résiduelle attaque lentement les fibres, si bien que des ouvrages de cette période se dégradent plus vite que des manuscrits bien plus anciens réalisés sur chiffon. Les bibliothèques procèdent à des désacidifications de masse, coûteuses et qui n'inversent pas les dégâts déjà causés. La numérisation préserve l'information mais non l'objet, ce qui reste un choix discuté lorsque la matérialité du document porte elle-même une information.`,
opts:[`Les manuscrits anciens sur chiffon se dégradent plus vite que les ouvrages du dix-neuvième siècle.`,`La désacidification n'inverse pas les dégradations déjà survenues.`,`La numérisation préserve à la fois l'information et l'objet.`,`Tous les papiers du dix-neuvième siècle sont acides.`],
c:1,ex:`Le texte le précise expressément. La comparaison est en sens inverse, la numérisation ne préserve pas l'objet, et le texte dit « souvent », pas « tous ».`},

{passage:`Les abeilles domestiques ne représentent qu'une faible part des espèces d'abeilles, dont la plupart sont solitaires et ne produisent pas de miel. Ces espèces sauvages assurent une part importante de la pollinisation, y compris de cultures que l'abeille domestique visite peu. Multiplier les ruches dans une zone où la ressource florale est limitée peut accroître la concurrence et défavoriser les populations sauvages. Les mesures de protection les plus efficaces portent donc moins sur l'installation de ruches que sur le maintien de bandes fleuries et de sites de nidification.`,
opts:[`L'abeille domestique représente la majorité des espèces d'abeilles.`,`Installer davantage de ruches peut défavoriser les abeilles sauvages là où la ressource est limitée.`,`Les abeilles sauvages produisent du miel en petite quantité.`,`L'abeille domestique pollinise toutes les cultures.`],
c:1,ex:`Le texte pose cette condition de ressource limitée. Les domestiques sont minoritaires, la plupart des sauvages ne produisent pas de miel, et l'abeille domestique visite peu certaines cultures.`},

{passage:`Le principe d'Archimède énonce qu'un corps immergé subit une poussée verticale égale au poids du fluide déplacé. Un objet flotte lorsque cette poussée équilibre son poids, ce qui dépend de sa masse volumique moyenne et non de la matière dont il est fait. Un navire d'acier flotte parce que son volume englobe une grande quantité d'air. Le même acier compacté coule. La densité du fluide compte également : un corps qui coule en eau douce peut flotter en eau très salée, la poussée étant alors plus forte à volume déplacé égal.`,
opts:[`La flottaison dépend de la matière dont l'objet est fait.`,`Un corps qui coule en eau douce peut flotter en eau très salée.`,`La poussée est indépendante de la densité du fluide.`,`Un navire d'acier flotte parce que l'acier est léger.`],
c:1,ex:`Le texte donne cet exemple et l'explique par la poussée plus forte. La matière importe moins que la masse volumique moyenne, la densité du fluide compte, et l'acier n'est pas léger.`},

{passage:`Le théâtre nô japonais utilise des masques dont l'expression paraît figée. Le jeu de l'acteur consiste précisément à faire varier cette expression apparente par de très légers changements d'inclinaison de la tête, qui modifient l'incidence de la lumière. Un même masque peut ainsi sembler successivement serein, souffrant ou menaçant. Cette économie de moyens suppose un public formé à en percevoir les nuances. Les représentations sont lentes selon les critères contemporains, et l'apprentissage des rôles principaux demande des décennies.`,
opts:[`Les masques du nô changent physiquement d'expression pendant la représentation.`,`L'expression apparente du masque varie selon l'inclinaison de la tête de l'acteur.`,`Le nô se joue sans public formé.`,`Les rôles principaux s'apprennent en quelques années.`],
c:1,ex:`C'est le mécanisme décrit. Le masque ne change pas physiquement, le texte suppose un public formé, et l'apprentissage demande des décennies.`},

{passage:`Le sommeil se compose de cycles successifs alternant sommeil lent et sommeil paradoxal. La proportion de sommeil profond est plus élevée en début de nuit, celle de sommeil paradoxal en fin de nuit. Écourter la nuit ampute donc surtout le sommeil paradoxal, associé à la consolidation de certains apprentissages. Le décalage de l'heure de coucher sans modification de l'heure de lever produit le même effet. La récupération après plusieurs nuits courtes n'est pas immédiate et une seule nuit longue ne compense pas entièrement le déficit accumulé.`,
opts:[`Le sommeil profond domine en fin de nuit.`,`Écourter la nuit réduit surtout le sommeil paradoxal.`,`Une nuit longue compense entièrement plusieurs nuits courtes.`,`Le sommeil paradoxal n'a aucun rôle dans les apprentissages.`],
c:1,ex:`Le texte en fait la conséquence de la répartition des stades. Le sommeil profond domine en début de nuit, une nuit longue ne compense pas entièrement, et le paradoxal est associé à la consolidation.`},

{passage:`Les bibliothèques d'Alexandrie et de Pergame se disputaient les manuscrits et les savants. Selon une tradition rapportée par des auteurs anciens, l'Égypte aurait interrompu ses exportations de papyrus pour freiner sa rivale, qui aurait alors développé un support à base de peaux, le parchemin. Les historiens tiennent ce récit pour une reconstruction tardive : l'usage de peaux comme support d'écriture est attesté antérieurement. Le parchemin s'est imposé pour d'autres raisons, notamment sa résistance et sa compatibilité avec le format en cahiers reliés qui a supplanté le rouleau.`,
opts:[`Le parchemin a été inventé à Pergame après un embargo égyptien.`,`Les historiens considèrent ce récit d'invention comme une reconstruction tardive.`,`Le rouleau a supplanté le format en cahiers reliés.`,`Le papyrus était plus résistant que le parchemin.`],
c:1,ex:`Le texte l'affirme et donne la raison, l'usage antérieur des peaux. Le récit d'invention est écarté, c'est le cahier qui supplante le rouleau, et la résistance est un avantage du parchemin.`},

{passage:`L'inflation mesure la variation du niveau général des prix. Une inflation faible n'implique pas la stabilité de chaque prix : des hausses sur certains postes peuvent compenser des baisses sur d'autres. C'est pourquoi l'inflation ressentie diffère souvent de l'inflation mesurée, les ménages accordant plus de poids aux achats fréquents, comme l'alimentation, qu'à ceux qui sont rares. La composition du panier varie aussi selon le niveau de revenu, si bien qu'un même indice recouvre des situations très différentes. Les instituts publient des indices par catégorie de ménages pour éclairer ce point.`,
opts:[`Une inflation faible signifie que chaque prix est stable.`,`L'écart entre inflation ressentie et mesurée tient en partie au poids des achats fréquents.`,`Le panier de consommation est identique quel que soit le revenu.`,`Les instituts ne publient qu'un indice global.`],
c:1,ex:`Le texte donne cette explication. Une inflation faible masque des mouvements opposés, le panier varie selon le revenu, et des indices par catégorie sont publiés.`},

{passage:`Les plantes carnivores poussent typiquement sur des sols pauvres en azote, comme les tourbières. La capture d'insectes leur apporte cet azote, mais elles tirent leur énergie de la photosynthèse comme les autres plantes. Le piège représente un coût de fabrication non négligeable, ce qui explique qu'il ne soit avantageux que là où l'azote manque vraiment. Cultivées dans un terreau riche, ces plantes dépérissent souvent : l'excès de nutriments leur est défavorable. Certaines espèces réduisent la production de pièges lorsque les proies sont abondantes, ce qui suggère un ajustement au coût.`,
opts:[`Les plantes carnivores tirent leur énergie de la digestion des insectes.`,`Un terreau riche en nutriments peut être défavorable aux plantes carnivores.`,`Le piège ne coûte rien à la plante.`,`Les plantes carnivores poussent surtout sur des sols riches en azote.`],
c:1,ex:`Le texte le dit explicitement. L'énergie vient de la photosynthèse, le piège a un coût, et les sols sont pauvres en azote.`},

{passage:`La stéréoscopie restitue le relief en présentant à chaque œil une image légèrement décalée, reproduisant la disparité naturelle entre les deux points de vue. Ce mécanisme n'est qu'un des indices de profondeur utilisés par le système visuel, aux côtés de la perspective, du recouvrement des objets et du flou d'accommodation. C'est pourquoi une personne ne voyant que d'un œil perçoit encore la profondeur, avec une précision réduite à courte distance. Les dispositifs stéréoscopiques provoquent chez certains spectateurs une gêne, attribuée au conflit entre la convergence des yeux et la mise au point sur un écran unique.`,
opts:[`La stéréoscopie est le seul indice de profondeur du système visuel.`,`Une personne ne voyant que d'un œil perçoit encore la profondeur.`,`La gêne provoquée est due à la luminosité de l'écran.`,`La perspective ne renseigne pas sur la profondeur.`],
c:1,ex:`Le texte le déduit de l'existence d'autres indices. La stéréoscopie n'est qu'un indice parmi d'autres, la gêne est attribuée à un conflit convergence-accommodation, et la perspective est citée comme indice.`},

{passage:`Le compostage transforme des déchets organiques en amendement grâce à l'action de micro-organismes. Le processus demande un équilibre entre matières riches en carbone, comme les feuilles sèches, et matières riches en azote, comme les épluchures. Un excès d'azote provoque des odeurs, un excès de carbone ralentit fortement la décomposition. L'aération est également nécessaire : sans oxygène, la fermentation devient anaérobie et produit d'autres composés. La montée en température du tas, en phase active, contribue à détruire une partie des graines d'adventices, sans que ce soit systématique.`,
opts:[`Un excès de carbone provoque des odeurs.`,`Sans oxygène, la fermentation devient anaérobie et produit d'autres composés.`,`La montée en température détruit toutes les graines d'adventices.`,`Les épluchures sont riches en carbone.`],
c:1,ex:`Le texte l'énonce directement. Les odeurs viennent de l'excès d'azote, la destruction des graines n'est pas systématique, et les épluchures sont riches en azote.`},

{passage:`Un pont suspendu transmet la charge du tablier à des câbles porteurs ancrés aux extrémités, ce qui permet de franchir de très grandes portées sans appui intermédiaire. Cette conception rend l'ouvrage sensible aux effets du vent, susceptibles de provoquer des oscillations qui s'amplifient elles-mêmes. Les ruptures spectaculaires du siècle dernier ont conduit à intégrer des essais en soufflerie dès la conception et à profiler le tablier pour réduire les tourbillons. Le coût de construction reste élevé, si bien que la solution n'est retenue que lorsque la portée exclut les alternatives.`,
opts:[`Le pont suspendu est la solution la moins coûteuse pour toute portée.`,`La sensibilité au vent tient à la conception même du pont suspendu.`,`Les essais en soufflerie précèdent l'invention du pont suspendu.`,`Les câbles porteurs reposent sur des appuis intermédiaires.`],
c:1,ex:`Le texte relie explicitement la conception à la sensibilité au vent. Le coût est élevé, la soufflerie est venue après les ruptures, et l'absence d'appui intermédiaire est l'intérêt du procédé.`},

{passage:`La datation par le carbone quatorze repose sur la décroissance d'un isotope présent dans tout organisme vivant et qui cesse d'être renouvelé à sa mort. La méthode s'applique à des matériaux organiques et perd sa précision au-delà d'un certain âge, l'isotope résiduel devenant trop rare pour être mesuré. Elle suppose aussi de corriger les résultats, la teneur atmosphérique en carbone quatorze ayant varié au cours du temps. Des courbes d'étalonnage établies à partir de séries d'anneaux de croissance d'arbres permettent cette correction. Une pierre ou un métal ne peuvent pas être datés par ce moyen.`,
opts:[`La méthode s'applique à tous les matériaux archéologiques.`,`Les résultats doivent être corrigés au moyen de courbes d'étalonnage.`,`La teneur atmosphérique en carbone quatorze est restée constante.`,`La précision augmente avec l'âge de l'échantillon.`],
c:1,ex:`Le texte l'indique et en donne la source, les anneaux de croissance. La méthode ne vaut que pour l'organique, la teneur a varié, et la précision décroît avec l'âge.`},

{passage:`Un algorithme de tri compare et déplace des éléments jusqu'à obtenir un ordre. Le nombre d'opérations nécessaires dépend fortement de la méthode : certaines croissent proportionnellement au carré du nombre d'éléments, d'autres beaucoup plus lentement. Pour de petites listes, l'écart est négligeable et une méthode simple peut être plus rapide en pratique, du fait d'un coût fixe moindre. Pour de grandes listes, l'écart devient déterminant. Le choix dépend aussi de la structure des données : une liste déjà presque triée favorise certaines méthodes qui détectent l'ordre partiel existant.`,
opts:[`La méthode la plus efficace en théorie est toujours la plus rapide en pratique.`,`Pour de petites listes, une méthode simple peut être plus rapide en pratique.`,`La structure initiale des données est sans effet sur le choix.`,`Tous les algorithmes de tri croissent proportionnellement au carré du nombre d'éléments.`],
c:1,ex:`Le texte l'explique par le coût fixe moindre. L'efficacité théorique ne l'emporte que sur de grandes listes, la structure initiale compte, et seules certaines méthodes croissent au carré.`},

{passage:`Les récits de voyage du dix-huitième siècle mêlent observation et convention littéraire. Leurs auteurs décrivent souvent ce que leurs lecteurs attendaient de trouver, en reprenant des descriptions antérieures qu'ils n'avaient pas nécessairement vérifiées. Les historiens ne les écartent pas pour autant : ces textes renseignent moins sur les lieux décrits que sur les représentations de ceux qui les écrivaient. Un détail invraisemblable peut ainsi être plus instructif qu'une description exacte, parce qu'il révèle une attente. La difficulté est de distinguer, dans un même récit, ce qui relève de l'observation et ce qui relève de la reprise.`,
opts:[`Les historiens écartent ces récits en raison de leur manque de fiabilité.`,`Un détail invraisemblable peut être instructif parce qu'il révèle une attente.`,`Ces récits reposent uniquement sur l'observation directe.`,`Distinguer observation et reprise est immédiat.`],
c:1,ex:`Le texte l'affirme et l'explique. Les historiens ne les écartent pas, la reprise y est fréquente, et la distinction est présentée comme difficile.`},

{passage:`La supraconductivité et la superfluidité sont deux phénomènes apparaissant à très basse température, où un matériau perd respectivement toute résistance électrique et toute viscosité. Dans les deux cas, un grand nombre de particules adoptent un comportement collectif décrit par une même description quantique. Cette parenté théorique a été établie après la découverte expérimentale, qui l'avait précédée de plusieurs décennies. La superfluidité produit des effets contre-intuitifs, comme la remontée d'un film liquide le long des parois d'un récipient. Aucun des deux phénomènes n'a été observé à température ambiante.`,
opts:[`La théorie a précédé la découverte expérimentale.`,`Les deux phénomènes relèvent d'un même type de description quantique.`,`La superfluidité a été observée à température ambiante.`,`La supraconductivité correspond à la perte de viscosité.`],
