<p><b>Débat mobilisable pour l'essai :</b> d'un côté, les partisans d'une intégration renforcée demandent une reconnaissance automatique généralisée des diplômes et un budget Erasmus+ revu à la hausse pour élargir l'accès aux jeunes de milieux modestes, aujourd'hui sous-représentés dans la mobilité. De l'autre, la logique de subsidiarité rappelle que l'éducation reste une compétence nationale : plusieurs États et acteurs académiques s'inquiètent qu'une harmonisation plus poussée des diplômes ou des cursus ne réduise la diversité voulue des systèmes éducatifs, et s'interrogent sur la soutenabilité budgétaire de ces ambitions dans le prochain cadre financier pluriannuel, après 2027.</p>`},

{group:'theme', title:`Égalité des sexes : stratégie de l'UE, salaires, quotas, violence`, body:`
<p><b>Stratégies de l'UE</b> L'action de l'UE en matière d'égalité femmes-hommes s'appuie sur une stratégie pluriannuelle de la Commission. La <b>stratégie 2020-2025</b>, présentée le <span class="kb-fact">5 mars 2020</span>, combine des actions ciblées (violences, écart salarial et de retraite, participation au marché du travail, égalité dans la prise de décision) et une intégration transversale du genre dans toutes les politiques (gender mainstreaming). Une nouvelle <b>stratégie 2026-2030</b> a suivi le <span class="kb-fact">5 mars 2026</span> : elle ajoute la cyberviolence (deepfakes), l'engagement des hommes et des garçons et la santé aux priorités précédentes. Selon l'Institut européen pour l'égalité entre les hommes et les femmes (EIGE), au rythme actuel des progrès il faudrait encore <span class="kb-fact">50 ans</span> à l'UE pour atteindre la pleine égalité, et l'écart de rémunération horaire non ajusté entre femmes et hommes est d'environ <span class="kb-fact">11,1 %</span> dans l'UE en <span class="kb-fact">2024</span> (donnée provisoire Eurostat).</p>
<p><b>Transparence salariale</b> La directive <span class="kb-fact">(UE) 2023/970</span> du <span class="kb-fact">10 mai 2023</span> (transposition au <span class="kb-fact">7 juin 2026</span>) impose la transparence des rémunérations avant l'embauche : l'employeur indique un salaire ou une fourchette dans l'offre ou avant l'entretien, et ne peut plus demander l'historique salarial du candidat. Les salariés obtiennent un droit d'information sur les niveaux de rémunération moyens ventilés par sexe pour un travail de même valeur, et la charge de la preuve est renversée en cas de litige (c'est l'employeur qui doit justifier un écart par des critères objectifs). Les entreprises d'au moins <span class="kb-fact">100 salariés</span> doivent publier des données sur l'écart de rémunération ; un écart non justifié supérieur à <span class="kb-fact">5 %</span> déclenche une évaluation conjointe des rémunérations avec les représentants du personnel.</p>
<p><b>Quotas dans les conseils d'administration</b> La directive <span class="kb-fact">(UE) 2022/2381</span> du <span class="kb-fact">23 novembre 2022</span>, dite « Women on Boards », vise les grandes sociétés cotées en bourse dans l'UE (au moins <span class="kb-fact">250 salariés</span>, chiffre d'affaires supérieur à 50 millions d'euros ou bilan supérieur à 43 millions d'euros). D'ici le <span class="kb-fact">30 juin 2026</span>, ces sociétés doivent atteindre soit <span class="kb-fact">40 %</span> de femmes parmi les administrateurs non exécutifs, soit <span class="kb-fact">33 %</span> de femmes parmi l'ensemble des administrateurs. Les procédures de sélection doivent reposer sur des critères transparents et non sexistes, avec priorité au candidat du sexe sous-représenté à qualifications égales ; des sanctions (amendes, nullité de la nomination) sont prévues en cas de non-respect. Les Etats membres devaient transposer la directive au plus tard le <span class="kb-fact">28 décembre 2024</span>.</p>
<p><b>Violence à l'égard des femmes</b> Adoptée le <span class="kb-fact">14 mai 2024</span> et entrée en vigueur en <span class="kb-fact">juin 2024</span>, la directive <span class="kb-fact">(UE) 2024/1385</span> harmonise pour la première fois au niveau de l'UE des infractions comme les mutilations génitales féminines, le mariage forcé, le cyberharcèlement, la cyberincitation à la haine et le partage non consenti d'images intimes. Elle renforce aussi la protection des victimes (accès à un hébergement sûr, accompagnement médical et psychologique) et la prévention. Les Etats membres ont un délai de trois ans à compter de l'entrée en vigueur pour la transposer, soit aux alentours de <span class="kb-fact">juin 2027</span>. Le texte part du constat qu'environ <span class="kb-fact">une femme sur trois</span> dans l'UE a subi une forme de violence depuis l'âge de 15 ans.</p>
<p><b>Un débat non tranché</b> Le Parlement européen souhaitait une définition harmonisée du viol fondée sur l'absence de consentement dans la directive de 2024 ; ce point n'a pas été retenu dans le texte final, et le Parlement continue de demander son inclusion ainsi que la reconnaissance de la violence à l'égard des femmes comme catégorie de criminalité relevant pleinement du droit de l'UE. D'un côté, une définition commune du consentement renforcerait une protection égale des victimes dans toute l'UE ; de l'autre, plusieurs Etats membres restent attachés à leur propre définition pénale des infractions sexuelles, ce qui a limité l'ambition du texte adopté.</p>`},

{group:'theme', title:`Élections européennes`, body:`
<p><b>Mode de scrutin</b> Les députés européens sont élus au suffrage universel direct pour un mandat de <span class="kb-fact">cinq ans</span>. L'acte électoral de 1976, modifié en 2002 puis en 2018, impose dans tous les États membres une <span class="kb-fact">représentation proportionnelle</span>, sous forme de scrutin de liste ou de vote unique transférable. Depuis les élections de <span class="kb-fact">2024</span>, un seuil électoral obligatoire compris entre <span class="kb-fact">2 % et 5 %</span> s'applique dans les circonscriptions de plus de 35 sièges ; la <span class="kb-fact">France</span>, circonscription nationale unique depuis 2019, retient le seuil maximal de <span class="kb-fact">5 %</span>. L'âge minimal pour voter varie selon les États (<span class="kb-fact">16 ans</span> en Allemagne, en Autriche, en Belgique et à Malte ; 18 ans dans la majorité des pays, dont la France).</p>

<p><b>Dégressivité proportionnelle des sièges</b> La répartition des sièges entre États suit le principe de <span class="kb-fact">dégressivité proportionnelle</span> fixé par les traités (article 14 du TUE) : plus un pays est peuplé, plus il compte de députés, mais chaque député d'un grand État représente davantage d'habitants que son homologue d'un petit État. Les traités fixent un minimum de <span class="kb-fact">6 sièges</span> et un maximum de <span class="kb-fact">96 sièges</span> par pays. Pour la législature <span class="kb-fact">2024-2029</span>, le Parlement est passé de 705 à <span class="kb-fact">720 sièges</span>, 15 sièges supplémentaires ayant été répartis entre 12 États membres (deux de plus chacun pour la France, l'Espagne et les Pays-Bas notamment) ; la France dispose désormais de <span class="kb-fact">81 sièges</span>, contre 79 auparavant.</p>

<p><b>Élections de juin 2024</b> Le scrutin s'est déroulé du <span class="kb-fact">6 au 9 juin 2024</span> selon les pays, le <span class="kb-fact">9 juin</span> en France. La participation dans l'UE a atteint <span class="kb-fact">50,74 %</span>, le taux le plus élevé depuis 25 ans, en légère hausse par rapport à 2019 (<span class="kb-fact">50,66 %</span>) ; en France, elle s'est établie à <span class="kb-fact">51,49 %</span>, au-dessus de la moyenne européenne. Les écarts entre États membres restent considérables, de plus de 89 % à un peu plus de 20 % selon les pays.</p>

<p><b>Résultats par grandes familles politiques</b> Le Parti populaire européen (PPE) est arrivé en tête du scrutin dans l'ensemble de l'Union :</p>
<ul>
<li><b>PPE</b> (droite, démocrates-chrétiens) : 1er groupe, environ <span class="kb-fact">185 sièges</span></li>
<li><b>S&D</b> et <b>Renew Europe</b> : 2e et 3e forces ; avec le PPE, elles conservent une majorité arithmétique</li>
<li><b>Verts/ALE</b> : net recul par rapport à 2019</li>
<li><b>Patriotes pour l'Europe</b> et <b>Europe des nations souveraines</b> : deux nouveaux groupes d'extrême droite, apparus lors de la session constitutive de juillet 2024</li>
</ul>
<p>Sur les <span class="kb-fact">720 sièges</span>, aucun groupe n'atteint seul la majorité absolue (<span class="kb-fact">361 sièges</span>) ; le détail des huit groupes actuels figure dans la fiche « Vie politique et institutionnelle ».</p>

<p><b>Le Spitzenkandidat et la désignation du président de la Commission</b> Le système du Spitzenkandidat (candidat tête de liste) veut que chaque parti politique européen désigne avant le scrutin son candidat à la présidence de la Commission, ce poste revenant en principe au chef de file du parti arrivé en tête. La base juridique est l'<span class="kb-fact">article 17, paragraphe 7, du TUE</span> : le Conseil européen, statuant à la majorité qualifiée, propose un candidat « en tenant compte » du résultat des élections européennes, après consultations avec le Parlement, qui l'élit ensuite à la majorité absolue de ses membres. Le mécanisme n'a rien d'automatique. En <span class="kb-fact">2014</span>, <span class="kb-fact">Jean-Claude Juncker</span>, Spitzenkandidat du PPE, est bien devenu président de la Commission. En <span class="kb-fact">2019</span>, le Conseil européen écarte Manfred Weber, pourtant Spitzenkandidat du PPE, au profit d'<span class="kb-fact">Ursula von der Leyen</span>, qui n'avait pas ce statut ; elle est élue de justesse par le Parlement (383 voix, pour une majorité absolue alors fixée à 374). En <span class="kb-fact">2024</span>, von der Leyen se présente elle-même comme Spitzenkandidat du PPE, vainqueur du scrutin, et est reconduite par le Parlement le <span class="kb-fact">18 juillet 2024</span> avec <span class="kb-fact">401 voix</span> pour (284 contre), largement au-dessus de la majorité absolue requise.</p>

<p><b>Un débat mobilisable pour l'essai</b> Les partisans du Spitzenkandidat y voient un progrès démocratique, qui crée un lien direct entre le vote des citoyens européens et le choix de l'exécutif de l'Union, à la manière d'un régime parlementaire. Ses critiques répondent que l'article 17 du TUE ne rend cette pratique nullement contraignante : le Conseil européen garde juridiquement la main sur la proposition, comme l'a montré l'écart de 2019, et rien n'empêche les chefs d'État et de gouvernement de s'en détourner à nouveau lors d'une future législature.</p>`},

{group:'theme', title:`Énergie`, body:`
<p><b>Cadre juridique.</b> La politique énergétique de l'UE repose sur l'article <span class="kb-fact">194 TFUE</span>, qui fixe quatre objectifs : assurer le fonctionnement du marché de l'énergie, garantir la sécurité d'approvisionnement, promouvoir l'efficacité énergétique et les énergies renouvelables, favoriser l'interconnexion des réseaux. Chaque État membre reste libre de choisir son bouquet énergétique national. Le nucléaire civil échappe à ce cadre commun : il relève d'un traité distinct, le traité <b>Euratom</b>, signé à Rome le <span class="kb-fact">25 mars 1957</span> en même temps que le traité CEE, et resté séparé du TFUE.</p>
<p><b>Marché intérieur de l'énergie.</b> Il s'est construit par vagues successives de législation : un premier paquet (1996-1998) ouvre les marchés nationaux à la concurrence, un deuxième (2003) élargit le choix des fournisseurs pour les consommateurs, un troisième (2009) impose la dissociation entre production et réseaux de transport et crée l'agence de régulation <b>ACER</b> ainsi que les réseaux européens de gestionnaires de réseau de transport. Le paquet « Énergie propre pour tous les Européens » (2019) ajoute des règles sur les renouvelables et la protection des consommateurs ; un cinquième paquet, dit « Ajustement à l'objectif 55 » (2021-2024), aligne l'ensemble sur l'objectif de <span class="kb-fact">-55 %</span> d'émissions d'ici 2030. La réforme du marché électrique s'appuie sur la directive 2019/944 et le règlement 2019/943, avec un objectif d'interconnexion électrique d'au moins <span class="kb-fact">15 %</span> d'ici 2030.</p>
<p><b>Sécurité d'approvisionnement.</b> Les États membres doivent remplir leurs stockages de gaz à hauteur de <span class="kb-fact">90 %</span> de leur capacité avant chaque hiver et détenir des stocks pétroliers stratégiques équivalant à 90 jours d'importations ou 61 jours de consommation. Fin 2025, l'UE importe encore environ <span class="kb-fact">60 %</span> de son énergie, dont <span class="kb-fact">90 %</span> de son gaz et <span class="kb-fact">97 %</span> de son pétrole consommés.</p>
<p><b>REPowerEU.</b> Présenté par la Commission le <span class="kb-fact">18 mai 2022</span>, après l'invasion de l'Ukraine par la Russie, ce plan vise à sortir des hydrocarbures russes en économisant l'énergie, en diversifiant les fournisseurs et en accélérant les renouvelables. Il mobilise environ <span class="kb-fact">300 milliards d'euros</span>. La part du gaz russe dans les importations de l'UE est passée de plus de <span class="kb-fact">40 %</span> en 2021 à moins de <span class="kb-fact">19 %</span> en 2024, celle du pétrole russe de 27 % début 2022 à 3 % en 2024. Un accord politique conclu le <span class="kb-fact">2 décembre 2025</span> a débouché sur un règlement, entré en vigueur le <span class="kb-fact">3 février 2026</span>, qui organise l'arrêt complet des importations russes de gaz, par gazoduc et sous forme de GNL, d'ici novembre 2027, et des importations de pétrole russe d'ici fin 2027 ; des restrictions sont aussi prévues sur les importations russes d'uranium et de matières nucléaires.</p>
<p><b>Énergies renouvelables.</b> La directive sur les énergies renouvelables (RED III) a porté en octobre 2023 l'objectif contraignant à au moins <span class="kb-fact">42,5 %</span> de renouvelables dans la consommation énergétique brute de l'UE d'ici <span class="kb-fact">2030</span>, avec une ambition à 45 %. Cette part atteignait 24,5 % en 2023, contre 22,1 % en 2020. Des sous-objectifs sectoriels s'ajoutent, dont 42 % d'hydrogène renouvelable dans l'industrie d'ici 2030.</p>
<p><b>Euratom et nucléaire civil.</b> Le traité Euratom encadre l'usage strictement civil de l'énergie nucléaire : sûreté et radioprotection, approvisionnement équitable des États membres en matières fissiles via l'Agence d'approvisionnement Euratom, marché commun nucléaire. Le Parlement européen n'y joue qu'un rôle consultatif, à la différence de son rôle de colégislateur à part entière sur le reste de la politique énergétique fondée sur l'article 194 TFUE. Le programme de recherche Euratom est doté de <span class="kb-fact">1,38 milliard d'euros</span> pour 2021-2025 ; l'UE finance aussi le démantèlement de centrales jugées à risque en Bulgarie (Kozloduy), Slovaquie (Bohunice) et Lituanie (Ignalina).</p>
<p><b>Débat mobilisable.</b> Sur le rythme de la transition, deux lectures s'opposent. Certains jugent la sortie des hydrocarbures russes et la montée des renouvelables encore trop lentes, en pointant une Union toujours dépendante à 60 % de l'énergie importée et des États membres inégalement avancés. D'autres redoutent qu'un calendrier trop contraignant renchérisse les prix de l'énergie et fragilise la compétitivité industrielle, et plaident pour un rythme plus progressif ainsi qu'un rôle accru du nucléaire comme énergie bas carbone, tout en maintenant sa distinction juridique et statistique avec les renouvelables.</p>`},

];

/* ================= FICHES PARLEMENT EUROPEEN (annexe, sweep factsheets) ================= */
const ANNEXE_FICHES = [
{section:"Institutions, droit et budget", title:`Les traités fondateurs (CECA et traités de Rome)`, body:`
<p><b>Origine</b> L'intégration européenne démarre avec la <span class="kb-fact">déclaration Schuman du 9 mai 1950</span>, proposant de mettre en commun les productions de charbon et d'acier pour rendre la guerre entre la France et l'Allemagne matériellement impossible. Elle débouche sur le <span class="kb-fact">traité de Paris, signé le 18 avril 1951</span>, entré en vigueur le <span class="kb-fact">23 juillet 1952</span>, qui crée la <span class="kb-fact">CECA</span> entre <span class="kb-fact">six pays fondateurs</span> (Allemagne, Belgique, France, Italie, Luxembourg, Pays-Bas), avec une Haute Autorité, une Assemblée parlementaire, un Conseil des ministres et une Cour de justice. Ce traité avait une durée limitée à 50 ans, expirée le <span class="kb-fact">23 juillet 2002</span>.</p><p><b>Traités de Rome</b> Signés le <span class="kb-fact">25 mars 1957</span>, entrés en vigueur le <span class="kb-fact">1er janvier 1958</span>, ils instituent la <span class="kb-fact">CEE</span> (marché commun fondé sur les quatre libertés : biens, personnes, services, capitaux) et l'<span class="kb-fact">Euratom</span>, cette fois pour une durée illimitée.</p>`},

{section:"Institutions, droit et budget", title:`La genèse de l'Acte unique européen`, body:`
<p><b>Contexte et portée.</b> L'<span class="kb-fact">Acte unique européen</span>, signé le <span class="kb-fact">17 février 1986</span>, constitue la première modification substantielle du <span class="kb-fact">traité de Rome</span>. Il entre en vigueur le <span class="kb-fact">1er juillet 1987</span>, alors que la Communauté compte <span class="kb-fact">12 États membres</span>, et pose les bases du marché intérieur unique.</p>

<p><b>Réforme du processus décisionnel.</b> L'acte généralise la <span class="kb-fact">majorité qualifiée</span> au Conseil pour le marché intérieur et plusieurs politiques nouvelles (cohésion économique et sociale, politique sociale, recherche, environnement), remplaçant l'unanimité. L'unanimité reste toutefois requise pour la fiscalité, la libre circulation des personnes et les droits des travailleurs salariés. L'acte instaure aussi la procédure de coopération, donnant au Parlement européen un pouvoir législatif accru, et réduit les blocages décisionnels qui freinaient l'édification du marché commun.</p>`},

{section:"Institutions, droit et budget", title:`Les traités de Maastricht et d'Amsterdam`, body:`
<p><b>Maastricht, l'acte fondateur de l'UE.</b> Le <span class="kb-fact">traité sur l'Union européenne</span>, signé à <span class="kb-fact">Maastricht le 7 février 1992</span> et entré en vigueur le <span class="kb-fact">1er novembre 1993</span>, crée l'Union européenne sur une <span class="kb-fact">structure à trois piliers</span> : les Communautés européennes, la politique étrangère et de sécurité commune (PESC), et la coopération en matière de justice et d'affaires intérieures (JAI).</p><p><b>Amsterdam, l'ajustement institutionnel.</b> Le <span class="kb-fact">traité d'Amsterdam</span>, signé le <span class="kb-fact">2 octobre 1997</span> et entré en vigueur le <span class="kb-fact">1er mai 1999</span>, étend la procédure de codécision du Parlement européen à <span class="kb-fact">15 bases juridiques</span> supplémentaires, transfère certaines matières (asile, immigration, franchissement des frontières) du pilier intergouvernemental vers la méthode communautaire, et fixe à <span class="kb-fact">700</span> le nombre maximal de députés européens.</p>`},

{section:"Institutions, droit et budget", title:`Le traité de Nice et la Convention sur l'avenir de l'Europe`, body:`
<p><b>Traité de Nice</b> Signé le <span class="kb-fact">26 février 2001</span>, entré en vigueur le <span class="kb-fact">1er février 2003</span>, il prépare l'UE aux élargissements de 2004 et 2007. Il réduit la pondération des voix des États les plus peuplés au Conseil (55 % avant 2004, puis 44,5 % à partir de 2007), fixe un commissaire par État membre à partir de 2005 et porte le Parlement européen à un maximum de <span class="kb-fact">732 députés</span>.</p><p><b>Convention sur l'avenir de l'Europe</b> Décidée au Conseil européen de Laeken en <span class="kb-fact">décembre 2001</span> et présidée par <span class="kb-fact">Valéry Giscard d'Estaing</span>, elle réunit <span class="kb-fact">105 membres</span> et rédige un projet de Constitution européenne (quatre parties, 465 articles), approuvé par le Parlement européen en janvier 2005. Point souvent testé en QCM : ce projet est rejeté par référendum en <span class="kb-fact">France</span> (29 mai 2005) et aux <span class="kb-fact">Pays-Bas</span> (1er juin 2005), ce qui bloque sa ratification et mènera plus tard au traité de Lisbonne.</p>`},

{section:"Institutions, droit et budget", title:`Le traité de Lisbonne`, body:`
<p><b>De quoi s'agit-il</b> Le <span class="kb-fact">traité de Lisbonne</span>, signé le <span class="kb-fact">13 décembre 2007</span> et entré en vigueur le <span class="kb-fact">1er décembre 2009</span>, modifie le traité sur l'Union européenne et rebaptise le traité instituant la Communauté européenne en <span class="kb-fact">traité sur le fonctionnement de l'UE</span>. Il fait suite à l'échec du traité constitutionnel, rejeté par référendum en <span class="kb-fact">France et aux Pays-Bas en 2005</span>.</p><p><b>Ce qu'il change</b> Le traité renforce les pouvoirs législatifs du <span class="kb-fact">Parlement européen</span>, reconnaît formellement le <span class="kb-fact">Conseil européen</span> comme institution avec une présidence stable, et introduit la règle de la <span class="kb-fact">majorité qualifiée</span> appliquée depuis le <span class="kb-fact">1er novembre 2014</span> : <span class="kb-fact">55 %</span> des États membres représentant au moins <span class="kb-fact">65 %</span> de la population, une minorité de blocage nécessitant au moins <span class="kb-fact">4 États</span>. Le Parlement compte au maximum <span class="kb-fact">751 sièges</span> (plafond ramené à 705 après le Brexit, puis 720 pour 2024-2029).</p>`},

{section:"Institutions, droit et budget", title:`Sources et portée du droit de l'Union européenne`, body:`
<p><b>Hiérarchie des normes</b> Le droit de l'UE s'organise en droit primaire (traités), droit dérivé et principes généraux, complété par les accords internationaux. La Cour de justice de l'UE a établi que le droit de l'Union prime sur le droit national des États membres, une jurisprudence constante depuis l'arrêt <span class="kb-fact">Costa/ENEL (1964)</span>.</p><p><b>Actes juridiques</b> L'<span class="kb-fact">article 288 du traité FUE</span> énumère cinq types d'actes : règlements, directives, décisions, recommandations et avis. Sauf date spécifique, un règlement entre en vigueur le <span class="kb-fact">vingtième jour</span> suivant sa publication au Journal officiel de l'UE. Point souvent testé en QCM : seuls le règlement, la directive et la décision sont juridiquement contraignants, contrairement aux recommandations et avis.</p>`},

{section:"Institutions, droit et budget", title:`Le principe de subsidiarité`, body:`
<p><b>Définition</b> Le principe de subsidiarité encadre la répartition des compétences partagées entre l'Union européenne et les États membres : l'UE n'intervient que si les objectifs ne peuvent pas être atteints de manière suffisante au niveau national et peuvent, en raison de leur dimension ou de leurs effets, mieux l'être au niveau de l'Union. Il repose sur l'<span class="kb-fact">article 5, paragraphe 3, du traité sur l'Union européenne</span> et sur le <span class="kb-fact">protocole n°2</span> annexé aux traités, qui associe les parlements nationaux au contrôle.</p><p><b>Repères</b> Consacré par le <span class="kb-fact">traité de Maastricht (1992)</span>, précisé par un protocole en <span class="kb-fact">1997 (traité d'Amsterdam)</span>, puis renforcé par le <span class="kb-fact">traité de Lisbonne (2007)</span> qui donne aux parlements nationaux un droit d'alerte précoce (mécanisme dit du "carton jaune"). Ce mécanisme a été activé à trois reprises, en <span class="kb-fact">2012, 2013 et 2016</span>. À retenir pour le QCM : la subsidiarité ne s'applique qu'aux compétences partagées, jamais aux compétences exclusives de l'UE.</p>`},

{section:"Institutions, droit et budget", title:`Procédures décisionnelles de type supranational`, body:`
<p><b>De quoi s'agit-il</b> Cette fiche décrit les procédures par lesquelles l'Union adopte ses actes selon la méthode supranationale, où la <span class="kb-fact">Commission européenne</span> dispose du monopole de l'initiative et les décisions échappent au contrôle exclusif des États membres. Elle s'oppose à la logique intergouvernementale. La procédure de référence est la <span class="kb-fact">procédure législative ordinaire</span> (<span class="kb-fact">articles 289 et 294 TFUE</span>) : proposition de la Commission, examen et amendements par le <span class="kb-fact">Parlement européen</span> et le <span class="kb-fact">Conseil</span>, avec conciliation possible en cas de désaccord.</p><p><b>Repères historiques</b> La codécision est instaurée par le <span class="kb-fact">traité de Maastricht (1992)</span>, puis étendue par les traités d'Amsterdam et de Nice, avant d'être généralisée et rebaptisée procédure législative ordinaire par le <span class="kb-fact">traité de Lisbonne (2009)</span>, qui étend fortement son champ. La fiche couvre aussi d'autres actes supranationaux : conclusion d'accords internationaux (<span class="kb-fact">article 218 TFUE</span>) et ressources propres (<span class="kb-fact">article 311 TFUE</span>).</p>`},

{section:"Institutions, droit et budget", title:`Les procédures décisionnelles intergouvernementales`, body:`
<p><b>De quoi s'agit-il</b> À côté de la procédure législative ordinaire, l'UE recourt à des procédures de type intergouvernemental dans des domaines sensibles où les États membres gardent la main : la <span class="kb-fact">politique étrangère et de sécurité commune (PESC)</span>, les <span class="kb-fact">coopérations renforcées</span>, certaines nominations, la révision des traités et la gouvernance économique. Ces mécanismes s'appuient notamment sur les <span class="kb-fact">articles 20, 21 à 46 et 48-49 du traité UE</span> et sur plusieurs articles du <span class="kb-fact">traité FUE</span>, dont les articles <span class="kb-fact">218 et 329</span>.</p><p><b>Point à retenir</b> La gouvernance économique illustre bien cette logique intergouvernementale : le <span class="kb-fact">Mécanisme européen de stabilité</span> est entré en vigueur le <span class="kb-fact">27 septembre 2012</span> et le <span class="kb-fact">traité sur la stabilité, la coordination et la gouvernance (TSCG)</span> s'applique depuis le <span class="kb-fact">1er janvier 2013</span>, avec un pacte budgétaire liant <span class="kb-fact">22 des 25 États signataires</span>. Une résolution du Parlement du <span class="kb-fact">11 juillet 2023</span> a plaidé pour un recours accru aux clauses passerelles afin de basculer vers la méthode communautaire.</p>`},

{section:"Institutions, droit et budget", title:`La procédure budgétaire de l'UE`, body:`
<p><b>De quoi s'agit-il</b> La procédure budgétaire encadre l'adoption du budget annuel de l'Union européenne, négocié chaque année entre les institutions dans le cadre du <span class="kb-fact">cadre financier pluriannuel 2021-2027</span>.</p><p><b>Base juridique et acteurs</b> Elle repose sur l'<span class="kb-fact">article 314 du traité sur le fonctionnement de l'UE (TFUE)</span>. La <span class="kb-fact">Commission européenne</span> présente le projet de budget, tandis que le <span class="kb-fact">Parlement européen</span> et le <span class="kb-fact">Conseil</span> forment ensemble l'autorité budgétaire qui l'adopte. Depuis le <span class="kb-fact">traité de Lisbonne (2009)</span>, le Parlement dispose d'un pouvoir de codécision à égalité avec le Conseil sur l'ensemble du budget, alors qu'auparavant sa marge de manoeuvre était limitée selon les catégories de dépenses. Point souvent testé en QCM : retenir que Lisbonne a mis fin à la distinction entre dépenses obligatoires et non obligatoires dans la procédure budgétaire.</p>`},

{section:"Institutions, droit et budget", title:`Parlement européen : contexte historique`, body:`
<p><b>D'assemblée désignée à parlement élu</b> Le Parlement européen est passé d'une assemblée de membres désignés à un parlement élu au suffrage universel direct, exerçant des pouvoirs législatifs et de contrôle croissants au fil des traités successifs (<span class="kb-fact">Luxembourg 1970</span>, <span class="kb-fact">Acte unique 1986</span>, <span class="kb-fact">Maastricht 1992</span>, <span class="kb-fact">Amsterdam 1997</span>, <span class="kb-fact">Nice 2001</span>, <span class="kb-fact">Lisbonne 2007</span>). Ses pouvoirs sont aujourd'hui encadrés par l'<span class="kb-fact">article 14 du traité sur l'Union européenne (TUE)</span>.</p>
<p><b>Repères chronologiques</b> Première session à <span class="kb-fact">Strasbourg le 19 mars 1958</span> (142 membres), premières élections au suffrage direct les <span class="kb-fact">7-10 juin 1979</span>. La réforme de Nice (2004) a fixé un maximum de <span class="kb-fact">732 députés</span>. Après le <span class="kb-fact">Brexit (1er février 2020)</span>, le nombre de sièges est passé à <span class="kb-fact">750</span>. La <span class="kb-fact">10e législature</span>, élue les <span class="kb-fact">6-9 juin 2024</span>, compte <span class="kb-fact">720 députés</span>.</p>`},

{section:"Institutions, droit et budget", title:`Les compétences de la Cour de justice de l'Union européenne`, body:`
<p><b>Structure et rôle.</b> La <span class="kb-fact">Cour de justice de l'Union européenne (CJUE)</span> comprend deux juridictions, la Cour de justice et le Tribunal, prévues par <span class="kb-fact">l'article 19 du traité UE</span> et les <span class="kb-fact">articles 251 à 281 du traité FUE</span>. Elle veille au respect du droit de l'Union : recours en manquement contre un État membre (<span class="kb-fact">articles 258 à 260 TFUE</span>), recours en annulation ou en carence contre un acte ou une inaction d'une institution (<span class="kb-fact">articles 263 à 265 TFUE</span>), et renvoi préjudiciel à la demande d'une juridiction nationale (<span class="kb-fact">article 267 TFUE</span>). Le Tribunal statue en première instance sur les recours en annulation, en carence et en dommages, sauf ceux émanant des États membres ou des institutions.</p><p><b>Jurisprudence et Parlement.</b> Trois arrêts fondateurs ont construit l'ordre juridique de l'Union : <span class="kb-fact">van Gend & Loos (5 février 1963)</span> sur l'effet direct, <span class="kb-fact">Costa contre ENEL (15 juillet 1964)</span> sur la primauté du droit de l'Union, et <span class="kb-fact">Internationale Handelsgesellschaft (17 décembre 1970)</span> confirmant cette primauté face aux droits fondamentaux nationaux. Le Parlement européen peut saisir la Cour au titre de l'article 263 et lui demander un avis sur la compatibilité d'un accord international (<span class="kb-fact">article 218, paragraphe 11, TFUE</span>), un point fréquemment testé en QCM.</p>`},

{section:"Institutions, droit et budget", title:`La Banque centrale européenne (BCE)`, body:`
<p><b>Institution et mandat</b> La Banque centrale européenne (BCE) gère l'euro et a pour objectif principal le maintien de la stabilité des prix dans la zone euro, selon l'<span class="kb-fact">article 127 du TFUE</span>. Son indépendance est garantie par l'<span class="kb-fact">article 130 du TFUE</span>, qui interdit aux institutions de l'Union et aux gouvernements nationaux de lui donner des instructions. Depuis <span class="kb-fact">novembre 2014</span>, elle assure aussi la surveillance directe des grandes banques dans le cadre du mécanisme de surveillance unique (MSU).</p><p><b>Organes de décision</b> Le <span class="kb-fact">Conseil des gouverneurs</span> réunit les membres du Directoire et les gouverneurs des banques centrales nationales de la zone euro ; il fixe la politique monétaire. Le <span class="kb-fact">Directoire</span> compte six membres (président, vice-président et quatre autres), nommés par le Conseil européen à la majorité qualifiée après consultation du Parlement européen, pour un mandat de <span class="kb-fact">huit ans</span> non renouvelable.</p>`},

{section:"Institutions, droit et budget", title:`La Cour des comptes européenne`, body:`
<p><b>Rôle</b> La <span class="kb-fact">Cour des comptes européenne (CCE)</span> est l'auditeur externe indépendant de l'UE : elle contrôle la fiabilité des comptes, la légalité des opérations et la bonne gestion financière du budget. Sa base juridique est constituée par les <span class="kb-fact">articles 285 à 287 du TFUE</span> et le <span class="kb-fact">règlement (UE, Euratom) 2024/2509</span>. Créée en <span class="kb-fact">1977</span>, elle est devenue institution à part entière en <span class="kb-fact">1993</span> et siège à <span class="kb-fact">Luxembourg</span>.</p><p><b>Composition et chiffres clés</b> Elle compte <span class="kb-fact">27 membres</span> (un par État membre), nommés pour <span class="kb-fact">6 ans</span> renouvelables, dont un président élu pour <span class="kb-fact">3 ans</span>, organisés en <span class="kb-fact">5 chambres</span> sectorielles. Son rapport annuel, publié avant le <span class="kb-fact">15 novembre</span>, a relevé pour l'exercice <span class="kb-fact">2024</span> un taux d'erreur global de <span class="kb-fact">3,6 %</span> (contre 5,6 % en 2023), un point souvent testé en QCM.</p>`},

{section:"Institutions, droit et budget", title:`Le Comité économique et social européen`, body:`
<p><b>Le Comité économique et social européen (CESE)</b> est un organe consultatif de l'Union européenne basé à Bruxelles. Il représente les intérêts économiques et sociaux de la société civile organisée et joue un rôle de pont entre les institutions européennes et les citoyens.</p><p><b>Composition et fonctionnement :</b> le CESE compte <span class="kb-fact">329 membres</span> répartis entre les États membres selon leur taille (24 pour la France, l'Allemagne et l'Italie, jusqu'à 5 pour Malte), nommés par le Conseil pour un mandat de <span class="kb-fact">cinq ans renouvelable</span>. Les consultations du CESE sont <span class="kb-fact">obligatoires dans certains domaines</span> (politique sociale, agricole, environnementale, transports) et optionnelles dans d'autres. Le Parlement, le Conseil et la Commission peuvent le saisir, et il peut aussi émettre des avis d'initiative. <span class="kb-fact">Le dernier renouvellement date d'octobre 2025</span> pour la période 2025-2030.</p>`},

{section:"Institutions, droit et budget", title:`Le Comité européen des régions (CdR)`, body:`
<p><b>Un organe consultatif régional</b> Le <span class="kb-fact">Comité européen des régions (CdR)</span>, créé en <span class="kb-fact">1994</span> après le traité de Maastricht, représente les autorités régionales et locales auprès du Parlement européen, du Conseil et de la Commission. Sa base juridique se trouve à l'<span class="kb-fact">article 13, paragraphe 4, du TUE</span>, aux <span class="kb-fact">articles 300 et 305 à 307 du TFUE</span>, ainsi qu'au <span class="kb-fact">protocole n2 sur la subsidiarité et la proportionnalité</span>.</p><p><b>Composition et rôle</b> Le CdR compte <span class="kb-fact">329 membres</span> et autant de suppléants, issus des collectivités régionales et locales des États membres, pour un mandat de cinq ans renouvelable (mandat en cours depuis le <span class="kb-fact">26 janvier 2025</span>). Il doit obligatoirement être consulté sur les textes touchant à la cohésion, l'éducation, la santé publique ou les réseaux transeuropéens. Point souvent testé en QCM : le CdR n'a qu'un rôle consultatif, sans pouvoir de décision contraignant.</p>`},

{section:"Institutions, droit et budget", title:`La Banque européenne d'investissement`, body:`
<p><b>Statut et base juridique</b> La <span class="kb-fact">Banque européenne d'investissement (BEI)</span> est l'institution financière de l'Union européenne, créée en <span class="kb-fact">1958</span> par le <span class="kb-fact">traité de Rome</span>. Elle possède la personnalité juridique en vertu des <span class="kb-fact">articles 308 et 309 du traité sur le fonctionnement de l'Union européenne (TFUE)</span> et du <span class="kb-fact">Protocole n°5</span> annexé aux traités.</p><p><b>Mission et gouvernance</b> La BEI finance les priorités de l'Union en levant des fonds sur les marchés financiers plutôt que via le budget de l'UE. Elle est administrée par un <span class="kb-fact">conseil des gouverneurs</span> réunissant les ministres des <span class="kb-fact">27 États membres</span>, ainsi que par un conseil d'administration et un comité de direction. Son siège se trouve à <span class="kb-fact">Luxembourg</span>. En <span class="kb-fact">2024</span>, le groupe BEI a signé un montant record de <span class="kb-fact">89 milliards d'euros</span> de financements, dont <span class="kb-fact">57 %</span> pour le climat et l'environnement.</p>`},

{section:"Institutions, droit et budget", title:`Le Médiateur européen`, body:`
<p><b>Rôle et création</b> Le Médiateur européen enquête sur les cas de mauvaise administration des institutions de l'UE, saisi de sa propre initiative ou sur plainte de citoyens et résidents. L'institution a été créée par le <span class="kb-fact">traité de Maastricht (1992)</span>, sur la base des <span class="kb-fact">articles 20, 24 et 228 du TFUE</span> et de l'<span class="kb-fact">article 43 de la Charte des droits fondamentaux</span>, avec le <span class="kb-fact">règlement (UE, Euratom) 2021/1163</span> comme statut d'exercice. Le mandat correspond à une législature du Parlement européen, renouvelable, et le siège est à <span class="kb-fact">Strasbourg</span>.</p><p><b>Titulaire et chiffres</b> <span class="kb-fact">Teresa Anjinho</span> (Portugal) a été élue le <span class="kb-fact">17 décembre 2024</span> avec <span class="kb-fact">344 voix</span> et a pris ses fonctions le <span class="kb-fact">27 février 2025</span>. Environ un tiers des enquêtes menées entre 2021 et 2023 portaient sur l'accès aux documents. Depuis 2017, un « Prix d'excellence de la bonne administration » est remis tous les deux ans.</p>`},

{section:"Institutions, droit et budget", title:`Le Parlement européen : les pouvoirs`, body:`
<p><b>Base et rôle</b> Les pouvoirs du Parlement européen reposent sur les <span class="kb-fact">articles 223 à 234 et 314 du TFUE</span>. Le Parlement exerce des compétences constitutionnelles, législatives, budgétaires et de contrôle politique. Il doit approuver tout traité d'adhésion d'un nouvel État membre et, depuis le <span class="kb-fact">traité de Lisbonne</span>, peut lui-même demander une révision des traités.</p><p><b>Législation et contrôle</b> La procédure de codécision est devenue la <span class="kb-fact">procédure législative ordinaire</span>, plaçant le Parlement à égalité avec le Conseil sur <span class="kb-fact">plus de quarante domaines</span> politiques. Le Parlement partage l'autorité budgétaire avec le Conseil et approuve le <span class="kb-fact">cadre financier pluriannuel (CFP)</span>. Côté contrôle, il approuve le président de la Commission, auditionne les commissaires désignés (pratique instaurée en <span class="kb-fact">1994</span>), peut voter une motion de censure à la <span class="kb-fact">majorité des deux tiers des suffrages exprimés</span>, représentant aussi la majorité de ses membres, et créer des commissions d'enquête temporaires. Son droit d'initiative reste limité : il ne peut que demander à la Commission de présenter une proposition, sauf exceptions.</p>`},

{section:"Institutions, droit et budget", title:`Le Parlement européen : organisation et fonctionnement`, body:`
<p><b>Structure et base juridique</b> Le fonctionnement du Parlement européen repose sur l'<span class="kb-fact">article 14 du traité sur l'Union européenne</span> et sur plusieurs articles du traité FUE (<span class="kb-fact">articles 223, 224, 226, 229, 231 et 232</span>), complétés par son règlement intérieur. Pour la législature <span class="kb-fact">2024-2029</span>, il compte un maximum de <span class="kb-fact">720 députés</span> issus des <span class="kb-fact">27 États membres</span>, avec une répartition dégressive : l'<span class="kb-fact">Allemagne</span> détient le plafond de <span class="kb-fact">96 sièges</span>, tandis que <span class="kb-fact">Chypre, le Luxembourg et Malte</span> ont le minimum de <span class="kb-fact">6 sièges</span> chacun.</p><p><b>Organisation interne</b> Le travail parlementaire s'appuie sur <span class="kb-fact">22 commissions permanentes</span> et <span class="kb-fact">48 délégations</span>, ainsi que sur des groupes politiques transnationaux, chacun devant réunir au moins <span class="kb-fact">23 députés</span> issus d'un quart des États membres. Point souvent testé en QCM : la répartition géographique des sièges, avec les sessions plénières mensuelles à <span class="kb-fact">Strasbourg</span>, les commissions à <span class="kb-fact">Bruxelles</span> et le secrétariat général à <span class="kb-fact">Luxembourg</span>.</p>`},

{section:"Institutions, droit et budget", title:`Le Parlement européen : procédure électorale`, body:`
<p><b>Une élection à double niveau</b> Les députés européens sont élus au suffrage universel direct selon des règles communes fixées au niveau de l'UE, complétées par le droit électoral de chaque État membre pour les modalités pratiques. La base juridique combine l'<span class="kb-fact">article 14 du traité sur l'Union européenne</span>, les <span class="kb-fact">articles 20, 22 et 223 du TFUE</span>, l'<span class="kb-fact">article 39 de la Charte des droits fondamentaux</span> et l'<span class="kb-fact">Acte électoral de 1976</span> modifié. Le scrutin repose sur le principe de la <span class="kb-fact">représentation proportionnelle</span>, et le mandat de député européen est incompatible avec certaines autres fonctions (nationales ou européennes).</p><p><b>Rythme et chiffres clés</b> Les élections ont lieu tous les <span class="kb-fact">cinq ans</span>, sur une période commune allant du jeudi au dimanche suivant selon les États membres. Depuis <span class="kb-fact">2024</span>, le Parlement compte <span class="kb-fact">720 sièges</span>. Les dernières élections se sont tenues du <span class="kb-fact">6 au 9 juin 2024</span>. Toute réforme de la procédure électorale doit être proposée par le Parlement puis adoptée à l'unanimité par le Conseil.</p>`},

{section:"Institutions, droit et budget", title:`Parlement européen et parlements nationaux`, body:`
<p><b>Un contrôle démocratique partagé</b> Le Parlement européen entretient une coopération structurée avec les parlements nationaux afin de renforcer le contrôle démocratique sur la législation de l'<span class="kb-fact">Union européenne</span>. Cette relation repose sur les <span class="kb-fact">articles 10 et 12 du traité sur l'Union européenne (TUE)</span> ainsi que sur les <span class="kb-fact">protocoles n°1 et n°2</span> annexés aux traités, ce dernier organisant le contrôle du principe de subsidiarité.</p><p><b>Des outils concrets d'échange</b> La coopération s'appuie sur la <span class="kb-fact">COSAC</span> (conférence des organes parlementaires spécialisés dans les affaires de l'Union, créée en <span class="kb-fact">1989</span>), sur la plateforme d'échange d'informations <span class="kb-fact">IPEX</span>, et sur le <span class="kb-fact">mécanisme d'alerte précoce</span> permettant aux parlements nationaux d'émettre, dans un délai de <span class="kb-fact">huit semaines</span>, un avis motivé en cas de doute sur le respect de la subsidiarité (carton jaune).</p>`},

{section:"Institutions, droit et budget", title:`Le Conseil européen`, body:`
<p><b>Rôle</b> Le <span class="kb-fact">Conseil européen</span> réunit les chefs d'État ou de gouvernement des <span class="kb-fact">27</span> États membres, avec le président de la Commission (sans droit de vote). Il donne les impulsions nécessaires au développement de l'Union et définit ses orientations politiques générales, mais n'exerce pas de fonction législative. Base juridique : <span class="kb-fact">articles 13 et 15 du traité UE</span> (composition et fonctions), complétés par les <span class="kb-fact">articles 26, 27 et 42 TUE</span> pour la politique étrangère et de sécurité.</p><p><b>Fonctionnement</b> Le Conseil européen se réunit au moins <span class="kb-fact">quatre fois par an</span> et décide en principe par consensus. Son président actuel est <span class="kb-fact">António Costa</span> (depuis le <span class="kb-fact">1er décembre 2024</span>), pour un mandat de <span class="kb-fact">deux ans et demi</span> renouvelable une fois. Institutionnalisé par le <span class="kb-fact">traité de Lisbonne</span>, il existe depuis le premier sommet européen de <span class="kb-fact">1961</span> ; à ne pas confondre avec le Conseil de l'UE (ministres) ni le Conseil de l'Europe.</p>`},

{section:"Institutions, droit et budget", title:`Le Conseil de l'Union européenne`, body:`
<p><b>Rôle et base juridique</b> Le Conseil de l'Union européenne représente les États membres au niveau ministériel et coadopte la législation avec le <span class="kb-fact">Parlement européen</span>, sur la base de l'<span class="kb-fact">article 16 du traité sur l'Union européenne</span> et des <span class="kb-fact">articles 237 à 243 du traité sur le fonctionnement de l'UE</span>. Il exerce aussi l'autorité budgétaire conjointement avec le Parlement, conclut des accords internationaux, procède à des nominations institutionnelles et coordonne les politiques économiques des États membres. Sa présidence tourne tous les six mois entre États membres, sauf pour la formation Affaires étrangères, présidée en permanence par le Haut représentant.</p><p><b>Fonctionnement</b> Le Conseil compte actuellement <span class="kb-fact">dix formations</span> et décide selon trois modes : la <span class="kb-fact">majorité simple</span> (14 États membres sur 27), la <span class="kb-fact">majorité qualifiée</span> (par défaut, au moins 55 % des États membres représentant au moins 65 % de la population), et l'<span class="kb-fact">unanimité</span>, requise notamment pour la fiscalité, la politique étrangère et de sécurité commune (PESC), l'adhésion de nouveaux États et la révision des traités. Point souvent testé en QCM : distinguer le Conseil de l'UE (ministres, législation) du Conseil européen (chefs d'État ou de gouvernement, orientations politiques, article 15 du traité UE).</p>`},

{section:"Institutions, droit et budget", title:`La Commission européenne`, body:`
<p><b>Role et base juridique.</b> La Commission européenne est l'organe exécutif de l'UE, chargé de proposer la législation, de veiller à l'application des traités et du droit de l'Union, de gérer le budget et de négocier les accords internationaux. Son statut est fixé par l'<span class="kb-fact">article 17 du traité sur l'Union européenne</span> et par les articles <span class="kb-fact">234, 244 à 250 et 290-291 du TFUE</span>, dans la continuité du <span class="kb-fact">traité de fusion de 1965</span>.</p><p><b>Composition actuelle.</b> La Commission <span class="kb-fact">von der Leyen II (2024-2029)</span> a reçu l'approbation du Parlement européen le <span class="kb-fact">27 novembre 2024</span> et a pris ses fonctions le <span class="kb-fact">1er décembre 2024</span>. Elle compte <span class="kb-fact">27 membres</span>, un par État membre, nommés pour un mandat de <span class="kb-fact">5 ans renouvelable</span>, et s'appuie sur une administration organisée en <span class="kb-fact">directions générales</span> et agences exécutives.</p>`},

{section:"Institutions, droit et budget", title:`La Cour de justice de l'Union européenne (CJUE)`, body:`
<p><b>Rôle et base juridique</b> La CJUE est l'institution judiciaire de l'UE, chargée d'assurer le respect du droit de l'Union. Sa base juridique est <span class="kb-fact">l'article 19 du traité UE</span>, les <span class="kb-fact">articles 251 à 281 du traité FUE</span> et le <span class="kb-fact">protocole n°3</span> sur son statut. Elle comprend deux juridictions : la <span class="kb-fact">Cour de justice</span> (<span class="kb-fact">27 juges</span> et <span class="kb-fact">11 avocats généraux</span>, mandat de <span class="kb-fact">6 ans renouvelable</span>) et le <span class="kb-fact">Tribunal</span> (<span class="kb-fact">54 juges</span>).</p><p><b>Activité et jurisprudence</b> En <span class="kb-fact">2024</span>, la Cour a reçu <span class="kb-fact">920 affaires</span> et en a clôturé <span class="kb-fact">863</span>, tandis que le Tribunal a tranché <span class="kb-fact">922 affaires</span>. La durée moyenne des procédures préjudicielles est de <span class="kb-fact">17,7 mois</span>. L'arrêt fondateur <span class="kb-fact">Costa contre ENEL (1964)</span> a établi le principe de primauté du droit de l'Union sur le droit national, un point classique en QCM.</p>`},

{section:"Institutions, droit et budget", title:`Recettes de l'Union européenne`, body:`
<p><b>Financement du budget</b> Le budget de l'Union est financé par des ressources propres, sans déficit autorisé (<span class="kb-fact">articles 311 et 322 du traité FUE</span>). La ressource <span class="kb-fact">RNB</span> est la principale source, environ <span class="kb-fact">60 à 70 %</span> des recettes, suivie des ressources propres traditionnelles (droits de douane), de la ressource <span class="kb-fact">TVA</span> et, depuis <span class="kb-fact">2021</span>, de la ressource plastique (<span class="kb-fact">0,80 euro/kg</span> de déchets d'emballages plastiques non recyclés). Le plafond des ressources propres est fixé à <span class="kb-fact">1,4 % du RNB</span> de l'Union.</p><p><b>Emprunt exceptionnel</b> La décision <span class="kb-fact">(UE, Euratom) 2020/2053</span> du <span class="kb-fact">14 décembre 2020</span> a autorisé la Commission à emprunter jusqu'à <span class="kb-fact">750 milliards d'euros</span> (prix 2018) pour financer <span class="kb-fact">Next Generation EU</span>. Point souvent testé en QCM : le budget de l'UE doit toujours être en équilibre, aucun déficit n'est permis.</p>`},

{section:"Institutions, droit et budget", title:`Le cadre financier pluriannuel (CFP)`, body:`
<p><b>De quoi s'agit-il</b> Le <span class="kb-fact">cadre financier pluriannuel (CFP)</span> fixe les plafonds de dépenses de l'UE par grande catégorie budgétaire sur une période d'au moins cinq ans, base juridique <span class="kb-fact">article 312 TFUE</span>. Il est adopté par le Conseil à l'unanimité après approbation du Parlement européen, et traduit en règlement, actuellement le <span class="kb-fact">règlement (UE, Euratom) 2020/2093</span> du <span class="kb-fact">17 décembre 2020</span> couvrant <span class="kb-fact">2021-2027</span>.</p><p><b>Chiffres à retenir</b> Le CFP 2021-2027 s'élève à <span class="kb-fact">1 074,3 milliards d'euros</span> (prix 2018), complété par l'instrument de relance <span class="kb-fact">NextGenerationEU</span> de <span class="kb-fact">750 milliards d'euros</span> (subventions <span class="kb-fact">390 Md€</span>, prêts <span class="kb-fact">360 Md€</span>), adopté le <span class="kb-fact">14 décembre 2020</span>. Les dépenses sont structurées en sept rubriques. La Commission a présenté ses propositions pour le prochain CFP <span class="kb-fact">2028-2034</span> (<span class="kb-fact">1 763 milliards d'euros</span>, réduites à quatre rubriques) le <span class="kb-fact">16 juillet 2025</span>.</p>`},

{section:"Institutions, droit et budget", title:`L'Exécution du Budget`, body:`
<p><b>Définition et objectif.</b> L'exécution du budget de l'Union européenne désigne l'ensemble des règles et procédures garantissant que les fonds publics sont dépensés conformément aux règles de conformité et de performance. Elle repose sur trois principes de bonne gestion financière : l'économie (meilleur prix), l'efficience (meilleur rapport moyens-objectifs) et l'efficacité (réalisation des objectifs).</p><p><b>Modes et contrôle.</b> Le budget s'exécute selon trois modes : <span class="kb-fact">20 % en gestion directe</span> (Commission ou agences), <span class="kb-fact">70 % en gestion partagée</span> (États membres) et <span class="kb-fact">10 % en gestion indirecte</span> (organismes tiers ou pays tiers). Le Parlement européen détermine le budget annuel sur un pied d'égalité avec le Conseil et demeure l'autorité unique de décharge. La <span class="kb-fact">Cour des comptes européenne</span> vérifie la fiabilité, la légalité et la régularité des dépenses. Fondement juridique : <span class="kb-fact">articles 290, 291 et 317-323 du TFUE</span>, <span class="kb-fact">règlement (UE, Euratom) 2024/2509</span>.</p>`},

{section:"Institutions, droit et budget", title:`Contrôle budgétaire dans l'Union européenne`, body:`
<p><b>Objectif et structure.</b> Le contrôle budgétaire garantit que les fonds de l'UE sont levés et dépensés légalement, avec exactitude et efficience. Il s'exerce à trois niveaux : national (États membres), institutionnel (chaque institution), et externe (<span class="kb-fact">Cour des comptes européenne</span>). Le <span class="kb-fact">Parlement européen</span> exerce le contrôle politique via la procédure de décharge.</p>

<p><b>Fondements et cas remarquables.</b> <span class="kb-fact">Traité sur le fonctionnement de l'UE</span> (<span class="kb-fact">articles 287, 317-319, 322, 325</span>), <span class="kb-fact">Règlement financier 2024/2509</span>. La décharge est votée par le Parlement sur l'exécution budgétaire de l'année <span class="kb-fact">n-2</span>. Exemple : en <span class="kb-fact">1998</span>, refus de décharge du Parlement à la Commission pour l'exercice 1996, suivi d'un rapport d'experts independants et de la démission de la Commission en <span class="kb-fact">1999</span>.</p>`},

{section:"Institutions, droit et budget", title:`Lutte contre la fraude et protection des intérêts financiers de l'UE`, body:`
<p><b>Lutte contre la fraude et protection des intérêts financiers</b> La protection des intérêts financiers de l'Union repose sur deux piliers : l'exécution correcte du budget et la prévention des activités frauduleuses. L'<span class="kb-fact">OLAF (Office européen de lutte antifraude)</span>, créé en <span class="kb-fact">1999</span>, enquête sur la fraude et la corruption affectant le budget. Le <span class="kb-fact">Parquet européen</span>, créé par un règlement adopté en <span class="kb-fact">octobre 2017</span> (base : article 86 du traité FUE) et entré en fonction en <span class="kb-fact">juin 2021</span>, dispose de compétences exclusives pour enquêter et poursuivre les infractions contre le budget de l'UE, avec <span class="kb-fact">24 Etats membres participants</span>.</p><p><b>Outils opérationnels</b> Le <span class="kb-fact">CESOP</span> (système électronique central sur les paiements) est opérationnel depuis le <span class="kb-fact">1er janvier 2024</span> et sert au contrôle de la TVA sur les paiements transfrontières. L'<span class="kb-fact">EDES</span> (système de détection rapide et d'exclusion), lancé en <span class="kb-fact">2016</span>, identifie les acteurs non fiables demandant des fonds de l'UE, tandis qu'<span class="kb-fact">Arachne</span> est un outil d'exploration de données qui détecte les risques de fraude et les conflits d'intérêts.</p>`},

{section:"Institutions, droit et budget", title:`Marchés publics dans l'UE`, body:`
<p><b>Marchés publics</b> : achats de travaux, de fournitures ou de services par les pouvoirs publics. Ils représentent environ <span class="kb-fact">14 % du PIB de l'UE</span>. Le cadre juridique, fondé sur les articles du <span class="kb-fact">TFUE</span> relatifs au marché intérieur, impose l'égalité de traitement, la transparence et l'ouverture à la concurrence.</p>

<p>Le <span class="kb-fact">paquet législatif de 2014</span> (trois directives : règles générales, secteurs spéciaux comme l'eau ou l'énergie, et concessions) a généralisé le critère de l'<span class="kb-fact">offre économiquement la plus avantageuse</span> (rapport qualité-prix), permettant d'intégrer des critères environnementaux et sociaux au-delà du seul prix. L'instrument <span class="kb-fact">IMPI</span>, signé en <span class="kb-fact">juin 2022</span>, vise à garantir un accès réciproque aux marchés publics internationaux pour les entreprises de l'UE.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Le droit des sociétés`, body:`
<p><b>De quoi s'agit-il</b> Le droit des sociétés de l'UE encadre la création, le fonctionnement et la mobilité des entreprises dans le marché intérieur. Il est partiellement harmonisé par la <span class="kb-fact">directive (UE) 2017/1132</span>, qui codifie plusieurs textes antérieurs, tandis que chaque État membre conserve ses propres règles nationales complémentaires. La base juridique se trouve aux <span class="kb-fact">articles 49, 50 paragraphe 2 point g, et 54 du traité FUE</span> (liberté d'établissement).</p><p><b>Chiffres clés</b> L'Union compte environ <span class="kb-fact">24 millions d'entreprises</span>, dont environ <span class="kb-fact">80 %</span> sont des sociétés à responsabilité limitée, elles-mêmes constituées à <span class="kb-fact">98 à 99 %</span> de PME. Le capital minimum exigé diffère selon la forme juridique : <span class="kb-fact">25 000 euros</span> pour une société anonyme classique contre <span class="kb-fact">120 000 euros</span> pour une société européenne (SE). Le Parlement européen et le Conseil adoptent conjointement la législation, sur proposition de la Commission européenne.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Propriété intellectuelle, industrielle et commerciale`, body:`
<p><b>Propriété intellectuelle</b> désigne l'ensemble des droits exclusifs sur les créations intellectuelles. L'Union européenne dispose de compétences explicites en la matière depuis <span class="kb-fact">2009</span> (entrée en vigueur du traité FUE), fondées sur les articles <span class="kb-fact">114 et 118 du traité FUE</span>. Elle se divise en propriété industrielle (inventions, marques, dessins et modèles) et droits d'auteur (œuvres littéraires et artistiques).</p><p><b>Système européen</b> parallèle aux régimes nationaux. L'<span class="kb-fact">Office de l'Union européenne pour la propriété intellectuelle (EUIPO)</span> administre les marques et dessins ou modèles de l'Union. Le <span class="kb-fact">brevet unitaire européen</span>, délivré par l'Office européen des brevets, est en vigueur depuis le <span class="kb-fact">1er juin 2023</span>. Les importations de marchandises contrefaites dans l'UE représentent environ <span class="kb-fact">85 milliards d'euros</span>, jusqu'à <span class="kb-fact">5 %</span> des importations totales. Directives clés : <span class="kb-fact">2019/790</span> (droit d'auteur) et <span class="kb-fact">2016/943</span> (secrets d'affaires).</p>`},

{section:"Marché intérieur et politiques économiques", title:`Le détachement de travailleurs`, body:`
<p><b>Définition et cadre juridique.</b> Un travailleur détaché est un salarié envoyé par son employeur pour effectuer une prestation de services à titre temporaire dans un autre État membre. Ce droit est régi par les <span class="kb-fact">articles 54 et 56-62 du Traité sur le fonctionnement de l'Union européenne</span>, qui équilibrent la libre prestation de services et la protection des droits sociaux.</p><p><b>Évolution majeure : directive de 2018.</b> La <span class="kb-fact">directive révisée de 2018</span> (entrée en vigueur le <span class="kb-fact">30 juillet 2020</span>) impose l'égalité de rémunération dès le premier jour de détachement et l'application des conventions collectives régionales et sectorielles, et porte le détachement de longue durée à <span class="kb-fact">12 mois</span> (prorogeable de 6 mois), au-dela desquels le droit du travail du pays d'accueil s'applique integralement. L'<span class="kb-fact">Autorité européenne du travail</span>, créée en <span class="kb-fact">2019</span>, veille à l'application des règles via des inspections transfrontières.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Libre circulation des marchandises`, body:`
<p><b>De quoi s'agit-il</b> La libre circulation des marchandises est l'un des piliers du marché intérieur de l'<span class="kb-fact">Union européenne</span>. Elle interdit entre États membres les droits de douane et les restrictions quantitatives, ainsi que les mesures d'effet équivalent, tout en autorisant des exceptions justifiées par l'intérêt public. La base juridique se trouve aux <span class="kb-fact">articles 26 et 28 à 37 du traité FUE</span>, avec l'<span class="kb-fact">article 34</span> pour les mesures d'effet équivalent et l'<span class="kb-fact">article 36</span> pour les dérogations.</p><p><b>Repères utiles pour le QCM</b> Les droits de douane et restrictions quantitatives entre États membres ont été supprimés dès le <span class="kb-fact">1er juillet 1968</span>. Le <span class="kb-fact">Livre blanc de 1985</span> a introduit la "nouvelle approche" de l'harmonisation technique, complétée en <span class="kb-fact">2008</span> par un nouveau cadre législatif sur la surveillance du marché et le marquage CE. Plus récemment, le règlement sur la reconnaissance mutuelle est entré en vigueur le <span class="kb-fact">19 avril 2020</span>, et le règlement de normalisation <span class="kb-fact">(UE) 2022/2480</span> a été adopté le <span class="kb-fact">14 décembre 2022</span>. Une étude de 2019 chiffre l'avantage annuel de cette liberté à <span class="kb-fact">386 milliards d'euros</span>.</p>`},

{section:"Marché intérieur et politiques économiques", title:`La libre circulation des capitaux`, body:`
<p><b>La libre circulation des capitaux</b> est l'une des quatre libertés fondamentales du marché unique de l'Union européenne. Elle permet le mouvement sans restriction des capitaux entre États membres et avec les pays tiers, facilitant les investissements transfrontières et les opérations bancaires. Base juridique : <span class="kb-fact">articles 63 à 66 du traité sur le fonctionnement de l'Union européenne (TFUE)</span>.</p><p>La libéralisation des flux de capitaux s'est effectuée graduellement. La <span class="kb-fact">directive de 1988</span> a supprimé les restrictions au sein de l'UE à partir du <span class="kb-fact">1er juillet 1990</span>, et le <span class="kb-fact">traité de Maastricht</span> l'a élevée au rang de liberté protégée par les traités. Des exceptions existent pour des motifs d'ordre public, de sécurité publique ou de fiscalité et de prudence financière. <span class="kb-fact">Chypre (2013 à 2015) et la Grèce (2015 à 2019)</span> ont temporairement imposé des contrôles de capitaux lors de la crise de la dette souveraine.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Liberté d'établissement et libre prestation de services`, body:`
<p><b>De quoi s'agit-il</b> Ces deux libertés fondamentales du marché intérieur permettent à une entreprise ou un professionnel de s'installer durablement dans un autre <span class="kb-fact">État membre</span> (liberté d'établissement) ou d'y fournir un service de manière temporaire sans s'y établir (libre prestation de services). Elles reposent sur le <span class="kb-fact">traité sur le fonctionnement de l'UE (articles 49 à 62)</span> et ont été précisées par la <span class="kb-fact">directive Services 2006/123/CE</span>, qui simplifie les démarches administratives et interdit les exigences nationales discriminatoires ou injustifiées.</p><p><b>Points à retenir</b> Les services représentent environ <span class="kb-fact">trois quarts</span> du PIB et de l'emploi de l'UE, mais seulement <span class="kb-fact">24 %</span> du commerce intra-UE. La Commission estime qu'une application complète de la directive Services pourrait accroître le PIB de l'UE de <span class="kb-fact">0,5 à 1,5 %</span>. Une nouvelle stratégie pour le marché unique a été adoptée en <span class="kb-fact">2025</span> pour relancer ces libertés.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Reconnaissance mutuelle des qualifications professionnelles`, body:`
<p><b>Objet.</b> La reconnaissance mutuelle des qualifications professionnelles permet aux professionnels qualifiés de s'établir et d'exercer dans un autre État membre, au service du marché unique. Base juridique : <span class="kb-fact">article 53, paragraphe 1, du traité sur le fonctionnement de l'UE</span>.</p><p><b>Cadre.</b> Deux approches coexistent : une approche sectorielle, fondée sur la <span class="kb-fact">directive 2005/36/CE</span> (médecins, dentistes, infirmiers, vétérinaires, sages-femmes, pharmaciens, architectes), modifiée par la <span class="kb-fact">directive 2013/55/UE</span> qui crée la carte professionnelle européenne volontaire ; et une approche générale, avec reconnaissance automatique possible selon une recommandation du Conseil de 2018, le pays d'accueil pouvant exiger une mesure de compensation. En <span class="kb-fact">mai 2025</span>, la Commission a désigné la reconnaissance limitée des qualifications comme un obstacle au marché unique dans sa nouvelle stratégie. En <span class="kb-fact">février 2024</span>, la directive 2024/505 a facilité la reconnaissance des infirmiers diplômés roumains.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Le marché unique numérique`, body:`
<p><b>Définition et base juridique</b> Le marché unique numérique vise à supprimer les obstacles à la libre circulation des biens, services, personnes et capitaux dans l'espace numérique de l'Union. Il repose sur les <span class="kb-fact">articles 4, 26, 27, 114 et 115 du traité sur le fonctionnement de l'Union européenne</span> et couvre l'interopérabilité des données, l'identité numérique et la sécurité des produits.</p><p><b>Impact économique et cadre réglementaire</b> La stratégie lancée en <span class="kb-fact">2015</span> génère environ <span class="kb-fact">177 milliards d'euros par an</span> pour l'économie de l'Union, dont <span class="kb-fact">86,1 milliards pour les communications électroniques</span> et <span class="kb-fact">51,6 milliards pour les données et l'intelligence artificielle</span>. Les textes clés sont le Digital Services Act, le Digital Markets Act, <span class="kb-fact">eIDAS 2.0 (mai 2024)</span>, <span class="kb-fact">le règlement sur l'intelligence artificielle (août 2024)</span> et <span class="kb-fact">le règlement sur les données, ou Data Act (septembre 2025)</span>.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Des communications à des prix abordables pour les entreprises et les consommateurs`, body:`
<p><b>Stratégie numérique de l'Union.</b> Cette fiche couvre la réglementation des télécommunications et la stratégie TIC de l'UE, fondée notamment sur les articles <span class="kb-fact">101-109, 114 et 170-190 du traité FUE</span>. La <span class="kb-fact">Boussole numérique 2030</span> fixe quatre objectifs : compétences numériques, infrastructures sûres et durables (avec un objectif de <span class="kb-fact">20 % de la production mondiale de semi-conducteurs</span> réalisée en Europe d'ici 2030), transformation numérique des entreprises (IA, données, informatique en nuage) et numérisation des services publics.</p><p><b>Mesures clés.</b> Le règlement Itinérance a supprimé les frais d'itinérance le <span class="kb-fact">15 juin 2017</span> et a été prolongé jusqu'en <span class="kb-fact">2032</span>. Le <span class="kb-fact">code des communications électroniques (directive 2018/1972)</span> modernise le cadre des télécoms. La <span class="kb-fact">directive 2022/2380</span> impose le chargeur universel <span class="kb-fact">USB-C</span>, applicable depuis 2024 pour téléphones et tablettes, et à partir de 2026 pour les ordinateurs portables. L'écosystème numérique européen était évalué à environ <span class="kb-fact">1 000 milliards d'euros en 2023, soit 4,7 % du PIB de l'UE</span>.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Marché intérieur de l'énergie`, body:`
<p><b>Le marché intérieur de l'énergie</b> est le cadre de libéralisation et d'intégration des marchés énergétiques de l'UE, fondé sur les <span class="kb-fact">articles 114 et 194 du traité FUE</span>. L'objectif est un marché énergétique intégré et compétitif, garantissant la sécurité d'approvisionnement et la transition climatique.</p><p><b>Réalisations et structure.</b> <span class="kb-fact">Cinq paquets Énergie</span> se sont succédé depuis 1996 ; le troisième (2009) a créé l'<span class="kb-fact">ACER</span> (Agence de coopération des régulateurs de l'énergie), et le plus récent, en <span class="kb-fact">2024</span>, aligne les règles sur l'objectif de réduction de <span class="kb-fact">55 % des émissions de gaz à effet de serre d'ici 2030</span>. Le <span class="kb-fact">Plan REPowerEU (2022)</span>, lancé après l'invasion russe de l'Ukraine, vise à réduire la dépendance aux importations d'énergie russes et à accélérer les renouvelables. Objectifs clés : <span class="kb-fact">15 %</span> d'interconnexion électrique d'ici 2030 et <span class="kb-fact">90 %</span> de remplissage des stocks de gaz avant chaque hiver.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Politique des consommateurs : principes et instruments`, body:`
<p><b>Fondement et champ d'application</b> La politique des consommateurs de l'UE repose sur les articles <span class="kb-fact">4, paragraphe 2, point f), 12, 114 et 169 du TFUE</span> et sur l'article <span class="kb-fact">38 de la Charte des droits fondamentaux</span>, qui garantit un niveau élevé de protection. Elle vise le bon fonctionnement du marché intérieur, une concurrence loyale et des choix de consommation éclairés et durables.</p><p><b>Instruments et priorités actuelles</b> L'action de l'UE combine information des consommateurs, défense de leurs droits et intégration de cette protection dans les autres politiques. L'<span class="kb-fact">Agenda consommateur 2030</span> (novembre 2025) fixe quatre priorités : accès au marché unique, équité numérique, consommation durable et efficacité des contrôles. La <span class="kb-fact">directive sur le droit à la réparation (2024/1799)</span>, entrée en vigueur en <span class="kb-fact">juillet 2024</span>, renforce les droits des consommateurs face à l'obsolescence. Le <span class="kb-fact">réseau des centres européens des consommateurs (CEC)</span> aide à résoudre les litiges transfrontaliers.</p>`},

{section:"Marché intérieur et politiques économiques", title:`La politique de protection des consommateurs`, body:`
<p><b>Protection des consommateurs</b> Politique de l'Union assurant la défense des consommateurs dans tous les États membres. Elle s'appuie sur trois piliers : la santé et la sécurité des produits (dont le système <span class="kb-fact">Safety Gate</span> pour les produits dangereux, entré en vigueur en <span class="kb-fact">décembre 2024</span> via le règlement sur la sécurité générale des produits), la protection des intérêts économiques (commerce électronique, prohibition du géo-blocage, contrats de crédit, pratiques commerciales déloyales) et la défense juridique (règlement des litiges).</p>

<p><b>Base juridique :</b> <span class="kb-fact">articles 4, 12, 114 et 169</span> du Traité sur le fonctionnement de l'Union européenne. Commission parlementaire responsable : <span class="kb-fact">IMCO</span> (marché intérieur et protection des consommateurs).</p>`},

{section:"Marché intérieur et politiques économiques", title:`Les droits des passagers`, body:`
<p><b>Protection harmonisée des droits des passagers</b> L'Union européenne a établi un cadre unifié protégeant les droits des passagers dans tous les modes de transport : aérien, ferroviaire, maritime et par autobus. Ce domaine repose sur trois principes : égalité de traitement sans discrimination, information claire et en temps utile, et assistance appropriée en cas de perturbation.</p>

<p><b>Réglementation progressive et indemnisations</b> Les droits ont été étendus progressivement : <span class="kb-fact">2004</span> pour l'aérien (règlement CE 261/2004), <span class="kb-fact">2010</span> pour le maritime, <span class="kb-fact">2011</span> pour l'autobus, <span class="kb-fact">2021</span> pour le ferroviaire (règlement recast). Pour les vols annulés ou refus d'embarquement, les indemnisations s'échelonnent selon la distance : <span class="kb-fact">250 EUR</span> jusqu'à 1 500 km, <span class="kb-fact">400 EUR</span> de 1 500 à 3 500 km, <span class="kb-fact">600 EUR</span> au-delà. La <span class="kb-fact">Cour de justice de l'UE</span> joue un rôle déterminant dans l'interprétation de ces textes, notamment sur les retards de trois heures ou plus.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Santé publique`, body:`
<p><b>Politique de santé publique de l'Union européenne.</b> Elle vise à protéger et améliorer la santé des citoyens et repose sur <span class="kb-fact">les articles 168, 114 et 153 du traité FUE</span>, avec une approche transversale intégrant la santé dans toutes les politiques (article 9 et article 168, paragraphe 1, FUE).</p><p><b>Priorités actuelles.</b> Le <span class="kb-fact">programme L'UE pour la santé (2021-2027)</span> a été adopté en réponse à la pandémie de COVID-19. Parmi les initiatives clés figurent le <span class="kb-fact">plan européen pour vaincre le cancer</span> (février 2021) et l'initiative <span class="kb-fact">Vivre ensemble en bonne santé</span> sur les maladies non transmissibles (décembre 2021). <span class="kb-fact">Le cancer est la deuxième cause de décès</span> dans l'Union. Les agences <span class="kb-fact">EMA, ECDC et HERA</span> soutiennent la préparation aux crises sanitaires.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Médicaments et dispositifs médicaux`, body:`
<p><b>Réglementation européenne des médicaments et dispositifs médicaux</b> L'Union européenne autorise et surveille les médicaments et dispositifs médicaux sur la base de la <span class="kb-fact">Directive 2001/83/CE</span> et du <span class="kb-fact">Règlement (CE) n° 726/2004</span>, fondés sur les <span class="kb-fact">articles 168 et 114 du traité sur le fonctionnement de l'Union européenne</span>. Depuis <span class="kb-fact">1995</span>, l'<span class="kb-fact">Agence européenne des médicaments (EMA)</span> centralise les évaluations des demandes d'autorisation.</p><p><b>Domaines réglementaires clés</b> L'UE encadre les médicaments orphelins pour les maladies rares affectant moins de <span class="kb-fact">5 personnes sur 10 000</span>, les essais cliniques via le <span class="kb-fact">Règlement (UE) n° 536/2014 en vigueur depuis janvier 2022</span>, et les médicaments de thérapie innovante. Le <span class="kb-fact">paquet pharmaceutique</span> a été publié en <span class="kb-fact">avril 2023</span> pour renforcer la politique pharmaceutique de l'Union.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Sécurité des aliments`, body:`
<p><b>Cadre et base juridique</b> La sécurité des aliments relève des <span class="kb-fact">articles 43, 114 et 168(4)</span> du traité sur le fonctionnement de l'UE. La politique a été réformée en profondeur en <span class="kb-fact">2002</span>, apres les crises de l'<span class="kb-fact">encéphalopathie spongiforme bovine</span> et du <span class="kb-fact">scandale de la dioxine</span>. La législation générale s'appuie sur le <span class="kb-fact">règlement (CE) n° 178/2002</span>, qui institue l'<span class="kb-fact">Autorité européenne de sécurité des aliments (EFSA)</span>, chargée d'évaluer les risques.</p>

<p><b>Champs d'application</b> L'hygiène des denrées est encadrée par les <span class="kb-fact">règlements (CE) n° 852/2004 et 853/2004</span>. D'autres textes couvrent les contaminants, les matériaux en contact avec les aliments, l'étiquetage et les contrôles officiels. La stratégie <span class="kb-fact">« De la ferme a la table »</span> a intégré cette politique au Pacte vert pour l'Europe en 2020.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Politique sociale et de l'emploi : principes généraux`, body:`
<p><b>Cadre de la politique sociale et de l'emploi de l'Union</b> Cette politique repose sur l'<span class="kb-fact">article 3 du traité UE</span> et les <span class="kb-fact">articles 9, 10, 19, 45 à 48 et 145 à 161 du traité FUE</span>, avec pour objectifs le plein emploi, le progrès social, la protection sociale et la lutte contre l'exclusion. Le <span class="kb-fact">socle européen des droits sociaux</span>, proclamé en <span class="kb-fact">2017</span> au sommet de Göteborg, en est la référence : <span class="kb-fact">20 principes</span> répartis en trois catégories (égalité des chances, conditions de travail équitables, protection sociale et inclusion).</p>
<p><b>Objectifs et directives recentes</b> Le <span class="kb-fact">plan d'action de 2021</span> fixe des cibles pour <span class="kb-fact">2030</span> : au moins <span class="kb-fact">78 % d'emploi</span> (20-64 ans), au moins <span class="kb-fact">60 % d'adultes en formation continue</span> chaque année, et <span class="kb-fact">15 millions</span> de personnes en moins exposées au risque de pauvreté. La <span class="kb-fact">directive 2022/2041</span> encadre les salaires minimaux adéquats, et la <span class="kb-fact">directive 2024/2831</span> (octobre 2024) protège les travailleurs des plateformes numériques.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Le Fonds social européen plus (FSE+)`, body:`
<p><b>Nature et objectifs</b> Le Fonds social européen plus (FSE+) est l'instrument principal de l'Union européenne pour soutenir l'emploi, la mobilité de la main-d'œuvre, l'inclusion sociale et l'éducation. Fondé notamment sur les <span class="kb-fact">articles 46, 149, 153, 164, 175 et 349 du traité sur le fonctionnement de l'UE</span>, il vise des niveaux élevés d'emploi et une protection sociale juste, tout en accompagnant les transitions verte et numérique.</p><p><b>Budget et obligations</b> Pour la période <span class="kb-fact">2021-2027</span>, le FSE+ dispose d'un budget de <span class="kb-fact">99,3 milliards d'euros</span>. Chaque État membre doit consacrer au moins <span class="kb-fact">25 % de son enveloppe</span> à l'inclusion sociale et <span class="kb-fact">3 %</span> à l'aide alimentaire et à l'assistance matérielle aux plus démunis. Sur la période 2014-2020, le Fonds a soutenu en moyenne <span class="kb-fact">10 millions de personnes par an</span> vers l'emploi ou l'acquisition de compétences.</p>`},

{section:"Marché intérieur et politiques économiques", title:`Politique de l'emploi`, body:`
